ทำงานของโค้ดขณะรัน"},{"id":170379671,"n":51,"d":4,"o":"4.4","q":"A DevSecOps team is building a CI/CD pipeline for a cloud-native financial application. The security architect wants to integrate automated security checks to catch vulnerabilities before they reach the staging environment. The team currently runs functional unit tests on each commit and deploys to staging for DAST scanning. What should be the FIRST action to shift security left in this pipeline?","qth":"ทีม DevSecOps กำลังสร้าง CI/CD pipeline สำหรับแอปพลิเคชันการเงินแบบ cloud-native สถาปนิกความมั่นคงปลอดภัยต้องการผสานการตรวจสอบความปลอดภัยอัตโนมัติเพื่อจับช่องโหว่ก่อนถึงสภาพแวดล้อม staging ปัจจุบันทีมรัน functional unit test ทุก commit และ deploy ไป staging เพื่อสแกน DAST การดำเนินการแรก (FIRST) เพื่อ shift security left ใน pipeline นี้ควรเป็นอะไร","a":["Configure Software Composition Analysis to run against the staging environment after deployment to catch dependency vulnerabilities before production release.","Add Static Application Security Testing to the build stage so that source code is analyzed for vulnerabilities on each commit before the build artifact is promoted to staging.","Introduce penetration testing at the staging environment boundary before each production deployment to validate exploitability of identified findings.","Expand DAST coverage by adding authenticated scanning profiles to the existing staging environment tests to detect more runtime vulnerabilities."],"ath":["กำหนดค่า Software Composition Analysis ให้รันกับสภาพแวดล้อม staging หลัง deploy เพื่อจับช่องโหว่ของ dependency ก่อนปล่อย production","เพิ่ม Static Application Security Testing ในขั้น build เพื่อวิเคราะห์ซอร์สโค้ดหาช่องโหว่ทุก commit ก่อน build artifact ถูกเลื่อนไป staging","นำ penetration testing มาใช้ที่ขอบสภาพแวดล้อม staging ก่อน deploy production ทุกครั้ง เพื่อตรวจสอบความสามารถในการถูกโจมตีของข้อค้นพบที่ระบุ","ขยายความครอบคลุม DAST ด้วยการเพิ่มโปรไฟล์การสแกนแบบยืนยันตัวตนในการทดสอบ staging ที่มีอยู่ เพื่อตรวจจับช่องโหว่ขณะรันมากขึ้น"],"ans":"B","exp":"The shift-left principle in DevSecOps means integrating security checks earlier in the pipeline. SAST runs against source code without executing the application, making it suitable for the build stage on each commit before staging. This is earlier and faster than DAST, which already runs at staging. Penetration testing at staging is a validation activity after the build and does not shift security earlier. SCA running at staging is later than the build stage and delays dependency risk detection rather than shifting it left.","expth":"หลัก shift-left ใน DevSecOps หมายถึงการผสานการตรวจสอบความปลอดภัยให้เร็วขึ้นใน pipeline SAST ทำงานกับซอร์สโค้ดโดยไม่ต้องรันแอปพลิเคชัน จึงเหมาะกับขั้น build ทุก commit ก่อน staging ซึ่งเร็วและเร็วกว่า DAST ที่รันที่ staging อยู่แล้ว Penetration testing ที่ staging เป็นกิจกรรมตรวจสอบหลัง build และไม่ได้ shift ความปลอดภัยให้เร็วขึ้น ส่วน SCA ที่รันที่ staging ช้ากว่าขั้น build และทำให้การตรวจพบความเสี่ยง dependency ล่าช้าแทนที่จะเลื่อนไปทางซ้าย"},{"id":170379673,"n":52,"d":4,"o":"4.5","q":"A security analyst is reviewing API audit logs for a cloud-based healthcare application. The logs show that an authenticated user with a valid session token submitted requests for patient records belonging to other users by incrementing a numeric patient ID in the API endpoint URL. The application returned the requested records without error. What API vulnerability does this scenario BEST illustrate?","qth":"นักวิเคราะห์ความมั่นคงปลอดภัยกำลังทบทวน API audit log ของแอปพลิเคชันด้านสุขภาพบนคลาวด์ log แสดงว่าผู้ใช้ที่ยืนยันตัวตนแล้วและมี session token ที่ถูกต้อง ส่งคำขอเรียกเวชระเบียนของผู้ใช้อื่นโดยเพิ่มค่ารหัสผู้ป่วยที่เป็นตัวเลขใน URL ของ API endpoint แอปพลิเคชันคืนระเบียนที่ร้องขอโดยไม่มีข้อผิดพลาด ช่องโหว่ API ใดที่สถานการณ์นี้แสดงให้เห็นได้ดีที่สุด (BEST)","a":["Security misconfiguration, because the API endpoint was not protected by transport layer encryption.","Broken object-level authorization, because the API failed to verify that the requesting user had permission to access the specific patient record object.","Lack of rate limiting, because the attacker was able to submit a high volume of incremental requests without restriction.","Excessive data exposure, because the API returned more data fields than the client application needed to display."],"ath":["Security misconfiguration เพราะ API endpoint ไม่ได้รับการป้องกันด้วยการเข้ารหัสชั้น transport","Broken object-level authorization เพราะ API ไม่ตรวจสอบว่าผู้ร้องขอมีสิทธิ์เข้าถึงออบเจ็กต์เวชระเบียนเฉพาะรายการนั้น","ขาด rate limiting เพราะผู้โจมตีส่งคำขอแบบเพิ่มค่าทีละขั้นจำนวนมากได้โดยไม่มีข้อจำกัด","Excessive data exposure เพราะ API คืนฟิลด์ข้อมูลมากกว่าที่แอปพลิเคชันฝั่งไคลเอนต์ต้องแสดง"],"ans":"B","exp":"Broken object-level authorization occurs when an API accepts a valid session token but does not verify whether that user is permitted to access the specific object referenced in the request. Manipulating a numeric identifier to retrieve another user's record is the defining pattern of this vulnerability. Excessive data exposure involves returning unnecessary fields within a permitted response, not unauthorized access to another user's record. Security misconfiguration describes improper setup, not an authorization logic failure. Rate limiting addresses request volume and does not enforce per-object access permissions.","expth":"Broken object-level authorization เกิดขึ้นเมื่อ API ยอมรับ session token ที่ถูกต้อง แต่ไม่ตรวจสอบว่าผู้ใช้มีสิทธิ์เข้าถึงออบเจ็กต์เฉพาะที่อ้างถึงในคำขอหรือไม่ การเปลี่ยนตัวระบุที่เป็นตัวเลขเพื่อดึงระเบียนของผู้ใช้อื่นเป็นรูปแบบเฉพาะของช่องโหว่นี้ Excessive data exposure คือการคืนฟิลด์ที่ไม่จำเป็นภายในผลลัพธ์ที่ได้รับอนุญาต ไม่ใช่การเข้าถึงระเบียนของผู้ใช้อื่นโดยไม่ได้รับอนุญาต Security misconfiguration อธิบายการตั้งค่าที่ไม่เหมาะสม ไม่ใช่ความล้มเหลวของตรรกะการอนุญาต ส่วน rate limiting จัดการปริมาณคำขอ และไม่บังคับสิทธิ์รายออบเจ็กต์"},{"id":170379675,"n":53,"d":4,"o":"4.5","q":"A development team is integrating an open-source API authentication library into a cloud-native application. The package was located on a third-party site rather than the official project repository, and the team cannot verify whether the package signature matches the published hash. What is the MOST appropriate security action before allowing this library into the production pipeline?","qth":"ทีมพัฒนากำลังผนวกไลบรารียืนยันตัวตน API แบบโอเพนซอร์สเข้ากับแอปพลิเคชัน cloud-native แพ็กเกจถูกพบบนเว็บไซต์ของบุคคลที่สามแทนที่จะเป็น repository อย่างเป็นทางการของโครงการ และทีมตรวจสอบไม่ได้ว่าลายเซ็นของแพ็กเกจตรงกับ hash ที่เผยแพร่หรือไม่ การดำเนินการด้านความมั่นคงปลอดภัยที่เหมาะสมที่สุด (MOST appropriate) ก่อนอนุญาตให้ไลบรารีนี้เข้าสู่ production pipeline คืออะไร","a":["Review the open-source license to confirm it does not impose redistribution obligations that conflict with commercial use.","Check the project's commit history to confirm the library has been actively maintained within the past six months.","Reject the component until it can be sourced from an approved repository and its signature verified against the official published hash.","Run the component through a static analysis tool to confirm there are no known insecure coding patterns before deployment."],"ath":["ทบทวนใบอนุญาตโอเพนซอร์สเพื่อยืนยันว่าไม่กำหนดภาระผูกพันด้านการแจกจ่ายซ้ำที่ขัดกับการใช้เชิงพาณิชย์","ตรวจประวัติ commit ของโครงการเพื่อยืนยันว่าไลบรารีได้รับการดูแลอย่างต่อเนื่องในช่วงหกเดือนที่ผ่านมา","ปฏิเสธองค์ประกอบจนกว่าจะได้จาก repository ที่ได้รับอนุมัติ และตรวจสอบลายเซ็นกับ hash อย่างเป็นทางการที่เผยแพร่","รันองค์ประกอบผ่านเครื่องมือ static analysis เพื่อยืนยันว่าไม่มีรูปแบบการเขียนโค้ดที่ไม่ปลอดภัยที่ทราบก่อน deploy"],"ans":"C","exp":"Provenance and authenticity validation require confirming the component came from a trusted source and that the signature or hash matches the official release. Downloading from an unofficial site with an unverified signature is a classic typosquatting or injection risk. Static analysis checks code quality but cannot confirm the package is what it claims to be. License review is a governance step, not an authenticity control. Maintenance history addresses project health, not source integrity of the package.","expth":"การตรวจสอบ provenance และความถูกต้องแท้จริงต้องยืนยันว่าองค์ประกอบมาจากแหล่งที่เชื่อถือได้ และลายเซ็นหรือ hash ตรงกับ release อย่างเป็นทางการ การดาวน์โหลดจากเว็บไซต์ที่ไม่เป็นทางการโดยไม่มีลายเซ็นที่ตรวจสอบได้เป็นความเสี่ยงคลาสสิกของ typosquatting หรือการฝังโค้ด Static analysis ตรวจคุณภาพโค้ดแต่ยืนยันไม่ได้ว่าแพ็กเกจเป็นสิ่งที่อ้างหรือไม่ การทบทวนใบอนุญาตเป็นขั้นตอน governance ไม่ใช่การควบคุมความถูกต้องแท้จริง ส่วนประวัติการดูแลรักษาบอกสุขภาพของโครงการ ไม่ใช่ความสมบูรณ์ของแหล่งที่มาของแพ็กเกจ"},{"id":170379677,"n":54,"d":4,"o":"4.5","q":"Your organization has contracted with a third-party vendor for a cloud-hosted enterprise application. Three months after deployment, the vendor discloses that their development environment was compromised and that customer data may have been accessed. The security team reviews the contract and finds no provisions addressing vendor breach notification obligations or the organization's remediation rights. What is the PRIMARY concern this scenario illustrates about the software acquisition process?","qth":"องค์กรของคุณทำสัญญากับผู้ขายบุคคลที่สามสำหรับแอปพลิเคชันองค์กรที่โฮสต์บนคลาวด์ สามเดือนหลัง deploy ผู้ขายเปิดเผยว่าสภาพแวดล้อมการพัฒนาของตนถูกเจาะและข้อมูลลูกค้าอาจถูกเข้าถึง ทีมความมั่นคงปลอดภัยทบทวนสัญญาและพบว่าไม่มีข้อกำหนดเกี่ยวกับภาระผูกพันในการแจ้งเหตุละเมิดของผู้ขายหรือสิทธิ์ในการแก้ไขของorganizationฝั่งลูกค้า ข้อกังวลหลัก (PRIMARY) ที่สถานการณ์นี้สะท้อนเกี่ยวกับกระบวนการจัดหาซอฟต์แวร์คืออะไร","a":["The acquisition process failed to include contractual provisions outlining the vendor's responsibilities in the event of a security breach.","The vendor was not evaluated against OWASP ASVS verification levels prior to contract execution.","The organization did not validate open-source components within the vendor's platform before deployment.","The organization failed to perform Software Composition Analysis on the vendor's application before deployment."],"ath":["กระบวนการจัดหาไม่ได้ใส่ข้อกำหนดในสัญญาที่ระบุความรับผิดชอบของผู้ขายในกรณีเกิดเหตุละเมิดความมั่นคงปลอดภัย","ผู้ขายไม่ได้รับการประเมินตามระดับการตรวจสอบ OWASP ASVS ก่อนลงนามในสัญญา","องค์กรไม่ได้ตรวจสอบองค์ประกอบโอเพนซอร์สภายในแพลตฟอร์มของผู้ขายก่อน deploy","องค์กรไม่ได้ทำ Software Composition Analysis กับแอปพลิเคชันของผู้ขายก่อน deploy"],"ans":"A","exp":"Vendor vetting must include contractual provisions defining the vendor's obligations in the event of a security breach, including notification timelines and the acquiring organization's remediation rights. The contract's silence on these points is the direct failure the scenario illustrates. Software Composition Analysis addresses component-level vulnerabilities in libraries and does not establish contractual accountability. OWASP ASVS verification applies to the application's technical security posture, not the vendor's breach response obligations. Open-source component validation is a separate pre-deployment activity unrelated to breach notification and remediation rights.","expth":"การตรวจสอบผู้ขาย (vendor vetting) ต้องรวมข้อกำหนดในสัญญาที่ระบุภาระผูกพันของผู้ขายเมื่อเกิดเหตุละเมิด รวมถึงกรอบเวลาการแจ้งเหตุและสิทธิ์ในการแก้ไขขององค์กรผู้จัดหา การที่สัญญาไม่กล่าวถึงประเด็นเหล่านี้คือความล้มเหลวโดยตรงที่สถานการณ์แสดงให้เห็น Software Composition Analysis จัดการช่องโหว่ระดับองค์ประกอบในไลบรารี ไม่ได้สร้างความรับผิดชอบตามสัญญา OWASP ASVS ใช้กับท่าทีความปลอดภัยทางเทคนิคของแอปพลิเคชัน ไม่ใช่ภาระผูกพันในการตอบสนองเหตุละเมิดของผู้ขาย ส่วนการตรวจสอบองค์ประกอบโอเพนซอร์สเป็นกิจกรรมก่อน deploy ที่แยกต่างหากและไม่เกี่ยวกับการแจ้งเหตุละเมิดและสิทธิ์ในการแก้ไข"},{"id":170379679,"n":55,"d":4,"o":"4.5","q":"A cloud security team is conducting a security review of a newly acquired SaaS application. The application includes several open-source libraries, one of which has not been updated in 18 months. The team needs to identify whether any included third-party components contain known vulnerabilities. What is the MOST appropriate tool or technique to address this concern?","qth":"ทีมความมั่นคงปลอดภัยคลาวด์กำลังทบทวนความปลอดภัยของแอปพลิเคชัน SaaS ที่เพิ่งจัดหา แอปพลิเคชันมีไลบรารีโอเพนซอร์สหลายตัว ตัวหนึ่งไม่มีการอัปเดตมา 18 เดือน ทีมต้องระบุว่าองค์ประกอบบุคคลที่สามใดมีช่องโหว่ที่ทราบหรือไม่ เครื่องมือหรือเทคนิคที่เหมาะสมที่สุด (MOST appropriate) เพื่อจัดการข้อกังวลนี้คืออะไร","a":["Conduct a vendor risk assessment to evaluate the SaaS vendor's overall security posture and patch management history.","Use Software Composition Analysis to identify all third-party components and evaluate them against known vulnerability databases.","Review the vendor's ISO 27001 certification to confirm that their development practices meet established security standards.","Perform static application security testing to analyze the application's source code for vulnerable coding patterns."],"ath":["ทำ vendor risk assessment เพื่อประเมินท่าทีความปลอดภัยโดยรวมและประวัติการจัดการ patch ของผู้ขาย SaaS","ใช้ Software Composition Analysis เพื่อระบุองค์ประกอบบุคคลที่สามทั้งหมดและประเมินเทียบกับฐานข้อมูลช่องโหว่ที่ทราบ","ทบทวนใบรับรอง ISO 27001 ของผู้ขาย เพื่อยืนยันว่าแนวปฏิบัติการพัฒนาตรงตามมาตรฐานความปลอดภัยที่กำหนด","ทำ static application security testing เพื่อวิเคราะห์ซอร์สโค้ดหารูปแบบการเขียนโค้ดที่มีช่องโหว่ของแอปพลิเคชัน"],"ans":"B","exp":"Software Composition Analysis inventories all third-party and open-source components within a software package and evaluates each against known vulnerability databases, making it the correct tool for identifying risk in outdated libraries. A vendor risk assessment evaluates the vendor's organizational security posture broadly but does not scan individual library dependencies for vulnerabilities. Static application security testing analyzes source code for insecure coding patterns but does not inventory third-party components against vulnerability databases. ISO 27001 certification confirms process maturity and does not assess component-level vulnerability status.","expth":"Software Composition Analysis จัดทำบัญชีองค์ประกอบบุคคลที่สามและโอเพนซอร์สทั้งหมดในแพ็กเกจซอฟต์แวร์ และประเมินแต่ละรายการเทียบกับฐานข้อมูลช่องโหว่ที่ทราบ จึงเป็นเครื่องมือที่ถูกต้องสำหรับระบุความเสี่ยงในไลบรารีที่ล้าสมัย Vendor risk assessment ประเมินท่าทีความปลอดภัยเชิงองค์กรของผู้ขายในภาพกว้าง แต่ไม่สแกน dependency ของไลบรารีแต่ละตัวหาช่องโหว่ Static application security testing วิเคราะห์ซอร์สโค้ดหารูปแบบการเขียนโค้ดที่ไม่ปลอดภัย แต่ไม่ทำบัญชีองค์ประกอบบุคคลที่สามเทียบกับฐานข้อมูลช่องโหว่ ส่วนใบรับรอง ISO 27001 ยืนยันความเป็นผู้ใหญ่ของกระบวนการ ไม่ได้ประเมินสถานะช่องโหว่ระดับองค์ประกอบ"},{"id":170379681,"n":56,"d":4,"o":"4.6","q":"A cloud security engineer is responsible for securing a microservices-based payment platform that exposes multiple APIs to both internal and external consumers. The organization must enforce consistent authentication, apply rate limiting, and detect malicious traffic patterns across all APIs without requiring each development team to independently implement these controls. The platform must also satisfy an audit requirement for centralized traffic logging. What is the MOST appropriate architectural control to address all of these requirements?","qth":"วิศวกรความมั่นคงปลอดภัยคลาวด์รับผิดชอบรักษาความปลอดภัยแพลตฟอร์มการชำระเงินแบบ microservices ที่เปิด API หลายตัวให้ผู้ใช้ทั้งภายในและภายนอก องค์กรต้องบังคับใช้การยืนยันตัวตนที่สอดคล้องกัน ใช้ rate limiting และตรวจจับรูปแบบทราฟฟิกอันตรายทั่วทุก API โดยไม่ต้องให้แต่ละทีมพัฒนาติดตั้งมาตรการเหล่านี้เอง แพลตฟอร์มต้องตอบข้อกำหนดการตรวจสอบเรื่อง traffic logging แบบรวมศูนย์ด้วย มาตรการควบคุมเชิงสถาปัตยกรรมที่เหมาะสมที่สุด (MOST appropriate) เพื่อตอบทุกข้อกำหนดเหล่านี้คืออะไร","a":["Deploy a Web Application Firewall in front of the platform perimeter to inspect and filter HTTP traffic before it reaches any API endpoint.","Implement an API gateway to provide centralized authentication enforcement, rate limiting, traffic monitoring, and logging across all APIs.","Require each development team to implement OAuth 2.0 authentication, rate limiting, and logging independently within their respective microservices.","Configure network security groups to restrict API access by IP address and enforce request volume limits at the infrastructure layer."],"ath":["ติดตั้ง Web Application Firewall หน้าขอบเขตแพลตฟอร์มเพื่อตรวจและกรองทราฟฟิก HTTP ก่อนถึง API endpoint ใด ๆ","ติดตั้ง API gateway เพื่อให้การบังคับใช้การยืนยันตัวตน rate limiting การเฝ้าติดตามทราฟฟิก และ logging แบบรวมศูนย์ทั่วทุก API","กำหนดให้แต่ละทีมพัฒนาติดตั้ง OAuth 2.0 authentication, rate limiting และ logging เองภายใน microservice ของตน","กำหนดค่า network security group เพื่อจำกัดการเข้าถึง API ตาม IP address และบังคับขีดจำกัดปริมาณคำขอที่ชั้นโครงสร้างพื้นฐาน"],"ans":"B","exp":"An API gateway acts as a centralized intermediary between clients and backend services, enforcing authentication, applying rate limiting, detecting malicious traffic, and producing audit logs across all APIs from a single control point. Distributing these controls to individual development teams introduces policy inconsistency and audit coverage gaps. A WAF filters HTTP traffic at the perimeter but cannot enforce API-level token validation or centralized policy management. Network security groups operate at the infrastructure layer and cannot perform application-layer authentication or API-specific rate limiting.","expth":"API gateway ทำหน้าที่เป็นตัวกลางแบบรวมศูนย์ระหว่างไคลเอนต์และบริการหลังบ้าน บังคับการยืนยันตัวตน ใช้ rate limiting ตรวจจับทราฟฟิกอันตราย และสร้าง audit log ทั่วทุก API จากจุดควบคุมเดียว การกระจายมาตรการเหล่านี้ให้แต่ละทีมพัฒนาก่อให้เกิดนโยบายไม่สอดคล้องและช่องว่างของการครอบคลุมการตรวจสอบ WAF กรองทราฟฟิก HTTP ที่ขอบเขต แต่ตรวจสอบ token ระดับ API หรือจัดการนโยบายแบบรวมศูนย์ไม่ได้ ส่วน network security group ทำงานที่ชั้นโครงสร้างพื้นฐาน และทำ authentication ระดับแอปพลิเคชันหรือ rate limiting เฉพาะ API ไม่ได้"},{"id":170379683,"n":57,"d":4,"o":"4.7","q":"An organization uses five different SaaS applications, each with its own authentication system. The security team is concerned that MFA policies are applied inconsistently, creating protection gaps. The organization is evaluating Federated Identity Management to address this risk. What is the PRIMARY concern that FIM's centralized identity management addresses in this scenario?","qth":"องค์กรใช้แอปพลิเคชัน SaaS ห้าตัวที่แตกต่างกัน แต่ละตัวมีระบบยืนยันตัวตนของตนเอง ทีมความมั่นคงปลอดภัยกังวลว่านโยบาย MFA ถูกนำไปใช้ไม่สอดคล้องกัน ทำให้เกิดช่องว่างการป้องกัน องค์กรกำลังประเมิน Federated Identity Management (FIM) เพื่อจัดการความเสี่ยงนี้ ข้อกังวลหลัก (PRIMARY) ที่การจัดการ identity แบบรวมศูนย์ของ FIM ตอบในสถานการณ์นี้คืออะไร","a":["FIM reduces the number of SaaS subscriptions required by consolidating applications into a single platform.","FIM eliminates the need for service providers to maintain any access controls, because the identity provider handles all security decisions.","FIM allows security policies such as MFA to be applied consistently across all federated services through a single identity provider.","FIM improves network performance by reducing the number of authentication requests sent across the organization's infrastructure."],"ath":["FIM ลดจำนวนการสมัครใช้ SaaS ที่ต้องมี โดยรวมแอปพลิเคชันเข้าเป็นแพลตฟอร์มเดียว","FIM ขจัดความจำเป็นที่ผู้ให้บริการ (service provider) ต้องมี access control ใด ๆ เพราะ identity provider จัดการการตัดสินใจด้านความปลอดภัยทั้งหมด","FIM ทำให้นโยบายความปลอดภัยอย่าง MFA ถูกนำไปใช้อย่างสอดคล้องกันทั่วทุก federated service ผ่าน identity provider เดียว","FIM ปรับปรุงประสิทธิภาพเครือข่ายโดยลดจำนวนคำขอยืนยันตัวตนที่ส่งผ่านโครงสร้างพื้นฐานขององค์กร"],"ans":"C","exp":"FIM enhances security through centralized identity management. Because authentication is handled by a single IdP, policies such as MFA can be enforced consistently across all federated services, directly resolving the inconsistency risk the scenario describes. FIM does not consolidate or reduce SaaS subscriptions, making that option a fabricated benefit with no basis in the model. Service providers retain their own access controls independently of the IdP, so claiming the IdP handles all security decisions overstates FIM's role. Conflating authentication consolidation with network performance improvement has no basis in how FIM operates.","expth":"FIM เสริมความปลอดภัยผ่านการจัดการ identity แบบรวมศูนย์ เพราะการยืนยันตัวตนถูกจัดการโดย IdP ตัวเดียว นโยบายอย่าง MFA จึงบังคับใช้ได้อย่างสอดคล้องทั่วทุก federated service ซึ่งแก้ความเสี่ยงเรื่องความไม่สอดคล้องที่สถานการณ์อธิบายโดยตรง FIM ไม่ได้รวมหรือลดการสมัครใช้ SaaS ตัวเลือกนั้นเป็นประโยชน์ที่สร้างขึ้นซึ่งไม่มีฐานในแบบจำลองนี้ Service provider ยังคงมี access control ของตนเองแยกจาก IdP การอ้างว่า IdP จัดการการตัดสินใจด้านความปลอดภัยทั้งหมดจึงเกินบทบาทของ FIM และการเอาการรวมศูนย์การยืนยันตัวตนไปปนกับการปรับปรุงประสิทธิภาพเครือข่ายไม่มีฐานในวิธีการทำงานของ FIM"},{"id":170379685,"n":58,"d":4,"o":"4.7","q":"An IT security team discovers that employees are using several cloud file-sharing and productivity applications that were never approved or registered with the IT department. The team has no visibility into which data is being uploaded to these services or whether they meet the organization's security standards. Which CASB pillar MOST directly addresses this problem?","qth":"ทีมความมั่นคงปลอดภัย IT พบว่าพนักงานใช้แอปพลิเคชันแชร์ไฟล์และเพิ่มประสิทธิภาพการทำงานบนคลาวด์หลายตัวที่ไม่เคยได้รับอนุมัติหรือลงทะเบียนกับแผนก IT ทีมไม่มี visibility ว่าข้อมูลใดถูกอัปโหลดไปยังบริการเหล่านี้ หรือบริการเหล่านี้ตรงตามมาตรฐานความปลอดภัยขององค์กรหรือไม่ เสาหลักของ CASB ใดแก้ปัญหานี้ได้ตรงที่สุด (MOST directly)","a":["Threat Protection, because unsanctioned applications represent potential malware entry points.","Visibility, because CASBs discover and monitor all cloud services in use, including shadow IT applications not sanctioned by IT.","Compliance, because the unauthorized applications likely violate regulatory data residency requirements.","Data Security, because sensitive files may be uploaded to unapproved services without encryption controls."],"ath":["Threat Protection เพราะแอปพลิเคชันที่ไม่ได้รับอนุมัติเป็นจุดเข้าของมัลแวร์ที่เป็นไปได้","Visibility เพราะ CASB ค้นหาและเฝ้าติดตามบริการคลาวด์ทั้งหมดที่ใช้อยู่ รวมถึงแอปพลิเคชัน shadow IT ที่ IT ไม่ได้อนุมัติ","Compliance เพราะแอปพลิเคชันที่ไม่ได้รับอนุญาตน่าจะละเมิดข้อกำหนด data residency ตามกฎระเบียบ","Data Security เพราะไฟล์ที่อ่อนไหวอาจถูกอัปโหลดไปยังบริการที่ไม่ได้รับอนุมัติโดยไม่มีการควบคุมการเข้ารหัส"],"ans":"B","exp":"The Visibility pillar directly addresses shadow IT by providing discovery and monitoring of all cloud services in use, whether sanctioned or not. The root problem in this scenario is that the security team does not know which applications employees are using, which is the precise gap Visibility closes. Compliance addresses whether applications meet regulatory requirements, but that analysis cannot begin without first knowing the applications exist. Data Security and Threat Protection address downstream risks that become relevant only after visibility into the environment has been established.","expth":"เสาหลัก Visibility แก้ปัญหา shadow IT โดยตรงด้วยการค้นหาและเฝ้าติดตามบริการคลาวด์ทั้งหมดที่ใช้อยู่ ไม่ว่าจะได้รับอนุมัติหรือไม่ ปัญหารากในสถานการณ์นี้คือทีมความมั่นคงปลอดภัยไม่ทราบว่าพนักงานใช้แอปพลิเคชันใด ซึ่งเป็นช่องว่างที่ Visibility ปิด Compliance เกี่ยวกับว่าแอปพลิเคชันตรงตามข้อกำหนดตามกฎระเบียบหรือไม่ แต่การวิเคราะห์นั้นเริ่มไม่ได้หากไม่ทราบก่อนว่ามีแอปพลิเคชันอยู่ ส่วน Data Security และ Threat Protection จัดการความเสี่ยงปลายทางที่จะเกี่ยวข้องก็ต่อเมื่อมี visibility ต่อสภาพแวดล้อมแล้ว"},{"id":170379687,"n":59,"d":4,"o":"4.7","q":"A security architect is designing identity management for a large enterprise. One requirement is that employees authenticate once and access multiple internal and SaaS applications without re-entering credentials. A second requirement is that a mobile app post updates to a user's corporate social media account on their behalf, without storing the user's password. What is the MOST appropriate protocol selection for each requirement?","qth":"สถาปนิกความมั่นคงปลอดภัยกำลังออกแบบการจัดการ identity สำหรับองค์กรขนาดใหญ่ ข้อกำหนดหนึ่งคือพนักงานยืนยันตัวตนครั้งเดียวแล้วเข้าถึงแอปพลิเคชันภายในและ SaaS หลายตัวได้โดยไม่ต้องกรอกข้อมูลรับรองซ้ำ ข้อกำหนดที่สองคือแอปมือถือโพสต์อัปเดตไปยังบัญชีโซเชียลมีเดียขององค์กรของผู้ใช้แทนผู้ใช้ โดยไม่เก็บรหัสผ่านของผู้ใช้ การเลือกโปรโตคอลที่เหมาะสมที่สุด (MOST appropriate) สำหรับแต่ละข้อกำหนดคืออะไร","a":["Kerberos for the enterprise SSO requirement and OIDC for the delegated mobile app access.","OAuth 2.0 for the enterprise SSO requirement and SAML for the delegated mobile app access.","OIDC for the enterprise SSO requirement and SAML for the delegated mobile app access.","SAML for the enterprise SSO requirement and OAuth 2.0 for the delegated mobile app access."],"ath":["Kerberos สำหรับข้อกำหนด SSO ขององค์กร และ OIDC สำหรับการเข้าถึงแบบมอบสิทธิ์ของแอปมือถือ","OAuth 2.0 สำหรับข้อกำหนด SSO ขององค์กร และ SAML สำหรับการเข้าถึงแบบมอบสิทธิ์ของแอปมือถือ","OIDC สำหรับข้อกำหนด SSO ขององค์กร และ SAML สำหรับการเข้าถึงแบบมอบสิทธิ์ของแอปมือถือ","SAML สำหรับข้อกำหนด SSO ขององค์กร และ OAuth 2.0 สำหรับการเข้าถึงแบบมอบสิทธิ์ของแอปมือถือ"],"ans":"D","exp":"SAML is the dominant protocol in enterprise SSO environments, using XML-based assertions to grant access across multiple applications after a single authentication event. OAuth 2.0 is designed for delegated authorization, allowing one system to act on a user's behalf without storing or transmitting the user's password, which matches the mobile app requirement precisely. Reversing the two protocols applies each to the wrong use case. Pairing OIDC with SAML assigns SAML to delegated access rather than SSO, where it belongs. Kerberos is associated with on-premises environments and is not suited to multi-application SaaS federation.","expth":"SAML เป็นโปรโตคอลหลักในสภาพแวดล้อม SSO ขององค์กร ใช้ assertion แบบ XML เพื่ออนุญาตการเข้าถึงหลายแอปพลิเคชันหลังการยืนยันตัวตนครั้งเดียว OAuth 2.0 ออกแบบมาสำหรับ delegated authorization ให้ระบบหนึ่งกระทำการแทนผู้ใช้โดยไม่เก็บหรือส่งรหัสผ่านของผู้ใช้ ซึ่งตรงกับข้อกำหนดของแอปมือถืออย่างแม่นยำ การสลับโปรโตคอลสองตัวคือการใช้แต่ละตัวผิดกรณี การจับคู่ OIDC กับ SAML กำหนดให้ SAML ทำการเข้าถึงแบบมอบสิทธิ์แทนที่จะเป็น SSO ซึ่งเป็นที่ที่ SAML เหมาะ ส่วน Kerberos สัมพันธ์กับสภาพแวดล้อม on-premises และไม่เหมาะกับ federation SaaS หลายแอปพลิเคชัน"},{"id":170379689,"n":60,"d":4,"o":"4.7","q":"A security engineer discovers that an API key used by a production application was accidentally committed to a public code repository and has been exposed for an unknown period. The key is still valid and could be used to access backend services. The team needs to eliminate the risk that this specific key poses going forward. What is the MOST appropriate action, based on the secrets management lifecycle?","qth":"วิศวกรความมั่นคงปลอดภัยพบว่า API key ที่แอปพลิเคชัน production ใช้ถูก commit เข้า public code repository โดยไม่ตั้งใจ และเปิดเผยมาเป็นเวลาที่ไม่ทราบแน่ชัด key ยังใช้งานได้และอาจถูกใช้เข้าถึงบริการหลังบ้าน ทีมต้องกำจัดความเสี่ยงที่ key เฉพาะตัวนี้ก่อขึ้นต่อจากนี้ การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) ตามวงจรชีวิตการจัดการ secret คืออะไร","a":["Rotate the API key on its next scheduled rotation date to minimize operational disruption while acknowledging the exposure.","Increase monitoring on all services the API key can access so that unauthorized use is detected before further action is taken.","Revoke the exposed API key immediately and replace it with a new one, since revocation addresses keys that are compromised or not safe to use.","Move the API key from the code repository to an environment variable, which removes the storage exposure without invalidating the existing key."],"ath":["หมุนเวียน (rotate) API key ตามวันที่กำหนด rotation ครั้งถัดไป เพื่อลดการหยุดชะงักเชิงปฏิบัติการ ขณะยอมรับว่ามีการเปิดเผยเกิดขึ้น","เพิ่มการเฝ้าติดตามบริการทั้งหมดที่ API key เข้าถึงได้ เพื่อตรวจจับการใช้โดยไม่ได้รับอนุญาตก่อนดำเนินการอื่นต่อ","เพิกถอน (revoke) API key ที่เปิดเผยทันทีและแทนที่ด้วย key ใหม่ เพราะการเพิกถอนใช้กับ key ที่ถูกละเมิดหรือไม่ปลอดภัยที่จะใช้ต่อ","ย้าย API key จาก code repository ไปไว้ใน environment variable ซึ่งกำจัดการเปิดเผยจากตำแหน่งจัดเก็บ โดยไม่ทำให้ key เดิมใช้ไม่ได้"],"ans":"C","exp":"The secrets management lifecycle defines Revocation as the action taken when a secret is compromised or no longer safe. A publicly exposed API key that remains valid must be revoked immediately and replaced with a new credential. Deferring action until a scheduled rotation window leaves the compromised key valid and exploitable for the entire remaining exposure period. Relocating the key to an environment variable removes the storage risk but leaves the exposed credential active, doing nothing to eliminate the threat the scenario identifies. Increasing monitoring without invalidating the key allows an attacker who already possesses it to continue using it undetected between monitoring intervals.","expth":"วงจรชีวิตการจัดการ secret กำหนดให้ Revocation เป็นการดำเนินการเมื่อ secret ถูกละเมิดหรือไม่ปลอดภัยอีกต่อไป API key ที่เปิดเผยต่อสาธารณะและยังใช้งานได้ต้องถูกเพิกถอนทันทีและแทนที่ด้วยข้อมูลรับรองใหม่ การเลื่อนไปถึงช่วง rotation ตามกำหนดทำให้ key ที่ถูกละเมิดยังใช้ประโยชน์ได้ตลอดช่วงเวลาเปิดเผยที่เหลือ การย้าย key ไปไว้ใน environment variable กำจัดความเสี่ยงของตำแหน่งจัดเก็บ แต่ปล่อยให้ข้อมูลรับรองที่เปิดเผยแล้วยังใช้งานได้ ไม่ได้แก้ภัยคุกคามที่สถานการณ์ระบุ ส่วนการเพิ่มการเฝ้าติดตามโดยไม่ทำให้ key ใช้ไม่ได้ยอมให้ผู้โจมตีที่มี key อยู่แล้วใช้ต่อได้โดยไม่ถูกตรวจพบระหว่างช่วงการเฝ้าติดตาม"},{"id":170379691,"n":61,"d":4,"o":"4.7","q":"A development team is building a consumer application that allows users to sign in using their existing Google account. The application must both verify who the user is and retrieve basic profile information such as email address and display name. The team is evaluating federation protocols. What is the MOST appropriate protocol, and why?","qth":"ทีมพัฒนากำลังสร้างแอปพลิเคชันสำหรับผู้บริโภคที่ให้ผู้ใช้ลงชื่อเข้าใช้ด้วยบัญชี Google ที่มีอยู่ แอปพลิเคชันต้องทั้งยืนยันว่าผู้ใช้เป็นใคร และดึงข้อมูลโปรไฟล์พื้นฐาน เช่น อีเมลและชื่อที่แสดง ทีมกำลังประเมินโปรโตคอล federation โปรโตคอลใดเหมาะสมที่สุด (MOST appropriate) และเพราะเหตุใด","a":["SAML, because it is the standard for exchanging authentication assertions in XML format and supports identity verification across enterprise environments.","Kerberos, because it uses time-limited encrypted tickets to verify identity and is well suited to consumer-facing application authentication.","OpenID Connect, because it extends OAuth 2.0 to add an authentication layer, providing an ID token that carries user identity information.","OAuth 2.0, because it handles both authentication and authorization natively and provides user identity information without requiring an additional layer."],"ath":["SAML เพราะเป็นมาตรฐานสำหรับแลกเปลี่ยน authentication assertion ในรูปแบบ XML และรองรับการยืนยัน identity ข้ามสภาพแวดล้อมองค์กร","Kerberos เพราะใช้ ticket ที่เข้ารหัสและมีอายุจำกัดเพื่อยืนยัน identity และเหมาะกับการยืนยันตัวตนของแอปพลิเคชันสำหรับผู้บริโภค","OpenID Connect เพราะขยาย OAuth 2.0 โดยเพิ่มชั้น authentication ให้ ID token ที่พกข้อมูล identity ของผู้ใช้","OAuth 2.0 เพราะจัดการทั้ง authentication และ authorization ได้ในตัว และให้ข้อมูล identity ของผู้ใช้โดยไม่ต้องมีชั้นเพิ่มเติม"],"ans":"C","exp":"OpenID Connect extends OAuth 2.0 by adding an authentication layer and introducing the ID token, which carries verified identity claims such as email and display name. OAuth 2.0 alone provides authorization but not authentication, making it insufficient for the identity verification requirement without an additional layer. SAML is an enterprise-focused XML protocol not suited to modern consumer application patterns. Kerberos is an on-premises enterprise authentication mechanism and is not applicable to internet-connected consumer-facing applications.","expth":"OpenID Connect ขยาย OAuth 2.0 โดยเพิ่มชั้น authentication และนำ ID token มาใช้ ซึ่งพกข้อมูลยืนยัน identity เช่น อีเมลและชื่อที่แสดง OAuth 2.0 เพียงอย่างเดียวให้ authorization แต่ไม่ใช่ authentication จึงไม่เพียงพอสำหรับข้อกำหนดการยืนยัน identity หากไม่มีชั้นเพิ่มเติม SAML เป็นโปรโตคอล XML ที่เน้นองค์กร ไม่เหมาะกับรูปแบบแอปพลิเคชันสำหรับผู้บริโภคสมัยใหม่ ส่วน Kerberos เป็นกลไกยืนยันตัวตนองค์กรแบบ on-premises และใช้ไม่ได้กับแอปพลิเคชันสำหรับผู้บริโภคที่เชื่อมต่ออินเทอร์เน็ต"},{"id":170379693,"n":62,"d":4,"o":"4.7","q":"A security engineer discovers that an API key used by a production application was accidentally committed to a public code repository and has been exposed for an unknown period. The key is still valid and could be used to access backend services. The team must eliminate the risk this specific key poses going forward. What is the MOST appropriate action based on the secrets management lifecycle?","qth":"วิศวกรความมั่นคงปลอดภัยพบว่า API key ที่แอปพลิเคชัน production ใช้ถูก commit เข้า public code repository โดยไม่ตั้งใจ และเปิดเผยมาเป็นเวลาที่ไม่ทราบแน่ชัด key ยังใช้งานได้และอาจถูกใช้เข้าถึงบริการหลังบ้าน ทีมต้องกำจัดความเสี่ยงที่ key เฉพาะตัวนี้ก่อขึ้นต่อจากนี้ การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) ตามวงจรชีวิตการจัดการ secret คืออะไร","a":["Rotate the API key on its next scheduled rotation date to minimize operational disruption while acknowledging the known exposure.","Increase monitoring on all services the API key can access so that unauthorized use is detected and investigated before further action is taken.","Replace the exposed API key with a new one, since revocation addresses keys that are compromised or no longer safe to use.","Move the API key from the code repository into an environment variable, which removes the storage exposure without invalidating the existing key."],"ath":["หมุนเวียน (rotate) API key ตามวันที่กำหนด rotation ครั้งถัดไป เพื่อลดการหยุดชะงักเชิงปฏิบัติการ ขณะยอมรับการเปิดเผยที่ทราบแล้ว","เพิ่มการเฝ้าติดตามบริการทั้งหมดที่ API key เข้าถึงได้ เพื่อตรวจจับและสืบสวนการใช้โดยไม่ได้รับอนุญาตก่อนดำเนินการอื่นต่อ","แทนที่ API key ที่เปิดเผยด้วย key ใหม่ เพราะการเพิกถอนใช้กับ key ที่ถูกละเมิดหรือไม่ปลอดภัยที่จะใช้ต่อ","ย้าย API key จาก code repository ไปไว้ใน environment variable ซึ่งกำจัดการเปิดเผยจากตำแหน่งจัดเก็บ โดยไม่ทำให้ key เดิมใช้ไม่ได้"],"ans":"C","exp":"The secrets management lifecycle defines Revocation as the required action when a secret is compromised or no longer safe. A key exposed in a public repository is compromised regardless of whether misuse has been detected and must be invalidated immediately. Waiting for the next scheduled rotation leaves the compromised key active during the exposure window. Relocating the key to an environment variable removes the storage location risk but leaves the already-harvested credential valid. Increasing monitoring accepts ongoing risk rather than eliminating the exposed secret.","expth":"วงจรชีวิตการจัดการ secret กำหนดให้ Revocation เป็นการดำเนินการที่ต้องทำเมื่อ secret ถูกละเมิดหรือไม่ปลอดภัยอีกต่อไป key ที่เปิดเผยใน public repository ถือว่าถูกละเมิดแล้วไม่ว่าจะตรวจพบการใช้ในทางที่ผิดหรือไม่ และต้องถูกทำให้ใช้ไม่ได้ทันที การรอ rotation ตามกำหนดปล่อยให้ key ที่ถูกละเมิดยังทำงานในช่วงเวลาที่เปิดเผย การย้ายไปไว้ใน environment variable กำจัดความเสี่ยงของตำแหน่งจัดเก็บ แต่ปล่อยให้ข้อมูลรับรองที่ถูกเก็บไปแล้วยังใช้งานได้ ส่วนการเพิ่มการเฝ้าติดตามเป็นการยอมรับความเสี่ยงต่อเนื่องแทนที่จะกำจัด secret ที่เปิดเผย"},{"id":170379695,"n":63,"d":4,"o":"4.7","q":"Your organization has deployed SSO so that employees authenticate once and access email, collaboration tools, and the HR system. The CISO flags that the architecture creates a single point of failure: an attacker who compromises one employee's SSO credentials gains access to all linked services. The security team must choose controls that address this structural risk while preserving operational efficiency for a distributed workforce. What is the BEST combination of controls to address this scenario?","qth":"องค์กรของคุณติดตั้ง SSO เพื่อให้พนักงานยืนยันตัวตนครั้งเดียวแล้วเข้าถึงอีเมล เครื่องมือทำงานร่วมกัน และระบบ HR ได้ CISO ชี้ว่าสถาปัตยกรรมนี้สร้าง single point of failure คือผู้โจมตีที่เจาะข้อมูลรับรอง SSO ของพนักงานหนึ่งคนจะเข้าถึงบริการที่เชื่อมโยงทั้งหมดได้ ทีมความมั่นคงปลอดภัยต้องเลือกมาตรการควบคุมที่แก้ความเสี่ยงเชิงโครงสร้างนี้ พร้อมรักษาประสิทธิภาพเชิงปฏิบัติการสำหรับกำลังคนที่กระจายตัว การผสมมาตรการควบคุมที่ดีที่สุด (BEST) เพื่อจัดการสถานการณ์นี้คืออะไร","a":["Implement MFA on the SSO account, enforce session time limits with reauthentication after inactivity, and enable logging to detect anomalous login behavior.","Disable SSO for high-value applications and require separate credentials for each, eliminating the single point of failure entirely.","Encrypt all SAML assertions and Kerberos tickets to prevent credential interception, which is sufficient to address the single point of failure risk.","Require users to log in from approved devices only, which prevents attackers from using compromised credentials regardless of whether MFA is in place."],"ath":["ติดตั้ง MFA บนบัญชี SSO บังคับจำกัดเวลา session พร้อมให้ยืนยันตัวตนใหม่หลังไม่มีการใช้งาน และเปิด logging เพื่อตรวจจับพฤติกรรมการล็อกอินที่ผิดปกติ","ปิด SSO สำหรับแอปพลิเคชันที่มีมูลค่าสูงและกำหนดให้ใช้ข้อมูลรับรองแยกกัน เพื่อกำจัด single point of failure ทั้งหมด","เข้ารหัส SAML assertion และ Kerberos ticket ทั้งหมดเพื่อป้องกันการดักข้อมูลรับรอง ซึ่งเพียงพอต่อการแก้ความเสี่ยง single point of failure","กำหนดให้ผู้ใช้ล็อกอินจากอุปกรณ์ที่ได้รับอนุมัติเท่านั้น ซึ่งป้องกันผู้โจมตีใช้ข้อมูลรับรองที่ถูกเจาะได้ไม่ว่าจะมี MFA หรือไม่"],"ans":"A","exp":"MFA blocks account compromise even when credentials are stolen, session time limits with reauthentication reduce the exposure window after a valid session is established, and logging enables detection of anomalous behavior. Disabling SSO for high-value applications defeats its purpose and is operationally unacceptable for a distributed workforce. Encrypting assertions and ticket addresses interception in transit, but does not address the account compromise scenario described in the stem. Restricting access to approved devices is a useful compensating control, but a compromised account can be used to gain full access.","expth":"MFA ปิดกั้นการเจาะบัญชีแม้ข้อมูลรับรองถูกขโมย การจำกัดเวลา session พร้อมการยืนยันตัวตนใหม่ลดช่วงเวลาเปิดเผยหลังสร้าง session ที่ถูกต้อง และ logging ช่วยตรวจจับพฤติกรรมผิดปกติ การปิด SSO สำหรับแอปพลิเคชันมูลค่าสูงทำลายวัตถุประสงค์ของ SSO และรับไม่ได้ในเชิงปฏิบัติการสำหรับกำลังคนที่กระจายตัว การเข้ารหัส assertion และ ticket จัดการการดักข้อมูลระหว่างส่ง แต่ไม่แก้สถานการณ์การเจาะบัญชีที่ระบุในโจทย์ ส่วนการจำกัดเฉพาะอุปกรณ์ที่ได้รับอนุมัติเป็นมาตรการชดเชยที่มีประโยชน์ แต่บัญชีที่ถูกเจาะยังถูกใช้เข้าถึงได้เต็มรูปแบบ"},{"id":170379697,"n":64,"d":5,"o":"5.1","q":"A cloud operations team is deploying a new virtual machine in a shared multi-tenant production environment. The VM's virtualization toolset installation includes clipboard sharing, drag-and-drop file transfer, and device access features. The security team must balance operational completeness with isolation requirements. What is the MOST appropriate security action for these features in this context?","qth":"ทีม cloud operations กำลัง deploy virtual machine ตัวใหม่ในสภาพแวดล้อม production แบบ multi-tenant ที่ใช้ร่วมกัน การติดตั้ง virtualization toolset ของ VM รวมฟีเจอร์ clipboard sharing, drag-and-drop file transfer และ device access ทีมความมั่นคงปลอดภัยต้องสมดุลระหว่างความสมบูรณ์เชิงปฏิบัติการกับข้อกำหนดด้านการแยกส่วน (isolation) การดำเนินการด้านความปลอดภัยที่เหมาะสมที่สุด (MOST appropriate) สำหรับฟีเจอร์เหล่านี้ในบริบทนี้คืออะไร","a":["Enable clipboard sharing and file transfer for authorized administrators only, and disable device access for all other users.","Retain all features and rely on hypervisor-level monitoring to detect any cross-VM interactions that violate isolation policies.","Disable clipboard sharing, file transfer, and device access features, because in multi-tenant production environments, unneeded cross-VM interaction features increase isolation risk.","Disable device access only, because clipboard sharing is required for administrative efficiency and does not present a meaningful risk in production."],"ath":["เปิด clipboard sharing และ file transfer เฉพาะผู้ดูแลระบบที่ได้รับอนุญาต และปิด device access สำหรับผู้ใช้อื่นทั้งหมด","คงทุกฟีเจอร์ไว้ และพึ่งพาการเฝ้าติดตามระดับ hypervisor เพื่อตรวจจับปฏิสัมพันธ์ข้าม VM ที่ละเมิดนโยบายการแยกส่วน","ปิด clipboard sharing, file transfer และ device access เพราะในสภาพแวดล้อม production แบบ multi-tenant ฟีเจอร์ปฏิสัมพันธ์ข้าม VM ที่ไม่จำเป็นเพิ่มความเสี่ยงต่อ isolation","ปิดเฉพาะ device access เพราะ clipboard sharing จำเป็นต่อประสิทธิภาพของผู้ดูแลระบบ และไม่ก่อความเสี่ยงที่มีนัยสำคัญใน production"],"ans":"C","exp":"In multi-tenant production environments, clipboard sharing, file transfer, and device access features enable cross-VM interactions that increase isolation risk and should be disabled when not required. Relying on hypervisor monitoring is a detective control, not a preventive one, and retains unnecessary attack surface. Restricting clipboard sharing to administrators still leaves a cross-VM channel active in a shared environment. Retaining clipboard sharing for administrative convenience keeps an unnecessary feature open in a context where strict isolation is required.","expth":"ในสภาพแวดล้อม production แบบ multi-tenant ฟีเจอร์ clipboard sharing, file transfer และ device access เปิดช่องปฏิสัมพันธ์ข้าม VM ที่เพิ่มความเสี่ยงต่อ isolation และควรปิดเมื่อไม่จำเป็น การพึ่งพาการเฝ้าติดตามของ hypervisor เป็นมาตรการเชิงตรวจจับ ไม่ใช่เชิงป้องกัน และคง attack surface ที่ไม่จำเป็นไว้ การจำกัด clipboard sharing ให้ผู้ดูแลระบบยังคงช่องทางข้าม VM ที่ใช้งานอยู่ในสภาพแวดล้อมที่ใช้ร่วมกัน ส่วนการคง clipboard sharing ไว้เพื่อความสะดวกในการดูแลระบบเปิดฟีเจอร์ที่ไม่จำเป็นไว้ในบริบทที่ต้องการ isolation อย่างเข้มงวด"},{"id":170379699,"n":65,"d":5,"o":"5.2","q":"A cloud operations team is deploying containerized workloads in a highly dynamic environment where new instances are created and destroyed frequently throughout the day. The security team requires that every new instance meet the organization's hardening standards from the moment it comes online. The operations team is concerned that applying hardening after deployment will introduce delays and inconsistencies. A compliance officer also requires documented evidence that hardening was applied to every instance. What is the BEST approach to meet all three requirements?","qth":"ทีม cloud operations กำลัง deploy container workload ในสภาพแวดล้อมที่เปลี่ยนแปลงสูง ซึ่งอินสแตนซ์ใหม่ถูกสร้างและทำลายบ่อยตลอดวัน ทีมความมั่นคงปลอดภัยกำหนดให้ทุกอินสแตนซ์ใหม่ต้องตรงตามมาตรฐาน hardening ขององค์กรตั้งแต่วินาทีที่ออนไลน์ ทีมปฏิบัติการกังวลว่าการทำ hardening หลัง deploy จะทำให้เกิดความล่าช้าและความไม่สอดคล้อง เจ้าหน้าที่ compliance ยังต้องการหลักฐานที่เป็นเอกสารว่า hardening ถูกทำกับทุกอินสแตนซ์ แนวทางที่ดีที่สุด (BEST) เพื่อตอบทั้งสามข้อกำหนดคืออะไร","a":["Embed security baseline configurations directly into the IaC provisioning workflow so that every instance launches pre-hardened","Apply hardened images manually to each new instance as part of the deployment checklist to ensure human verification","Require developers to apply the CIS benchmark manually to each container before it is approved for deployment","Schedule automated vulnerability scans immediately after each instance launches and remediate findings before the instance enters production"],"ath":["ฝัง security baseline configuration ลงใน IaC provisioning workflow โดยตรง เพื่อให้ทุกอินสแตนซ์เริ่มทำงานพร้อมการ hardening","นำ hardened image ไปใช้กับแต่ละอินสแตนซ์ใหม่ด้วยมือเป็นส่วนหนึ่งของ deployment checklist เพื่อให้มีการตรวจสอบโดยมนุษย์","กำหนดให้นักพัฒนานำ CIS benchmark ไปใช้กับแต่ละ container ด้วยมือก่อนได้รับอนุมัติให้ deploy","กำหนดตารางสแกนช่องโหว่อัตโนมัติทันทีหลังแต่ละอินสแตนซ์เริ่มทำงาน และแก้ไขข้อค้นพบก่อนอินสแตนซ์เข้าสู่ production"],"ans":"A","exp":"IaC tools such as Ansible or Terraform automate baseline application during provisioning of virtual machines or containers, ensuring every instance is hardened at launch. This satisfies all three requirements: security is applied at the moment of creation, operations avoids post-deployment delays and inconsistency, and compliance has documented evidence in version-controlled code. Post-launch scanning creates a window of unprotected exposure. Manual application does not scale in ephemeral environments and introduces human inconsistency.","expth":"เครื่องมือ IaC เช่น Ansible หรือ Terraform ทำ baseline โดยอัตโนมัติระหว่างการจัดเตรียม virtual machine หรือ container ทำให้ทุกอินสแตนซ์ถูก hardening ตั้งแต่เริ่มทำงาน จึงตอบครบทั้งสามข้อกำหนด ความปลอดภัยถูกใช้ ณ ขณะสร้าง ฝ่ายปฏิบัติการเลี่ยงความล่าช้าและความไม่สอดคล้องหลัง deploy และฝ่าย compliance มีหลักฐานเป็นเอกสารในโค้ดที่อยู่ภายใต้ version control การสแกนหลังเริ่มทำงานสร้างช่วงเวลาที่ไม่ได้รับการป้องกัน การทำด้วยมือรองรับสภาพแวดล้อมแบบ ephemeral ไม่ได้และก่อความไม่สอดคล้องจากมนุษย์"},{"id":170379701,"n":66,"d":5,"o":"5.2","q":"A cloud security team is tasked with hardening Linux servers deployed across a regulated cloud environment. The organization must demonstrate compliance with industry-recognized security standards during its next audit, and the team is under pressure to complete the hardening process quickly without building custom configurations from scratch. What is the MOST appropriate starting point for defining the hardening configuration?","qth":"ทีมความมั่นคงปลอดภัยคลาวด์ได้รับมอบหมายให้ทำ hardening เซิร์ฟเวอร์ Linux ที่ deploy ในสภาพแวดล้อมคลาวด์ที่ถูกกำกับ องค์กรต้องแสดงการปฏิบัติตามมาตรฐานความปลอดภัยที่ยอมรับในอุตสาหกรรมในการตรวจสอบครั้งถัดไป และทีมถูกกดดันให้ทำ hardening ให้เสร็จเร็วโดยไม่ต้องสร้างการกำหนดค่าเองตั้งแต่ต้น จุดเริ่มต้นที่เหมาะสมที่สุด (MOST appropriate) ในการกำหนดการตั้งค่า hardening คืออะไร","a":["Perform a vulnerability scan first to identify the highest-risk settings before configuring anything","Deploy the servers using default operating system settings and document all changes","Apply a published CIS or DISA benchmark as the security baseline for the Linux environment","Apply automation tools to remediate any deviations detected after initial deployment"],"ath":["ทำ vulnerability scan ก่อนเพื่อระบุการตั้งค่าที่เสี่ยงสูงสุด แล้วจึงกำหนดค่าอะไรก็ตาม","deploy เซิร์ฟเวอร์ด้วยค่าเริ่มต้นของระบบปฏิบัติการ และบันทึกการเปลี่ยนแปลงทั้งหมด","ใช้ CIS หรือ DISA benchmark ที่เผยแพร่แล้วเป็น security baseline สำหรับสภาพแวดล้อม Linux","ใช้เครื่องมือ automation เพื่อแก้ไขส่วนที่เบี่ยงเบนที่ตรวจพบหลัง deploy ครั้งแรก"],"ans":"C","exp":"CIS and DISA publish recognized benchmarks for Linux distributions covering password policies, firewalls, and disabling unnecessary features. These provide an audit-defensible starting point without requiring custom development. Default settings are not hardened and do not satisfy audit requirements. Scanning first identifies gaps but presupposes a target state. a baseline must be defined before deviations can be identified. Remediation tools address drift but require a baseline to exist before they can function.","expth":"CIS และ DISA เผยแพร่ benchmark ที่ยอมรับสำหรับ Linux distribution ต่าง ๆ ครอบคลุมนโยบายรหัสผ่าน firewall และการปิดฟีเจอร์ที่ไม่จำเป็น ให้จุดเริ่มต้นที่ป้องกันได้ในการตรวจสอบโดยไม่ต้องพัฒนาเอง ค่าเริ่มต้นไม่ได้ผ่านการ hardening และไม่ตอบข้อกำหนดการตรวจสอบ การสแกนก่อนระบุช่องว่างได้ แต่สมมติว่ามีสถานะเป้าหมาย ต้องกำหนด baseline ก่อนจึงจะระบุส่วนเบี่ยงเบนได้ ส่วนเครื่องมือแก้ไขจัดการ drift แต่ต้องมี baseline อยู่ก่อนจึงจะทำงานได้"},{"id":170379703,"n":67,"d":5,"o":"5.2","q":"A cloud operations team manages virtual machines in private subnets of a multi-cloud environment. Direct RDP and SSH access from the public internet is prohibited by policy. Developers need to deploy and troubleshoot applications, and the security team must address attack surface exposure, lateral movement risk, and the requirement for access audit trails. What is the MOST appropriate architecture to satisfy all three concerns?","qth":"ทีม cloud operations ดูแล virtual machine ใน private subnet ของสภาพแวดล้อม multi-cloud นโยบายห้ามการเข้าถึง RDP และ SSH โดยตรงจากอินเทอร์เน็ตสาธารณะ นักพัฒนาต้อง deploy และแก้ปัญหาแอปพลิเคชัน และทีมความมั่นคงปลอดภัยต้องจัดการการเปิดเผย attack surface ความเสี่ยง lateral movement และข้อกำหนด audit trail ของการเข้าถึง สถาปัตยกรรมที่เหมาะสมที่สุด (MOST appropriate) เพื่อตอบทั้งสามข้อกังวลคืออะไร","a":["Deploy a bastion host in a public subnet that requires strong authentication, funneling all developer access through it to reach private subnet resources, with all access attempts logged.","Grant developers temporary elevated credentials scoped to specific virtual machines, rotating them daily to limit the exposure window.","Deploy a VPN and allow developers to connect directly to virtual machines after authenticating, with all VPN session start and end times logged.","Enable console-based access through the cloud provider's web portal for all developers, restricting portal access to corporate IP addresses only."],"ath":["ติดตั้ง bastion host ใน public subnet ที่ต้องยืนยันตัวตนอย่างเข้มแข็ง ส่งการเข้าถึงของนักพัฒนาทั้งหมดผ่านตัวนี้เพื่อไปยังทรัพยากรใน private subnet โดยบันทึกความพยายามเข้าถึงทั้งหมด","ให้ข้อมูลรับรองยกระดับชั่วคราวที่จำกัดเฉพาะ virtual machine บางตัวแก่นักพัฒนา และหมุนเวียนทุกวันเพื่อจำกัดช่วงเวลาเปิดเผย","ติดตั้ง VPN และอนุญาตให้นักพัฒนาเชื่อมต่อตรงกับ virtual machine หลังยืนยันตัวตน โดยบันทึกเวลาเริ่มและสิ้นสุด VPN session","เปิดการเข้าถึงผ่านคอนโซลบนเว็บพอร์ทัลของผู้ให้บริการคลาวด์สำหรับนักพัฒนาทุกคน โดยจำกัดการเข้าพอร์ทัลเฉพาะ IP address ขององค์กร"],"ans":"A","exp":"A bastion host is a hardened gateway in a public subnet that requires strong authentication and serves as the single controlled entry point to private subnet resources. It reduces attack surface by eliminating direct public exposure of private VMs, constrains lateral movement by controlling the access path, and centralizes logging for auditability. A VPN provides authentication and partial logging but does not create the single controlled entry point a bastion architecture establishes. Daily credential rotation does not address access path control or lateral movement. Web portal access does not satisfy the private subnet architecture the scenario requires.","expth":"Bastion host คือ gateway ที่ผ่านการ hardening ใน public subnet ซึ่งต้องยืนยันตัวตนอย่างเข้มแข็งและทำหน้าที่เป็นจุดเข้าเดียวที่ควบคุมได้สู่ทรัพยากรใน private subnet ช่วยลด attack surface โดยขจัดการเปิดเผย VM ใน private ต่อสาธารณะโดยตรง จำกัด lateral movement ด้วยการควบคุมเส้นทางการเข้าถึง และรวมศูนย์ logging เพื่อการตรวจสอบ VPN ให้การยืนยันตัวตนและ logging บางส่วน แต่ไม่สร้างจุดเข้าเดียวที่ควบคุมได้ซึ่งสถาปัตยกรรม bastion สร้าง การหมุนเวียนข้อมูลรับรองรายวันไม่จัดการการควบคุมเส้นทางเข้าถึงหรือ lateral movement ส่วนการเข้าถึงผ่านเว็บพอร์ทัลไม่ตอบสถาปัตยกรรม private subnet ที่สถานการณ์ต้องการ"},{"id":170379705,"n":68,"d":5,"o":"5.2","q":"A financial services organization operates a customer payment platform on a public cloud provider. The platform must maintain 99.999% availability, and the organization cannot tolerate an outage caused by a localized failure within a single data center. The operations team is evaluating whether to deploy all resources within a single availability zone to simplify management or distribute resources across multiple availability zones. What is the MOST appropriate architecture decision given these requirements?","qth":"องค์กรบริการทางการเงินดำเนินแพลตฟอร์มการชำระเงินของลูกค้าบนผู้ให้บริการ public cloud แพลตฟอร์มต้องรักษา availability 99.999% และองค์กรยอมรับไม่ได้ต่อเหตุขัดข้องจากความล้มเหลวเฉพาะจุดภายในศูนย์ข้อมูลเดียว ทีมปฏิบัติการกำลังประเมินว่าจะ deploy ทรัพยากรทั้งหมดใน availability zone เดียวเพื่อลดความซับซ้อนการบริหาร หรือกระจายไปหลาย availability zone การตัดสินใจด้านสถาปัตยกรรมที่เหมาะสมที่สุด (MOST appropriate) ภายใต้ข้อกำหนดเหล่านี้คืออะไร","a":["Deploy resources across multiple availability zones, because availability zones are isolated from each other so a failure in one zone does not impact resources in another.","Deploy within a single availability zone and implement aggressive monitoring, because early failure detection reduces the impact of any localized data center outage.","Deploy across multiple cloud providers instead of multiple availability zones, because multi-cloud redundancy provides stronger protection than zone-level isolation.","Deploy within a single availability zone and configure auto-scaling to add instances during peak demand, because auto-scaling compensates for localized failures by increasing resource capacity."],"ath":["deploy ทรัพยากรข้ามหลาย availability zone เพราะ availability zone แยกจากกัน ความล้มเหลวใน zone หนึ่งจึงไม่กระทบทรัพยากรใน zone อื่น","deploy ใน availability zone เดียวและใช้การเฝ้าติดตามอย่างเข้มข้น เพราะการตรวจพบความล้มเหลวเร็วลดผลกระทบของเหตุขัดข้องเฉพาะจุดของศูนย์ข้อมูล","deploy ข้ามหลายผู้ให้บริการคลาวด์แทนหลาย availability zone เพราะความซ้ำซ้อนแบบ multi-cloud ให้การป้องกันแข็งแกร่งกว่าการแยกระดับ zone","deploy ใน availability zone เดียวและตั้ง auto-scaling เพิ่มอินสแตนซ์ช่วงความต้องการสูง เพราะ auto-scaling ชดเชยความล้มเหลวเฉพาะจุดด้วยการเพิ่มความจุทรัพยากร"],"ans":"A","exp":"Availability zones are physically isolated from each other, so deploying across multiple zones ensures a localized failure in one zone does not affect resources in another, directly satisfying a 99.999% uptime requirement. Auto-scaling adds capacity during demand spikes but cannot restore service when an entire hosting zone fails. Monitoring detects failures after downtime begins and does not prevent it. Multi-cloud redundancy introduces significant architectural complexity and is not the appropriate solution for zone-level isolation requirements.","expth":"Availability zone แยกจากกันทางกายภาพ การ deploy ข้ามหลาย zone จึงทำให้ความล้มเหลวเฉพาะจุดใน zone หนึ่งไม่กระทบทรัพยากรใน zone อื่น ตอบข้อกำหนด uptime 99.999% โดยตรง Auto-scaling เพิ่มความจุเมื่อความต้องการพุ่ง แต่คืนบริการไม่ได้เมื่อ zone ที่โฮสต์ล้มทั้งหมด การเฝ้าติดตามตรวจพบความล้มเหลวหลังเกิด downtime แล้วและไม่ป้องกัน ส่วนความซ้ำซ้อนแบบ multi-cloud เพิ่มความซับซ้อนทางสถาปัตยกรรมอย่างมาก และไม่ใช่วิธีแก้ที่เหมาะสมสำหรับข้อกำหนดการแยกระดับ zone"},{"id":170379707,"n":69,"d":5,"o":"5.2","q":"A cloud engineering team using Terraform to manage infrastructure across three cloud regions pushes a network configuration update that inadvertently removes firewall rules from a production environment. Security controls are briefly offline before the error is detected. The team needs to restore the previous configuration as quickly as possible. What is the BEST feature of IaC that enables the team to recover in this scenario?","qth":"ทีมวิศวกรรมคลาวด์ที่ใช้ Terraform จัดการโครงสร้างพื้นฐานข้ามสาม region คลาวด์ push การอัปเดตการกำหนดค่าเครือข่ายที่ลบกฎ firewall ออกจากสภาพแวดล้อม production โดยไม่ตั้งใจ มาตรการควบคุมความปลอดภัยออฟไลน์ชั่วคราวก่อนตรวจพบข้อผิดพลาด ทีมต้องคืนการกำหนดค่าก่อนหน้าให้เร็วที่สุด ฟีเจอร์ของ IaC ที่ดีที่สุด (BEST) ที่ช่วยให้ทีมกู้คืนในสถานการณ์นี้คืออะไร","a":["Policy enforcement tools like Open Policy Agent can scan the current state and flag the misconfiguration for manual correction","Automation integration allows the team to trigger a new pipeline run that rebuilds affected resources from the latest configuration","The declarative approach allows the team to redefine the desired state and redeploy all resources from scratch","Version control integration allows the team to roll back to the previous working infrastructure configuration"],"ath":["เครื่องมือบังคับนโยบายอย่าง Open Policy Agent สแกนสถานะปัจจุบันและแจ้งการกำหนดค่าผิดพลาดเพื่อแก้ไขด้วยมือ","Automation integration ให้ทีมกระตุ้น pipeline run ใหม่เพื่อสร้างทรัพยากรที่ได้รับผลกระทบใหม่จากการกำหนดค่าล่าสุด","แนวทาง declarative ให้ทีมนิยามสถานะที่ต้องการใหม่และ deploy ทรัพยากรทั้งหมดใหม่ตั้งแต่ต้น","Version control integration ให้ทีม roll back ไปยังการกำหนดค่าโครงสร้างพื้นฐานที่ทำงานได้ก่อนหน้า"],"ans":"D","exp":"IaC integrates with version control systems like Git, meaning every infrastructure change is tracked and teams can roll back to a previous working version when a configuration breaks. This is the fastest and most direct recovery path in the scenario. Redeploying from scratch via the declarative approach is slower and risks re-introducing errors. Triggering a new pipeline run applies the same broken configuration that caused the incident. OPA scanning identifies the issue but does not restore the previous configuration automatically.","expth":"IaC ผสานกับระบบ version control เช่น Git ทำให้ทุกการเปลี่ยนแปลงโครงสร้างพื้นฐานถูกติดตาม และทีม roll back ไปเวอร์ชันก่อนหน้าที่ทำงานได้เมื่อการกำหนดค่าพัง นี่คือเส้นทางกู้คืนที่เร็วและตรงที่สุดในสถานการณ์นี้ การ deploy ใหม่ตั้งแต่ต้นผ่านแนวทาง declarative ช้ากว่าและเสี่ยงนำข้อผิดพลาดกลับมา การกระตุ้น pipeline run ใหม่จะใช้การกำหนดค่าที่พังเดิมซึ่งก่อเหตุ ส่วน OPA ระบุปัญหาได้ แต่ไม่คืนการกำหนดค่าก่อนหน้าโดยอัตโนมัติ"},{"id":170379709,"n":70,"d":5,"o":"5.2","q":"A cloud operations team is preparing to deploy a critical security patch to a database server running in production. The patch addresses a known vulnerability, but a previous patch for the same system caused query performance to degrade significantly after deployment. The security team is pressing for immediate deployment to reduce exposure time. What should be the FIRST action the team takes before deploying the patch to the production environment?","qth":"ทีม cloud operations กำลังเตรียม deploy security patch ที่สำคัญให้ database server ที่ทำงานใน production patch แก้ช่องโหว่ที่ทราบแล้ว แต่ patch ก่อนหน้าของระบบเดียวกันเคยทำให้ประสิทธิภาพ query ลดลงมากหลัง deploy ทีมความมั่นคงปลอดภัยกดดันให้ deploy ทันทีเพื่อลดเวลาการเปิดเผย ทีมควรทำอะไรเป็นอันดับแรก (FIRST) ก่อน deploy patch ไปยังสภาพแวดล้อม production","a":["Notify stakeholders of the potential performance impact and obtain approval before beginning the patching process","Test the patch in a staging or lab environment to identify compatibility issues before production deployment","Schedule the patch deployment during an off-peak maintenance window to minimize the impact of any disruptions","Apply the patch to production immediately and monitor query performance in real time to detect any degradation"],"ath":["แจ้งผู้มีส่วนได้ส่วนเสียเรื่องผลกระทบด้านประสิทธิภาพที่อาจเกิดขึ้นและขออนุมัติก่อนเริ่มกระบวนการ patch","ทดสอบ patch ในสภาพแวดล้อม staging หรือ lab เพื่อระบุปัญหาความเข้ากันได้ก่อน deploy ไป production","กำหนดเวลา deploy patch ในช่วง maintenance window นอกเวลาคับคั่ง เพื่อลดผลกระทบของการหยุดชะงักใด ๆ","apply patch ไปยัง production ทันทีและเฝ้าติดตามประสิทธิภาพ query แบบ real time เพื่อตรวจจับการลดลงของประสิทธิภาพ"],"ans":"B","exp":"Testing in a staging environment is the required first step before production deployment because patches can create compatibility issues or unexpected side effects. The prior performance incident in the scenario makes this step mandatory before any other action. Immediate production deployment risks repeating the known failure. Stakeholder notification and maintenance window scheduling are both valid steps but are logically dependent on confirming the patch is safe, making them secondary to testing.","expth":"การทดสอบในสภาพแวดล้อม staging เป็นขั้นตอนแรกที่จำเป็นก่อน deploy ไป production เพราะ patch อาจก่อปัญหาความเข้ากันได้หรือผลข้างเคียงที่ไม่คาดคิด เหตุการณ์ด้านประสิทธิภาพก่อนหน้าในสถานการณ์ทำให้ขั้นตอนนี้จำเป็นก่อนการดำเนินการอื่นใด การ deploy ไป production ทันทีเสี่ยงต่อการเกิดความล้มเหลวที่ทราบซ้ำ การแจ้งผู้มีส่วนได้ส่วนเสียและการกำหนด maintenance window เป็นขั้นตอนที่ถูกต้องทั้งคู่ แต่ขึ้นอยู่กับการยืนยันก่อนว่า patch ปลอดภัย จึงเป็นขั้นตอนรองต่อการทดสอบ"},{"id":170379711,"n":71,"d":5,"o":"5.2","q":"A cloud administrator needs to apply a firmware update to one of the physical host servers in a VMware vSphere cluster. The host is currently running several virtual machines supporting business-critical workloads. The administrator must complete the update without interrupting those workloads. What is the MOST appropriate action to take before beginning the firmware update?","qth":"ผู้ดูแลระบบคลาวด์ต้อง apply firmware update ให้ host server กายภาพตัวหนึ่งใน VMware vSphere cluster โดย host กำลังรัน virtual machine หลายตัวที่รองรับ workload ธุรกิจสำคัญ ผู้ดูแลระบบต้องอัปเดตให้เสร็จโดยไม่ขัดจังหวะ workload เหล่านั้น การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) ก่อนเริ่ม firmware update คืออะไร","a":["Manually migrate each virtual machine to another host using vMotion before beginning the firmware update","Enable high availability on the cluster before starting the update so that any virtual machines that go offline will restart automatically","Place the host into maintenance mode so that DRS automatically migrates all workloads to other hosts in the cluster","Shut down all virtual machines on the host, apply the firmware update, and then power them back on after the update completes"],"ath":["ย้าย virtual machine แต่ละตัวไปยัง host อื่นด้วยมือโดยใช้ vMotion ก่อนเริ่ม firmware update","เปิด high availability บน cluster ก่อนเริ่มอัปเดต เพื่อให้ virtual machine ที่ออฟไลน์เริ่มทำงานใหม่โดยอัตโนมัติ","ตั้ง host เข้าสู่ maintenance mode เพื่อให้ DRS ย้าย workload ทั้งหมดไปยัง host อื่นใน cluster โดยอัตโนมัติ","ปิด virtual machine ทั้งหมดบน host, apply firmware update แล้วเปิดกลับหลังอัปเดตเสร็จ"],"ans":"C","exp":"Placing a host into maintenance mode triggers DRS to automatically migrate all workloads to other hosts in the cluster, allowing the firmware update to proceed without any service interruption. This is the designed and intended mechanism for planned maintenance. Shutting down virtual machines causes service interruptions, violating the stated requirement. Manual vMotion achieves the same workload migration but requires significant manual effort when maintenance mode automates the entire process. Enabling HA addresses unplanned host failures and does not proactively migrate workloads before maintenance begins.","expth":"การตั้ง host เข้า maintenance mode กระตุ้นให้ DRS ย้าย workload ทั้งหมดไปยัง host อื่นใน cluster โดยอัตโนมัติ ทำให้ firmware update ดำเนินต่อได้โดยไม่มีการหยุดชะงักของบริการ นี่คือกลไกที่ออกแบบและตั้งใจไว้สำหรับการบำรุงรักษาตามแผน การปิด virtual machine ทำให้บริการหยุดชะงัก ซึ่งฝ่าฝืนข้อกำหนดที่ระบุ vMotion ด้วยมือได้ผลการย้าย workload เช่นเดียวกัน แต่ต้องใช้แรงงานมากเมื่อ maintenance mode ทำกระบวนการทั้งหมดโดยอัตโนมัติ ส่วน HA จัดการความล้มเหลวของ host ที่ไม่ได้วางแผน และไม่ย้าย workload เชิงรุกก่อนการบำรุงรักษาเริ่ม"},{"id":170379713,"n":72,"d":5,"o":"5.4","q":"A forensic investigator is creating a disk image from a compromised on-premises server that will be used as evidence in a legal proceeding. A colleague suggests simply copying the relevant files to an external drive to save time rather than using a dedicated forensic imaging tool. What is the MOST appropriate reason to reject this approach?","qth":"ผู้ตรวจสอบนิติวิทยาศาสตร์ดิจิทัลกำลังสร้าง disk image จากเซิร์ฟเวอร์ on-premises ที่ถูกเจาะ เพื่อใช้เป็นหลักฐานในกระบวนการทางกฎหมาย เพื่อนร่วมงานเสนอให้คัดลอกไฟล์ที่เกี่ยวข้องไปยังไดรฟ์ภายนอกเพื่อประหยัดเวลา แทนที่จะใช้เครื่องมือ forensic imaging เฉพาะทาง เหตุผลที่เหมาะสมที่สุด (MOST appropriate) ในการปฏิเสธแนวทางนี้คืออะไร","a":["Copying files individually creates a larger storage footprint than a bit-for-bit disk image, increasing the cost and complexity of secure evidence storage.","Standard file copy operations do not use write-blocking technology, meaning they can introduce modifications to the source drive that compromise evidence integrity.","Forensic imaging tools are required by GDPR for all evidence collected from servers that process personal data, making file copy methods legally non-compliant.","File-level copying does not preserve the hash values generated at the time of the original forensic acquisition, breaking the chain of custody record."],"ath":["การคัดลอกไฟล์ทีละไฟล์สร้างพื้นที่จัดเก็บมากกว่า bit-for-bit disk image เพิ่มต้นทุนและความซับซ้อนของการจัดเก็บหลักฐานอย่างปลอดภัย","การคัดลอกไฟล์มาตรฐานไม่ใช้เทคโนโลยี write-blocking จึงอาจทำให้ไดรฟ์ต้นทางถูกแก้ไขซึ่งกระทบความสมบูรณ์ของหลักฐาน","GDPR กำหนดให้ต้องใช้เครื่องมือ forensic imaging สำหรับหลักฐานทั้งหมดที่เก็บจากเซิร์ฟเวอร์ที่ประมวลผลข้อมูลส่วนบุคคล ทำให้วิธีคัดลอกไฟล์ไม่สอดคล้องกับกฎหมาย","การคัดลอกระดับไฟล์ไม่รักษาค่า hash ที่สร้างขึ้นตอนการเก็บหลักฐานครั้งแรก ทำให้บันทึก chain of custody ขาดตอน"],"ans":"B","exp":"Write-blocking technology prevents any write operation from reaching the source drive during imaging, ensuring original evidence remains unmodified and legally defensible. Standard file copy operations do not engage write-blocking, meaning accidental writes to the source can alter metadata, timestamps, or file state during the process. Even minor unintentional changes can render evidence inadmissible. Hash values do not exist before imaging begins; they are generated during or after acquisition, not prior to it. GDPR imposes no such forensic imaging tool requirement. Storage footprint concerns are irrelevant to evidence integrity.","expth":"เทคโนโลยี write-blocking ป้องกันไม่ให้การเขียนใด ๆ ไปถึงไดรฟ์ต้นทางระหว่างการทำ imaging ทำให้หลักฐานต้นฉบับไม่ถูกแก้ไขและป้องกันได้ทางกฎหมาย การคัดลอกไฟล์มาตรฐานไม่ใช้ write-blocking การเขียนโดยไม่ตั้งใจไปยังต้นทางจึงอาจเปลี่ยน metadata, timestamp หรือสถานะไฟล์ระหว่างกระบวนการ แม้การเปลี่ยนแปลงเล็กน้อยโดยไม่ตั้งใจอาจทำให้หลักฐานรับฟังไม่ได้ ค่า hash ไม่มีอยู่ก่อนเริ่ม imaging แต่ถูกสร้างระหว่างหรือหลังการเก็บ ไม่ใช่ก่อน GDPR ไม่ได้กำหนดข้อกำหนดเครื่องมือ forensic imaging เช่นนั้น และข้อกังวลเรื่องพื้นที่จัดเก็บไม่เกี่ยวกับความสมบูรณ์ของหลักฐาน"},{"id":170379715,"n":73,"d":5,"o":"5.5","q":"During an active security incident involving unauthorized access to customer data through a shared cloud service, your organization's security team is working to contain the breach. The vendor providing the affected service is slow to respond to email requests and has not provided root cause information after four hours. What is the BEST action to take to restore effective communication with the vendor?","qth":"ระหว่างเหตุการณ์ด้านความมั่นคงปลอดภัยที่กำลังดำเนินอยู่ ซึ่งเกี่ยวข้องกับการเข้าถึงข้อมูลลูกค้าโดยไม่ได้รับอนุญาตผ่านบริการคลาวด์ที่ใช้ร่วมกัน ทีมความมั่นคงปลอดภัยขององค์กรกำลังควบคุมการละเมิด ผู้ขายที่ให้บริการที่ได้รับผลกระทบตอบสนองอีเมลช้าและยังไม่ให้ข้อมูลสาเหตุรากหลังผ่านไปสี่ชั่วโมง การดำเนินการที่ดีที่สุด (BEST) เพื่อฟื้นการสื่อสารที่มีประสิทธิผลกับผู้ขายคืออะไร","a":["Escalate the incident through the vendor's defined escalation paths to engage senior technical or account resources accountable for incident resolution","Notify the vendor's regulator directly to compel timely disclosure of root cause information under applicable compliance obligations","Suspend the vendor contract pending a formal security audit to demonstrate the seriousness of the communication failure","Document the communication gap in the incident log and continue waiting for the vendor's standard response cycle to complete"],"ath":["ยกระดับเหตุการณ์ผ่านช่องทาง escalation ที่ผู้ขายกำหนดไว้ เพื่อดึงทรัพยากรด้านเทคนิคระดับสูงหรือผู้ดูแลบัญชีที่รับผิดชอบการแก้ไขเหตุการณ์","แจ้งหน่วยงานกำกับของผู้ขายโดยตรงเพื่อบังคับให้เปิดเผยข้อมูลสาเหตุรากอย่างทันเวลาตามภาระผูกพันด้าน compliance ที่เกี่ยวข้อง","ระงับสัญญากับผู้ขายระหว่างรอการตรวจสอบความปลอดภัยอย่างเป็นทางการ เพื่อแสดงความจริงจังของความล้มเหลวด้านการสื่อสาร","บันทึกช่องว่างการสื่อสารใน incident log และรอต่อไปจนวงจรการตอบสนองมาตรฐานของผู้ขายเสร็จสิ้น"],"ans":"A","exp":"The lesson states that during incidents, vendors must deliver timely updates and collaborate closely, and that clear escalation paths are essential for transparency and proactive problem-solving. When standard communication channels fail during an active incident, escalation paths exist precisely to engage higher-level vendor resources who can accelerate response. Suspending a contract mid-incident would disrupt the resolution effort. Waiting passively prolongs exposure. Contacting the vendor's regulator is inappropriate and outside the customer organization's role during an operational incident.","expth":"บทเรียนระบุว่าระหว่างเหตุการณ์ ผู้ขายต้องให้ข้อมูลอัปเดตทันเวลาและร่วมมืออย่างใกล้ชิด และช่องทาง escalation ที่ชัดเจนเป็นสิ่งจำเป็นต่อความโปร่งใสและการแก้ปัญหาเชิงรุก เมื่อช่องทางสื่อสารมาตรฐานล้มเหลวระหว่างเหตุการณ์ที่กำลังดำเนินอยู่ ช่องทาง escalation มีไว้เพื่อดึงทรัพยากรระดับสูงของผู้ขายที่เร่งการตอบสนองได้โดยเฉพาะ การระงับสัญญาระหว่างเหตุการณ์จะรบกวนความพยายามแก้ไข การรอเฉย ๆ ยืดเวลาการเปิดเผย และการติดต่อหน่วยงานกำกับของผู้ขายไม่เหมาะสมและอยู่นอกบทบาทขององค์กรลูกค้าระหว่างเหตุการณ์เชิงปฏิบัติการ"},{"id":170379717,"n":74,"d":5,"o":"5.5","q":"Your organization operates a cloud-based platform in the European Union and discovers a data breach affecting customer personal data at 9:00 AM on a Monday. The legal team confirms the breach meets the notification threshold under applicable regulation. What is the MOST appropriate action regarding regulatory communication?","qth":"องค์กรของคุณดำเนินแพลตฟอร์มบนคลาวด์ในสหภาพยุโรป และพบการละเมิดข้อมูลที่กระทบข้อมูลส่วนบุคคลของลูกค้าเวลา 9:00 น. วันจันทร์ ทีมกฎหมายยืนยันว่าการละเมิดถึงเกณฑ์การแจ้งเตือนตามกฎระเบียบที่ใช้บังคับ การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) เกี่ยวกับการสื่อสารกับหน่วยงานกำกับคืออะไร","a":["Engage legal counsel to assess whether the breach is material enough to warrant regulatory notification before initiating any reporting","Notify affected customers first, then report to regulators once the full scope and root cause have been confirmed through a complete investigation","Issue a public statement within 24 hours and treat that disclosure as satisfying the organization's regulatory notification obligation","Notify the relevant regulatory authority within 72 hours of discovery, providing specific details about the incident as required"],"ath":["ให้ที่ปรึกษากฎหมายประเมินว่าการละเมิดมีนัยสำคัญพอที่จะต้องแจ้งหน่วยงานกำกับหรือไม่ ก่อนเริ่มการรายงานใด ๆ","แจ้งลูกค้าที่ได้รับผลกระทบก่อน แล้วจึงรายงานหน่วยงานกำกับเมื่อยืนยันขอบเขตและสาเหตุรากผ่านการสืบสวนอย่างสมบูรณ์แล้ว","ออกแถลงการณ์สาธารณะภายใน 24 ชั่วโมง และถือการเปิดเผยนั้นว่าตอบภาระผูกพันการแจ้งหน่วยงานกำกับขององค์กร","แจ้งหน่วยงานกำกับที่เกี่ยวข้องภายใน 72 ชั่วโมงนับจากที่พบเหตุ โดยให้รายละเอียดเฉพาะของเหตุการณ์ตามที่กำหนด"],"ans":"D","exp":"The lesson explicitly states that under GDPR, organizations must notify regulators within 72 hours of discovering a data breach and include specific details about the incident. Notifying customers first and delaying regulatory reporting risks missing the mandatory deadline. Conducting a complete investigation before notifying regulators is not permitted under the 72-hour requirement. A public statement does not satisfy the obligation to notify the supervisory authority directly. The 72-hour threshold begins at discovery, not at conclusion of investigation.","expth":"บทเรียนระบุชัดว่าภายใต้ GDPR องค์กรต้องแจ้งหน่วยงานกำกับภายใน 72 ชั่วโมงนับจากที่พบการละเมิดข้อมูล และต้องระบุรายละเอียดเฉพาะของเหตุการณ์ การแจ้งลูกค้าก่อนและเลื่อนการรายงานหน่วยงานกำกับเสี่ยงต่อการพลาดกำหนดเวลาบังคับ การสืบสวนให้สมบูรณ์ก่อนแจ้งหน่วยงานกำกับไม่ได้รับอนุญาตภายใต้ข้อกำหนด 72 ชั่วโมง แถลงการณ์สาธารณะไม่ตอบภาระผูกพันที่ต้องแจ้งหน่วยงานกำกับดูแลโดยตรง และเกณฑ์ 72 ชั่วโมงเริ่มนับจากการพบเหตุ ไม่ใช่เมื่อสิ้นสุดการสืบสวน"},{"id":170379719,"n":75,"d":5,"o":"5.6","q":"A SIEM correlation engine generates an alert showing that a user account experienced three failed login attempts, then a successful login five minutes later from the same IP address, followed by a large outbound data transfer from a storage bucket. The security analyst must determine what attack pattern this sequence most likely represents. What is the MOST appropriate conclusion?","qth":"correlation engine ของ SIEM สร้างการแจ้งเตือนแสดงว่าบัญชีผู้ใช้หนึ่งล็อกอินล้มเหลวสามครั้ง จากนั้นล็อกอินสำเร็จห้านาทีต่อมาจาก IP address เดียวกัน ตามด้วยการถ่ายโอนข้อมูลขาออกจำนวนมากจาก storage bucket นักวิเคราะห์ความมั่นคงปลอดภัยต้องระบุว่าลำดับเหตุการณ์นี้น่าจะเป็นรูปแบบการโจมตีแบบใด ข้อสรุปที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["An insider threat, because the access originated from a familiar IP address already known to the organization.","A privilege escalation attempt, because the successful login followed by data access indicates the account gained elevated permissions.","A brute-force attack leading to data exfiltration, because the failed attempts followed by successful login and a large transfer match this pattern.","A denial-of-service precursor, because the repeated authentication attempts were designed to consume authentication service resources."],"ath":["ความพยายาม privilege escalation เพราะการล็อกอินสำเร็จตามด้วยการเข้าถึงข้อมูลบ่งชี้ว่าบัญชีได้รับสิทธิ์ที่สูงขึ้น","Insider threat เพราะการเข้าถึงมาจาก IP address ที่คุ้นเคยที่องค์กรรู้จักอยู่แล้ว","การโจมตีแบบ brute-force ที่นำไปสู่ data exfiltration เพราะความพยายามที่ล้มเหลวตามด้วยการล็อกอินสำเร็จและการถ่ายโอนข้อมูลจำนวนมากตรงกับรูปแบบนี้","ตัวนำของ denial-of-service เพราะความพยายามยืนยันตัวตนซ้ำ ๆ ออกแบบมาเพื่อใช้ทรัพยากรของบริการยืนยันตัวตน"],"ans":"C","exp":"The correlated sequence of repeated failed logins, a successful login shortly after from the same source, and a large outbound data transfer is the canonical SIEM pattern for a brute-force attack that succeeded and led to exfiltration. Privilege escalation involves gaining elevated permissions after access, not the retry-then-succeed login pattern. A familiar IP address does not confirm an insider threat and could reflect a compromised internal endpoint. Denial-of-service attacks involve resource exhaustion, not a successful login followed by data movement. SIEM correlation connects these events into a recognized attack chain.","expth":"ลำดับที่สัมพันธ์กัน ได้แก่ ล็อกอินล้มเหลวซ้ำ ๆ ล็อกอินสำเร็จไม่นานหลังจากแหล่งเดียวกัน และการถ่ายโอนข้อมูลขาออกจำนวนมาก คือรูปแบบมาตรฐานใน SIEM ของการโจมตีแบบ brute-force ที่สำเร็จและนำไปสู่ exfiltration Privilege escalation เกี่ยวกับการได้รับสิทธิ์ที่สูงขึ้นหลังเข้าถึงแล้ว ไม่ใช่รูปแบบลองซ้ำแล้วสำเร็จ IP address ที่คุ้นเคยไม่ยืนยัน insider threat และอาจสะท้อน endpoint ภายในที่ถูกเจาะ การโจมตี denial-of-service เกี่ยวกับการใช้ทรัพยากรจนหมด ไม่ใช่การล็อกอินสำเร็จตามด้วยการเคลื่อนย้ายข้อมูล การ correlate ของ SIEM เชื่อมเหตุการณ์เหล่านี้เป็น attack chain ที่ยอมรับ"},{"id":170379721,"n":76,"d":6,"o":"6.1","q":"A financial services company is responding to two simultaneous matters. In the first matter, the security team is reconstructing attacker behavior by analyzing CloudTrail logs to build a timeline of a data breach. In the second matter, the legal team has received a court order requiring the company to produce all employee communications related to a contract dispute. What is the MOST appropriate classification of each activity?","qth":"บริษัทบริการทางการเงินกำลังตอบสนองสองเรื่องพร้อมกัน ในเรื่องแรก ทีมความมั่นคงปลอดภัยกำลังสร้างเหตุการณ์ใหม่จากพฤติกรรมของผู้โจมตีโดยวิเคราะห์ CloudTrail log เพื่อสร้าง timeline ของการละเมิดข้อมูล ในเรื่องที่สอง ทีมกฎหมายได้รับคำสั่งศาลให้ส่งมอบการสื่อสารของพนักงานทั้งหมดที่เกี่ยวข้องกับข้อพิพาททางสัญญา การจัดประเภทที่เหมาะสมที่สุด (MOST appropriate) ของแต่ละกิจกรรมคืออะไร","a":["Both activities are digital forensics, because both involve analyzing digital data from cloud infrastructure to support an organizational proceeding.","The first activity is eDiscovery, because CloudTrail logs reconstruct legal timelines, and the second is digital forensics, because producing communications involves evidence handling.","Both activities are eDiscovery, because both require identifying and collecting electronically stored information from cloud systems.","The first activity is digital forensics, and the second activity is eDiscovery, because each has a distinct purpose, method, and legal driver."],"ath":["ทั้งสองกิจกรรมเป็น digital forensics เพราะทั้งคู่เกี่ยวกับการวิเคราะห์ข้อมูลดิจิทัลจากโครงสร้างพื้นฐานคลาวด์เพื่อสนับสนุนกระบวนการขององค์กร","กิจกรรมแรกเป็น eDiscovery เพราะ CloudTrail log สร้าง timeline ทางกฎหมายขึ้นใหม่ และกิจกรรมที่สองเป็น digital forensics เพราะการส่งมอบการสื่อสารเกี่ยวข้องกับการจัดการหลักฐาน","ทั้งสองกิจกรรมเป็น eDiscovery เพราะทั้งคู่ต้องระบุและเก็บรวบรวมข้อมูลที่จัดเก็บทางอิเล็กทรอนิกส์จากระบบคลาวด์","กิจกรรมแรกเป็น digital forensics และกิจกรรมที่สองเป็น eDiscovery เพราะแต่ละกิจกรรมมีวัตถุประสงค์ วิธีการ และปัจจัยขับเคลื่อนทางกฎหมายที่ต่างกัน"],"ans":"D","exp":"Forensics investigates incidents and analyzes attacker behavior, such as reconstructing a breach timeline from CloudTrail logs. eDiscovery identifies, preserves, and produces electronically stored information for legal or regulatory use, such as responding to a court order for employee communications. These activities have distinct purposes, methods, and legal drivers. Classifying both as eDiscovery incorrectly collapses them despite their different investigative purposes. Classifying both as digital forensics overlooks that the second activity is a legal production obligation. Swapping the two classifications reverses them entirely.","expth":"Forensics สืบสวนเหตุการณ์และวิเคราะห์พฤติกรรมของผู้โจมตี เช่น การสร้าง timeline ของการละเมิดจาก CloudTrail log ส่วน eDiscovery ระบุ รักษา และส่งมอบข้อมูลที่จัดเก็บทางอิเล็กทรอนิกส์เพื่อใช้ทางกฎหมายหรือกำกับดูแล เช่น การตอบคำสั่งศาลให้ส่งมอบการสื่อสารของพนักงาน กิจกรรมทั้งสองมีวัตถุประสงค์ วิธีการ และปัจจัยขับเคลื่อนทางกฎหมายที่แตกต่างกัน การจัดทั้งคู่เป็น eDiscovery รวมสองกิจกรรมอย่างผิด ๆ ทั้งที่วัตถุประสงค์เชิงสืบสวนต่างกัน การจัดทั้งคู่เป็น digital forensics มองข้ามว่ากิจกรรมที่สองเป็นภาระผูกพันการส่งมอบทางกฎหมาย และการสลับการจัดประเภทเป็นการกลับความหมายทั้งหมด"},{"id":170379723,"n":77,"d":6,"o":"6.1","q":"A company receives notice of pending litigation involving employee communications from the previous 18 months. The legal team issues a formal legal hold two weeks after receiving the notice. During those two weeks, the company's automated data lifecycle policies deleted a substantial number of relevant email records and collaboration platform messages under the normal 90-day retention schedule. The legal team argues the hold was issued in good faith. What is the PRIMARY concern with this outcome?","qth":"บริษัทได้รับแจ้งเรื่องคดีความที่กำลังจะเกิดขึ้น ซึ่งเกี่ยวข้องกับการสื่อสารของพนักงานในช่วง 18 เดือนที่ผ่านมา ฝ่ายกฎหมายออก legal hold อย่างเป็นทางการหลังได้รับแจ้งไปสองสัปดาห์ ในช่วงสองสัปดาห์นั้น นโยบาย data lifecycle อัตโนมัติของบริษัทได้ลบบันทึกอีเมลและข้อความบนแพลตฟอร์ม collaboration ที่เกี่ยวข้องจำนวนมากตามรอบ retention ปกติ 90 วัน ฝ่ายกฎหมายอ้างว่าการออก hold เป็นไปโดยสุจริต ข้อกังวลหลัก (PRIMARY) ของผลลัพธ์นี้คืออะไร","a":["The two-week delay before issuing the legal hold allowed normal data lifecycle processes to delete records that may have been relevant to the litigation.","The legal hold was issued without first completing a data inventory, meaning the hold scope may not have covered all relevant data locations.","The legal team failed to coordinate with cloud provider support teams before issuing the hold, which is required when relevant data resides in SaaS platforms.","The company's 90-day retention schedule is shorter than the minimum required under ISO/IEC 27050, which specifies a longer baseline retention period."],"ath":["การล่าช้าสองสัปดาห์ก่อนออก legal hold ทำให้กระบวนการ data lifecycle ปกติลบบันทึกที่อาจเกี่ยวข้องกับคดีไปแล้ว","legal hold ถูกออกโดยไม่ได้ทำ data inventory ให้เสร็จก่อน ทำให้ขอบเขตของ hold อาจไม่ครอบคลุมทุกแหล่งที่เก็บข้อมูลที่เกี่ยวข้อง","ฝ่ายกฎหมายไม่ได้ประสานงานกับทีม support ของ cloud provider ก่อนออก hold ซึ่งเป็นข้อกำหนดเมื่อข้อมูลที่เกี่ยวข้องอยู่บนแพลตฟอร์ม SaaS","retention schedule 90 วันของบริษัทสั้นกว่าข
