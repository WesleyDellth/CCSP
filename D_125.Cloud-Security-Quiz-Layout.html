/* ---------- storage (safe when localStorage is blocked) ---------- */
const ls = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
function loadState(){
  const base = {answers:{},flags:{},last:null,scope:'all',exam:false};
  try{ return Object.assign(base, JSON.parse(ls.get(KEY)||'{}')); }catch(e){ return base; }
}
const state = loadState();
function save(){ ls.set(KEY, JSON.stringify(state)); }

let lang = ls.get(LANGKEY) || 'both';          // en | th | both
if(!['en','th','both'].includes(lang)) lang = 'both';
let view = 'home';                              // home | quiz | results
let shuffleOn = false;
let order = BANK.map((_,i)=>i);
let idx = 0;
let cur = null;                                 // item currently shown in quiz view

const ui = () => lang==='th' ? UI.th : UI.en;
const t = (k, v) => { let s = ui()[k]; if(v) for(const x in v) s = s.replace('{'+x+'}', v[x]); return s; };
const showEN = () => lang==='en' || lang==='both';
const showTH = () => lang==='th' || lang==='both';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function bi(en, th){
  if(lang==='th') return '<span class="en">'+esc(th||en)+'</span>';
  if(lang==='en') return '<span class="en">'+esc(en)+'</span>';
  return '<span class="en">'+esc(en)+'</span>'+(th?'<span class="th">'+esc(th)+'</span>':'');
}
const domName = d => lang==='th' ? DOM[d].th : DOM[d].en;
const isOk = it => { const s = state.answers[it.id]; return !!s && s.pick===it.ans; };
const inScope = it => state.scope==='all' || it.d===Number(state.scope);

/* ---------- lists ---------- */
function currentList(){
  const q = ($('search').value||'').toLowerCase().trim();
  let f = $('filter').value;
  if(state.exam && (f==='wrong' || f==='right')) f = 'all';
  return order.filter(i=>{
    const it = BANK[i];
    if(!inScope(it)) return false;
    if(q){
      const blob = (it.q+' '+it.qth+' '+it.a.join(' ')+' '+it.ath.join(' ')).toLowerCase();
      if(!blob.includes(q)) return false;
    }
    const st = state.answers[it.id], flagged = !!state.flags[it.id];
    if(f==='unseen' && st) return false;
    if(f==='flagged' && !flagged) return false;
    if(f==='wrong' && !(st && st.pick!==it.ans)) return false;
    if(f==='right' && !(st && st.pick===it.ans)) return false;
    return true;
  });
}
function buildOrder(){
  const o = BANK.map((_,i)=>i);
  if(shuffleOn){ for(let i=o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } }
  return o;
}
function firstUnanswered(list){
  for(const i of list){ if(!state.answers[BANK[i].id]) return i; }
  return list[0];
}

/* ---------- views ---------- */
function setView(v){
  view = v;
  ['home','quiz','results'].forEach(n => { $(n+'View').hidden = (n!==v); });
  render();
  window.scrollTo(0,0);
}
function render(){
  applyChrome();
  renderStats();
  if(view==='home') renderHome();
  else if(view==='results') renderResults();
  else renderQuiz();
}

function applyChrome(){
  const u = ui();
  $('title').textContent = u.title;
  $('subtitle').textContent = u.subtitle;
  $('lblQ').textContent = u.q; $('lblScore').textContent = u.score; $('lblAns').textContent = u.ans;
  $('lblAcc').textContent = u.acc; $('lblTr').textContent = u.tr;
  $('chipQ').hidden = (view!=='quiz');
  $('brand').setAttribute('aria-label', u.home);
  $('homeBtn').textContent = u.home;
  $('prevBtn').textContent = u.prev;
  $('jumpH').textContent = u.jump; $('exph').textContent = u.expl; $('keys').textContent = u.keys;
  $('shuffleBtn').textContent = shuffleOn ? u.shuffleOn : u.shuffleOff;
  $('resetBtn').textContent = u.reset;
  $('examBtn').textContent = state.exam ? u.examOn : u.examOff;
  $('finishBtn').textContent = u.finish;
  $('finishBtn').hidden = !state.exam;
  $('examNote').textContent = u.examNote;
  $('examNote').hidden = !(view==='quiz' && state.exam);
  $('disc').textContent = u.disc;
  $('langEN').classList.toggle('on', lang==='en');
  $('langTH').classList.toggle('on', lang==='th');
  $('langBOTH').classList.toggle('on', lang==='both');
  document.documentElement.lang = lang==='th' ? 'th' : 'en';

  // domain select (rebuilt so labels follow the language)
  const sc = $('scope');
  let opts = '<option value="all">'+esc(u.allDomains)+'</option>';
  for(let d=1; d<=6; d++) opts += '<option value="'+d+'">'+esc(u.domain+' '+d+' · '+domName(d))+'</option>';
  sc.innerHTML = opts; sc.value = String(state.scope);
  // in exam mode the answer-revealing filters are unavailable
  $('filter').querySelector('[value=wrong]').disabled = state.exam;
  $('filter').querySelector('[value=right]').disabled = state.exam;
  if(state.exam && ($('filter').value==='wrong' || $('filter').value==='right')) $('filter').value = 'all';
}

function renderStats(){
  let right=0, done=0, tr=0;
  BANK.forEach(it=>{
    const st = state.answers[it.id];
    if(st){ done++; if(st.pick===it.ans) right++; }
    if(it.qth) tr++;
  });
  $('score').textContent = state.exam ? '—' : right;
  $('answered').textContent = done+'/'+BANK.length;
  $('acc').textContent = (!state.exam && done) ? Math.round(right/done*100)+'%' : '—';
  $('trcount').textContent = tr+'/'+BANK.length;
  $('bar').style.width = (done/BANK.length*100)+'%';
}

/* ---------- home ---------- */
function domStats(d){
  const items = BANK.filter(it => d==='all' || it.d===d);
  let done=0, right=0;
  items.forEach(it=>{ const s=state.answers[it.id]; if(s){ done++; if(s.pick===it.ans) right++; } });
  return {total:items.length, done, right};
}
function statLine(s){
  let line = s.total+' '+t('qs')+' · '+s.done+' '+t('answered');
  if(!state.exam && s.done) line += ' · '+Math.round(s.right/s.done*100)+'% '+t('pctOk');
  return line;
}
function rowHTML(key, tile, wide, nameHtml, s){
  return '<button class="opt" type="button" data-act="scope" data-scope="'+key+'">'+
    '<span class="letter'+(wide?' wide':'')+'">'+esc(tile)+'</span>'+
    '<span class="optbody">'+nameHtml+'<span class="k">'+esc(statLine(s))+'</span>'+
    '<span class="mini"><i style="width:'+(s.total?s.done/s.total*100:0)+'%"></i></span></span></button>';
}
function renderHome(){
  const u = ui();
  const all = domStats('all');
  const lastItem = BANK.find(it => it.id===state.last);
  let html = '<div class="card">'+
    '<h2 class="home-h">'+esc(u.homeTitle)+'</h2>'+
    '<p class="home-p">'+esc(u.homeSub)+'</p>'+
    '<div class="mode-row"><div class="langbar" role="group" aria-label="Mode">'+
      '<button type="button" data-act="mode" data-mode="practice" class="'+(state.exam?'':'on')+'">'+esc(u.practice)+'</button>'+
      '<button type="button" data-act="mode" data-mode="exam" class="'+(state.exam?'on':'')+'">'+esc(u.exam)+'</button>'+
    '</div><span class="k">'+esc(state.exam?u.examHint:u.practiceHint)+'</span></div>'+
    '<div class="opts">'+
      rowHTML('all','All',true,bi(UI.en.allQ, UI.th.allQ),all);
  for(let d=1; d<=6; d++) html += rowHTML(String(d), String(d), false, bi(DOM[d].en, DOM[d].th), domStats(d));
  html += '</div><div class="btnrow">';
  if(all.done && lastItem) html += '<button class="btn primary" type="button" data-act="continue">'+esc(t('cont',{n:lastItem.n}))+'</button>';
  if(all.done && !state.exam) html += '<button class="btn" type="button" data-act="results">'+esc(u.viewResults)+'</button>';
  html += '<button class="btn" type="button" data-act="reset">'+esc(u.reset)+'</button></div></div>';
  $('homeView').innerHTML = html;
}
function startScope(sc){
  state.scope = String(sc);
  $('filter').value = 'all'; $('search').value = '';
  order = buildOrder();
  const list = currentList();
  idx = list.length ? firstUnanswered(list) : 0;
  if(list.length) state.last = BANK[idx].id;
  save(); setView('quiz');
}
function continueLast(){
  const it = BANK.find(x => x.id===state.last) || BANK[0];
  if(!inScope(it)) state.scope = 'all';
  $('filter').value = 'all'; $('search').value = '';
  order = buildOrder();
  idx = BANK.indexOf(it);
  save(); setView('quiz');
}

/* ---------- quiz ---------- */
function renderQuiz(){
  const u = ui();
  const list = currentList();
  const explain = $('explain');
  if(!list.length){
    cur = null;
    $('pos').textContent = 0; $('total').textContent = 0;
    $('qid').textContent = ''; $('qtext').textContent = u.noq; $('qth').textContent = '';
    $('opts').innerHTML = ''; explain.classList.remove('show');
    $('flagBtn').disabled = true; $('prevBtn').disabled = true; $('nextBtn').disabled = true;
    $('grid').innerHTML = '';
    return;
  }
  if(!list.includes(idx)) idx = list[0];
  const it = BANK[idx]; cur = it;
  state.last = it.id; save();
  const p = list.indexOf(idx), last = (p===list.length-1);

  $('pos').textContent = p+1; $('total').textContent = list.length;
  $('qid').textContent = 'Q'+it.n+' · '+u.domain+' '+it.d+' · '+domName(it.d);
  $('flagBtn').disabled = false;
  $('flagBtn').textContent = state.flags[it.id] ? u.flagOn : u.flagOff;

  if(lang==='th'){ $('qtext').textContent = it.qth || it.q; $('qth').textContent = ''; }
  else if(lang==='en'){ $('qtext').textContent = it.q; $('qth').textContent = ''; }
  else { $('qtext').textContent = it.q; $('qth').textContent = it.qth; }

  const answered = state.answers[it.id];
  const reveal = !!answered && !state.exam;
  let html = '';
  LETTERS.forEach((L,i)=>{
    let cls = 'opt';
    if(answered && answered.pick===L) cls += ' selected';
    if(reveal){
      if(L===it.ans) cls += ' correct';
      else if(answered.pick===L) cls += ' wrong';
      cls += ' locked';
    }
    let body;
    if(lang==='th') body = '<span class="en">'+esc(it.ath[i]||it.a[i])+'</span>';
    else if(lang==='en') body = '<span class="en">'+esc(it.a[i])+'</span>';
    else body = '<span class="en">'+esc(it.a[i])+'</span><span class="th">'+esc(it.ath[i])+'</span>';
    html += '<button class="'+cls+'" type="button" data-letter="'+L+'"><span class="letter">'+L+'</span><span class="optbody">'+body+'</span></button>';
  });
  $('opts').innerHTML = html;

  if(reveal){
    explain.classList.add('show');
    const ok = answered.pick===it.ans;
    let e = '<p><b>'+esc(ok?u.correct:u.incorrect)+'.</b> '+esc(u.sugg)+': <b>'+it.ans+'</b></p>';
    if(showEN()) e += '<p>'+esc(it.exp)+'</p>';
    if(showTH()) e += "<p style='color:var(--th)'>"+esc(it.expth)+'</p>';
    if(it.o) e += '<p class="k">Exam objective '+esc(it.o)+'</p>';
    if(!ok) e += '<p><button class="btn ghost" type="button" data-act="retry">'+esc(u.tryAgain)+'</button></p>';
    $('expbody').innerHTML = e;
  }else{
    explain.classList.remove('show');
  }

  $('prevBtn').disabled = (p===0);
  const nb = $('nextBtn');
  if(last){
    if(state.exam){ nb.textContent = u.next; nb.disabled = true; }
    else { nb.textContent = u.results; nb.disabled = false; }
  }else{ nb.textContent = u.next; nb.disabled = false; }
  renderGrid(list);
}
function renderGrid(list){
  let html = '';
  list.forEach(i=>{
    const it = BANK[i], st = state.answers[it.id];
    let cls = 'gbtn';
    if(i===idx) cls += ' cur';
    if(st) cls += state.exam ? ' ans' : (st.pick===it.ans ? ' ok' : ' no');
    if(state.flags[it.id]) cls += ' flag';
    html += '<button class="'+cls+'" type="button" data-i="'+i+'" aria-label="'+esc(ui().q+' '+it.n)+'">'+it.n+'</button>';
  });
  $('grid').innerHTML = html;
}
function choose(L){
  if(view!=='quiz' || !cur) return;
  const st = state.answers[cur.id];
  if(st && !state.exam) return;                 // practice: first answer counts, use Try again
  state.answers[cur.id] = {pick:L};
  save(); render();
  if(!state.exam){ const ex = $('explain'); if(ex.classList.contains('show') && ex.scrollIntoView) ex.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function step(d){
  const list = currentList(); const p = list.indexOf(idx);
  if(p<0) return;
  if(d>0 && p===list.length-1){ if(!state.exam) setView('results'); return; }
  const n = p+d; if(n<0 || n>=list.length) return;
  idx = list[n]; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function finishExam(){
  const un = BANK.filter(it => inScope(it) && !state.answers[it.id]).length;
  if(un && !confirm(t('confirmFinish',{n:un}))) return;
  state.exam = false; save();
  setView('results');
}

/* ---------- results ---------- */
function renderResults(){
  const u = ui();
  const items = BANK.filter(inScope);
  let c=0, w=0, n=0;
  items.forEach(it=>{ const s=state.answers[it.id]; if(!s) n++; else if(s.pick===it.ans) c++; else w++; });
  const total = items.length;
  const pct = total ? Math.floor(c/total*100) : 0;
  const passed = total>0 && c/total*100 >= PASS;
  const label = state.scope==='all' ? bi(UI.en.allQ, UI.th.allQ) : bi(u.domain+' '+state.scope+' · '+DOM[state.scope].en, DOM[state.scope].th);
  let rows = '';
  const doms = state.scope==='all' ? [1,2,3,4,5,6] : [Number(state.scope)];
  doms.forEach(d=>{
    const di = items.filter(it=>it.d===d); if(!di.length) return;
    const ok = di.filter(isOk).length, p = ok/di.length*100;
    rows += '<div class="drow"><div class="dtop"><span>'+esc(domName(d))+'</span><b>'+ok+'/'+di.length+'</b></div>'+
      '<div class="progress"><div class="bar'+(p<PASS?' low':'')+'" style="width:'+p+'%"></div></div></div>';
  });
  let html = '<div class="card">'+
    '<div class="qmeta"><span>'+esc(u.resTitle)+'</span></div>'+
    '<div>'+label+'</div>'+
    '<div class="big">'+pct+'%</div>'+
    '<p class="verdict '+(passed?'ok':'bad')+'">'+esc(passed?u.passed:u.notPassed)+' · '+esc(t('passmark',{p:PASS}))+'</p>'+
    '<p class="home-p">'+esc(t('tally',{c:c,t:total,w:w,u:n}))+'</p>'+
    '<h3 class="home-h" style="font-size:.95rem;margin-top:18px">'+esc(u.byDomain)+'</h3>'+rows+
    '<div class="btnrow">'+
      (w? '<button class="btn primary" type="button" data-act="review" data-f="wrong">'+esc(u.reviewWrong)+'</button>' : '')+
      (n? '<button class="btn" type="button" data-act="review" data-f="unseen">'+esc(u.reviewNone)+'</button>' : '')+
      '<button class="btn" type="button" data-act="home">'+esc(u.backHome)+'</button>'+
    '</div></div>';
  $('resultsView').innerHTML = html;
}

/* ---------- language ---------- */
function setLang(l){ lang = l; ls.set(LANGKEY, lang); render(); }
function cycleLang(){ setLang(lang==='en' ? 'th' : lang==='th' ? 'both' : 'en'); }

/* ---------- wiring ---------- */
$('langEN').onclick = () => setLang('en');
$('langTH').onclick = () => setLang('th');
$('langBOTH').onclick = () => setLang('both');
$('brand').addEventListener('click', () => setView('home'));
$('brand').addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); setView('home'); } });
$('homeBtn').onclick = () => setView('home');
$('prevBtn').onclick = () => step(-1);
$('nextBtn').onclick = () => step(1);
$('finishBtn').onclick = finishExam;
$('flagBtn').onclick = () => {
  if(!cur) return;
  if(state.flags[cur.id]) delete state.flags[cur.id]; else state.flags[cur.id] = true;
  save(); render();
};
$('search').addEventListener('input', render);
$('filter').addEventListener('change', () => { const l = currentList(); if(l.length) idx = l[0]; render(); });
$('scope').addEventListener('change', () => {
  state.scope = $('scope').value; save();
  const l = currentList(); if(l.length) idx = firstUnanswered(l);
  render();
});
$('shuffleBtn').onclick = () => {
  shuffleOn = !shuffleOn; order = buildOrder();
  const l = currentList(); if(l.length) idx = l[0];
  render();
};
$('resetBtn').onclick = () => {
  if(confirm(t('confirmReset'))){ state.answers = {}; state.flags = {}; state.last = null; save(); render(); }
};
$('examBtn').onclick = () => {
  state.exam = !state.exam;
  if(state.exam && ($('filter').value==='wrong' || $('filter').value==='right')) $('filter').value = 'all';
  save(); render();
};
$('opts').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if(b) choose(b.getAttribute('data-letter'));
});
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.gbtn'); if(!b) return;
  idx = Number(b.getAttribute('data-i')); render(); window.scrollTo({top:0,behavior:'smooth'});
});
$('expbody').addEventListener('click', e => {
  if(e.target.closest('[data-act=retry]') && cur){ delete state.answers[cur.id]; save(); render(); }
});
$('homeView').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.getAttribute('data-act');
  if(a==='scope') startScope(b.getAttribute('data-scope'));
  else if(a==='mode'){ state.exam = (b.getAttribute('data-mode')==='exam'); save(); render(); }
  else if(a==='continue') continueLast();
  else if(a==='results') setView('results');
  else if(a==='reset'){ if(confirm(t('confirmReset'))){ state.answers={}; state.flags={}; state.last=null; save(); render(); } }
});
$('resultsView').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.getAttribute('data-act');
  if(a==='home') setView('home');
  else if(a==='review'){
    state.exam = false; save();
    $('filter').value = b.getAttribute('data-f'); $('search').value = '';
    order = buildOrder();
    const l = currentList(); idx = l.length ? l[0] : 0;
    setView('quiz');
  }
});
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  const k = e.key.toUpperCase();
  if(k==='T'){ cycleLang(); return; }
  if(k==='H'){ if(view!=='home') setView('home'); return; }
  if(view!=='quiz') return;
  if(k.length===1 && 'ABCD'.includes(k)) choose(k);
  else if(k==='N' || e.key==='ArrowRight') step(1);
  else if(k==='P' || e.key==='ArrowLeft') step(-1);
  else if(k==='F') $('flagBtn').click();
});

render();
})();
</script>
</body>
</html>
