ข้ากับบุคคล SHA-256 เพียงอย่างเดียวให้ integrity แต่ระบุไม่ได้ว่าใครอนุมัติธุรกรรม การเข้ารหัสด้วย public key จำกัดการเข้าถึงแต่ไม่สร้างบันทึกว่าใครเป็นผู้กระทำ"},{"id":170379617,"n":24,"d":2,"o":"2.3","q":"A financial services company hosts a machine learning analytics platform in a shared cloud environment. Regulators require that customer data remain encrypted at all times, including during computation, to prevent the cloud provider's internal staff from accessing raw data during processing. What cryptographic technique BEST meets this requirement?","qth":"บริษัทบริการทางการเงินโฮสต์แพลตฟอร์มวิเคราะห์ด้วย machine learning ในสภาพแวดล้อมคลาวด์แบบใช้ร่วมกัน หน่วยงานกำกับกำหนดให้ข้อมูลลูกค้าต้องถูกเข้ารหัสตลอดเวลา รวมถึงระหว่างการคำนวณ เพื่อป้องกันเจ้าหน้าที่ภายในของผู้ให้บริการคลาวด์เข้าถึงข้อมูลดิบระหว่างการประมวลผล เทคนิคการเข้ารหัสใดตอบข้อกำหนดนี้ได้ดีที่สุด (BEST)","a":["AES encryption with customer-managed keys stored in a dedicated hardware security module to maintain customer control over decryption","End-to-end encryption to ensure data remains protected from the source system to the analytics platform","Homomorphic encryption, which allows computations to be performed on encrypted data without decrypting it","TLS encryption to secure the data channel between the customer's system and the cloud provider's analytics environment"],"ath":["การเข้ารหัส AES ด้วยกุญแจที่ลูกค้าจัดการเอง เก็บใน hardware security module เฉพาะ เพื่อรักษาการควบคุมการถอดรหัสไว้กับลูกค้า","End-to-end encryption เพื่อให้ข้อมูลได้รับการปกป้องตั้งแต่ระบบต้นทางจนถึงแพลตฟอร์มวิเคราะห์","Homomorphic encryption ซึ่งอนุญาตให้คำนวณบนข้อมูลที่เข้ารหัสอยู่ได้โดยไม่ต้องถอดรหัส","การเข้ารหัส TLS เพื่อรักษาความปลอดภัยของช่องทางข้อมูลระหว่างระบบของลูกค้ากับสภาพแวดล้อมวิเคราะห์ของผู้ให้บริการคลาวด์"],"ans":"C","exp":"Homomorphic encryption allows computations to run on ciphertext without decryption, which is the only technique satisfying the requirement that data remain encrypted during active processing. Customer-managed keys in an HSM control who holds the decryption key but still require decryption before computation can occur, failing the regulatory constraint. End-to-end encryption protects data in transit, not during processing. TLS secures the communication channel only and provides no protection once data reaches the processing environment.","expth":"Homomorphic encryption อนุญาตให้คำนวณบน ciphertext โดยไม่ต้องถอดรหัส เป็นเทคนิคเดียวที่ตอบข้อกำหนดว่าข้อมูลต้องคงถูกเข้ารหัสระหว่างการประมวลผลจริง กุญแจที่ลูกค้าจัดการใน HSM ควบคุมว่าใครถือกุญแจถอดรหัส แต่ยังต้องถอดรหัสก่อนคำนวณ จึงไม่ผ่านข้อจำกัดของหน่วยงานกำกับ End-to-end encryption ปกป้องข้อมูลระหว่างส่ง ไม่ใช่ระหว่างประมวลผล ส่วน TLS รักษาความปลอดภัยเฉพาะช่องทางสื่อสาร และไม่ปกป้องข้อมูลเมื่อไปถึงสภาพแวดล้อมประมวลผลแล้ว"},{"id":170379619,"n":25,"d":2,"o":"2.3","q":"During a security review, the team discovers that attackers obtained a copy of the password hash database and are using precomputed tables of hash values to reverse hashes to plaintext passwords. The current hashing implementation does not include any input modification before hashing. What is the BEST defense against this specific attack?","qth":"ระหว่างการทบทวนด้านความมั่นคงปลอดภัย ทีมพบว่าผู้โจมตีได้สำเนาฐานข้อมูล password hash และใช้ตารางค่า hash ที่คำนวณไว้ล่วงหน้า (precomputed table) เพื่อย้อนกลับ hash เป็นรหัสผ่านแบบข้อความธรรมดา การ implement hashing ปัจจุบันไม่มีการปรับแต่งอินพุตก่อน hash ใด ๆ วิธีป้องกันที่ดีที่สุด (BEST) ต่อการโจมตีเฉพาะนี้คืออะไร","a":["Implementing salting by adding random data to each password before hashing, making precomputed tables ineffective","Enforcing multi-factor authentication so that password hashes alone cannot be used to authenticate to systems","Migrating to certificate-based authentication to eliminate hashed passwords from the environment entirely","Switching from SHA-256 to SHA-512, because a longer hash output increases the size of any precomputed table an attacker would need"],"ath":["ใช้ salting โดยเพิ่มข้อมูลสุ่มให้รหัสผ่านแต่ละตัวก่อน hash ทำให้ precomputed table ใช้ไม่ได้ผล","บังคับใช้ multi-factor authentication เพื่อให้ password hash อย่างเดียวใช้ยืนยันตัวตนกับระบบไม่ได้","เปลี่ยนไปใช้ certificate-based authentication เพื่อกำจัด hashed password ออกจากสภาพแวดล้อมทั้งหมด","เปลี่ยนจาก SHA-256 เป็น SHA-512 เพราะเอาต์พุต hash ที่ยาวขึ้นทำให้ precomputed table ที่ผู้โจมตีต้องใช้มีขนาดใหญ่ขึ้น"],"ans":"A","exp":"The described attack is a rainbow table attack. Salting adds a unique random value to each password before hashing, ensuring identical passwords produce different hash outputs and rendering precomputed tables useless against the database. Switching hash algorithms increases the cost of building new tables but does not neutralize existing precomputed ones. Enforcing MFA reduces exploitation risk but does not address the root vulnerability in the hashing implementation. Certificate-based authentication is an architectural replacement, not a targeted defense against this attack.","expth":"การโจมตีที่อธิบายคือ rainbow table attack Salting เพิ่มค่าสุ่มที่ไม่ซ้ำกันให้รหัสผ่านแต่ละตัวก่อน hash ทำให้รหัสผ่านเดียวกันได้ผลลัพธ์ hash ต่างกัน และทำให้ precomputed table ไร้ประโยชน์ต่อฐานข้อมูลนี้ การเปลี่ยนอัลกอริทึม hash เพิ่มต้นทุนการสร้างตารางใหม่ แต่ไม่ลบล้างตารางที่คำนวณไว้แล้ว MFA ลดความเสี่ยงการใช้ประโยชน์ แต่ไม่แก้ช่องโหว่รากของการ implement hashing ส่วน certificate-based authentication เป็นการแทนที่เชิงสถาปัตยกรรม ไม่ใช่การป้องกันที่ตรงเป้าต่อการโจมตีนี้"},{"id":170379621,"n":26,"d":2,"o":"2.4","q":"A security team is evaluating discovery tools for a cloud environment that contains customer CRM records in a relational database, configuration files stored as JSON, and video recordings of customer support calls. Which approach BEST addresses the discovery requirements across all three data types?","qth":"ทีมความมั่นคงปลอดภัยกำลังประเมินเครื่องมือ discovery สำหรับสภาพแวดล้อมคลาวด์ที่มีระเบียนลูกค้า CRM ในฐานข้อมูลเชิงสัมพันธ์ ไฟล์ตั้งค่าในรูปแบบ JSON และวิดีโอบันทึกการโทรฝ่ายสนับสนุนลูกค้า แนวทางใดตอบข้อกำหนด discovery สำหรับข้อมูลทั้งสามประเภทได้ดีที่สุด (BEST)","a":["Use SQL queries for the CRM records, specialized parsing tools for the JSON files, and AI-powered scanning for the video recordings.","Apply OLAP (Online Analytical Processing) queries uniformly, since OLAP tools analyze all data types at high speeds across large datasets.","Apply metadata analysis to all three types, since metadata provides sufficient context to classify any data format.","Use scanning and crawling exclusively, since these tools locate all data regardless of structure or format."],"ath":["ใช้ SQL query สำหรับระเบียน CRM เครื่องมือ parsing เฉพาะทางสำหรับไฟล์ JSON และการสแกนด้วย AI สำหรับวิดีโอบันทึก","ใช้ OLAP (Online Analytical Processing) query กับทุกประเภท เพราะเครื่องมือ OLAP วิเคราะห์ข้อมูลทุกประเภทได้เร็วบนชุดข้อมูลขนาดใหญ่","ใช้ metadata analysis กับทั้งสามประเภท เพราะ metadata ให้บริบทเพียงพอสำหรับจัดประเภทข้อมูลทุกรูปแบบ","ใช้ scanning และ crawling เพียงอย่างเดียว เพราะเครื่องมือเหล่านี้ค้นหาข้อมูลได้ไม่ว่าโครงสร้างหรือรูปแบบใด"],"ans":"A","exp":"Effective cloud data discovery requires matching the tool to the data type. Structured data in relational databases is addressed with SQL queries. Semi-structured data such as JSON requires specialized parsing tools. Unstructured data like video requires AI-powered scanning. OLAP is designed for structured analytical workloads and cannot process video or semi-structured content. Scanning and crawling locate data but cannot classify unstructured binary content. Metadata analysis provides context but cannot substitute for content-level inspection of video or complex file formats.","expth":"Cloud data discovery ที่มีประสิทธิผลต้องเลือกเครื่องมือให้ตรงกับประเภทข้อมูล ข้อมูลมีโครงสร้างในฐานข้อมูลเชิงสัมพันธ์ใช้ SQL query ข้อมูลกึ่งโครงสร้างอย่าง JSON ต้องใช้เครื่องมือ parsing เฉพาะทาง และข้อมูลไม่มีโครงสร้างอย่างวิดีโอต้องใช้การสแกนด้วย AI OLAP ออกแบบสำหรับ workload วิเคราะห์ข้อมูลมีโครงสร้าง ประมวลผลวิดีโอหรือเนื้อหากึ่งโครงสร้างไม่ได้ Scanning และ crawling ค้นหาข้อมูลได้แต่จัดประเภทเนื้อหาไบนารีที่ไม่มีโครงสร้างไม่ได้ ส่วน metadata analysis ให้บริบทแต่ทดแทนการตรวจเนื้อหาระดับ content ของวิดีโอหรือรูปแบบไฟล์ซับซ้อนไม่ได้"},{"id":170379623,"n":27,"d":2,"o":"2.4","q":"A multinational organization stores customer data across cloud regions in Europe, Asia, and North America. A regulatory audit reveals that certain data categories must remain within specific national borders, but the organization has no documented process for confirming where the cloud provider stores its data. What is the MOST appropriate action to address this compliance gap?","qth":"องค์กรข้ามชาติจัดเก็บข้อมูลลูกค้าข้าม region คลาวด์ในยุโรป เอเชีย และอเมริกาเหนือ การตรวจสอบของหน่วยงานกำกับพบว่าข้อมูลบางประเภทต้องอยู่ภายในพรมแดนประเทศที่กำหนด แต่องค์กรไม่มีกระบวนการที่เป็นเอกสารเพื่อยืนยันว่าผู้ให้บริการคลาวด์เก็บข้อมูลไว้ที่ใด การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) เพื่อแก้ช่องว่างด้าน compliance นี้คืออะไร","a":["Implement anomaly detection tools to monitor access patterns and flag cross-border data movement in real time","Select providers with transparent data residency policies and verify compliance with the laws governing data in each jurisdiction","Migrate all data to a single cloud region to eliminate cross-border residency risk","Encrypt all stored data with customer-managed keys to ensure data remains inaccessible regardless of location"],"ath":["ติดตั้งเครื่องมือ anomaly detection เพื่อเฝ้าติดตามรูปแบบการเข้าถึงและแจ้งเตือนการเคลื่อนย้ายข้อมูลข้ามพรมแดนแบบ real time","เลือกผู้ให้บริการที่มีนโยบาย data residency โปร่งใส และตรวจสอบการปฏิบัติตามกฎหมายที่กำกับข้อมูลในแต่ละเขตอำนาจ","ย้ายข้อมูลทั้งหมดไปยัง region คลาวด์เดียวเพื่อกำจัดความเสี่ยงด้าน residency ข้ามพรมแดน","เข้ารหัสข้อมูลที่จัดเก็บทั้งหมดด้วยกุญแจที่ลูกค้าจัดการเอง เพื่อให้ข้อมูลเข้าถึงไม่ได้ไม่ว่าจะอยู่ที่ใด"],"ans":"B","exp":"When an organization cannot confirm where data is physically stored, the correct response is to select providers that publish transparent data residency policies and to verify that storage practices comply with the applicable laws of each jurisdiction. Encryption protects data confidentiality but does not satisfy residency requirements. Regulators require data to be located within borders, not merely inaccessible across them. Consolidating to one region may be operationally impractical and may itself violate residency rules in other jurisdictions. Anomaly detection monitors behavioral patterns but does not establish or verify where data physically resides.","expth":"เมื่อองค์กรยืนยันไม่ได้ว่าข้อมูลถูกจัดเก็บทางกายภาพที่ใด การตอบสนองที่ถูกต้องคือเลือกผู้ให้บริการที่เผยแพร่นโยบาย data residency อย่างโปร่งใส และตรวจสอบว่าแนวปฏิบัติการจัดเก็บสอดคล้องกับกฎหมายของแต่ละเขตอำนาจ การเข้ารหัสปกป้อง confidentiality แต่ไม่ตอบข้อกำหนด residency เพราะหน่วยงานกำกับต้องการให้ข้อมูลอยู่ในพรมแดน ไม่ใช่แค่เข้าถึงข้ามพรมแดนไม่ได้ การรวมเป็น region เดียวอาจไม่เหมาะเชิงปฏิบัติการและอาจละเมิดกฎ residency ของเขตอำนาจอื่น ส่วน anomaly detection เฝ้าติดตามพฤติกรรม แต่ไม่ได้ระบุหรือตรวจสอบตำแหน่งทางกายภาพของข้อมูล"},{"id":170379625,"n":28,"d":2,"o":"2.5","q":"A retail company's security team suspects that customer payment data is being exposed at some point after checkout but cannot identify where in the processing pipeline the exposure occurs. The data passes through an online storefront, a payment processor, and a cloud-based CRM system. What is the MOST appropriate action to identify where the risk exists?","qth":"ทีมความมั่นคงปลอดภัยของบริษัทค้าปลีกสงสัยว่าข้อมูลการชำระเงินของลูกค้าถูกเปิดเผย ณ จุดใดจุดหนึ่งหลังการชำระเงิน แต่ระบุไม่ได้ว่าอยู่ที่ขั้นตอนใดของ pipeline การประมวลผล ข้อมูลผ่านหน้าร้านออนไลน์ ตัวประมวลผลการชำระเงิน และระบบ CRM บนคลาวด์ การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) เพื่อระบุว่าความเสี่ยงอยู่ที่ใดคืออะไร","a":["Perform data mapping to trace how customer payment data flows across each system and document every point where it is stored or accessed.","Apply data labels to all files containing payment information and configure automated alerts for any unauthorized access attempts.","Conduct a penetration test against the cloud-based CRM system, as it is the most likely source of exposure in a multi-service architecture.","Update the data classification policy to add a new sensitivity level for payment data and assign stricter access controls."],"ath":["ทำ data mapping เพื่อไล่ตามการไหลของข้อมูลการชำระเงินลูกค้าข้ามแต่ละระบบ และบันทึกทุกจุดที่ข้อมูลถูกจัดเก็บหรือเข้าถึง","ติดป้ายข้อมูล (data label) ให้ไฟล์ทั้งหมดที่มีข้อมูลการชำระเงิน และตั้งค่าการแจ้งเตือนอัตโนมัติเมื่อมีการพยายามเข้าถึงโดยไม่ได้รับอนุญาต","ทำ penetration test กับระบบ CRM บนคลาวด์ เพราะมีแนวโน้มเป็นต้นตอการรั่วไหลมากที่สุดในสถาปัตยกรรมหลาย service","ปรับปรุงนโยบาย data classification โดยเพิ่มระดับความอ่อนไหวใหม่สำหรับข้อมูลการชำระเงิน และกำหนด access control ที่เข้มงวดขึ้น"],"ans":"A","exp":"Data mapping traces how data flows across systems, identifying where it is stored, who can access it, and what risks exist at each stage. This directly addresses the problem of an unknown exposure point across multiple services. Labeling and alerts are useful controls but cannot identify an unknown risk location. Updating the classification policy changes governance but does not reveal where in the pipeline the exposure occurs. A penetration test targets one system based on assumption rather than documenting the full flow to locate the actual risk.","expth":"Data mapping ไล่ตามการไหลของข้อมูลข้ามระบบ ระบุว่าข้อมูลถูกจัดเก็บที่ใด ใครเข้าถึงได้ และมีความเสี่ยงอะไรในแต่ละขั้นตอน จึงตอบปัญหาจุดรั่วไหลที่ไม่ทราบตำแหน่งข้าม service หลายตัวได้โดยตรง การติดป้ายและการแจ้งเตือนเป็นมาตรการที่มีประโยชน์ แต่ระบุตำแหน่งความเสี่ยงที่ไม่ทราบไม่ได้ การปรับนโยบาย classification เปลี่ยนการกำกับดูแลแต่ไม่เผยว่าการรั่วไหลเกิดที่ขั้นใดของ pipeline ส่วน penetration test เล็งเป้าระบบเดียวตามข้อสันนิษฐาน แทนที่จะบันทึกการไหลทั้งหมดเพื่อหาจุดเสี่ยงจริง"},{"id":170379627,"n":29,"d":2,"o":"2.5","q":"A financial services firm stores thousands of documents daily across multiple cloud platforms. The security team must enforce encryption and access restrictions on all files containing account numbers or tax identifiers, but the compliance team also requires that business operations not be slowed by manual review processes. A new regulation requires that any unclassified sensitive file discovered in storage must be reported within 24 hours. What is the BEST approach to meet all three constraints?","qth":"บริษัทบริการทางการเงินจัดเก็บเอกสารหลายพันฉบับต่อวันข้ามหลายแพลตฟอร์มคลาวด์ ทีมความมั่นคงปลอดภัยต้องบังคับใช้การเข้ารหัสและการจำกัดการเข้าถึงกับไฟล์ทั้งหมดที่มีเลขที่บัญชีหรือเลขประจำตัวผู้เสียภาษี แต่ทีม compliance ก็ต้องการให้การดำเนินธุรกิจไม่ช้าลงเพราะกระบวนการตรวจสอบด้วยมือ นอกจากนี้ กฎระเบียบใหม่กำหนดให้ไฟล์อ่อนไหวที่ไม่ได้จัดประเภทซึ่งถูกค้นพบใน storage ต้องรายงานภายใน 24 ชั่วโมง แนวทางที่ดีที่สุด (BEST) เพื่อตอบสนองข้อจำกัดทั้งสามข้อคืออะไร","a":["Configure access controls at the cloud platform level to restrict all document access by default, requiring employees to request permissions for each file individually.","Implement a data classification policy that defines sensitive data criteria and require employees to self-label documents at the time of creation.","Establish a dedicated team of data stewards to review all new documents daily, apply labels manually, and escalate unclassified sensitive files to the compliance team.","Deploy automated labeling tools that scan content for sensitive patterns, apply classification labels, and trigger enforcement policies without requiring manual review."],"ath":["กำหนดค่า access control ที่ระดับแพลตฟอร์มคลาวด์เพื่อจำกัดการเข้าถึงเอกสารทั้งหมดโดยค่าเริ่มต้น และให้พนักงานขอสิทธิ์รายไฟล์","กำหนดนโยบาย data classification ที่ระบุเกณฑ์ข้อมูลอ่อนไหว และกำหนดให้พนักงานติดป้ายเอกสารด้วยตนเองขณะสร้าง","ตั้งทีม data steward โดยเฉพาะเพื่อตรวจเอกสารใหม่ทุกวัน ติดป้ายด้วยมือ และยกระดับไฟล์อ่อนไหวที่ไม่ได้จัดประเภทให้ทีม compliance","ติดตั้งเครื่องมือ automated labeling ที่สแกนเนื้อหาหารูปแบบข้อมูลอ่อนไหว ติดป้ายจัดประเภท และกระตุ้นนโยบาย enforcement โดยไม่ต้องตรวจด้วยมือ"],"ans":"D","exp":"Automated labeling tools, such as Microsoft Purview or Google Cloud DLP, scan for sensitive patterns like account numbers and apply labels that trigger encryption and access restrictions automatically. This approach satisfies the security requirement, eliminates the bottleneck of manual review, and enables near-real-time detection of unclassified sensitive files to meet the 24-hour reporting window. Manual stewardship cannot scale to meet the volume or time constraint. Default-deny access controls address availability but not classification or discovery. Self-labeling by employees is inconsistent and does not satisfy the detection or compliance requirements.","expth":"เครื่องมือ automated labeling เช่น Microsoft Purview หรือ Google Cloud DLP สแกนหารูปแบบอ่อนไหวอย่างเลขที่บัญชี และติดป้ายที่กระตุ้นการเข้ารหัสและการจำกัดการเข้าถึงโดยอัตโนมัติ แนวทางนี้ตอบข้อกำหนดด้านความปลอดภัย ขจัดคอขวดของการตรวจด้วยมือ และตรวจพบไฟล์อ่อนไหวที่ไม่ได้จัดประเภทได้เกือบ real-time เพื่อให้ทันกรอบรายงาน 24 ชั่วโมง การให้ data steward ตรวจด้วยมือรองรับปริมาณหรือกรอบเวลานี้ไม่ได้ การจำกัดการเข้าถึงแบบ default-deny แก้เรื่อง availability ไม่ใช่การจัดประเภทหรือ discovery ส่วนการให้พนักงานติดป้ายเองไม่สม่ำเสมอและไม่ตอบข้อกำหนดด้านการตรวจพบและ compliance"},{"id":170379629,"n":30,"d":2,"o":"2.5","q":"A healthcare organization is migrating patient records to a cloud storage platform. The security team wants to ensure that all departments apply the same security controls and access restrictions to patient data, regardless of which cloud service handles it. What is the MOST effective way to achieve consistent data protection across the organization?","qth":"องค์กรสุขภาพกำลังย้ายเวชระเบียนผู้ป่วยไปยังแพลตฟอร์ม cloud storage ทีมความมั่นคงปลอดภัยต้องการให้ทุกแผนกใช้มาตรการควบคุมความปลอดภัยและการจำกัดการเข้าถึงเดียวกันกับข้อมูลผู้ป่วย ไม่ว่าจะใช้บริการคลาวด์ใดประมวลผล วิธีที่มีประสิทธิผลที่สุด (MOST effective) เพื่อให้เกิดการปกป้องข้อมูลที่สอดคล้องกันทั่วองค์กรคืออะไร","a":["Require all cloud services to use the same encryption algorithm and key length for data at rest.","Train all employees to manually review data before uploading it to cloud services and apply protections accordingly.","Deploy a cloud access security broker to monitor and enforce network-layer controls on all data in transit.","Implement a data classification policy that defines sensitivity levels and stakeholder responsibilities."],"ath":["กำหนดให้ทุก cloud service ใช้อัลกอริทึมและความยาวกุญแจการเข้ารหัสเดียวกันสำหรับข้อมูล at rest","อบรมพนักงานทั้งหมดให้ตรวจข้อมูลด้วยมือก่อนอัปโหลดไปยัง cloud service และใช้การป้องกันตามความเหมาะสม","ติดตั้ง cloud access security broker เพื่อเฝ้าติดตามและบังคับใช้การควบคุมระดับเครือข่ายกับข้อมูลทั้งหมดที่ส่งผ่าน","จัดทำนโยบาย data classification ที่กำหนดระดับความอ่อนไหวและความรับผิดชอบของผู้มีส่วนได้ส่วนเสีย"],"ans":"D","exp":"A data classification policy defines classification levels, the criteria for each, and the roles and responsibilities of stakeholders, providing the consistent framework needed to apply uniform security controls across the organization. A CASB operates at the network layer and does not address classification consistency across departments. Mandating uniform encryption addresses one control in isolation and does not govern the full range of protections tied to sensitivity levels. Manual employee review is unreliable at scale and produces inconsistent outcomes without a governing policy.","expth":"นโยบาย data classification กำหนดระดับการจัดประเภท เกณฑ์ของแต่ละระดับ และบทบาทกับความรับผิดชอบของผู้มีส่วนได้ส่วนเสีย จึงเป็นกรอบที่สอดคล้องกันที่จำเป็นในการใช้มาตรการควบคุมความปลอดภัยแบบเดียวกันทั่วองค์กร CASB ทำงานที่ชั้นเครือข่ายและไม่แก้ความสอดคล้องของ classification ข้ามแผนก การบังคับใช้การเข้ารหัสแบบเดียวกันแก้เพียงมาตรการเดียวโดยแยกส่วน และไม่ครอบคลุมการป้องกันทั้งหมดที่ผูกกับระดับความอ่อนไหว ส่วนการให้พนักงานตรวจด้วยมือไม่น่าเชื่อถือเมื่อขยายขนาด และให้ผลไม่สม่ำเสมอหากไม่มีนโยบายกำกับ"},{"id":170379631,"n":31,"d":2,"o":"2.7","q":"An organization subject to HIPAA is decommissioning SSDs from a cloud-adjacent data center. The drives are encrypted using self-encrypting drive technology. The security manager must ensure data is unrecoverable while minimizing decommissioning time. Leadership wants the drives reallocated to a lower-sensitivity environment rather than destroyed. What is the MOST appropriate sanitization method?","qth":"องค์กรที่อยู่ภายใต้ HIPAA กำลังปลดประจำการ SSD จากศูนย์ข้อมูลที่เชื่อมกับคลาวด์ ไดรฟ์เข้ารหัสด้วยเทคโนโลยี self-encrypting drive ผู้จัดการด้านความมั่นคงปลอดภัยต้องทำให้ข้อมูลกู้คืนไม่ได้ พร้อมลดเวลาการปลดประจำการให้น้อยที่สุด ฝ่ายบริหารต้องการให้นำไดรฟ์ไปจัดสรรใหม่ในสภาพแวดล้อมที่อ่อนไหวน้อยกว่า แทนที่จะทำลายทิ้ง วิธี sanitization ที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["Purging using degaussing, because degaussing disrupts magnetic domains and renders data unrecoverable even with laboratory techniques.","Clearing using zeroization, because overwriting storage media with zeros is sufficient to meet HIPAA requirements for encrypted drives being reallocated.","Cryptographic erasure by destroying the Media Encryption Key, because it renders the encrypted data inaccessible without requiring physical destruction.","Physical destruction through shredding, because destruction is the only method that guarantees data cannot be recovered from decommissioned drives."],"ath":["Purging ด้วยการ degaussing เพราะ degaussing รบกวน magnetic domain และทำให้ข้อมูลกู้คืนไม่ได้แม้ใช้เทคนิคในห้องปฏิบัติการ","Clearing ด้วย zeroization เพราะการเขียนทับสื่อจัดเก็บด้วยศูนย์เพียงพอต่อข้อกำหนด HIPAA สำหรับไดรฟ์เข้ารหัสที่จะนำไปจัดสรรใหม่","Cryptographic erasure โดยทำลาย Media Encryption Key เพราะทำให้ข้อมูลที่เข้ารหัสเข้าถึงไม่ได้โดยไม่ต้องทำลายทางกายภาพ","ทำลายทางกายภาพด้วยการ shredding เพราะการทำลายเป็นวิธีเดียวที่รับประกันว่ากู้คืนข้อมูลจากไดรฟ์ที่ปลดประจำการไม่ได้"],"ans":"C","exp":"Cryptographic erasure destroys the Media Encryption Key, rendering all data on a self-encrypting drive instantly inaccessible without physical destruction, satisfying both the HIPAA unrecoverability requirement and the reallocation constraint. Degaussing is ineffective on SSDs, which store data using flash memory rather than magnetic domains. Zeroization is a clearing technique suited to internal reuse scenarios but is not validated for encrypted SED environments under HIPAA. Physical destruction eliminates reallocation, which the scenario explicitly requires to be preserved as an option.","expth":"Cryptographic erasure ทำลาย Media Encryption Key ทำให้ข้อมูลทั้งหมดบน self-encrypting drive เข้าถึงไม่ได้ทันทีโดยไม่ต้องทำลายทางกายภาพ ตอบทั้งข้อกำหนดกู้คืนไม่ได้ของ HIPAA และข้อจำกัดเรื่องการจัดสรรใหม่ Degaussing ใช้ไม่ได้ผลกับ SSD ซึ่งเก็บข้อมูลด้วยหน่วยความจำแฟลชไม่ใช่ magnetic domain Zeroization เป็นเทคนิค clearing ที่เหมาะกับการนำกลับมาใช้ภายใน แต่ไม่ได้รับการยอมรับสำหรับสภาพแวดล้อม SED ภายใต้ HIPAA ส่วนการทำลายทางกายภาพตัดตัวเลือกการจัดสรรใหม่ ซึ่งสถานการณ์ระบุชัดว่าต้องคงไว้"},{"id":170379633,"n":32,"d":2,"o":"2.7","q":"Your organization operates under PCI DSS and HIPAA requirements. A compliance audit reveals that log archives older than 90 days are stored in an unencrypted standard object storage bucket with no access restrictions, deletion prevention, or immutability controls in place. Management wants to reduce storage costs and argues that the most affordable tier is sufficient. What is the MOST appropriate action given both the compliance requirements and the cost pressure from management?","qth":"องค์กรของคุณอยู่ภายใต้ข้อกำหนด PCI DSS และ HIPAA การตรวจสอบ compliance พบว่า log archive ที่เก่ากว่า 90 วันถูกเก็บไว้ใน standard object storage bucket ที่ไม่ได้เข้ารหัส ไม่มีการจำกัดการเข้าถึง ไม่มีการป้องกันการลบ และไม่มีการควบคุม immutability ฝ่ายบริหารต้องการลดต้นทุน storage และแย้งว่า tier ที่ถูกที่สุดเพียงพอ การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) เมื่อพิจารณาทั้งข้อกำหนด compliance และแรงกดดันด้านต้นทุนคืออะไร","a":["Move log archives to encrypted, immutable storage, even at higher cost, to meet retention and integrity requirements.","Retain all of the current storage approaches but apply greater access controls to restrict who can read the log files.","Move logs to a cheaper archival tier and apply hash values to each of the log files] to detect future tampering.","Delete log files older than one year to reduce storage consumption and limit the compliance scope."],"ath":["ย้าย log archive ไปยัง storage ที่เข้ารหัสและ immutable แม้ต้นทุนสูงขึ้น เพื่อตอบข้อกำหนดด้านการเก็บรักษาและ integrity","คงแนวทาง storage ปัจจุบันทั้งหมดไว้ แต่เพิ่ม access control เพื่อจำกัดว่าใครอ่านไฟล์ log ได้","ย้าย log ไปยัง archival tier ที่ถูกกว่า และใช้ค่า hash กับไฟล์ log แต่ละไฟล์เพื่อตรวจจับการแก้ไขในอนาคต","ลบไฟล์ log ที่เก่ากว่าหนึ่งปีเพื่อลดการใช้ storage และจำกัดขอบเขต compliance"],"ans":"A","exp":"PCI DSS requires one year of log retention with three months readily accessible. HIPAA requires six years for covered data. Both frameworks require tamper-evident, protected storage. Encrypted, immutable WORM storage satisfies integrity, retention, and deletion-prevention requirements simultaneously. Access controls alone do not prevent deletion or modification of stored logs. Deleting files older than one year violates both retention mandates directly. Hashing detects tampering after the fact but cannot prevent it, and a cheaper unprotected tier still fails immutability requirements. Compliance obligations override the cost-reduction argument here.","expth":"PCI DSS กำหนดให้เก็บ log หนึ่งปี โดยสามเดือนล่าสุดต้องเรียกใช้ได้ทันที HIPAA กำหนดหกปีสำหรับข้อมูลที่เกี่ยวข้อง ทั้งสองกรอบต้องการ storage ที่ป้องกันและตรวจจับการแก้ไขได้ (tamper-evident) Storage แบบ WORM ที่เข้ารหัสและ immutable ตอบทั้ง integrity การเก็บรักษา และการป้องกันการลบพร้อมกัน Access control อย่างเดียวไม่ป้องกันการลบหรือแก้ไข log การลบไฟล์เก่ากว่าหนึ่งปีละเมิดข้อกำหนดการเก็บรักษาของทั้งสองกรอบโดยตรง Hashing ตรวจจับการแก้ไขได้หลังเกิดเหตุแต่ป้องกันไม่ได้ และ tier ราคาถูกที่ไม่มีการป้องกันยังไม่ผ่านข้อกำหนด immutability ภาระผูกพันด้าน compliance อยู่เหนือข้อโต้แย้งเรื่องการลดต้นทุนในกรณีนี้"},{"id":170379635,"n":33,"d":2,"o":"2.8","q":"A cloud security architect is reviewing the organization's logging design. The team wants to ensure that logs can be used as trustworthy evidence in legal or regulatory proceedings. Which of the following is NOT a recognized method for protecting log integrity described in the lesson?","qth":"สถาปนิกความมั่นคงปลอดภัยคลาวด์กำลังทบทวนการออกแบบ logging ขององค์กร ทีมต้องการให้ log ใช้เป็นหลักฐานที่เชื่อถือได้ในกระบวนการทางกฎหมายหรือกำกับดูแล ข้อใดต่อไปนี้ไม่ใช่ (NOT) วิธีปกป้อง log integrity ที่ได้รับการยอมรับตามที่อธิบายไว้ในบทเรียน","a":["Deploying a write-once storage tier to ensure logs cannot be overwritten by any system process","Using digital signatures to provide additional assurance of log authenticity","Relying on access restrictions alone to prevent unauthorized modification of log data","Applying cryptographic hashing to verify that log entries have not been altered after creation"],"ath":["ติดตั้ง write-once storage tier เพื่อให้ log ไม่ถูกเขียนทับโดยกระบวนการของระบบใด ๆ","ใช้ digital signature เพื่อให้ความมั่นใจเพิ่มเติมเรื่องความถูกต้องแท้จริงของ log","พึ่งพาการจำกัดการเข้าถึงเพียงอย่างเดียวเพื่อป้องกันการแก้ไข log โดยไม่ได้รับอนุญาต","ใช้ cryptographic hashing เพื่อตรวจสอบว่ารายการ log ไม่ถูกเปลี่ยนแปลงหลังถูกสร้าง"],"ans":"C","exp":"The lesson identifies cryptographic hashing and digital signatures as the recognized methods for protecting log integrity and ensuring logs can be trusted as evidence. Access restrictions may reduce the risk of tampering but do not provide a verifiable mechanism to detect whether tampering occurred. Hashing and digital signatures allow independent verification of log authenticity. Write-once storage is a common industry practice, but relying solely on access controls without a cryptographic verification mechanism is not sufficient to establish trustworthy evidence.","expth":"บทเรียนระบุว่า cryptographic hashing และ digital signature เป็นวิธีที่ได้รับการยอมรับในการปกป้อง log integrity และทำให้ log เชื่อถือได้ในฐานะหลักฐาน การจำกัดการเข้าถึงอาจลดความเสี่ยงการแก้ไข แต่ไม่มีกลไกที่ตรวจสอบได้ว่ามีการแก้ไขเกิดขึ้นหรือไม่ Hashing และ digital signature อนุญาตให้ตรวจสอบความถูกต้องแท้จริงของ log ได้อย่างอิสระ Write-once storage เป็นแนวปฏิบัติทั่วไปในอุตสาหกรรม แต่การพึ่งพา access control เพียงอย่างเดียวโดยไม่มีกลไกตรวจสอบด้วยคริปโตกราฟี ไม่เพียงพอที่จะสร้างหลักฐานที่เชื่อถือได้"},{"id":170379637,"n":34,"d":2,"o":"2.8","q":"A cloud security team is designing the logging architecture for a new multi-region SaaS platform. They must ensure logs support forensic investigations by capturing sufficient context about each recorded event. Which event attribute is MOST important for determining whether an access event originated from a location inconsistent with the user's normal activity pattern?","qth":"ทีมความมั่นคงปลอดภัยคลาวด์กำลังออกแบบสถาปัตยกรรม logging สำหรับแพลตฟอร์ม SaaS หลาย region แห่งใหม่ ทีมต้องให้ log สนับสนุนการสืบสวนทางนิติวิทยาศาสตร์โดยบันทึกบริบทของแต่ละเหตุการณ์อย่างเพียงพอ แอตทริบิวต์ของเหตุการณ์ใดสำคัญที่สุด (MOST important) ในการระบุว่าเหตุการณ์การเข้าถึงมาจากตำแหน่งที่ไม่สอดคล้องกับรูปแบบกิจกรรมปกติของผู้ใช้","a":["The geolocation attribute, which provides geographic context to identify unexpected access origins","The IP address attribute, which records the network address of the source system involved in the event","The identity attribute, which links the event to the user account or process responsible for the action","The timestamp attribute, which records when the event occurred relative to synchronized system time"],"ath":["แอตทริบิวต์ geolocation ซึ่งให้บริบททางภูมิศาสตร์เพื่อระบุต้นทางการเข้าถึงที่ไม่คาดคิด","แอตทริบิวต์ IP address ซึ่งบันทึกที่อยู่เครือข่ายของระบบต้นทางที่เกี่ยวข้องกับเหตุการณ์","แอตทริบิวต์ identity ซึ่งเชื่อมเหตุการณ์กับบัญชีผู้ใช้หรือกระบวนการที่รับผิดชอบการกระทำ","แอตทริบิวต์ timestamp ซึ่งบันทึกเวลาที่เหตุการณ์เกิดขึ้นเทียบกับเวลาระบบที่ซิงโครไนซ์"],"ans":"A","exp":"Geolocation provides geographic context that allows analysts to identify whether an access event originated from an unexpected or suspicious location, such as a country the user has never accessed from. While identity links the action to an account and IP address records the source network address, neither directly answers whether the origin is geographically anomalous. Geolocation is the attribute that adds location-based context distinguishing this scenario from a technically valid but suspicious access pattern.","expth":"Geolocation ให้บริบททางภูมิศาสตร์ที่ช่วยให้นักวิเคราะห์ระบุได้ว่าเหตุการณ์การเข้าถึงมาจากตำแหน่งที่ไม่คาดคิดหรือน่าสงสัย เช่น ประเทศที่ผู้ใช้ไม่เคยเข้าถึงมาก่อน แม้ identity จะเชื่อมการกระทำกับบัญชี และ IP address จะบันทึกที่อยู่เครือข่ายต้นทาง แต่ทั้งสองตอบไม่ได้โดยตรงว่าต้นทางผิดปกติทางภูมิศาสตร์หรือไม่ Geolocation จึงเป็นแอตทริบิวต์ที่เพิ่มบริบทเชิงตำแหน่งซึ่งแยกสถานการณ์นี้ออกจากรูปแบบการเข้าถึงที่ถูกต้องทางเทคนิคแต่น่าสงสัย"},{"id":170379639,"n":35,"d":2,"o":"2.9","q":"A security operations team deploys an AI-based anomaly detection system trained on six months of historical cloud activity logs. Three months after deployment, the team discovers that an attacker had been slowly inserting low-volume malicious traffic into the environment during the training period. What is the BEST description of the security risk this scenario represents?","qth":"ทีม security operations ติดตั้งระบบ anomaly detection แบบ AI ที่ฝึกด้วย activity log คลาวด์ย้อนหลังหกเดือน สามเดือนหลังการติดตั้ง ทีมพบว่าผู้โจมตีค่อย ๆ แทรกทราฟฟิกอันตรายปริมาณน้อยเข้าสู่สภาพแวดล้อมในช่วงที่ใช้ฝึกโมเดล คำอธิบายที่ดีที่สุด (BEST) ของความเสี่ยงด้านความมั่นคงปลอดภัยในสถานการณ์นี้คืออะไร","a":["Data poisoning, where malicious activity during the training period causes the model to learn incorrect behavioral patterns","Model bias, where historical training data reflects skewed behavioral patterns that create false positive alerts for certain user groups","Adversarial evasion, where an attacker crafts inputs at runtime to stay below the model's detection threshold","False positive accumulation, where a high volume of normal events overwhelms the detection model's alert capacity"],"ath":["Data poisoning ซึ่งกิจกรรมอันตรายระหว่างช่วงฝึกทำให้โมเดลเรียนรู้รูปแบบพฤติกรรมที่ไม่ถูกต้อง","Model bias ซึ่งข้อมูลฝึกย้อนหลังสะท้อนรูปแบบพฤติกรรมที่เบี่ยงเบนและสร้างการแจ้งเตือน false positive ให้ผู้ใช้บางกลุ่ม","Adversarial evasion ซึ่งผู้โจมตีปรับแต่งอินพุตขณะรันเพื่อให้ต่ำกว่าเกณฑ์การตรวจจับของโมเดล","False positive accumulation ซึ่งเหตุการณ์ปกติจำนวนมากท่วมความสามารถในการแจ้งเตือนของโมเดลตรวจจับ"],"ans":"A","exp":"The scenario describes an attacker deliberately introducing malicious activity into the environment during the training period, causing the model to normalize that activity as routine. This is data poisoning, a specific attack against AI and ML systems that corrupts the training dataset. Adversarial evasion targets the model at inference time, not during training. Model bias stems from skewed historical data reflecting existing patterns, not from deliberate attacker manipulation. False positive accumulation is a performance issue, not a data integrity attack.","expth":"สถานการณ์อธิบายว่าผู้โจมตีจงใจแทรกกิจกรรมอันตรายเข้าสู่สภาพแวดล้อมในช่วงฝึก ทำให้โมเดลเห็นกิจกรรมนั้นเป็นเรื่องปกติ นี่คือ data poisoning ซึ่งเป็นการโจมตีเฉพาะต่อระบบ AI และ ML ที่ทำให้ชุดข้อมูลฝึกเสียหาย Adversarial evasion โจมตีโมเดลขณะ inference ไม่ใช่ขณะฝึก Model bias มาจากข้อมูลย้อนหลังที่เบี่ยงเบนตามรูปแบบเดิม ไม่ใช่การจงใจแทรกแซงโดยผู้โจมตี ส่วน false positive accumulation เป็นปัญหาด้านประสิทธิภาพ ไม่ใช่การโจมตี data integrity"},{"id":170379641,"n":36,"d":2,"o":"2.9","q":"Your organization is deploying an AI-based behavioral monitoring system to analyze employee cloud activity, including file access, email patterns, and application usage. The system is technically capable of collecting all available telemetry. What is the MOST appropriate consideration when defining the scope of data collection for this system?","qth":"องค์กรของคุณกำลังติดตั้งระบบเฝ้าติดตามพฤติกรรมแบบ AI เพื่อวิเคราะห์กิจกรรมคลาวด์ของพนักงาน รวมถึงการเข้าถึงไฟล์ รูปแบบอีเมล และการใช้แอปพลิเคชัน ระบบสามารถเก็บ telemetry ที่มีทั้งหมดได้ในทางเทคนิค ข้อพิจารณาที่เหมาะสมที่สุด (MOST appropriate) เมื่อกำหนดขอบเขตการเก็บข้อมูลของระบบนี้คืออะไร","a":["Limiting data collection to what is proportionate, lawful, and consistent with privacy and consent obligations applicable to employee oversight","Deferring data collection scope decisions to the cloud service provider, since they manage the underlying telemetry infrastructure","Maximizing telemetry coverage to reduce blind spots and give the AI model the most complete behavioral baseline possible","Prioritizing the collection of data sources is most likely to detect insider threats, based on historical incident patterns within the industry"],"ath":["จำกัดการเก็บข้อมูลให้เป็นสัดส่วน ชอบด้วยกฎหมาย และสอดคล้องกับภาระผูกพันด้านความเป็นส่วนตัวและความยินยอมที่ใช้กับการกำกับดูแลพนักงาน","มอบการตัดสินใจเรื่องขอบเขตการเก็บข้อมูลให้ผู้ให้บริการคลาวด์ เพราะเป็นผู้จัดการโครงสร้างพื้นฐาน telemetry","เก็บ telemetry ให้ครอบคลุมสูงสุดเพื่อลดจุดบอดและให้โมเดล AI มี behavioral baseline ที่สมบูรณ์ที่สุด","ให้ความสำคัญกับแหล่งข้อมูลที่มีแนวโน้มตรวจจับ insider threat ได้มากที่สุด โดยอิงรูปแบบเหตุการณ์ในอดีตของอุตสาหกรรม"],"ans":"A","exp":"The lesson states that ethical use of AI requires ensuring data collection is proportionate, that surveillance of employees or customers is lawful and transparent, and that consent and privacy requirements are respected. Maximizing telemetry coverage prioritizes detection capability over legal and privacy obligations, creating compliance and ethical risk. Prioritizing insider threat sources applies a risk lens without addressing lawfulness. Deferring to the CSP misallocates responsibility for governance decisions that belong to the customer organization.","expth":"บทเรียนระบุว่าการใช้ AI อย่างมีจริยธรรมต้องมั่นใจว่าการเก็บข้อมูลเป็นสัดส่วน การเฝ้าติดตามพนักงานหรือลูกค้าชอบด้วยกฎหมายและโปร่งใส และเคารพข้อกำหนดด้านความยินยอมและความเป็นส่วนตัว การเก็บ telemetry สูงสุดให้ความสำคัญกับความสามารถในการตรวจจับเหนือภาระผูกพันทางกฎหมายและความเป็นส่วนตัว ก่อความเสี่ยงด้าน compliance และจริยธรรม การเน้นแหล่ง insider threat ใช้มุมมองด้านความเสี่ยงโดยไม่จัดการเรื่องความชอบด้วยกฎหมาย ส่วนการมอบให้ CSP เป็นการโอนความรับผิดชอบด้านการกำกับดูแลที่เป็นของลูกค้าไปผิดที่"},{"id":170379643,"n":37,"d":3,"o":"","q":"A multinational financial services firm operates mission-critical trading platforms across two geographically separated data centers. Regulatory requirements mandate zero data loss from any infrastructure disruption and continuous service availability without manual intervention to activate a secondary site. The firm's disaster recovery architect is evaluating configuration options. What is the BEST configuration to meet these requirements?","qth":"สถาบันบริการทางการเงินข้ามชาติดำเนินแพลตฟอร์มการซื้อขายที่สำคัญยิ่งยวดบนศูนย์ข้อมูลสองแห่งที่แยกกันทางภูมิศาสตร์ ข้อกำหนดของหน่วยงานกำกับกำหนดให้ไม่มีข้อมูลสูญหายจากการหยุดชะงักของโครงสร้างพื้นฐาน และต้องให้บริการต่อเนื่องโดยไม่ต้องแทรกแซงด้วยมือเพื่อเปิดใช้ site สำรอง สถาปนิก disaster recovery ของบริษัทกำลังประเมินตัวเลือกการกำหนดค่า การกำหนดค่าที่ดีที่สุด (BEST) เพื่อตอบข้อกำหนดเหล่านี้คืออะไร","a":["A geographically distributed backup approach where data is replicated nightly to the secondary site and restored on demand after failure.","An active-active configuration where both data centers simultaneously host live workloads, enabling instantaneous continuity if one site fails.","An active-passive configuration where the secondary site is maintained in warm standby state and activated manually during a declared disaster.","An N+1 redundancy model within a single data center, ensuring one backup component exists for every critical system in the primary facility."],"ath":["แนวทาง backup แบบกระจายทางภูมิศาสตร์ ที่ทำ replication ข้อมูลไปยัง site สำรองทุกคืน และกู้คืนตามต้องการหลังเกิดความล้มเหลว","การกำหนดค่าแบบ active-active ซึ่งศูนย์ข้อมูลทั้งสองแห่งโฮสต์ workload จริงพร้อมกัน ทำให้ต่อเนื่องได้ทันทีหาก site หนึ่งล้มเหลว","การกำหนดค่าแบบ active-passive ซึ่ง site สำรองอยู่ในสถานะ warm standby และเปิดใช้ด้วยมือระหว่างภัยพิบัติที่ประกาศ","แบบจำลองความซ้ำซ้อน N+1 ภายในศูนย์ข้อมูลเดียว โดยมีส่วนประกอบสำรองหนึ่งชิ้นต่อทุกระบบสำคัญในอาคารหลัก"],"ans":"B","exp":"OBJ. 3.5. Active-active has both sites processing live workloads simultaneously, so a failure at one site results in immediate continuity through the other with no data loss and no manual intervention required. Active-passive requires manual activation, violating the no-manual-intervention requirement. Nightly replication introduces a recovery point gap, violating the zero-data-loss requirement. N+1 within a single data center provides no geographic separation and cannot protect against a site-level failure, which the regulatory scenario explicitly demands.","expth":"Active-active ให้ทั้งสอง site ประมวลผล workload จริงพร้อมกัน เมื่อ site หนึ่งล้มเหลวจึงต่อเนื่องได้ทันทีผ่านอีก site โดยไม่สูญเสียข้อมูลและไม่ต้องแทรกแซงด้วยมือ Active-passive ต้องเปิดใช้ด้วยมือ ซึ่งขัดกับข้อกำหนดไม่แทรกแซงด้วยมือ การ replication ทุกคืนสร้างช่องว่างของ recovery point ซึ่งขัดกับข้อกำหนดไม่มีข้อมูลสูญหาย ส่วน N+1 ภายในศูนย์ข้อมูลเดียวไม่มีการแยกทางภูมิศาสตร์ และปกป้องความล้มเหลวระดับ site ไม่ได้ ซึ่งสถานการณ์กำกับไว้ชัดเจน"},{"id":170379645,"n":38,"d":3,"o":"3.5","q":"A major cloud region hosting your organization's ERP system has just experienced an unexpected outage. The incident commander is under pressure from executives to immediately activate the disaster recovery plan and begin failing over to the secondary region. The DR team has not yet reviewed which systems are affected or estimated the duration of the outage. What should be the FIRST action the DR team takes before initiating failover?","qth":"region คลาวด์หลักที่โฮสต์ระบบ ERP ขององค์กรเพิ่งเกิดเหตุขัดข้องโดยไม่คาดคิด ผู้บัญชาการเหตุการณ์ถูกผู้บริหารกดดันให้เปิดใช้แผน disaster recovery ทันทีและเริ่ม failover ไปยัง region สำรอง แต่ทีม DR ยังไม่ได้ทบทวนว่าระบบใดได้รับผลกระทบ หรือประเมินระยะเวลาของเหตุขัดข้อง ทีม DR ควรทำอะไรเป็นอันดับแรก (FIRST) ก่อนเริ่ม failover","a":["Conduct an outage assessment to see which systems are affected, estimate downtime, and identify data that was compromised.","Activate the DR plan and initiate failover immediately to minimize the RTO and prevent further data loss as defined in the RPO.","Review the points of contact list and confirm availability of all technical personnel required to execute the failover procedure.","Notify all stakeholders using the communication plan and escalate to executive sponsors to authorize the failover decision."],"ath":["ทำ outage assessment เพื่อดูว่าระบบใดได้รับผลกระทบ ประเมินเวลาที่หยุดทำงาน และระบุข้อมูลที่ถูกกระทบ","เปิดใช้แผน DR และเริ่ม failover ทันที เพื่อลด RTO และป้องกันข้อมูลสูญหายเพิ่มเติมตามที่กำหนดใน RPO","ทบทวนรายชื่อผู้ติดต่อและยืนยันว่าบุคลากรด้านเทคนิคทั้งหมดที่ต้องใช้ในการทำ failover พร้อมปฏิบัติงาน","แจ้งผู้มีส่วนได้ส่วนเสียทั้งหมดตามแผนการสื่อสาร และยกระดับไปยังผู้สนับสนุนระดับผู้บริหารเพื่ออนุมัติการตัดสินใจ failover"],"ans":"A","exp":"Outage assessment must precede recovery activation. It identifies affected systems, estimates downtime duration, and determines whether data was compromised, providing the information needed to prioritize recovery actions correctly. Initiating failover without assessment risks unnecessary costs and misdirected effort. Stakeholder notification is a valid response activity but depends on scope being understood first. Confirming personnel availability is a preparatory step that should be directed by assessment findings, not executed before scope is established.","expth":"ต้อง outage assessment ก่อนเปิดใช้การกู้คืน เพื่อระบุระบบที่ได้รับผลกระทบ ประเมินระยะเวลาที่หยุดทำงาน และตรวจว่าข้อมูลถูกกระทบหรือไม่ ซึ่งให้ข้อมูลที่จำเป็นในการจัดลำดับความสำคัญของการกู้คืนอย่างถูกต้อง การเริ่ม failover โดยไม่ประเมินเสี่ยงต่อต้นทุนที่ไม่จำเป็นและความพยายามที่ผิดทิศ การแจ้งผู้มีส่วนได้ส่วนเสียเป็นกิจกรรมตอบสนองที่ถูกต้อง แต่ขึ้นอยู่กับการเข้าใจขอบเขตก่อน ส่วนการยืนยันความพร้อมของบุคลากรเป็นขั้นตอนเตรียมการที่ควรถูกกำหนดโดยผลการประเมิน ไม่ใช่ทำก่อนกำหนดขอบเขต"},{"id":170379647,"n":39,"d":3,"o":"3.5","q":"An organization is building a business continuity plan for its cloud-hosted systems. The planning team is debating whether to invest budget in redundant power supplies, cross-region data replication, and automated failover configurations before finalizing recovery procedures. What is the PRIMARY concern that justifies implementing these measures before finalizing recovery procedures?","qth":"องค์กรกำลังจัดทำ business continuity plan สำหรับระบบที่โฮสต์บนคลาวด์ ทีมวางแผนกำลังถกเถียงว่าจะลงทุนงบประมาณกับแหล่งจ่ายไฟสำรอง การ replicate ข้อมูลข้าม region และการกำหนดค่า failover อัตโนมัติ ก่อนสรุปขั้นตอนการกู้คืนหรือไม่ ข้อกังวลหลัก (PRIMARY) ที่ให้เหตุผลสนับสนุนการดำเนินมาตรการเหล่านี้ก่อนสรุปขั้นตอนการกู้คืนคืออะไร","a":["Preventive measures replace the need for detailed recovery procedures when high availability services are already deployed.","Preventive controls reduce the likelihood or impact of disruptions, minimizing downtime and overall contingency costs.","Cloud providers require customers to implement preventive controls before executing any contingency strategies under the shared responsibility model.","Regulatory frameworks mandate that redundancy configurations be in place prior to documenting any recovery procedures."],"ath":["มาตรการป้องกันทดแทนความจำเป็นของขั้นตอนการกู้คืนโดยละเอียด เมื่อมีบริการ high availability ติดตั้งอยู่แล้ว","Preventive control ลดโอกาสหรือผลกระทบของการหยุดชะงัก ทำให้ downtime และต้นทุนการรับมือรวมน้อยที่สุด","ผู้ให้บริการคลาวด์กำหนดให้ลูกค้าต้องติดตั้ง preventive control ก่อนดำเนินกลยุทธ์รับมือใด ๆ ภายใต้ shared responsibility model","กรอบกฎระเบียบกำหนดให้ต้องมีการกำหนดค่าความซ้ำซ้อนก่อนที่จะจัดทำเอกสารขั้นตอนการกู้คืนใด ๆ"],"ans":"B","exp":"Preventive controls are proactive measures designed to reduce the likelihood or impact of disruptions. Implementing them early minimizes downtime and reduces overall contingency costs, which directly justifies the investment before recovery procedures are finalized. The claim about cloud providers requiring customers to implement preventive controls first is factually incorrect: the shared responsibility model allocates responsibilities by layer but does not impose this sequencing requirement. The claim that regulatory frameworks mandate redundancy before recovery procedures are documented introduces a mandate not supported by the source material. The claim that preventive measures replace detailed recovery procedures contradicts established practice, as preventive controls and recovery procedures are complementary, not substitutes.","expth":"Preventive control คือมาตรการเชิงรุกที่ออกแบบเพื่อลดโอกาสหรือผลกระทบของการหยุดชะงัก การนำมาใช้ตั้งแต่เนิ่น ๆ ช่วยลด downtime และลดต้นทุนการรับมือโดยรวม จึงเป็นเหตุผลโดยตรงสำหรับการลงทุนก่อนสรุปขั้นตอนการกู้คืน ข้ออ้างที่ว่า cloud provider กำหนดให้ลูกค้าต้องทำ preventive control ก่อนไม่ถูกต้องตามข้อเท็จจริง เพราะ shared responsibility model แบ่งความรับผิดชอบตามชั้น แต่ไม่ได้กำหนดลำดับขั้นเช่นนี้ ข้ออ้างที่ว่ากรอบกฎระเบียบบังคับให้มี redundancy ก่อนจัดทำเอกสารขั้นตอนการกู้คืนเป็นข้อบังคับที่ไม่มีในเนื้อหาต้นทาง และข้ออ้างที่ว่ามาตรการเชิงป้องกันทดแทนขั้นตอนการกู้คืนโดยละเอียดขัดกับแนวปฏิบัติที่ยอมรับ เพราะ preventive control และขั้นตอนการกู้คืนเสริมกัน ไม่ได้ทดแทนกัน"},{"id":170379649,"n":40,"d":3,"o":"3.5","q":"A cloud operations team manages a large-scale document archive that is updated daily. The RPO for the archive is 24 hours, and the team must minimize cloud storage costs while ensuring full recovery capability. The team is evaluating full backups, incremental backups, and differential backups. What is the MOST appropriate backup method given both the RPO constraint and the cost requirement?","qth":"ทีม cloud operations ดูแลคลังเอกสารขนาดใหญ่ที่อัปเดตทุกวัน RPO ของคลังคือ 24 ชั่วโมง และทีมต้องลดต้นทุน cloud storage ให้น้อยที่สุดพร้อมรับประกันความสามารถในการกู้คืนเต็มรูปแบบ ทีมกำลังประเมิน full backup, incremental backup และ differential backup วิธี backup ที่เหมาะสมที่สุด (MOST appropriate) เมื่อพิจารณาทั้งข้อจำกัด RPO และข้อกำหนดด้านต้นทุนคืออะไร","a":["Full backups run daily, because they provide a complete and verified restore point that definitively satisfies the 24-hour RPO regardless of backup chain complexity.","Full backups run weekly with no interim backups, because the 24-hour RPO only requires that a full backup be completed within a 24-hour window, which a weekly schedule satisfies.","Differential backups run daily, because they capture all changes since the last full backup and are less storage-intensive than incremental backups for daily change volumes.","Incremental backups, because they capture only changes since the last backup, consuming less storage than full or differential backups while satisfying the 24-hour RPO if run daily."],"ath":["Full backup ทุกวัน เพราะให้จุดกู้คืนที่สมบูรณ์และตรวจสอบแล้ว ซึ่งตอบ RPO 24 ชั่วโมงได้แน่นอนไม่ว่า backup chain จะซับซ้อนเพียงใด","Full backup รายสัปดาห์โดยไม่มี backup ระหว่างทาง เพราะ RPO 24 ชั่วโมงต้องการเพียงให้ full backup เสร็จภายในกรอบ 24 ชั่วโมง ซึ่งตารางรายสัปดาห์ตอบได้","Differential backup ทุกวัน เพราะเก็บการเปลี่ยนแปลงทั้งหมดตั้งแต่ full backup ครั้งล่าสุด และใช้ storage น้อยกว่า incremental backup สำหรับปริมาณการเปลี่ยนแปลงรายวัน","Incremental backup เพราะเก็บเฉพาะการเปลี่ยนแปลงตั้งแต่ backup ครั้งล่าสุด ใช้ storage น้อยกว่า full หรือ differential และตอบ RPO 24 ชั่วโมงได้หากรันทุกวัน"],"ans":"D","exp":"Incremental backups capture only changes since the last backup operation, making them less storage-intensive than full or differential backups. A 24-hour RPO requires daily frequency, which incrementals satisfy at the lowest cost. Daily full backups satisfy the RPO but are the most storage-intensive option, failing the cost constraint. Differential backups grow with each day's cumulative changes, making them more storage-intensive than incrementals over time, which contradicts the claim that they are less storage-intensive. A weekly schedule cannot satisfy a 24-hour RPO, which requires recovery to any point within a 24-hour window.","expth":"Incremental backup เก็บเฉพาะการเปลี่ยนแปลงตั้งแต่การ backup ครั้งล่าสุด จึงใช้ storage น้อยกว่า full หรือ differential RPO 24 ชั่วโมงต้องการความถี่รายวัน ซึ่ง incremental ตอบได้ด้วยต้นทุนต่ำสุด Full backup รายวันตอบ RPO ได้แต่ใช้ storage มากที่สุด จึงไม่ผ่านข้อจำกัดด้านต้นทุน Differential backup โตขึ้นตามการเปลี่ยนแปลงสะสมของแต่ละวัน ทำให้ใช้ storage มากกว่า incremental เมื่อเวลาผ่านไป ซึ่งขัดกับข้ออ้างที่ว่า differential ใช้ storage น้อยกว่า ส่วนตารางรายสัปดาห์ตอบ RPO 24 ชั่วโมงไม่ได้ เพราะ RPO ต้องการการกู้คืนไปยังจุดใดก็ได้ภายในกรอบ 24 ชั่วโมง"},{"id":170379651,"n":41,"d":3,"o":"3.5","q":"A healthcare organization is conducting a Business Impact Analysis for its cloud-hosted patient scheduling system. The BIA team must establish how long the scheduling system can remain unavailable before the disruption causes permanent harm to the organization, including patient safety consequences, regulatory violations, and revenue loss. What is the MOST appropriate metric to capture this threshold?","qth":"องค์กรสุขภาพกำลังทำ Business Impact Analysis สำหรับระบบนัดหมายผู้ป่วยที่โฮสต์บนคลาวด์ ทีม BIA ต้องกำหนดว่าระบบนัดหมายหยุดทำงานได้นานเท่าใดก่อนที่การหยุดชะงักจะก่อความเสียหายถาวรต่อองค์กร รวมถึงผลกระทบต่อความปลอดภัยของผู้ป่วย การละเมิดกฎระเบียบ และการสูญเสียรายได้ เมตริกใดเหมาะสมที่สุด (MOST appropriate) ในการจับเกณฑ์นี้","a":["Recovery Time Objective, because it defines the maximum acceptable time a system can be offline and is used to sequence recovery priorities.","Recovery service level, because it defines the minimum acceptable performance the system must deliver once restored after a disruption.","Maximum Tolerable Downtime, because it represents the longest period a business process can be unavailable without causing permanent harm to the organization.","Recovery Point Objective, because it establishes how much data loss is acceptable and determines the urgency of restoring the scheduling system."],"ath":["Recovery Time Objective เพราะกำหนดเวลาสูงสุดที่ยอมรับได้ที่ระบบออฟไลน์ และใช้จัดลำดับการกู้คืน","Recovery service level เพราะกำหนดประสิทธิภาพขั้นต่ำที่ระบบต้องให้หลังกู้คืนจากการหยุดชะงัก","Maximum Tolerable Downtime เพราะแสดงช่วงเวลานานที่สุดที่กระบวนการทางธุรกิจไม่พร้อมใช้งานได้โดยไม่ก่อความเสียหายถาวรต่อองค์กร","Recovery Point Objective เพราะกำหนดปริมาณข้อมูลที่ยอมสูญหายได้ และกำหนดความเร่งด่วนในการกู้คืนระบบนัดหมาย"],"ans":"C","exp":"MTD is the longest period a business process can remain unavailable before permanent harm occurs, making it the correct metric for the threshold described. It establishes the outer boundary that drives recovery urgency across all subsequent planning. RTO is a recovery target derived from MTD but measures acceptable offline time for IT systems, not the permanent-harm boundary. RPO measures acceptable data loss expressed as time, not downtime duration. Recovery service level addresses minimum performance standards after restoration, not downtime tolerance.","expth":"MTD คือช่วงเวลานานที่สุดที่กระบวนการทางธุรกิจไม่พร้อมใช้งานได้ก่อนเกิดความเสียหายถาวร จึงเป็นเมตริกที่ถูกต้องสำหรับเกณฑ์ที่อธิบาย และเป็นขอบเขตนอกสุดที่ขับเคลื่อนความเร่งด่วนของการกู้คืนในการวางแผนทั้งหมดที่ตามมา RTO เป็นเป้าหมายการกู้คืนที่ได้จาก MTD แต่วัดเวลาออฟไลน์ที่ยอมรับได้ของระบบ IT ไม่ใช่เส้นแบ่งความเสียหายถาวร RPO วัดปริมาณข้อมูลที่ยอมสูญหายในรูปของเวลา ไม่ใช่ระยะเวลา downtime ส่วน recovery service level เกี่ยวกับมาตรฐานประสิทธิภาพขั้นต่ำหลังกู้คืน ไม่ใช่ความทนต่อ downtime"},{"id":170379653,"n":42,"d":3,"o":"3.5","q":"A cloud security team needs to validate that its disaster recovery environment can handle actual production workloads without committing to a full cutover. The team requires realistic performance data and must confirm that the recovery environment functions correctly under load. The business cannot tolerate any disruption to live operations during the test. The team is choosing between a parallel test and a full interruption test. What is the BEST testing approach given these constraints?","qth":"ทีมความมั่นคงปลอดภัยคลาวด์ต้องตรวจสอบว่าสภาพแวดล้อม disaster recovery รองรับ workload production จริงได้ โดยไม่ต้อง cutover เต็มรูปแบบ ทีมต้องการข้อมูลประสิทธิภาพที่สมจริงและต้องยืนยันว่าสภาพแวดล้อมกู้คืนทำงานถูกต้องภายใต้โหลด ธุรกิจไม่ยอมให้เกิดการหยุดชะงักต่อการดำเนินงานจริงระหว่างการทดสอบ ทีมกำลังเลือกระหว่าง parallel test และ full interruption test แนวทางการทดสอบที่ดีที่สุด (BEST) ภายใต้ข้อจำกัดเหล่านี้คืออะไร","a":["A full interruption test, because it provides the most realistic results by halting normal operations and activating the DR plan as if a real disaster occurred, validating true recovery capability.","A parallel test, because it operates the recovery environment alongside production without committing to a full failover, providing realistic load validation without disrupting live operations.","A simulation test, because it mimics a disaster scenario without disrupting production and provides sufficient validation of the recovery environment's readiness.","A tabletop exercise, because it allows team members to walk through recovery procedures and identify communication gaps without any risk to production systems or operations."],"ath":["Full interruption test เพราะให้ผลสมจริงที่สุดโดยหยุดการดำเนินงานปกติและเปิดใช้แผน DR เสมือนเกิดภัยพิบัติจริง เพื่อตรวจสอบความสามารถในการกู้คืนที่แท้จริง","Parallel test เพราะรันสภาพแวดล้อมกู้คืนควบคู่กับ production โดยไม่ผูกมัด failover เต็มรูปแบบ ให้การตรวจสอบโหลดที่สมจริงโดยไม่รบกวนการดำเนินงานจริง","Simulation test เพราะจำลองสถานการณ์ภัยพิบัติโดยไม่รบกวน production และให้การตรวจสอบความพร้อมของสภาพแวดล้อมกู้คืนได้เพียงพอ","Tabletop exercise เพราะให้สมาชิกทีมไล่ดูขั้นตอนการกู้คืนและระบุช่องว่างด้านการสื่อสารได้ โดยไม่มีความเสี่ยงต่อระบบหรือการดำเนินงาน production"],"ans":"B","exp":"A parallel test operates the recovery environment alongside production systems, confirming it handles actual workloads without committing to a full failover. This is the most comprehensive DR test that does not impact live operations. Full interruption tests halt normal operations entirely, directly violating the no-disruption constraint. Simulation tests mimic scenarios without engaging actual system workloads and cannot provide realistic load validation. Tabletop exercises are discussion-based walkthroughs that do not execute system recovery and cannot validate performance under load.","expth":"Parallel test รันสภาพแวดล้อมกู้คืนควบคู่กับระบบ production ยืนยันว่ารองรับ workload จริงได้โดยไม่ผูกมัด failover เต็มรูปแบบ เป็นการทดสอบ DR ที่ครอบคลุมที่สุดที่ไม่กระทบการดำเนินงานจริง Full interruption test หยุดการดำเนินงานปกติทั้งหมด ซึ่งฝ่าฝืนข้อจำกัดไม่มีการหยุดชะงักโดยตรง Simulation test จำลองสถานการณ์โดยไม่ใช้ workload ระบบจริง จึงไม่ให้การตรวจสอบโหลดที่สมจริง ส่วน tabletop exercise เป็นการเดินตามขั้นตอนแบบสนทนา ไม่ได้ดำเนินการกู้คืนระบบ จึงตรวจสอบประสิทธิภาพภายใต้โหลดไม่ได้"},{"id":170379655,"n":43,"d":4,"o":"4.1","q":"A multi-tenant SaaS application uses a single shared vector database to serve retrieval-augmented generation queries for all customers. A security review reveals that tenant boundary enforcement in the vector store is based solely on a metadata field that the retrieval query does not validate. What is the MOST appropriate control to address this weakness?","qth":"แอปพลิเคชัน SaaS แบบ multi-tenant ใช้ vector database ที่ใช้ร่วมกันเพียงตัวเดียวเพื่อให้บริการ query แบบ retrieval-augmented generation (RAG) แก่ลูกค้าทุกราย การทบทวนด้านความมั่นคงปลอดภัยพบว่าการบังคับใช้ขอบเขตของผู้เช่าใน vector store อาศัยเพียงฟิลด์ metadata ที่ retrieval query ไม่ตรวจสอบ มาตรการควบคุมที่เหมาะสมที่สุด (MOST appropriate) เพื่อแก้จุดอ่อนนี้คืออะไร","a":["Switch from a shared vector database to separate databases for each tenant, because shared infrastructure cannot provide adequate isolation for multi-tenant RAG applications.","Add output filtering that inspects model responses for content belonging to other tenants before returning answers to the requesting user.","Encrypt all vectors stored in the shared database so that one tenant cannot read another tenant's embeddings even if retrieval boundaries fail.","Implement fine-grained access control and strong logical partitioning between tenants in the vector store, and validate tenant identity at the retrieval layer before returning results."],"ath":["เปลี่ยนจาก vector database ที่ใช้ร่วมกันเป็นฐานข้อมูลแยกสำหรับแต่ละผู้เช่า เพราะโครงสร้างพื้นฐานที่ใช้ร่วมกันให้การแยกส่วนที่เพียงพอสำหรับแอปพลิเคชัน RAG แบบ multi-tenant ไม่ได้","เพิ่ม output filtering ที่ตรวจคำตอบของโมเดลว่ามีเนื้อหาของผู้เช่ารายอื่นหรือไม่ ก่อนส่งคำตอบกลับให้ผู้ใช้ที่ร้องขอ","เข้ารหัส vector ทั้งหมดในฐานข้อมูลที่ใช้ร่วมกัน เพื่อให้ผู้เช่ารายหนึ่งอ่าน embedding ของอีกรายไม่ได้แม้ขอบเขตการ retrieval ล้มเหลว","ติดตั้ง fine-grained access control และ logical partitioning ที่แข็งแกร่งระหว่างผู้เช่าใน vector store และตรวจสอบตัวตนผู้เช่าที่ชั้น retrieval ก่อนคืนผลลัพธ์"],"ans":"D","exp":"Weak tenant partitioning in shared vector stores is a confidentiality failure addressed by fine-grained access control and strong logical partitioning enforced at the retrieval layer. Encryption protects stored vectors at rest but does not prevent a retrieval query from returning cross-tenant results when boundary validation is absent. Separate databases may resolve isolation concerns but the failure here is in enforcement logic, not architecture. Shared infrastructure can provide adequate isolation when controls are correctly implemented. Output filtering is a compensating control but does not fix the retrieval boundary weakness that allows cross-tenant data to be fetched in the first place.","expth":"การแบ่งส่วนผู้เช่าที่อ่อนแอใน vector store ที่ใช้ร่วมกันเป็นความล้มเหลวด้าน confidentiality ซึ่งแก้ด้วย fine-grained access control และ logical partitioning ที่แข็งแกร่งซึ่งบังคับที่ชั้น retrieval การเข้ารหัสปกป้อง vector ที่จัดเก็บ แต่ไม่ป้องกันไม่ให้ retrieval query คืนผลข้ามผู้เช่าเมื่อไม่มีการตรวจสอบขอบเขต ฐานข้อมูลแยกอาจแก้ประเด็นการแยกส่วนได้ แต่ความล้มเหลวในที่นี้อยู่ที่ตรรกะการบังคับใช้ ไม่ใช่สถาปัตยกรรม โครงสร้างพื้นฐานที่ใช้ร่วมกันให้การแยกส่วนที่เพียงพอได้หากมีมาตรการควบคุมที่ติดตั้งถูกต้อง ส่วน output filtering เป็นมาตรการชดเชย แต่ไม่แก้จุดอ่อนของขอบเขต retrieval ที่ทำให้ดึงข้อมูลข้ามผู้เช่าได้ตั้งแต่ต้น"},{"id":170379657,"n":44,"d":4,"o":"4.1","q":"A cloud-based LLM application is connected to an internal knowledge base, a plugin that can send emails, and an API that can update CRM records. During a security review, the team finds the plugin and API run with domain admin credentials, and no human approval is required for any action the model initiates. What is the MOST effective control to reduce the risk of excessive agency in this deployment?","qth":"แอปพลิเคชัน LLM บนคลาวด์เชื่อมต่อกับฐานความรู้ภายใน ปลั๊กอินที่ส่งอีเมลได้ และ API ที่อัปเดตระเบียน CRM ได้ ระหว่างการทบทวนด้านความมั่นคงปลอดภัย ทีมพบว่าปลั๊กอินและ API ทำงานด้วยข้อมูลรับรอง domain admin และไม่ต้องมีมนุษย์อนุมัติสำหรับการกระทำใด ๆ ที่โมเดลเริ่มต้น มาตรการควบคุมที่มีประสิทธิผลที่สุด (MOST effective) เพื่อลดความเสี่ยงจาก excessive agency ในการติดตั้งนี้คืออะไร","a":["Implement prompt filtering to detect and block any model output that contains instructions for the email plugin or CRM API before execution.","Encrypt all data exchanged between the LLM and its connected tools, ensuring that model outputs cannot be intercepted during transit.","Apply least privilege to connected tools, restrict CRM API permissions to the minimum required, and require human approval for high-impact actions.","Add a system prompt instruction directing the model not to initiate email sends or CRM updates without explicit user confirmation in the chat interface."],"ath":["ติดตั้ง prompt filtering เพื่อตรวจจับและบล็อกเอาต์พุตของโมเดลที่มีคำสั่งไปยังปลั๊กอินอีเมลหรือ CRM API ก่อนดำเนินการ","เข้ารหัสข้อมูลทั้งหมดที่แลกเปลี่ยนระหว่าง LLM กับเครื่องมือที่เชื่อมต่อ เพื่อให้แน่ใจว่าเอาต์พุตของโมเดลถูกดักฟังระหว่างส่งไม่ได้","ใช้ least privilege กับเครื่องมือที่เชื่อมต่อ จำกัดสิทธิ์ CRM API ให้เท่าที่จำเป็นขั้นต่ำ และกำหนดให้มนุษย์อนุมัติสำหรับการกระทำที่มีผลกระทบสูง","เพิ่มคำสั่งใน system prompt สั่งให้โมเดลไม่ส่งอีเมลหรืออัปเดต CRM หากไม่มีการยืนยันอย่างชัดเจนจากผู้ใช้ในหน้าแชต"],"ans":"C","exp":"Excessive agency in LLM deployments arises from overly broad permissions, excessive functionality, and insufficient human oversight. The OWASP LLM Top 10 specifies least privilege, granular tool definitions, and human-in-the-loop approval for high-impact actions as the required mitigations. Encryption protects data in transit but does not restrict what actions the model can take using its connected tools. Prompt filtering is brittle and does not replace authorization controls enforced in downstream systems. A system prompt instruction is not a security control and can be bypassed through adversarial inputs or model drift.","expth":"Excessive agency ใน LLM deployment เกิดจากสิทธิ์กว้างเกินไป ฟังก์ชันการทำงานเกินจำเป็น และการกำกับดูแลโดยมนุษย์ไม่เพียงพอ OWASP LLM Top 10 ระบุ least privilege, การนิยามเครื่องมือแบบละเอียด และการอนุมัติโดยมนุษย์ (human-in-the-loop) สำหรับการกระทำที่มีผลกระทบสูงเป็นมาตรการบรรเทาที่ต้องมี การเข้ารหัสปกป้องข้อมูลระหว่างส่ง แต่ไม่จำกัดว่าโมเดลทำอะไรได้ด้วยเครื่องมือที่เชื่อมต่อ Prompt filtering เปราะบางและไม่ทดแทนการควบคุมการอนุญาตที่บังคับในระบบปลายทาง ส่วนคำสั่งใน system prompt ไม่ใช่มาตรการควบคุมความปลอดภัย และอาจถูกหลบเลี่ยงด้วยอินพุตเชิงปรปักษ์หรือ model drift"},{"id":170379659,"n":45,"d":4,"o":"4.2","q":"A financial services organization is migrating a core transaction processing application to the cloud. The security team must recommend a development methodology. The CISO requires that vulnerability scanning occur on every code commit, compliance checks run within the deployment pipeline, and security findings be addressed within the same sprint cycle that introduced them, without gating releases to a separate security review phase. What is the MOST effective development approach to meet all three requirements simultaneously?","qth":"องค์กรบริการทางการเงินกำลังย้ายแอปพลิเคชันประมวลผลธุรกรรมหลักไปยังคลาวด์ ทีมความมั่นคงปลอดภัยต้องเสนอ development methodology CISO กำหนดว่าต้องสแกนช่องโหว่ทุกครั้งที่ commit โค้ด การตรวจสอบ compliance ต้องรันภายใน deployment pipeline และต้องแก้ไขข้อค้นพบด้านความปลอดภัยภายใน sprint เดียวกับที่ก่อให้เกิด โดยไม่ต้องกั้นการปล่อยด้วยขั้นตอนทบทวนความปลอดภัยแยกต่างหาก แนวทางการพัฒนาที่มีประสิทธิผลที่สุด (MOST effective) เพื่อตอบทั้งสามข้อกำหนดพร้อมกันคืออะไร","a":["Agile development with sprint-based security reviews, because iterative cycles allow security tasks to be assigned within each sprint","Waterfall development, because it enforces a distinct verification phase where all security testing is consolidated before deployment","OWASP SAMM implementation, because its governance and verification domains structure security activities across all development phases","DevSecOps, because it embeds automated security testing and continuous validation directly into the development pipeline"],"ath":["Agile development พร้อมการทบทวนความปลอดภัยตาม sprint เพราะวงรอบแบบ iterative ทำให้มอบหมายงานด้านความปลอดภัยภายในแต่ละ sprint ได้","Waterfall development เพราะบังคับให้มีขั้นตอนตรวจสอบที่แยกต่างหาก โดยรวมการทดสอบความปลอดภัยทั้งหมดก่อน deploy","การนำ OWASP SAMM มาใช้ เพราะโดเมน governance และ verification จัดโครงสร้างกิจกรรมด้านความปลอดภัยตลอดทุกขั้นตอนการพัฒนา","DevSecOps เพราะฝังการทดสอบความปลอดภัยอัตโนมัติและการตรวจสอบต่อเนื่องเข้ากับ pipeline การพัฒนาโดยตรง"],"ans":"D","exp":"The scenario requires automated scanning on every commit, compliance checks within the pipeline, and same-sprint remediation without a separate gate. The lesson describes DevSecOps as embedding security directly into the development pipeline so that security checks like automated vulnerability scanning happen continuously. Waterfall consolidates security into a distinct phase, which conflicts with the no-separate-gate requirement. Agile with sprint reviews supports iteration but does not by itself embed pipeline automation. OWASP SAMM is a maturity model, not a development methodology that embeds continuous pipeline controls.","expth":"สถานการณ์ต้องการการสแกนอัตโนมัติทุก commit การตรวจสอบ compliance ภายใน pipeline และการแก้ไขใน sprint เดียวกันโดยไม่มี gate แยก บทเรียนอธิบายว่า DevSecOps ฝังความปลอดภัยเข้าไปใน pipeline การพัฒนาโดยตรง เพื่อให้การตรวจสอบอย่างการสแกนช่องโหว่อัตโนมัติเกิดขึ้นอย่างต่อเนื่อง Waterfall รวมความปลอดภัยไว้ในขั้นตอนแยกต่างหาก ซึ่งขัดกับข้อกำหนดไม่มี gate แยก Agile ที่มีการทบทวนตาม sprint รองรับ iteration แต่ไม่ฝัง pipeline automation ในตัวเอง ส่วน OWASP SAMM เป็น maturity model ไม่ใช่ development methodology ที่ฝังการควบคุมต่อเนื่องใน pipeline"},{"id":170379661,"n":46,"d":4,"o":"4.2","q":"A development team is beginning work on a cloud-hosted healthcare application that will store and process protected health information. The project manager wants to defer security requirements to the design phase to avoid slowing down initial planning. What is the BEST reason to define security and compliance requirements during the requirements phase instead?","qth":"ทีมพัฒนากำลังเริ่มงานแอปพลิเคชันด้านสุขภาพที่โฮสต์บนคลาวด์ซึ่งจะจัดเก็บและประมวลผลข้อมูลสุขภาพที่ได้รับการคุ้มครอง (PHI) ผู้จัดการโครงการต้องการเลื่อนข้อกำหนดด้านความมั่นคงปลอดภัยไปกำหนดในขั้นตอนออกแบบ เพื่อไม่ให้การวางแผนเบื้องต้นช้าลง เหตุผลที่ดีที่สุด (BEST) ในการกำหนดข้อกำหนดด้านความมั่นคงปลอดภัยและ compliance ในขั้นตอน requirements แทนคืออะไร","a":["Frameworks like NIST SSDF and OWASP SAMM require organizations to document security requirements before any design work is initiated","Defining requirements early ensures that encryption standards and access controls are established before the implementation phase begins","Compliance obligations like HIPAA require that security controls be defined before architecture decisions are made, ensuring the design phase begins with a complete security foundation","Security testing tools like static analysis are only effective when executed against code that already reflects documented security requirements"],"ath":["กรอบอย่าง NIST SSDF และ OWASP SAMM กำหนดให้องค์กรต้องจัดทำเอกสารข้อกำหนดด้านความปลอดภัยก่อนเริ่มงานออกแบบใด ๆ","การกำหนดข้อกำหนดตั้งแต่เนิ่น ๆ ทำให้มาตรฐานการเข้ารหัสและ access control ถูกกำหนดก่อนเริ่มขั้นตอน implementation","ภาระผูกพันด้าน compliance อย่าง HIPAA กำหนดให้ต้องกำหนดมาตรการควบคุมความปลอดภัยก่อนตัดสินใจด้านสถาปัตยกรรม เพื่อให้ขั้นตอนออกแบบเริ่มด้วยรากฐานด้านความปลอดภัยที่สมบูรณ์","เครื่องมือทดสอบความปลอดภัยอย่าง static analysis ทำงานได้ผลก็ต่อเมื่อรันกับโค้ดที่สะท้อนข้อกำหนดด้านความปลอดภัยที่บันทึกไว้แล้วเท่านั้น"],"ans":"D","exp":"The lesson explicitly states that during the requirements phase, security needs and compliance requirements are defined, using a financial application subject to PCI DSS as an example. Waiting until design means architecture decisions may be made without a complete understanding of compliance obligations, creating rework risk. Static analysis tools operate during verification, not requirements. Encryption and access controls are design-phase outputs, not a justification for requirements-phase prioritization. NIST SSDF and SAMM provide guidance but do not mandate sequencing in the way described.","expth":"บทเรียนระบุชัดว่าในขั้นตอน requirements ต้องกำหนดความต้องการด้านความปลอดภัยและ compliance โดยยกตัวอย่างแอปพลิเคชันการเงินที่อยู่ภายใต้ PCI DSS การรอถึงขั้นออกแบบหมายความว่าการตัดสินใจด้านสถาปัตยกรรมอาจเกิดขึ้นโดยไม่เข้าใจภาระผูกพันด้าน compliance อย่างครบถ้วน ก่อให้เกิดความเสี่ยงต้องทำงานซ้ำ เครื่องมือ static analysis ทำงานในขั้นตอน verification ไม่ใช่ requirements การเข้ารหัสและ access control เป็นผลผลิตของขั้นตอนออกแบบ ไม่ใช่เหตุผลสนับสนุนการให้ความสำคัญในขั้นตอน requirements ส่วน NIST SSDF และ SAMM ให้แนวทาง แต่ไม่ได้บังคับลำดับขั้นตามที่อธิบาย"},{"id":170379663,"n":47,"d":4,"o":"4.3","q":"A security architect is beginning a threat modeling engagement for a new cloud-hosted API gateway that handles sensitive financial transactions. Before identifying potential threats, the architect needs to establish what is being protected, the system's boundaries, its component dependencies, and which assets are most critical to the organization. What is the MOST appropriate action at this stage?","qth":"สถาปนิกความมั่นคงปลอดภัยกำลังเริ่มงาน threat modeling สำหรับ API gateway ตัวใหม่บนคลาวด์ที่จัดการธุรกรรมทางการเงินที่อ่อนไหว ก่อนระบุภัยคุกคามที่เป็นไปได้ สถาปนิกต้องกำหนดสิ่งที่ต้องปกป้อง ขอบเขตของระบบ การพึ่งพาระหว่างองค์ประกอบ และสินทรัพย์ใดสำคัญที่สุดต่อองค์กร การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) ในขั้นนี้คืออะไร","a":["Assess the completed threat model by simulating attack scenarios against the API gateway in a test environment","Define the scope of the threat model by mapping system components, boundaries, and critical assets before any threat identification begins","Define countermeasures such as API keys and encryption to address the most common API threats","Apply the STRIDE framework to categorize potential threats across the API gateway's attack surface"],"ath":["ประเมิน threat model ที่เสร็จสมบูรณ์ด้วยการจำลองสถานการณ์โจมตีกับ API gateway ในสภาพแวดล้อมทดสอบ","กำหนดขอบเขตของ threat model ด้วยการทำแผนที่องค์ประกอบของระบบ ขอบเขต และสินทรัพย์สำคัญ ก่อนเริ่มระบุภัยคุกคามใด ๆ","กำหนด countermeasure เช่น API key และการเข้ารหัส เพื่อรับมือภัยคุกคามต่อ API ที่พบบ่อยที่สุด","ใช้กรอบ STRIDE เพื่อจัดประเภทภัยคุกคามที่เป็นไปได้ทั่ว attack surface ของ API gateway"],"ans":"B","exp":"OWASP threat modeling follows four sequential steps: define scope, identify threats, determine countermeasures, and assess results. Scoping is first and requires defining system boundaries, components, dependencies, and critical assets before any other activity begins. Applying STRIDE to categorize threats is the second step and cannot be done accurately without an established scope. Defining countermeasures is the third step and requires prior threat identification. Simulating attack scenarios to assess the model is the final step and presupposes all prior steps are complete.","expth":"OWASP threat modeling มีสี่ขั้นตอนตามลำดับ ได้แก่ กำหนดขอบเขต ระบุภัยคุกคาม กำหนด countermeasure และประเมินผล การกำหนดขอบเขตเป็นขั้นแรก ต้องกำหนดขอบเขตของระบบ องค์ประกอบ การพึ่งพา และสินทรัพย์สำคัญ ก่อนกิจกรรมอื่นใด การใช้ STRIDE จัดประเภทภัยคุกคามเป็นขั้นที่สอง และทำอย่างแม่นยำไม่ได้หากไม่มีขอบเขตที่กำหนดไว้ การกำหนด countermeasure เป็นขั้นที่สามและต้องอาศัยการระบุภัยคุกคามก่อน ส่วนการจำลองสถานการณ์โจมตีเพื่อประเมินโมเดลเป็นขั้นสุดท้าย และสมมติว่าขั้นก่อนหน้าเสร็จแล้ว"},{"id":170379665,"n":48,"d":4,"o":"4.3","q":"A security team is threat modeling a cloud-based payroll application that handles direct deposit data for thousands of employees. Leadership requires that the threat modeling effort not only identify technical vulnerabilities but also simulate realistic attack scenarios, connect identified risks to regulatory penalties and financial loss, and ensure that mitigations are ranked by business priority rather than technical severity alone. Which threat modeling methodology BEST meets all three of these requirements?","qth":"ทีมความมั่นคงปลอดภัยกำลังทำ threat modeling ให้แอปพลิเคชัน payroll บนคลาวด์ที่จัดการข้อมูลการโอนเงินเข้าบัญชีของพนักงานหลายพันคน ผู้บริหารกำหนดว่าการทำ threat modeling ต้องไม่เพียงระบุช่องโหว่ทางเทคนิค แต่ต้องจำลองสถานการณ์โจมตีที่สมจริง เชื่อมความเสี่ยงที่ระบุกับค่าปรับตามกฎระเบียบและความสูญเสียทางการเงิน และจัดลำดับการบรรเทาตามความสำคัญทางธุรกิจ ไม่ใช่ความรุนแรงทางเทคนิคเพียงอย่างเดียว methodology ของ threat modeling ใดตอบทั้งสามข้อกำหนดได้ดีที่สุด (BEST)","a":["DREAD, because it scores threats by impact, reproducibility, exploitability, affected users, and discoverability, enabling quantitative prioritization","ATASM, because it maps the system architecture and identifies attack surfaces, ensuring mitigations are integrated into the application's design layer","PASTA, because it is a structured seven-stage methodology that simulates attack scenarios, evaluates business impact of successful attacks, and ties mitigations to business priorities","STRIDE, because it systematically identifies all six categories of threats across the application's components, ensuring no threat type is overlooked"],"ath":["DREAD เพราะให้คะแนนภัยคุกคามตามผลกระทบ ความสามารถในการทำซ้ำ ความง่ายในการโจมตี ผู้ใช้ที่ได้รับผลกระทบ และความง่ายในการค้นพบ ทำให้จัดลำดับความสำคัญเชิงปริมาณได้","ATASM เพราะทำแผนที่สถาปัตยกรรมระบบและระบุ attack surface เพื่อให้การบรรเทาถูกผสานในชั้นการออกแบบของแอปพลิเคชัน","PASTA เพราะเป็น methodology เจ็ดขั้นตอนที่มีโครงสร้าง จำลองสถานการณ์โจมตี ประเมินผลกระทบทางธุรกิจของการโจมตีที่สำเร็จ และผูกการบรรเทากับความสำคัญทางธุรกิจ","STRIDE เพราะระบุภัยคุกคามหกประเภทอย่างเป็นระบบทั่วองค์ประกอบของแอปพลิเคชัน เพื่อให้ไม่มีประเภทภัยคุกคามใดตกหล่น"],"ans":"C","exp":"PASTA is a seven-stage methodology that simulates attack scenarios, evaluates business implications such as financial loss and regulatory penalties in its final Risk and Impact Analysis stage, and ties mitigations to business priorities. STRIDE identifies threat categories systematically but does not simulate attacks or evaluate business impact. DREAD scores threats by technical factors and adds prioritization but does not assess regulatory or financial outcomes. ATASM maps architecture and attack surfaces but includes no attack simulation or business impact analysis stage.","expth":"PASTA เป็น methodology เจ็ดขั้นตอนที่จำลองสถานการณ์โจมตี ประเมินผลกระทบทางธุรกิจ เช่น ความสูญเสียทางการเงินและค่าปรับตามกฎระเบียบ ในขั้นสุดท้าย Risk and Impact Analysis และผูกการบรรเทากับความสำคัญทางธุรกิจ STRIDE ระบุประเภทภัยคุกคามอย่างเป็นระบบ แต่ไม่จำลองการโจมตีหรือประเมินผลกระทบทางธุรกิจ DREAD ให้คะแนนภัยคุกคามตามปัจจัยทางเทคนิคและช่วยจัดลำดับความสำคัญ แต่ไม่ประเมินผลลัพธ์ด้านกฎระเบียบหรือการเงิน ส่วน ATASM ทำแผนที่สถาปัตยกรรมและ attack surface แต่ไม่มีขั้นตอนจำลองการโจมตีหรือวิเคราะห์ผลกระทบทางธุรกิจ"},{"id":170379667,"n":49,"d":4,"o":"4.3","q":"A developer on your team is building a cloud-based customer portal that includes a search feature. During a code review, you identify that user input from the search field is being concatenated directly into SQL query strings. What is the MOST effective remediation for this vulnerability?","qth":"นักพัฒนาในทีมของคุณกำลังสร้างพอร์ทัลลูกค้าบนคลาวด์ที่มีฟีเจอร์ค้นหา ระหว่าง code review คุณพบว่าอินพุตของผู้ใช้จากช่องค้นหาถูกต่อเข้ากับสตริง SQL query โดยตรง การแก้ไขที่มีประสิทธิผลที่สุด (MOST effective) สำหรับช่องโหว่นี้คืออะไร","a":["Use parameterized queries to separate SQL code from user-supplied input, preventing manipulation of database queries.","Implement input validation using whitelists to reject characters commonly found in SQL syntax.","Enable secure error handling to ensure that SQL error messages are not returned to the user interface.","Apply output encoding to all data returned from search queries before rendering it in the browser."],"ath":["ใช้ parameterized query เพื่อแยกโค้ด SQL ออกจากอินพุตที่ผู้ใช้ให้มา ป้องกันการบิดเบือน database query","ติดตั้ง input validation แบบ whitelist เพื่อปฏิเสธอักขระที่พบบ่อยในไวยากรณ์ SQL","เปิดใช้ secure error handling เพื่อให้ข้อความแสดงข้อผิดพลาด SQL ไม่ถูกส่งกลับไปยังส่วนติดต่อผู้ใช้","ใช้ output encoding กับข้อมูลทั้งหมดที่ส่งกลับจาก search query ก่อนแสดงผลในเบราว์เซอร์"],"ans":"A","exp":"SAFECode identifies parameterized queries as the primary countermeasure for SQL injection under CWE-89. Parameterized queries structurally separate SQL logic from user-supplied input so that no amount of crafted input can alter the query's intended behavior. Input validation reduces attack surface but cannot fully prevent injection when string concatenation is the root cause. Output encoding prevents cross-site scripting in rendered responses and does not address database query manipulation. Secure error handling conceals diagnostic detail from attackers but does not prevent the injection itself.","expth":"SAFECode ระบุ parameterized query เป็นมาตรการรับมือหลักสำหรับ SQL injection ภายใต้ CWE-89 Parameterized query แยกตรรกะ SQL ออกจากอินพุตของผู้ใช้เชิงโครงสร้าง ทำให้อินพุตที่สร้างขึ้นเท่าใดก็เปลี่ยนพฤติกรรมที่ตั้งใจของ query ไม่ได้ Input validation ลดพื้นที่การโจมตีแต่ป้องกัน injection ได้ไม่สมบูรณ์เมื่อต้นเหตุคือการต่อสตริง Output encoding ป้องกัน cross-site scripting ในผลลัพธ์ที่แสดง ไม่ได้แก้การบิดเบือน database query ส่วน secure error handling ซ่อนรายละเอียดวินิจฉัยจากผู้โจมตี แต่ไม่ป้องกันตัว injection"},{"id":170379669,"n":50,"d":4,"o":"4.4","q":"A security team is conducting assurance testing on a cloud-hosted payment API. SAST scans have completed and identified several code-level issues. The team now needs a method that can observe how specific inputs traverse the application during actual execution and confirm whether flagged code paths are reachable under real transaction conditions. What is the MOST appropriate testing method to add at this stage?","qth":"ทีมความมั่นคงปลอดภัยกำลังทดสอบ assurance ของ payment API ที่โฮสต์บนคลาวด์ การสแกน SAST เสร็จแล้วและระบุปัญหาระดับโค้ดหลายรายการ ทีมต้องการวิธีที่สังเกตได้ว่าอินพุตเฉพาะเคลื่อนผ่านแอปพลิเคชันอย่างไรระหว่างการทำงานจริง และยืนยันว่า code path ที่ถูกแจ้งเข้าถึงได้ภายใต้เงื่อนไขธุรกรรมจริงหรือไม่ วิธีทดสอบใดเหมาะสมที่สุด (MOST appropriate) ที่ควรเพิ่มในขั้นนี้","a":["Interactive Application Security Testing, because it instruments the running application and monitors code behavior during execution with internal context.","Software Composition Analysis, because it inspects the component dependency tree and identifies libraries associated with the confirmed code paths.","Dynamic Application Security Testing, because it tests the running application from the outside and can confirm exposed runtime weaknesses in the API.","Blackbox testing, because it simulates an external attacker perspective and validates API behavior without prior knowledge of the code."],"ath":["Interactive Application Security Testing เพราะติดตั้ง instrumentation ในแอปพลิเคชันที่กำลังทำงาน และเฝ้าติดตามพฤติกรรมของโค้ดระหว่างการทำงานพร้อมบริบทภายใน","Software Composition Analysis เพราะตรวจ dependency tree ขององค์ประกอบและระบุไลบรารีที่เกี่ยวข้องกับ code path ที่ยืนยันแล้ว","Dynamic Application Security Testing เพราะทดสอบแอปพลิเคชันที่กำลังทำงานจากภายนอก และยืนยันจุดอ่อนขณะรันที่ถูกเปิดเผยใน API ได้","Blackbox testing เพราะจำลองมุมมองผู้โจมตีภายนอกและตรวจสอบพฤติกรรม API โดยไม่ต้องรู้โค้ดล่วงหน้า"],"ans":"A","exp":"IAST instruments the running application with internal agents, enabling simultaneous observation of code paths and runtime behavior during execution. This provides internal runtime context that no other listed method offers. DAST tests the running application from the outside and cannot observe internal code traversal. Blackbox is a testing posture that defines how much prior knowledge the tester holds, not a method that provides internal code-level visibility. SCA evaluates third-party component dependencies and does not analyze runtime code execution paths.","expth":"IAST ติดตั้ง instrumentation ด้วย agent ภายในแอปพลิเคชันที่กำลังทำงาน ทำให้สังเกต code path และพฤติกรรมขณะรันได้พร้อมกันระหว่างการทำงาน ให้บริบทขณะรันภายในที่วิธีอื่นในรายการให้ไม่ได้ DAST ทดสอบแอปพลิเคชันที่กำลังทำงานจากภายนอกและสังเกตการเคลื่อนผ่านของโค้ดภายในไม่ได้ Blackbox เป็นท่าทีการทดสอบที่กำหนดว่าผู้ทดสอบรู้ข้อมูลล่วงหน้าเพียงใด ไม่ใช่วิธีที่ให้ visibility ระดับโค้ดภายใน ส่วน SCA ประเมิน dependency ขององค์ประกอบบุคคลที่สาม ไม่ได้วิเคราะห์เส้นทางการ
