ภาพแวดล้อม cloud และให้ทีมปฏิบัติการเข้าถึง management plane อย่างกว้างเพื่อเร่งการ provisioning การทบทวนด้านความปลอดภัยพบว่ามีการเปลี่ยนแปลงการกำหนดค่าโดยไม่มีการตรวจสอบย้อนกลับได้ (traceability) และบริการที่ไม่สำคัญหลายตัวถูก provision เกินความจำเป็นด้วยสิทธิ์ระดับสูง การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) เพื่อแก้ช่องว่างด้านความปลอดภัยของ management plane นี้คืออะไร","a":["Restrict the operations team to read-only access until a full audit of all cloud services is completed and baseline configurations are documented.","Deploy a network intrusion detection system on the management plane to monitor for unauthorized activity and flag anomalous provisioning requests.","Implement strong IAM policies and enable comprehensive logging of all management plane activities to restore traceability and limit over-provisioned access.","Require the operations team to submit change requests through a ticketing system before modifying any resource, with approvals routed to senior leadership."],"ath":["จำกัดทีมปฏิบัติการให้มีสิทธิ์อ่านอย่างเดียวจนกว่าจะตรวจสอบบริการ cloud ทั้งหมดเสร็จและบันทึก baseline configuration ครบ","ติดตั้ง network intrusion detection system บน management plane เพื่อเฝ้าติดตามกิจกรรมที่ไม่ได้รับอนุญาตและทำเครื่องหมายคำขอ provisioning ที่ผิดปกติ","กำหนดนโยบาย IAM ที่เข้มแข็งและเปิดใช้ logging ที่ครอบคลุมสำหรับกิจกรรมทั้งหมดบน management plane เพื่อกู้ traceability และจำกัดการเข้าถึงที่ถูก provision เกินความจำเป็น","กำหนดให้ทีมปฏิบัติการยื่นคำขอเปลี่ยนแปลงผ่านระบบ ticketing ก่อนแก้ไข resource ใด ๆ โดยส่งการอนุมัติไปยังผู้บริหารระดับสูง"],"ans":"C","exp":"IAM policies, MFA, and logging are the specific controls for securing the management plane, since it often carries elevated permissions and that logging supports accountability and anomaly detection. Restricting to read-only halts operations without addressing root cause. An IDS monitors network traffic, not administrative identity and access decisions. A ticketing system is a process control that does not resolve the underlying permissions or traceability gap.","expth":"นโยบาย IAM, MFA และ logging เป็นมาตรการเฉพาะสำหรับการรักษาความปลอดภัย management plane เพราะ management plane มักมีสิทธิ์ระดับสูง และ logging สนับสนุนความรับผิดชอบ (accountability) และการตรวจจับความผิดปกติ การจำกัดให้อ่านอย่างเดียวหยุดการปฏิบัติงานโดยไม่แก้ต้นเหตุ IDS เฝ้าดูทราฟฟิกเครือข่าย ไม่ใช่การตัดสินใจด้าน identity และ access ของผู้ดูแลระบบ และระบบ ticketing เป็นมาตรการเชิงกระบวนการ (process control) ที่ไม่แก้ช่องว่างด้านสิทธิ์หรือ traceability ที่เป็นต้นเหตุ"},{"id":170379775,"n":103,"d":3,"o":"3.1","q":"A cloud administrator needs to implement controls for the layer of cloud infrastructure through which resources are provisioned, monitored, and managed via a provider's console and APIs. What is the MOST appropriate security focus for protecting this component?","qth":"cloud administrator ต้องกำหนดมาตรการควบคุมสำหรับชั้นของโครงสร้างพื้นฐาน cloud ที่ใช้ provision เฝ้าติดตาม และบริหารจัดการ resource ผ่าน console และ API ของ provider จุดเน้นด้านความปลอดภัยที่เหมาะสมที่สุด (MOST appropriate) ในการปกป้ององค์ประกอบนี้คืออะไร","a":["Hypervisor patching and container image scanning to prevent exploitation of the virtualization stack.","Network segmentation using virtual private clouds and firewall rules to isolate traffic at this layer.","Encryption of data at rest and in transit, combined with tokenization of sensitive fields stored in the layer.","Strong IAM policies, multi-factor authentication, and comprehensive logging of all administrative activity."],"ath":["การ patch hypervisor และการสแกน container image เพื่อป้องกันการโจมตีชั้น virtualization","การแบ่งเครือข่าย (network segmentation) ด้วย virtual private cloud และกฎ firewall เพื่อแยกทราฟฟิกที่ชั้นนี้","การเข้ารหัสข้อมูลขณะพักและขณะส่ง ร่วมกับ tokenization ของฟิลด์ที่มีความอ่อนไหวซึ่งเก็บในชั้นนี้","นโยบาย IAM ที่เข้มแข็ง multi-factor authentication และ logging ที่ครอบคลุมกิจกรรมการบริหารจัดการทั้งหมด"],"ans":"D","exp":"The management plane is the component through which administrators provision, monitor, and configure cloud resources via consoles or APIs. Because it carries elevated permissions, it is secured through strong IAM policies, MFA, and logging to track changes and detect anomalies. Encryption and tokenization apply to storage security. Network segmentation applies to networking. Hypervisor and container security apply to virtualization. Each of those controls targets a different infrastructure component.","expth":"Management plane คือองค์ประกอบที่ผู้ดูแลใช้ provision เฝ้าติดตาม และกำหนดค่า cloud resource ผ่าน console หรือ API เพราะมีสิทธิ์ระดับสูง จึงปกป้องด้วยนโยบาย IAM ที่เข้มแข็ง MFA และ logging เพื่อติดตามการเปลี่ยนแปลงและตรวจจับความผิดปกติ การเข้ารหัสและ tokenization ใช้กับความปลอดภัยของ storage การแบ่งเครือข่ายใช้กับ networking ส่วนความปลอดภัยของ hypervisor และ container ใช้กับ virtualization มาตรการเหล่านั้นแต่ละอย่างมุ่งเป้าที่องค์ประกอบโครงสร้างพื้นฐานคนละส่วนกัน"},{"id":170379777,"n":104,"d":3,"o":"3.2","q":"An organization operates a hybrid cloud environment, running sensitive workloads in both a public cloud and an on-premises data center. A security audit finds that the on-premises servers lack adequate HVAC controls. What is the BEST way to assign accountability for remediating this gap?","qth":"องค์กรดำเนินสภาพแวดล้อม hybrid cloud โดยรัน workload ที่มีความอ่อนไหวทั้งบน public cloud และ data center ภายในองค์กร (on-premises) การตรวจสอบด้านความปลอดภัยพบว่าเซิร์ฟเวอร์ on-premises ขาดการควบคุม HVAC ที่เพียงพอ วิธีที่ดีที่สุด (BEST) ในการกำหนดความรับผิดชอบในการแก้ไขช่องว่างนี้คืออะไร","a":["The organization should escalate the finding to the cloud provider, because environmental design is part of the provider's physical security mandate.","Responsibility is shared between the organization and the cloud provider under the hybrid model's joint security framework.","The cloud service provider is responsible, because the shared responsibility model requires them to ensure physical environmental controls across all deployment models.","The organization is responsible, because on-premises infrastructure falls entirely within the customer's security obligations."],"ath":["องค์กรควรส่งเรื่องต่อให้ cloud provider เพราะการออกแบบด้านสภาพแวดล้อมเป็นส่วนหนึ่งของหน้าที่ด้านความปลอดภัยทางกายภาพของ provider","ความรับผิดชอบเป็นของทั้งองค์กรและ cloud provider ร่วมกัน ภายใต้กรอบความปลอดภัยร่วมของโมเดล hybrid","cloud service provider เป็นผู้รับผิดชอบ เพราะ shared responsibility model กำหนดให้ provider ต้องดูแลมาตรการควบคุมสภาพแวดล้อมทางกายภาพในทุกรูปแบบการติดตั้ง","องค์กรเป็นผู้รับผิดชอบ เพราะโครงสร้างพื้นฐาน on-premises อยู่ในภาระผูกพันด้านความปลอดภัยของลูกค้าทั้งหมด"],"ans":"D","exp":"In an on-premises environment, the organization is responsible for everything, including HVAC, fire suppression, and building security. The shared responsibility model places physical and environmental security with the CSP only for cloud-hosted infrastructure. When an organization operates its own on-premises data center in a hybrid model, that physical responsibility does not transfer to the provider. All of the other answers misapply the shared responsibility model to on-premises infrastructure.","expth":"ในสภาพแวดล้อม on-premises องค์กรรับผิดชอบทุกอย่าง รวมถึง HVAC ระบบดับเพลิง และความปลอดภัยของอาคาร shared responsibility model กำหนดให้ความปลอดภัยทางกายภาพและสิ่งแวดล้อมเป็นของ CSP เฉพาะโครงสร้างพื้นฐานที่โฮสต์บน cloud เมื่อองค์กรดำเนิน data center on-premises ของตนเองในโมเดล hybrid ความรับผิดชอบทางกายภาพนั้นไม่ได้โอนไปยัง provider คำตอบอื่นทั้งหมดนำ shared responsibility model ไปใช้กับโครงสร้างพื้นฐาน on-premises อย่างผิดที่"},{"id":170379779,"n":105,"d":3,"o":"3.2","q":"A data center operations team is selecting a facility tier for a new deployment supporting healthcare data. The SLA requires no more than 1.6 hours of downtime per year, and the operations team must maintain systems without taking the facility offline for scheduled maintenance. What is the MOST appropriate Uptime Institute tier classification to meet both requirements?","qth":"ทีมปฏิบัติการ data center กำลังเลือก tier ของสถานที่สำหรับการติดตั้งใหม่ที่รองรับข้อมูลด้านสุขภาพ SLA กำหนดให้มี downtime ไม่เกิน 1.6 ชั่วโมงต่อปี และทีมปฏิบัติการต้องบำรุงรักษาระบบได้โดยไม่ต้องหยุดการทำงานของสถานที่ในการบำรุงรักษาตามกำหนด การจัดประเภท tier ของ Uptime Institute ที่เหมาะสมที่สุด (MOST appropriate) เพื่อตอบสนองทั้งสองข้อกำหนดคืออะไร","a":["Tier II, providing basic redundancy with a single path for power and cooling.","Tier III, designed for concurrent maintainability with multiple power and cooling pathways.","Tier I, providing basic site infrastructure with no redundant capacity components.","Tier IV, providing fault tolerance with fully redundant active components on all paths."],"ath":["Tier II ที่ให้ redundancy พื้นฐานโดยมีเส้นทางเดียวสำหรับไฟฟ้าและระบบทำความเย็น","Tier III ที่ออกแบบให้ concurrent maintainability โดยมีเส้นทางไฟฟ้าและระบบทำความเย็นหลายเส้นทาง","Tier I ที่ให้โครงสร้างพื้นฐานพื้นฐานของสถานที่โดยไม่มีส่วนประกอบสำรอง (redundant capacity components)","Tier IV ที่ให้ fault tolerance โดยมีส่วนประกอบ active ที่ซ้ำซ้อนอย่างสมบูรณ์ในทุกเส้นทาง"],"ans":"B","exp":"Tier III data centers target 99.982% availability, corresponding to less than 1.6 hours of downtime annually, and support concurrent maintainability, meaning maintenance can occur without taking systems offline. Tier I and Tier II represent lower availability tiers lacking the concurrent maintainability feature the scenario requires. Tier IV exceeds the stated requirement by adding full fault tolerance beyond what the SLA specifies, introducing unnecessary cost. The decision requires matching both an availability metric and a maintenance constraint to the correct tier.","expth":"data center ระดับ Tier III มีเป้าหมาย availability ที่ 99.982% ซึ่งตรงกับ downtime น้อยกว่า 1.6 ชั่วโมงต่อปี และรองรับ concurrent maintainability คือบำรุงรักษาได้โดยไม่ต้องหยุดระบบ Tier I และ Tier II เป็น tier ที่มี availability ต่ำกว่าและขาดคุณสมบัติ concurrent maintainability ที่สถานการณ์นี้ต้องการ ส่วน Tier IV เกินกว่าข้อกำหนดที่ระบุ โดยเพิ่ม fault tolerance เต็มรูปแบบเกินกว่าที่ SLA กำหนด ทำให้เกิดต้นทุนที่ไม่จำเป็น การตัดสินใจนี้ต้องจับคู่ทั้งตัวชี้วัด availability และข้อจำกัดด้านการบำรุงรักษาเข้ากับ tier ที่ถูกต้อง"},{"id":170379781,"n":106,"d":3,"o":"3.2","q":"A rapidly growing financial services firm needs to expand its cloud hosting capacity within six months and lacks the capital for a multiyear construction project. Leadership wants to avoid owning and maintaining a physical site. What is the BEST approach to meeting this requirement?","qth":"บริษัทบริการทางการเงินที่เติบโตอย่างรวดเร็วต้องขยายกำลังการโฮสต์บน cloud ภายในหกเดือน และไม่มีเงินทุนสำหรับโครงการก่อสร้างหลายปี ผู้บริหารต้องการหลีกเลี่ยงการเป็นเจ้าของและบำรุงรักษาสถานที่ทางกายภาพ แนวทางที่ดีที่สุด (BEST) เพื่อตอบสนองข้อกำหนดนี้คืออะไร","a":["Deploy additional virtual infrastructure in the existing cloud environment and defer the physical expansion decision.","Negotiate a hybrid ownership model with a cloud provider to share construction costs and reduce upfront capital expenditure.","Build a proprietary data center to achieve full control over design, security, and long-term scalability.","Lease space in a co-location facility, which offers flexibility, speed, and freedom from the burden of owning the physical site."],"ath":["ติดตั้ง virtual infrastructure เพิ่มเติมในสภาพแวดล้อม cloud ที่มีอยู่ และเลื่อนการตัดสินใจขยายทางกายภาพออกไป","เจรจาโมเดลความเป็นเจ้าของแบบ hybrid กับ cloud provider เพื่อแบ่งต้นทุนการก่อสร้างและลดรายจ่ายลงทุนเริ่มต้น","สร้าง data center ของตนเองเพื่อควบคุมการออกแบบ ความปลอดภัย และความสามารถในการขยายระยะยาวได้เต็มที่","เช่าพื้นที่ในสถานที่ co-location ซึ่งให้ความยืดหยุ่น ความรวดเร็ว และไม่ต้องแบกภาระการเป็นเจ้าของสถานที่ทางกายภาพ"],"ans":"D","exp":"Leasing space in a co-location facility offers flexibility and speed, allowing organizations to focus on managing their systems without the burden of owning and maintaining a physical site. Building a data center provides full control but requires high upfront costs and long lead times, which directly conflicts with the six-month timeline and capital constraint. The hybrid ownership and virtual-only options are not viable solutions to this buy-or-build decision given the stated constraints.","expth":"การเช่าพื้นที่ในสถานที่ co-location ให้ความยืดหยุ่นและความรวดเร็ว ทำให้องค์กรมุ่งบริหารระบบของตนได้โดยไม่ต้องแบกภาระการเป็นเจ้าของและบำรุงรักษาสถานที่ทางกายภาพ การสร้าง data center ให้การควบคุมเต็มรูปแบบ แต่ต้องใช้ต้นทุนเริ่มต้นสูงและใช้เวลานาน ซึ่งขัดกับกรอบเวลาหกเดือนและข้อจำกัดด้านเงินทุนโดยตรง ส่วนโมเดลความเป็นเจ้าของแบบ hybrid และตัวเลือก virtual อย่างเดียวไม่ใช่ทางออกที่เป็นไปได้สำหรับการตัดสินใจซื้อหรือสร้างนี้ภายใต้ข้อจำกัดที่ระบุ"},{"id":170379783,"n":107,"d":3,"o":"3.3","q":"A cloud security operations team receives an alert that a significant data exfiltration event may have occurred. When they attempt to investigate, they find that logging was not enabled on several cloud storage services, cloud accounts were created by individual teams outside of the central governance process, and no SIEM is in place to correlate events across accounts. What is the PRIMARY concern this situation illustrates?","qth":"ทีม cloud security operations ได้รับ alert ว่าอาจเกิดเหตุการณ์ data exfiltration ครั้งสำคัญ เมื่อพยายามสอบสวนกลับพบว่า logging ไม่ได้เปิดใช้งานบน cloud storage service หลายตัว บัญชี cloud ถูกสร้างโดยแต่ละทีมนอกกระบวนการ governance ส่วนกลาง และไม่มี SIEM ที่ใช้ correlate เหตุการณ์ข้ามบัญชี ข้อกังวลหลัก (PRIMARY) ที่สถานการณ์นี้แสดงให้เห็นคืออะไร","a":["The organization is exposed to accidental cloud disclosure because ungoverned account creation allows teams to share data without authorization controls.","The organization lacks the data governance controls needed to classify and restrict sensitive data, allowing exfiltration to occur without triggering policy-based alerts.","The absence of multi-factor authentication on the storage services allowed an attacker to access resources without proper identity verification.","Limited cloud visibility and observability prevent the team from determining what assets exist, who accessed them, and what activity occurred, making detection and response impossible."],"ath":["องค์กรเสี่ยงต่อการเปิดเผยข้อมูลบน cloud โดยไม่ตั้งใจ เพราะการสร้างบัญชีที่ไม่ได้รับการกำกับดูแลทำให้ทีมต่าง ๆ แชร์ข้อมูลได้โดยไม่มีมาตรการควบคุมการอนุญาต","องค์กรขาดมาตรการควบคุม data governance ที่จำเป็นในการจัดประเภทและจำกัดข้อมูลที่มีความอ่อนไหว ทำให้ exfiltration เกิดขึ้นได้โดยไม่กระตุ้น alert ตามนโยบาย","การไม่มี multi-factor authentication บน storage service ทำให้ผู้โจมตีเข้าถึง resource ได้โดยไม่มีการยืนยันตัวตนที่เหมาะสม","การมองเห็นและ observability บน cloud ที่จำกัด ทำให้ทีมไม่สามารถระบุได้ว่ามีสินทรัพย์ใดบ้าง ใครเข้าถึง และเกิดกิจกรรมอะไร ทำให้การตรวจจับและการตอบสนองเป็นไปไม่ได้"],"ans":"D","exp":"Limited visibility means the organization cannot determine what assets exist, who accessed them, or what activity occurred. Disabled logging, ungoverned accounts, and no SIEM are the conditions that produce this threat. Accidental disclosure describes unintentional data sharing, not an investigation blocked by missing logs. MFA absence is not described as a factor in the scenario. Data classification addresses sharing policy, not the observability gap that is preventing the investigation from proceeding.","expth":"Limited visibility หมายความว่าองค์กรไม่สามารถระบุได้ว่ามีสินทรัพย์ใดบ้าง ใครเข้าถึง หรือเกิดกิจกรรมอะไร การปิด logging บัญชีที่ไม่ได้รับการกำกับดูแล และการไม่มี SIEM เป็นเงื่อนไขที่ก่อให้เกิดภัยคุกคามนี้ การเปิดเผยโดยไม่ตั้งใจ (accidental disclosure) หมายถึงการแชร์ข้อมูลโดยไม่เจตนา ไม่ใช่การสอบสวนที่ถูกขวางด้วยการไม่มี log การไม่มี MFA ไม่ได้ถูกระบุว่าเป็นปัจจัยในสถานการณ์นี้ และการจัดประเภทข้อมูล (data classification) เกี่ยวกับนโยบายการแชร์ ไม่ใช่ช่องว่างด้าน observability ที่ขัดขวางการสอบสวน"},{"id":170379785,"n":108,"d":3,"o":"3.3","q":"A financial services organization has migrated twenty business units to the cloud over three years, each unit adopting cloud services independently without a shared security framework. Security incidents have recurred across units despite individual remediation efforts. The CISO observes that each unit has different logging standards, inconsistent IAM configurations, and no defined incident response process. What is the BEST action to address the underlying cause of the recurring incidents?","qth":"องค์กรบริการทางการเงินย้ายหน่วยธุรกิจยี่สิบหน่วยขึ้น cloud ในระยะเวลาสามปี โดยแต่ละหน่วยนำบริการ cloud มาใช้อย่างอิสระโดยไม่มีกรอบความปลอดภัยร่วม เหตุการณ์ด้านความปลอดภัยเกิดซ้ำข้ามหน่วยแม้แต่ละหน่วยจะแก้ไขเองแล้ว CISO สังเกตว่าแต่ละหน่วยมีมาตรฐาน logging ต่างกัน การกำหนดค่า IAM ไม่สอดคล้องกัน และไม่มีกระบวนการ incident response ที่กำหนดไว้ การดำเนินการที่ดีที่สุด (BEST) เพื่อแก้สาเหตุที่แท้จริงของเหตุการณ์ที่เกิดซ้ำคืออะไร","a":["Establish a unified cloud security strategy that defines consistent security standards, governance, incident response processes, and layered controls across all business units before the next incident.","Require each business unit to engage a third-party auditor to assess current cloud security posture and submit remediation plans within sixty days.","Deploy a centralized SIEM platform to aggregate logs from all twenty business units and correlate events across the organization's cloud accounts.","Mandate that all business units conduct quarterly access reviews and enforce multi-factor authentication to eliminate the IAM configuration inconsistencies."],"ath":["จัดทำกลยุทธ์ความปลอดภัยบน cloud แบบเป็นหนึ่งเดียว ที่กำหนดมาตรฐานความปลอดภัยที่สอดคล้องกัน governance กระบวนการ incident response และมาตรการควบคุมแบบหลายชั้นในทุกหน่วยธุรกิจ ก่อนเกิดเหตุการณ์ครั้งถัดไป","กำหนดให้แต่ละหน่วยธุรกิจว่าจ้างผู้ตรวจสอบบุคคลที่สามเพื่อประเมินสถานะความปลอดภัยบน cloud ปัจจุบัน และส่งแผนการแก้ไขภายในหกสิบวัน","ติดตั้งแพลตฟอร์ม SIEM ส่วนกลางเพื่อรวบรวม log จากทั้งยี่สิบหน่วยธุรกิจ และ correlate เหตุการณ์ข้ามบัญชี cloud ขององค์กร","กำหนดให้ทุกหน่วยธุรกิจทำการทบทวนการเข้าถึงรายไตรมาสและบังคับใช้ multi-factor authentication เพื่อขจัดความไม่สอดคล้องของการกำหนดค่า IAM"],"ans":"A","exp":"Inadequate cloud security strategy occurs when organizations adopt cloud services incrementally without consistent standards or governance. Recurring incidents across units with different logging standards, inconsistent IAM, and no shared incident response process are direct symptoms of this gap. A SIEM treats a visibility symptom, not the root cause. MFA and access reviews address only the IAM gap. Third-party audits produce findings but cannot substitute for an ongoing governing strategy that prevents recurrence across all units.","expth":"กลยุทธ์ความปลอดภัยบน cloud ที่ไม่เพียงพอเกิดขึ้นเมื่อองค์กรนำบริการ cloud มาใช้ทีละส่วนโดยไม่มีมาตรฐานหรือ governance ที่สอดคล้องกัน เหตุการณ์ที่เกิดซ้ำข้ามหน่วยซึ่งมีมาตรฐาน logging ต่างกัน IAM ไม่สอดคล้อง และไม่มีกระบวนการ incident response ร่วม เป็นอาการโดยตรงของช่องว่างนี้ SIEM รักษาอาการด้านการมองเห็น ไม่ใช่ต้นเหตุ MFA และการทบทวนการเข้าถึงแก้เฉพาะช่องว่างด้าน IAM และการตรวจสอบโดยบุคคลที่สามให้ข้อค้นพบ แต่ไม่สามารถแทนที่กลยุทธ์กำกับดูแลอย่างต่อเนื่องที่ป้องกันการเกิดซ้ำในทุกหน่วย"},{"id":170379787,"n":109,"d":3,"o":"3.3, 6.4","q":"A cloud security manager is drafting the organization's overall position on how much risk the company will accept across all business activities. A separate team is defining acceptable risk limits for a specific new cloud deployment initiative. What is the PRIMARY concern/consideration that distinguishes the concept governing the organization-wide position from the one governing the specific initiative?","qth":"cloud security manager กำลังร่างจุดยืนโดยรวมขององค์กรว่าบริษัทจะยอมรับความเสี่ยงได้มากเพียงใดในทุกกิจกรรมทางธุรกิจ ขณะที่ทีมอื่นกำหนดขีดจำกัดความเสี่ยงที่ยอมรับได้สำหรับโครงการติดตั้ง cloud ใหม่โครงการหนึ่งโดยเฉพาะ ข้อพิจารณาหลัก (PRIMARY) ที่แยกแนวคิดซึ่งกำกับจุดยืนระดับองค์กรออกจากแนวคิดที่กำกับโครงการเฉพาะคืออะไร","a":["The organization-wide position is established by the security team, while the initiative-level limit is set by the cloud service provider.","The organization-wide position reflects a strategic, high-level view of acceptable risk, while the initiative-level limit is operationally focused and more granular.","The organization-wide position is reviewed annually, while the initiative-level limit is reviewed only when a new deployment is launched.","The organization-wide position applies only to regulated data, while the initiative-level limit applies to all cloud workloads."],"ath":["จุดยืนระดับองค์กรกำหนดโดยทีม security ขณะที่ขีดจำกัดระดับโครงการกำหนดโดย cloud service provider","จุดยืนระดับองค์กรสะท้อนมุมมองเชิงกลยุทธ์ระดับสูงต่อความเสี่ยงที่ยอมรับได้ ขณะที่ขีดจำกัดระดับโครงการเน้นการปฏิบัติงานและละเอียดกว่า","จุดยืนระดับองค์กรได้รับการทบทวนทุกปี ขณะที่ขีดจำกัดระดับโครงการทบทวนเฉพาะเมื่อมีการเปิดตัวการติดตั้งใหม่","จุดยืนระดับองค์กรใช้เฉพาะกับข้อมูลที่อยู่ภายใต้การกำกับดูแล ขณะที่ขีดจำกัดระดับโครงการใช้กับ workload บน cloud ทั้งหมด"],"ans":"B","exp":"Risk appetite is defined as as the overall level of risk an organization is willing to accept, reflecting a strategic, high-level perspective. Risk tolerance is the specific amount of risk acceptable within a particular area or initiative, and is more granular and operationally focused. The Risk appetite sets the risk boundaries, while risk tolerance defines the limits within those boundaries. The other options introduce distinctions not supported by these definitions.","expth":"Risk appetite คือระดับความเสี่ยงโดยรวมที่องค์กรเต็มใจยอมรับ สะท้อนมุมมองเชิงกลยุทธ์ระดับสูง ส่วน risk tolerance คือปริมาณความเสี่ยงเฉพาะที่ยอมรับได้ในพื้นที่หรือโครงการเฉพาะ ซึ่งละเอียดกว่าและเน้นการปฏิบัติงาน Risk appetite กำหนดขอบเขตของความเสี่ยง ขณะที่ risk tolerance กำหนดขีดจำกัดภายในขอบเขตเหล่านั้น ตัวเลือกอื่นนำเสนอความแตกต่างที่ไม่มีนิยามเหล่านี้รองรับ"},{"id":170379789,"n":110,"d":3,"o":"3.4","q":"A hyperscale cloud provider is deploying a high-density computing cluster where individual server racks generate significantly more heat than standard configurations. The facility already uses CRAC units to maintain ambient temperature. What is the MOST effective approach to address thermal management for the high-density racks while preserving ambient environmental stability?","qth":"hyperscale cloud provider กำลังติดตั้งคลัสเตอร์คอมพิวเตอร์ความหนาแน่นสูง ซึ่งตู้ rack เซิร์ฟเวอร์แต่ละตู้สร้างความร้อนมากกว่าการกำหนดค่ามาตรฐานอย่างมีนัยสำคัญ สถานที่ใช้หน่วย CRAC เพื่อรักษาอุณหภูมิแวดล้อมอยู่แล้ว แนวทางที่มีประสิทธิผลที่สุด (MOST effective) ในการจัดการความร้อนของ rack ความหนาแน่นสูง ขณะรักษาเสถียรภาพของสภาพแวดล้อมโดยรอบคืออะไร","a":["Deploy liquid cooling directly on the high-density servers to remove heat at the source, while retaining CRAC units to manage the surrounding ambient temperature.","Reduce rack density by distributing the high-density workloads across more racks, relying on existing CRAC capacity for thermal management.","Increase the number of CRAC units proportionally to the additional heat load, replacing all air-based cooling with higher-capacity CRAC systems.","Reconfigure the hot aisle/cold aisle layout to route exhaust directly to the building exterior, eliminating the need for supplemental cooling systems."],"ath":["ติดตั้ง liquid cooling โดยตรงบนเซิร์ฟเวอร์ความหนาแน่นสูงเพื่อระบายความร้อนที่ต้นทาง โดยคงหน่วย CRAC ไว้จัดการอุณหภูมิแวดล้อมโดยรอบ","ลดความหนาแน่นของ rack โดยกระจาย workload ความหนาแน่นสูงไปยัง rack ที่มากขึ้น และพึ่งพาความจุ CRAC ที่มีอยู่ในการจัดการความร้อน","เพิ่มจำนวนหน่วย CRAC ตามสัดส่วนภาระความร้อนที่เพิ่มขึ้น โดยแทนที่ระบบทำความเย็นด้วยอากาศทั้งหมดด้วยระบบ CRAC ความจุสูงกว่า","จัดวาง hot aisle/cold aisle ใหม่เพื่อนำไอเสียออกสู่ภายนอกอาคารโดยตรง เพื่อไม่ต้องใช้ระบบทำความเย็นเสริม"],"ans":"A","exp":"Liquid cooling is used to provide targeted cooling directly to hardware, especially in high-density data centers, and that CRAC units and liquid cooling are often used together. CRAC units handle residual heat and ambient humidity, while liquid cooling addresses concentrated thermal loads directly at the equipment. Simply adding more CRAC units does not resolve the localized high-density heat problem as effectively. Routing exhaust externally and redistributing workloads are not viable solutions for this high-density thermal problem.","expth":"Liquid cooling ใช้ให้การทำความเย็นเฉพาะจุดโดยตรงกับฮาร์ดแวร์ โดยเฉพาะใน data center ความหนาแน่นสูง และมักใช้หน่วย CRAC ร่วมกับ liquid cooling หน่วย CRAC จัดการความร้อนส่วนที่เหลือและความชื้นโดยรอบ ส่วน liquid cooling จัดการภาระความร้อนที่กระจุกตัวโดยตรงที่อุปกรณ์ การเพิ่มหน่วย CRAC อย่างเดียวไม่แก้ปัญหาความร้อนเฉพาะจุดของความหนาแน่นสูงได้ดีเท่า ส่วนการนำไอเสียออกภายนอกและการกระจาย workload ไม่ใช่ทางออกที่เป็นไปได้สำหรับปัญหาความร้อนความหนาแน่นสูงนี้"},{"id":170379791,"n":111,"d":3,"o":"3.4","q":"A large organization operates across multiple public cloud platforms and must satisfy requirements from NIST SP 800-53, ISO/IEC 27002, and PCI DSS simultaneously. The security team wants a single framework that maps controls across all three standards and explicitly identifies whether each control is the responsibility of the cloud provider, the customer, or both. What is the BEST framework to meet this requirement?","qth":"องค์กรขนาดใหญ่ดำเนินงานข้ามแพลตฟอร์ม public cloud หลายแห่ง และต้องปฏิบัติตามข้อกำหนดของ NIST SP 800-53, ISO/IEC 27002 และ PCI DSS พร้อมกัน ทีม security ต้องการ framework เดียวที่แมปมาตรการควบคุมข้ามทั้งสามมาตรฐาน และระบุอย่างชัดเจนว่ามาตรการแต่ละข้อเป็นความรับผิดชอบของ cloud provider ลูกค้า หรือทั้งสองฝ่าย framework ที่ดีที่สุด (BEST) เพื่อตอบสนองข้อกำหนดนี้คืออะไร","a":["NIST SP 800-53, because it provides a comprehensive catalog of control families with tailoring overlays that can be adapted to meet multiple compliance requirements simultaneously.","ISO/IEC 27002, because it provides internationally recognized principles-based controls spanning multiple domains and supports alignment with various regulatory frameworks.","The Cloud Controls Matrix, because it maps controls across NIST SP 800-53, ISO/IEC 27002, and PCI DSS, and explicitly defines whether each control is the provider's, the customer's, or a shared responsibility.","ISO/IEC 27001, because it establishes an ISMS that integrates all three compliance frameworks into a single systematic approach to managing information security."],"ath":["NIST SP 800-53 เพราะมีแคตตาล็อก control family ที่ครอบคลุมพร้อม tailoring overlay ที่ปรับใช้เพื่อตอบสนองข้อกำหนด compliance หลายข้อพร้อมกันได้","ISO/IEC 27002 เพราะมีมาตรการควบคุมตามหลักการที่เป็นที่ยอมรับในระดับสากลครอบคลุมหลายโดเมน และรองรับการสอดคล้องกับ regulatory framework ต่าง ๆ","Cloud Controls Matrix เพราะแมปมาตรการควบคุมข้าม NIST SP 800-53, ISO/IEC 27002 และ PCI DSS และกำหนดอย่างชัดเจนว่ามาตรการแต่ละข้อเป็นความรับผิดชอบของ provider ลูกค้า หรือร่วมกัน (shared)","ISO/IEC 27001 เพราะกำหนด ISMS ที่ผสานกรอบ compliance ทั้งสามเข้าเป็นแนวทางเชิงระบบเดียวในการบริหารความมั่นคงปลอดภัยสารสนเทศ"],"ans":"C","exp":"The CSA Cloud Controls Matrix maps controls across NIST SP 800-53, ISO/IEC 27002, PCI DSS, and other frameworks, and defines whether each control is the provider's, the customer's, or shared. No other listed framework combines cross-standard mapping with cloud-specific shared responsibility delineation. NIST SP 800-53 is comprehensive but lacks the cloud shared responsibility feature. ISO/IEC 27002 is principles-based but lacks the mapping structure. ISO/IEC 27001 focuses on ISMS establishment, not cross-framework control mapping.","expth":"CSA Cloud Controls Matrix แมปมาตรการควบคุมข้าม NIST SP 800-53, ISO/IEC 27002, PCI DSS และ framework อื่น ๆ และกำหนดว่ามาตรการแต่ละข้อเป็นของ provider ลูกค้า หรือร่วมกัน ไม่มี framework อื่นในตัวเลือกที่รวมการแมปข้ามมาตรฐานกับการกำหนดขอบเขตความรับผิดชอบร่วมเฉพาะ cloud เข้าด้วยกัน NIST SP 800-53 ครอบคลุมแต่ไม่มีคุณลักษณะ shared responsibility ของ cloud ส่วน ISO/IEC 27002 อิงหลักการแต่ไม่มีโครงสร้างการแมป และ ISO/IEC 27001 เน้นการจัดตั้ง ISMS ไม่ใช่การแมปมาตรการข้าม framework"},{"id":170379793,"n":112,"d":3,"o":"3.4","q":"A data center operator is designing power infrastructure for a new facility that hosts critical financial transaction systems. The design must ensure that no single component failure results in any loss of power to the critical systems, requiring a fully duplicated power delivery path. What is the BEST redundancy configuration to meet this requirement?","qth":"ผู้ดำเนินการ data center กำลังออกแบบโครงสร้างพื้นฐานไฟฟ้าสำหรับสถานที่ใหม่ที่โฮสต์ระบบธุรกรรมทางการเงินที่สำคัญ การออกแบบต้องดูแลไม่ให้ความล้มเหลวของส่วนประกอบเดี่ยวใด ๆ ทำให้ระบบสำคัญสูญเสียไฟฟ้า ซึ่งต้องมีเส้นทางส่งจ่ายไฟฟ้าที่ซ้ำซ้อนเต็มรูปแบบ การกำหนดค่า redundancy ที่ดีที่สุด (BEST) เพื่อตอบสนองข้อกำหนดนี้คืออะไร","a":["A hot aisle/cold aisle layout combined with redundant UPS systems to ensure power continuity during equipment failures.","A 2N configuration, which provides full duplication of critical systems so that every component has a complete parallel backup path.","A multi-path networking design with BGP failover to reroute traffic automatically if any single power-related disruption occurs.","An N+1 configuration, which provides one additional component for every N critical components to absorb a single failure."],"ath":["การจัดวาง hot aisle/cold aisle ร่วมกับระบบ UPS สำรอง เพื่อให้ไฟฟ้าต่อเนื่องระหว่างที่อุปกรณ์ล้มเหลว","การกำหนดค่า 2N ซึ่งให้การทำซ้ำระบบสำคัญอย่างสมบูรณ์ เพื่อให้ทุกส่วนประกอบมีเส้นทางสำรองคู่ขนานครบชุด","การออกแบบเครือข่ายหลายเส้นทาง (multi-path networking) พร้อม BGP failover เพื่อเปลี่ยนเส้นทางทราฟฟิกโดยอัตโนมัติหากเกิดการหยุดชะงักที่เกี่ยวกับไฟฟ้า","การกำหนดค่า N+1 ซึ่งให้ส่วนประกอบเพิ่มหนึ่งชิ้นต่อทุก N ส่วนประกอบที่สำคัญ เพื่อรองรับความล้มเหลวหนึ่งครั้ง"],"ans":"B","exp":"2N redundancy provides full duplication of critical systems, meaning every component has a complete parallel backup. N+1 provides only one extra component per N critical components, which covers a single failure but does not deliver full duplication. The question explicitly requires full duplication of the power delivery path, which maps to 2N, not N+1. Hot aisle/cold aisle is a cooling layout, not a power redundancy model. Multi-path networking addresses connectivity, not power delivery.","expth":"redundancy แบบ 2N ให้การทำซ้ำระบบสำคัญอย่างสมบูรณ์ หมายความว่าทุกส่วนประกอบมีระบบสำรองคู่ขนานครบชุด ส่วน N+1 ให้ส่วนประกอบเพิ่มเพียงหนึ่งชิ้นต่อ N ส่วนประกอบสำคัญ ซึ่งรองรับความล้มเหลวหนึ่งครั้งแต่ไม่ได้ให้การทำซ้ำอย่างสมบูรณ์ โจทย์ต้องการการทำซ้ำเส้นทางส่งจ่ายไฟฟ้าแบบสมบูรณ์อย่างชัดเจน ซึ่งตรงกับ 2N ไม่ใช่ N+1 ส่วน hot aisle/cold aisle เป็นรูปแบบการจัดวางระบบทำความเย็น ไม่ใช่โมเดล redundancy ของไฟฟ้า และ multi-path networking เกี่ยวกับการเชื่อมต่อ ไม่ใช่การส่งจ่ายไฟฟ้า"},{"id":170379795,"n":113,"d":3,"o":"3.4","q":"An organization stores sensitive financial records in cloud object storage. Regulatory requirements mandate a seven-year retention period, and the data must remain protected throughout its entire lifecycle, including active storage, backups, and end-of-life deletion. The team has enabled server-side encryption for active storage but has not yet addressed backups or end-of-life. What is the BEST approach to complete the security posture for this data?","qth":"องค์กรจัดเก็บบันทึกทางการเงินที่มีความอ่อนไหวใน cloud object storage ข้อกำหนดของหน่วยงานกำกับดูแลกำหนดระยะเวลาเก็บรักษาเจ็ดปี และข้อมูลต้องได้รับการปกป้องตลอดวงจรชีวิตทั้งหมด รวมถึง active storage, backup และการลบเมื่อสิ้นอายุ (end-of-life) ทีมเปิดใช้ server-side encryption สำหรับ active storage แล้ว แต่ยังไม่ได้จัดการเรื่อง backup หรือ end-of-life แนวทางที่ดีที่สุด (BEST) เพื่อทำให้สถานะความปลอดภัยของข้อมูลนี้สมบูรณ์คืออะไร","a":["Extend encryption to all backups and snapshots, use a secure key management service to manage encryption keys, and apply cryptographic erasure at end-of-life to ensure secure deletion.","Enable access logging for the storage bucket and integrate logs with a SIEM to monitor all access to financial records across the full retention period.","Implement the 3-2-1 backup rule by storing three copies on two different media types with one copy offsite, ensuring data availability across the full seven-year retention period.","Apply least privilege IAM policies to restrict which accounts can access the storage bucket, and audit access permissions quarterly for the full retention period."],"ath":["ขยายการเข้ารหัสไปยัง backup และ snapshot ทั้งหมด ใช้ key management service ที่ปลอดภัยจัดการ encryption key และใช้ cryptographic erasure เมื่อสิ้นอายุเพื่อให้การลบข้อมูลปลอดภัย","เปิด access logging สำหรับ storage bucket และเชื่อม log เข้ากับ SIEM เพื่อเฝ้าติดตามการเข้าถึงบันทึกทางการเงินทั้งหมดตลอดระยะเวลาการเก็บรักษาเต็มช่วง","ใช้กฎ backup 3-2-1 โดยเก็บสามสำเนาบนสื่อสองประเภทต่างกัน และหนึ่งสำเนาอยู่นอกสถานที่ เพื่อให้ข้อมูลพร้อมใช้งานตลอดระยะเวลาเก็บรักษาเจ็ดปี","ใช้นโยบาย IAM แบบ least privilege เพื่อจำกัดว่าบัญชีใดเข้าถึง storage bucket ได้ และตรวจสอบสิทธิ์การเข้าถึงทุกไตรมาสตลอดระยะเวลาการเก็บรักษาเต็มช่วง"],"ans":"A","exp":"Encryption must be applied to all storage layers including backups and snapshots. A secure key management service should govern key lifecycle. Cryptographic erasure at end-of-life renders data unrecoverable by destroying the encryption keys, directly closing both unresolved gaps. Logging and SIEM support monitoring but do not protect data at rest in backups or ensure secure deletion. Least privilege IAM addresses access control, not encryption coverage. The 3-2-1 rule addresses availability, not confidentiality or secure end-of-life disposal.","expth":"ต้องใช้การเข้ารหัสกับทุกชั้นของ storage รวมถึง backup และ snapshot และควรใช้ key management service ที่ปลอดภัยกำกับวงจรชีวิตของ key การทำ cryptographic erasure เมื่อสิ้นอายุทำให้ข้อมูลกู้คืนไม่ได้โดยการทำลาย encryption key ซึ่งปิดช่องว่างที่ยังค้างอยู่ทั้งสองข้อโดยตรง ส่วน logging และ SIEM สนับสนุนการเฝ้าติดตาม แต่ไม่ปกป้องข้อมูลที่ถูกเก็บ (at rest) ใน backup และไม่รับประกันการลบอย่างปลอดภัย Least privilege IAM จัดการเรื่อง access control ไม่ใช่ความครอบคลุมของการเข้ารหัส และกฎ 3-2-1 จัดการเรื่อง availability ไม่ใช่ confidentiality หรือการกำจัดข้อมูลเมื่อสิ้นอายุอย่างปลอดภัย"},{"id":170379797,"n":114,"d":3,"o":"3.4","q":"A multinational organization has deployed a customer-facing application on a public cloud platform. Network monitoring has detected abnormal data flows suggesting that a threat actor may be exfiltrating sensitive customer records through the application's API endpoints. The security team has also identified that outbound traffic patterns match known attack signatures. What is the MOST effective combination of communication security controls to stop the active exfiltration and prevent future recurrence?","qth":"องค์กรข้ามชาติติดตั้งแอปพลิเคชันที่ให้บริการลูกค้าบนแพลตฟอร์ม public cloud การเฝ้าติดตามเครือข่ายตรวจพบ data flow ที่ผิดปกติ ซึ่งชี้ว่าผู้โจมตีอาจกำลังขโมยบันทึกลูกค้าที่มีความอ่อนไหวผ่าน API endpoint ของแอปพลิเคชัน ทีม security ยังพบว่ารูปแบบทราฟฟิกขาออกตรงกับ attack signature ที่ทราบ ชุดมาตรการควบคุมความปลอดภัยด้านการสื่อสารที่มีประสิทธิผลที่สุด (MOST effective) เพื่อหยุดการขโมยข้อมูล (exfiltration) ที่กำลังเกิดขึ้นและป้องกันการเกิดซ้ำในอนาคตคืออะไร","a":["Configure TLS encryption for all API endpoint communications and require MFA for all users accessing the application to prevent credential-based access to the endpoints.","Enable firewall rules to restrict inbound traffic to trusted IP ranges and deploy an IDS to analyze network traffic for anomalous data flows consistent with exfiltration activity.","Deploy an IPS to actively block suspicious traffic matching known attack patterns, and implement DLP policies to detect and block outbound transmission of sensitive customer data.","Configure IAM policies to restrict API access to authorized roles and implement secure protocols such as SFTP for all data transfers between the application and downstream systems."],"ath":["กำหนดค่า TLS encryption สำหรับการสื่อสารกับ API endpoint ทั้งหมด และกำหนดให้ผู้ใช้ทุกคนที่เข้าถึงแอปพลิเคชันต้องใช้ MFA เพื่อป้องกันการเข้าถึง endpoint ด้วย credential","เปิดใช้กฎ firewall เพื่อจำกัดทราฟฟิกขาเข้าให้มาจากช่วง IP ที่เชื่อถือได้ และติดตั้ง IDS เพื่อวิเคราะห์ทราฟฟิกเครือข่ายหา data flow ผิดปกติที่สอดคล้องกับกิจกรรม exfiltration","ติดตั้ง IPS เพื่อบล็อกทราฟฟิกที่น่าสงสัยซึ่งตรงกับรูปแบบการโจมตีที่ทราบอย่างเชิงรุก และใช้นโยบาย DLP เพื่อตรวจจับและบล็อกการส่งข้อมูลลูกค้าที่มีความอ่อนไหวออกนอกองค์กร","กำหนดนโยบาย IAM เพื่อจำกัดการเข้าถึง API ให้เฉพาะ role ที่ได้รับอนุญาต และใช้โปรโตคอลที่ปลอดภัย เช่น SFTP สำหรับการถ่ายโอนข้อมูลทั้งหมดระหว่างแอปพลิเคชันกับระบบปลายทาง"],"ans":"C","exp":"The scenario presents two active problems: traffic matching known attack signatures and outbound data being exfiltrated. An IPS actively blocks suspicious traffic in real time, countering the threat actor's ongoing activity. DLP detects and prevents outbound transmission of sensitive customer records, directly addressing the exfiltration vector. TLS and MFA improve transit security but do not stop active exfiltration. An IDS detects anomalies but does not block them. IAM and SFTP address access control and transfer security, not active traffic-based exfiltration.","expth":"สถานการณ์นี้มีปัญหาที่กำลังเกิดขึ้นสองข้อ คือทราฟฟิกที่ตรงกับ attack signature ที่ทราบ และข้อมูลขาออกที่กำลังถูกขโมย IPS บล็อกทราฟฟิกที่น่าสงสัยอย่างเชิงรุกแบบเรียลไทม์ ต่อต้านกิจกรรมที่ผู้โจมตีกำลังดำเนินอยู่ ส่วน DLP ตรวจจับและป้องกันการส่งบันทึกลูกค้าที่มีความอ่อนไหวออกนอกองค์กร ซึ่งแก้ช่องทาง exfiltration โดยตรง TLS และ MFA ช่วยเพิ่มความปลอดภัยระหว่างส่ง แต่ไม่หยุด exfiltration ที่กำลังเกิดขึ้น IDS ตรวจจับความผิดปกติ แต่ไม่บล็อก ส่วน IAM และ SFTP จัดการ access control และความปลอดภัยของการถ่ายโอน ไม่ใช่ exfiltration ที่อาศัยทราฟฟิกที่กำลังไหลอยู่"},{"id":170379799,"n":115,"d":5,"o":"5.3","q":"A cloud operations team has deployed a change to production that was authorized by the Change Control Board. Two days later, a monitoring alert flags a configuration on a critical workload that does not match the approved baseline. What is the MOST appropriate action to determine how the discrepancy occurred?","qth":"ทีม cloud operations ติดตั้งการเปลี่ยนแปลงลง production ที่ได้รับอนุมัติจาก Change Control Board สองวันต่อมา alert จากการเฝ้าติดตามทำเครื่องหมายการกำหนดค่าบน workload สำคัญที่ไม่ตรงกับ baseline ที่ได้รับอนุมัติ การดำเนินการที่เหมาะสมที่สุด (MOST appropriate) เพื่อระบุว่าความไม่ตรงกันนี้เกิดขึ้นได้อย่างไรคืออะไร","a":["Escalate the discrepancy to the cloud service provider, as baseline enforcement is a CSP responsibility under the shared responsibility model.","Revert the production environment to its pre-change state and reschedule the original deployment for the next maintenance window.","Review the configuration management baseline to identify which component deviated from its documented state and when the deviation was introduced.","Submit a new change request to the Change Control Board and document the unauthorized state as an approved exception."],"ath":["ส่งเรื่องความไม่ตรงกันให้ cloud service provider เพราะการบังคับใช้ baseline เป็นความรับผิดชอบของ CSP ตาม shared responsibility model","ย้อนสภาพแวดล้อม production กลับไปสถานะก่อนการเปลี่ยนแปลง และกำหนดเวลาติดตั้งเดิมใหม่ใน maintenance window ถัดไป","ทบทวน configuration management baseline เพื่อระบุว่าส่วนประกอบใดเบี่ยงเบนจากสถานะที่บันทึกไว้ และการเบี่ยงเบนนั้นเกิดขึ้นเมื่อใด","ยื่นคำขอเปลี่ยนแปลงใหม่ต่อ Change Control Board และบันทึกสถานะที่ไม่ได้รับอนุญาตนั้นเป็นข้อยกเว้น (exception) ที่ได้รับอนุมัติ"],"ans":"C","exp":"Configuration management maintains a documented baseline of system components and detects unauthorized deviations. When a discrepancy appears, reviewing the baseline is the correct action because configuration management is specifically designed to identify what changed, when, and from what state. Submitting a new change request does not investigate the discrepancy. Reverting without investigation assumes the cause without evidence. Escalating to the CSP misapplies shared responsibility. Baseline detection is the customer's configuration management responsibility.","expth":"Configuration management เก็บ baseline ที่บันทึกไว้ของส่วนประกอบระบบและตรวจจับการเบี่ยงเบนที่ไม่ได้รับอนุญาต เมื่อเกิดความไม่ตรงกัน การทบทวน baseline คือการดำเนินการที่ถูกต้อง เพราะ configuration management ออกแบบมาเพื่อระบุว่าอะไรเปลี่ยน เปลี่ยนเมื่อใด และเปลี่ยนจากสถานะใด การยื่นคำขอเปลี่ยนแปลงใหม่ไม่ใช่การสอบสวนความไม่ตรงกัน การย้อนกลับโดยไม่สอบสวนเป็นการสันนิษฐานสาเหตุโดยไม่มีหลักฐาน และการส่งเรื่องให้ CSP เป็นการใช้ shared responsibility ผิดที่ เพราะการตรวจจับ baseline เป็นความรับผิดชอบด้าน configuration management ของลูกค้า"},{"id":170379801,"n":116,"d":5,"o":"5.3","q":"A cloud security architect is designing a capacity management strategy for a multi-region SaaS platform. The business requires SLA compliance during regional outages, leadership is pressuring the team to reduce cloud spend by 20%, and the operations team warns that the current auto-scaling configuration responds too slowly to traffic spikes from denial-of-service attacks. What is the BEST approach to address all three constraints?","qth":"cloud security architect กำลังออกแบบกลยุทธ์ capacity management สำหรับแพลตฟอร์ม SaaS แบบ multi-region ธุรกิจต้องการการปฏิบัติตาม SLA ระหว่างที่ภูมิภาคหนึ่งล่ม ผู้บริหารกดดันให้ทีมลดค่าใช้จ่าย cloud ลง 20% และทีมปฏิบัติการเตือนว่าการกำหนดค่า auto-scaling ปัจจุบันตอบสนองช้าเกินไปต่อทราฟฟิกพุ่งสูงจากการโจมตีแบบ denial-of-service แนวทางที่ดีที่สุด (BEST) เพื่อรองรับทั้งสามข้อจำกัดคืออะไร","a":["Implement predictive capacity planning aligned with demand forecasts, configure auto-scaling thresholds to respond faster to anomalous traffic, and distribute resources across multiple regions.","Reduce provisioned capacity to meet the cost target, rely on manual scaling during attack events, and negotiate SLA adjustments with customers to account for regional outage risk.","Migrate to a single high-capacity region to consolidate spend, configure aggressive auto-scaling to manage demand spikes, and accept that a regional outage would trigger a declared disaster rather than a capacity management response.","Over-provision resources in each region to eliminate scaling delays and ensure SLA compliance during outages, and accept the increased cost as justified by the continuity requirement."],"ath":["ใช้ predictive capacity planning ที่สอดคล้องกับการพยากรณ์ความต้องการ กำหนดเกณฑ์ auto-scaling ให้ตอบสนองต่อทราฟฟิกผิดปกติได้เร็วขึ้น และกระจาย resource ไปหลายภูมิภาค","ลดกำลังที่ provision ไว้เพื่อให้ได้เป้าหมายต้นทุน พึ่งพาการปรับขนาดด้วยมือ (manual scaling) ระหว่างเหตุการณ์โจมตี และเจรจาปรับ SLA กับลูกค้าเพื่อรองรับความเสี่ยงที่ภูมิภาคล่ม","ย้ายไปยังภูมิภาคเดียวที่มีกำลังสูงเพื่อรวมค่าใช้จ่าย กำหนดค่า auto-scaling แบบเข้มข้นเพื่อรับมือทราฟฟิกพุ่ง และยอมรับว่าเหตุภูมิภาคล่มจะนำไปสู่การประกาศภัยพิบัติ แทนที่จะเป็นการตอบสนองด้าน capacity management","provision resource เกินความจำเป็นในแต่ละภูมิภาคเพื่อขจัดความล่าช้าในการปรับขนาดและรับประกันการปฏิบัติตาม SLA ระหว่างเหตุล่ม และยอมรับต้นทุนที่เพิ่มขึ้นว่าสมเหตุสมผลตามข้อกำหนดด้านความต่อเนื่อง"],"ans":"A","exp":"Capacity management balances resource availability with cost efficiency. Effective capacity management rests on three interconnected practices: capacity planning for forecast alignment, monitoring and auto-scaling for real-time responsiveness, and multi-region distribution to maintain availability during disruptions. Only the correct answer integrates all three. Over-provisioning satisfies continuity but fails the cost target. Manual scaling fails the responsiveness requirement. Single-region consolidation eliminates the continuity protection that multi-region distribution provides. Addressing all three constraints requires combining planning, scaling optimization, and geographic resilience.","expth":"Capacity management สร้างสมดุลระหว่างความพร้อมของ resource กับประสิทธิภาพด้านต้นทุน capacity management ที่มีประสิทธิผลตั้งอยู่บนแนวปฏิบัติที่เชื่อมโยงกันสามข้อ ได้แก่ capacity planning เพื่อให้สอดคล้องกับการพยากรณ์ การเฝ้าติดตามและ auto-scaling เพื่อการตอบสนองแบบเรียลไทม์ และการกระจายหลายภูมิภาคเพื่อรักษา availability ระหว่างการหยุดชะงัก มีเพียงคำตอบที่ถูกต้องเท่านั้นที่ผสานทั้งสามข้อ การ provision เกินความจำเป็นตอบโจทย์ความต่อเนื่อง แต่ไม่ผ่านเป้าหมายต้นทุน การปรับขนาดด้วยมือไม่ตอบโจทย์ด้านความเร็วในการตอบสนอง และการรวมเป็นภูมิภาคเดียวขจัดการคุ้มครองความต่อเนื่องที่การกระจายหลายภูมิภาคให้ การแก้ทั้งสามข้อจำกัดต้องรวมการวางแผน การปรับ scaling ให้เหมาะสม และความยืดหยุ่นเชิงภูมิศาสตร์เข้าด้วยกัน"},{"id":170379803,"n":117,"d":5,"o":"5.3","q":"A development team deploys a new payment processing module to the production cloud environment behind a feature flag. No users can access the new module yet. The release manager asks whether the deployment satisfies the release criteria. What is the MOST appropriate response?","qth":"ทีมพัฒนา deploy โมดูลประมวลผลการชำระเงินใหม่ไปยังสภาพแวดล้อม production บน cloud โดยอยู่หลัง feature flag ยังไม่มีผู้ใช้เข้าถึงโมดูลใหม่ได้ release manager ถามว่าการ deploy นี้เป็นไปตามเกณฑ์การ release หรือไม่ คำตอบที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["Neither deployment nor release is complete until the feature flag is enabled, because a change is not deployed until it is accessible in production.","Deployment is complete, but release has not occurred, because release is the governance decision to make a change available to users, which the feature flag has not yet enabled.","Deployment is complete and constitutes release, because ITIL treats the two practices as a single combined process that concludes when code reaches production.","Both deployment and release are complete, because the change is present in the production environment and no further authorization is required."],"ath":["ทั้ง deployment และ release ยังไม่เสร็จสมบูรณ์จนกว่าจะเปิด feature flag เพราะการเปลี่ยนแปลงยังไม่ถือว่า deploy จนกว่าจะเข้าถึงได้บน production","Deployment เสร็จสมบูรณ์แล้ว แต่ release ยังไม่เกิดขึ้น เพราะ release คือการตัดสินใจเชิง governance ที่ทำให้การเปลี่ยนแปลงพร้อมให้ผู้ใช้ ซึ่ง feature flag ยังไม่ได้เปิดใช้","Deployment เสร็จสมบูรณ์และถือเป็น release เพราะ ITIL ถือว่าทั้งสองแนวปฏิบัติเป็นกระบวนการรวมเดียวที่สิ้นสุดเมื่อโค้ดถึง production","ทั้ง deployment และ release เสร็จสมบูรณ์ เพราะการเปลี่ยนแปลงอยู่ในสภาพแวดล้อม production แล้วและไม่ต้องมีการอนุมัติเพิ่มเติม"],"ans":"B","exp":"ITIL separates Release Management and Deployment Management into two distinct practices. Deployment Management is the technical act of moving a component into an environment. Release Management is the governance decision to make a feature available to users. A feature flag allows technical deployment to occur without triggering the release. The module is deployed but not released. ITIL explicitly split the two practices because deployment and availability decisions can and do occur independently in modern cloud environments.","expth":"ITIL แยก Release Management และ Deployment Management เป็นสองแนวปฏิบัติที่แตกต่างกัน Deployment Management คือการดำเนินการทางเทคนิคในการย้ายส่วนประกอบเข้าสู่สภาพแวดล้อม ส่วน Release Management คือการตัดสินใจเชิง governance ที่ทำให้ฟีเจอร์พร้อมให้ผู้ใช้ Feature flag ทำให้ technical deployment เกิดขึ้นได้โดยไม่กระตุ้น release โมดูลนี้จึง deploy แล้วแต่ยังไม่ release ITIL แยกสองแนวปฏิบัติอย่างชัดเจนเพราะการตัดสินใจเรื่อง deployment และ availability สามารถเกิดขึ้นอย่างเป็นอิสระต่อกันได้ในสภาพแวดล้อม cloud สมัยใหม่"},{"id":170379805,"n":118,"d":5,"o":"5.6","q":"A SIEM correlation engine generates an alert showing that a user account experienced three failed login attempts, then a successful login five minutes later from the same IP address, followed by a large outbound data transfer from a storage bucket. The security analyst must determine what attack pattern this sequence most likely represents. What is the MOST appropriate conclusion?","qth":"SIEM correlation engine สร้าง alert แสดงว่าบัญชีผู้ใช้หนึ่งมีการพยายาม login ล้มเหลวสามครั้ง ตามด้วย login สำเร็จหลังจากนั้นห้านาทีจาก IP address เดียวกัน แล้วตามด้วยการถ่ายโอนข้อมูลขาออกจำนวนมากจาก storage bucket security analyst ต้องกำหนดว่าลำดับเหตุการณ์นี้น่าจะแสดงรูปแบบการโจมตีแบบใด ข้อสรุปที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["A privilege escalation attempt, because the successful login followed by data access indicates the account gained elevated permissions.","A denial-of-service precursor, because the repeated authentication attempts were designed to consume authentication service resources.","A brute-force attack leading to data exfiltration, because the failed attempts followed by successful login and a large transfer match this pattern.","An insider threat, because the access originated from a familiar IP address already known to the organization."],"ath":["ความพยายาม privilege escalation เพราะการ login สำเร็จตามด้วยการเข้าถึงข้อมูลบ่งชี้ว่าบัญชีได้รับสิทธิ์ระดับสูง","ขั้นตอนเริ่มต้นของ denial-of-service เพราะความพยายามยืนยันตัวตนซ้ำ ๆ ถูกออกแบบให้ใช้ resource ของบริการยืนยันตัวตนจนหมด","การโจมตีแบบ brute-force ที่นำไปสู่ data exfiltration เพราะความพยายามที่ล้มเหลวตามด้วย login สำเร็จและการถ่ายโอนข้อมูลจำนวนมากตรงกับรูปแบบนี้","ภัยคุกคามจากคนใน (insider threat) เพราะการเข้าถึงมาจาก IP address ที่คุ้นเคยซึ่งองค์กรรู้จักอยู่แล้ว"],"ans":"C","exp":"The correlated sequence of repeated failed logins, a successful login shortly after from the same source, and a large outbound data transfer is the canonical SIEM pattern for a brute-force attack that succeeded and led to exfiltration. Privilege escalation involves gaining elevated permissions after access, not the retry-then-succeed login pattern. A familiar IP address does not confirm an insider threat and could reflect a compromised internal endpoint. Denial-of-service attacks involve resource exhaustion, not a successful login followed by data movement. SIEM correlation connects these events into a recognized attack chain.","expth":"ลำดับเหตุการณ์ที่ correlate แล้ว ได้แก่ login ล้มเหลวซ้ำ ๆ login สำเร็จตามมาในไม่ช้าจากแหล่งเดียวกัน และการถ่ายโอนข้อมูลขาออกจำนวนมาก เป็นรูปแบบมาตรฐานใน SIEM ของการโจมตีแบบ brute-force ที่สำเร็จและนำไปสู่ exfiltration Privilege escalation คือการได้สิทธิ์ระดับสูงหลังเข้าถึงได้แล้ว ไม่ใช่รูปแบบ login ที่ลองซ้ำแล้วสำเร็จ IP address ที่คุ้นเคยไม่ได้ยืนยัน insider threat และอาจสะท้อน endpoint ภายในที่ถูกบุกรุก ส่วน denial-of-service เกี่ยวกับการทำให้ resource หมด ไม่ใช่ login สำเร็จตามด้วยการเคลื่อนย้ายข้อมูล SIEM correlation เชื่อมเหตุการณ์เหล่านี้เป็นห่วงโซ่การโจมตี (attack chain) ที่เป็นที่รู้จัก"},{"id":170379807,"n":119,"d":5,"o":"5.6","q":"A cloud administrator notices that CPU utilization on several virtual machines has climbed steadily to near-maximum capacity over a three-day period. There have been no new application deployments, no scheduled batch jobs, and no changes in user traffic. At the same time, outbound network traffic to external IP addresses has increased significantly. Based on these two competing signals, what is the MOST appropriate security conclusion for the SOC to investigate first?","qth":"cloud administrator สังเกตว่าการใช้ CPU บน virtual machine หลายตัวเพิ่มขึ้นอย่างต่อเนื่องจนเกือบเต็มกำลังตลอดช่วงสามวัน ไม่มีการ deploy แอปพลิเคชันใหม่ ไม่มี batch job ตามกำหนดการ และไม่มีการเปลี่ยนแปลงของทราฟฟิกผู้ใช้ ขณะเดียวกัน ทราฟฟิกเครือข่ายขาออกไปยัง IP address ภายนอกเพิ่มขึ้นอย่างมาก จากสัญญาณที่ขัดแย้งกันสองอย่างนี้ ข้อสรุปด้านความปลอดภัยที่เหมาะสมที่สุด (MOST appropriate) ที่ SOC ควรสอบสวนเป็นอันดับแรกคืออะไร","a":["A cryptojacking attack, in which attackers are secretly using the organization's compute resources to mine cryptocurrency.","A resource contention issue caused by another tenant in the shared cloud environment consuming excess compute.","A denial-of-service attack that is overwhelming the virtual machines with inbound requests, causing CPU saturation.","A ransomware attack that is encrypting files in the background, consuming CPU and increasing storage utilization."],"ath":["การโจมตีแบบ cryptojacking ที่ผู้โจมตีแอบใช้ทรัพยากรคอมพิวเตอร์ขององค์กรขุดคริปโตเคอร์เรนซี","ปัญหาการแย่งชิง resource (resource contention) ที่เกิดจากผู้เช่ารายอื่นในสภาพแวดล้อม cloud ที่ใช้ร่วมกันใช้กำลังคำนวณเกิน","การโจมตีแบบ denial-of-service ที่ท่วม virtual machine ด้วยคำขอขาเข้า ทำให้ CPU อิ่มตัว","การโจมตีแบบ ransomware ที่เข้ารหัสไฟล์อยู่เบื้องหลัง ใช้ CPU และเพิ่มการใช้งาน storage"],"ans":"A","exp":"Sustained unexplained CPU consumption combined with increased outbound traffic to external IPs is the textbook indicator pattern for cryptojacking, where an attacker covertly uses cloud compute to mine cryptocurrency and reports results to external infrastructure. Ransomware produces CPU load but is associated with storage anomalies and file encryption activity, not outbound transfers. Denial-of-service attacks involve inbound traffic floods, not outbound increases. Resource contention from another tenant does not explain sustained outbound traffic to external addresses. Both signals together point to cryptojacking.","expth":"การใช้ CPU อย่างต่อเนื่องโดยไม่มีคำอธิบายร่วมกับทราฟฟิกขาออกไปยัง IP ภายนอกที่เพิ่มขึ้น เป็นรูปแบบตัวบ่งชี้ตามตำราของ cryptojacking ที่ผู้โจมตีแอบใช้กำลังคำนวณบน cloud ขุดคริปโตเคอร์เรนซีและรายงานผลไปยังโครงสร้างพื้นฐานภายนอก Ransomware สร้างภาระ CPU แต่สัมพันธ์กับความผิดปกติของ storage และกิจกรรมเข้ารหัสไฟล์ ไม่ใช่การถ่ายโอนขาออก Denial-of-service เกี่ยวข้องกับทราฟฟิกขาเข้าท่วม ไม่ใช่ขาออกที่เพิ่มขึ้น และ resource contention จากผู้เช่ารายอื่นไม่อธิบายทราฟฟิกขาออกไปยังที่อยู่ภายนอกอย่างต่อเนื่อง สัญญาณทั้งสองรวมกันชี้ไปที่ cryptojacking"},{"id":170379809,"n":120,"d":5,"o":"5.6","q":"A security incident is underway in a cloud environment where an attacker has compromised a cloud workload. The incident response team is debating whether to focus on isolating the affected virtual machine at the network layer or revoking the IAM role credentials and API tokens associated with the compromised workload. The security manager argues that credential revocation is the more impactful first action in this environment. What is the MOST appropriate reason the security manager's position is correct?","qth":"เหตุการณ์ด้านความปลอดภัยกำลังดำเนินอยู่ในสภาพแวดล้อม cloud ที่ผู้โจมตีบุกรุก cloud workload ได้แล้ว ทีม incident response กำลังถกเถียงว่าควรเน้นแยก (isolate) virtual machine ที่ได้รับผลกระทบที่ชั้นเครือข่าย หรือเพิกถอน credential ของ IAM role และ API token ที่เกี่ยวข้องกับ workload ที่ถูกบุกรุก security manager โต้แย้งว่าการเพิกถอน credential เป็นการดำเนินการแรกที่ส่งผลมากกว่าในสภาพแวดล้อมนี้ เหตุผลที่เหมาะสมที่สุด (MOST appropriate) ที่ทำให้จุดยืนของ security manager ถูกต้องคืออะไร","a":["Virtual machines in cloud environments cannot be isolated without CSP cooperation, which introduces delays that credential revocation avoids.","Revoking IAM credentials automatically terminates all active sessions and prevents re-authentication, eliminating the need for any further network-level action.","Network isolation removes the workload from monitoring visibility, making it harder to collect further evidence during the response.","Cloud incident response centers on identities, permissions, and API access as the primary attack paths, making credential revocation the more direct containment action."],"ath":["virtual machine ในสภาพแวดล้อม cloud ไม่สามารถแยกได้หากไม่มีความร่วมมือจาก CSP ซึ่งทำให้เกิดความล่าช้าที่การเพิกถอน credential หลีกเลี่ยงได้","การเพิกถอน IAM credential ยุติ session ที่ใช้งานอยู่ทั้งหมดโดยอัตโนมัติและป้องกันการยืนยันตัวตนซ้ำ ทำให้ไม่ต้องดำเนินการระดับเครือข่ายใด ๆ เพิ่มเติม","การแยกเครือข่ายทำให้ workload หลุดจากการมองเห็นของการเฝ้าติดตาม ทำให้เก็บหลักฐานเพิ่มเติมระหว่างการตอบสนองได้ยากขึ้น","cloud incident response หมุนรอบ identity สิทธิ์ และการเข้าถึง API ในฐานะเส้นทางการโจมตีหลัก ทำให้การเพิกถอน credential เป็นการควบคุมสถานการณ์ (containment) ที่ตรงกว่า"],"ans":"D","exp":"Cloud incident response prioritizes identities, permissions, and service configurations over physical systems or traditional endpoints. A stolen credential or compromised token is the primary attack path, so revoking IAM credentials directly addresses that path rather than the network perimeter. Network isolation is a valid concern about evidence collection visibility but does not support the manager's core containment argument. Virtual machines can be isolated without CSP involvement. Credential revocation does not eliminate the need for network-level containment; both actions serve distinct purposes.","expth":"cloud incident response ให้ความสำคัญกับ identity สิทธิ์ และการกำหนดค่าบริการ มากกว่าระบบทางกายภาพหรือ endpoint แบบดั้งเดิม credential ที่ถูกขโมยหรือ token ที่ถูกบุกรุกเป็นเส้นทางการโจมตีหลัก การเพิกถอน IAM credential จึงจัดการเส้นทางนั้นโดยตรง ไม่ใช่ขอบเขตเครือข่าย การแยกเครือข่ายเป็นข้อกังวลที่สมเหตุสมผลเรื่องการมองเห็นในการเก็บหลักฐาน แต่ไม่สนับสนุนข้อโต้แย้งหลักของ manager เรื่อง containment นอกจากนี้ virtual machine แยกได้โดยไม่ต้องให้ CSP เข้ามาเกี่ยวข้อง และการเพิกถอน credential ไม่ได้ขจัดความจำเป็นของ containment ระดับเครือข่าย ทั้งสองการดำเนินการมีวัตถุประสงค์ที่แตกต่างกัน"},{"id":170379811,"n":121,"d":5,"o":"5.6","q":"During a penetration test of a cloud-hosted application, a tester discovers that the web application is vulnerable to server-side request forgery. The application is running on a virtual machine with an IAM role attached. The tester is evaluating what can be achieved by exploiting this vulnerability beyond the initial application compromise. What is the PRIMARY concern that post-exploitation analysis should evaluate in this scenario?","qth":"ระหว่าง penetration test ของแอปพลิเคชันที่โฮสต์บน cloud ผู้ทดสอบพบว่าเว็บแอปพลิเคชันมีช่องโหว่ server-side request forgery (SSRF) แอปพลิเคชันทำงานบน virtual machine ที่มี IAM role ผูกอยู่ ผู้ทดสอบกำลังประเมินว่าการใช้ช่องโหว่นี้สามารถทำอะไรได้บ้างนอกเหนือจากการบุกรุกแอปพลิเคชันในขั้นแรก ข้อกังวลหลัก (PRIMARY) ที่การวิเคราะห์หลังการโจมตี (post-exploitation) ควรประเมินในสถานการณ์นี้คืออะไร","a":["Whether the SSRF can be used to retrieve temporary IAM role credentials, enabling lateral movement or privilege escalation within the cloud environment.","Whether the IAM role attached to the instance has logging enabled, which would allow the security team to detect and investigate the intrusion path.","Whether the compromised application can be used to enumerate other services in the same virtual network by scanning internal IP ranges for open ports.","Whether the SSRF allows the tester to exfiltrate application database contents directly, demonstrating a data breach impact on the immediate workload."],"ath":["SSRF สามารถใช้ดึง temporary IAM role credential ได้หรือไม่ ซึ่งเปิดทางให้เกิด lateral movement หรือ privilege escalation ภายในสภาพแวดล้อม cloud","IAM role ที่ผูกกับ instance เปิดใช้ logging หรือไม่ ซึ่งจะช่วยให้ทีม security ตรวจจับและสอบสวนเส้นทางการบุกรุกได้","แอปพลิเคชันที่ถูกบุกรุกสามารถใช้แจกแจง (enumerate) บริการอื่นใน virtual network เดียวกันโดยสแกนช่วง IP ภายในเพื่อหา port ที่เปิดอยู่ได้หรือไม่","SSRF ทำให้ผู้ทดสอบขโมยเนื้อหา database ของแอปพลิเคชันได้โดยตรงหรือไม่ ซึ่งแสดงผลกระทบของการละเมิดข้อมูลต่อ workload ที่อยู่ใกล้ที่สุด"],"ans":"A","exp":"SSRF vulnerabilities can be used to retrieve temporary credentials associated with the instance's IAM role. This is a well-documented cloud attack path that penetration tests should specifically validate. Internal port scanning and database exfiltration are valid post-exploitation steps but are not the cloud-specific concern highlighted for this attack pattern. Evaluating whether logging is enabled is a detection control review, not a post-exploitation impact analysis of the SSRF vector.","expth":"ช่องโหว่ SSRF สามารถใช้ดึง temporary credential ที่เชื่อมกับ IAM role ของ instance ได้ นี่เป็นเส้นทางการโจมตีบน cloud ที่มีการบันทึกไว้อย่างดี ซึ่ง penetration test ควรตรวจสอบยืนยันโดยเฉพาะ การสแกน port ภายในและการขโมยข้อมูลจาก database เป็นขั้นตอนหลังการโจมตีที่ใช้ได้ แต่ไม่ใช่ข้อกังวลเฉพาะ cloud ที่ชี้เด่นสำหรับรูปแบบการโจมตีนี้ ส่วนการประเมินว่าเปิด logging หรือไม่เป็นการทบทวน detection control ไม่ใช่การวิเคราะห์ผลกระทบหลังการโจมตีของเวกเตอร์ SSRF"},{"id":170379813,"n":122,"d":6,"o":"6.2","q":"A healthcare organization is deploying a cloud-based records management system using a global SaaS provider. The legal team has confirmed that the data includes PHI covered under HIPAA, that the vendor's processing agreement creates contractual obligations, and that data will be stored and processed across three geographic regions, each governed by different privacy laws. The security architect must determine the PRIMARY concern that cloud design decisions must address to reduce regulatory exposure.","qth":"องค์กรด้านสุขภาพกำลังติดตั้งระบบจัดการเวชระเบียนบน cloud โดยใช้ผู้ให้บริการ SaaS ระดับโลก ทีมกฎหมายยืนยันว่าข้อมูลมี PHI ที่อยู่ภายใต้ HIPAA ว่าข้อตกลงการประมวลผลของ vendor สร้างภาระผูกพันตามสัญญา และข้อมูลจะถูกจัดเก็บและประมวลผลข้ามสามภูมิภาคทางภูมิศาสตร์ ซึ่งแต่ละแห่งอยู่ภายใต้กฎหมายความเป็นส่วนตัวที่ต่างกัน security architect ต้องกำหนดข้อกังวลหลัก (PRIMARY) ที่การตัดสินใจออกแบบ cloud ต้องจัดการเพื่อลดความเสี่ยงด้านกฎระเบียบ","a":["The HIPAA business associate obligations, which govern how the cloud provider must handle PHI and require appropriate security safeguards regardless of where data is stored.","The jurisdictional risk created by data moving across legal boundaries, requiring controls such as data residency restrictions, cloud region selection, and cross-border transfer safeguards.","The contractual obligations in the vendor processing agreement, which may impose data protection requirements beyond what any single applicable privacy law mandates.","The multi-tenancy architecture of the SaaS platform, which creates data isolation risks that encryption and access controls must address to satisfy all three applicable legal frameworks."],"ath":["ภาระผูกพันด้าน business associate ของ HIPAA ซึ่งกำกับว่า cloud provider ต้องจัดการ PHI อย่างไร และกำหนดให้มีมาตรการป้องกันด้านความปลอดภัยที่เหมาะสมไม่ว่าข้อมูลจะเก็บที่ใด","ความเสี่ยงด้านเขตอำนาจ (jurisdictional risk) ที่เกิดจากข้อมูลเคลื่อนข้ามขอบเขตทางกฎหมาย ซึ่งต้องใช้มาตรการควบคุม เช่น ข้อจำกัด data residency การเลือกภูมิภาคของ cloud และมาตรการป้องกันการโอนข้อมูลข้ามพรมแดน","ภาระผูกพันตามสัญญาในข้อตกลงการประมวลผลของ vendor ซึ่งอาจกำหนดข้อกำหนดด้านการคุ้มครองข้อมูลเกินกว่าที่กฎหมายความเป็นส่วนตัวฉบับใดฉบับหนึ่งบังคับ","สถาปัตยกรรม multi-tenancy ของแพลตฟอร์ม SaaS ซึ่งสร้างความเสี่ยงด้านการแยกข้อมูลที่การเข้ารหัสและ access control ต้องจัดการเพื่อให้เป็นไปตามกรอบกฎหมายทั้งสามที่เกี่ยวข้อง"],"ans":"B","exp":"Jurisdictional differences are a primary complexity in cloud, stating that cloud systems can store, process, and replicate data across countries with different rules for consent, breach notification, government access, and deletion. It specifically cites data residency, data sovereignty, and cross-border transfer controls as the response. HIPAA obligations are real but apply within a known legal framework. Contractual obligations are a valid concern but are a source of obligation, not the architectural risk created by multi-region deployment. Multi-tenancy is a separate risk; the scenario's defining complexity is the intersection of three legal jurisdictions.","expth":"ความแตกต่างด้านเขตอำนาจเป็นความซับซ้อนหลักบน cloud เพราะระบบ cloud สามารถจัดเก็บ ประมวลผล และทำซ้ำข้อมูลข้ามประเทศที่มีกฎต่างกันในเรื่องการให้ความยินยอม การแจ้งเหตุละเมิด การเข้าถึงโดยรัฐ และการลบข้อมูล โดยระบุ data residency, data sovereignty และมาตรการควบคุมการโอนข้ามพรมแดนเป็นแนวทางตอบสนองโดยเฉพาะ ภาระผูกพันตาม HIPAA เป็นของจริง แต่ใช้ภายในกรอบกฎหมายที่ทราบอยู่แล้ว ภาระผูกพันตามสัญญาเป็นข้อกังวลที่ใช้ได้ แต่เป็นแหล่งที่มาของภาระผูกพัน ไม่ใช่ความเสี่ยงเชิงสถาปัตยกรรมที่เกิดจากการติดตั้งหลายภูมิภาค Multi-tenancy เป็นความเสี่ยงแยกต่างหาก ความซับซ้อนที่เป็นเอกลักษณ์ของสถานการณ์นี้คือจุดตัดของสามเขตอำนาจทางกฎหมาย"},{"id":170379815,"n":123,"d":6,"o":"6.2","q":"Your organization is deploying a new cloud-based customer analytics platform that processes behavioral and demographic data across multiple cloud regions in different countries. During the privacy assessment phase, the team identifies that the cloud provider uses a multi-tenant infrastructure and that customer data may be replicated to a region with weaker privacy laws. What is the MOST appropriate step to address these risks within the PIA process?","qth":"องค์กรของคุณกำลังติดตั้งแพลตฟอร์ม customer analytics บน cloud แห่งใหม่ที่ประมวลผลข้อมูลพฤติกรรมและข้อมูลประชากรข้ามหลายภูมิภาค cloud ในหลายประเทศ ในช่วงการประเมินด้านความเป็นส่วนตัว ทีมพบว่า cloud provider ใช้โครงสร้างพื้นฐานแบบ multi-tenant และข้อมูลลูกค้าอาจถูกทำซ้ำไปยังภูมิภาคที่มีกฎหมายความเป็นส่วนตัวอ่อนกว่า ขั้นตอนที่เหมาะสมที่สุด (MOST appropriate) เพื่อจัดการความเสี่ยงเหล่านี้ภายในกระบวนการ PIA คืออะไร","a":["Document the identified risks in the PIA report and submit it to the relevant regulators to demonstrate the organization's awareness of the compliance exposure.","Expand the stakeholder group to include external legal counsel and the cloud provider's compliance team before risk assessment begins.","Assess the specific privacy impacts of the multi-tenancy model and cross-border data replication, then identify controls such as encryption and legal safeguards to reduce those risks.","Engage the cloud provider directly to renegotiate the data processing agreement before the PIA is completed, ensuring contractual protections are in place."],"ath":["บันทึกความเสี่ยงที่ระบุไว้ในรายงาน PIA และส่งให้หน่วยงานกำกับดูแลที่เกี่ยวข้อง เพื่อแสดงว่าองค์กรตระหนักถึงความเสี่ยงด้าน compliance","ขยายกลุ่มผู้มีส่วนได้ส่วนเสียให้รวมที่ปรึกษากฎหมายภายนอกและทีม compliance ของ cloud provider ก่อนเริ่มการประเมินความเสี่ยง","ประเมินผลกระทบด้านความเป็นส่วนตัวเฉพาะของโมเดล multi-tenancy และการทำซ้ำข้อมูลข้ามพรมแดน จากนั้นระบุมาตรการควบคุม เช่น การเข้ารหัสและมาตรการป้องกันทางกฎหมาย เพื่อลดความเสี่ยงเหล่านั้น","ติดต่อ cloud provider โดยตรงเพื่อเจรจาข้อตกลงการประมวลผลข้อมูลใหม่ก่อนที่ PIA จะเสร็จสมบูรณ์ เพื่อให้มีการคุ้มครองตามสัญญา"],"ans":"C","exp":"Assessing privacy risks is the step where specific cloud factors, such as multi-tenancy and data stored in countries with weaker laws, are evaluated and addressed through controls like encryption, role-based access, and legal safeguards such as standard contractual clauses. Submitting a report to regulators is a documentation step, not a risk-reduction action. Renegotiating contracts before completing the assessment skips the risk identification process the PIA is designed to perform. Expanding stakeholders is a valid PIA step but addresses participation, not the identified technical and legal risks.","expth":"การประเมินความเสี่ยงด้านความเป็นส่วนตัวคือขั้นตอนที่ประเมินปัจจัยเฉพาะของ cloud เช่น multi-tenancy และข้อมูลที่เก็บในประเทศที่มีกฎหมายอ่อนกว่า แล้วจัดการผ่านมาตรการควบคุม เช่น การเข้ารหัส role-based access และมาตรการป้องกันทางกฎหมาย เช่น standard contractual clauses การส่งรายงานให้หน่วยงานกำกับดูแลเป็นขั้นตอนด้านเอกสาร ไม่ใช่การดำเนินการลดความเสี่ยง การเจรจาสัญญาใหม่ก่อนประเมินเสร็จข้ามกระบวนการระบุความเสี่ยงที่ PIA ออกแบบมาให้ทำ และการขยายกลุ่มผู้มีส่วนได้ส่วนเสียเป็นขั้นตอนของ PIA ที่ใช้ได้ แต่จัดการเรื่องการมีส่วนร่วม ไม่ใช่ความเสี่ยงด้านเทคนิคและกฎหมายที่ระบุไว้"},{"id":170379817,"n":124,"d":5,"o":"5.4","q":"A forensic investigator is responding to a security incident in a cloud environment and must gather logs from the cloud provider's infrastructure, virtual machine snapshots, and object storage access records. The investigator cannot remove physical hardware from the provider's data center. What is the MOST appropriate forensic method to apply, and why does it fit this environment?","qth":"นักสืบสวนพิสูจน์หลักฐานดิจิทัล (forensic investigator) กำลังตอบสนองต่อเหตุการณ์ด้านความปลอดภัยในสภาพแวดล้อม cloud และต้องรวบรวม log จากโครงสร้างพื้นฐานของ cloud provider, snapshot ของ virtual machine และบันทึกการเข้าถึง object storage นักสืบสวนไม่สามารถนำฮาร์ดแวร์ทางกายภาพออกจาก data center ของ provider ได้ วิธีการพิสูจน์หลักฐานที่เหมาะสมที่สุด (MOST appropriate) คืออะไร และเหตุใดจึงเหมาะกับสภาพแวดล้อมนี้","a":["Collection, because removing original media ensures the evidence cannot be altered after the fact by the cloud provider.","Chain of custody documentation alone, because cloud logs are provider-controlled and cannot be independently verified through imaging.","Acquisition, because creating forensic copies of logs and snapshots preserves the evidence without requiring removal of the original hardware.","Eradication, because cleaning affected cloud instances before capturing evidence prevents contamination of the forensic record."],"ath":["Collection เพราะการนำสื่อต้นฉบับออกช่วยให้แน่ใจว่า cloud provider จะไม่สามารถเปลี่ยนแปลงหลักฐานภายหลังได้","เอกสาร chain of custody เพียงอย่างเดียว เพราะ cloud log อยู่ภายใต้การควบคุมของ provider และไม่สามารถตรวจสอบยืนยันอย่างอิสระผ่านการทำ imaging ได้","Acquisition เพราะการสร้างสำเนาพิสูจน์หลักฐานของ log และ snapshot รักษาหลักฐานไว้โดยไม่ต้องนำฮาร์ดแวร์ต้นฉบับออก","Eradication เพราะการทำความสะอาด cloud instance ที่ได้รับผลกระทบก่อนจับหลักฐานช่วยป้องกันการปนเปื้อนของบันทึกทางนิติวิทยาศาสตร์"],"ans":"C","exp":"ISO/IEC 27037 distinguishes collection, which removes original media, from acquisition, which creates a forensic copy without removing the original. Cloud environments require acquisition because physical hardware removal is not possible. Snapshots, log exports, and API-based copies are standard cloud acquisition methods. Collection is inapplicable here because the investigator cannot remove hardware. Chain of custody is a supporting process, not a substitute for acquiring evidence. Eradication destroys rather than preserves evidence and has no role in evidence gathering.","expth":"ISO/IEC 27037 แยก collection ซึ่งนำสื่อต้นฉบับออก ออกจาก acquisition ซึ่งสร้างสำเนาพิสูจน์หลักฐานโดยไม่นำต้นฉบับออก สภาพแวดล้อม cloud ต้องใช้ acquisition เพราะไม่สามารถนำฮาร์ดแวร์ทางกายภาพออกได้ Snapshot, log export และสำเนาที่ทำผ่าน API เป็นวิธี acquisition มาตรฐานบน cloud ส่วน collection ใช้ไม่ได้ในกรณีนี้เพราะนักสืบสวนนำฮาร์ดแวร์ออกไม่ได้ Chain of custody เป็นกระบวนการสนับสนุน ไม่ใช่สิ่งทดแทนการ acquire หลักฐาน และ eradication ทำลายหลักฐานแทนที่จะรักษา จึงไม่มีบทบาทในการรวบรวมหลักฐาน"},{"id":170379819,"n":125,"d":5,"o":"5.1","q":"A cloud service provider hosts services for a financial institution and must protect the cryptographic keys used to encrypt customer transaction data. The solution must also satisfy FIPS 140-2 requirements for regulated industries. What is the BEST technology to meet both needs?","qth":"cloud service provider โฮสต์บริการให้สถาบันการเงินแห่งหนึ่ง และต้องปกป้อง cryptographic key ที่ใช้เข้ารหัสข้อมูลธุรกรรมของลูกค้า โซลูชันต้องเป็นไปตามข้อกำหนด FIPS 140-2 สำหรับอุตสาหกรรมที่ถูกกำกับดูแลด้วย เทคโนโลยีที่ดีที่สุด (BEST) เพื่อตอบสนองทั้งสองความต้องการคืออะไร","a":["Implement a Hardware Security Module to manage and protect the encryption keys","Implement a Trusted Platform Module to validate the server's boot integrity","Enable software-defined network segmentation with encryption for data in transit","Deploy a Type 1 hypervisor configured with a trusted execution environment"],"ath":["ติดตั้ง Hardware Security Module เพื่อจัดการและปกป้อง encryption key","ติดตั้ง Trusted Platform Module เพื่อตรวจสอบความสมบูรณ์ของการ boot ของเซิร์ฟเวอร์","เปิดใช้ software-defined network segmentation พร้อมการเข้ารหัสข้อมูลระหว่างส่ง","ติดตั้ง Type 1 hypervisor ที่กำหนดค่าร่วมกับ trusted execution environment"],"ans":"A","exp":"A Hardware Security Module provides high level protection for cryptographic keys used in encryption, decryption, and digital signatures, and complies with FIPS 140-2, meeting regulatory requirements for financial data. A Trusted Platform Module validates hardware and firmware integrity, not large scale key operations. A Type 1 hypervisor with a trusted execution environment isolates workloads at the hardware level but does not manage encryption keys. Network segmentation with encryption secures data in transit, not key storage or FIPS compliance.","expth":"Hardware Security Module ให้การปกป้องระดับสูงสำหรับ cryptographic key ที่ใช้ในการเข้ารหัส ถอดรหัส และลายมือชื่อดิจิทัล และเป็นไปตาม FIPS 140-2 ตอบสนองข้อกำหนดด้านกฎระเบียบสำหรับข้อมูลทางการเงิน ส่วน Trusted Platform Module ตรวจสอบความสมบูรณ์ของฮาร์ดแวร์และ firmware ไม่ใช่การดำเนินการ key ขนาดใหญ่ Type 1 hypervisor ที่มี trusted execution environment แยก workload ที่ระดับฮาร์ดแวร์ แต่ไม่จัดการ encryption key และ network segmentation พร้อมการเข้ารหัสรักษาความปลอดภัยข้อมูลระหว่างส่ง ไม่ใช่การจัดเก็บ key หรือการปฏิบัติตาม FIPS"}]</script>
