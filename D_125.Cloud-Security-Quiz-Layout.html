<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Security Practice Quiz — EN / TH</title>
<style>
:root{
  --bg:#0f1419; --bg2:#161d27; --card:#1c2533; --line:#2a3648;
  --text:#e8eef7; --muted:#93a0b5; --accent:#4cc9f0; --accent2:#7c5cff;
  --good:#2ecc71; --bad:#ff5d73; --warn:#ffc857; --chip:#243044; --th:#ffd59a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
button,input,select{font:inherit}
.app{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}
.brand.link{cursor:pointer;border-radius:12px}
.brand.link:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#081018}
h1{font-size:1.12rem;margin:0}
.sub{color:var(--muted);font-size:.82rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.chip b{color:var(--text);font-weight:650}
.langbar{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:fit-content}
.langbar button{background:var(--bg2);border:0;color:var(--muted);padding:8px 16px;cursor:pointer}
.langbar button.on{background:linear-gradient(135deg,#1e8fb8,#4cc9f0);color:#06202a;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select, .btn{
  background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 12px
}
.toolbar input{min-width:200px;flex:1}
.btn{cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}
.btn.primary{background:linear-gradient(135deg,#1e8fb8,#4cc9f0);color:#06202a;font-weight:700;border:0}
.btn.ghost{background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.82rem}
.qtext{font-size:1.08rem;font-weight:600;margin:0 0 6px;white-space:pre-wrap}
.qth{color:var(--th);font-weight:500;font-size:1rem;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%;color:var(--text)}
.opt:hover{border-color:#4a5d78}
.letter{flex:0 0 28px;height:28px;border-radius:8px;background:#2a3648;display:grid;place-items:center;font-weight:700}
.optbody{flex:1}
.en{display:block}
.th{display:block;color:var(--th);font-size:.95rem;margin-top:3px}
.opt.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--good);background:rgba(46,204,113,.08)}
.opt.correct .letter{background:var(--good);color:#06210f}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.08)}
.opt.wrong .letter{background:var(--bad);color:#2a050c}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:#132033;border:1px solid #2a4a66;display:none}
.explain.show{display:block}
.explain h3{margin:0 0 6px;font-size:.85rem;color:var(--accent)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.progress{height:8px;background:#243044;border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .25s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:16px}
.gbtn{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);cursor:pointer}
.gbtn.cur{outline:2px solid var(--accent)}
.gbtn.ok{background:rgba(46,204,113,.18);color:var(--good);border-color:transparent}
.gbtn.no{background:rgba(255,93,115,.18);color:var(--bad);border-color:transparent}
.gbtn.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.disclaimer{margin-top:22px;color:var(--muted);font-size:.78rem;line-height:1.45}
.k{font-size:.75rem;color:var(--muted)}
.missing{opacity:.85}
.missing .th{color:#c9b08a}

/* ---- additions for Home, Exam mode and Results (same look as above) ---- */
.gbtn.ans{background:rgba(76,201,240,.16);color:var(--accent);border-color:transparent}
.opt.locked{cursor:default}
.opt.locked:not(.correct):not(.wrong):hover{border-color:var(--line)}
.opt .k{display:block;margin-top:4px}
.letter.wide{flex:0 0 auto;min-width:28px;padding:0 7px;font-size:.78rem}
.home-h{font-size:1.15rem;margin:0 0 4px}
.home-p{color:var(--muted);margin:0 0 14px;font-size:.9rem}
.mode-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.mode-row .langbar{margin:0}
.mini{height:4px;background:#243044;border-radius:99px;margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.examnote{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:#2a2410;border:1px solid #5a4a1a;color:var(--warn);font-size:.85rem}
.big{font-size:3rem;font-weight:800;line-height:1.1;margin:2px 0 4px}
.verdict{font-weight:700;margin:0 0 6px}
.verdict.ok{color:var(--good)}
.verdict.bad{color:var(--bad)}
.drow{margin:12px 0}
.dtop{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}
.dtop b{font-variant-numeric:tabular-nums}
.drow .progress{position:relative;margin:6px 0 0}
.drow .progress::after{content:"";position:absolute;left:70%;top:0;bottom:0;width:2px;background:var(--text);opacity:.6}
.bar.low{background:linear-gradient(90deg,#ff5d73,#ffb3bd)}
.card .drow + .btnrow{margin-top:24px}

.toolbar select{min-width:0;max-width:100%;text-overflow:ellipsis}
@media (max-width:640px){
  .qtext{font-size:1rem}
  .toolbar input{min-width:0;width:100%}
  .toolbar #scope{flex:1 1 100%}
  .toolbar #filter{flex:1 1 auto}
  .big{font-size:2.4rem}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand link" id="brand" role="button" tabindex="0">
      <div class="logo">C</div>
      <div>
        <h1 id="title">Cloud Security Practice Exam</h1>
        <div class="sub" id="subtitle">English / Thai study mode · 125 questions across six domains</div>
      </div>
    </div>
    <div class="stats">
      <span class="chip" id="chipQ"><span id="lblQ">Question</span> <b id="pos">1</b> / <b id="total">0</b></span>
      <span class="chip"><span id="lblScore">Score</span> <b id="score">0</b></span>
      <span class="chip"><span id="lblAns">Answered</span> <b id="answered">0</b></span>
      <span class="chip"><span id="lblAcc">Accuracy</span> <b id="acc">—</b></span>
      <span class="chip"><span id="lblTr">Translated</span> <b id="trcount">0</b></span>
    </div>
  </header>

  <div class="langbar" role="tablist" aria-label="Language">
    <button type="button" id="langEN">English</button>
    <button type="button" id="langTH">ไทย</button>
    <button type="button" id="langBOTH" class="on">ทั้งสอง · Both</button>
  </div>

  <!-- HOME -->
  <section id="homeView"></section>

  <!-- RESULTS -->
  <section id="resultsView" hidden></section>

  <!-- QUIZ -->
  <section id="quizView" hidden>
    <div class="toolbar">
      <button class="btn" id="homeBtn">⌂ Home</button>
      <input id="search" placeholder="Search / ค้นหา…" />
      <select id="scope" aria-label="Domain"></select>
      <select id="filter" aria-label="Filter">
        <option value="all">All / ทั้งหมด</option>
        <option value="unseen">Unanswered / ยังไม่ตอบ</option>
        <option value="flagged">Flagged / ติดธง</option>
        <option value="wrong">Incorrect / ผิด</option>
        <option value="right">Correct / ถูก</option>
      </select>
      <button class="btn" id="shuffleBtn">Shuffle: Off</button>
      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="examBtn">Exam mode: Off</button>
    </div>

    <div class="examnote" id="examNote" hidden></div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <section class="card" id="card">
      <div class="qmeta">
        <span id="qid">Q1</span>
        <span><button class="btn ghost" id="flagBtn">☆ Flag</button></span>
      </div>
      <p class="qtext" id="qtext"></p>
      <p class="qth" id="qth"></p>
      <div class="opts" id="opts"></div>
      <div class="explain" id="explain">
        <h3 id="exph">Explanation / คำอธิบาย</h3>
        <div id="expbody"></div>
      </div>
      <div class="nav">
        <button class="btn" id="prevBtn">← Prev</button>
        <button class="btn primary" id="nextBtn">Next →</button>
        <button class="btn" id="finishBtn" hidden>Finish exam</button>
        <span class="k" id="keys">Keys: A–D choose · N next · P prev · F flag · T language · H home</span>
      </div>
    </section>

    <h2 id="jumpH" style="font-size:.95rem;margin:22px 0 8px;color:var(--muted)">Jump to question</h2>
    <div class="grid" id="grid"></div>
  </section>

  <p class="disclaimer" id="disc"></p>
</div>

<script type="application/json" id="bank">[{"id":170379571,"n":1,"d":1,"o":"1.1","q":"An attacker generates a sustained flood of synthetic API requests against a cloud-hosted application to deliberately trigger auto-scaling events and inflate the target organization's cloud usage charges. The security team wants to identify the earliest indicator of this attack. What is the MOST effective first-line detection mechanism for this type of abuse?","qth":"ผู้โจมตีส่ง synthetic API request จำนวนมหาศาลอย่างต่อเนื่องไปยังแอปพลิเคชันที่โฮสต์บนคลาวด์ เพื่อจงใจกระตุ้นเหตุการณ์ auto-scaling และทำให้ค่าใช้จ่ายการใช้งานคลาวด์ขององค์กรเป้าหมายพุ่งสูง ทีมความมั่นคงปลอดภัยต้องการระบุตัวบ่งชี้แรกสุดของการโจมตีนี้ กลไกการตรวจจับด่านแรกที่มีประสิทธิผลที่สุด (MOST effective) สำหรับการใช้ในทางที่ผิดลักษณะนี้คืออะไร","a":["Reviewing IAM access logs to identify the account that triggered the scaling events, since unauthorized account access is the prerequisite for launching synthetic traffic attacks","Monitoring billing and usage patterns, because measured service tracks every unit of compute, storage, and network consumption, and anomalous spikes in these metrics signal potential cost-based attacks","Disabling rapid elasticity during non-peak hours to prevent attackers from exploiting the auto-scaling mechanism as a cost amplification vector","Implementing network-level firewalls and intrusion detection systems to block inbound synthetic traffic before it reaches the application tier and triggers a scaling response"],"ath":["ตรวจสอบ IAM access log เพื่อระบุบัญชีที่กระตุ้นเหตุการณ์ scaling เพราะการเข้าถึงบัญชีโดยไม่ได้รับอนุญาตเป็นข้อกำหนดเบื้องต้นของการโจมตีด้วยทราฟฟิกสังเคราะห์","เฝ้าติดตามรูปแบบการเรียกเก็บเงินและการใช้งาน เพราะ measured service ติดตามการใช้ compute, storage และ network ทุกหน่วย และการพุ่งสูงผิดปกติของเมตริกเหล่านี้บ่งชี้การโจมตีที่มุ่งสร้างต้นทุน","ปิด rapid elasticity ในช่วงนอกเวลาคับคั่ง เพื่อป้องกันผู้โจมตีใช้กลไก auto-scaling เป็นช่องทางขยายต้นทุน","ติดตั้ง firewall ระดับเครือข่ายและ IDS เพื่อบล็อกทราฟฟิกสังเคราะห์ขาเข้าก่อนถึงชั้นแอปพลิเคชันและก่อให้เกิดการ scale"],"ans":"B","exp":"Measured service tracks every unit of compute, storage, and network consumption, making billing and usage monitoring the earliest indicator of cost-based attacks exploiting auto-scaling. This attack uses external synthetic traffic and requires no unauthorized account access, so IAM log review would not surface it. Network firewalls and IDS may reduce traffic volume but are not the earliest detection mechanism for cost-based abuse. Disabling rapid elasticity removes a core cloud capability and provides no detection visibility. It is an operational constraint, not a detection control.","expth":"Measured service ติดตามการใช้ compute, storage และ network ทุกหน่วย การเฝ้าติดตามการเรียกเก็บเงินและการใช้งานจึงเป็นตัวบ่งชี้แรกสุดของการโจมตีที่มุ่งสร้างต้นทุนโดยใช้ประโยชน์จาก auto-scaling การโจมตีนี้ใช้ทราฟฟิกสังเคราะห์จากภายนอกและไม่ต้องเข้าถึงบัญชีโดยไม่ได้รับอนุญาต การตรวจ IAM log จึงไม่พบสิ่งใด Firewall และ IDS อาจลดปริมาณทราฟฟิกได้ แต่ไม่ใช่กลไกตรวจจับที่เร็วที่สุดสำหรับการใช้ในทางที่ผิดด้านต้นทุน การปิด rapid elasticity ตัดความสามารถหลักของคลาวด์และไม่ทำให้มองเห็นการโจมตี เป็นเพียงข้อจำกัดเชิงปฏิบัติการ ไม่ใช่มาตรการตรวจจับ"},{"id":170379573,"n":2,"d":1,"o":"1.1","q":"A cloud operations team manages a large e-commerce platform. During a peak sales event, the platform must automatically provision additional containers to handle increased API requests, spin up new servers with secure baseline configurations, and ensure all components are coordinated in the correct sequence. The team is debating whether to use automation scripts alone or to implement an orchestration platform. What is the MOST appropriate approach for managing this multi-step, end-to-end scaling workflow?","qth":"ทีม cloud operations ดูแลแพลตฟอร์มอีคอมเมิร์ซขนาดใหญ่ ในช่วงแคมเปญลดราคาสูงสุด แพลตฟอร์มต้องจัดเตรียม container เพิ่มโดยอัตโนมัติเพื่อรองรับ API request ที่เพิ่มขึ้น เปิดเซิร์ฟเวอร์ใหม่ที่มี secure baseline configuration และต้องประสานทุกองค์ประกอบให้ทำงานตามลำดับที่ถูกต้อง ทีมกำลังถกเถียงว่าจะใช้ automation script อย่างเดียว หรือนำ orchestration platform มาใช้ แนวทางที่เหมาะสมที่สุด (MOST appropriate) สำหรับการบริหาร workflow การ scale แบบหลายขั้นตอนตั้งแต่ต้นจนจบนี้คืออะไร","a":["Orchestration, but only when the environment includes more than five distinct services, since automation handles smaller deployments effectively regardless of workflow complexity","Automation scripts, because orchestration tools introduce additional security risk by centralizing infrastructure control, which increases the attack surface without providing operational benefit over scripted tasks","Automation scripts, because individual task automation using tools like Ansible or AWS Lambda is sufficient to manage container provisioning, server setup, and sequencing in a single workflow","Orchestration, because it coordinates multiple automated tasks into a managed, end-to-end workflow, ensuring all components are provisioned in the correct sequence and scale as needed"],"ath":["Orchestration แต่เฉพาะเมื่อสภาพแวดล้อมมี service ที่แตกต่างกันมากกว่าห้าตัว เพราะ automation จัดการการ deploy ขนาดเล็กได้ดีไม่ว่า workflow จะซับซ้อนเพียงใด","Automation script เพราะ orchestration tool เพิ่มความเสี่ยงด้านความมั่นคงปลอดภัยจากการรวมศูนย์การควบคุมโครงสร้างพื้นฐาน ซึ่งเพิ่ม attack surface โดยไม่ให้ประโยชน์เชิงปฏิบัติการเหนือกว่างานที่เขียนสคริปต์ไว้","Automation script เพราะการทำ automation ทีละงานด้วยเครื่องมืออย่าง Ansible หรือ AWS Lambda เพียงพอสำหรับการจัดเตรียม container การตั้งค่าเซิร์ฟเวอร์ และการจัดลำดับใน workflow เดียว","Orchestration เพราะประสานงานอัตโนมัติหลายงานให้เป็น workflow แบบครบวงจรที่บริหารจัดการได้ ทำให้ทุกองค์ประกอบถูกจัดเตรียมตามลำดับที่ถูกต้องและ scale ได้ตามต้องการ"],"ans":"D","exp":"Orchestration coordinates multiple automated tasks into a managed end-to-end workflow, ensuring components are provisioned in the correct sequence at scale. Automation addresses individual, repetitive tasks and is insufficient when multiple interdependent processes must be coordinated simultaneously. Orchestration does introduce centralization risk, but MFA and RBAC are recognized mitigations, not a reason to avoid it entirely. No numeric service threshold determines when orchestration applies. Workflow complexity and coordination requirements, not service count, are the determining criteria.","expth":"Orchestration ประสานงานอัตโนมัติหลายงานให้เป็น workflow แบบครบวงจร เพื่อให้องค์ประกอบต่าง ๆ ถูกจัดเตรียมตามลำดับที่ถูกต้องในระดับขนาดใหญ่ ส่วน automation จัดการงานเดี่ยวที่ทำซ้ำได้ และไม่เพียงพอเมื่อมีกระบวนการที่พึ่งพากันหลายอย่างต้องประสานพร้อมกัน Orchestration มีความเสี่ยงจากการรวมศูนย์จริง แต่ MFA และ RBAC เป็นมาตรการลดความเสี่ยงที่ยอมรับกัน ไม่ใช่เหตุผลให้เลี่ยงโดยสิ้นเชิง และไม่มีเกณฑ์จำนวน service ตายตัวที่กำหนดว่าต้องใช้ orchestration เกณฑ์ตัดสินคือความซับซ้อนของ workflow และความต้องการด้านการประสานงาน"},{"id":170379575,"n":3,"d":1,"o":"1.1","q":"An organization uses a public cloud provider to host a web application. A security audit reveals that customer data was exposed because the application's inbound traffic rules were overly permissive, allowing connections from any IP address. The cloud provider's underlying infrastructure was not involved in the breach. Which of the following BEST identifies the responsible party and the reason for accountability?","qth":"องค์กรใช้ผู้ให้บริการ public cloud โฮสต์ web application การตรวจสอบด้านความมั่นคงปลอดภัยพบว่าข้อมูลลูกค้าถูกเปิดเผยเพราะกฎ inbound traffic ของแอปพลิเคชันเปิดกว้างเกินไป อนุญาตการเชื่อมต่อจากทุก IP address โดยโครงสร้างพื้นฐานเบื้องล่างของผู้ให้บริการคลาวด์ไม่มีส่วนเกี่ยวข้องกับการละเมิด ข้อใดระบุผู้รับผิดชอบและเหตุผลของความรับผิดชอบได้ดีที่สุด (BEST)","a":["The Regulator, because overly permissive access controls represent a compliance violation enforced through regulatory oversight","The Cloud Service Provider, because they own and operate the infrastructure and must ensure all traffic rules are secure by default","The Cloud Service Broker, because they are responsible for enforcing security policies across cloud platforms on behalf of the customer","The Cloud Service Customer, because configuring security and managing access controls in the cloud is the customer's responsibility"],"ath":["Regulator เพราะการควบคุมการเข้าถึงที่เปิดกว้างเกินไปถือเป็นการละเมิดข้อกำหนดที่บังคับใช้ผ่านการกำกับดูแลของหน่วยงานกำกับ","Cloud Service Provider เพราะเป็นเจ้าของและดำเนินงานโครงสร้างพื้นฐาน จึงต้องทำให้กฎทราฟฟิกทั้งหมดปลอดภัยโดยค่าเริ่มต้น","Cloud Service Broker เพราะรับผิดชอบบังคับใช้นโยบายความมั่นคงปลอดภัยข้ามแพลตฟอร์มคลาวด์แทนลูกค้า","Cloud Service Customer เพราะการกำหนดค่าความมั่นคงปลอดภัยและการจัดการ access control ในคลาวด์เป็นความรับผิดชอบของลูกค้า"],"ans":"D","exp":"The Cloud Service Customer is responsible for securing data, configuring security settings, and managing access controls within the cloud environment. Overly permissive inbound rules are a customer-side configuration failure. The CSP secures the infrastructure layer, not the customer's application-level traffic rules. A Cloud Service Broker manages multi-cloud integration and brokerage, not per-tenant firewall configurations. Regulators enforce legal standards but bear no operational accountability for individual misconfigurations made by the customer.","expth":"Cloud Service Customer มีหน้าที่รักษาความมั่นคงปลอดภัยของข้อมูล กำหนดค่า security setting และจัดการ access control ภายในสภาพแวดล้อมคลาวด์ กฎ inbound ที่เปิดกว้างเกินไปเป็นความล้มเหลวด้านการกำหนดค่าฝั่งลูกค้า CSP รักษาความปลอดภัยชั้นโครงสร้างพื้นฐาน ไม่ใช่กฎทราฟฟิกระดับแอปพลิเคชันของลูกค้า Cloud Service Broker จัดการการบูรณาการและ brokerage แบบ multi-cloud ไม่ใช่การกำหนดค่า firewall รายผู้เช่า ส่วน Regulator บังคับใช้มาตรฐานทางกฎหมายแต่ไม่มีความรับผิดชอบเชิงปฏิบัติการต่อการกำหนดค่าผิดพลาดของลูกค้า"},{"id":170379577,"n":4,"d":1,"o":"1.2","q":"An organization is completing contract negotiations with a new cloud provider. Legal counsel has confirmed that all data formats are proprietary and that the provider does not support data export in any open format. The CIO asks the security team to assess whether the organization could recover its data and resume operations elsewhere if the provider were to shut down unexpectedly. What is the PRIMARY concern in this scenario?","qth":"องค์กรกำลังสรุปการเจรจาสัญญากับผู้ให้บริการคลาวด์รายใหม่ ที่ปรึกษากฎหมายยืนยันว่ารูปแบบข้อมูลทั้งหมดเป็น proprietary และผู้ให้บริการไม่รองรับการส่งออกข้อมูลในรูปแบบเปิดใด ๆ CIO ขอให้ทีมความมั่นคงปลอดภัยประเมินว่าองค์กรจะกู้คืนข้อมูลและกลับมาดำเนินงานที่อื่นได้หรือไม่ หากผู้ให้บริการปิดกิจการอย่างไม่คาดคิด ข้อกังวลหลัก (PRIMARY) ในสถานการณ์นี้คืออะไร","a":["Reversibility, because the organization cannot confirm it can migrate data and applications away from the provider without loss or excessive cost.","Availability, because a provider shutdown would directly interrupt service continuity and violate SLA guarantees.","Auditability, because the organization cannot verify compliance if the provider's environment is no longer accessible.","Interoperability, because the proprietary formats prevent the organization's systems from communicating with other platforms."],"ath":["Reversibility เพราะองค์กรไม่สามารถยืนยันได้ว่าจะย้ายข้อมูลและแอปพลิเคชันออกจากผู้ให้บริการได้โดยไม่สูญเสียหรือมีค่าใช้จ่ายสูงเกินไป","Availability เพราะการปิดกิจการของผู้ให้บริการจะขัดจังหวะความต่อเนื่องของบริการโดยตรงและละเมิดข้อตกลง SLA","Auditability เพราะองค์กรไม่สามารถตรวจสอบการปฏิบัติตามข้อกำหนดได้หากสภาพแวดล้อมของผู้ให้บริการไม่สามารถเข้าถึงได้อีกต่อไป","Interoperability เพราะรูปแบบ proprietary ทำให้ระบบขององค์กรสื่อสารกับแพลตฟอร์มอื่นไม่ได้"],"ans":"A","exp":"Reversibility is the ability to exit a cloud provider and recover data and workloads for deployment elsewhere. Proprietary formats with no export support directly block this capability, making reversibility the correct concern. Availability addresses service uptime during normal operations, not exit scenarios. Interoperability covers cross-platform communication during active use, not data recovery. Auditability concerns compliance review, not the ability to migrate workloads. The CIO's question is specifically about whether the organization can exit the provider cleanly.","expth":"Reversibility คือความสามารถในการออกจากผู้ให้บริการคลาวด์และกู้คืนข้อมูลกับ workload เพื่อนำไป deploy ที่อื่น รูปแบบ proprietary ที่ไม่รองรับการส่งออกข้อมูลขัดขวางความสามารถนี้โดยตรง จึงเป็นข้อกังวลที่ถูกต้อง Availability เกี่ยวกับ uptime ระหว่างการดำเนินงานปกติ ไม่ใช่สถานการณ์การออกจากระบบ Interoperability ครอบคลุมการสื่อสารข้ามแพลตฟอร์มระหว่างการใช้งานจริง ไม่ใช่การกู้คืนข้อมูล Auditability เกี่ยวกับการตรวจสอบการปฏิบัติตามข้อกำหนด ไม่ใช่ความสามารถในการย้าย workload คำถามของ CIO เกี่ยวกับการออกจากผู้ให้บริการอย่างสะอาดโดยเฉพาะ"},{"id":170379579,"n":5,"d":1,"o":"1.2","q":"A development team deployed a web application using a cloud-managed platform service. A third-party security audit finds three issues: an SQL injection vulnerability in the application code, an outdated middleware version managed by the provider, and a missing encryption control on customer records stored in the application database. The team must determine which issues are their responsibility to remediate. What is the MOST appropriate analysis of remediation responsibility?","qth":"ทีมพัฒนา deploy web application บน cloud-managed platform service การตรวจสอบโดยบุคคลที่สามพบปัญหาสามข้อ ได้แก่ ช่องโหว่ SQL injection ในโค้ดแอปพลิเคชัน middleware เวอร์ชันล้าสมัยที่ผู้ให้บริการเป็นผู้ดูแล และการขาดการเข้ารหัสสำหรับข้อมูลลูกค้าในฐานข้อมูลของแอปพลิเคชัน ทีมต้องระบุว่าปัญหาใดเป็นความรับผิดชอบที่ต้องแก้ไขของตน การวิเคราะห์ความรับผิดชอบในการแก้ไขที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["The development team is responsible for remediating the SQL injection vulnerability and the missing encryption control. The provider is responsible for the outdated middleware.","The provider is responsible for all three issues because PaaS includes full application lifecycle management and security.","The development team is responsible for all three issues because the application was deployed under their management regardless of the service model.","The development team is responsible for the SQL injection vulnerability only. The provider is responsible for all infrastructure and data security in PaaS."],"ath":["ทีมพัฒนารับผิดชอบแก้ไขช่องโหว่ SQL injection และการขาดการเข้ารหัส ส่วนผู้ให้บริการรับผิดชอบ middleware ที่ล้าสมัย","ผู้ให้บริการรับผิดชอบทั้งสามปัญหา เพราะ PaaS รวมการจัดการวงจรชีวิตและความมั่นคงปลอดภัยของแอปพลิเคชันทั้งหมด","ทีมพัฒนารับผิดชอบทั้งสามปัญหา เพราะแอปพลิเคชันถูก deploy ภายใต้การดูแลของทีมไม่ว่าจะเป็น service model ใด","ทีมพัฒนารับผิดชอบเฉพาะช่องโหว่ SQL injection ส่วนผู้ให้บริการรับผิดชอบโครงสร้างพื้นฐานและความมั่นคงปลอดภัยของข้อมูลทั้งหมดใน PaaS"],"ans":"A","exp":"In PaaS, the customer owns the application code and data. SQL injection is a code-level flaw introduced by the development team, and encryption of stored customer records is a customer-side data protection obligation. Middleware is part of the managed runtime the provider maintains. Deployment ownership does not override service model boundaries. Providers do not write or secure application code in PaaS. Data encryption of customer records is not the provider's responsibility. Each remediation must be assigned according to where the PaaS boundary falls.","expth":"ใน PaaS ลูกค้าเป็นเจ้าของโค้ดแอปพลิเคชันและข้อมูล SQL injection เป็นข้อบกพร่องระดับโค้ดที่ทีมพัฒนาก่อขึ้น และการเข้ารหัสข้อมูลลูกค้าที่จัดเก็บเป็นภาระผูกพันด้านการปกป้องข้อมูลฝั่งลูกค้า ส่วน middleware เป็นส่วนของ managed runtime ที่ผู้ให้บริการดูแล ความเป็นเจ้าของการ deploy ไม่ได้ล้มล้างขอบเขตของ service model ผู้ให้บริการไม่ได้เขียนหรือรักษาความปลอดภัยของโค้ดแอปพลิเคชันใน PaaS และการเข้ารหัสข้อมูลลูกค้าไม่ใช่ความรับผิดชอบของผู้ให้บริการ การแก้ไขแต่ละรายการต้องมอบหมายตามตำแหน่งที่เส้นแบ่งของ PaaS ตกอยู่"},{"id":170379581,"n":6,"d":1,"o":"1.2","q":"Several hospitals in a regional healthcare network need to share patient data for collaborative research. All member organizations are subject to the same regulatory requirements and require shared oversight of the infrastructure. What cloud deployment model BEST addresses these shared compliance requirements while enabling data collaboration?","qth":"โรงพยาบาลหลายแห่งในเครือข่ายสุขภาพระดับภูมิภาคต้องแบ่งปันข้อมูลผู้ป่วยเพื่อการวิจัยร่วมกัน องค์กรสมาชิกทั้งหมดอยู่ภายใต้ข้อกำหนดด้านกฎระเบียบเดียวกันและต้องการการกำกับดูแลโครงสร้างพื้นฐานร่วมกัน cloud deployment model ใดตอบสนองข้อกำหนดด้านการปฏิบัติตามข้อกำหนดร่วมกันได้ดีที่สุด (BEST) ขณะที่เอื้อให้เกิดการทำงานร่วมกันด้านข้อมูล","a":["Private cloud, because sensitive patient data should be controlled exclusively by a single organization.","Community cloud, where organizations with common concerns share infrastructure governed by shared access controls.","Hybrid cloud, because splitting workloads between public and private environments provides the best cost-to-security balance.","Public cloud, because its scale and redundancy provide the best availability for collaborative research workloads."],"ath":["Private cloud เพราะข้อมูลผู้ป่วยที่อ่อนไหวควรอยู่ภายใต้การควบคุมขององค์กรเดียวโดยเฉพาะ","Community cloud ซึ่งองค์กรที่มีข้อกังวลร่วมกันใช้โครงสร้างพื้นฐานร่วมกันภายใต้ access control ที่กำกับดูแลร่วมกัน","Hybrid cloud เพราะการแบ่ง workload ระหว่างสภาพแวดล้อม public และ private ให้ความสมดุลระหว่างต้นทุนและความมั่นคงปลอดภัยดีที่สุด","Public cloud เพราะขนาดและความซ้ำซ้อนให้ availability ที่ดีที่สุดสำหรับ workload วิจัยร่วมกัน"],"ans":"B","exp":"The community cloud model is designed for organizations that share regulatory requirements and governance concerns. It allows multiple organizations to share infrastructure while maintaining shared access controls and joint oversight. A public cloud lacks the controlled governance structure required by regulated healthcare entities. A private cloud restricts control to a single organization, which prevents multi-organization collaboration. A hybrid cloud balances public and private resources for a single organization's needs and is not structured for shared governance among distinct member organizations.","expth":"Community cloud model ออกแบบมาสำหรับองค์กรที่มีข้อกำหนดด้านกฎระเบียบและข้อกังวลด้านการกำกับดูแลร่วมกัน ช่วยให้หลายองค์กรใช้โครงสร้างพื้นฐานร่วมกันโดยยังคงมี access control ร่วมและการกำกับดูแลร่วม Public cloud ขาดโครงสร้างการกำกับดูแลที่ควบคุมได้ซึ่งหน่วยงานสุขภาพที่ถูกกำกับต้องการ Private cloud จำกัดการควบคุมไว้กับองค์กรเดียวซึ่งขัดขวางความร่วมมือหลายองค์กร ส่วน Hybrid cloud ปรับสมดุลทรัพยากร public และ private ตามความต้องการขององค์กรเดียว ไม่ได้ออกแบบมาสำหรับการกำกับดูแลร่วมระหว่างองค์กรสมาชิกที่แยกจากกัน"},{"id":170379583,"n":7,"d":1,"o":"1.2","q":"A company has migrated its entire HR platform to a SaaS provider. The provider manages all infrastructure, application code, and security patching. Three months after migration, the compliance team discovers that former employees still have active accounts with access to salary and performance data. The CISO is asked to explain what went wrong and who is responsible. What is the MOST appropriate assessment?","qth":"บริษัทย้าย HR platform ทั้งหมดไปยังผู้ให้บริการ SaaS ผู้ให้บริการจัดการโครงสร้างพื้นฐาน โค้ดแอปพลิเคชัน และ security patching ทั้งหมด สามเดือนหลังการย้าย ทีม compliance พบว่าอดีตพนักงานยังมีบัญชีที่ใช้งานได้และเข้าถึงข้อมูลเงินเดือนและผลการปฏิบัติงานได้ CISO ถูกขอให้อธิบายว่าเกิดอะไรขึ้นและใครรับผิดชอบ การประเมินที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["The SaaS provider failed to implement access review controls, as application security is entirely within the provider's scope.","The company and provider share equal responsibility because access management spans both the application layer and the customer's identity systems.","The compliance team failed to monitor provider activity reports, which are the primary mechanism for access oversight in SaaS.","The company failed to manage user access and permissions, which remains a customer responsibility even in a SaaS model."],"ath":["ผู้ให้บริการ SaaS ล้มเหลวในการติดตั้ง access review control เพราะความมั่นคงปลอดภัยของแอปพลิเคชันอยู่ในขอบเขตของผู้ให้บริการทั้งหมด","บริษัทและผู้ให้บริการรับผิดชอบเท่ากัน เพราะการจัดการการเข้าถึงครอบคลุมทั้งชั้นแอปพลิเคชันและระบบ identity ของลูกค้า","ทีม compliance ล้มเหลวในการเฝ้าติดตามรายงานกิจกรรมของผู้ให้บริการ ซึ่งเป็นกลไกหลักในการกำกับดูแลการเข้าถึงใน SaaS","บริษัทล้มเหลวในการจัดการผู้ใช้และสิทธิ์การเข้าถึง ซึ่งยังเป็นความรับผิดชอบของลูกค้าแม้ใน SaaS model"],"ans":"D","exp":"In SaaS, the provider manages the application and infrastructure, but the customer retains responsibility for user access management, including deprovisioning former employees. The provider cannot independently determine when staff leave. Monitoring activity reports is a reactive control and does not substitute for a proactive offboarding process. Framing access revocation as equally shared responsibility obscures a clear customer obligation. The failure was a process gap in the customer's own offboarding workflow, not a provider application security failure.","expth":"ใน SaaS ผู้ให้บริการจัดการแอปพลิเคชันและโครงสร้างพื้นฐาน แต่ลูกค้ายังรับผิดชอบการจัดการการเข้าถึงของผู้ใช้ รวมถึงการยกเลิกสิทธิ์ (deprovisioning) ของอดีตพนักงาน ผู้ให้บริการไม่อาจรู้ได้เองว่าพนักงานลาออกเมื่อใด การเฝ้าติดตามรายงานกิจกรรมเป็น reactive control และไม่อาจทดแทนกระบวนการ offboarding เชิงรุก การมองการเพิกถอนสิทธิ์เป็นความรับผิดชอบร่วมเท่า ๆ กันทำให้ภาระผูกพันที่ชัดเจนของลูกค้าเลือนราง ความล้มเหลวนี้เป็นช่องว่างของกระบวนการ offboarding ของลูกค้าเอง ไม่ใช่ความล้มเหลวด้าน application security ของผู้ให้บริการ"},{"id":170379585,"n":8,"d":1,"o":"1.2","q":"A national intelligence agency is modernizing its cloud infrastructure and stores classified data with a confidentiality requirement of 25 years. The agency's cryptography team confirms that all data at rest and in transit is protected using current-generation public-key algorithms. The security architecture board is reviewing whether the current encryption posture is sufficient for long-term data protection. A board member argues that since current encryption standards have not been broken, no changes are needed. What is the MOST appropriate assessment to present to the board?","qth":"หน่วยงานข่าวกรองแห่งชาติกำลังปรับปรุงโครงสร้างพื้นฐานคลาวด์ให้ทันสมัยและจัดเก็บข้อมูลลับที่มีข้อกำหนดด้านการรักษาความลับ 25 ปี ทีมเข้ารหัสลับของหน่วยงานยืนยันว่าข้อมูลทั้งที่จัดเก็บ (at rest) และที่ส่งผ่าน (in transit) ถูกป้องกันด้วยอัลกอริทึม public-key รุ่นปัจจุบัน คณะกรรมการสถาปัตยกรรมความมั่นคงปลอดภัยกำลังทบทวนว่าท่าทีการเข้ารหัสปัจจุบันเพียงพอสำหรับการปกป้องระยะยาวหรือไม่ กรรมการท่านหนึ่งแย้งว่ามาตรฐานการเข้ารหัสปัจจุบันยังไม่ถูกทำลาย จึงไม่จำเป็นต้องเปลี่ยนแปลงใด ๆ การประเมินที่เหมาะสมที่สุด (MOST appropriate) ที่ควรนำเสนอต่อคณะกรรมการคืออะไร","a":["The current posture is sufficient because no quantum computer capable of breaking public-key encryption has been deployed at scale, making quantum-related cryptographic risk theoretical and not actionable.","The current posture is insufficient because adversaries may be collecting encrypted data today with the intent to decrypt it once quantum computing capability matures, requiring the agency to begin evaluating cryptographic agility and post-quantum algorithm families now.","The agency should expand its key rotation frequency to quarterly intervals, as more frequent key rotation is the most effective near-term mitigation for quantum-related cryptographic risk.","The current posture should be reviewed only after national standards bodies publish mandatory post-quantum algorithm requirements, since premature migration introduces its own implementation risk."],"ath":["ท่าทีปัจจุบันเพียงพอ เพราะยังไม่มี quantum computer ที่ทำลายการเข้ารหัส public-key ได้ถูกใช้งานในวงกว้าง ทำให้ความเสี่ยงด้านการเข้ารหัสจาก quantum เป็นเพียงทฤษฎีและไม่ต้องลงมือทำ","ท่าทีปัจจุบันไม่เพียงพอ เพราะผู้โจมตีอาจเก็บข้อมูลที่เข้ารหัสไว้ตั้งแต่วันนี้เพื่อถอดรหัสเมื่อ quantum computing พัฒนาเต็มที่ หน่วยงานจึงต้องเริ่มประเมิน cryptographic agility และตระกูลอัลกอริทึม post-quantum ตั้งแต่ตอนนี้","หน่วยงานควรเพิ่มความถี่ในการหมุนเวียนกุญแจ (key rotation) เป็นรายไตรมาส เพราะเป็นมาตรการบรรเทาระยะใกล้ที่มีประสิทธิผลที่สุดต่อความเสี่ยงด้านการเข้ารหัสจาก quantum","ควรทบทวนท่าทีปัจจุบันหลังจากหน่วยงานมาตรฐานระดับประเทศเผยแพร่ข้อกำหนดอัลกอริทึม post-quantum แบบบังคับแล้วเท่านั้น เพราะการย้ายระบบก่อนเวลาอันควรก่อความเสี่ยงจากการนำไปใช้ของตัวเอง"],"ans":"B","exp":"The harvest now, decrypt later threat means adversaries can collect ciphertext today and wait for quantum capability to decrypt it. With a 25-year confidentiality requirement, data encrypted now may be exposed within that window. The threat is active in the collection phase regardless of whether quantum computers are currently deployed at scale. Waiting for mandatory standards ignores the data's protection horizon and the agency's specific risk profile. Key rotation does not address algorithmic vulnerability to quantum attacks. The risk is structural and requires cryptographic agility planning and post-quantum algorithm evaluation now.","expth":"ภัยคุกคาม harvest now, decrypt later หมายความว่าผู้โจมตีเก็บ ciphertext ไว้ตั้งแต่วันนี้แล้วรอให้ quantum มีความสามารถเพียงพอจึงถอดรหัส เมื่อมีข้อกำหนดการรักษาความลับ 25 ปี ข้อมูลที่เข้ารหัสในตอนนี้อาจถูกเปิดเผยภายในช่วงเวลานั้น ภัยคุกคามเกิดขึ้นแล้วในขั้นเก็บรวบรวม ไม่ว่าจะมี quantum computer ใช้งานในวงกว้างแล้วหรือไม่ การรอมาตรฐานบังคับเพิกเฉยต่อขอบเขตเวลาการปกป้องข้อมูลและโปรไฟล์ความเสี่ยงเฉพาะของหน่วยงาน key rotation ไม่ได้แก้ช่องโหว่ของอัลกอริทึมต่อการโจมตีด้วย quantum ความเสี่ยงนี้เป็นเชิงโครงสร้างและต้องวางแผน cryptographic agility และประเมินอัลกอริทึม post-quantum ตั้งแต่ตอนนี้"},{"id":170379587,"n":9,"d":1,"o":"1.3","q":"A security team is reviewing the architecture of a containerized application running on a shared cloud host. Multiple containers share the same OS kernel. A recent audit found that one container was attempting to access files belonging to adjacent containers. What is the MOST appropriate security control to address this risk?","qth":"ทีมความมั่นคงปลอดภัยกำลังทบทวนสถาปัตยกรรมของแอปพลิเคชันแบบ container ที่ทำงานบน shared cloud host โดย container หลายตัวใช้ OS kernel เดียวกัน การตรวจสอบล่าสุดพบว่า container หนึ่งพยายามเข้าถึงไฟล์ของ container ข้างเคียง มาตรการควบคุมความปลอดภัยที่เหมาะสมที่สุด (MOST appropriate) เพื่อจัดการความเสี่ยงนี้คืออะไร","a":["Prioritize securing the OS kernel and applying mandatory access controls using tools like SELinux to enforce isolation between containers.","Replace all container images with verified images sourced from a trusted registry to eliminate the risk of malicious code in dependencies.","Apply network policies to restrict inter-container traffic so that a compromised container cannot communicate with adjacent workloads.","Implement runtime monitoring tools such as Falco to detect and alert when a container attempts to access sensitive files or escalate privileges."],"ath":["ให้ความสำคัญกับการรักษาความปลอดภัย OS kernel และใช้ mandatory access control ด้วยเครื่องมืออย่าง SELinux เพื่อบังคับการแยกส่วนระหว่าง container","แทนที่ container image ทั้งหมดด้วย image ที่ตรวจสอบแล้วจาก trusted registry เพื่อกำจัดความเสี่ยงของโค้ดอันตรายใน dependency","ใช้ network policy จำกัดทราฟฟิกระหว่าง container เพื่อไม่ให้ container ที่ถูกเจาะสื่อสารกับ workload ข้างเคียงได้","ติดตั้งเครื่องมือ runtime monitoring เช่น Falco เพื่อตรวจจับและแจ้งเตือนเมื่อ container พยายามเข้าถึงไฟล์ที่อ่อนไหวหรือยกระดับสิทธิ์"],"ans":"A","exp":"Containers share the OS kernel, so a kernel vulnerability enables cross-container file access. Mandatory access controls via AppArmor or SELinux enforce isolation at the OS level, directly addressing the root cause. Replacing images addresses supply chain risk, not kernel exploitation. Runtime monitoring detects activity after the fact but does not prevent it. Network policies restrict communication paths but cannot stop kernel-level file access between containers on the same host.","expth":"Container ใช้ OS kernel ร่วมกัน ช่องโหว่ของ kernel จึงเปิดทางให้เข้าถึงไฟล์ข้าม container ได้ Mandatory access control ผ่าน AppArmor หรือ SELinux บังคับการแยกส่วนที่ระดับ OS จึงแก้ต้นเหตุโดยตรง การเปลี่ยน image แก้ความเสี่ยงด้าน supply chain ไม่ใช่การโจมตี kernel Runtime monitoring ตรวจจับกิจกรรมหลังเกิดเหตุแต่ไม่ป้องกัน ส่วน network policy จำกัดเส้นทางการสื่อสาร แต่หยุดการเข้าถึงไฟล์ระดับ kernel ระหว่าง container บน host เดียวกันไม่ได้"},{"id":170379589,"n":10,"d":1,"o":"1.3","q":"A development team has deployed a serverless function that processes customer payment requests triggered by HTTP events. The function accepts input from external callers without validation, its IAM role grants access to the entire payments database rather than only the tables it reads, and no logging is configured on the function's execution environment. The security team must address the risk most likely to allow an attacker to execute malicious code within the function. What is the MOST appropriate security control to prioritize to prevent an attacker from executing malicious code within the function?","qth":"ทีมพัฒนา deploy serverless function ที่ประมวลผลคำขอชำระเงินของลูกค้าซึ่งถูกกระตุ้นด้วย HTTP event ฟังก์ชันรับอินพุตจากผู้เรียกภายนอกโดยไม่มีการตรวจสอบความถูกต้อง IAM role ให้สิทธิ์เข้าถึงฐานข้อมูลการชำระเงินทั้งหมดแทนที่จะเป็นเฉพาะตารางที่อ่าน และไม่มีการตั้งค่า logging ใน execution environment ของฟังก์ชัน ทีมความมั่นคงปลอดภัยต้องจัดการความเสี่ยงที่มีแนวโน้มมากที่สุดที่จะทำให้ผู้โจมตีรันโค้ดอันตรายภายในฟังก์ชันได้ มาตรการควบคุมใดที่เหมาะสมที่สุด (MOST appropriate) ที่ควรให้ความสำคัญเป็นอันดับแรกเพื่อป้องกันผู้โจมตีรันโค้ดอันตรายภายในฟังก์ชัน","a":["Enable write-only access to the payment tables as an interim compensating control while the team implements full least-privilege IAM policies.","Implement input validation and sanitization on all data received through the HTTP event trigger to prevent attackers from manipulating event inputs to execute malicious code.","Restrict the serverless function's IAM role to a least-privilege policy limiting access only to the specific database tables required for its operation.","Configure detailed logging through the cloud provider's monitoring service to ensure any exploitation attempt is captured and available for incident response."],"ath":["เปิดสิทธิ์แบบ write-only ให้ตารางการชำระเงินเป็นมาตรการชดเชยชั่วคราว ระหว่างที่ทีมนำนโยบาย IAM แบบ least-privilege เต็มรูปแบบมาใช้","ติดตั้ง input validation และ sanitization กับข้อมูลทั้งหมดที่รับผ่าน HTTP event trigger เพื่อป้องกันผู้โจมตีบิดเบือนอินพุตของ event เพื่อรันโค้ดอันตราย","จำกัด IAM role ของ serverless function ให้เป็นนโยบาย least-privilege ที่อนุญาตเฉพาะตารางฐานข้อมูลที่จำเป็นต่อการทำงาน","ตั้งค่า logging แบบละเอียดผ่าน monitoring service ของผู้ให้บริการคลาวด์ เพื่อให้มั่นใจว่าความพยายามโจมตีถูกบันทึกและพร้อมใช้ในการตอบสนองเหตุการณ์"],"ans":"B","exp":"Serverless functions are event-driven. Attackers can manipulate event inputs to execute malicious code when input validation is absent, making this the direct code execution vector. Logging is a detective control that captures evidence after exploitation, not before. Restricting the IAM role limits blast radius but does not prevent the triggering attack. Write-only access is not a valid compensating control here and would prevent the function from reading the data it requires.","expth":"Serverless function ทำงานตาม event ผู้โจมตีสามารถบิดเบือนอินพุตของ event เพื่อรันโค้ดอันตรายเมื่อไม่มี input validation จึงเป็นช่องทางรันโค้ดโดยตรง Logging เป็นมาตรการเชิงตรวจจับที่เก็บหลักฐานหลังถูกโจมตี ไม่ใช่ก่อน การจำกัด IAM role ช่วยลด blast radius แต่ไม่ป้องกันการโจมตีที่กระตุ้นเหตุ สิทธิ์แบบ write-only ไม่ใช่มาตรการชดเชยที่ใช้ได้ในกรณีนี้ และจะทำให้ฟังก์ชันอ่านข้อมูลที่ต้องใช้ไม่ได้"},{"id":170379591,"n":11,"d":1,"o":"1.3","q":"A cloud provider hosts sensitive workloads for a financial institution and a government agency on the same physical hardware. The provider's security team must demonstrate that the architecture prevents data leakage between these tenants. A junior architect proposes that logical network segmentation at the application layer is sufficient because the tenants have different application profiles. What is the MOST appropriate evaluation of this proposal?","qth":"ผู้ให้บริการคลาวด์โฮสต์ workload ที่อ่อนไหวของสถาบันการเงินและหน่วยงานรัฐบาลบนฮาร์ดแวร์กายภาพเดียวกัน ทีมความมั่นคงปลอดภัยของผู้ให้บริการต้องพิสูจน์ว่าสถาปัตยกรรมป้องกันการรั่วไหลของข้อมูลระหว่างผู้เช่าเหล่านี้ สถาปนิกระดับจูเนียร์เสนอว่าการแบ่งส่วนเครือข่ายเชิงตรรกะที่ชั้นแอปพลิเคชันเพียงพอ เพราะผู้เช่ามีโปรไฟล์แอปพลิเคชันต่างกัน การประเมินข้อเสนอนี้ที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["The proposal is insufficient, but the primary mitigation is deploying dedicated physical hardware per tenant, since virtualization-based isolation cannot adequately separate sensitive workloads","The proposal is insufficient, because multi-tenancy isolation requires controls at the hypervisor level, including strong data encryption and isolation mechanisms, to prevent data leakage between tenants sharing the same physical hardware","The proposal is sufficient, because application-layer network segmentation isolates tenant data at the layer where most cloud workloads communicate, making lower-level controls redundant","The proposal is sufficient because different application profiles mean the workloads cannot interact even without hypervisor-level isolation controls"],"ath":["ข้อเสนอไม่เพียงพอ แต่มาตรการบรรเทาหลักคือการติดตั้งฮาร์ดแวร์กายภาพแยกให้แต่ละผู้เช่า เพราะการแยกส่วนแบบ virtualization ไม่สามารถแยก workload ที่อ่อนไหวได้อย่างเพียงพอ","ข้อเสนอไม่เพียงพอ เพราะ multi-tenancy isolation ต้องมีมาตรการควบคุมที่ระดับ hypervisor รวมถึงการเข้ารหัสข้อมูลที่แข็งแกร่งและกลไกการแยกส่วน เพื่อป้องกันการรั่วไหลของข้อมูลระหว่างผู้เช่าที่ใช้ฮาร์ดแวร์กายภาพเดียวกัน","ข้อเสนอเพียงพอ เพราะการแบ่งส่วนเครือข่ายที่ชั้นแอปพลิเคชันแยกข้อมูลผู้เช่าในชั้นที่ workload คลาวด์ส่วนใหญ่สื่อสารกัน ทำให้มาตรการระดับล่างซ้ำซ้อน","ข้อเสนอเพียงพอ เพราะโปรไฟล์แอปพลิเคชันที่ต่างกันหมายความว่า workload ไม่สามารถโต้ตอบกันได้แม้ไม่มีมาตรการแยกส่วนระดับ hypervisor"],"ans":"B","exp":"Multi-tenancy requires tenants to share physical hardware, making hypervisor security, strong encryption, and isolation mechanisms necessary to prevent cross-tenant data leakage. Application-layer segmentation controls service communication but does not address hypervisor-level vulnerabilities at the physical layer. Different application profiles do not prevent infrastructure-level leakage between co-hosted workloads. Dedicated hardware eliminates the risk but is not the prescribed approach. Virtualization-based isolation with proper hypervisor and encryption controls is the correct solution for shared-hardware multi-tenant environments.","expth":"Multi-tenancy กำหนดให้ผู้เช่าใช้ฮาร์ดแวร์กายภาพร่วมกัน จึงต้องมี hypervisor security การเข้ารหัสที่แข็งแกร่ง และกลไกการแยกส่วนเพื่อป้องกันการรั่วไหลของข้อมูลข้ามผู้เช่า การแบ่งส่วนที่ชั้นแอปพลิเคชันควบคุมการสื่อสารของ service แต่ไม่แก้ช่องโหว่ระดับ hypervisor ที่ชั้นกายภาพ โปรไฟล์แอปพลิเคชันที่ต่างกันไม่ป้องกันการรั่วไหลระดับโครงสร้างพื้นฐานระหว่าง workload ที่อยู่ร่วมกัน ฮาร์ดแวร์เฉพาะกำจัดความเสี่ยงได้แต่ไม่ใช่แนวทางที่กำหนด การแยกส่วนแบบ virtualization ที่มี hypervisor และการเข้ารหัสที่เหมาะสมเป็นวิธีแก้ที่ถูกต้องสำหรับสภาพแวดล้อม multi-tenant ที่ใช้ฮาร์ดแวร์ร่วมกัน"},{"id":170379593,"n":12,"d":1,"o":"1.4","q":"Your organization has built its entire production workload on a cloud provider's proprietary container orchestration service. The provider announces a 40% price increase effective next quarter, and the security team is now evaluating migration options. During assessment, the team discovers that the application cannot be moved without significant re-engineering. What is the PRIMARY concern this situation illustrates, and what design decision MOST directly caused it?","qth":"องค์กรของคุณสร้าง production workload ทั้งหมดบนบริการ container orchestration แบบ proprietary ของผู้ให้บริการคลาวด์ ผู้ให้บริการประกาศขึ้นราคา 40% มีผลไตรมาสหน้า และทีมความมั่นคงปลอดภัยกำลังประเมินทางเลือกในการย้าย ระหว่างการประเมิน ทีมพบว่าแอปพลิเคชันย้ายไม่ได้หากไม่ออกแบบใหม่ครั้งใหญ่ ข้อกังวลหลัก (PRIMARY) ที่สถานการณ์นี้สะท้อนคืออะไร และการตัดสินใจด้านการออกแบบใดเป็นสาเหตุโดยตรงที่สุด (MOST directly)","a":["Insufficient interoperability, because the organization failed to use common APIs that would allow data exchange across platforms.","Vendor lock-in, caused by dependence on a proprietary orchestration service that cannot be migrated without re-engineering.","Inadequate exit strategy documentation, because the organization did not record infrastructure configurations in a provider-neutral format.","Poor portability planning, caused by failing to encrypt data before storage so that it could be transferred freely between providers."],"ath":["Interoperability ไม่เพียงพอ เพราะองค์กรไม่ได้ใช้ API มาตรฐานที่ช่วยให้แลกเปลี่ยนข้อมูลข้ามแพลตฟอร์มได้","Vendor lock-in ที่เกิดจากการพึ่งพา orchestration service แบบ proprietary ซึ่งไม่สามารถย้ายได้โดยไม่ออกแบบใหม่","เอกสาร exit strategy ไม่เพียงพอ เพราะองค์กรไม่ได้บันทึกการกำหนดค่าโครงสร้างพื้นฐานในรูปแบบที่เป็นกลางต่อผู้ให้บริการ","การวางแผน portability ไม่ดี ซึ่งเกิดจากการไม่เข้ารหัสข้อมูลก่อนจัดเก็บ เพื่อให้โอนย้ายระหว่างผู้ให้บริการได้อย่างอิสระ"],"ans":"B","exp":"Vendor lock-in occurs when proprietary tooling makes migration impractical without re-engineering. Choosing a provider-specific orchestration service over a platform-neutral option like Kubernetes is the direct cause. Interoperability addresses cross-system data exchange, not migration barriers between providers. Encryption status has no effect on workload portability. Documenting exit strategies is a mitigation practice, not the root cause of the lock-in condition. The proprietary tooling choice is the discriminating factor here.","expth":"Vendor lock-in เกิดขึ้นเมื่อเครื่องมือ proprietary ทำให้การย้ายไม่สามารถทำได้จริงหากไม่ออกแบบใหม่ การเลือก orchestration service เฉพาะผู้ให้บริการแทนตัวเลือกที่เป็นกลางต่อแพลตฟอร์มอย่าง Kubernetes เป็นสาเหตุโดยตรง Interoperability เกี่ยวกับการแลกเปลี่ยนข้อมูลระหว่างระบบ ไม่ใช่อุปสรรคการย้ายระหว่างผู้ให้บริการ สถานะการเข้ารหัสไม่มีผลต่อ portability ของ workload การจัดทำเอกสาร exit strategy เป็นแนวปฏิบัติเพื่อบรรเทา ไม่ใช่สาเหตุรากของสภาวะ lock-in การเลือกเครื่องมือ proprietary เป็นปัจจัยชี้ขาดในกรณีนี้"},{"id":170379595,"n":13,"d":1,"o":"1.4","q":"An organization recently migrated from an IaaS deployment to a SaaS platform that handles payroll and HR data. The CISO wants to confirm what security responsibilities the organization retains in the SaaS model. A junior analyst argues that the provider now manages everything and no customer-side security action is needed. What is the MOST appropriate response to the analyst's position?","qth":"องค์กรเพิ่งย้ายจาก IaaS deployment ไปสู่แพลตฟอร์ม SaaS ที่จัดการข้อมูลเงินเดือนและ HR CISO ต้องการยืนยันว่าองค์กรยังคงรับผิดชอบด้านความมั่นคงปลอดภัยอะไรบ้างใน SaaS model นักวิเคราะห์ระดับจูเนียร์แย้งว่าตอนนี้ผู้ให้บริการจัดการทุกอย่างแล้วและไม่จำเป็นต้องมีการดำเนินการด้านความมั่นคงปลอดภัยฝั่งลูกค้า การตอบสนองที่เหมาะสมที่สุด (MOST appropriate) ต่อมุมมองของนักวิเคราะห์คืออะไร","a":["The analyst is partially correct. The provider manages infrastructure and applications, but the organization retains responsibility for operating system hardening and patch management within the SaaS environment","The analyst's position overstates the IaaS model. In IaaS, the provider already manages operating systems and applications, so no meaningful security shift occurs when moving to SaaS","The analyst's position is incorrect. In SaaS, the provider manages the application and infrastructure, but the customer retains responsibility for data access management and user permissions","The analyst is correct because SaaS providers manage the full environment, including all data security, access controls, and user permissions, leaving no residual customer responsibility"],"ath":["นักวิเคราะห์ถูกบางส่วน ผู้ให้บริการจัดการโครงสร้างพื้นฐานและแอปพลิเคชัน แต่องค์กรยังรับผิดชอบการ hardening ระบบปฏิบัติการและ patch management ภายในสภาพแวดล้อม SaaS","มุมมองของนักวิเคราะห์ประเมิน IaaS model เกินจริง ใน IaaS ผู้ให้บริการจัดการระบบปฏิบัติการและแอปพลิเคชันอยู่แล้ว จึงไม่มีการเปลี่ยนแปลงด้านความมั่นคงปลอดภัยที่มีนัยสำคัญเมื่อย้ายไป SaaS","มุมมองของนักวิเคราะห์ไม่ถูกต้อง ใน SaaS ผู้ให้บริการจัดการแอปพลิเคชันและโครงสร้างพื้นฐาน แต่ลูกค้ายังรับผิดชอบการจัดการการเข้าถึงข้อมูลและสิทธิ์ของผู้ใช้","นักวิเคราะห์ถูกต้อง เพราะผู้ให้บริการ SaaS จัดการสภาพแวดล้อมทั้งหมด รวมถึงความมั่นคงปลอดภัยของข้อมูล access control และสิทธิ์ผู้ใช้ทั้งหมด ไม่เหลือความรับผิดชอบฝั่งลูกค้า"],"ans":"C","exp":"In SaaS, the provider manages applications and infrastructure, but the customer retains responsibility for data access management and user permissions. The analyst is wrong that no residual responsibility exists. OS hardening and patching are provider responsibilities in SaaS, not the customer's. Assigning those duties to the customer misapplies IaaS-tier obligations to a SaaS model. In IaaS, the customer manages everything above physical infrastructure including the OS and applications, a substantially different responsibility distribution than SaaS.","expth":"ใน SaaS ผู้ให้บริการจัดการแอปพลิเคชันและโครงสร้างพื้นฐาน แต่ลูกค้ายังรับผิดชอบการจัดการการเข้าถึงข้อมูลและสิทธิ์ของผู้ใช้ นักวิเคราะห์ผิดที่ว่าไม่เหลือความรับผิดชอบใด ๆ การ hardening OS และการ patch เป็นความรับผิดชอบของผู้ให้บริการใน SaaS ไม่ใช่ของลูกค้า การมอบหน้าที่เหล่านั้นให้ลูกค้าคือการนำภาระผูกพันระดับ IaaS มาใช้กับ SaaS อย่างผิดที่ ใน IaaS ลูกค้าจัดการทุกอย่างเหนือโครงสร้างพื้นฐานกายภาพ รวมถึง OS และแอปพลิเคชัน ซึ่งการกระจายความรับผิดชอบต่างจาก SaaS อย่างมาก"},{"id":170379597,"n":14,"d":1,"o":"1.4","q":"A financial technology company is expanding its cloud infrastructure and evaluating whether to use a cloud provider's native container orchestration service or an open-source platform supported across multiple providers. The engineering team prefers the native service because it requires less configuration and integrates tightly with other provider-specific tools. The architecture team argues that the open-source option better serves the organization's long-term security posture. The organization currently hosts sensitive customer data that will need to migrate to a different region within 18 months due to regulatory requirements. What is the MOST appropriate architecture recommendation?","qth":"บริษัท fintech กำลังขยายโครงสร้างพื้นฐานคลาวด์ และประเมินว่าจะใช้ container orchestration service แบบ native ของผู้ให้บริการคลาวด์ หรือแพลตฟอร์มโอเพนซอร์สที่รองรับหลายผู้ให้บริการ ทีมวิศวกรรมชอบ native service เพราะตั้งค่าน้อยกว่าและเชื่อมต่อกับเครื่องมือเฉพาะของผู้ให้บริการอย่างแนบแน่น ทีมสถาปัตยกรรมแย้งว่าตัวเลือกโอเพนซอร์สตอบโจทย์ท่าทีด้านความมั่นคงปลอดภัยระยะยาวได้ดีกว่า ปัจจุบันองค์กรโฮสต์ข้อมูลลูกค้าที่อ่อนไหวซึ่งต้องย้ายไปยัง region อื่นภายใน 18 เดือนตามข้อกำหนดด้านกฎระเบียบ ข้อเสนอแนะด้านสถาปัตยกรรมที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["Use the native container orchestration service because tighter integration with provider tooling reduces misconfiguration risk and improves the security baseline.","Use the native container orchestration service now and plan to re-engineer the workload before the regulatory migration deadline, because short-term security gains outweigh portability concerns.","Use the open-source platform because avoiding proprietary orchestration tooling keeps workload portability, reduces vendor lock-in, and enables the regulatory migration without re-engineering.","Use a hybrid approach that deploys non-sensitive workloads on the native service and sensitive workloads on the open-source platform, splitting the risk between both options."],"ath":["ใช้ native container orchestration service เพราะการผสานกับเครื่องมือของผู้ให้บริการอย่างแนบแน่นลดความเสี่ยงการกำหนดค่าผิดพลาดและยกระดับ security baseline","ใช้ native container orchestration service ในตอนนี้ และวางแผนออกแบบ workload ใหม่ก่อนเส้นตายการย้ายตามกฎระเบียบ เพราะผลได้ด้านความปลอดภัยระยะสั้นมีน้ำหนักมากกว่าข้อกังวลเรื่อง portability","ใช้แพลตฟอร์มโอเพนซอร์ส เพราะการเลี่ยงเครื่องมือ orchestration แบบ proprietary รักษา portability ของ workload ลด vendor lock-in และเอื้อให้ย้ายตามกฎระเบียบได้โดยไม่ต้องออกแบบใหม่","ใช้แนวทาง hybrid โดย deploy workload ที่ไม่อ่อนไหวบน native service และ workload ที่อ่อนไหวบนแพลตฟอร์มโอเพนซอร์ส เพื่อกระจายความเสี่ยงระหว่างสองตัวเลือก"],"ans":"C","exp":"The open-source platform preserves portability and eliminates vendor lock-in, enabling the required regulatory migration without re-engineering. Using the native service creates dependence on proprietary tooling, which is a direct cause of lock-in. Accepting future re-engineering acknowledges a foreseeable and avoidable cost that conflicts with the regulatory deadline. A hybrid approach retains lock-in for the native-service portion and introduces inconsistent security policies without resolving the portability requirement for the sensitive workloads subject to migration.","expth":"แพลตฟอร์มโอเพนซอร์สรักษา portability และขจัด vendor lock-in ทำให้ย้ายตามกฎระเบียบได้โดยไม่ต้องออกแบบใหม่ การใช้ native service สร้างการพึ่งพาเครื่องมือ proprietary ซึ่งเป็นสาเหตุโดยตรงของ lock-in การยอมรับการออกแบบใหม่ในอนาคตคือการยอมรับต้นทุนที่คาดการณ์ได้และหลีกเลี่ยงได้ ซึ่งขัดกับเส้นตายด้านกฎระเบียบ แนวทาง hybrid ยังคง lock-in ในส่วนที่ใช้ native service และนำนโยบายความปลอดภัยที่ไม่สอดคล้องกันเข้ามา โดยไม่แก้ข้อกำหนด portability ของ workload ที่อ่อนไหวซึ่งต้องย้าย"},{"id":170379599,"n":15,"d":1,"o":"","q":"A security director is reviewing assurance documentation for a cloud provider that processes regulated healthcare data. The director requires evidence that the provider's security controls are consistently maintained over an extended period, not merely verified at a single point in time. Which report type provides the MOST appropriate evidence of ongoing control effectiveness?","qth":"ผู้อำนวยการด้านความมั่นคงปลอดภัยกำลังทบทวนเอกสารการรับรอง (assurance documentation) ของผู้ให้บริการคลาวด์ที่ประมวลผลข้อมูลสุขภาพที่ถูกกำกับ ผู้อำนวยการต้องการหลักฐานว่ามาตรการควบคุมความปลอดภัยของผู้ให้บริการได้รับการดูแลอย่างสม่ำเสมอตลอดช่วงเวลาหนึ่ง ไม่ใช่แค่ตรวจสอบ ณ จุดเวลาเดียว รายงานประเภทใดให้หลักฐานที่เหมาะสมที่สุด (MOST appropriate) ของประสิทธิผลของมาตรการควบคุมอย่างต่อเนื่อง","a":["A SOC 2 Type II report, which evaluates the design and operating effectiveness of controls over a defined review period.","A CSA STAR Level 1 self-assessment, which documents the provider's own attestation of its control environment.","A SOC 2 Type I report, which assesses the design of controls at a single point in time.","An ISO/IEC 27017 certification, which confirms that the provider has implemented cloud-specific security controls."],"ath":["รายงาน SOC 2 Type II ซึ่งประเมินการออกแบบและประสิทธิผลในการปฏิบัติงานของมาตรการควบคุมตลอดช่วงเวลาที่กำหนด","CSA STAR Level 1 self-assessment ซึ่งบันทึกการรับรองด้วยตนเองของผู้ให้บริการเกี่ยวกับสภาพแวดล้อมการควบคุม","รายงาน SOC 2 Type I ซึ่งประเมินการออกแบบของมาตรการควบคุม ณ จุดเวลาเดียว","ใบรับรอง ISO/IEC 27017 ซึ่งยืนยันว่าผู้ให้บริการได้ติดตั้งมาตรการควบคุมความปลอดภัยเฉพาะด้านคลาวด์"],"ans":"A","exp":"OBJ. 1.5. SOC 2 Type II reports evaluate how a provider maintains controls over a defined period rather than confirming only their design, making it the appropriate instrument for ongoing assurance. SOC 2 Type I confirms control design at a single point in time, which does not satisfy the director's requirement for sustained operating effectiveness. ISO/IEC 27017 certification confirms cloud-specific controls are in place but provides no ongoing operating effectiveness evidence over a defined period. A CSA STAR Level 1 self-assessment is an unverified provider claim and does not constitute independent ongoing assurance.","expth":"รายงาน SOC 2 Type II ประเมินว่าผู้ให้บริการรักษามาตรการควบคุมอย่างไรตลอดช่วงเวลาที่กำหนด ไม่ใช่เพียงยืนยันการออกแบบ จึงเป็นเครื่องมือที่เหมาะสมสำหรับการรับรองอย่างต่อเนื่อง SOC 2 Type I ยืนยันการออกแบบมาตรการควบคุม ณ จุดเวลาเดียว ซึ่งไม่ตอบข้อกำหนดเรื่องประสิทธิผลในการปฏิบัติงานอย่างต่อเนื่อง ใบรับรอง ISO/IEC 27017 ยืนยันว่ามีมาตรการเฉพาะด้านคลาวด์อยู่ แต่ไม่ให้หลักฐานประสิทธิผลในการปฏิบัติงานตลอดช่วงเวลาที่กำหนด ส่วน CSA STAR Level 1 self-assessment เป็นคำอ้างของผู้ให้บริการที่ไม่ได้รับการตรวจสอบ ไม่ถือเป็นการรับรองอิสระอย่างต่อเนื่อง"},{"id":170379601,"n":16,"d":1,"o":"","q":"A cloud provider is selecting a hypervisor for its core virtualization infrastructure. The security team requires a product independently tested and validated against established security requirements, balancing evaluation rigor with commercial availability. The compliance team notes that similar products from industry peers have been certified at EAL4. What is the MOST appropriate evaluation assurance level to require for this hypervisor selection?","qth":"ผู้ให้บริการคลาวด์กำลังเลือก hypervisor สำหรับโครงสร้างพื้นฐาน virtualization หลัก ทีมความมั่นคงปลอดภัยต้องการผลิตภัณฑ์ที่ผ่านการทดสอบและตรวจสอบอย่างเป็นอิสระตามข้อกำหนดด้านความมั่นคงปลอดภัยที่ยอมรับกัน โดยสมดุลระหว่างความเข้มงวดของการประเมินกับความพร้อมจำหน่ายเชิงพาณิชย์ ทีม compliance ระบุว่าผลิตภัณฑ์ที่คล้ายกันจากเพื่อนร่วมอุตสาหกรรมได้รับการรับรองที่ EAL4 evaluation assurance level ที่เหมาะสมที่สุด (MOST appropriate) ที่ควรกำหนดสำหรับการเลือก hypervisor นี้คืออะไร","a":["EAL4, providing a rigorous, practical level of assurance appropriate for critical infrastructure components such as hypervisors.","EAL2, meeting the minimum threshold for independent evaluation and adequate for hypervisors in multi-tenant cloud environments.","EAL1, providing basic assurance and sufficient for components that have not yet undergone independent security validation.","EAL7, providing the most rigorous testing and appropriate for securing all commercial cloud infrastructure components."],"ath":["EAL4 ซึ่งให้ระดับการรับรองที่เข้มงวดแต่ปฏิบัติได้จริง เหมาะกับองค์ประกอบโครงสร้างพื้นฐานที่สำคัญอย่าง hypervisor","EAL2 ซึ่งเป็นเกณฑ์ขั้นต่ำสำหรับการประเมินอิสระ และเพียงพอสำหรับ hypervisor ในสภาพแวดล้อมคลาวด์ multi-tenant","EAL1 ซึ่งให้การรับรองระดับพื้นฐานและเพียงพอสำหรับองค์ประกอบที่ยังไม่เคยผ่านการตรวจสอบความปลอดภัยอย่างเป็นอิสระ","EAL7 ซึ่งให้การทดสอบที่เข้มงวดที่สุดและเหมาะกับการรักษาความปลอดภัยองค์ประกอบโครงสร้างพื้นฐานคลาวด์เชิงพาณิชย์ทั้งหมด"],"ans":"A","exp":"OBJ. 1.5. EAL4 is the recognized industry standard for critical commercial products such as firewalls, VPN devices, and hypervisors, balancing thoroughness with practicality. EAL7 is reserved for highly sensitive government systems and is not the norm for commercial cloud infrastructure. EAL1 provides only basic assurance and is clearly insufficient for a component as critical as a hypervisor in a multi-tenant environment. EAL2 falls below the industry norm for hypervisors, and selecting it would fail the rigor requirement when EAL4 is both available and the established peer benchmark.","expth":"EAL4 เป็นมาตรฐานอุตสาหกรรมที่ยอมรับสำหรับผลิตภัณฑ์เชิงพาณิชย์ที่สำคัญอย่าง firewall อุปกรณ์ VPN และ hypervisor โดยสมดุลระหว่างความรอบคอบกับความปฏิบัติได้จริง EAL7 สงวนไว้สำหรับระบบรัฐบาลที่อ่อนไหวสูงและไม่ใช่บรรทัดฐานของโครงสร้างพื้นฐานคลาวด์เชิงพาณิชย์ EAL1 ให้การรับรองระดับพื้นฐานเท่านั้นและไม่เพียงพออย่างชัดเจนสำหรับองค์ประกอบสำคัญอย่าง hypervisor ในสภาพแวดล้อม multi-tenant ส่วน EAL2 ต่ำกว่าบรรทัดฐานของอุตสาหกรรมสำหรับ hypervisor การเลือก EAL2 จึงไม่ตอบข้อกำหนดด้านความเข้มงวด เมื่อ EAL4 หาได้และเป็นเกณฑ์อ้างอิงของเพื่อนร่วมอุตสาหกรรม"},{"id":170379603,"n":17,"d":1,"o":"","q":"An organization is migrating its e-commerce payment processing infrastructure to a cloud provider. The compliance team must verify that the provider's infrastructure meets requirements for protecting cardholder data. A separate project team is simultaneously evaluating a cloud-hosted collaboration platform and needs to confirm the provider applies strong cloud-specific controls for data segregation and shared responsibility. What is the MOST appropriate verification approach for each requirement?","qth":"องค์กรกำลังย้ายโครงสร้างพื้นฐานการประมวลผลการชำระเงินของอีคอมเมิร์ซไปยังผู้ให้บริการคลาวด์ ทีม compliance ต้องยืนยันว่าโครงสร้างพื้นฐานของผู้ให้บริการตอบข้อกำหนดการปกป้องข้อมูลบัตรผู้ถือบัตร (cardholder data) ในขณะเดียวกัน ทีมโครงการอีกทีมกำลังประเมินแพลตฟอร์มการทำงานร่วมกันที่โฮสต์บนคลาวด์ และต้องยืนยันว่าผู้ให้บริการใช้มาตรการควบคุมเฉพาะด้านคลาวด์ที่แข็งแกร่งสำหรับการแยกข้อมูล (data segregation) และ shared responsibility แนวทางการตรวจสอบที่เหมาะสมที่สุด (MOST appropriate) สำหรับแต่ละข้อกำหนดคืออะไร","a":["Use SOC 2 Type II reports for the payment infrastructure and CSA STAR Registry for the collaboration platform.","Use ISO/IEC 27017 certification for both requirements, as it addresses cloud-specific security controls for all cloud workloads including payment data.","Use the provider's PCI DSS Attestation of Compliance for payment infrastructure, and verify ISO/IEC 27017 certification for the collaboration platform.","Obtain the provider's CSA STAR Level 1 self-assessment for both requirements, as self-assessments are sufficient for regulated environments."],"ath":["ใช้รายงาน SOC 2 Type II สำหรับโครงสร้างพื้นฐานการชำระเงิน และ CSA STAR Registry สำหรับแพลตฟอร์มการทำงานร่วมกัน","ใช้ใบรับรอง ISO/IEC 27017 สำหรับทั้งสองข้อกำหนด เพราะครอบคลุมมาตรการควบคุมความปลอดภัยเฉพาะด้านคลาวด์สำหรับ workload คลาวด์ทั้งหมด รวมถึงข้อมูลการชำระเงิน","ใช้ PCI DSS Attestation of Compliance ของผู้ให้บริการสำหรับโครงสร้างพื้นฐานการชำระเงิน และตรวจสอบใบรับรอง ISO/IEC 27017 สำหรับแพลตฟอร์มการทำงานร่วมกัน","ขอ CSA STAR Level 1 self-assessment ของผู้ให้บริการสำหรับทั้งสองข้อกำหนด เพราะ self-assessment เพียงพอสำหรับสภาพแวดล้อมที่ถูกกำกับ"],"ans":"C","exp":"OBJ. 1.5. PCI DSS with an Attestation of Compliance, issued by a Qualified Security Assessor, is the specific standard for cardholder data protection. ISO/IEC 27017 addresses cloud-specific practices including data segregation and shared responsibility, matching the collaboration platform requirement. ISO/IEC 27017 alone does not satisfy PCI DSS requirements for payment card data. SOC 2 addresses operational controls but is not the primary instrument for cardholder data compliance. CSA STAR Level 1 self-assessments are provider-generated and insufficient for regulated environments.","expth":"PCI DSS ที่มี Attestation of Compliance ซึ่งออกโดย Qualified Security Assessor เป็นมาตรฐานเฉพาะสำหรับการปกป้องข้อมูลบัตรผู้ถือบัตร ISO/IEC 27017 ครอบคลุมแนวปฏิบัติเฉพาะด้านคลาวด์ รวมถึง data segregation และ shared responsibility ซึ่งตรงกับข้อกำหนดของแพลตฟอร์มการทำงานร่วมกัน ISO/IEC 27017 เพียงอย่างเดียวไม่ตอบข้อกำหนด PCI DSS สำหรับข้อมูลบัตรชำระเงิน SOC 2 ครอบคลุมมาตรการควบคุมเชิงปฏิบัติการ แต่ไม่ใช่เครื่องมือหลักสำหรับการปฏิบัติตามข้อกำหนดข้อมูลผู้ถือบัตร ส่วน CSA STAR Level 1 self-assessment เป็นเอกสารที่ผู้ให้บริการจัดทำเองและไม่เพียงพอสำหรับสภาพแวดล้อมที่ถูกกำกับ"},{"id":170379605,"n":18,"d":2,"o":"2.2","q":"A cloud security team discovers that a storage volume decommissioned from one tenant was reassigned to a new tenant without a documented sanitization process. The new tenant reports seeing file fragments that do not belong to their organization. What is the PRIMARY concern this scenario illustrates?","qth":"ทีมความมั่นคงปลอดภัยคลาวด์พบว่า storage volume ที่ปลดประจำการจากผู้เช่ารายหนึ่งถูกจัดสรรใหม่ให้ผู้เช่ารายใหม่โดยไม่มีกระบวนการ sanitization ที่เป็นเอกสาร ผู้เช่ารายใหม่รายงานว่าเห็นชิ้นส่วนไฟล์ที่ไม่ใช่ขององค์กรตน ข้อกังวลหลัก (PRIMARY) ที่สถานการณ์นี้สะท้อนคืออะไร","a":["Data remanence, because residual data persisted and was exposed to the new tenant","A denial of service condition, because the shared storage assignment disrupts normal access","An insecure API connection, because the tenant accessed storage without proper authentication","An insider threat, because a privileged administrator must have deliberately exposed the data"],"ath":["Data remanence เพราะข้อมูลตกค้างยังคงอยู่และถูกเปิดเผยต่อผู้เช่ารายใหม่","สภาวะ denial of service เพราะการจัดสรร storage ร่วมกันรบกวนการเข้าถึงตามปกติ","การเชื่อมต่อ API ที่ไม่ปลอดภัย เพราะผู้เช่าเข้าถึง storage โดยไม่มีการยืนยันตัวตนที่เหมาะสม","Insider threat เพราะผู้ดูแลระบบที่มีสิทธิ์พิเศษต้องจงใจเปิดเผยข้อมูล"],"ans":"A","exp":"Data remanence refers to the residual presence of data after it has been deleted. In cloud environments, storage media reused across tenants without proper sanitization can expose previous tenant data to the new tenant. This is the exact condition described. Insider threat requires deliberate misuse of legitimate access by a person, which is not indicated here. Denial of service disrupts availability rather than exposing data to unauthorized parties. An insecure API involves authentication or authorization failures, not residual data on reassigned physical or virtual storage media.","expth":"Data remanence หมายถึงการที่ข้อมูลยังคงหลงเหลืออยู่หลังถูกลบ ในสภาพแวดล้อมคลาวด์ สื่อจัดเก็บที่ถูกนำกลับมาใช้ข้ามผู้เช่าโดยไม่มีการ sanitize ที่เหมาะสมอาจเปิดเผยข้อมูลของผู้เช่ารายก่อนต่อผู้เช่ารายใหม่ ซึ่งตรงกับเงื่อนไขที่อธิบายไว้ Insider threat ต้องมีการใช้สิทธิ์ที่ชอบด้วยกฎหมายโดยเจตนาโดยบุคคล ซึ่งไม่ปรากฏในสถานการณ์นี้ Denial of service รบกวน availability ไม่ใช่เปิดเผยข้อมูลต่อผู้ไม่ได้รับอนุญาต ส่วน API ที่ไม่ปลอดภัยเกี่ยวกับความล้มเหลวด้านการยืนยันตัวตนหรือการอนุญาต ไม่ใช่ข้อมูลตกค้างบนสื่อจัดเก็บที่ถูกจัดสรรใหม่"},{"id":170379607,"n":19,"d":2,"o":"2.2","q":"A financial services firm is evaluating cloud storage options for a new application. Transactional processing requires sub-millisecond response times, while quarterly audit records must be retained for seven years at the lowest possible cost. What is the MOST appropriate storage strategy to meet both requirements?","qth":"บริษัทบริการทางการเงินกำลังประเมินตัวเลือก cloud storage สำหรับแอปพลิเคชันใหม่ การประมวลผลธุรกรรมต้องการเวลาตอบสนองระดับต่ำกว่ามิลลิวินาที ขณะที่บันทึกการตรวจสอบรายไตรมาสต้องเก็บรักษาเจ็ดปีด้วยต้นทุนต่ำที่สุด กลยุทธ์ storage ที่เหมาะสมที่สุด (MOST appropriate) เพื่อตอบสนองทั้งสองข้อกำหนดคืออะไร","a":["Use ephemeral storage for transactions and block storage for audit records","Use object storage for transactions and ephemeral storage for audit records","Use block storage for transactions and long-term storage for audit records","Use long-term storage for both, since it provides high durability for all data types"],"ath":["ใช้ ephemeral storage สำหรับธุรกรรม และ block storage สำหรับบันทึกการตรวจสอบ","ใช้ object storage สำหรับธุรกรรม และ ephemeral storage สำหรับบันทึกการตรวจสอบ","ใช้ block storage สำหรับธุรกรรม และ long-term storage สำหรับบันทึกการตรวจสอบ","ใช้ long-term storage สำหรับทั้งสองอย่าง เพราะให้ความคงทน (durability) สูงสำหรับข้อมูลทุกประเภท"],"ans":"C","exp":"Block storage provides the low latency and high I/O performance required for transactional systems with sub-millisecond response requirements. Long-term storage such as AWS Glacier or Azure Blob Archive is designed for data retained for compliance at minimal cost, with the accepted trade-off of slower retrieval. Object storage does not deliver the throughput required for transactional workloads. Ephemeral storage is temporary and non-persistent, making it entirely unsuitable for audit records requiring seven-year retention.","expth":"Block storage ให้ latency ต่ำและ I/O สมรรถนะสูงที่ระบบธุรกรรมซึ่งต้องการเวลาตอบสนองระดับต่ำกว่ามิลลิวินาทีต้องการ Long-term storage เช่น AWS Glacier หรือ Azure Blob Archive ออกแบบมาสำหรับข้อมูลที่เก็บเพื่อ compliance ด้วยต้นทุนต่ำสุด โดยยอมรับ trade-off คือการดึงข้อมูลที่ช้ากว่า Object storage ไม่ให้ throughput ที่ต้องการสำหรับ workload ธุรกรรม ส่วน ephemeral storage เป็นแบบชั่วคราวและไม่คงอยู่ (non-persistent) จึงไม่เหมาะเลยกับบันทึกการตรวจสอบที่ต้องเก็บเจ็ดปี"},{"id":170379609,"n":20,"d":2,"o":"2.2","q":"An attacker uploads a malicious file to a shared cloud storage folder used by a distributed development team. Several team members download the file as part of their normal workflow, resulting in compromised endpoints. What is the MOST effective approach to reduce the risk of this attack vector in cloud storage environments?","qth":"ผู้โจมตีอัปโหลดไฟล์อันตรายไปยังโฟลเดอร์ cloud storage ที่ใช้ร่วมกันของทีมพัฒนาแบบกระจาย สมาชิกในทีมหลายคนดาวน์โหลดไฟล์นั้นตามขั้นตอนการทำงานปกติ ส่งผลให้ endpoint ถูกเจาะ แนวทางที่มีประสิทธิผลที่สุด (MOST effective) ในการลดความเสี่ยงของช่องทางโจมตีนี้ในสภาพแวดล้อม cloud storage คืออะไร","a":["Implement rate limiting on the cloud storage API to slow down bulk download activity","Integrate endpoint protection and regular malware scanning to detect malicious files before propagation","Enforce data residency policies to ensure files remain within a single geographic region","Apply cryptographic erasure to files after each download session to prevent reuse of compromised content"],"ath":["ใช้ rate limiting กับ cloud storage API เพื่อชะลอกิจกรรมการดาวน์โหลดเป็นจำนวนมาก","ผนวก endpoint protection และการสแกนมัลแวร์สม่ำเสมอ เพื่อตรวจจับไฟล์อันตรายก่อนแพร่กระจาย","บังคับใช้นโยบาย data residency เพื่อให้ไฟล์อยู่ภายใน region ทางภูมิศาสตร์เดียว","ใช้ cryptographic erasure กับไฟล์หลังการดาวน์โหลดแต่ละครั้งเพื่อป้องกันการนำเนื้อหาที่ถูกเจาะกลับมาใช้"],"ans":"B","exp":"When malicious files are uploaded to shared storage, the propagation risk is realized when team members download them through normal workflows. Integrating endpoint protection and malware scanning directly into cloud storage systems intercepts threats before distribution occurs. Rate limiting addresses volumetric denial of service attacks, not malware propagation through legitimate downloads. Data residency controls govern compliance jurisdiction, not content safety. Cryptographic erasure is a data sanitization technique applied at decommissioning, not a malware detection or prevention control.","expth":"เมื่อไฟล์อันตรายถูกอัปโหลดไปยัง shared storage ความเสี่ยงของการแพร่กระจายจะเกิดขึ้นจริงเมื่อสมาชิกทีมดาวน์โหลดผ่านขั้นตอนการทำงานปกติ การผนวก endpoint protection และการสแกนมัลแวร์เข้ากับระบบ cloud storage โดยตรงจะสกัดภัยคุกคามก่อนกระจาย Rate limiting จัดการการโจมตีแบบ denial of service ที่เน้นปริมาณ ไม่ใช่การแพร่มัลแวร์ผ่านการดาวน์โหลดที่ชอบด้วยกฎหมาย การควบคุม data residency กำกับเขตอำนาจด้าน compliance ไม่ใช่ความปลอดภัยของเนื้อหา ส่วน cryptographic erasure เป็นเทคนิค data sanitization ที่ใช้ตอนปลดระวาง ไม่ใช่มาตรการตรวจจับหรือป้องกันมัลแวร์"},{"id":170379611,"n":21,"d":2,"o":"2.3","q":"A company discovers that an employee emailed a spreadsheet containing 4,000 customer Social Security numbers to a personal Gmail account. The DLP system logged the event but did not block it. The security team needs to determine which DLP component failed and how to prevent recurrence. What is the MOST appropriate analysis and remediation?","qth":"บริษัทพบว่าพนักงานส่งอีเมลสเปรดชีตที่มีเลขประกันสังคม (SSN) ของลูกค้า 4,000 รายไปยังบัญชี Gmail ส่วนตัว ระบบ DLP บันทึกเหตุการณ์แต่ไม่บล็อก ทีมความมั่นคงปลอดภัยต้องระบุว่า DLP component ใดล้มเหลวและป้องกันการเกิดซ้ำอย่างไร การวิเคราะห์และการแก้ไขที่เหมาะสมที่สุด (MOST appropriate) คืออะไร","a":["The enforcement mechanism failed. Classification was likely correct, but the policy did not include a blocking action for email exfiltration of Restricted data to personal accounts.","The data discovery component failed. The DLP system should have located the spreadsheet during routine scanning before it reached an email client.","The data classification component failed. Reconfigure scanning tools to identify Social Security numbers as a sensitive pattern and apply a Restricted label to trigger blocking policies.","The network DLP component was absent. Endpoint DLP cannot monitor email traffic, so a network-layer solution must be added to intercept outbound email."],"ath":["กลไก enforcement ล้มเหลว การจัดประเภทน่าจะถูกต้อง แต่นโยบายไม่มีการกระทำแบบบล็อกสำหรับการนำข้อมูล Restricted ออกทางอีเมลไปยังบัญชีส่วนตัว","ส่วน data discovery ล้มเหลว ระบบ DLP ควรค้นพบสเปรดชีตระหว่างการสแกนตามปกติก่อนที่จะถึง email client","ส่วน data classification ล้มเหลว ให้กำหนดค่าเครื่องมือสแกนใหม่เพื่อระบุ SSN เป็นรูปแบบข้อมูลอ่อนไหว และติดป้าย Restricted เพื่อกระตุ้นนโยบายการบล็อก","ไม่มีส่วน network DLP Endpoint DLP ไม่สามารถเฝ้าติดตามทราฟฟิกอีเมล จึงต้องเพิ่มโซลูชันชั้นเครือข่ายเพื่อสกัดอีเมลขาออก"],"ans":"A","exp":"DLP operates across three components: discovery, classification, and enforcement. The scenario states the system logged the event, which confirms that discovery and classification functioned correctly. The failure was in enforcement. The policy did not include a blocking action for email exfiltration to personal accounts. The data was logged, indicating classification was active, so this is not the failure point. Data discovery is contradicted by the logged event, which shows the system detected the transfer. Endpoint DLP agents can monitor and act on email transfers at the device layer without requiring a separate network solution.","expth":"DLP ทำงานผ่านสามองค์ประกอบ ได้แก่ discovery, classification และ enforcement สถานการณ์ระบุว่าระบบบันทึกเหตุการณ์ ซึ่งยืนยันว่า discovery และ classification ทำงานถูกต้อง ความล้มเหลวอยู่ที่ enforcement นโยบายไม่มีการกระทำแบบบล็อกสำหรับการนำข้อมูลออกทางอีเมลไปยังบัญชีส่วนตัว ข้อมูลถูกบันทึกแสดงว่า classification ทำงานอยู่ จึงไม่ใช่จุดล้มเหลว ส่วน data discovery ขัดแย้งกับเหตุการณ์ที่ถูกบันทึก ซึ่งแสดงว่าระบบตรวจพบการส่งข้อมูล และ Endpoint DLP agent สามารถเฝ้าติดตามและดำเนินการกับการส่งอีเมลที่ระดับอุปกรณ์ได้โดยไม่ต้องมีโซลูชันเครือข่ายแยกต่างหาก"},{"id":170379613,"n":22,"d":2,"o":"2.3","q":"A security architect is designing a key management framework for a large organization that uses distributed cloud systems across multiple regions, requiring secure key agreement protocols and key distribution methods across those systems. Which standard MOST directly addresses this specific requirement?","qth":"สถาปนิกความมั่นคงปลอดภัยกำลังออกแบบกรอบการจัดการกุญแจ (key management framework) สำหรับองค์กรขนาดใหญ่ที่ใช้ระบบคลาวด์แบบกระจายในหลาย region ซึ่งต้องการโปรโตคอล key agreement และวิธีการแจกจ่ายกุญแจที่ปลอดภัยทั่วทั้งระบบ มาตรฐานใดตอบข้อกำหนดเฉพาะนี้ได้ตรงที่สุด (MOST directly)","a":["FIPS 140-2, which defines security requirements for cryptographic modules used in federal environments","NIST SP 800-133, which covers cryptographic key generation using approved random number generators","NIST SP 800-57, which provides comprehensive guidance on key management lifecycle and best practices","ISO/IEC 11770, which provides guidance on key management specifically in distributed systems"],"ath":["FIPS 140-2 ซึ่งกำหนดข้อกำหนดด้านความมั่นคงปลอดภัยสำหรับ cryptographic module ที่ใช้ในสภาพแวดล้อมของรัฐบาลกลางสหรัฐ","NIST SP 800-133 ซึ่งครอบคลุมการสร้างกุญแจเข้ารหัสด้วยตัวสร้างเลขสุ่มที่ได้รับการรับรอง","NIST SP 800-57 ซึ่งให้แนวทางที่ครอบคลุมเกี่ยวกับวงจรชีวิตการจัดการกุญแจและแนวปฏิบัติที่ดี","ISO/IEC 11770 ซึ่งให้แนวทางการจัดการกุญแจเฉพาะสำหรับระบบแบบกระจาย"],"ans":"D","exp":"ISO/IEC 11770 is scoped specifically to key management in distributed systems and addresses key agreement protocols and key distribution methods, mapping directly to the multi-region architecture in the scenario. NIST SP 800-133 focuses narrowly on key generation using secure random number generators. NIST SP 800-57 is a comprehensive lifecycle guide but is not scoped to distributed systems specifically. FIPS 140-2 defines security requirements for cryptographic modules and does not address key management frameworks or distribution protocols.","expth":"ISO/IEC 11770 มีขอบเขตเฉพาะการจัดการกุญแจในระบบแบบกระจาย และครอบคลุมโปรโตคอล key agreement และวิธีแจกจ่ายกุญแจ ซึ่งตรงกับสถาปัตยกรรมหลาย region ในสถานการณ์ NIST SP 800-133 เน้นเฉพาะการสร้างกุญแจด้วยตัวสร้างเลขสุ่มที่ปลอดภัย NIST SP 800-57 เป็นคู่มือวงจรชีวิตที่ครอบคลุมแต่ไม่ได้จำกัดขอบเขตที่ระบบแบบกระจาย ส่วน FIPS 140-2 กำหนดข้อกำหนดของ cryptographic module และไม่ครอบคลุมกรอบการจัดการกุญแจหรือโปรโตคอลการแจกจ่าย"},{"id":170379615,"n":23,"d":2,"o":"2.3","q":"Your organization is preparing to digitally sign financial transaction records to ensure that the CFO cannot later claim they did not authorize a transfer. The security team must select the cryptographic technique that BEST addresses this requirement.","qth":"องค์กรของคุณกำลังเตรียมลงลายมือชื่อดิจิทัลในบันทึกธุรกรรมทางการเงิน เพื่อให้แน่ใจว่า CFO จะไม่สามารถอ้างภายหลังว่าไม่ได้อนุมัติการโอนเงิน ทีมความมั่นคงปลอดภัยต้องเลือกเทคนิคการเข้ารหัสที่ตอบข้อกำหนดนี้ได้ดีที่สุด (BEST)","a":["Digital signatures using the CFO's private key to bind authorization to the individual","Symmetric encryption using AES to protect the transaction data from unauthorized access","Hashing with SHA-256 to verify that the transaction record was not altered after signing","Asymmetric encryption using the CFO's public key to restrict access to the transaction record"],"ath":["Digital signature โดยใช้ private key ของ CFO เพื่อผูกการอนุมัติเข้ากับตัวบุคคล","Symmetric encryption ด้วย AES เพื่อปกป้องข้อมูลธุรกรรมจากการเข้าถึงโดยไม่ได้รับอนุญาต","Hashing ด้วย SHA-256 เพื่อตรวจสอบว่าบันทึกธุรกรรมไม่ถูกแก้ไขหลังการลงนาม","Asymmetric encryption โดยใช้ public key ของ CFO เพื่อจำกัดการเข้าถึงบันทึกธุรกรรม"],"ans":"A","exp":"Non-repudiation prevents a party from denying a previous action. Signing with a private key creates cryptographic proof of authorship that cannot be disowned, which is the only technique that satisfies this requirement. AES provides confidentiality, not accountability, and does not bind an action to an individual. SHA-256 alone provides integrity but cannot establish who authorized the transaction. Encrypting with a public key restricts access but creates no record of who performed the action.","expth":"Non-repudiation ป้องกันไม่ให้ฝ่ายใดปฏิเสธการกระทำที่ทำไปแล้ว การลงนามด้วย private key สร้างหลักฐานทางคริปโตกราฟีของผู้ลงนามที่ปฏิเสธไม่ได้ ซึ่งเป็นเทคนิคเดียวที่ตอบข้อกำหนดนี้ AES ให้ confidentiality ไม่ใช่ accountability และไม่ผูกการกระทำเ
