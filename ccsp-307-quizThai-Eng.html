. Any vulnerability with the APIs can cause significant risk and exposure to all tenants of the cloud environment.","qth":"ลักษณะสำคัญใดของคลาวด์ที่ถูกคุกคามมากที่สุดเมื่อ API ไม่ปลอดภัย","ath":["ระบบอัตโนมัติ","ความซ้ำซ้อน","การรวมทรัพยากร","ความยืดหยุ่นเชิงยืดขยาย"],"expth":"คลาวด์พึ่ง API ในการบริหารและทำระบบอัตโนมัติ ช่องโหว่ API จึงเสี่ยงต่อผู้เช่าทุกราย"},{"id":84,"q":"Which of the following should NOT be part of the requirement analysis phase of the software development lifecycle?","a":["Functionality","Programming languages","Software platform","Security requirements"],"ans":"D","exp":"Security requirements should be incorporated into the software development lifecycle (SDLC) from the earliest requirement gathering stage and should be incorporated prior to the requirement analysis phase.","qth":"ข้อใดไม่ควรเป็นส่วนหนึ่งของขั้นวิเคราะห์ความต้องการในวงจรพัฒนาซอฟต์แวร์","ath":["ฟังก์ชันการทำงาน","ภาษาโปรแกรม","แพลตฟอร์มซอฟต์แวร์","ความต้องการด้านความปลอดภัย"],"expth":"ความต้องการด้านความปลอดภัยควรใส่ใน SDLC ตั้งแต่ขั้นเก็บความต้องการ ซึ่งมาก่อนขั้นวิเคราะห์ความต้องการ"},{"id":85,"q":"Which of the cloud cross-cutting aspects relates to the assigning of jobs, tasks, and roles, as well as to ensuring they are successful and properly performed?","a":["Service-level agreements","Governance","Regulatory requirements","Auditability"],"ans":"B","exp":"Governance at its core is the idea of assigning jobs, takes, roles, and responsibilities and ensuring they are satisfactory performed.","qth":"แง่มุมใดที่ข้ามระบบคลาวด์ที่เกี่ยวข้องกับการมอบหมายงาน งาน และบทบาท ตลอดจนเพื่อให้แน่ใจว่างานจะประสบความสำเร็จและดำเนินการอย่างเหมาะสม","ath":["ข้อตกลงระดับการบริการ","การกำกับดูแล","ข้อกำหนดด้านกฎระเบียบ","การตรวจสอบ"],"expth":"การกำกับดูแลที่เป็นแกนหลักคือแนวคิดในการมอบหมายงาน รับบทบาท บทบาท และความรับผิดชอบ และรับรองว่าจะดำเนินการได้อย่างน่าพอใจ"},{"id":86,"q":"Which aspect of cloud computing makes it very difficult to perform repeat audits over time to track changes and compliance?","a":["Virtualization","Multitenancy","Resource pooling","Dynamic optimization"],"ans":"A","exp":"Cloud environments will regularly change virtual machines as patching and versions are changed. Unlike a physical environment, there is little continuity from one period of time to another. It is very unlikely that the same virtual machines would be in use during a repeat audit.","qth":"ด้านใดของการประมวลผลแบบคลาวด์ที่ทำให้การตรวจสอบซ้ำเมื่อเวลาผ่านไปเพื่อติดตามการเปลี่ยนแปลงและการปฏิบัติตามข้อกำหนดเป็นเรื่องยากมาก","ath":["การจำลองเสมือน (EXERT","การเช่าหลายรายการ","การรวมทรัพยากร","การเพิ่มประสิทธิภาพแบบไดนามิก"],"expth":"สภาพแวดล้อมระบบคลาวด์จะเปลี่ยนเครื่องเสมือนเป็นประจำเมื่อมีการแพตช์และเวอร์ชันที่เปลี่ยนแปลง ต่างจากสภาพแวดล้อมทางกายภาพ มีความต่อเนื่องเพียงเล็กน้อยจากช่วงเวลาหนึ่งไปยังอีกช่วงเวลาหนึ่ง ไม่น่าเป็นไปได้มาก ว่าเครื่องเสมือนเดียวกันจะถูกใช้งานในระหว่างการตรวจสอบซ้ำ"},{"id":87,"q":"Which security concept would business continuity and disaster recovery fall under?","a":["Confidentiality","Availability","Fault tolerance","Integrity"],"ans":"B","exp":"Disaster recovery and business continuity are vital concerns with availability. If data is destroyed or compromised, having regular backup systems in place as well as being able to perform disaster recovery in the event of a major or widespread problem allows operations to continue with an acceptable loss of time and data to management. This also ensures that sensitive data is protected and persisted in the event of the loss or corruption of data systems or physical storage systems.","qth":"แนวคิดด้านความปลอดภัยใดที่ความต่อเนื่องทางธุรกิจและการกู้คืนความเสียหายจะอยู่ภายใต้","ath":["การรักษาความลับ","ความพร้อมใช้งาน","ความทนทานต่อความเสียหาย","ความสมบูรณ์"],"expth":"การกู้คืนความเสียหายและความต่อเนื่องทางธุรกิจถือเป็นข้อกังวลที่สำคัญกับความพร้อมใช้งาน หากข้อมูลถูกทำลายหรือถูกโจมตี การมีระบบสำรองข้อมูลเป็นประจำตลอดจนสามารถดำเนินการกู้คืนระบบในกรณีที่เกิดปัญหาใหญ่หรือแพร่หลาย จะช่วยให้ฝ่ายจัดการสามารถดำเนินการต่อไปโดยสูญเสียเวลาและข้อมูลในระดับที่ยอมรับได้ นอกจากนี้ยังทำให้มั่นใจได้ว่าข้อมูลที่ละเอียดอ่อนได้รับการปกป้องและคงอยู่ในกรณีที่ระบบข้อมูลหรือระบบจัดเก็บข้อมูลทางกายภาพสูญหายหรือเสียหาย"},{"id":88,"q":"Which of the following is NOT a function performed by the record protocol of TLS?","a":["Encryption","Acceleration","Authentication","Compression"],"ans":"B","exp":"The record protocol of TLS performs the authentication and encryption of data packets, and in some cases compression as well. It does not perform any acceleration functions.","qth":"ข้อใดต่อไปนี้ไม่ใช่ฟังก์ชันที่ดำเนินการโดยโปรโตคอลบันทึกของ TLS","ath":["การเข้ารหัส","การเร่งความเร็ว","การตรวจสอบสิทธิ์","การบีบอัด"],"expth":"โปรโตคอลการบันทึกของ TLS ดำเนินการตรวจสอบสิทธิ์และการเข้ารหัสของแพ็กเก็ตข้อมูล และในบางกรณีก็มีการบีบอัดเช่นกัน มันไม่ทำหน้าที่เร่งความเร็วใดๆ"},{"id":89,"q":"What concept does the \"R\" represent with the DREAD model?","a":["Reproducibility","Repudiation","Risk","Residual"],"ans":"A","exp":"Reproducibility is the measure of how easy it is to reproduce and successful use an exploit. Scoring within the DREAD model ranges from 0, signifying a nearly impossibly exploit, up to 10, which signifies something that anyone from a simple function call could exploit, such as a URL.","qth":"แนวคิด \"R\" แสดงถึงแนวคิดใดด้วยโมเดล DREAD?","ath":["ความสามารถในการทำซ้ำ","การปฏิเสธ","ความเสี่ยง","ปริมาณคงเหลือ"],"expth":"ความสามารถในการทำซ้ำคือการวัดความง่ายในการทำซ้ำและการใช้ช่องโหว่ที่ประสบความสำเร็จ การให้คะแนนภายในโมเดล DREAD มีตั้งแต่ 0 ซึ่งบ่งบอกถึงการใช้ประโยชน์ที่แทบจะเป็นไปไม่ได้ จนถึง 10 ซึ่งบ่งบอกถึงบางสิ่งที่ใครก็ตามจากการเรียกใช้ฟังก์ชันธรรมดาสามารถใช้ประโยชน์ได้ เช่น URL"},{"id":90,"q":"The SOC Type 2 reports are divided into five principles. Which of the five principles must also be included when auditing any of the other four principles?","a":["Confidentiality","Privacy","Security","Availability"],"ans":"C","exp":"Under the SOC guidelines, when any of the four principles other than security are being audited, which includes availability, confidentiality, processing integrity, and privacy, the security principle must also be included with the audit.","qth":"รายงาน SOC ประเภท 2 แบ่งออกเป็นห้าหลักการ หลักการใดในห้าข้อที่ต้องรวมอยู่ด้วยเมื่อตรวจสอบหลักการใดๆ ในสี่หลักการอื่นๆ","ath":["การรักษาความลับ","ความเป็นส่วนตัว","ความปลอดภัย","ความพร้อมใช้งาน"],"expth":"ภายใต้หลักเกณฑ์ SOC เมื่อมีการตรวจสอบหลักการใดในสี่ประการนอกเหนือจากความปลอดภัย ซึ่งรวมถึงความพร้อมใช้งาน การรักษาความลับ ความสมบูรณ์ของการประมวลผล และความเป็นส่วนตัว จะต้องรวมหลักความปลอดภัยไว้ในการตรวจสอบด้วย"},{"id":91,"q":"How many additional DNS queries are needed when DNSSEC integrity checks are added?","a":["Three","Zero","One","Two"],"ans":"B","exp":"DNSSEC does not require any additional DNS queries to be performed. The DNSSEC integrity checks and validations are all performed as part of the single DNS lookup resolution.","qth":"เมื่อเพิ่มการตรวจสอบความสมบูรณ์ของ DNSSEC ต้องมีการสืบค้น DNS เพิ่มอีกกี่ครั้ง","ath":["สามครั้ง","ศูนย์ (ไม่ต้องเพิ่ม)","หนึ่งครั้ง","สองครั้ง"],"expth":"DNSSEC ไม่ต้องการการสืบค้น DNS เพิ่ม การตรวจสอบความสมบูรณ์และการยืนยันทั้งหมดทำในขั้นตอนการค้นหา DNS ครั้งเดียว"},{"id":92,"q":"Which of the following is a restriction that can be enforced by information rights management (IRM) that is not possible for traditional file system controls?","a":["Delete","Modify","Read","Print"],"ans":"D","exp":"IRM allows an organization to control who can print a set of information. This is not be possible under traditional file system controls, where if a user can read a file, they are able to print it as well.","qth":"ข้อใดต่อไปนี้เป็นข้อจำกัดที่สามารถบังคับใช้โดยการจัดการสิทธิ์ในข้อมูล (IRM) ซึ่งไม่สามารถทำได้สำหรับการควบคุมระบบ fle แบบดั้งเดิม","ath":["ลบ","แก้ไข","อ่าน","พิมพ์"],"expth":"IRM ช่วยให้องค์กรสามารถควบคุมผู้ที่สามารถพิมพ์ชุดข้อมูลได้ สิ่งนี้ไม่สามารถทำได้ภายใต้การควบคุมระบบไฟล์แบบเดิม ซึ่งหากผู้ใช้สามารถอ่านไฟล์ได้ ก็สามารถพิมพ์ได้เช่นกัน"},{"id":93,"q":"What type of security threat is DNSSEC designed to prevent?","a":["Account hijacking","Snooping","Spoofing","Injection"],"ans":"C","exp":"DNSSEC is designed to prevent the spoofing and redirection of DNS resolutions to rogue sites.","qth":"DNSSEC ออกแบบมาเพื่อป้องกันภัยคุกคามความปลอดภัยประเภทใด","ath":["การไฮแจ็กบัญชี","การสอดแนม","การปลอมแปลง","การฉีด"],"expth":"DNSSEC ได้รับการออกแบบมาเพื่อป้องกันการปลอมแปลงและการเปลี่ยนเส้นทางการแก้ไข DNS ไปยังไซต์หลอกลวง"},{"id":94,"q":"Which European Union directive pertains to personal data privacy and an individual's control over their personal data?","a":["99/9/EC","95/46/EC","2000/1/EC","2013/27001/EC"],"ans":"B","exp":"Directive 95/46/EC is titled \"On the protection of individuals with regard to the processing of personal data and on the free movement of such data.\"","qth":"คำสั่งของสหภาพยุโรปข้อใดที่เกี่ยวข้องกับความเป็นส่วนตัวของข้อมูลส่วนบุคคลและการควบคุมข้อมูลส่วนบุคคลของแต่ละบุคคล","ath":["99/9/EC","95/46/EC","2000/1/EC","2013/27001/EC"],"expth":"คำสั่ง 95/46/EC มีชื่อว่า “ในการคุ้มครองบุคคลที่เกี่ยวข้องกับการประมวลผล ของข้อมูลส่วนบุคคลและการเคลื่อนย้ายข้อมูลดังกล่าวอย่างเสรี\""},{"id":95,"q":"Which data point that auditors always desire is very difficult to provide within a cloud environment?","a":["Access policy","Systems architecture","Baselines","Privacy statement"],"ans":"B","exp":"Cloud environments are constantly changing and often span multiple physical locations. A cloud customer is also very unlikely to have knowledge and insight into the underlying systems architecture in a cloud environment. Both of these realities make it very difficult, if not impossible, for an organization to provide a comprehensive systems design document.","qth":"จุดข้อมูลใดที่ผู้ตรวจสอบต้องการอยู่เสมอเป็นเรื่องยากมากที่จะจัดเตรียมภายในสภาพแวดล้อมคลาวด์","ath":["นโยบายการเข้าถึง","สถาปัตยกรรมระบบ","พื้นฐาน","คำชี้แจงความเป็นส่วนตัว"],"expth":"สภาพแวดล้อมคลาวด์มีการเปลี่ยนแปลงตลอดเวลาและมักจะครอบคลุมตำแหน่งทางกายภาพหลายแห่ง ลูกค้าระบบคลาวด์ไม่น่าจะมีความรู้และข้อมูลเชิงลึกเกี่ยวกับสถาปัตยกรรมระบบพื้นฐานในสภาพแวดล้อมระบบคลาวด์มากนัก ความเป็นจริงทั้งสองประการนี้ทำให้เป็นเรื่องยากมาก หรือเป็นไปไม่ได้เลย สำหรับองค์กรในการจัดหาเอกสารการออกแบบระบบที่ครอบคลุม"},{"id":96,"q":"What type of host is exposed to the public Internet for a specific reason and hardened to perform only that function for authorized users?","a":["Proxy","Bastion","Honeypot","WAF"],"ans":"B","exp":"A bastion host is a server that is fully exposed to the public Internet, but is extremely hardened to prevent attacks and is usually dedicated for a specific application or usage; it is not something that will serve multiple purposes. This singular focus allows for much more stringent security hardening and monitoring.","qth":"โฮสต์ประเภทใดที่เปิดเผยต่ออินเทอร์เน็ตสาธารณะด้วยเหตุผลเฉพาะและฮาร์ด","ath":["พรอกซี","Bastion","Honeypot","WAF"],"expth":"โฮสต์ป้อมปราการคือเซิร์ฟเวอร์ที่เปิดเผยต่ออินเทอร์เน็ตสาธารณะโดยสมบูรณ์ แต่มีความยากมาก"},{"id":97,"q":"Which of the cloud cross-cutting aspects relates to the requirements placed on the cloud provider by the cloud customer for minimum performance standards and requirements that must be met?","a":["Regulatory requirements","SLAs","Auditability","Governance"],"ans":"B","exp":"Whereas a contract spells out general terms and costs for services, the SLA is where the real meat of the business relationship and concrete requirements come into play. The SLA spells out in clear terms the minimum requirements for uptime, availability, processes, customer service and support, security controls and requirements, auditing and reporting, and potentially many other areas that define the business relationship and the success of it.","qth":"ลักษณะที่ข้ามระบบคลาวด์ในข้อใดที่เกี่ยวข้องกับข้อกำหนดที่ลูกค้าคลาวด์วางไว้บนผู้ให้บริการคลาวด์สำหรับมาตรฐานประสิทธิภาพขั้นต่ำและข้อกำหนดที่ต้องปฏิบัติตาม","ath":["ข้อกำหนดด้านกฎระเบียบ","SLAs","การตรวจสอบ","การกำกับดูแล"],"expth":"ในขณะที่สัญญาระบุข้อกำหนดทั่วไปและต้นทุนสำหรับการบริการ SLA คือที่มาของความสัมพันธ์ทางธุรกิจและข้อกำหนดที่เป็นรูปธรรมอย่างแท้จริง เข้าสู่การเล่น SLA ระบุไว้อย่างชัดเจนถึงข้อกำหนดขั้นต่ำสำหรับสถานะการออนไลน์ ความพร้อมใช้งาน กระบวนการ การบริการลูกค้าและการสนับสนุน การควบคุมและข้อกำหนดด้านความปลอดภัย การตรวจสอบและการรายงาน และด้านอื่นๆ ที่อาจกำหนดความสัมพันธ์ทางธุรกิจและความสำเร็จของสิ่งนี้"},{"id":98,"q":"Which of the following service capabilities gives the cloud customer the most control over resources and configurations?","a":["Desktop","Platform","Infrastructure","Software"],"ans":"C","exp":"The infrastructure service capability gives the cloud customer substantial control in provisioning and configuring resources, including processing, storage, and network resources.","qth":"ความสามารถในการบริการใดต่อไปนี้ช่วยให้ลูกค้าระบบคลาวด์สามารถควบคุมทรัพยากรและการกำหนดค่าได้มากที่สุด","ath":["เดสก์ท็อป","แพลตฟอร์ม","โครงสร้างพื้นฐาน","ซอฟต์แวร์"],"expth":"ความสามารถในการให้บริการโครงสร้างพื้นฐานช่วยให้ลูกค้าระบบคลาวด์สามารถควบคุมการจัดเตรียมและการกำหนดค่าทรัพยากรได้อย่างมาก รวมถึงการประมวลผล พื้นที่เก็บข้อมูล และทรัพยากรเครือข่าย"},{"id":99,"q":"At which stage of the BCDR plan creation phase should security be included in discussions?","a":["Define scope","Analyze","Assess risk","Gather requirements"],"ans":"A","exp":"Security should be included in discussions from the very first phase when defining the scope. Adding security later is likely to incur additional costs in time and money, or will result in an incomplete or inadequate plan.","qth":"ขั้นตอนการสร้างแผน BCDR ควรรวมความปลอดภัยไว้ในการอภิปรายที่ขั้นตอนใด","ath":["กำหนดขอบเขต","วิเคราะห์","ประเมินความเสี่ยง","รวบรวมข้อกำหนด"],"expth":"ความปลอดภัยควรรวมอยู่ในการอภิปรายตั้งแต่ระยะแรกสุดเมื่อกำหนดขอบเขต การเพิ่มความปลอดภัยในภายหลังมีแนวโน้มที่จะต้องเสียค่าใช้จ่ายทั้งเวลาและเงินมากขึ้น ส่งผลให้แผนไม่ครบถ้วนหรือไม่เพียงพอ"},{"id":100,"q":"Which approach is typically the most efficient method to use for data discovery?","a":["Metadata","Content analysis","Labels","ACLs"],"ans":"A","exp":"Metadata is data about data. It contains information about the type of data, how it is stored and organized, or information about its creation and use.","qth":"โดยทั่วไปแล้วแนวทางใดเป็นวิธีที่มีประสิทธิภาพที่สุดในการค้นหาข้อมูล","ath":["ข้อมูลเมตา","การวิเคราะห์เนื้อหา","ป้ายกำกับ","ACLs"],"expth":"ข้อมูลเมตาคือข้อมูลเกี่ยวกับข้อมูล ประกอบด้วยข้อมูลเกี่ยวกับประเภทของข้อมูล วิธีจัดเก็บและจัดระเบียบ หรือข้อมูลเกี่ยวกับการสร้างและการใช้งาน"},{"id":101,"q":"Which of the following features is a main benefit of PaaS over IaaS?","a":["Location independence","High-availability","Physical security requirements","Auto-scaling"],"ans":"D","exp":"With PaaS providing a fully configured and managed framework, auto-scaling can be implemented to programmatically adjust resources based on the current demands of the environment.","qth":"คุณสมบัติใดต่อไปนี้เป็นประโยชน์หลักของ PaaS เหนือ laaS?","ath":["ความเป็นอิสระของตำแหน่ง","ความพร้อมใช้งานสูง","ข้อกำหนดด้านความปลอดภัยทางกายภาพ","การปรับขนาดอัตโนมัติ"],"expth":"ด้วย PaaS ที่ให้เฟรมเวิร์กที่ได้รับการกำหนดค่าและจัดการอย่างสมบูรณ์ การปรับขนาดอัตโนมัติสามารถนำไปใช้เพื่อปรับทรัพยากรโดยทางโปรแกรมตามความต้องการในปัจจุบันของสภาพแวดล้อม"},{"id":102,"q":"Which of the following service capabilities gives the cloud customer the least amount of control over configurations and deployments?","a":["Platform","Infrastructure","Software","Desktop"],"ans":"C","exp":"The software service capability gives the cloud customer a fully established application, where only minimal user configuration options are allowed.","qth":"ความสามารถในการบริการใดต่อไปนี้ช่วยให้ลูกค้าระบบคลาวด์สามารถควบคุมทรัพยากรและการกำหนดค่าได้มากที่สุด","ath":["แพลตฟอร์ม","โครงสร้างพื้นฐาน","ซอฟต์แวร์","เดสก์ท็อป"],"expth":"ความสามารถในการให้บริการโครงสร้างพื้นฐานช่วยให้ลูกค้าระบบคลาวด์สามารถควบคุมการจัดเตรียมและการกำหนดค่าทรัพยากรได้อย่างมาก รวมถึงการประมวลผล พื้นที่เก็บข้อมูล และทรัพยากรเครือข่าย"},{"id":103,"q":"What does the \"SOC\" acronym refer to with audit reports?","a":["Service Origin Confidentiality","System Organization Confidentiality","Service Organizational Control","System Organization Control"],"ans":"C","exp":"","qth":"ตัวย่อ \"SOC\" อ้างอิงถึงอะไรในรายงานการตรวจสอบ","ath":["การรักษาความลับของแหล่งกำเนิดบริการ","การรักษาความลับขององค์กรของระบบ","การควบคุมองค์กรของบริการ","การควบคุมองค์กรของระบบ"],"expth":""},{"id":104,"q":"What does the REST API use to protect data transmissions?","a":["NetBIOS","VPN","Encapsulation","TLS"],"ans":"D","exp":"Representational State Transfer (REST) uses TLS for communication over secured channels. Although REST also supports SSL, at this point SSL has been phased out due to vulnerabilities and has been replaced by TLS.","qth":"REST API ใช้อะไรเพื่อป้องกันการส่งข้อมูล","ath":["NetBIOS","VPN","Encapsulation","TLS"],"expth":"Representational State Transfer (REST) ​​ใช้ TLS สำหรับการสื่อสารผ่านช่องทางที่ปลอดภัย แม้ว่า REST จะรองรับ SSL ด้วยเช่นกัน แต่ ณ จุดนี้ SSL ได้ถูกยกเลิกเนื่องจากช่องโหว่และถูกแทนที่ด้วย TLS"},{"id":105,"q":"With software-defined networking, what aspect of networking is abstracted from the forwarding of traffic?","a":["Routing","Session","Filtering","Firewalling"],"ans":"C","exp":"With software-defined networking (SDN), the filtering of network traffic is separated from the forwarding of network traffic so that it can be independently administered.","qth":"เมื่อใช้ระบบเครือข่ายที่กำหนดโดยซอฟต์แวร์ ลักษณะใดของเครือข่ายจะถูกแยกออกจากการส่งต่อการรับส่งข้อมูล?","ath":["การกำหนดเส้นทาง (Routing)","เซสชัน (Session)","การกรอง (Filtering)","ไฟร์วอลล์ (Firewall)"],"expth":"ด้วยเครือข่ายที่กำหนดโดยซอฟต์แวร์ (SDN) การกรองการรับส่งข้อมูลเครือข่ายจะถูกแยกออกจากการส่งต่อการรับส่งข้อมูลเครือข่าย เพื่อให้สามารถจัดการได้อย่างอิสระ"},{"id":106,"q":"Which of the following does NOT fall under the \"IT\" aspect of quality of service (QoS)?","a":["Applications","Key performance indicators (KPIs)","Services","Security"],"ans":"B","exp":"KPIs fall under the \"business\" aspect of QoS, along with monitoring and measuring of events and business processes. Services, security, and applications are all core components and concepts of the \"IT\" aspect of QoS.","qth":"ข้อใดไม่จัดอยู่ในด้าน “IT” ของคุณภาพการให้บริการ (QoS)","ath":["แอปพลิเคชัน","ตัวชี้วัดผลการดำเนินงาน (KPI)","บริการ","ความปลอดภัย"],"expth":"KPI อยู่ในด้านธุรกิจของ QoS ส่วนบริการ ความปลอดภัย และแอปพลิเคชันเป็นองค์ประกอบด้าน IT"},{"id":107,"q":"What does dynamic application security testing (DAST) NOT entail?","a":["Scanning","Probing","Discovery","Knowledge of the system"],"ans":"D","exp":"Dynamic application security testing (DAST) is considered \"black box\" testing and begins with no inside knowledge of the application or its configurations. Everything about the application must be discovered during the testing.","qth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบไดนามิก (DAST) ไม่เกี่ยวข้องกับอะไร","ath":["การสแกน","การตรวจสอบ","การค้นพบ","ความรู้เกี่ยวกับระบบ"],"expth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบไดนามิก (DAST) ถือเป็นการทดสอบ \"กล่องดำ\" และเริ่มต้นด้วยการไม่มีความรู้ภายในเกี่ยวกับแอปพลิเคชันหรือการกำหนดค่าของแอปพลิเคชัน ทุกอย่างเกี่ยวกับแอปพลิเคชันจะต้องถูกค้นพบในระหว่างการทดสอบ"},{"id":108,"q":"What type of masking strategy involves replacing data on a system while it passes between the data and application layers?","a":["Dynamic","Static","Replication","Duplication"],"ans":"A","exp":"With dynamic masking, production environments are protected with the masking process being implemented between the application and data layers of the application. This allows for a masking translation to take place live in the system and during normal application processing of data.","qth":"กลยุทธ์การมาสก์ประเภทใดที่เกี่ยวข้องกับการแทนที่ข้อมูลบนระบบในขณะที่ส่งผ่านระหว่างข้อมูลและเลเยอร์แอปพลิเคชัน","ath":["ไดนามิก","คงที่","การจำลอง","การทำสำเนา"],"expth":"ด้วยการมาสก์แบบไดนามิก สภาพแวดล้อมการผลิตได้รับการปกป้องด้วยกระบวนการมาสก์ที่ถูกนำมาใช้ระหว่างแอปพลิเคชันและชั้นข้อมูลของแอปพลิเคชัน ซึ่งช่วยให้การแปลแบบมาสก์เกิดขึ้นในระบบและในระหว่างการประมวลผลข้อมูลแอปพลิเคชันปกติ"},{"id":109,"q":"Which aspect of security is DNSSEC designed to ensure?","a":["Integrity","Authentication","Availability","Confidentiality"],"ans":"A","exp":"DNSSEC is a security extension to the regular DNS protocol and services that allows for the validation of the integrity of DNS lookups. It does not address confidentiality or availability at all. It allows for a DNS client to perform DNS lookups and validate both their origin and authority via the cryptographic signature that accompanies the DNS response.","qth":"ความปลอดภัยด้านใดที่ DNSSEC ออกแบบมาให้มั่นใจ","ath":["ความสมบูรณ์ (EEX)","การรับรองความถูกต้อง","ความพร้อมใช้งาน","การรักษาความลับ"],"expth":"DNSSEC เป็นส่วนขยายการรักษาความปลอดภัยสำหรับโปรโตคอลและบริการ DNS ปกติที่ช่วยให้สามารถตรวจสอบความถูกต้องของความสมบูรณ์ของการค้นหา DNS ไม่ได้กล่าวถึงการรักษาความลับหรือความพร้อมแต่อย่างใด ช่วยให้ไคลเอนต์ DNS ทำการค้นหา DNS และตรวจสอบทั้งต้นทางและสิทธิ์ผ่านลายเซ็นการเข้ารหัสที่มาพร้อมกับการตอบสนอง DNS"},{"id":110,"q":"Other than cost savings realized due to measured service, what is another facet of cloud computing that will typically save substantial costs in time and money for an organization in the event of a disaster?","a":["Broad network access","Interoperability","Resource pooling","Portability"],"ans":"A","exp":"With a typical BCDR solution, an organization would need some number of staff to quickly travel to the location of the BCDR site to configure systems and applications for recovery. With a cloud environment, everything is done over broad network access, with no need (or even possibility) to travel to a remote site at any time.","qth":"นอกจากการประหยัดต้นทุนจากบริการแบบวัดปริมาณแล้ว แง่มุมใดของการประมวลผลแบบคลาวด์ที่มักช่วยประหยัดเวลาและเงินได้มากเมื่อเกิดภัยพิบัติ","ath":["การเข้าถึงเครือข่ายอย่างกว้างขวาง (Broad network access)","ความสามารถในการทำงานร่วมกัน (Interoperability)","การรวมทรัพยากร (Resource pooling)","ความสามารถในการพกพา/ย้ายระบบ (Portability)"],"expth":"ในแผน BCDR แบบดั้งเดิม องค์กรต้องส่งทีมงานเดินทางไปยังไซต์สำรองเพื่อตั้งค่าระบบ แต่ในระบบคลาวด์ทุกอย่างทำผ่านเครือข่ายที่เข้าถึงได้กว้าง จึงไม่จำเป็นต้องเดินทางไปยังไซต์ระยะไกล"},{"id":111,"q":"Which of the following is NOT part of a retention policy?","a":["Format","Costs","Accessibility","Duration"],"ans":"B","exp":"The data retention policy covers the duration, format, technologies, protection, and accessibility of archives, but does not address the specific costs of its implementation and maintenance.","qth":"ข้อใดต่อไปนี้ไม่เป็นส่วนหนึ่งของนโยบายการเก็บรักษา","ath":["รูปแบบ","ต้นทุน","การเข้าถึง","ระยะเวลา"],"expth":"นโยบายการเก็บรักษาข้อมูลครอบคลุมระยะเวลา รูปแบบ เทคโนโลยี การป้องกัน และการเข้าถึงข้อมูลที่เก็บถาวร แต่ไม่ได้ระบุถึงต้นทุนเฉพาะของการดำเนินการและการบำรุงรักษา"},{"id":112,"q":"Which of the cloud deployment models offers the easiest initial setup and access for the cloud customer?","a":["Hybrid","Community","Private","Public"],"ans":"D","exp":"Because the public cloud model is available to everyone, in most instances all a customer will need to do to gain access is set up an account and provide a credit card number through the service's web portal. No additional contract negotiations, agreements, or specific group memberships are typically needed to get started.","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดที่นำเสนอการตั้งค่าเริ่มต้นและการเข้าถึงที่ง่ายที่สุดสำหรับลูกค้าระบบคลาวด์","ath":["ไฮบริด","ชุมชน","ส่วนตัว","สาธารณะ"],"expth":"เนื่องจากโมเดลคลาวด์สาธารณะพร้อมใช้งานสำหรับทุกคน ในกรณีส่วนใหญ่ ลูกค้าทุกคนจะต้องดำเนินการเพื่อให้ได้รับการเข้าถึงคือการตั้งค่าบัญชีและระบุหมายเลขบัตรเครดิตผ่านทางเว็บพอร์ทัลของบริการ โดยทั่วไปไม่จำเป็นต้องมีการเจรจาสัญญา ข้อตกลง หรือการเป็นสมาชิกกลุ่มเพิ่มเติมใดๆ ในการเริ่มต้น"},{"id":113,"q":"Which of the following is NOT something that an HIDS will monitor?","a":["Configurations","User logins","Critical system files","Network traffic"],"ans":"B","exp":"A host intrusion detection system (HIDS) monitors network traffic as well as critical system files and configurations.","qth":"ข้อใดต่อไปนี้ไม่ใช่สิ่งที่ HIDS จะตรวจสอบ","ath":["การกำหนดค่า","การเข้าสู่ระบบของผู้ใช้","ไฟล์ระบบที่สำคัญ","การรับส่งข้อมูลเครือข่าย"],"expth":"Ahost Intrusion Detection System (HIDS) ตรวจสอบการรับส่งข้อมูลเครือข่ายตลอดจนไฟล์ระบบและการกำหนดค่าที่สำคัญ"},{"id":114,"q":"What concept does the \"A\" represent in the DREAD model?","a":["Affected users","Authentication","Affinity","Authorization"],"ans":"A","exp":"Affected users refers to the percentage of users who would be impacted by a successful exploit. Scoring ranges from 0, which means no users are impacted, to 10, which means all users are impacted.","qth":"แนวคิด \"A\" แสดงถึงแนวคิดใดในโมเดล DREAD?","ath":["ผู้ใช้ที่ได้รับผลกระทบ (EEEXEITD","การตรวจสอบสิทธิ์","Affinity","การให้สิทธิ์"],"expth":"ผู้ใช้ที่ได้รับผลกระทบหมายถึงเปอร์เซ็นต์ของผู้ใช้ที่จะได้รับผลกระทบจากการหาประโยชน์ที่ประสบความสำเร็จ ช่วงการให้คะแนนมีตั้งแต่ 0 ซึ่งหมายความว่าไม่มีผู้ใช้ใดได้รับผลกระทบ ถึง 10 ซึ่งหมายถึง ผู้ใช้ทุกคนได้รับผลกระทบ"},{"id":115,"q":"What does static application security testing (SAST) offer as a tool to the testers?","a":["Production system scanning","Injection attempts","Source code access","Live testing"],"ans":"C","exp":"Static application security testing (SAST) is conducted with knowledge of the system, including source code, and is done against offline systems.","qth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบคงที่ (SAST) ให้อะไรเป็นเครื่องมือสำหรับผู้ทดสอบ","ath":["การสแกนระบบการผลิต","ความพยายามในการฉีด","การเข้าถึงซอร์สโค้ด","การทดสอบแบบสด"],"expth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบคงที่ (SAST) ดำเนินการด้วยความรู้เกี่ยวกับระบบ รวมถึงซอร์สโค้ด และดำเนินการกับระบบออฟไลน์"},{"id":116,"q":"What process is used within a cloud environment to maintain resource balancing and ensure that resources are available where and when needed?","a":["Dynamic clustering","Dynamic balancing","Dynamic resource scheduling","Dynamic optimization"],"ans":"D","exp":"Dynamic optimization is the process through which the cloud environment is constantly maintained to ensure resources are available when and where needed, and that physical nodes do not become overloaded or near capacity, while others are underutilized.","qth":"กระบวนการใดที่ใช้ภายในสภาพแวดล้อมคลาวด์เพื่อรักษาสมดุลของทรัพยากรและรับรองว่าทรัพยากรพร้อมใช้งานทุกที่และทุกเวลาที่จำเป็น","ath":["การจัดกลุ่มแบบไดนามิก","การปรับสมดุลแบบไดนามิก","การจัดกำหนดการทรัพยากรแบบไดนามิก","การปรับให้เหมาะสมแบบไดนามิก"],"expth":"การปรับให้เหมาะสมแบบไดนามิกเป็นกระบวนการที่สภาพแวดล้อมคลาวด์ได้รับการดูแลอย่างต่อเนื่องเพื่อให้แน่ใจว่าทรัพยากรจะพร้อมใช้งานในเวลาและในสถานที่ที่จำเป็น และโหนดทางกายภาพไม่ มีภาระมากเกินไปหรือใกล้จะสามารถรองรับได้ ในขณะที่ส่วนอื่นๆ ใช้งานน้อยเกินไป"},{"id":117,"q":"Which value refers to the percentage of production level restoration needed to meet BCDR objectives?","a":["RPO","RTO","RSL","SRE"],"ans":"C","exp":"The recovery service level (RSL) is a percentage measure of the total typical production service level that needs to be restored to meet BCDR objectives in the case of a failure.","qth":"ค่าใดที่อ้างอิงถึงเปอร์เซ็นต์ของการฟื้นฟูระดับการผลิตที่จำเป็นเพื่อให้บรรลุวัตถุประสงค์ BCDR","ath":["RPO","RTO","RSL","SRE"],"expth":"ระดับบริการกู้คืน (RSL) คือเปอร์เซ็นต์การวัดของระดับบริการการผลิตทั่วไปทั้งหมดที่จำเป็นต้องได้รับการกู้คืนเพื่อให้บรรลุวัตถุประสงค์ BCDR ในกรณีที่เกิดความล้มเหลว"},{"id":118,"q":"Over time, what is a primary concern for data archiving?","a":["Size of archives","Format of archives","Recoverability","Regulatory changes"],"ans":"C","exp":"Over time, maintaining the ability to restore and read archives is a primary concern for data archiving. As technologies change and new systems are brought in, it is imperative for an organization to ensure they are still able to restore and access archives for the duration of the required retention period.","qth":"เมื่อเวลาผ่านไป อะไรคือข้อกังวลหลักสำหรับการจัดเก็บข้อมูลถาวร?","ath":["ขนาดของไฟล์เก็บถาวร","รูปแบบของไฟล์เก็บถาวร","ความสามารถในการกู้คืน","การเปลี่ยนแปลงด้านกฎระเบียบ"],"expth":"เมื่อเวลาผ่านไป การรักษาความสามารถในการกู้คืนและอ่านไฟล์เก็บถาวรถือเป็นข้อกังวลหลักสำหรับการเก็บข้อมูลถาวร เมื่อเทคโนโลยีเปลี่ยนแปลงและระบบใหม่ๆ เข้ามา องค์กรจึงจำเป็นต้องตรวจสอบให้แน่ใจว่ายังคงสามารถกู้คืนและเข้าถึงไฟล์เก็บถาวรได้ตลอดระยะเวลาการเก็บรักษาที่กำหนด"},{"id":119,"q":"What is an often overlooked concept that is essential to protecting the confidentiality of data?","a":["Strong password","Training","Security controls","Policies"],"ans":"B","exp":"While the main focus of confidentiality revolves around technological requirements or particular security methods, an important and often overlooked aspect of safeguarding data confidentiality is appropriate and comprehensive training for those with access to it. Training should be focused on the safe handling of sensitive information overall, including best practices for network activities as well as physical security of the devices or workstations used to access the application.","qth":"แนวคิดที่มักถูกมองข้ามซึ่งจำเป็นต่อการปกป้องความลับของข้อมูลคืออะไร","ath":["รหัสผ่านที่รัดกุม","การฝึกอบรม","การควบคุมความปลอดภัย","นโยบาย"],"expth":"ในขณะที่จุดสนใจหลักของการรักษาความลับนั้นเกี่ยวข้องกับข้อกำหนดทางเทคโนโลยีหรือวิธีการรักษาความปลอดภัยโดยเฉพาะ แต่แง่มุมที่สำคัญและมักถูกมองข้ามในการปกป้องการรักษาความลับของข้อมูลนั้นเป็นการฝึกอบรมที่เหมาะสมและครอบคลุมสำหรับผู้ที่สามารถเข้าถึงข้อมูลได้ การฝึกอบรมควรมุ่งเน้นไปที่การจัดการข้อมูลที่ละเอียดอ่อนโดยรวมอย่างปลอดภัย รวมถึงแนวทางปฏิบัติที่ดีที่สุดสำหรับกิจกรรมเครือข่าย เช่นเดียวกับความปลอดภัยทางกายภาพของอุปกรณ์หรือเวิร์กสเตชันที่ใช้ในการเข้าถึงแอปพลิเคชัน"},{"id":120,"q":"Which of the cloud deployment models offers the most control and input to the cloud customer as to how the overall cloud environment is implemented and configured?","a":["Public","Community","Hybrid","Private"],"ans":"D","exp":"A private cloud model, and the specific contractual relationships involved, will give a cloud customer the most level of input and control over how the overall cloud environment is designed and implemented. This would be even more so in cases where the private cloud is owned and operated by the same organization that is hosting services within it.","qth":"โมเดลการใช้งานคลาวด์ใดที่ให้การควบคุมและการป้อนข้อมูลแก่ลูกค้าคลาวด์มากที่สุดเกี่ยวกับวิธีการใช้งานและกำหนดค่าสภาพแวดล้อมคลาวด์โดยรวม","ath":["สาธารณะ","ชุมชน","ไฮบริด","ส่วนตัว"],"expth":"โมเดลคลาวด์ส่วนตัวและความสัมพันธ์ตามสัญญาเฉพาะที่เกี่ยวข้อง จะทำให้ลูกค้าคลาวด์ได้รับข้อมูลและควบคุมวิธีการออกแบบและใช้งานสภาพแวดล้อมคลาวด์โดยรวมในระดับสูงสุด ซึ่งจะยิ่งมากกว่านี้ในกรณีที่ระบบคลาวด์ส่วนตัวเป็นเจ้าของและดำเนินการโดยองค์กรเดียวกันกับที่โฮสต์บริการภายในระบบ"},{"id":121,"q":"Your boss has tasked your team with getting your legacy systems and applications connected with new cloud-based services that management has decided are crucial to customer service and offerings. Which role would you be assuming under this directive?","a":["Cloud service administrator","Cloud service user","Cloud service integrator","Cloud service business manager"],"ans":"C","exp":"The cloud service integrator role is responsible for connecting and integrating existing services and applications with cloud-based services.A cloud service administrator is responsible for testing, monitoring, and securing cloud services, as well as providing usage reporting and dealing with service problems. The cloud service user is someone who consumes cloud services. The cloud service business manager is responsible for overseeing the billing, auditing, and purchasing of cloud services.","qth":"หัวหน้าของคุณมอบหมายให้ทีมของคุณเชื่อมต่อระบบและแอปพลิเคชันเดิมของคุณเข้ากับบริการบนคลาวด์ใหม่ที่ฝ่ายบริหารตัดสินใจว่ามีความสำคัญต่อการบริการลูกค้าและข้อเสนอ คุณจะรับบทบาทใดภายใต้คำสั่งนี้","ath":["ผู้ดูแลระบบบริการคลาวด์","ผู้ใช้บริการคลาวด์","ผู้รวมบริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์"],"expth":"บทบาทผู้รวมบริการคลาวด์มีหน้าที่รับผิดชอบในการเชื่อมต่อและรวมบริการและแอปพลิเคชันที่มีอยู่เข้ากับบริการบนคลาวด์ ผู้ดูแลระบบบริการคลาวด์มีหน้าที่ทดสอบ ตรวจสอบ และรักษาความปลอดภัยบริการคลาวด์ รวมถึงจัดทำรายงานการใช้งานและจัดการกับปัญหาการบริการ ผู้ใช้บริการคลาวด์คือบุคคลที่ใช้บริการคลาวด์ ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่ดูแลการเรียกเก็บเงิน การตรวจสอบ และการจัดซื้อบริการคลาวด์"},{"id":122,"q":"One of the main components of system audits is the ability to track changes over time and to match these changes with continued compliance and internal processes. Which aspect of cloud computing makes this particular component more challenging than in a traditional data center?","a":["Portability","Virtualization","Elasticity","Resource pooling"],"ans":"B","exp":"Cloud services make exclusive use of virtualization, and systems change over time, including the addition, subtraction, and reimaging of virtual machines. It is extremely unlikely that the exact same virtual machines and images used in a previous audit would still be in use or even available for a later audit, making the tracking of changes over time extremely difficult, or even impossible. Elasticity refers to the ability to add and remove resources from a system or service to meet current demand, and although it plays a factor in making the tracking of virtual machines very difficult over time, it is not the best answer in this case. Resource pooling pertains to a cloud environment sharing a large amount of resources between different customers and services. Portability refers to the ability to move systems or services easily between different cloud providers.","qth":"หนึ่งในองค์ประกอบหลักของการตรวจสอบระบบคือความสามารถในการติดตามการเปลี่ยนแปลงเมื่อเวลาผ่านไปและเพื่อให้ตรงกับการเปลี่ยนแปลงเหล่านี้กับการปฏิบัติตามข้อกำหนดและกระบวนการภายในอย่างต่อเนื่อง แง่มุมใดของการประมวลผลแบบคลาวด์ที่ทำให้องค์ประกอบเฉพาะนี้มีความท้าทายมากกว่าในศูนย์ข้อมูลแบบเดิม","ath":["การพกพา","การจำลองเสมือน","ความยืดหยุ่น","การรวมทรัพยากร"],"expth":"บริการคลาวด์ใช้งานการจำลองเสมือนโดยเฉพาะ และระบบจะเปลี่ยนแปลงไปตามกาลเวลา รวมถึงส่วนเพิ่มเติม การลบและการจำลองเครื่องเสมือนใหม่ ไม่น่าเป็นไปได้อย่างยิ่งที่เครื่องเสมือนและรูปภาพที่ใช้ในการตรวจสอบครั้งก่อนจะยังคงถูกใช้งานหรือพร้อมสำหรับการตรวจสอบในภายหลัง ทำให้การติดตามการเปลี่ยนแปลงเมื่อเวลาผ่านไปเป็นเรื่องยากอย่างยิ่งหรือเป็นไปไม่ได้เลย ความยืดหยุ่นหมายถึงความสามารถในการเพิ่มและลบทรัพยากรออกจากระบบหรือบริการเพื่อตอบสนองความต้องการในปัจจุบัน และถึงแม้จะมีปัจจัยที่ทำให้การติดตามเครื่องเสมือนเป็นเรื่องยากมากเมื่อเวลาผ่านไป แต่ก็ไม่ใช่คำตอบที่ดีที่สุดในกรณีนี้ การรวมทรัพยากรเกี่ยวข้องกับสภาพแวดล้อมคลาวด์ที่แบ่งปันทรัพยากรจำนวนมากระหว่างลูกค้าและบริการที่แตกต่างกัน การพกพาหมายถึงความสามารถ"},{"id":123,"q":"In the wake of many scandals with major corporations involving fraud and the deception of investors and regulators, which of the following laws was passed to govern accounting and financial records and disclosures?","a":["GLBA","Safe Harbor","HIPAA","SOX"],"ans":"D","exp":"The Sarbanes-Oxley Act (SOX) regulates the financial and accounting practices used by organizations in order to protect shareholders from improper practices and accounting errors.The Health Insurance Portability and Accountability Act (HIPAA) pertains to the protection of patient medical records and privacy. The Gramm-Leach-Bliley Act (GLBA) focuses on the use of PII within financial institutions. The Safe Harbor program was designed by the US government as a way for American companies to comply with European Union privacy laws.","qth":"หลังจากเกิดเรื่องอื้อฉาวจำนวนมากกับบริษัทใหญ่ ๆ ที่เกี่ยวข้องกับการฉ้อโกงและการหลอกลวงนักลงทุนและหน่วยงานกำกับดูแล กฎหมายใดต่อไปนี้ที่ผ่านเพื่อควบคุมบันทึกทางบัญชีและการเงินและการเปิดเผยข้อมูล","ath":["GLBA","Safe Harbor","HIPAA","sox"],"expth":"กฎหมาย Sarbanes-Oxley (SOX) ควบคุมแนวทางปฏิบัติทางการเงินและการบัญชีที่องค์กรใช้เพื่อปกป้องผู้ถือหุ้นจาก การปฏิบัติที่ไม่เหมาะสมและข้อผิดพลาดทางบัญชี กฎหมาย Health Insurance Portability and Accountability Act (HIPAA) เกี่ยวข้องกับการคุ้มครองเวชระเบียนของผู้ป่วยและความเป็นส่วนตัว พระราชบัญญัติ Gramm-Leach-Blley (GLBA) มุ่งเน้นไปที่การใช้ Pll ภายในสถาบันการเงิน โครงการ Safe Harbor ได้รับการออกแบบโดยรัฐบาลสหรัฐฯ เพื่อเป็นแนวทางสำหรับบริษัทอเมริกันในการปฏิบัติตามกฎหมายความเป็นส่วนตัวของสหภาพยุโรป"},{"id":124,"q":"Which one of the following threat types to applications and services involves the sending of requests that are invalid and manipulated through a user's client to execute commands on the application under the user's own credentials?","a":["Injection","Missing function-level access control","Cross-site scripting","Cross-site request forgery"],"ans":"D","exp":"A cross-site request forgery (CSRF) attack forces a client that a user has used to authenticate to an application to send forged requests under the user's own credentials to execute commands and requests that the application thinks are coming from a trusted client and user. Although this type of attack cannot be used to steal data directly because the attacker has no way of seeing the results of the commands, it does open other ways to compromise an application. Missing function-level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call. Cross-site scripting occurs when an attacker is able to send untrusted data to a user's browser without going through validation processes. An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part of its normal processing and queries.","qth":"ภัยคุกคามประเภทใดประเภทหนึ่งต่อแอปพลิเคชันและบริการต่อไปนี้เกี่ยวข้องกับการส่งคำขอที่ไม่ถูกต้องและจัดการผ่านไคลเอนต์ของผู้ใช้เพื่อรันคำสั่งบนแอปพลิเคชันภายใต้ข้อมูลประจำตัวของผู้ใช้เอง","ath":["การฉีด","การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การเขียนสคริปต์ข้ามไซต์","การปลอมแปลงคำขอข้ามไซต์"],"expth":"A ctoss-site การโจมตี request forgery (CSRF) บังคับให้ไคลเอ็นต์ที่ผู้ใช้ใช้ในการตรวจสอบแอปพลิเคชันเพื่อส่งคำขอปลอมแปลงภายใต้ข้อมูลประจำตัวของผู้ใช้เองเพื่อดำเนินการคำสั่งและคำขอที่แอปพลิเคชันคิดว่ามาจากไคลเอ็นต์และผู้ใช้ที่เชื่อถือได้ แม้ว่าการโจมตีประเภทนี้จะไม่สามารถใช้เพื่อขโมยข้อมูลได้โดยตรง เนื่องจากผู้โจมตีไม่มีทางเห็นผลลัพธ์ของคำสั่งได้ แต่ก็เปิดช่องทางอื่นในการประนีประนอมแอปพลิเคชัน การควบคุมการเข้าถึงระดับฟังก์ชันหายไปโดยที่แอปพลิเคชันตรวจสอบการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบเริ่มต้นเท่านั้น และไม่ได้ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การเขียนสคริปต์ข้ามไซต์เกิดขึ้นเมื่อผู้โจมตีสามารถส่งข้อมูลที่ไม่น่าเชื่อถือไปยังเบราว์เซอร์ของผู้ใช้โดยไม่ต้องผ่านกระบวนการตรวจสอบ การฉีด"},{"id":125,"q":"Which cloud service category would be most ideal for a cloud customer that is developing software to test its applications among multiple hosting providers to determine the best option for its needs?","a":["DaaS","PaaS","IaaS","SaaS"],"ans":"B","exp":"Platform as a Service would allow software developers to quickly and easily deploy their applications among different hosting providers for testing and validation in order to determine the best option. Although IaaS would also be appropriate for hosting applications, it would require too much configuration of application servers and libraries in order to test code. Conversely, PaaS would provide a ready-to-use environment from the onset. DaaS would not be appropriate in any way for software developers to use to deploy applications. IaaS would not be appropriate in this scenario because it would require the developers to also deploy and maintain the operating system images or to contract with another firm to do so. SaaS, being a fully functional software platform, would not be appropriate for deploying applications into.","qth":"หมวดบริการคลาวด์ใดเหมาะที่สุดเมื่อลูกค้าต้องการทดสอบแอปกับผู้ให้บริการโฮสต์หลายราย","ath":["DaaS","PaaS","IaaS","SaaS"],"expth":"PaaS ให้ผู้พัฒนาดีพลอยแอปไปทดสอบบนผู้ให้บริการต่าง ๆ ได้เร็ว"},{"id":126,"q":"Where is a DLP solution generally installed when utilized for monitoring data at rest?","a":["Network firewall","Host system","Application server","Database server"],"ans":"B","exp":"To monitor data at rest appropriately, the DLP solution would be installed on the host system where the data resides. A database server, in some situations, may be an appropriate answer, but the host system is the best answer because a database server is only one example of where data could reside. An application server processes data and typically sits between the data and presentation zones, and as such, does not store data at rest. A network firewall would be more appropriate for data in transit because it is not a place where data would reside.","qth":"โดยทั่วไปโซลูชัน DLP จะติดตั้งไว้ที่ใดเมื่อใช้สำหรับการตรวจสอบข้อมูลที่เหลือ","ath":["ไฟร์วอลล์เครือข่าย","ระบบโฮสต์","เซิร์ฟเวอร์แอปพลิเคชัน","เซิร์ฟเวอร์ฐานข้อมูล"],"expth":"ในการตรวจสอบข้อมูลที่เหลืออย่างเหมาะสม โซลูชัน DLP จะถูกติดตั้งบนระบบโฮสต์ที่มีข้อมูลอยู่ ในบางสถานการณ์ เซิร์ฟเวอร์ฐานข้อมูลอาจเป็นคำตอบที่เหมาะสม แต่ระบบโฮสต์คือคำตอบที่ดีที่สุด เนื่องจากเซิร์ฟเวอร์ฐานข้อมูลเป็นเพียงตัวอย่างหนึ่งของตำแหน่งข้อมูลที่อาจมีอยู่ แอปพลิเคชันเซิร์ฟเวอร์จะประมวลผลข้อมูลและโดยทั่วไปจะอยู่ระหว่างข้อมูลและโซนการนำเสนอ ด้วยเหตุนี้จึงไม่จัดเก็บข้อมูลที่อยู่นิ่ง ไฟร์วอลล์เครือข่ายจะเหมาะสมกว่าสำหรับข้อมูลที่อยู่ระหว่างทางเนื่องจากไม่ใช่ที่ที่ข้อมูลจะอยู่"},{"id":127,"q":"Which of the following aspects of security is solely the responsibility of the cloud provider?","a":["Regulatory compliance","Physical security","Operating system auditing","Personal security of developers"],"ans":"B","exp":"Regardless of the particular cloud service used, physical security of hardware and facilities is always the sole responsibility of the cloud provider. The cloud provider may release information about their physical security policies and procedures to ensure any particular requirements of potential customers will meet their regulatory obligations. Personal security of developers and regulatory compliance are always the responsibility of the cloud customer. Responsibility for operating systems, and the auditing of them, will differ based on the cloud service category used.","qth":"ความปลอดภัยด้านใดต่อไปนี้เป็นความรับผิดชอบของผู้ให้บริการคลาวด์แต่เพียงผู้เดียว","ath":["การปฏิบัติตามกฎระเบียบ","ความปลอดภัยทางกายภาพ","การตรวจสอบระบบปฏิบัติการ","ความปลอดภัยส่วนบุคคลของนักพัฒนา"],"expth":"ไม่ว่าบริการคลาวด์ที่ใช้โดยเฉพาะ การรักษาความปลอดภัยทางกายภาพของฮาร์ดแวร์และสิ่งอำนวยความสะดวกจะเป็นความรับผิดชอบของผู้ให้บริการคลาวด์แต่เพียงผู้เดียวเสมอ ผู้ให้บริการระบบคลาวด์อาจเปิดเผยข้อมูลเกี่ยวกับนโยบายและขั้นตอนด้านความปลอดภัยทางกายภาพเพื่อให้แน่ใจว่าข้อกำหนดเฉพาะของผู้มีโอกาสเป็นลูกค้าจะเป็นไปตามภาระผูกพันด้านกฎระเบียบของพวกเขา ความปลอดภัยส่วนบุคคลของนักพัฒนาและการปฏิบัติตามกฎระเบียบถือเป็นความรับผิดชอบของลูกค้าระบบคลาวด์เสมอ ความรับผิดชอบสำหรับระบบปฏิบัติการและการตรวจสอบจะแตกต่างกันไปตามหมวดหมู่บริการคลาวด์ที่ใช้"},{"id":128,"q":"Humidity levels for a data center are a prime concern for maintaining electrical and computing resources properly as well as ensuring that conditions are optimal for top performance. Which of the following is the optimal humidity level, as established by ASHRAE?","a":["20 to 40 percent relative humidity","50 to 75 percent relative humidity","40 to 60 percent relative humidity","30 to 50 percent relative humidity"],"ans":"C","exp":"The American Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE) recommends 40 to 60 percent relatively humidity for data centers. None of these options is the recommendation from ASHRAE.","qth":"ช่วงความชื้นในศูนย์ข้อมูลที่มักถูกแนะนำเพื่อรักษาอุปกรณ์ไฟฟ้าและคอมพิวเตอร์คือเท่าใด","ath":["ความชื้นสัมพัทธ์ 20–40%","ความชื้นสัมพัทธ์ 50–75%","ความชื้นสัมพัทธ์ 40–60%","ความชื้นสัมพัทธ์ 30–50%"],"expth":"ASHRAE แนะนำความชื้นสัมพัทธ์ประมาณ 40–60% สำหรับศูนย์ข้อมูล"},{"id":129,"q":"Within a SaaS environment, what is the responsibility on the part of the cloud customer in regard to procuring the software used?","a":["Maintenance","Licensing","Development","Purchasing"],"ans":"B","exp":"Within a SaaS implementation, the cloud customer licenses the use of the software from the cloud provider because SaaS delivers a fully functional application to the customer. With SaaS, the cloud provider is responsible for the entire software application and any necessary infrastructure to develop, run, and maintain it. The purchasing, development, and maintenance are fully the responsibility of the cloud provider.","qth":"ภายในสภาพแวดล้อม SaaS ลูกค้าคลาวด์มีความรับผิดชอบอะไรในการจัดหาซอฟต์แวร์ที่ใช้","ath":["การบำรุงรักษา","การออกใบอนุญาต","การพัฒนา","การจัดซื้อ"],"expth":"ภายในการใช้งาน SaaS ลูกค้าคลาวด์จะออกใบอนุญาตการใช้ซอฟต์แวร์จากผู้ให้บริการคลาวด์ เนื่องจาก SaaS มอบแอปพลิเคชันที่ทำงานได้อย่างสมบูรณ์ให้กับลูกค้า ด้วย SaaS ผู้ให้บริการคลาวด์จะรับผิดชอบแอปพลิเคชันซอฟต์แวร์ทั้งหมดและโครงสร้างพื้นฐานที่จำเป็นในการพัฒนา ใช้งาน และบำรุงรักษา การจัดซื้อ การพัฒนา และการบำรุงรักษาถือเป็นความรับผิดชอบของผู้ให้บริการคลาวด์อย่างเต็มที่"},{"id":130,"q":"Implementing baselines on systems would take an enormous amount of time and resources if the staff had to apply them to each server, and over time, it would be almost impossible to keep all the systems in sync on an ongoing basis. Which of the following is NOT a package that can be used for implementing and maintaining baselines across an enterprise?","a":["Puppet","SCCM","Chef","GitHub"],"ans":"D","exp":"GitHub is a software development platform that serves as a code repository and versioning system. It is solely used for software development and would not be appropriate for applying baselines to systems. Puppet is an open-source configuration management tool that runs on many platforms and can be used to apply and maintain baselines. The Software Center Configuration Manager (SCCM) was developed by Microsoft for managing systems across large groups of servers. Chef is also a system for maintaining large groups of systems throughout an enterprise.","qth":"การนำพื้นฐานไปใช้ในระบบจะต้องใช้เวลาและทรัพยากรจำนวนมหาศาลหากพนักงานต้องนำไปใช้กับเซิร์ฟเวอร์แต่ละเครื่อง และเมื่อเวลาผ่านไป แทบเป็นไปไม่ได้เลยที่จะซิงค์ระบบทั้งหมดอย่างต่อเนื่องอย่างต่อเนื่อง ข้อใดต่อไปนี้ไม่ใช่แพ็คเกจที่สามารถนำมาใช้สำหรับการดำเนินการและบำรุงรักษาพื้นฐานทั่วทั้งองค์กร","ath":["หุ่นเชิด","สคซีเอ็ม","เชฟ","GitHub"],"expth":"GitHub เป็นแพลตฟอร์มการพัฒนาซอฟต์แวร์ที่ทำหน้าที่เป็นที่เก็บโค้ดและระบบการกำหนดเวอร์ชัน ใช้สำหรับการพัฒนาซอฟต์แวร์เท่านั้น และไม่เหมาะสมสำหรับการประยุกต์ใช้พื้นฐานกับระบบ Puppet เป็นเครื่องมือการจัดการการกำหนดค่าแบบโอเพ่นซอร์สที่ทำงานบนหลายแพลตฟอร์ม และสามารถใช้เพื่อนำไปใช้และรักษาพื้นฐานได้ Software Center Configuration Manager (SCCM) ได้รับการพัฒนาโดย Microsoft สำหรับการจัดการระบบข้ามเซิร์ฟเวอร์กลุ่มใหญ่ นอกจากนี้ Chef ยังเป็นระบบสำหรับบำรุงรักษาระบบกลุ่มใหญ่ทั่วทั้งองค์กร"},{"id":131,"q":"From the perspective of compliance, what is the most important consideration when it comes to data center location?","a":["Natural disasters","Utility access","Jurisdiction","Personnel access"],"ans":"C","exp":"Jurisdiction will dictate much of the compliance and audit requirements for a data center. Although all the aspects listed are very important to security, from a strict compliance perspective, jurisdiction is the most important. Personnel access, natural disasters, and utility access are all important operational considerations for selecting a data center location, but they are not related to compliance issues like jurisdiction is.","qth":"จากมุมมองของการปฏิบัติตามข้อกำหนด ข้อพิจารณาที่สำคัญที่สุดเมื่อพูดถึงที่ตั้งศูนย์ข้อมูลคืออะไร","ath":["ภัยธรรมชาติ","การเข้าถึงสาธารณูปโภค","เขตอำนาจศาล","การเข้าถึงบุคลากร"],"expth":"เขตอำนาจศาลจะกำหนดข้อกำหนดส่วนใหญ่ในการปฏิบัติตามข้อกำหนดและการตรวจสอบสำหรับศูนย์ข้อมูล แม้ว่าทุกประเด็นที่ระบุไว้จะมีความสำคัญมากต่อการรักษาความปลอดภัย แต่จากมุมมองของการปฏิบัติตามข้อกำหนดที่เข้มงวด เขตอำนาจศาลก็มีความสำคัญที่สุด การเข้าถึงบุคลากร ภัยพิบัติทางธรรมชาติ และการเข้าถึงสาธารณูปโภค ล้วนเป็นข้อพิจารณาในการปฏิบัติงานที่สำคัญในการเลือกที่ตั้งศูนย์ข้อมูล แต่ไม่เกี่ยวข้องกับปัญหาการปฏิบัติตามกฎระเบียบ เช่น เขตอำนาจศาล"},{"id":132,"q":"The European Union is often considered the world leader in regard to the privacy of personal data and has declared privacy to be a \"human right.\" In what year did the EU first assert this principle?","a":["1995","2000","2010","1999"],"ans":"A","exp":"The EU passed Directive 95/46 EC in 1995, which established data privacy as a human right. The other years listed are incorrect.","qth":"สหภาพยุโรปมักถูกมองว่าเป็นผู้นำระดับโลกในด้านความเป็นส่วนตัวของข้อมูลส่วนบุคคล และได้ประกาศให้ความเป็นส่วนตัวเป็น “สิทธิมนุษยชน” ในปีใดที่สหภาพยุโรปยืนยันหลักการนี้เป็นครั้งแรก","ath":["1995,","2000","2010","1999"],"expth":"สหภาพยุโรปผ่าน Directive 95/46 EC ในปี 1995 ซึ่งกำหนดความเป็นส่วนตัวของข้อมูล เป็นสิทธิมนุษยชน ปีอื่นๆ ที่แสดงไว้ไม่ถูกต้อง"},{"id":133,"q":"What type of storage structure does object storage employ to maintain files?","a":["Directory","Hierarchical","tree","Flat"],"ans":"D","exp":"Object storage uses a flat file system to hold storage objects; it assigns files a key value that is then used to access them, rather than relying on directories or descriptive filenames. Typical storage layouts such as tree, directory, and hierarchical structures are used within volume storage, whereas object storage maintains a flat structure with key values.","qth":"โครงสร้างหน่วยเก็บข้อมูลประเภทใดที่หน่วยเก็บข้อมูลอ็อบเจ็กต์ใช้เพื่อรักษาไฟล์?","ath":["ไดเร็กทอรี","ลำดับชั้น","แผนผัง","แฟลต"],"expth":"หน่วยเก็บข้อมูลอ็อบเจ็กต์ใช้ระบบไฟล์แบบแฟลตเพื่อเก็บอ็อบเจ็กต์หน่วยเก็บข้อมูล โดยจะกำหนดค่าคีย์ให้กับไฟล์ที่จะใช้ในการเข้าถึง แทนที่จะอาศัยไดเร็กทอรีหรือชื่อไฟล์ที่สื่อความหมาย เค้าโครงพื้นที่จัดเก็บข้อมูลทั่วไป เช่น แผนภูมิ ไดเร็กทอรี และโครงสร้างลำดับชั้นจะใช้ภายในพื้นที่จัดเก็บวอลุ่ม ในขณะที่พื้นที่จัดเก็บอ็อบเจ็กต์จะรักษาโครงสร้างเรียบๆ ที่มีค่าคีย์"},{"id":134,"q":"Which cloud storage type requires special consideration on the part of the cloud customer to ensure they do not program themselves into a vendor lock-in situation?","a":["Unstructured","Object","Volume","Structured"],"ans":"D","exp":"Structured storage is designed, maintained, and implemented by a cloud service provider as part of a PaaS offering. It is specific to that cloud provider and the way they have opted to implement systems, so special care is required to ensure that applications are not designed in a way that will lock the cloud customer into a specific cloud provider with that dependency. Unstructured storage for auxiliary files would not lock a customer into a specific provider. With volume and object storage, because the cloud customer maintains their own systems with IaaS, moving and replicating to a different cloud provider would be very easy.","qth":"ที่เก็บข้อมูลบนคลาวด์ประเภทใดที่ต้องพิจารณาเป็นพิเศษจากลูกค้าคลาวด์ เพื่อให้แน่ใจว่าพวกเขาไม่ได้ตั้งโปรแกรมตัวเองให้อยู่ในสถานการณ์ที่ผู้ขายล็อคอิน","ath":["ไม่มีโครงสร้าง","วัตถุ","ปริมาณ","ไม่มีโครงสร้าง"],"expth":"พื้นที่จัดเก็บข้อมูลที่มีโครงสร้างได้รับการออกแบบ ดูแลรักษา และนำไปใช้โดยผู้ให้บริการระบบคลาวด์ โดยเป็นส่วนหนึ่งของข้อเสนอ PaaS เป็นเรื่องเฉพาะเจาะจงสำหรับผู้ให้บริการคลาวด์รายนั้นและวิธีการที่พวกเขาเลือกใช้ระบบ ดังนั้นจึงจำเป็นต้องมีการดูแลเป็นพิเศษเพื่อให้แน่ใจว่าแอปพลิเคชันไม่ได้ได้รับการออกแบบในลักษณะที่จะล็อคลูกค้าคลาวด์เข้ากับผู้ให้บริการคลาวด์รายใดรายหนึ่งที่มีการพึ่งพานั้น พื้นที่จัดเก็บข้อมูลที่ไม่มีโครงสร้างสำหรับไฟล์เสริมจะไม่ล็อคลูกค้าเข้ากับผู้ให้บริการรายใดรายหนึ่ง ด้วยพื้นที่จัดเก็บปริมาณและอ็อบเจ็กต์ เนื่องจากลูกค้าคลาวด์ดูแลรักษาระบบของตนเองด้วย laaS การย้ายและการจำลองไปยังผู้ให้บริการคลาวด์รายอื่นจึงเป็นเรื่องง่ายมาก"},{"id":135,"q":"Which cloud deployment model would be ideal for a group of universities looking to work together, where each university can gain benefits according to its specific needs?","a":["Private","Public","Hybrid","Community"],"ans":"D","exp":"A community cloud is owned and maintained by similar organizations working toward a common goal. In this case, the universities would all have very similar needs and calendar requirements, and they would not be financial competitors of each other. Therefore, this would be an ideal group for working together within a community cloud. A public cloud model would not work in this scenario because it is designed to serve the largest number of customers, would not likely be targeted toward specific requirements for individual customers, and would not be willing to make changes for them. A private cloud could accommodate such needs, but would not meet the criteria for a group working together, and a hybrid cloud spanning multiple cloud providers would not fit the specifics of the question.","qth":"โมเดลการติดตั้งคลาวด์ใดเหมาะกับกลุ่มมหาวิทยาลัยที่ร่วมใช้บริการตามความต้องการของแต่ละแห่ง","ath":["ส่วนตัว (Private)","สาธารณะ (Public)","ลูกผสม (Hybrid)","ชุมชน (Community)"],"expth":"Community cloud เป็นขององค์กรที่มีเป้าหมายคล้ายกัน มหาวิทยาลัยจึงเหมาะกับโมเดลนี้"},{"id":136,"q":"Which of the following threat types involves an application that does not validate authorization for portions of itself beyond when the user first enters it?","a":["Cross-site request forgery","Missing function-level access control","Injection","Cross-site scripting"],"ans":"B","exp":"It is imperative that applications do checks when each function or portion of the application is accessed to ensure that the user is properly authorized. Without continual checks each time a function is accessed, an attacker could forge requests to access portions of the application where authorization has not been granted. An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part of its normal processing and queries. Cross-site scripting occurs when an attacker is able to send untrusted data to a user's browser without going through validation processes. Cross-site request forgery occurs when an attack forces an authenticated user to send forged requests to an application running under their own access and credentials.","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับแอปพลิเคชันที่ไม่ตรวจสอบการอนุญาตสำหรับส่วนของตัวเองหลังจากการตรวจสอบครั้งแรก","ath":["การปลอมแปลงคำขอข้ามไซต์","การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การฉีด","การเขียนสคริปต์ข้ามไซต์"],"expth":"จำเป็นที่แอปพลิเคชันจะต้องตรวจสอบเมื่อมีการเข้าถึงแต่ละฟังก์ชันหรือส่วนของแอปพลิเคชัน เพื่อให้แน่ใจว่าผู้ใช้ ได้รับอนุญาตให้เข้าถึงอย่างถูกต้อง หากไม่มีการตรวจสอบอย่างต่อเนื่องในแต่ละครั้งที่มีการเข้าถึงฟังก์ชัน ผู้โจมตีสามารถปลอมแปลงคำขอเพื่อเข้าถึงบางส่วนของแอปพลิเคชันที่ไม่ได้รับการอนุญาต"},{"id":137,"q":"Clustered systems can be used to ensure high availability and load balancing across individual systems through a variety of methodologies. What process is used within a clustered system to ensure proper load balancing and to maintain the health of the overall system to provide high availability?","a":["Distributed clustering","Distributed balancing","Distributed optimization","Distributed resource scheduling"],"ans":"D","exp":"Distributed resource scheduling (DRS) is used within all clustered systems as the method for providing high availability, scaling, management, workload distribution, and the balancing of jobs and processes. None of the other choices is the correct term in this case.","qth":"กระบวนการใดในระบบคลัสเตอร์ใช้เพื่อจัดสรรทรัพยากรให้สมดุลและรักษาความพร้อมใช้","ath":["Distributed clustering","Distributed balancing","Distributed optimization","Distributed resource scheduling"],"expth":"Distributed resource scheduling (DRS) ใช้ในระบบคลัสเตอร์เพื่อความพร้อมใช้ การขยายตัว และการกระจายภาระงาน"},{"id":138,"q":"Although the REST API supports a wide variety of data formats for communications and exchange, which data formats are the most commonly used?","a":["SAML and HTML","XML and SAML","XML and JSON","JSON and SAML"],"ans":"C","exp":"JavaScript Object Notation (JSON) and Extensible Markup Language (XML) are the most commonly used data formats for the Representational State Transfer (REST) API and are typically implemented with caching for increased scalability and performance. Extensible Markup Language (XML) and Security Assertion Markup Language (SAML) are both standards for exchanging encoded data between two parties, with XML being for more general use and SAML focused on authentication and authorization data. HTML is used for authoring web pages for consumption by web browsers","qth":"แม้ว่า REST API จะรองรับรูปแบบข้อมูลที่หลากหลายสำหรับการสื่อสารและการแลกเปลี่ยน รูปแบบข้อมูลใดที่ใช้บ่อยที่สุด?","ath":["SAML และ HTML","XML และ SAML","XML และ JSON","JSON และ SAML"],"expth":"JavaScript Object Notation (JSON) และ Extensible Markup Language (XML) เป็นรูปแบบข้อมูลที่ใช้บ่อยที่สุดสำหรับ Representational State Transfer (REST) API และโดยทั่วไปจะใช้งานพร้อมกับแคชเพื่อเพิ่มความสามารถในการปรับขนาดและประสิทธิภาพ Extensible Markup Language (XML) และ Security Assertion Markup Language (SAML) เป็นทั้งมาตรฐานสำหรับการแลกเปลี่ยนข้อมูลที่เข้ารหัสระหว่างสองฝ่าย โดยที่ XML นั้นมีไว้สำหรับการใช้งานทั่วไปมากกว่า และ SAML จะเน้นไปที่ข้อมูลการตรวจสอบสิทธิ์และการอนุญาต HTML ใช้สำหรับการเขียนหน้าเว็บเพื่อให้เว็บเบราว์เซอร์ใช้งาน"},{"id":139,"q":"The share phase of the cloud data lifecycle involves allowing data to leave the application, to be shared with external systems, services, or even other vendors/ contractors. What technology would be useful for protecting data at this point?","a":["IDS","DLP","IPS","WAF"],"ans":"B","exp":"Data loss prevention (DLP) solutions allow for control of data outside of the application or original system. They can enforce granular control such as printing, copying, and being read by others, as well as forcing expiration of access. Intrusion detection system (IDS) and intrusion prevention system (IPS) solutions are used for detecting and blocking suspicious and malicious traffic, respectively, whereas a web application firewall (WAF) is used for enforcing security or other controls on web-based applications.","qth":"ระยะการแบ่งปันของวงจรการใช้งานข้อมูลบนคลาวด์เกี่ยวข้องกับการอนุญาตให้ข้อมูลออกจากแอปพลิเคชัน เพื่อแบ่งปันกับระบบภายนอก บริการ หรือแม้แต่ผู้จำหน่าย/ผู้รับเหมารายอื่น เทคโนโลยีใดที่จะเป็นประโยชน์ในการปกป้องข้อมูล ณ จุดนี้? เอดส์","ath":["IDS (ระบบตรวจจับการบุกรุก)","ดีแอลพี","ไอพีเอส","วัฟ"],"expth":"โซลูชันการป้องกันข้อมูลสูญหาย (DLP) ช่วยให้สามารถควบคุมข้อมูลภายนอกแอปพลิเคชันหรือระบบดั้งเดิมได้ พวกเขาสามารถบังคับใช้การควบคุมโดยละเอียด เช่น การพิมพ์ การคัดลอก และการอ่านโดยผู้อื่น รวมถึงการบังคับให้การเข้าถึงหมดอายุ โซลูชันระบบตรวจจับการบุกรุก (IDS) และระบบป้องกันการบุกรุก (IPS) ใช้สำหรับตรวจจับและบล็อกการรับส่งข้อมูลที่น่าสงสัยและเป็นอันตราย ตามลำดับ ในขณะที่ไฟร์วอลล์แอปพลิเคชันเว็บ (WAF) ใช้เพื่อบังคับใช้ความปลอดภัยหรือการควบคุมอื่นๆ บนแอปพลิเคชันบนเว็บ"},{"id":140,"q":"Jurisdictions have a broad range of privacy requirements pertaining to the handling of personal data and information. Which jurisdiction requires all storage and processing of data that pertains to its citizens to be done on hardware that is physically located within its borders?","a":["Japan","United States","European Union","Russia"],"ans":"D","exp":"The Russian government requires all data and processing of information about its citizens to be done solely on systems and applications that reside within the physical borders of the country. The United States, European Union, and Japan focus their data privacy laws on requirements and methods for the protection of data, rather than where the data physically resides.","qth":"เขตอำนาจศาลมีข้อกำหนดความเป็นส่วนตัวที่หลากหลายที่เกี่ยวข้องกับการจัดการข้อมูลส่วนบุคคลและข้อมูล เขตอำนาจศาลใดกำหนดให้การจัดเก็บและการประมวลผลข้อมูลทั้งหมดที่เกี่ยวข้องกับพลเมืองของตนทำบนฮาร์ดแวร์ซึ่งตั้งอยู่ภายในขอบเขตของตน","ath":["ญี่ปุ่น","สหรัฐอเมริกา","สหภาพยุโรป","รัสเซีย"],"expth":"รัฐบาลรัสเซียกำหนดให้ข้อมูลและการประมวลผลข้อมูลเกี่ยวกับพลเมืองของตนทั้งหมดดำเนินการบนระบบและแอปพลิเคชันที่อยู่ภายในขอบเขตทางกายภาพของประเทศเท่านั้น สหรัฐอเมริกา สหภาพยุโรป และญี่ปุ่นให้ความสำคัญกับกฎหมายความเป็นส่วนตัวของข้อมูลไปที่ข้อกำหนดและวิธีการในการปกป้องข้อมูล แทนที่จะเป็นพื้นที่ที่มีข้อมูลอยู่จริง"},{"id":141,"q":"Although the United States does not have a single, comprehensive privacy and regulatory framework, a number of specific regulations pertain to types of data or populations. Which of the following is NOT a regulatory system from the United States federal government?","a":["HIPAA","SOX","FISMA","PCI DSS"],"ans":"D","exp":"The Payment Card Industry Data Security Standard (PCI DSS) pertains to organizations that handle credit card transactions and is an industry-regulatory standard, not a governmental one. The Sarbanes-Oxley Act (SOX) was passed in 2002 and pertains to financial records and reporting, as well as transparency requirements for shareholders and other stakeholders. The Health Insurance Portability and Accountability Act (HIPAA) was passed in 1996 and pertains to data privacy and security for medical records. FISMA refers to the Federal Information Security Management Act of 2002 and pertains to the protection of all US federal government IT systems, with the exception of national security systems.","qth":"แม้ว่าสหรัฐอเมริกาจะไม่มีกรอบความเป็นส่วนตัวและข้อบังคับที่ครอบคลุมเพียงข้อเดียว แต่มีข้อบังคับเฉพาะจำนวนหนึ่งที่เกี่ยวข้องกับประเภทของข้อมูลหรือประชากร ข้อใดต่อไปนี้ไม่ใช่ระบบการกำกับดูแลจากรัฐบาลกลางของสหรัฐอเมริกา อัลฮิปา","ath":["ฮิปา","สอกซ์","ฟิสมา","PCI-DSS"],"expth":"มาตรฐานความปลอดภัยของข้อมูลอุตสาหกรรมบัตรชำระเงิน (PCI DSS) เกี่ยวข้องกับองค์กรที่จัดการธุรกรรมบัตรเครดิตและเป็นมาตรฐานการกำกับดูแลอุตสาหกรรม ไม่ใช่มาตรฐานของรัฐบาล Sarbanes-Oxley Act (SOX) ได้รับการอนุมัติในปี 2545 และเกี่ยวข้องกับบันทึกและการรายงานทางการเงิน รวมถึงข้อกำหนดด้านความโปร่งใสสำหรับผู้ถือหุ้นและผู้มีส่วนได้ส่วนเสียอื่นๆ กฎหมาย Health Insurance Portability and Accountability Act (HIPAA) ได้รับการอนุมัติในปี 1996 และเกี่ยวข้องกับความเป็นส่วนตัวและความปลอดภัยของข้อมูลสำหรับเวชระเบียน FISMA อ้างถึง Federal Information Security Management Act ปี 2002 และเกี่ยวข้องกับการคุ้มครองระบบ IT ของรัฐบาลกลางสหรัฐอเมริกาทั้งหมด ยกเว้นระบบรักษาความปลอดภัยแห่งชาติ"},{"id":142,"q":"If you are running an application that has strict legal requirements that the data cannot reside on systems that contain other applications or systems, which aspect of cloud computing would be prohibitive in this case?","a":["Multitenancy","Broad network access","Portability","Elasticity"],"ans":"A","exp":"Multitenancy is the aspect of cloud computing that involves having multiple customers and applications running within the same system and sharing the same resources. Although considerable mechanisms are in place to ensure isolation and separation, the data and applications are ultimately using shared resources. Broad network access refers to the ability to access cloud services from any location or client. Portability refers to the ability to easily move cloud services between different cloud providers, whereas elasticity refers to the capabilities of a cloud environment to add or remove services, as needed, to meet current demand.","qth":"หากคุณใช้งานแอปพลิเคชันที่มีข้อกำหนดทางกฎหมายที่เข้มงวดซึ่งข้อมูลไม่สามารถอยู่บนระบบที่มีแอปพลิเคชันหรือระบบอื่นได้ แง่มุมใดของการประมวลผลแบบคลาวด์ที่อาจถูกห้ามในกรณีนี้","ath":["การเช่าหลายรายการ","การเข้าถึงเครือข่ายในวงกว้าง","การพกพา","ความยืดหยุ่น"],"expth":"การเช่าหลายรายการเป็นลักษณะของการประมวลผลแบบคลาวด์ที่เกี่ยวข้องกับการมีลูกค้าหลายรายและแอปพลิเคชันที่ทำงานภายในระบบเดียวกันและแบ่งปันทรัพยากรเดียวกัน แม้ว่าจะมีกลไกสำคัญเพื่อให้แน่ใจว่ามีการแยกและการแยกออกจากกัน แต่ข้อมูลและแอปพลิเคชันก็ใช้ทรัพยากรที่ใช้ร่วมกันในท้ายที่สุด การเข้าถึงเครือข่ายแบบกว้างหมายถึงความสามารถในการเข้าถึงบริการคลาวด์จากสถานที่หรือไคลเอนต์ใดๆ ความสามารถในการพกพาหมายถึงความสามารถในการย้ายบริการคลาวด์ระหว่างผู้ให้บริการคลาวด์ต่างๆ ได้อย่างง่ายดาย ในขณะที่ความยืดหยุ่นหมายถึงความสามารถของสภาพแวดล้อมคลาวด์ในการเพิ่มหรือลบบริการ ตามความจำเป็น เพื่อตอบสนองความต้องการในปัจจุบัน"},{"id":143,"q":"The REST API is a widely used standard for communications of web-based services between clients and the servers hosting them. Which protocol does the REST API depend on?","a":["HTTP","SSH","SAML","XML"],"ans":"A","exp":"Representational State Transfer (REST) is a software architectural scheme that applies the components, connectors, and data conduits for many web applications used on the Internet. It uses and relies on the HTTP protocol and supports a variety of data formats. Extensible Markup Language (XML) and Security Assertion Markup Language (SAML) are both standards for exchanging encoded data between two parties, with XML being for more general use and SAML focused on authentication and authorization data. Secure Shell client (SSH) is a secure method for allowing remote login to systems over a network.","qth":"REST API เป็นมาตรฐานที่ใช้กันอย่างแพร่หลายสำหรับการสื่อสารของบริการบนเว็บระหว่างไคลเอนต์และเซิร์ฟเวอร์ที่โฮสต์บริการเหล่านั้น REST API ขึ้นอยู่กับโปรโตคอลใด","ath":["HTTP","SSH","SAML","XML"],"expth":"Representational State Transfer (REST) ​​คือโครงร่างสถาปัตยกรรมซอฟต์แวร์ที่ใช้ส่วนประกอบ ตัวเชื่อมต่อ และท่อร้อยสายข้อมูลสำหรับแอปพลิเคชันเว็บจำนวนมากที่ใช้บนอินเทอร์เน็ต ใช้และอาศัยโปรโตคอล HTTP และรองรับรูปแบบข้อมูลที่หลากหลาย Extensible Markup Language (XML) และ Security Assertion Markup Language (SAML) เป็นทั้งมาตรฐานสำหรับการแลกเปลี่ยนข้อมูลที่เข้ารหัสระหว่างสองฝ่าย โดยที่ XML นั้นมีไว้สำหรับการใช้งานทั่วไปมากกว่า และ SAML จะเน้นไปที่ข้อมูลการตรวจสอบสิทธิ์และการอนุญาต Secure Shell client (SSH) เป็นวิธีการที่ปลอดภัยสำหรับการอนุญาตให้เข้าสู่ระบบระยะไกลไปยังระบบผ่านเครือข่าย"},{"id":144,"q":"Most APIs will support a variety of different data formats or structures. However, the SOAP API will only support which one of the following data formats?","a":["XML","XSLT","JSON","SAML"],"ans":"A","exp":"The Simple Object Access Protocol (SOAP) protocol only supports the Extensible Markup Language (XML) data format. Although the other options are all data formats or data structures, they are not supported by SOAP.","qth":"API ส่วนใหญ่จะสนับสนุนรูปแบบข้อมูลหรือโครงสร้างที่หลากหลาย อย่างไรก็ตาม SOAP AP! จะรองรับเฉพาะรูปแบบข้อมูลใดต่อไปนี้เท่านั้น","ath":["XML","XSLT","JSON","SAML"],"expth":"โปรโตคอล Simple Object Access Protocol (SOAP) รองรับเฉพาะรูปแบบข้อมูล Extensible Markup Language (XML) เท่านั้น แม้ว่าตัวเลือกอื่นๆ จะเป็นรูปแบบข้อมูลหรือโครงสร้างข้อมูลทั้งหมด แต่ SOAP ก็ไม่รองรับ"},{"id":145,"q":"Although much of the attention given to data security is focused on keeping data private and only accessible by authorized individuals, of equal importance is the trustworthiness of the data. Which concept encapsulates this?","a":["Validity","Integrity","Accessibility","Confidentiality"],"ans":"B","exp":"Integrity refers to the trustworthiness of data and whether its format and values are true and have not been corrupted or otherwise altered through unauthorized means. Confidentiality refers to keeping data from being access or viewed by unauthorized parties. Accessibility means that data is available and ready when needed by a user or service. Validity can mean a variety of things that are somewhat similar to integrity, but it's not the most appropriate answer in this case.","qth":"แม้ว่าความใส่ใจส่วนใหญ่ที่มอบให้กับความปลอดภัยของข้อมูลจะมุ่งเน้นไปที่การรักษาข้อมูลให้เป็นส่วนตัวและสามารถเข้าถึงได้โดยบุคคลที่ได้รับอนุญาตเท่านั้น แต่สิ่งที่มีความสำคัญเท่าเทียมกันก็คือความน่าเชื่อถือของข้อมูล แนวคิดใดที่สรุปสิ่งนี้","ath":["ความถูกต้อง","ความซื่อสัตย์","การเข้าถึง","การรักษาความลับ"],"expth":"ความสมบูรณ์หมายถึงความน่าเชื่อถือของข้อมูล และรูปแบบและค่าของข้อมูลนั้นเป็นจริงหรือไม่ และไม่เสียหายหรือเปลี่ยนแปลงด้วยวิธีที่ไม่ได้รับอนุญาต การรักษาความลับหมายถึงการรักษาข้อมูลไม่ให้เข้าถึงหรือดูโดยบุคคลที่ไม่ได้รับอนุญาต การเข้าถึงหมายถึงข้อมูลจะพร้อมใช้งานและพร้อมเมื่อผู้ใช้หรือบริการต้องการ ความถูกต้องอาจหมายถึงหลายสิ่งหลายอย่างที่ค่อนข้างคล้ายกับความสมบูรณ์ แต่ไม่ใช่คำตอบที่เหมาะสมที่สุดในกรณีนี้"},{"id":146,"q":"Which of the following roles would be responsible for managing memberships in federations and the use and integration of federated services?","a":["Inter-cloud provider","Cloud service business manager","Cloud service administrator","Cloud service integrator"],"ans":"A","exp":"The inter-cloud provider is responsible for peering with other cloud services and providers, as well as overseeing and managing federations and federated services. A cloud service administrator is responsible for testing, monitoring, and securing cloud services, as well as providing usage reporting and dealing with service problems. The cloud service integrator is responsible for connecting existing systems and services with a cloud. The cloud service business manager is responsible for overseeing the billing, auditing, and purchasing of cloud services.","qth":"บทบาทใดต่อไปนี้จะต้องรับผิดชอบในการจัดการสมาชิกในสหพันธรัฐและการใช้และการผสานรวมบริการแบบรวมศูนย์","ath":["ผู้ให้บริการระหว่างระบบคลาวด์","ผู้จัดการธุรกิจบริการระบบคลาวด์","ผู้ดูแลระบบบริการระบบคลาวด์","ผู้รวมบริการระบบคลาวด์"],"expth":"ผู้ให้บริการระบบระหว่างระบบคลาวด์มีหน้าที่รับผิดชอบในการเพียร์กับบริการและผู้ให้บริการระบบคลาวด์อื่นๆ ตลอดจนดูแลและจัดการระบบสหพันธรัฐและบริการแบบรวมศูนย์ ผู้ดูแลระบบบริการคลาวด์มีหน้าที่รับผิดชอบในการทดสอบ ตรวจสอบ และรักษาความปลอดภัยบริการคลาวด์ รวมถึงจัดทำรายงานการใช้งานและจัดการกับปัญหาการบริการ ผู้รวมบริการคลาวด์มีหน้าที่รับผิดชอบในการเชื่อมต่อระบบและบริการที่มีอยู่กับคลาวด์ ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่ดูแลการเรียกเก็บเงิน การตรวจสอบ และการจัดซื้อบริการคลาวด์"},{"id":147,"q":"If a cloud computing customer wishes to guarantee that a minimum level of resources will always be available, which of the following set of services would compromise the reservation?","a":["Memory and networking","CPU and software","CPU and storage","CPU and memory"],"ans":"D","exp":"A reservation guarantees to a cloud customer that they will have access to a minimal level of resources to run their systems, which will help mitigate against DoS attacks or systems that consume high levels of resources. A reservation pertains to memory and CPU resources. Under the concept of a reservation, memory and CPU are the guaranteed resources, but storage and networking are not included even though they are core components of cloud computing. Software would be out of scope for a guarantee and doesn't really pertain to the concept.","qth":"หากลูกค้าต้องการรับประกันทรัพยากรขั้นต่ำเสมอ ชุดใดประกอบเป็น reservation","ath":["หน่วยความจำและเครือข่าย","ซีพียูและซอฟต์แวร์","ซีพียูและที่เก็บข้อมูล","ซีพียูและหน่วยความจำ"],"expth":"Reservation ในคลาวด์เป็นการรับประกันทรัพยากรคำนวณหลัก โดยเฉพาะซีพียูและหน่วยความจำ"},{"id":148,"q":"With finite resources available within a cloud, even the largest cloud providers will at times need to determine which customers will receive additional resources first. What is the term associated with this determination?","a":["Weighting","Prioritization","Shares","Scoring"],"ans":"C","exp":"Shares are used within a cloud environment to prioritize resource allocation when customer requests exceed the available resources. Cloud providers utilize shares by assigning a priority score to each customer and allocating resources to those with the highest scores first. Scoring is a component of shares that determines the actual order in which to allocate resources. Neither weighting nor prioritization is the correct term in this case.","qth":"เมื่อทรัพยากรมีจำกัด คำใดใช้เรียกการจัดลำดับว่าลูกค้าคนใดจะได้ทรัพยากรเพิ่มก่อน","ath":["การถ่วงน้ำหนัก","การจัดลำดับความสำคัญ","Shares","การให้คะแนน"],"expth":"Shares ใช้จัดลำดับการจัดสรรทรัพยากรเมื่อคำขอเกินของที่มี"},{"id":149,"q":"Which phase of the cloud data lifecycle would be the MOST appropriate for the use of DLP technologies to protect the data?","a":["Use","Store","Share","Create"],"ans":"C","exp":"During the share phase, data is allowed to leave the application for consumption by other vendors, systems, or services. At this point, as the data is leaving the security controls of the application, the use of DLP technologies is appropriate to control how the data is used or to force expiration. During the use, create, and store phases, traditional security controls are available and are more appropriate because the data is still internal to the application.","qth":"ระยะใดของวงจรชีวิตข้อมูลบนคลาวด์ที่จะเหมาะสมที่สุดสำหรับการใช้เทคโนโลยี DLP เพื่อปกป้องข้อมูล?","ath":["ใช้ (Use)","จัดเก็บ (Store)","แบ่งปัน (Share)","สร้าง (Create)"],"expth":"ในระหว่างระยะการแบ่งปัน ข้อมูลจะได้รับอนุญาตให้ออกจากแอปพลิเคชันเพื่อการใช้งานโดยผู้จำหน่าย ระบบ หรือบริการอื่น ๆ ณ จุดนี้ เนื่องจากข้อมูลออกจากการควบคุมความปลอดภัยของแอปพลิเคชัน การใช้เทคโนโลยี DLP จึงเหมาะสมในการควบคุมวิธีการใช้ข้อมูลหรือบังคับให้หมดอายุ ในระหว่างขั้นตอนการใช้งาน สร้าง และจัดเก็บ การควบคุมความปลอดภัยแบบดั้งเดิมจะพร้อมใช้งานและมีความเหมาะสมมากกว่า เนื่องจากข้อมูลยังอยู่ภายในแอปพลิเคชัน"},{"id":150,"q":"If a key feature of cloud computing that your organization desires is the ability to scale and expand without limit or concern about available resources, which cloud deployment model would you MOST likely be considering?","a":["Public","Hybrid","Private","Community"],"ans":"A","exp":"Public clouds, such as AWS and Azure, are massive systems run by major corporations, and they account for a significant share of Internet traffic and services. They are always expanding, offer enormous resources to customers, and are the least likely to run into resource constraints compared to the other deployment models. Private clouds would likely have the resources available for specific uses and could not be assumed to have a large pool of resources available for expansion. A community cloud would have the same issues as a private cloud, being targeted to similar organizations. A hybrid cloud, because it spans multiple clouds, would not fit the bill either, without the use of individual cloud models.","qth":"หากต้องการขยายทรัพยากรได้เกือบไม่จำกัดโดยไม่กังวลของที่มี โมเดลการติดตั้งใดมีแนวโน้มมากที่สุด","ath":["สาธารณะ (Public)","ลูกผสม (Hybrid)","ส่วนตัว (Private)","ชุมชน (Community)"],"expth":"คลาวด์สาธารณะอย่าง AWS/Azure มีทรัพยากรขนาดใหญ่และโอกาสติดขัดด้านทรัพยากรน้อยกว่าโมเดลอื่น"},{"id":151,"q":"If a company needed to guarantee through contract and SLAs that a cloud provider would always have available sufficient resources to start their services and provide a certain level of provisioning, what would the contract need to refer to?","a":["Limit","Reservation","Assurance","Guarantee"],"ans":"B","exp":"A reservation guarantees to a cloud customer that they will have access to a minimal level of resources to run their systems, which will help mitigate against DoS attacks or systems that consume high levels of resources. A limit refers to the enforcement of a maximum level of resources that can be consumed by or allocated to a cloud customer, service, or system. Both guarantee and assurance are terms that sound similar to reservation, but they are not correct choices.","qth":"หากบริษัทจำเป็นต้องรับประกันผ่านสัญญาและ SLA ว่าผู้ให้บริการระบบคลาวด์จะมีทรัพยากรเพียงพอเสมอในการเริ่มต้นบริการและจัดเตรียมการจัดเตรียมในระดับหนึ่ง สัญญาจำเป็นต้องอ้างอิงถึงอะไร","ath":["ขีดจำกัด","การจอง","การประกัน","รับประกัน"],"expth":"การจองรับประกันกับลูกค้าระบบคลาวด์ว่าพวกเขาจะสามารถเข้าถึงทรัพยากรในระดับต่ำสุดเพื่อรันระบบ ซึ่งจะช่วยบรรเทาการโจมตี DoS หรือระบบที่ใช้ทรัพยากรในระดับสูง ขีดจำกัดหมายถึงการบังคับใช้ทรัพยากรในระดับสูงสุดที่สามารถนำมาใช้หรือจัดสรรให้กับลูกค้าบริการหรือระบบคลาวด์ได้ ทั้งการรับประกันและการรับประกันเป็นเงื่อนไขที่ฟังดูคล้ายกับการจอง แต่ไม่ใช่ตัวเลือกที่ถูกต้อง"},{"id":152,"q":"Many aspects and features of cloud computing can make eDiscovery compliance more difficult or costly. Which aspect of cloud computing would be the MOST complicating factor?","a":["Measured service","Broad network access","Multitenancy","Portability"],"ans":"C","exp":"With multitenancy, multiple customers share the same physical hardware and systems. With the nature of a cloud environment and how it writes data across diverse systems that are shared by others, the process of eDiscovery becomes much more complicated. Administrators cannot pull physical drives or easily isolate which data to capture. They not only have to focus on which data they need to collect, while ensuring they find all of it, but they also have to make sure that other data is not accidently collected and exposed along with it. Measured service is the aspect of a cloud where customers only pay for the services they are actually using, and for the duration of their use. Portability refers to the ease with which an application or service can be moved among different cloud providers. Broad network access refers to the nature of cloud services being accessed via the public Internet, either with or without secure tunneling technologies. None of these concepts would pertain to eDiscovery.","qth":"ลักษณะและคุณลักษณะหลายประการของการประมวลผลแบบคลาวด์สามารถทำให้การปฏิบัติตามข้อกำหนดของ eDiscovery ยากขึ้นหรือมีค่าใช้จ่ายสูง แง่มุมใดของการประมวลผลแบบคลาวด์จะเป็นปัจจัยที่ซับซ้อนที่สุด","ath":["บริการวัดผล","การเข้าถึงเครือข่ายในวงกว้าง","การเช่าหลายรายการ","การพกพา"],"expth":"ด้วยการเช่าหลายราย ลูกค้าหลายรายจึงใช้ฮาร์ดแวร์และระบบทางกายภาพเดียวกัน ด้วยธรรมชาติของสภาพแวดล้อมคลาวด์และวิธีที่ระบบเขียนข้อมูลบนระบบที่หลากหลายซึ่งผู้อื่นใช้ร่วมกัน กระบวนการของ eDiscovery จึงมีความซับซ้อนมากขึ้น ผู้ดูแลระบบไม่สามารถดึงไดรฟ์จริงหรือแยกข้อมูลที่จะบันทึกได้อย่างง่ายดาย พวกเขาไม่เพียงแต่ต้องมุ่งเน้นไปที่ข้อมูลที่ต้องการรวบรวม ในขณะเดียวกันก็ให้แน่ใจว่าพวกเขาจะพบข้อมูลทั้งหมด แต่พวกเขายังต้องตรวจสอบให้แน่ใจด้วยว่าข้อมูลอื่น ๆ จะไม่ถูกรวบรวมและเปิดเผยไปพร้อมกับข้อมูลนั้นโดยไม่ได้ตั้งใจ บริการที่วัดผลคือลักษณะของคลาวด์ที่ลูกค้าชำระค่าบริการเฉพาะที่พวกเขาใช้จริงและตามระยะเวลาการใช้งานเท่านั้น การพกพาหมายถึงความง่ายในการเคลื่อนย้ายแอปพลิเคชันหรือบริการระหว่างผู้ให้บริการคลาวด์รายต่างๆ พี่ชาย"},{"id":153,"q":"A crucial decision any company must make is in regard to where it hosts the data systems it depends on. A debate exists as to whether it's best to lease space in a data center or build your own data center--and now with cloud computing, whether to purchase resources within a cloud. What is the biggest advantage to leasing space in a data center versus procuring cloud services?","a":["Regulations","Control","Security","Costs"],"ans":"B","exp":"When leasing space in a data center versus utilizing cloud services, a customer has a much greater control over its systems and services, from both the hardware/ software perspective and the operational management perspective. Costs, regulations, and security are all prime considerations regardless of the hosting type selected. Although regulations will be the same in either hosting solution, in most instances, costs and security will be greater factors with leased space.","qth":"ข้อได้เปรียบใหญ่สุดของการเช่าพื้นที่ศูนย์ข้อมูล เมื่อเทียบกับการใช้บริการคลาวด์คืออะไร","ath":["กฎระเบียบ","การควบคุม","ความปลอดภัย","ต้นทุน"],"expth":"การเช่าพื้นที่ศูนย์ข้อมูลให้การควบคุมระบบและปฏิบัติการมากกว่าการใช้บริการคลาวด์"},{"id":154,"q":"Which of the following systems is used to employ a variety of different techniques to discover and alert on threats and potential threats to systems and networks?","a":["IDS","IPS","Firewall","WAF"],"ans":"A","exp":"An intrusion detection system (IDS) is implemented to watch network traffic and operations, using predefined criteria or signatures, and alert administrators if anything suspect is found. An intrusion prevention system (IPS) is similar to an IDS but actually takes action against suspect traffic, whereas an IDS just alerts when it finds anything suspect. A firewall works at the network level and only takes into account IP addresses, ports, and protocols; it does not inspect the traffic for patterns or content. A web application firewall (WAF) works at the application layer and provides a
