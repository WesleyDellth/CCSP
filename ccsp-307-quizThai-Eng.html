rmined level?","a":["RPO","RSL","RTO","SRE"],"ans":"C","exp":"The recovery time objective (RTO) measures the amount of time necessary to recover operations to meet the BCDR plan. The recovery service level (RSL) measures the percentage of operations that would be recovered during a BCDR situation. The recovery point objective (RPO) sets and defines the amount of data an organization must have available or accessible to reach the predetermined level of operations necessary during a BCDR situation. SRE is provided as an erroneous response.","qth":"โดยทั่วไปแล้วกลยุทธ์ BCDR จะไม่เกี่ยวข้องกับการดำเนินงานทั้งหมดขององค์กร แต่จะเกี่ยวข้องกับการดำเนินการที่ถือว่ามีความสำคัญต่อธุรกิจเท่านั้น แนวคิดใดที่เกี่ยวข้องกับปริมาณข้อมูลและบริการที่จำเป็นในการบรรลุระดับการดำเนินงานที่กำหนดไว้","ath":["RPO","RSL","RTO","SRE"],"expth":"วัตถุประสงค์จุดกู้คืน (RPO) กำหนดและกำหนดจำนวนข้อมูลที่องค์กรต้องมีหรือสามารถเข้าถึงได้เพื่อให้บรรลุระดับการดำเนินงานที่กำหนดไว้ล่วงหน้าที่จำเป็นในระหว่างสถานการณ์ BCDR วัตถุประสงค์เวลาการกู้คืน (RTO) จะวัดระยะเวลาที่จำเป็นในการกู้คืนการดำเนินการเพื่อให้เป็นไปตามแผน BCDR ระดับบริการการกู้คืน (RSL) จะวัดเปอร์เซ็นต์ของการดำเนินการที่จะได้รับการกู้คืนในระหว่างสถานการณ์ BCDR SRE ให้มาเป็นการตอบกลับที่ผิดพลาด"},{"id":210,"q":"Which data protection strategy would be useful for a situation where the ability to remove sensitive data from a set is needed, but a requirement to retain the ability to map back to the original values is also present?","a":["Masking","Tokenization","Encryption","Anonymization"],"ans":"B","exp":"Tokenization involves the replacement of sensitive data fields with key or token values, which can ultimately be mapped back to the original, sensitive data values. Masking refers to the overall approach to covering sensitive data, and anonymization is a type of masking, where indirect identifiers are removed from a data set to prevent the mapping back of data to an individual. Encryption refers to the overall process of protecting data via key pairs and protecting confidentiality.","qth":"กลยุทธ์การปกป้องข้อมูลใดที่จะเป็นประโยชน์สำหรับสถานการณ์ที่จำเป็นต้องมีความสามารถในการลบข้อมูลที่ละเอียดอ่อนออกจากชุด แต่มีข้อกำหนดในการรักษาความสามารถในการแมปกลับไปเป็นค่าดั้งเดิมด้วย","ath":["การมาสก์","การทำโทเค็น","การเข้ารหัส","การทำให้ไม่ระบุชื่อ"],"expth":"การทำโทเค็นเกี่ยวข้องกับการแทนที่ฟิลด์ข้อมูลที่ละเอียดอ่อนด้วยค่าคีย์หรือโทเค็น ซึ่งท้ายที่สุดสามารถแมปกลับไปที่ ค่าข้อมูลต้นฉบับที่ละเอียดอ่อน การมาสก์หมายถึงวิธีการโดยรวมในการปกปิดข้อมูลที่ละเอียดอ่อน และการไม่เปิดเผยตัวตนเป็นการมาสก์ประเภทหนึ่ง โดยที่ตัวระบุทางอ้อมจะถูกลบออกจากชุดข้อมูลเพื่อป้องกันการแมปข้อมูลด้านหลังไปยังแต่ละบุคคล การเข้ารหัสหมายถึงกระบวนการโดยรวมในการปกป้องข้อมูลผ่านคู่คีย์และการปกป้องความลับ"},{"id":211,"q":"Which of the following is NOT one of the components of multifactor authentication?","a":["Something the user knows","Something the user has","Something the user sends","Something the user is"],"ans":"C","exp":"Multifactor authentication systems are composed of something the user knows, has, and/or is, not something the user sends. Multifactor authentication commonly uses something that a user knows, has, and/or is (such as biometrics or features).","qth":"ข้อใดต่อไปนี้ไม่ใช่ส่วนประกอบหนึ่งของการตรวจสอบสิทธิ์แบบหลายปัจจัย","ath":["สิ่งที่ผู้ใช้รู้","บางสิ่งที่ผู้ใช้มี","บางสิ่งที่ผู้ใช้ส่ง","บางสิ่งที่ผู้ใช้เป็น"],"expth":"ระบบการตรวจสอบสิทธิ์แบบหลายปัจจัยประกอบด้วยบางสิ่งที่ผู้ใช้รู้ มี และ/หรือไม่ใช่ ไม่ใช่สิ่งที่ผู้ใช้ส่ง โดยทั่วไปการรับรองความถูกต้องแบบหลายปัจจัยจะใช้สิ่งที่ผู้ใช้ทราบ มี และ/หรือเป็น (เช่น ข้อมูลชีวมาตรหรือฟีเจอร์)"},{"id":212,"q":"Above and beyond general regulations for data privacy and protection, certain types of data are subjected to more rigorous regulations and oversight. Which of the following is not a regulatory framework for more sensitive or specialized data?","a":["FIPS 140-2","FedRAMP","PCI DSS","HIPAA"],"ans":"A","exp":"The FIPS 140-2 standard pertains to the certification of cryptographic modules and is not a regulatory framework. The Payment Card Industry Data Security Standard (PCI DSS), the Federal Risk and Authorization Management Program (FedRAMP), and the Health Insurance Portability and Accountability Act (HIPAA) are all regulatory frameworks for sensitive or specialized data.","qth":"เหนือและนอกเหนือจากกฎระเบียบทั่วไปสำหรับความเป็นส่วนตัวและการปกป้องข้อมูล ข้อมูลบางประเภทอยู่ภายใต้กฎระเบียบและการกำกับดูแลที่เข้มงวดมากขึ้น ข้อใดต่อไปนี้ไม่ใช่กรอบการทำงานด้านกฎระเบียบสำหรับข้อมูลที่ละเอียดอ่อนหรือเฉพาะทางมากกว่า","ath":["FIPS 140-2","FedRAMP","PCI DSS","HIPAA"],"expth":"มาตรฐาน FIPS 140-2 เกี่ยวข้องกับ การรับรองโมดูลการเข้ารหัสและไม่ใช่กรอบการกำกับดูแล มาตรฐานความปลอดภัยของข้อมูลอุตสาหกรรมบัตรชำระเงิน (PCI DSS), Federal Risk and Authorization Management Program (FedRAMP) และ Health Insurance Portability and Accountability Act (HIPAA) ล้วนเป็นกรอบการทำงานด้านกฎระเบียบสำหรับข้อมูลที่ละเอียดอ่อนหรือเฉพาะทาง"},{"id":213,"q":"Which of the following could be used as a second component of multifactor authentication if a user has an RSA token?","a":["Access card","USB thumb drive","Retina scan","RFID"],"ans":"C","exp":"A retina scan could be used in conjunction with an RSA token because it is a biometric factor, and thus a different type of factor. An access card, RFID, and USB thumb drive are all items in possession of a user, the same as an RSA token, and as such would not be appropriate.","qth":"ข้อใดต่อไปนี้สามารถใช้เป็นองค์ประกอบที่สองของการตรวจสอบสิทธิ์แบบหลายปัจจัยได้หากผู้ใช้มีโทเค็น RSA","ath":["การ์ดเข้าถึง","ธัมบ์ไดรฟ์ USB","การสแกนจอตา","RFID"],"expth":"การสแกนจอตาสามารถใช้ร่วมกับโทเค็น RSA ได้เนื่องจากเป็นปัจจัยทางชีวมิติ และด้วยเหตุนี้จึงเป็นปัจจัยประเภทอื่น บัตรเข้าใช้งาน RFID และธัมบ์ไดรฟ์ USB ล้วนเป็นสิ่งของที่ผู้ใช้ครอบครอง เช่นเดียวกับโทเค็น RSA และด้วยเหตุนี้จึงไม่เหมาะสม"},{"id":214,"q":"Having a reservation in a cloud environment can ensure operations continue in the event of high utilization across the cloud. Which of the following would NOT be a capability covered by reservations?","a":["Performing business operations","Starting virtual machines","Running applications","Auto-scaling"],"ans":"D","exp":"A reservation will not guarantee auto-scaling is available because it involves the allocation of additional resources beyond what a cloud customer already has provisioned. Reservations will guarantee minimal resources are available to start virtual machines, run applications, and perform normal business operations.","qth":"การจองในสภาพแวดล้อมคลาวด์ช่วยให้มั่นใจได้ว่าการดำเนินงานจะดำเนินต่อไปในกรณีที่มีการใช้งานสูงบนคลาวด์ ข้อใดต่อไปนี้จะไม่ครอบคลุมความสามารถในการจอง","ath":["ดำเนินธุรกิจ","การเริ่มต้นเครื่องเสมือน","กำลังเรียกใช้แอปพลิเคชัน","ปรับขนาดอัตโนมัติ"],"expth":"การจองจะไม่รับประกันว่าการปรับขนาดอัตโนมัติจะพร้อมใช้งาน เนื่องจากเกี่ยวข้องกับการจัดสรรทรัพยากรเพิ่มเติมนอกเหนือจากที่ลูกค้าระบบคลาวด์จัดเตรียมไว้แล้ว การจองจะรับประกันว่าทรัพยากรขั้นต่ำจะพร้อมใช้งานเพื่อเริ่มเครื่องเสมือน เรียกใช้แอปพลิเคชัน และดำเนินธุรกิจตามปกติ"},{"id":215,"q":"Which of the following technologies is NOT commonly used for accessing systems and services in a cloud environment in a secure manner?","a":["KVM","HTTPS","VPN","TLS"],"ans":"A","exp":"A keyboard-video-mouse (KVM) system is commonly used for directly accessing server terminals in a data center. It is not a method that would be possible within a cloud environment, primarily due to the use virtualized systems, but also because only the cloud provider's staff would be allowed the physical access to hardware systems that's provided by a KVM. Hypertext Transfer Protocol Secure (HTTPS), virtual private network (VPN), and Transport Layer Security (TLS) are all technologies and protocols that are widely used with cloud implementations for secure access to systems and services.","qth":"เทคโนโลยีใดต่อไปนี้ที่มักไม่ใช้สำหรับการเข้าถึงระบบและบริการในสภาพแวดล้อมคลาวด์อย่างปลอดภัย","ath":["KVM","HTTPS","VPN","TLS"],"expth":"ระบบคีย์บอร์ด-วิดีโอ-เมาส์ (KVM) มักใช้สำหรับการเข้าถึงเทอร์มินัลเซิร์ฟเวอร์ในศูนย์ข้อมูลโดยตรง ไม่ใช่วิธีการที่เป็นไปได้ภายในสภาพแวดล้อมคลาวด์ โดยหลักมาจากการใช้ระบบเสมือนจริง แต่ยังเป็นเพราะมีเพียงพนักงานของผู้ให้บริการคลาวด์เท่านั้นที่ได้รับอนุญาตให้เข้าถึงทางกายภาพไปยังระบบฮาร์ดแวร์ที่ KVM มอบให้ Hypertext Transfer Protocol Secure (HTTPS), เครือข่ายส่วนตัวเสมือน (VPN) และ Transport Layer Security (TLS) เป็นเทคโนโลยีและโปรโตคอลทั้งหมดที่ใช้กันอย่างแพร่หลายกับการใช้งานระบบคลาวด์เพื่อการเข้าถึงระบบและบริการอย่างปลอดภัย"},{"id":216,"q":"Which protocol, as a part of TLS, handles the actual secure communications and transmission of data?","a":["Negotiation","Handshake","Transfer","Record"],"ans":"D","exp":"The TLS record protocol is the actual secure communications method for transmitting data; it's responsible for encrypting and authenticating packets throughout their transmission between the parties, and in some cases it also performs compression. The TLS handshake protocol is what negotiates and establishes the TLS connection between two parties and enables the secure communications channel to then handle data transmissions. Negotiation and transfer are not protocols under TLS.","qth":"โปรโตคอลใดซึ่งเป็นส่วนหนึ่งของ TLS ที่จัดการการสื่อสารและการส่งข้อมูลที่ปลอดภัยจริง","ath":["การเจรจาต่อรอง","จับมือกัน","การถ่ายโอน","บันทึก"],"expth":"โปรโตคอลบันทึก TLS เป็นวิธีการสื่อสารที่ปลอดภัยจริงสำหรับการส่งข้อมูล มีหน้าที่รับผิดชอบในการเข้ารหัสและรับรองความถูกต้องของแพ็กเก็ตตลอดการส่งข้อมูลระหว่างฝ่ายต่างๆ และในบางกรณีก็ทำการบีบอัดด้วย โปรโตคอลการจับมือ TLS คือสิ่งที่เจรจาและสร้างการเชื่อมต่อ TLS ระหว่างทั้งสองฝ่าย และช่วยให้ช่องทางการสื่อสารที่ปลอดภัยสามารถจัดการการส่งข้อมูลได้ การเจรจาและการโอนไม่ใช่โปรโตคอลภายใต้ TLS"},{"id":217,"q":"Which of the following terms is NOT a commonly used category of risk acceptance?","a":["Moderate","Critical","Minimal","Accepted"],"ans":"D","exp":"Explanation Accepted is not a risk acceptance category. The risk acceptance categories are minimal, low, moderate, high, and critical.","qth":"คำใดต่อไปนี้ไม่ใช่ประเภทการยอมรับความเสี่ยงที่ใช้กันทั่วไป?","ath":["ปานกลาง","สำคัญ","น้อยที่สุด","ยอมรับแล้ว"],"expth":"คำอธิบาย ยอมรับแล้ว ไม่ใช่ประเภทการยอมรับความเสี่ยง ประเภทการยอมรับความเสี่ยง ได้แก่ น้อยที่สุด ต่ำ ปานกลาง สูง และวิกฤต"},{"id":218,"q":"Many activities within a cloud environment are performed via programmatic means, where complex and distributed operations are handled without the need to perform each step individually. Which of the following concepts does this describe?","a":["Orchestration","Provisioning","Automation","Allocation"],"ans":"A","exp":"Orchestration is the programmatic means of managing and coordinating activities within a cloud environment and allowing for a commensurate level of automation and self-service. Provisioning, allocation, and automation are all components of orchestration, but none refers to the overall concept.","qth":"กิจกรรมจำนวนมากภายในสภาพแวดล้อมคลาวด์ดำเนินการผ่านวิธีการทางโปรแกรม โดยมีการจัดการการดำเนินการที่ซับซ้อนและกระจายโดยไม่จำเป็นต้องดำเนินการแต่ละขั้นตอนแยกกัน สิ่งนี้อธิบายแนวคิดใดต่อไปนี้","ath":["การเรียบเรียง","การจัดเตรียม","ระบบอัตโนมัติ","การจัดสรร"],"expth":"การจัดประสานเป็นวิธีทางโปรแกรมในการจัดการและประสานงานกิจกรรมภายในสภาพแวดล้อมคลาวด์ และช่วยให้มีระบบอัตโนมัติและการบริการตนเองในระดับที่เหมาะสม การจัดเตรียม การจัดสรร และระบบอัตโนมัติล้วนเป็นองค์ประกอบของการจัดการ แต่ไม่มีสิ่งใดที่อ้างอิงถึงแนวคิดโดยรวม"},{"id":219,"q":"Which of the following provides assurance, to a predetermined acceptable level of certainty, that an entity is indeed who they claim to be?","a":["Authentication","Identification","Proofing","Authorization"],"ans":"A","exp":"Authentication goes a step further than identification by providing a means for proving an entity's identification. Authentication is most commonly done through mechanisms such as passwords. Identification involves ascertaining who the entity is, but without a means of proving it, such as a name or user ID. Authorization occurs after authentication and sets access permissions and other privileges within a system or application for the user. Proofing is not a term that is relevant to the question.","qth":"ข้อใดต่อไปนี้ให้การรับประกันในระดับความแน่นอนที่ยอมรับได้ที่กำหนดไว้ล่วงหน้าว่าเอนทิตีคือบุคคลที่พวกเขาอ้างว่าเป็นจริงๆ?","ath":["การรับรองความถูกต้อง","การระบุตัวตน","การพิสูจน์อักษร","การให้สิทธิ์"],"expth":"การรับรองความถูกต้องก้าวไปไกลกว่าการระบุตัวตนโดยการจัดเตรียมวิธีการในการพิสูจน์การระบุตัวตนของนิติบุคคล การรับรองความถูกต้องมักกระทำผ่านกลไกต่างๆ เช่น รหัสผ่าน การระบุเกี่ยวข้องกับการสืบหาว่าบุคคลนั้นคือใคร แต่ไม่มีวิธีการพิสูจน์ เช่น ชื่อหรือรหัสผู้ใช้ การอนุญาตเกิดขึ้นหลังจากการรับรองความถูกต้องและตั้งค่าสิทธิ์การเข้าถึงและสิทธิพิเศษอื่น ๆ ภายในระบบหรือแอปพลิเคชันสำหรับผู้ใช้ การพิสูจน์อักษรไม่ใช่คำที่เกี่ยวข้องกับคำถาม"},{"id":220,"q":"When an organization is considering the use of cloud services for BCDR planning and solutions, which of the following cloud concepts would be the most important?","a":["Reversibility","Elasticity","Interoperability","Portability"],"ans":"D","exp":"Portability is the ability for a service or system to easily move among different cloud providers. This is essential for using a cloud solution for BCDR because vendor lock-in would inhibit easily moving and setting up services in the event of a disaster, or it would necessitate a large number of configuration or component changes to implement. Interoperability, or the ability to reuse components for other services or systems, would not be an important factor for BCDR. Reversibility, or the ability to remove all data quickly and completely from a cloud environment, would be important at the end of a disaster, but would not be important during setup and deployment. Elasticity, or the ability to resize resources to meet current demand, would be very beneficial to a BCDR situation, but not as vital as portability.","qth":"เมื่อองค์กรกำลังพิจารณาใช้บริการระบบคลาวด์สำหรับการวางแผนและโซลูชัน BCDR แนวคิดระบบคลาวด์ข้อใดต่อไปนี้จะมีความสำคัญมากที่สุด","ath":["การย้อนกลับได้","ความยืดหยุ่น","การทำงานร่วมกัน","การพกพา"],"expth":"การพกพาคือความสามารถของบริการหรือระบบในการเคลื่อนย้ายระหว่างผู้ให้บริการคลาวด์รายต่างๆ ได้อย่างง่ายดาย นี่เป็นสิ่งสำคัญสำหรับการใช้โซลูชันระบบคลาวด์สำหรับ BCDR เนื่องจากการล็อคอินของผู้จำหน่ายจะขัดขวางการเคลื่อนย้ายและการตั้งค่าบริการอย่างง่ายดายในกรณีที่เกิดภัยพิบัติ หรือจำเป็นต้องมีการกำหนดค่าหรือการเปลี่ยนแปลงส่วนประกอบจำนวนมากเพื่อนำไปใช้ ความสามารถในการทำงานร่วมกันหรือความสามารถในการนำส่วนประกอบกลับมาใช้ใหม่สำหรับบริการหรือระบบอื่นๆ จะไม่เป็นปัจจัยสำคัญสำหรับ BCDR ความสามารถในการย้อนกลับได้หรือความสามารถในการลบข้อมูลทั้งหมดอย่างรวดเร็วและสมบูรณ์ออกจากสภาพแวดล้อมคลาวด์จะมีความสำคัญเมื่อสิ้นสุดภัยพิบัติ แต่จะไม่สำคัญในระหว่างการตั้งค่าและการปรับใช้ ความยืดหยุ่นหรือความสามารถในการปรับขนาดทรัพยากรให้ตรงกับความต้องการในปัจจุบัน จะเป็นประโยชน์อย่างยิ่งต่อสถานการณ์ BCDR แต่ไม่เป็นผลดีต่อสถานการณ์"},{"id":221,"q":"What masking strategy involves the replacing of sensitive data at the time it is accessed and used as it flows between the data and application layers of a service?","a":["Active","Static","Dynamic","Transactional"],"ans":"C","exp":"Dynamic masking involves the live replacing of sensitive data fields during transactional use between the data and application layers of a service. Static masking involves creating a full data set with the sensitive data fields masked, but is not done during live transactions like dynamic masking. Active and transactional are offered as similar types of answers but are not types of masking.","qth":"กลยุทธ์การมาสก์ใดที่เกี่ยวข้องกับการแทนที่ข้อมูลที่ละเอียดอ่อนในเวลาที่มีการเข้าถึงและใช้งานในขณะที่ข้อมูลไหลระหว่างชั้นข้อมูลและแอปพลิเคชันของบริการ","ath":["ใช้งานอยู่","คงที่","ไดนามิก","ธุรกรรม"],"expth":"การมาสก์แบบไดนามิกเกี่ยวข้องกับการแทนที่ฟิลด์ข้อมูลที่ละเอียดอ่อนแบบเรียลไทม์ในระหว่างการใช้งานธุรกรรมระหว่างชั้นข้อมูลและแอปพลิเคชันของบริการ การมาสก์แบบคงที่เกี่ยวข้องกับการสร้างชุดข้อมูลเต็มรูปแบบโดยมีการมาสก์ช่องข้อมูลที่ละเอียดอ่อน แต่จะไม่ได้เกิดขึ้นระหว่างการทำธุรกรรมจริง เช่น การมาสก์แบบไดนามิก คำตอบที่ใช้งานอยู่และธุรกรรมเสนอเป็นคำตอบประเภทเดียวกัน แต่ไม่ใช่ประเภทของการมาสก์"},{"id":222,"q":"Which of the following would be considered an example of insufficient due diligence leading to security or operational problems when moving to a cloud?","a":["Monitoring","Use of a remote key management system","Programming languages used","Reliance on physical network controls"],"ans":"D","exp":"Many organizations in a traditional data center make heavy use of physical network controls for security. Although this is a perfectly acceptable best practice in a traditional data center, this reliance is not something that will port to a cloud environment. The failure of an organization to properly understand and adapt to the difference in network controls when moving to a cloud will likely leave an application with security holes and vulnerabilities. The use of a remote key management system, monitoring, or certain programming languages would not constitute insufficient due diligence by itself.","qth":"ข้อใดต่อไปนี้ถือเป็นตัวอย่างของความรอบคอบไม่เพียงพอที่นำไปสู่ปัญหาด้านความปลอดภัยหรือการปฏิบัติงานเมื่อย้ายไปยังระบบคลาวด์","ath":["การตรวจสอบ","การใช้ระบบการจัดการคีย์ระยะไกล","ภาษาการเขียนโปรแกรมที่ใช้","การพึ่งพาการควบคุมเครือข่ายทางกายภาพ"],"expth":"หลายองค์กรในศูนย์ข้อมูลแบบดั้งเดิมใช้การควบคุมเครือข่ายทางกายภาพอย่างหนักเพื่อความปลอดภัย แม้ว่านี่จะเป็นแนวปฏิบัติที่ดีที่สุดที่ยอมรับได้อย่างสมบูรณ์แบบในศูนย์ข้อมูลแบบดั้งเดิม แต่การพึ่งพานี้ไม่ใช่สิ่งที่จะส่งต่อไปยังสภาพแวดล้อมคลาวด์ ความล้มเหลวขององค์กรในการทำความเข้าใจและปรับตัวให้เข้ากับความแตกต่างในการควบคุมเครือข่ายอย่างเหมาะสมเมื่อย้ายไปยังระบบคลาวด์อาจทำให้แอปพลิเคชันมีช่องโหว่ด้านความปลอดภัยและช่องโหว่ การใช้ระบบการจัดการคีย์ระยะไกล การตรวจสอบ หรือภาษาการเขียนโปรแกรมบางภาษาไม่ถือเป็นการตรวจสอบสถานะที่ไม่เพียงพอ"},{"id":223,"q":"Upon completing a risk analysis, a company has four different approaches to addressing risk. Which approach it takes will be based on costs, available options, and adherence to any regulatory requirements from independent audits. Which of the following groupings correctly represents the four possible approaches?","a":["Accept, avoid, transfer, mitigate","Accept, deny, transfer, mitigate","Accept, deny, mitigate, revise","Accept, dismiss, transfer, mitigate"],"ans":"A","exp":"The four possible approaches to risk are as follows: accept (do not patch and continue with the risk), avoid (implement solutions to prevent the risk from occurring), transfer (take out insurance), and mitigate (change configurations or patch to resolve the risk). Each of these answers contains at least one incorrect approach name.","qth":"เมื่อเสร็จสิ้นการวิเคราะห์ความเสี่ยง บริษัทมีสี่แนวทางที่แตกต่างกันในการจัดการกับความเสี่ยง แนวทางใดที่ใช้จะขึ้นอยู่กับต้นทุน ตัวเลือกที่มีอยู่ และการปฏิบัติตามข้อกำหนดด้านกฎระเบียบจากการตรวจสอบอิสระ การจัดกลุ่มใดต่อไปนี้แสดงถึงแนวทางที่เป็นไปได้ทั้งสี่วิธีอย่างถูกต้อง","ath":["ยอมรับ หลีกเลี่ยง โอน บรรเทา","ยอมรับ ปฏิเสธ โอน บรรเทา","ยอมรับ ปฏิเสธ บรรเทา แก้ไข","ยอมรับ ยกเลิก โอน บรรเทา"],"expth":"แนวทางที่เป็นไปได้สี่ประการสำหรับความเสี่ยงมีดังนี้: ยอมรับ (อย่าแก้ไขและดำเนินการกับความเสี่ยงต่อไป) หลีกเลี่ยง (ใช้วิธีแก้ปัญหาเพื่อป้องกันความเสี่ยงที่จะเกิดขึ้น) ถ่ายโอน (นำประกันออก) และบรรเทา (เปลี่ยนการกำหนดค่าหรือแพทช์เพื่อแก้ไขความเสี่ยง) แต่ละคำตอบเหล่านี้มีชื่อแนวทางที่ไม่ถูกต้องอย่างน้อยหนึ่งชื่อ"},{"id":224,"q":"Which of the following is NOT a component of access control?","a":["Accounting","Federation","Authorization","Authentication"],"ans":"B","exp":"Federation is not a component of access control. Instead, it is used to allow users possessing credentials from other authorities and systems to access services outside of their domain. This allows for access and trust without the need to create additional, local credentials. Access control encompasses not only the key concepts of authorization and authentication, but also accounting. Accounting consists of collecting and maintaining logs for both authentication and authorization for operational and regulatory requirements.","qth":"ข้อใดต่อไปนี้ไม่ใช่องค์ประกอบของการควบคุมการเข้าถึง","ath":["การบัญชี","สหพันธรัฐ","การอนุญาต","การตรวจสอบสิทธิ์"],"expth":"สหพันธรัฐไม่ใช่องค์ประกอบของการควบคุมการเข้าถึง แต่ใช้เพื่ออนุญาตให้ผู้ใช้ที่มีข้อมูลรับรองจากหน่วยงานและระบบอื่น ๆ เข้าถึงบริการภายนอกโดเมนของตนได้ ซึ่งช่วยให้เข้าถึงและไว้วางใจได้โดยไม่จำเป็นต้องสร้างข้อมูลรับรองท้องถิ่นเพิ่มเติม การควบคุมการเข้าถึงไม่เพียงแต่ครอบคลุมแนวคิดหลักของการอนุญาตและการรับรองความถูกต้องเท่านั้น แต่ยังรวมถึงการบัญชีด้วย การบัญชีประกอบด้วยการรวบรวมและดูแลรักษาบันทึกสำหรับการตรวจสอบและการอนุญาตสำหรับข้อกำหนดด้านการปฏิบัติงานและกฎระเบียบ"},{"id":225,"q":"With an application hosted in a cloud environment, who could be the recipient of an eDiscovery order?","a":["Users","Both the cloud provider and cloud customer","The cloud customer","The cloud provider"],"ans":"B","exp":"Either the cloud customer or the cloud provider could receive an eDiscovery order, and in almost all circumstances they would need to work together to ensure compliance.","qth":"ใครบ้างที่เป็นผู้รับคำสั่งซื้อ eDiscovery ได้ด้วยแอปพลิเคชันที่โฮสต์ในสภาพแวดล้อมคลาวด์","ath":["ผู้ใช้","ทั้งผู้ให้บริการคลาวด์และลูกค้าคลาวด์","ลูกค้าคลาวด์","ทั้งผู้ให้บริการคลาวด์และลูกค้าคลาวด์"],"expth":"ลูกค้าคลาวด์หรือผู้ให้บริการคลาวด์สามารถรับคำสั่งซื้อ eDiscovery ได้ และในเกือบทุกสถานการณ์ พวกเขาจำเป็นต้องทำงานร่วมกันเพื่อให้มั่นใจว่าเป็นไปตามข้อกำหนด"},{"id":226,"q":"Which ITIL component focuses on ensuring that system resources, processes, and personnel are properly allocated to meet SLA requirements?","a":["Continuity management","Availability management","Configuration management","Problem management"],"ans":"B","exp":"Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Continuity management (or business continuity management) is focused on planning for the successful restoration of systems or services after an unexpected outage, incident, or disaster. Configuration management tracks and maintains detailed information about all IT components within an organization. Problem management is focused on identifying and mitigating known problems and deficiencies before they occur.","qth":"องค์ประกอบ ITIL ใดที่มุ่งเน้นเพื่อให้แน่ใจว่าทรัพยากรระบบ กระบวนการ และบุคลากรได้รับการจัดสรรอย่างเหมาะสมเพื่อให้ตรงตามข้อกำหนด SLA","ath":["การจัดการความต่อเนื่อง","การจัดการความพร้อมใช้งาน","การจัดการการกำหนดค่า","การจัดการปัญหา"],"expth":"การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการความต่อเนื่อง (หรือการจัดการความต่อเนื่องทางธุรกิจ) มุ่งเน้นไปที่การวางแผนเพื่อการฟื้นฟูระบบหรือบริการที่ประสบความสำเร็จหลังจากการหยุดทำงาน เหตุการณ์ หรือภัยพิบัติที่ไม่คาดคิด การจัดการการกำหนดค่าติดตามและรักษาข้อมูลโดยละเอียดเกี่ยวกับส่วนประกอบไอทีทั้งหมดภายในองค์กร การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น"},{"id":227,"q":"Which ITIL component is an ongoing, iterative process of tracking all deployed and configured resources that an organization uses and depends on, whether they are hosted in a traditional data center or a cloud?","a":["Problem management","Continuity management","Availability management","Configuration management"],"ans":"D","exp":"Configuration management tracks and maintains detailed information about all IT components within an organization. Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Continuity management (or business continuity management) is focused on planning for the successful restoration of systems or services after an unexpected outage, incident, or disaster. Problem management is focused on identifying and mitigating known problems and deficiencies before they occur.","qth":"องค์ประกอบ ITIL ใดที่เป็นกระบวนการต่อเนื่องและวนซ้ำในการติดตามทรัพยากรที่ใช้งานและกำหนดค่าทั้งหมดที่องค์กรใช้และขึ้นอยู่กับว่าโฮสต์อยู่ในศูนย์ข้อมูลแบบดั้งเดิมหรือบนคลาวด์","ath":["การจัดการปัญหา","การจัดการความต่อเนื่อง","การจัดการความพร้อมใช้งาน","การจัดการการกำหนดค่า"],"expth":"การจัดการการกำหนดค่าติดตามและรักษาข้อมูลโดยละเอียดเกี่ยวกับส่วนประกอบไอทีทั้งหมดภายในองค์กร การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการความต่อเนื่อง (หรือการจัดการความต่อเนื่องทางธุรกิจ) มุ่งเน้นไปที่การวางแผนเพื่อการฟื้นฟูระบบหรือบริการที่ประสบความสำเร็จหลังจากการหยุดทำงาน เหตุการณ์ หรือภัยพิบัติที่ไม่คาดคิด การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น"},{"id":228,"q":"When beginning an audit, both the system owner and the auditors must agree on various aspects of the final audit report. Which of the following would NOT be something that is predefined as part of the audit agreement?","a":["Size","Format","Structure","Audience"],"ans":"A","exp":"Explanation The ultimate size of the audit report is not something that would ever be included in the audit scope or definition. Decisions about the content of the report should be the only factor that drives the ultimate size of the report. The structure, audience, and format of the audit report are all crucial elements that must be defined and agreed upon as part of the audit scope.","qth":"เมื่อเริ่มต้นการตรวจสอบ ทั้งเจ้าของระบบและผู้ตรวจสอบต้องตกลงกันในแง่มุมต่างๆ ของรายงานการตรวจสอบขั้นสุดท้าย ข้อใดต่อไปนี้จะไม่ใช่สิ่งที่ถูกกำหนดไว้ล่วงหน้าโดยเป็นส่วนหนึ่งของข้อตกลงการตรวจสอบ","ath":["ขนาด","รูปแบบ","โครงสร้าง","ผู้ชม"],"expth":"คำอธิบาย ขนาดสูงสุดของรายงานการตรวจสอบไม่ใช่สิ่งที่จะรวมอยู่ในขอบเขตหรือคำจำกัดความของการตรวจสอบ การตัดสินใจเกี่ยวกับเนื้อหาของรายงานควรเป็นปัจจัยเดียวที่ขับเคลื่อนขนาดสูงสุดของรายงาน โครงสร้าง ผู้ชม และรูปแบบของรายงานการตรวจสอบล้วนเป็นองค์ประกอบสำคัญที่ต้องกำหนดและ ag"},{"id":229,"q":"What concept does the D represent within the STRIDE threat model?","a":["Denial of service","Distributed","Data breach","Data loss"],"ans":"A","exp":"Any application can be a possible target of denial of service (DoS) attacks. From the application side, the developers should minimize how many operations are performed for unauthenticated users. This will keep the application running as quickly as possible and using the least amount of system resources to help minimize the impact of any such attacks. None of the other options provided is the correct term.","qth":"ตัวอักษร D ในโมเดลภัยคุกคาม STRIDE หมายถึงอะไร","ath":["Denial of service","Distributed","Data breach","Data loss"],"expth":"STRIDE: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege — D คือ Denial of service"},{"id":230,"q":"Which of the following is the concept of segregating information or processes, within the same system or application, for security reasons?","a":["Cell blocking","Sandboxing","Pooling","Fencing"],"ans":"B","exp":"Sandboxing involves the segregation and isolation of information or processes from other information or processes within the same system or application, typically for security concerns. Sandboxing is generally used for data isolation (for example, keeping different communities and populations of users isolated from others with similar data). In IT terminology, pooling typically means bringing together and consolidating resources or services, not segregating or separating them. Cell blocking and fencing are both erroneous terms.","qth":"ข้อใดต่อไปนี้เป็นแนวคิดของการแยกข้อมูลหรือกระบวนการภายในระบบหรือแอปพลิเคชันเดียวกันด้วยเหตุผลด้านความปลอดภัย","ath":["การบล็อกเซลล์","แซนด์บ็อกซ์","การรวมกลุ่ม","ฟันดาบ"],"expth":"แซนด์บ็อกซ์เกี่ยวข้องกับการแยกและการแยกข้อมูลหรือกระบวนการจากข้อมูลหรือกระบวนการอื่นภายในระบบหรือแอปพลิเคชันเดียวกัน ซึ่งโดยทั่วไปแล้วจะเกี่ยวข้องกับข้อกังวลด้านความปลอดภัย โดยทั่วไปแซนด์บ็อกซ์จะใช้สำหรับการแยกข้อมูล (เช่น แยกชุมชนและประชากรของผู้ใช้ที่แตกต่างกันออกจากผู้อื่นที่มีข้อมูลคล้ายกัน) ในคำศัพท์ด้านไอที โดยทั่วไปการรวมกลุ่มหมายถึงการรวบรวมและรวบรวมทรัพยากรหรือบริการ โดยไม่แบ่งแยกหรือแยกออกจากกัน การปิดกั้นเซลล์และการฟันดาบเป็นคำที่ผิดทั้งคู่"},{"id":231,"q":"Which cloud service category most commonly uses client-side key management systems?","a":["Software as a Service","Infrastructure as a Service","Platform as a Service","Desktop as a Service"],"ans":"A","exp":"SaaS most commonly uses client-side key management. With this type of implementation, the software for doing key management is supplied by the cloud provider, but is hosted and run by the cloud customer. This allows for full integration with the SaaS implementation, but also provides full control to the cloud customer. Although the cloud provider may offer software for performing key management to the cloud customers, with the Infrastructure, Platform, and Desktop as a Service categories, the customers would largely be responsible for their own options and implementations and would not be bound by the offerings from the cloud provider.","qth":"บริการคลาวด์ประเภทใดที่ใช้ระบบการจัดการคีย์ฝั่งไคลเอ็นต์บ่อยที่สุด","ath":["ซอฟต์แวร์เป็นบริการ","โครงสร้างพื้นฐานเป็นบริการ","แพลตฟอร์มเป็นบริการ","เดสก์ท็อปเป็นบริการ"],"expth":"SaaS มักใช้การจัดการคีย์ฝั่งไคลเอ็นต์มากที่สุด ด้วยการใช้งานประเภทนี้ ซอฟต์แวร์สำหรับจัดการคีย์จะได้รับจากผู้ให้บริการระบบคลาวด์ แต่โฮสต์และดำเนินการโดยลูกค้าระบบคลาวด์ ซึ่งช่วยให้สามารถบูรณาการเข้ากับการใช้งาน SaaS ได้อย่างสมบูรณ์ แต่ยังให้การควบคุมเต็มรูปแบบแก่ลูกค้าระบบคลาวด์อีกด้วย แม้ว่าผู้ให้บริการคลาวด์อาจเสนอซอฟต์แวร์สำหรับดำเนินการจัดการคีย์ให้กับลูกค้าคลาวด์ โดยมีหมวดหมู่โครงสร้างพื้นฐาน แพลตฟอร์ม และเดสก์ท็อปเป็นบริการ ลูกค้าส่วนใหญ่จะรับผิดชอบต่อตัวเลือกและการใช้งานของตนเอง และจะไม่ผูกพันกับข้อเสนอจากผู้ให้บริการคลาวด์"},{"id":232,"q":"Which of the following types of data would fall under data rights management (DRM) rather than information rights management (IRM)?","a":["Personnel data","Security profiles","Publications","Financial records"],"ans":"C","exp":"Whereas IRM is used to protect a broad range of data, DRM is focused specifically on the protection of consumer media, such as publications, music, movies, and so on. IRM is used to protect general institution data, so financial records, personnel data, and security profiles would all fall under the auspices of IRM.","qth":"ข้อมูลประเภทใดต่อไปนี้ที่จะอยู่ภายใต้การจัดการสิทธิ์ในข้อมูล (DRM) มากกว่าการจัดการสิทธิ์ในข้อมูล (IRM)?","ath":["ข้อมูลบุคลากร","โปรไฟล์ความปลอดภัย","สิ่งพิมพ์","บันทึกทางการเงิน"],"expth":"ในขณะที่ IRM ถูกใช้เพื่อปกป้องข้อมูลที่หลากหลาย DRM มุ่งเน้นไปที่การปกป้องสื่อผู้บริโภคโดยเฉพาะ เช่น สิ่งพิมพ์ เพลง ภาพยนตร์ และ ต่อไป IRM ถูกใช้เพื่อปกป้องข้อมูลสถาบันทั่วไป ดังนั้นบันทึกทางการเงิน ข้อมูลบุคลากร และโปรไฟล์ความปลอดภัยทั้งหมดจะอยู่ภายใต้การอุปถัมภ์ของ IRM"},{"id":233,"q":"Different security testing methodologies offer different strategies and approaches to testing systems, requiring security personnel to determine the best type to use for their specific circumstances. What does dynamic application security testing (DAST) NOT entail that SAST does?","a":["Discovery","Knowledge of the system","Scanning","Probing"],"ans":"B","exp":"Dynamic application security testing (DAST) is considered \"black-box\" testing and begins with no inside knowledge of the application or its configurations. Everything about it must be discovered during its testing. As with most types of testing, dynamic application security testing (DAST) involves probing, scanning, and a discovery process for system information.","qth":"วิธีการทดสอบความปลอดภัยที่แตกต่างกันนำเสนอกลยุทธ์และแนวทางที่แตกต่างกันในการทดสอบระบบ โดยกำหนดให้เจ้าหน้าที่รักษาความปลอดภัยกำหนดประเภทที่ดีที่สุดที่จะใช้สำหรับสถานการณ์เฉพาะของตน การทดสอบความปลอดภัยของแอปพลิเคชันแบบไดนามิก (DAST) ไม่ได้หมายความว่า SAST จะทำอะไรบ้าง","ath":["Discovery","Knowledge of the system","Scanning","Probing"],"expth":"Dynamic application security testing (DAST) is considered \"black-box\" testing and begins with no inside knowledge of the application or its configurations Everything about it must be discovered during its testing. As with most types of testing, dynamic application security testing (DAST) involves probing, scanning, and a discovery process for system information"},{"id":234,"q":"You need to gain approval to begin moving your company's data and systems into a cloud environment. However, your CEO has mandated the ability to easily remove your IT assets from the cloud provider as a precondition. Which of the following cloud concepts would this pertain to?","a":["Removability","Extraction","Portability","Reversibility"],"ans":"D","exp":"Reversibility is the cloud concept involving the ability for a cloud customer to remove all of its data and IT assets from a cloud provider. Also, processes and agreements would be in place with the cloud provider that ensure all removals have been completed fully within the agreed upon timeframe. Portability refers to the ability to easily move between different cloud providers and not be locked into a specific one. Removability and extraction are both provided as terms similar to reversibility, but neither is the official term or concept.","qth":"You need to gain approval to begin moving your company's data and systems into a cloud environment. However, your CEO has mandated the abilty to easily remove your IT assets from the cloud provider as a precondition Which of the following cloud concepts would this pertain to?","ath":["ความสามารถในการถอดออก","Extraction","Portability","Reversibility"],"expth":"Reversibility is the cloud concept involving the ability for a cloud customer to remove all of its data and IT assets from a cloud provider. Also, processes and agreements would be in place with the cloud provider that ensure all removals have been completed fully within the ag"},{"id":235,"q":"What does static application security testing (SAST) offer as a tool to the testers that makes it unique compared to other common security testing methodologies?","a":["Live testing","Source code access","Production system scanning","Injection attempts"],"ans":"B","exp":"Static application security testing (SAST) is conducted against offline systems with previous knowledge of them, including their source code. Live testing is not part of static testing but rather is associated with dynamic testing. Production system scanning is not appropriate because static testing is done against offline systems. Injection attempts are done with many different types of testing and are not unique to one particular type. It is therefore not the best answer to the question.","qth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบคงที่ (SAST) ให้อะไรเป็นเครื่องมือสำหรับผู้ทดสอบ","ath":["การทดสอบแบบสด","การเข้าถึงซอร์สโค้ด","การสแกนระบบการผลิต","ความพยายามในการฉีด"],"expth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบคงที่ (SAST) ดำเนินการด้วยความรู้เกี่ยวกับระบบ รวมถึงซอร์สโค้ด และดำเนินการกับระบบออฟไลน์"},{"id":236,"q":"Which of the following areas of responsibility always falls completely under the purview of the cloud provider, regardless of which cloud service category is used?","a":["Infrastructure","Data","Physical","Governance"],"ans":"C","exp":"Regardless of the cloud service category used, the physical environment is always the sole responsibility of the cloud provider. In many instances, the cloud provider will supply audit reports or some general information about their physical security practices, especially to those customers or potential customers that may have regulatory requirements, but otherwise the cloud customer will have very little insight into the physical environment. With IaaS, the infrastructure is a shared responsibility between the cloud provider and cloud customer. With all cloud service categories, the data and governance are always the sole responsibility of the cloud customer.","qth":"Which of the following areas of responsibility always falls completely under the purview of the cloud provider, regardless of which cloud service category is used?","ath":["Infrastructure","Data","Physical","Governance"],"expth":"Regardless of the cloud service category used, the physical environment is always the sole responsibility of the cloud provider. In many instances, the cloud provider will supply audit reports or some general information about their physical security practices, especially to those customers or potential customers that may have regulatory requirements, but otherwise the cloud customer will have very little insight into the physical environment. With laaS, the infrastructure is a shared responsibility between the cloud provider and cloud customer. With all cloud service categories, the data and governance are always the sole responsibility of the cloud customer,"},{"id":237,"q":"What type of masking would you employ to produce a separate data set for testing purposes based on production data without any sensitive information?","a":["Dynamic","Tokenized","Replicated","Static"],"ans":"D","exp":"Static masking involves taking a data set and replacing sensitive fields and values with non-sensitive or garbage data. This is done to enable testing of an application against data that resembles production data, both in size and format, but without containing anything sensitive. Dynamic masking involves the live and transactional masking of data while an application is using it. Tokenized would refer to tokenization, which is the replacing of sensitive data with a key value that can later be matched back to the original value, and although it could be used as part of the production of test data, it does not refer to the overall process. Replicated is provided as an erroneous answer, as replicated data would be identical in value and would not accomplish the production of a test set.","qth":"What type of masking would you employ to produce a separate data set for testing purposes based on production data without any sensitive information?","ath":["Dynamic","Tokenized","Replicated","Static"],"expth":"Static masking involves taking a data set and replacing sensitive fields and values with non-sensitive or garbage data. This is done to enable testing of an application against data that resembles production data, both in size and format, but without containing anything sensitive. Dynamic masking involves the live and transactional masking of data while an application is using it. Tokenized would refer to tokenization, which is the replacing of sensitive data with a key value that can later be matched back to the original value, and although it could be used as part of the production of test data, it does not refer to the overall process Replicated is provided as an erroneous answer, as replicated data would be identical in value and would not accomplish the production of a test set"},{"id":238,"q":"When an organization is considering a cloud environment for hosting BCDR solutions, which of the following would be the greatest concern?","a":["Self-service","Resource pooling","Availability","Location"],"ans":"D","exp":"If an organization wants to use a cloud service for BCDR, the location of the cloud hosting becomes a very important security consideration due to regulations and jurisdiction, which could be dramatically different from the organization's normal hosting locations. Availability is a hallmark of any cloud service provider, and likely will not be a prime consideration when an organization is considering using a cloud for BCDR; the same goes for self-service options. Resource pooling is common among all cloud systems and would not be a concern when an organization is dealing with the provisioning of resources during a disaster.","qth":"When an organization is considering a cloud environment for hosting BCDR solutions, which of the following would be the greatest concern?","ath":["Self-service","Resource pooling","ความพร้อมใช้","Location"],"expth":"If an organization wants to use a cloud service for BCDR, the location of the cloud hosting becomes a very important security consideration due to regulations and jurisdiction, which could be dramatically different from the organization's normal hosting locations. Availability is a hallmark of any cloud service provider, and likely will not be a prime consideration when an organization is considering using a cloud for BCDR; the same goes for self-service options. Resource pooling is common among all cloud systems and would not be a concern when an organization is dealing with the provisioning of resources during a disaster"},{"id":239,"q":"What type of solution is at the core of virtually all directory services?","a":["WS","LDAP","ADFS","PKI"],"ans":"B","exp":"The Lightweight Directory Access Protocol (LDAP) forms the basis of virtually all directory services, regardless of the specific vendor or software package.WS is a protocol for information exchange between two systems and does not actually store the data. ADFS is a Windows component for enabling single sign-on for the operating system and applications, but it relies on data from an LDAP server. PKI is used for managing and issuing security certificates.","qth":"What type of solution is at the core of virtually all directory services?","ath":["AWS","LDAP","ADFS","PKI"],"expth":"The Lightweight Directory Access Protocol (LDAP) forms the basis of virtually all directory services, regardless of the specific vendor or software package. WS is a protocol for information exchange between two systems and does not actually store the data. ADFS is a Windows component for enabling single sign-on for the operating system and applications, but it relies on data from an LDAP server. PKI is used for managing and issuing security certificates"},{"id":240,"q":"The different cloud service models have varying levels of responsibilities for functions and operations depending with the model's level of service. In which of the following models would the responsibility for patching lie predominantly with the cloud customer?","a":["DaaS","SaaS","PaaS","IaaS"],"ans":"D","exp":"With Infrastructure as a Service (IaaS), the cloud customer is responsible for deploying and maintaining its own systems and virtual machines. Therefore, the customer is solely responsible for patching and any other security updates it finds necessary. With Software as a Service (SaaS), Platform as a Service (PaaS), and Desktop as a Service (DaaS), the cloud provider maintains the infrastructure components and is responsible for maintaining and patching them.","qth":"The different cloud service models have varying levels of responsibilities for functions and operations depending with the model's level of service In which of the following models would the responsibility for patching lie predominantly with the cloud customer?","ath":["DaaS","SaaS","PaaS","IaaS (โครงสร้างพื้นฐานในรูปแบบบริการ)"],"expth":"With Infrastructure as a Service ([aaS), the cloud customer is responsible for deploying and maintaining its own systems and virtual machines. Therefore, the customer is solely responsible for patching and any other security updates it finds necessary. With Software as a Service (SaaS), Platform as a Service (PaaS), and Desktop as a Service (DaaS), the cloud provider maintains the infrastructure components and is responsible for maintaining and patching them"},{"id":241,"q":"Which component of ITIL involves the creation of an RFC ticket and obtaining official approvals for it?","a":["Problem management","Release management","Deployment management","Change management"],"ans":"D","exp":"The change management process involves the creation of the official Request for Change (RFC) ticket, which is used to document the change, obtain the required approvals from management and stakeholders, and track the change to completion. Release management is a subcomponent of change management, where the actual code or configuration change is put into place. Deployment management is similar to release management, but it's where changes are actually implemented on systems. Problem management is focused on the identification and mitigation of known problems and deficiencies before they are able to occur.","qth":"Which component of ITIL involves the creation of an RFC ticket and obtaining official approvals for it?","ath":["Problem management","Release management","Deployment management","Change management"],"expth":"The change management process involves the creation of the official Request for Change (RFC) ticket, which is used to document the change, obtain the required approvals from management and stakeholders, and track the change to completion. Release management is a subcomponent of change management, where the actual code or configuration change is put into place. Deployment management is similar to release management, but it's where changes are actually implemented on systems. Problem management is focused on the identification and mitigation of known problems and deficiencies before they are able to occur"},{"id":242,"q":"Which of the following are attributes of cloud computing?","a":["Minimal management effort and shared resources","High cost and unique resources","Rapid provisioning and slow release of resources","Limited access and service provider interaction"],"ans":"A","exp":"Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (e.g., networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction.","qth":"Which of the following are attributes of cloud computing?","ath":["Minimal management effort and shared resources","High cost and unique resources","Rapid provisioning and slow release of resources","Limited access and service provider interaction"],"expth":"Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (e.9., networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction"},{"id":243,"q":"In a cloud environment, encryption should be used for all the following, except:","a":["Secure sessions/VPN","Long-term storage of data","Near-term storage of virtualized images","Profile formatting"],"ans":"D","exp":"All of these activities should incorporate encryption, except for profile formatting, which is a made-up term.","qth":"กิจกรรมใดต่อไปนี้ไม่จำเป็นต้องใช้การเข้ารหัสเป็นหลัก","ath":["เซสชันปลอดภัย/VPN","การเก็บข้อมูลระยะยาว","การเก็บอิมเมจเสมือนระยะใกล้","การจัดรูปแบบโปรไฟล์"],"expth":"ทุกกิจกรรมควรใช้การเข้ารหัส ยกเว้นการจัดรูปแบบโปรไฟล์ซึ่งไม่ใช่คำที่ใช้จริงในบริบทนี้"},{"id":244,"q":"When using an IaaS solution, what is the capability provided to the customer?","a":["To provision processing, storage, networks, and other fundamental computing resources when the consumer is able to deploy and run arbitrary software, which can include OSs and applications.","To provision processing, storage, networks, and other fundamental computing resources when the auditor is able to deploy and run arbitrary software, which can include OSs and applications.","To provision processing, storage, networks, and other fundamental computing resources when the provider is able to deploy and run arbitrary software, which can include OSs and applications.","To provision processing, storage, networks, and other fundamental computing resources when the consumer is not able to deploy and run arbitrary software, which can include OSs and applications."],"ans":"A","exp":"According to “The NIST Definition of Cloud Computing,” in IaaS, “the capability provided to the consumer is to provision processing, storage, networks, and other fundamental computing resources where the consumer is able to deploy and run arbitrary software, which can include operating systems and applications. The consumer does not manage or control the underlying cloud infrastructure but has control over operating systems, storage, and deployed applications; and possibly limited control of select networking components (e.g., host firewalls).","qth":"เมื่อใช้ IaaS ความสามารถที่ลูกค้าได้รับคืออะไร","ath":["จัดสรรหน่วยประมวลผล ที่เก็บ เครือข่าย และทรัพยากรพื้นฐาน และควบคุม OS ที่เก็บ และแอปที่ติดตั้งได้","จัดสรรทรัพยากรพื้นฐานได้ แต่ผู้บริโภคไม่ควบคุมระบบปฏิบัติการ","ใช้แอปของผู้ให้บริการบนโครงสร้างคลาวด์ โดยไม่ควบคุมโครงสร้างพื้นฐาน","ใช้แอปของผู้บริโภคบนโครงสร้างคลาวด์ โดยผู้ให้บริการควบคุมระบบปฏิบัติการทั้งหมด"],"expth":"ตาม NIST ใน IaaS ผู้บริโภคจัดสรร processing, storage, networks และทรัพยากรพื้นฐาน และควบคุม OS ที่เก็บ และแอปที่ติดตั้งได้"},{"id":245,"q":"Which of the following is considered an administrative control?","a":["Keystroke logging","Access control process","Door locks","Biometric authentication"],"ans":"B","exp":"A process is an administrative control; sometimes, the process includes elements of other types of controls (in this case, the access control mechanism might be a technical control, or it might be a physical control), but the process itself is administrative. Keystroke logging is a technical control (or an attack, if done for malicious purposes, and not for auditing); door locks are a physical control; and biometric authentication is a technological control.","qth":"Which of the following is considered an administrative control?","ath":["Keystroke logging","Access control process","Door locks","Biometric authentication"],"expth":"A process is an administrative control, sometimes, the process includes elements of other types of controls (in this case, the access control mechanism might be a technical control, or it might be a physical control), but the process itself is administrative. Keystroke logging is a technical control (or an attack, if done for malicious, purposes, and not for auditing); door locks are a physical control; and biometric authentication is a technological control"},{"id":246,"q":"In which cloud service model is the customer required to maintain the OS?","a":["Iaas","CaaS","PaaS","SaaS"],"ans":"A","exp":"In IaaS, the service is bare metal, and the customer has to install the OS and the software; the customer then is responsible for maintaining that OS. In the other models, the provider installs and maintains the OS.","qth":"In which cloud service model is the customer required to maintain the OS?","ath":["IaaS (โครงสร้างพื้นฐานในรูปแบบบริการ)","CaaS","PaaS","SaaS"],"expth":"In laaS, the service is bare metal, and the customer has to install the OS and the software; the customer then is responsible for maintaining that OS. In the other models, the provider installs and maintains the OS"},{"id":247,"q":"When using a PaaS solution, what is the capability provided to the customer?","a":["To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The provider does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment.","To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment.","To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the consumer supports. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment.","To deploy onto the cloud infrastructure provider-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment."],"ans":"B","exp":"According to “The NIST Definition of Cloud Computing,” in PaaS, “the capability provided to the consumer is to deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools supported by the provider. The consumer does not manage or control the underlying cloud infrastructure including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment.","qth":"When using a PaaS solution, what is the capability provided to the customer?","ath":["To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The provider does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment","To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment","To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the consumer supports. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has, control over the deployed applications and possibly configuration settings for the application-hosting environment","To deploy onto the cloud infrastructure provider-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment"],"expth":"According to 1€The NIST Definition of Cloud Computing,a€ in PaaS, x€the capability provided to the consumer is to deploy onto the cloud infrastructure consumer created or acquired applications created using programming languages, libraries, services, and tools supported by the provider. The consumer does not manage or control the underlying cloud infrastructure including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment"},{"id":248,"q":"What are SOC 1/SOC 2/SOC 3?","a":["Audit reports","Risk management frameworks","Access controls","Software developments"],"ans":"A","exp":"An SOC 1 is a report on controls at a service organization that may be relevant to a user entity’s internal control over financial reporting. An SOC 2 report is based on the existing SysTrust and WebTrust principles. The purpose of an SOC 2 report is to evaluate an organization’s information systems relevant to security, availability, processing integrity, confidentiality, or privacy. An SOC 3 report is also based on the existing SysTrust and WebTrust principles, like a SOC 2 report. The difference is that the SOC 3 report does not detail the testing performed.","qth":"What are SOC 1/SOC 2/SOC 3?","ath":["Audit reports","Risk management frameworks","Access controls","Software developments"],"expth":"An SOC 1 is a report on controls at a service organization that may be relevant to a user entity's internal control over financial reporting. An SOC 2 report is based on the existing SysTrust and WebTrust principles. The purpose of an SOC 2 report is to evaluate an organizatior's information systems relevant to security, availabilty, processing integrity, confidentiality, or privacy. An SOC 3 report is also based on the existing SysTrust and WebTrust principles, like a SOC 2 report The difference is that the SOC 3 report does not detail the testing performed"},{"id":249,"q":"Gathering business requirements can aid the organization in determining all of this information about organizational assets, except:","a":["Full inventory","Criticality","Value","Usefulness"],"ans":"D","exp":"When we gather information about business requirements, we need to do a complete inventory, receive accurate valuation of assets (usually from the owners of those assets), and assess criticality; this collection of information does not tell us, objectively, how useful an asset is, however.","qth":"Gathering business requirements can aid the organization in determining all of this information about organizational assets, except","ath":["Full inventory","Criticality","Value","Usefulness"],"expth":"When we gather information about business requirements, we need to do a complete inventory, receive accurate valuation of assets (usually from the owners of those assets), and assess criticality; this collection of information does not tell us, objectively, how useful an asset is, however"},{"id":250,"q":"Which of the following are cloud computing roles?","a":["Cloud service broker and user","Cloud customer and financial auditor","CSP and backup service provider","Cloud service auditor and object"],"ans":"C","exp":"The following groups form the key roles and functions associated with cloud computing. They do not constitute an exhaustive list but highlight the main roles and functions within cloud computing: - Cloud customer: An individual or entity that utilizes or subscribes to cloud based services or resources. - CSP: A company that provides cloud-based platform, infrastructure, application, or storage services to other organizations or individuals, usually for a fee; otherwise known to clients “as a service. - Cloud backup service provider: A third-party entity that manages and holds operational responsibilities for cloud-based data backup services and solutions to customers from a central data center. - CSB: Typically a third-party entity or company that looks to extend or enhance value to multiple customers of cloud-based services through relationships with multiple CSPs. It acts as a liaison between cloud services customers and CSPs, selecting the best provider for each customer and monitoring the services. The CSB can be utilized as a “middleman” to broker the best deal and customize services to the customer’s requirements. May also resell cloud services. - Cloud service auditor: Third-party organization that verifies attainment of SLAs.","qth":"Which of the following are cloud computing roles?","ath":["Cloud service broker and user","Cloud customer and financial auditor","CSP and backup service provider","Cloud service auditor and object"],"expth":"The following groups form the key roles and functions associated with cloud computing. They do not constitute an exhaustive list but highlight the main roles and functions within cloud computing Cloud customer: An individual or entity that utilizes or subscribes to cloud based services or resources. CSP: A company that provides cloud-based platform, infrastructure, application, or storage services to other organizations or individuals, usually for a fee; otherwise known to clients €as a service Cloud backup service provider: A third-party entity that manages and holds operational responsibilities for cloud-based data backup services and solutions to customers from a central data center. CSB: Typically a third-party entity or company that looks to extend or enhance value to multiple custome"},{"id":251,"q":"Which of the following are considered to be the building blocks of cloud computing?","a":["CPU, RAM, storage, and networking","Data, CPU, RAM, and access control","Data, access control, virtualization, and services","Storage, networking, printing, and virtualization"],"ans":"A","exp":"","qth":"Which of the following are considered to be the building blocks of cloud computing?","ath":["CPU, RAM, storage, and networking","Data, CPU, RAM, and access control","Data, access control, virtualization, and services","Storage, networking, printing, and virtualization"],"expth":""},{"id":252,"q":"Which of the following is considered a physical control?","a":["Fences","Ceilings","Carpets","Doors"],"ans":"A","exp":"Fences are physical controls; carpets and ceilings are architectural features, and a door is not necessarily a control: the lock on the door would be a physical security control. Although you might think of a door as a potential answer, the best answer is the fence; the exam will have questions where more than one answer is correct, and the answer that will score you points is the one that is most correct.","qth":"Which of the following is considered a physical control?","ath":["Fences","Ceilings","Carpets","Doors"],"expth":"Fences are physical controls; carpets and ceilings are architectural features, and a door is not necessarily a control: the lock on the door would be a physical security control. Although you might think of a door as a potential answer, the best answer is the fence; the exam will have questions where more than one answer is correct, and the answer that will score you points is the one that is most correct"},{"id":253,"q":"What is an experimental technology that is intended to create the possibility of processing encrypted data without having to decrypt it first?","a":["Quantum-state","Polyinstantiation","Homomorphic","Gastronomic"],"ans":"C","exp":"Homomorphic encryption hopes to achieve that goal; the other options are terms that have almost nothing to do with encryption.","qth":"What is an experimental technology that is intended to create the possibilty of processing encrypted data without having to decrypt it first?","ath":["Quantum-state","Polyinstantiation","Homomorphic","Gastronomic"],"expth":"Homomorphic encryption hopes to achieve that goal; the other options are terms that have almost nothing to do with encryption"},{"id":254,"q":"To protect data on user devices in a BYOD environment, the organization should consider requiring all the following, except:","a":["Multifactor authentication","DLP agents","Two-person integrity","Local encryption"],"ans":"C","exp":"Although all the other options are ways to harden a mobile device, two-person integrity is a concept that has nothing to do with the topic, and, if implemented, would require everyone in your organization to walk around in pairs while using their mobile devices.","qth":"To protect data on user devices in a BYOD environment, the organization should consider requiring all the following, except","ath":["Multifactor authentication","DLP agents","Two-person integrity","Local encryption"],"expth":"Although all the other options are ways to harden a mobile device, two-person integrity is a concept that has nothing to do with the topic, and, if implemented, would require everyone in your organization to walk around in pairs while using their mobile devices"},{"id":255,"q":"DLP can be combined with what other security technology to enhance data controls?","a":["DRM","Hypervisor","SIEM","Kerberos"],"ans":"A","exp":"DLP can be combined with DRM to protect intellectual property; both are designed to deal with data that falls into special categories. SIEMs are used for monitoring event logs, not live data movement. Kerberos is an authentication mechanism. Hypervisors are used for virtualization.","qth":"DLP can be combined with what other security technology to enhance data controls?","ath":["DRM","Hypervisor","SIEM","Kerberos"],"expth":"DLP can be combined with DRM to protect intellectual property; both are designed to"},{"id":256,"q":"What is the intellectual property protection for a confidential recipe for muffins?","a":["Patent","Trademark","Trade secret","Copyright"],"ans":"C","exp":"Confidential recipes unique to the organization are trade secrets. The other answers listed are answers to other questions.","qth":"What is the intellectual property protection for a confidential recipe for muffins?","ath":["Patent","Trademark","Trade secret","Copyright"],"expth":"Confidential recipes unique to the organization are trade secrets. The other answers listed are answers to other questions"},{"id":257,"q":"Every security program and process should have which of the following?","a":["Severe penalties","Multifactor authentication","Foundational policy","Homomorphic encryption"],"ans":"C","exp":"Policy drives all programs and functions in the organization; the organization should not conduct any operations that don’t have a policy governing them. Penalties may or may not be an element of policy, and severity depends on the topic. Multifactor authentication and homomorphic encryption are red herrings here.","qth":"Every security program and process should have which of the following?","ath":["Severe penalties","Multifactor authentication","Foundational policy","Homomorphic encryption"],"expth":"Policy drives all programs and functions in the organization; the organization should not conduct any operations that dor't have a policy governing them. Penalties may or may not be an element of policy, and severity depends on the topic. Multifactor authentication and homomorphic encryption are red herrings here"},{"id":258,"q":"All policies within the organization should include a section that includes all of the following, except:","a":["Policy adjudication","Policy maintenance","Policy review","Policy enforcement"],"ans":"A","exp":"All the elements except adjudication need to be addressed in each policy. Adjudication is not an element of policy.","qth":"All policies within the organization should include a section that includes all of the following, except","ath":["Policy adjudication","Policy maintenance","Policy review","Policy enforcement"],"expth":"All the elements except adjudication need to be addressed in each policy. Adjudication is not an element of policy"},{"id":259,"q":"What is the experimental technology that might lead to the possibility of processing encrypted data without having to decrypt it first?","a":["AES","Link encryption","One-time pads","Homomorphic encryption"],"ans":"D","exp":"AES is an encryption standard. Link encryption is a method for protecting communications traffic. One-time pads are an encryption method.","qth":"เทคโนโลยีทดลองใดที่อาจนำไปสู่ความเป็นไปได้ในการประมวลผลข้อมูลที่เข้ารหัสโดยไม่ต้องถอดรหัสก่อน","ath":["AES","การเข้ารหัสลิงก์","แผ่นแบบครั้งเดียว","การเข้ารหัสแบบ Homomorphic"],"expth":"AES เป็นมาตรฐานการเข้ารหัส การเข้ารหัสลิงก์เป็นวิธีหนึ่งในการป้องกันการรับส่งข้อมูลการสื่อสาร แพดแบบครั้งเดียวเป็นวิธีการเข้ารหัส"},{"id":260,"q":"Data labels could include all the following, except:","a":["Multifactor authentication","Access restrictions","Confidentiality level","Distribution limitations"],"ans":"A","exp":"All the others might be included in data labels, but multifactor authentication is a procedure used for access control, not a label.","qth":"ป้ายกำกับข้อมูลอาจมีสิ่งต่อไปนี้ทั้งหมด ยกเว้น:","ath":["การตรวจสอบสิทธิ์แบบหลายปัจจัย","ข้อจำกัดการเข้าถึง","ระดับการรักษาความลับ","ข้อจำกัดในการเผยแพร่"],"expth":"อื่นๆ ทั้งหมดอาจรวมอยู่ในป้ายกำกับข้อมูล แต่การตรวจสอบสิทธิ์แบบหลายปัจจัยเป็นขั้นตอนที่ใช้สำหรับการควบคุมการเข้าถึง ไม่ใช่ป้ายกำกับ"},{"id":261,"q":"The goals of DLP solution implementation include all of the following, except:","a":["Elasticity","Policy enforcement","Data discovery","Loss of mitigation"],"ans":"A","exp":"DLP does not have anything to do with elasticity, which is the capability of the environment to scale up or down according to demand. All the rest are goals of DLP implementations.","qth":"เป้าหมายของการนำโซลูชัน DLP ไปใช้ประกอบด้วยสิ่งต่อไปนี้ทั้งหมด ยกเว้น","ath":["ความยืดหยุ่น","การบังคับใช้นโยบาย","การค้นพบข้อมูล","การสูญเสียการบรรเทาผลกระทบ"],"expth":"DLP ไม่มีส่วนเกี่ยวข้องกับความยืดหยุ่น ซึ่งเป็นความสามารถของสภาพแวดล้อมในการขยายขนาดหรือลดขนาดตามความต้องการ ที่เหลือทั้งหมดเป็นเป้าหมายของการนำ DLP ไปใช้"},{"id":262,"q":"What is the intellectual property protection for the tangible expression of a creative idea?","a":["Trade secret","Copyright","Trademark","Patent"],"ans":"B","exp":"Copyrights are protected tangible expressions of creative works. The other answers listed are answers to subsequent questions.","qth":"การคุ้มครองทรัพย์สินทางปัญญาสำหรับการแสดงออกที่จับต้องได้ของความคิดสร้างสรรค์คืออะไร","ath":["ความลับทางการค้า","ลิขสิทธิ์","เครื่องหมายการค้า","สิทธิบัตร"],"expth":"ลิขสิทธิ์ได้รับการคุ้มครองการแสดงออกที่จับต้องได้ของงานสร้างสรรค์ คำตอบอื่นๆ ที่แสดงเป็นคำตอบสำหรับคำถามต่อๆ ไป"},{"id":263,"q":"The goals of SIEM solution implementation include all of the following, except:","a":["Dashboarding","Performance enhancement","Trend analysis","Centralization of log streams"],"ans":"B","exp":"SIEM does not intend to provide any enhancement of performance; in fact, a SIEM solution may decrease performance because of additional overhead. All the rest are goals of SIEM implementations.","qth":"เป้าหมายของการนำโซลูชัน SIEM ไปใช้ประกอบด้วยสิ่งต่อไปนี้ทั้งหมด ยกเว้น","ath":["แดชบอร์ด","การเพิ่มประสิทธิภาพการทำงาน","การวิเคราะห์แนวโน้ม","การรวมศูนย์ของสตรีมบันทึก"],"expth":"SIEM ไม่ได้ตั้งใจที่จะจัดให้มีการปรับปรุงประสิทธิภาพใดๆ ที่จริงแล้ว โซลูชัน SIEM อาจลดประสิทธิภาพลงเนื่องจากมีค่าใช้จ่ายเพิ่มเติม ที่เหลือทั้งหมดเป็นเป้าหมายของการนำ SIEM ไปใช้"},{"id":264,"q":"All of the following are terms used to described the practice of obscuring original raw data so that only a portion is displayed for operational purposes, except:","a":["Tokenization","Masking","Data discovery","Obfuscation"],"ans":"C","exp":"Data discovery is a term used to describe the process of identifying information according to specific traits or categories. The rest are all methods for obscuring data.","qth":"ข้อใดไม่ใช่คำที่ใช้เรียกการปกปิดข้อมูลดิบเดิมให้เห็นเพียงบางส่วน","ath":["Tokenization","Masking","Data discovery","Obfuscation"],"expth":"Data discovery คือการค้นหา/ระบุข้อมูล ไม่ใช่วิธีปกปิดข้อมูล"},{"id":265,"q":"All the following are data analytics modes, except:","a":["Datamining","Agile business intelligence","Refractory iterations","Real-time analytics"],"ans":"C","exp":"All the others are data analytics methods, but “refractory iterations” is a nonsense term thrown in as a red herring.","qth":"ทั้งหมดต่อไปนี้เป็นโหมดการวิเคราะห์ข้อมูล ยกเว้น","ath":["การขุดข้อมูล","ระบบธุรกิจอัจฉริยะแบบ Agile","การทำซ้ำแบบทนไฟ","การวิเคราะห์แบบเรียลไทม์"],"expth":"วิธีอื่นๆ ทั้งหมดเป็นวิธีการวิเคราะห์ข้อมูล แต่การวนซ้ำแบบทนไฟ€เป็นคำที่ไร้สาระที่ถูกโยนเข้ามาในฐานะปลาเฮอริ่งแดง"},{"id":266,"q":"What are the U.S. State Department controls on technology exports known as?","a":["DRM","ITAR","EAR","EAL"],"ans":"B","exp":"ITAR is a Department of State program. Evaluation assurance levels are part of the Common Criteria standard from ISO. Digital rights management tools are used for protecting electronic processing of intellectual property.","qth":"การควบคุมการส่งออกเทคโนโลยีของกระทรวงการต่างประเทศสหรัฐฯ เรียกว่าอะไร?","ath":["DRM","ITAR","EAR","EAL (ระดับการรับประกันการประเมิน)"],"expth":"ITAR เป็นโครงการของกระทรวงการต่างประเทศ ระดับการรับประกันการประเมินเป็นส่วนหนึ่งของมาตรฐาน Common Criteria จาก ISO เครื่องมือการจัดการสิทธิ์ดิจิทัลใช้เพื่อปกป้องการประมวลผลทรัพย์สินทางปัญญาทางอิเล็กทรอนิกส์"},{"id":267,"q":"DLP can be combined with what other security technology to enhance data controls?","a":["SIEM","Hypervisors","DRM","Kerberos"],"ans":"C","exp":"DLP can be combined with DRM to protect intellectual property; both are designed to deal with data that falls into special categories. SIEMs are used for monitoring event logs, not live data movement. Kerberos is an authentication mechanism. Hypervisors are used for virtualization.","qth":"DLP สามารถใช้ร่วมกับเทคโนโลยีความปลอดภัยอื่นๆ เพื่อปรับปรุงการควบคุมข้อมูลได้หรือไม่","ath":["SIEM","ไฮเปอร์ไวเซอร์","DRM","Kerberos"],"expth":"DLP สามารถใช้ร่วมกับ DRM เพื่อปกป้องทรัพย์สินทางปัญญา; ทั้งสองได้รับการออกแบบมาเพื่อ"},{"id":268,"q":"Data masking can be used to provide all of the following functionality, except:","a":["Test data in sandboxed environments","Authentication of privileged users","Enforcing least privilege","Secure remote access"],"ans":"B","exp":"Data masking does not support authentication in any way. All the others are excellent use cases for data masking.","qth":"การมาสก์ข้อมูลสามารถใช้เพื่อจัดเตรียมฟังก์ชันการทำงานทั้งหมดต่อไปนี้ ยกเว้น","ath":["ทดสอบข้อมูลในสภาพแวดล้อมแบบแซนด์บ็อกซ์","การตรวจสอบสิทธิ์ของผู้ใช้ที่มีสิทธิ์พิเศษ","การบังคับใช้สิทธิ์ขั้นต่ำ","การเข้าถึงระยะไกลที่ปลอดภัย"],"expth":"การมาสก์ข้อมูลไม่สนับสนุนการตรวจสอบสิทธิ์ในทางใดทางหนึ่ง ส่วนอื่นๆ ทั้งหมดเป็นกรณีการใช้งานที่ยอดเยี่ยมสำหรับการปกปิดข้อมูล"},{"id":269,"q":"Tokenization requires two distinct _________________ .","a":["Personnel","Authentication factors","Encryption keys","Databases"],"ans":"D","exp":"In order to implement tokenization, there will need to be two databases: the database containing the raw, original data, and the token database containing tokens that map to original data. Having two-factor authentication is nice, but certainly not required. Encryption keys are not necessary for tokenization. Two-person integrity does not have anything to do with tokenization.","qth":"การทำให้เป็นโทเค็นต้องใช้สองบุคคลที่แตกต่างกัน","ath":["บุคลากร","ปัจจัยการตรวจสอบสิทธิ์","คีย์การเข้ารหัส","ฐานข้อมูล"],"expth":"เพื่อที่จะนำโทเค็นไปใช้ จะต้องมีฐานข้อมูลสองแห่ง: ฐานข้อมูลที่ประกอบด้วยข้อมูลดิบที่เป็นต้นฉบับ และฐานข้อมูลโทเค็นที่มีโทเค็นที่แมปกับข้อมูลต้นฉบับ การมีการรับรองความถูกต้องด้วยสองปัจจัยเป็นสิ่งที่ดี แต่ก็ไม่จำเป็นอย่างแน่นอน คีย์การเข้ารหัสไม่จำเป็นสำหรับโทเค็น ความซื่อสัตย์ของคนสองคนไม่มีส่วนเกี่ยวข้องกับการสร้างโทเค็น"},{"id":270,"q":"Best practices for key management include all of the following, except:","a":["Ensure multifactor authentication","Pass keys out of band","Have key recovery processes","Maintain key security"],"ans":"A","exp":"We should do all of these except for requiring multifactor authentication, which is pointless in key management.","qth":"แนวทางปฏิบัติที่ดีที่สุดสำหรับการจัดการคีย์รวมถึงสิ่งต่อไปนี้ทั้งหมด ยกเว้น","ath":["ตรวจสอบให้แน่ใจว่ามีการตรวจสอบสิทธิ์แบบหลายปัจจัย","ส่งคีย์ออกจากแบนด์","มีกระบวนการกู้คืนคีย์","รักษาความปลอดภัยของคีย์"],"expth":"เราควรดำเนินการทั้งหมดเหล่านี้ ยกเว้นการกำหนดให้ต้องมีการตรวจสอบสิทธิ์แบบหลายปัจจัย ซึ่งไม่มีจุดหมายในการจัดการคีย์"},{"id":271,"q":"What is the correct order of the phases of the data life cycle?","a":["Create, Use, Store, Share, Archive, Destroy","Create, Archive, Store, Share, Use, Destroy","Create, Store, Use, Archive, Share, Destroy","Create, Store, Use, Share, Archive, Destroy"],"ans":"D","exp":"The other options are the names of the phases, but out of proper order.","qth":"ลำดับที่ถูกต้องของระยะของวงจรชีวิตข้อมูลคืออะไร","ath":["สร้าง ใช้ จัดเก็บ แบ่งปัน เก็บถาวร ทำลาย","สร้าง เก็บถาวร จัดเก็บ แบ่งปัน ใช้ ทำลาย","สร้าง จัดเก็บ ใช้ เก็บถาวร แบ่งปัน ทำลาย","สร้าง จัดเก็บ ใช้ แบ่งปัน เก็บถาวร ทำลาย"],"expth":"ตัวเลือกอื่น ๆ คือชื่อของเฟส แต่ไม่อยู่ใน สั่งซื้อที่เหมาะสม"},{"id":272,"q":"What is the experimental technology that might lead to the possibility of processing encrypted data without having to decrypt it first?","a":["One-time pads","Link encryption","Homomorphic encryption","AES"],"ans":"C","exp":"AES is an encryption standard. Link encryption is a method for protecting communications traffic. One-time pads are an encryption method.","qth":"เทคโนโลยีทดลองใดที่อาจนำไปสู่ความเป็นไปได้ในการประมวลผลข้อมูลที่เข้ารหัสโดยไม่ต้องถอดรหัสก่อน","ath":["แผ่นแบบครั้งเดียว","การเข้ารหัสลิงก์","การเข้ารหัสแบบ Homomorphic","AES"],"expth":"AES เป็นมาตรฐานการเข้ารหัส การเข้ารหัสลิงก์เป็นวิธีหนึ่งในการป้องกันการรับส่งข้อมูลการสื่อสาร แพดแบบครั้งเดียวเป็นวิธีการเข้ารหัส"},{"id":273,"q":"What are third-party providers of IAM functions for the cloud environment?","a":["AESs","SIEMs","DLPs","CASBs"],"ans":"D","exp":"Data loss, leak prevention, and protection is a family of tools used to reduce the possibility of unauthorized disclosure of sensitive information. SIEMs are tools used to collate and manage log data. AES is an encryption standard.","qth":"ผู้ให้บริการฟังก์ชัน IAM บุคคลที่สามสำหรับสภาพแวดล้อมระบบคลาวด์คืออะไร","ath":["AESs","SIEMs","DLPs","CASBs"],"expth":"การสูญหายของข้อมูล การป้องกันการรั่วไหล และการป้องกันคือกลุ่มเครื่องมือที่ใช้เพื่อลดความเป็นไปได้ของการเปิดเผยข้อมูลที่ละเอียดอ่อนโดยไม่ได้รับอนุญาต SIEM เป็นเครื่องมือที่ใช้ในการเปรียบเทียบและจัดการข้อมูลบันทึก AES เป็นมาตรฐานการเข้ารหัส"},{"id":274,"q":"Data labels could include all the following, except:","a":["Data value","Data of scheduled destruction","Date data was created","Data owner"],"ans":"A","exp":"All the others might be included in data labels, but we don’t usually include data value, since it is prone to change frequently, and because it might not be information we want to disclose to anyone who does not have need to know.","qth":"ป้ายกำกับข้อมูลอาจมีรายการต่อไปนี้ทั้งหมด ยกเว้น:","ath":["ค่าข้อมูล","ข้อมูลการทำลายตามกำหนดเวลา","วันที่สร้างข้อมูล","เจ้าของข้อมูล"],"expth":"รายการอื่นๆ ทั้งหมดอาจรวมอยู่ในป้ายกำกับข้อมูล แต่โดยปกติแล้วเราจะไม่รวมค่าข้อมูล เนื่องจากมีแนวโน้มที่จะเปลี่ยนแปลงบ่อยครั้ง และเนื่องจากอาจไม่ใช่ข้อมูลที่เราต้องการเปิดเผยแก่ใครก็ตามที่ไม่จำเป็นต้องทราบ"},{"id":275,"q":"All of these are methods of data discovery, except:","a":["Label-based","User-based","Content-based","Metadata-based"],"ans":"B","exp":"All the others are valid methods of data discovery; user-based is a red herring with no meaning.","qth":"ทั้งหมดนี้เป็นวิธีการค้นพบข้อมูล ยกเว้น","ath":["ตามป้ายกำกับ","ตามผู้ใช้","ตามเนื้อหา","ตามข้อมูลเมตา"],"expth":"วิธีอื่นๆ ทั้งหมดเป็นวิธีการที่ถูกต้องในการค้นพบข้อมูล ขึ้นอยู่กับผู้ใช้เป็นปลาเฮอริ่งแดงที่ไม่มีความหมาย"},{"id":276,"q":"The various models generally available for cloud BC/DR activities include all of the following except:","a":["Private architecture, cloud backup","Cloud provider, backup from another cloud provider","Cloud provider, backup from same provider","Cloud provider, backup from private provider"],"ans":"D","exp":"This is not a normal configuration and would not likely provide genuine benefit.","qth":"The various models generally available for cloud BC/DR activities include all of the following except","ath":["Private architecture, cloud backup","Cloud provider, backup from another cloud provider","Cloud provider, backup from same provider","Cloud provider, backup from private provider"],"expth":"This is not a normal configuration and would not likely provide genuine benef"},{"id":277,"q":"When reviewing the BIA after a cloud migration, the organization should take into account new factors related to data breach impacts. One of these new factors is:","a":["Many states have data breach notification laws.","Breaches can cause the loss of proprietary data.","Breaches can cause the loss of intellectual property.","Legal liabil
