<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CCSP Practice Quiz — EN / TH · 307 ข้อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url("https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap");
:root{
  --bg:#0f1419; --bg2:#161d27; --card:#1c2533; --line:#2a3648;
  --text:#e8eef7; --muted:#93a0b5; --accent:#4cc9f0; --accent2:#7c5cff;
  --good:#2ecc71; --bad:#ff5d73; --warn:#ffc857; --chip:#243044; --th:#9ec5ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:15px/1.55 "Sarabun","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit}
.app{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#081018}
h1{font-size:1.15rem;margin:0}
.sub{color:var(--muted);font-size:.82rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.chip b{color:var(--text);font-weight:650}
.langbar{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:fit-content}
.langbar button{background:var(--bg2);border:0;color:var(--muted);padding:8px 16px;cursor:pointer}
.langbar button.on{background:linear-gradient(135deg,#1e8fb8,#4cc9f0);color:#06202a;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select,.btn{
  background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 12px
}
.toolbar input{min-width:220px;flex:1}
.btn{cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,#1e8fb8,#4cc9f0);color:#06202a;font-weight:700;border:0}
.btn.ghost{background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.82rem}
.qtext{font-size:1.08rem;font-weight:600;margin:0 0 6px;white-space:pre-wrap}
.qth{color:var(--th);font-weight:500;font-size:1rem;margin:0 0 16px;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%;color:var(--text)}
.opt:hover{border-color:#4a5d78}
.letter{flex:0 0 28px;height:28px;border-radius:8px;background:#2a3648;display:grid;place-items:center;font-weight:700}
.optbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.optbody .en{font-weight:600}
.optbody .th{color:var(--th);font-size:.92rem}
.opt.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--good);background:rgba(46,204,113,.08)}
.opt.correct .letter{background:var(--good);color:#06210f}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.08)}
.opt.wrong .letter{background:var(--bad);color:#2a050c}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:#132033;border:1px solid #2a4a66;display:none}
.explain.show{display:block}
.explain h3{margin:0 0 6px;font-size:.85rem;color:var(--accent)}
.exp-en,.exp-th{margin:6px 0}
.exp-th{color:var(--th)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.progress{height:8px;background:#243044;border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .25s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:16px}
.gbtn{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);cursor:pointer}
.gbtn.cur{outline:2px solid var(--accent)}
.gbtn.ok{background:rgba(46,204,113,.18);color:var(--good);border-color:transparent}
.gbtn.no{background:rgba(255,93,115,.18);color:var(--bad);border-color:transparent}
.gbtn.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.disclaimer{margin-top:22px;color:var(--muted);font-size:.78rem;line-height:1.45}
.k{font-size:.75rem;color:var(--muted)}
@media (max-width:640px){
  .qtext{font-size:1rem}
  .toolbar input{min-width:0;width:100%}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <h1 id="title">แบบฝึกหัด CCSP</h1>
        <div class="sub" id="subtitle">โหมดเรียน ไทย / อังกฤษ · GratisExam 307 ข้อ</div>
      </div>
    </div>
    <div class="stats">
      <span class="chip"><span id="lblQ">ข้อ</span> <b id="pos">1</b> / <b id="total">0</b></span>
      <span class="chip"><span id="lblScore">คะแนน</span> <b id="score">0</b></span>
      <span class="chip"><span id="lblAns">ตอบแล้ว</span> <b id="answered">0</b></span>
      <span class="chip"><span id="lblAcc">ความแม่นยำ</span> <b id="acc">—</b></span>
      <span class="chip"><span id="lblTr">แปลแล้ว</span> <b id="trcount">0</b></span>
    </div>
  </header>

  <div class="langbar" role="tablist" aria-label="Language">
    <button type="button" id="langEN">English</button>
    <button type="button" id="langTH">ไทย</button>
    <button type="button" id="langBOTH" class="on">ทั้งสอง · Both</button>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="Search / ค้นหา…" />
    <select id="filter">
      <option value="all">All / ทั้งหมด</option>
      <option value="unseen">Unanswered / ยังไม่ตอบ</option>
      <option value="flagged">Flagged / ติดธง</option>
      <option value="wrong">Incorrect / ตอบผิด</option>
      <option value="right">Correct / ตอบถูก</option>
    </select>
    <button class="btn" id="shuffleBtn">สุ่มข้อ</button>
    <button class="btn" id="resetBtn">ล้างความคืบหน้า</button>
    <button class="btn" id="examBtn">โหมดสอบ: ปิด</button>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <section class="card" id="card">
    <div class="qmeta">
      <span id="qid">Q1</span>
      <span><button class="btn ghost" id="flagBtn">☆ ติดธง</button></span>
    </div>
    <p class="qtext" id="qtext"></p>
    <p class="qth" id="qth"></p>
    <div class="opts" id="opts"></div>
    <div class="explain" id="explain">
      <h3 id="exph">คำอธิบาย</h3>
      <div id="expbody"></div>
    </div>
    <div class="nav">
      <button class="btn" id="prevBtn">← ข้อก่อน</button>
      <button class="btn primary" id="nextBtn">ข้อถัดไป →</button>
      <span class="k" id="keys">คีย์: A–D เลือก · N ถัดไป · P ก่อน · F ธง · T ภาษา</span>
    </div>
  </section>

  <h2 style="font-size:.95rem;margin:22px 0 8px;color:var(--muted)" id="jumpH">ข้ามไปยังข้อ</h2>
  <div class="grid" id="grid"></div>
  <p class="disclaimer" id="disc"></p>
</div>
<script>
const LETTERS = ["A","B","C","D"];
const BANK = [{"id":1,"q":"Which of the following is not a component of contractual PII?","a":["Scope of processing","Value of data","Location of data","Use of subcontractors"],"ans":"B","exp":"[Key corrected from source dump. Dump listed C (location of data). Value of data is not a contractual-PII component; location is.] The value of data itself has nothing to do with it being considered a part of contractual","qth":"ข้อใดต่อไปนี้ไม่ใช่องค์ประกอบของ PII ตามสัญญา","ath":["ขอบเขตของการประมวลผล","มูลค่าของข้อมูล","ตำแหน่งของข้อมูล","การใช้ผู้รับเหมาช่วง"],"expth":"มูลค่าของข้อมูลนั้นไม่เกี่ยวข้องกับ PII ตามสัญญา โดยทั่วไปส่วนประกอบ PII ตามสัญญาจะรวมถึงขอบเขตของการประมวลผล ตำแหน่งของข้อมูล การใช้ผู้รับเหมาช่วง การควบคุมความปลอดภัย การส่งคืน/การลบข้อมูล และสิทธิ์ในการตรวจสอบ (ดัมพ์อยู่ในรายการ C; ฉันทามติของชุมชนคือ B)"},{"id":2,"q":"Which of the following concepts refers to a cloud customer paying only for the resources and offerings they use within a cloud environment, and only for the duration that they are consuming them?","a":["Consumable service","Measured service","Billable service","Metered service"],"ans":"B","exp":"Measured service is where cloud services are delivered and billed in a metered way, where the cloud customer only pays for those that they actually use, and for the duration of time that they use them.","qth":"แนวคิดใดต่อไปนี้หมายถึงลูกค้าระบบคลาวด์ที่ชำระเงินเฉพาะทรัพยากรและข้อเสนอที่พวกเขาใช้ภายในสภาพแวดล้อมระบบคลาวด์ และเฉพาะตามระยะเวลาที่พวกเขาใช้งานเท่านั้น","ath":["บริการแบบสิ้นเปลือง","บริการที่วัดผล","บริการที่เรียกเก็บเงินได้","บริการแบบคิดค่าบริการตามปริมาณข้อมูล"],"expth":"บริการแบบวัดคือที่ที่บริการระบบคลาวด์ถูกส่งมอบและเรียกเก็บเงินในลักษณะแบบคิดค่าบริการตามปริมาณ โดยที่ลูกค้าระบบคลาวด์เท่านั้น จ่ายตามที่พวกเขาใช้จริง และตามระยะเวลาที่พวกเขาใช้งาน"},{"id":3,"q":"Which of the following roles involves testing, monitoring, and securing cloud services for an organization?","a":["Cloud service integrator","Cloud service business manager","Cloud service user","Cloud service administrator"],"ans":"D","exp":"The cloud service administrator is responsible for testing cloud services, monitoring services, administering security for services, providing usage reports on cloud services, and addressing problem reports","qth":"บทบาทใดต่อไปนี้ที่เกี่ยวข้องกับการทดสอบ การตรวจสอบ และการรักษาความปลอดภัยบริการคลาวด์สำหรับองค์กร","ath":["ผู้รวมบริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์","ผู้ใช้บริการคลาวด์","ผู้ดูแลระบบบริการคลาวด์"],"expth":"ผู้ดูแลระบบบริการคลาวด์มีหน้าที่รับผิดชอบในการทดสอบบริการคลาวด์ ตรวจสอบบริการ บริหารจัดการความปลอดภัยสำหรับบริการ จัดทำรายงานการใช้งานบนบริการคลาวด์ และจัดการรายงานปัญหา"},{"id":4,"q":"Which data formats are most commonly used with the REST API?","a":["JSON and SAML","XML and SAML","XML and JSON","SAML and HTML"],"ans":"C","exp":"JavaScript Object Notation (JSON) and Extensible Markup Language (XML) are the most commonly used data formats for the Representational State Transfer (REST) API, and are typically implemented with caching for increased scalability and performance.","qth":"รูปแบบข้อมูลใดที่ใช้บ่อยที่สุดกับ REST API","ath":["JSON และ SAML","XML และ SAML","XML และ JSON","SAML และ HTML"],"expth":"JavaScript Object Notation (JSON) และ Extensible Markup Language (XML) เป็นรูปแบบข้อมูลที่ใช้บ่อยที่สุดสำหรับ Representational State Transfer (REST) API และโดยทั่วไปจะนำไปใช้กับ แคชเพื่อเพิ่มความสามารถในการขยายและประสิทธิภาพ"},{"id":5,"q":"Which of the following threat types involves an application that does not validate authorization for portions of itself after the initial checks?","a":["Injection","Missing function-level access control","Cross-site request forgery","Cross-site scripting"],"ans":"B","exp":"It is imperative that an application perform checks when each function or portion of the application is accessed, to ensure that the user is properly authorized to access it. Without continual checks each time a function is accessed, an attacker could forge requests to access portions of the application where authorization has not been granted.","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับแอปพลิเคชันที่ไม่ตรวจสอบการอนุญาตสำหรับส่วนของตัวเองหลังจากการตรวจสอบครั้งแรก","ath":["การฉีด","การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การปลอมแปลงคำขอข้ามไซต์","การเขียนสคริปต์ข้ามไซต์"],"expth":"จำเป็นที่แอปพลิเคชันจะต้องตรวจสอบเมื่อมีการเข้าถึงแต่ละฟังก์ชันหรือส่วนของแอปพลิเคชัน เพื่อให้แน่ใจว่าผู้ใช้ ได้รับอนุญาตให้เข้าถึงอย่างถูกต้อง หากไม่มีการตรวจสอบอย่างต่อเนื่องในแต่ละครั้งที่มีการเข้าถึงฟังก์ชัน ผู้โจมตีสามารถปลอมแปลงคำขอเพื่อเข้าถึงบางส่วนของแอปพลิเคชันที่ไม่ได้รับการอนุญาต"},{"id":6,"q":"Which of the following roles involves overseeing billing, purchasing, and requesting audit reports for an organization within a cloud environment?","a":["Cloud service user","Cloud service business manager","Cloud service administrator","Cloud service integrator"],"ans":"B","exp":"The cloud service business manager is responsible for overseeing business and billing administration, purchasing cloud services, and requesting audit reports when necessary","qth":"บทบาทใดต่อไปนี้ที่เกี่ยวข้องกับการดูแลการเรียกเก็บเงิน การจัดซื้อ และการขอรายงานการตรวจสอบสำหรับองค์กรภายในสภาพแวดล้อมคลาวด์","ath":["ผู้ใช้บริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์","ผู้ดูแลระบบบริการคลาวด์","ผู้รวมบริการคลาวด์"],"expth":"ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่รับผิดชอบในการดูแลธุรกิจและการบริหารการเรียกเก็บเงิน การจัดซื้อบริการคลาวด์ และการขอรายงานการตรวจสอบเมื่อจำเป็น"},{"id":7,"q":"Which of the following cloud aspects complicates eDiscovery?","a":["Resource pooling","On-demand self-service","Multitenancy","Measured service"],"ans":"C","exp":"With multitenancy, eDiscovery becomes more complicated because the data collection involves extra steps to ensure that only those customers or systems that are within scope are turned over to the requesting authority.","qth":"ลักษณะระบบคลาวด์ข้อใดต่อไปนี้ทำให้ eDiscovery ซับซ้อน","ath":["การรวมทรัพยากร","การบริการตนเองตามความต้องการ","การเช่าหลายรายการ","บริการที่วัดผล"],"expth":"ด้วยการเช่าหลายรายการ eDiscovery จะซับซ้อนมากขึ้นเนื่องจากการรวบรวมข้อมูลเกี่ยวข้องกับขั้นตอนเพิ่มเติมเพื่อให้แน่ใจว่าเฉพาะลูกค้าหรือระบบที่อยู่ภายในขอบเขตเท่านั้นที่จะถูกส่งต่อไปยังหน่วยงานที่ร้องขอ"},{"id":8,"q":"What does the management plane typically utilize to perform administrative functions on the hypervisors that it has access to?","a":["Scripts","RDP","APIs","XML"],"ans":"C","exp":"The functions of the management plane are typically exposed as a series of remote calls and function executions and as a set of APIs. These APIs are typically leveraged through either a client or a web portal, with the latter being the most common.","qth":"โดยทั่วไปแล้ว Management Plane จะใช้อะไรเพื่อทำหน้าที่การดูแลระบบบนไฮเปอร์ไวเซอร์ที่สามารถเข้าถึงได้?","ath":["สคริปต์","RDP","APIs","XML"],"expth":"ฟังก์ชันของ Management Plane โดยทั่วไปจะถูกเปิดเผยเป็นชุดของการเรียกระยะไกลและการดำเนินการฟังก์ชัน และเป็นชุดของ API โดยทั่วไปแล้ว API เหล่านี้จะถูกใช้ประโยชน์ผ่านทางไคลเอนต์หรือเว็บพอร์ทัล โดยอย่างหลังจะเป็นแบบที่พบบ่อยที่สุด"},{"id":9,"q":"What is a serious complication an organization faces from the perspective of compliance with international operations?","a":["Different certifications","Multiple jurisdictions","Different capabilities","Different operational procedures"],"ans":"B","exp":"When operating within a global framework, a security professional runs into a multitude of jurisdictions and requirements, and many times they might be in contention with one other or not clearly applicable. These requirements can include the location of the users and the type of data they enter into systems, the laws governing the organization that owns the application and any regulatory requirements they may have, as well as the appropriate laws and regulations for the jurisdiction housing the IT resources and where the data is actually stored, which might be multiple jurisdictions as well.","qth":"ภาวะแทรกซ้อนร้ายแรงที่องค์กรเผชิญจากมุมมองของการปฏิบัติตามการดำเนินงานระหว่างประเทศคืออะไร","ath":["การรับรองที่แตกต่างกัน","เขตอำนาจศาลหลายแห่ง","ความสามารถที่แตกต่างกัน","ขั้นตอนการปฏิบัติงานที่แตกต่างกัน"],"expth":"เมื่อปฏิบัติงานภายในกรอบการทำงานระดับโลก ผู้เชี่ยวชาญด้านความปลอดภัยจะต้องพบกับเขตอำนาจศาลและข้อกำหนดมากมาย และหลายครั้งที่พวกเขาอาจขัดแย้งกันเองหรือไม่สามารถนำไปใช้ได้อย่างชัดเจน ข้อกำหนดเหล่านี้อาจรวมถึงตำแหน่งของผู้ใช้และประเภทของข้อมูลที่ผู้ใช้ป้อนเข้าสู่ระบบ กฎหมายที่ควบคุมองค์กรที่เป็นเจ้าของแอปพลิเคชันและข้อกำหนดด้านกฎระเบียบใดๆ ที่ผู้ใช้อาจมี ตลอดจนกฎหมายและข้อบังคับที่เหมาะสมสำหรับเขตอำนาจศาลที่เป็นที่เก็บทรัพยากรด้านไอที และสถานที่ที่ข้อมูลถูกจัดเก็บจริง ซึ่งอาจเป็นเขตอำนาจศาลหลายแห่งเช่นกัน"},{"id":10,"q":"Which of the following standards primarily pertains to cabling designs and setups in a data center?","a":["IDCA","BICSI","NFPA","Uptime Institute"],"ans":"B","exp":"The standards put out by Building Industry Consulting Service International (BICSI) primarily cover complex cabling designs and setups for data centers, but also include specifications on power, energy efficiency, and hot/cold aisle setups.","qth":"มาตรฐานใดต่อไปนี้เกี่ยวข้องกับการออกแบบและการตั้งค่าสายเคเบิลในศูนย์ข้อมูลเป็นหลัก","ath":["IDCA","BICSI","NFPA","Uptime Institute"],"expth":"มาตรฐานที่จัดทำโดย Building Industry Consulting Service International (BICS!) ครอบคลุมการออกแบบและการตั้งค่าสายเคเบิลที่ซับซ้อนสำหรับศูนย์ข้อมูลเป็นหลัก แต่ยังรวมถึงข้อกำหนดด้านพลังงาน ประสิทธิภาพการใช้พลังงาน และการตั้งค่าทางเดินร้อน/เย็น"},{"id":11,"q":"Which of the following is NOT a criterion for data within the scope of eDiscovery?","a":["Possession","Custody","Control","Archive"],"ans":"D","exp":"eDiscovery pertains to information and data that is in the possession, control, and custody of an organization.","qth":"ข้อใดต่อไปนี้ไม่ใช่เกณฑ์สำหรับข้อมูลภายในขอบเขตของ eDiscovery","ath":["การครอบครอง","การดูแล","การควบคุม","การเก็บถาวร"],"expth":"eDiscovery เกี่ยวข้องกับข้อมูลและข้อมูลที่อยู่ในความครอบครอง การควบคุม และการดูแลขององค์กร"},{"id":12,"q":"Which United States law is focused on accounting and financial practices of organizations?","a":["Safe Harbor","GLBA","SOX","HIPAA"],"ans":"C","exp":"The Sarbanes-Oxley (SOX) Act is not an act that pertains to privacy or IT security directly, but rather regulates accounting and financial practices used by organizations. It was passed to protect stakeholders and shareholders from improper practices and errors, and it sets forth rules for compliance, regulated and enforced by the Securities and Exchange Commission (SEC). The main influence on IT systems and operations is the requirements it sets for data retention, specifically in regard to what types of records must be preserved and for how long.","qth":"กฎหมายของสหรัฐอเมริกาข้อใดที่มุ่งเน้นไปที่แนวทางปฏิบัติด้านการบัญชีและการเงินขององค์กร","ath":["Safe Harbor","GLBA","SOX","HIPAA"],"expth":"กฎหมาย Sarbanes-Oxley (SOX) ไม่ใช่การกระทำที่เกี่ยวข้องกับความเป็นส่วนตัวหรือความปลอดภัยด้านไอทีโดยตรง แต่ควบคุมแนวทางปฏิบัติด้านการบัญชีและการเงินที่องค์กรใช้ เอกสารดังกล่าวถูกส่งผ่านเพื่อปกป้องผู้มีส่วนได้ส่วนเสียและผู้ถือหุ้นจากการปฏิบัติที่ไม่เหมาะสมและข้อผิดพลาด และได้กำหนดกฎเกณฑ์สำหรับการปฏิบัติตาม ควบคุมและบังคับใช้โดยสำนักงานคณะกรรมการกำกับหลักทรัพย์และตลาดหลักทรัพย์ (SEC) อิทธิพลหลักต่อระบบไอทีและการดำเนินงานคือข้อกำหนดที่ตั้งไว้สำหรับการเก็บรักษาข้อมูล โดยเฉพาะในเรื่องประเภทของบันทึกที่ต้องได้รับการเก็บรักษาและระยะเวลานานเท่าใด"},{"id":13,"q":"Which of the following storage types is most closely associated with a database-type storage implementation?","a":["Object","Unstructured","Volume","Structured"],"ans":"D","exp":"Structured storage involves organized and categorized data, which most closely resembles and operates like a database system would.","qth":"ประเภทพื้นที่เก็บข้อมูลใดต่อไปนี้มีความสัมพันธ์อย่างใกล้ชิดกับการใช้งานพื้นที่เก็บข้อมูลประเภทฐานข้อมูลมากที่สุด","ath":["วัตถุ","ไม่มีโครงสร้าง","ปริมาณ","ไม่มีโครงสร้าง"],"expth":"พื้นที่จัดเก็บที่มีโครงสร้างเกี่ยวข้องกับการจัดระเบียบและจัดหมวดหมู่ข้อมูลที่คล้ายคลึงและดำเนินการอย่างใกล้ชิดที่สุดเหมือนกับระบบฐานข้อมูล"},{"id":14,"q":"Which of the following roles is responsible for overseeing customer relationships and the processing of financial transactions?","a":["Cloud service manager","Cloud service deployment","Cloud service business manager","Cloud service operations manager"],"ans":"C","exp":"The cloud service business manager is responsible for overseeing business plans and customer relationships as well as processing financial transactions.","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการดูแลความสัมพันธ์กับลูกค้าและการประมวลผลธุรกรรมทางการเงิน","ath":["ผู้จัดการบริการคลาวด์","การปรับใช้บริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์","ผู้จัดการฝ่ายปฏิบัติการบริการคลาวด์"],"expth":"ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่รับผิดชอบในการดูแลแผนธุรกิจและความสัมพันธ์กับลูกค้าตลอดจนการประมวลผลธุรกรรมทางการเงิน"},{"id":15,"q":"What is the biggest benefit to leasing space in a data center versus building or maintain your own?","a":["Certification","Costs","Regulation","Control"],"ans":"B","exp":"When leasing space in a data center, an organization can avoid the enormous startup and building costs associated with a data center, and can instead leverage economies of scale by grouping with other organizations and sharing costs.","qth":"ประโยชน์ที่ใหญ่ที่สุดของการเช่าพื้นที่ในศูนย์ข้อมูลเทียบกับการสร้างหรือบำรุงรักษาของคุณเองคืออะไร","ath":["การรับรอง","ต้นทุน","กฎระเบียบ","การควบคุม"],"expth":"เมื่อเช่าพื้นที่ในศูนย์ข้อมูล องค์กรสามารถหลีกเลี่ยงต้นทุนการเริ่มต้นและการสร้างอันมหาศาลที่เกี่ยวข้องกับศูนย์ข้อมูล และสามารถใช้ประโยชน์จากการประหยัดจากขนาดโดยการจัดกลุ่มกับองค์กรอื่นและแบ่งปันต้นทุนแทน"},{"id":16,"q":"Which aspect of cloud computing will be most negatively impacted by vendor lock-in?","a":["Elasticity","Reversibility","Interoperability","Portability"],"ans":"D","exp":"A cloud customer utilizing proprietary APIs or services from one cloud provider that are unlikely to be available from another cloud provider will most negatively impact portability.","qth":"แง่มุมใดของการประมวลผลแบบคลาวด์ที่จะได้รับผลกระทบทางลบมากที่สุดจากการล็อคอินของผู้ขาย","ath":["ความยืดหยุ่น","การย้อนกลับได้","การทำงานร่วมกัน","การพกพา"],"expth":"ลูกค้าคลาวด์ที่ใช้ API หรือบริการที่เป็นกรรมสิทธิ์จากผู้ให้บริการคลาวด์รายหนึ่งซึ่งไม่น่าจะพร้อมใช้งานจากผู้ให้บริการคลาวด์รายอื่นจะส่งผลเสียต่อความสามารถในการพกพามากที่สุด"},{"id":17,"q":"Which of the following APIs are most commonly used within a cloud environment?","a":["REST and SAML","SOAP and REST","REST and XML","XML and SAML"],"ans":"B","exp":"Simple Object Access Protocol (SOAP) and Representational State Transfer (REST) are the most commonly used APIs within a cloud environment. Extensible Markup Language (XML) and Security Assertion Markup Language (SAML) are both standards for exchanging encoded data between two parties, with XML being for more general use and SAML focused on authentication and authorization data.","qth":"API ใดต่อไปนี้ที่ใช้บ่อยที่สุดภายในสภาพแวดล้อมระบบคลาวด์","ath":["REST และ SAML","SOAP และ REST","REST และ XML","XML และ SAML"],"expth":"Simple Object Access Protocol (SOAP) และ Representational State Transfer (REST) ​​เป็น API ที่ใช้บ่อยที่สุดภายในสภาพแวดล้อมระบบคลาวด์ Extensible Markup Language (XML) และ Security Assertion Markup Language (SAML) เป็นทั้งมาตรฐานสำหรับการแลกเปลี่ยนข้อมูลที่เข้ารหัสระหว่างสองฝ่าย โดยที่ XML นั้นมีไว้สำหรับการใช้งานทั่วไปมากกว่า และ SAML จะเน้นที่ข้อมูลการตรวจสอบสิทธิ์และการอนุญาต"},{"id":18,"q":"Which of the following roles is responsible for obtaining new customers and securing contracts and agreements?","a":["Inter-cloud provider","Cloud service broker","Cloud auditor","Cloud service developer"],"ans":"B","exp":"The cloud service broker is responsible for obtaining new customers, analyzing the marketplace, and securing contracts and agreements.","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการรับลูกค้าใหม่และการรักษาสัญญาและข้อตกลง","ath":["ผู้ให้บริการระหว่างคลาวด์","นายหน้าบริการคลาวด์","ผู้ตรวจสอบระบบคลาวด์","นักพัฒนาบริการระบบคลาวด์"],"expth":"นายหน้าบริการระบบคลาวด์มีหน้าที่รับผิดชอบในการรับลูกค้าใหม่ การวิเคราะห์ตลาด และการรักษาความปลอดภัยสัญญาและข้อตกลง"},{"id":19,"q":"Which term relates to the application of scientific methods and practices to evidence?","a":["Forensics","Methodical","Theoretical","Measured"],"ans":"A","exp":"Forensics is the application of scientific and methodical processes to identify, collect, preserve, analyze, and summarize/report digital information and evidence.","qth":"คำใดที่เกี่ยวข้องกับการประยุกต์ใช้วิธีการและแนวปฏิบัติทางวิทยาศาสตร์กับหลักฐาน","ath":["นิติวิทยาศาสตร์","ระเบียบวิธี","เชิงทฤษฎี","วัดผล"],"expth":"นิติวิทยาศาสตร์คือการประยุกต์ใช้กระบวนการทางวิทยาศาสตร์และระเบียบวิธีเพื่อระบุ รวบรวม เก็บรักษา วิเคราะห์ และสรุป/รายงานข้อมูลและหลักฐานดิจิทัล"},{"id":20,"q":"What is the primary reason that makes resolving jurisdictional conflicts complicated?","a":["Different technology standards","Costs","Language barriers","Lack of international authority"],"ans":"D","exp":"With international operations, systems ultimately cross many jurisdictional boundaries, and many times, they conflict with each other. The major hurdle to overcome for an organization is the lack of an ultimate international authority to mediate such conflicts, with a likely result of legal efforts in each jurisdiction.","qth":"อะไรคือสาเหตุหลักที่ทำให้การแก้ไขข้อขัดแย้งในเขตอำนาจศาลมีความซับซ้อน","ath":["มาตรฐานเทคโนโลยีที่แตกต่างกัน","ต้นทุน","อุปสรรคทางภาษา","การขาดอำนาจระหว่างประเทศ"],"expth":"ด้วยการดำเนินงานระหว่างประเทศ ในที่สุดระบบก็ข้ามขอบเขตเขตอำนาจศาลจำนวนมาก และหลายครั้งที่ขัดแย้งกันเอง อุปสรรคสำคัญที่ต้องเอาชนะสำหรับองค์กรคือการขาดอำนาจระหว่างประเทศขั้นสูงสุดในการไกล่เกลี่ยข้อขัดแย้งดังกล่าว โดยน่าจะเป็นผลมาจากความพยายามทางกฎหมายในแต่ละเขตอำนาจศาล"},{"id":21,"q":"GAAPs are created and maintained by which organization?","a":["ISO/IEC","AICPA","PCI Council","ISO"],"ans":"B","exp":"The AICPA is the organization responsible for generating and maintaining what are the Generally Accepted Accounting Practices in the United States.","qth":"GAAP ถูกสร้างและดูแลโดยองค์กรใด","ath":["ISO/IEC","AICPA","สภา PCI","ISO/IEC"],"expth":"AICPA เป็นองค์กรที่รับผิดชอบในการสร้างและรักษาแนวทางปฏิบัติทางการบัญชีที่ยอมรับโดยทั่วไปในสหรัฐอเมริกา"},{"id":22,"q":"Which of the following roles is responsible for preparing systems for the cloud, administering and monitoring services, and managing inventory and assets?","a":["Cloud service business manager","Cloud service deployment manager","Cloud service operations manager","Cloud service manager"],"ans":"C","exp":"The cloud service operations manager is responsible for preparing systems for the cloud, administering and monitoring services, providing audit data as requested or required, and managing inventory and assets.","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการเตรียมระบบสำหรับคลาวด์ การดูแลระบบและการตรวจสอบบริการ และการจัดการสินค้าคงคลังและสินทรัพย์","ath":["ผู้จัดการธุรกิจบริการคลาวด์","ตัวจัดการการปรับใช้บริการคลาวด์","ผู้จัดการฝ่ายปฏิบัติการของบริการคลาวด์","ผู้จัดการฝ่ายบริการคลาวด์"],"expth":"ผู้จัดการฝ่ายปฏิบัติการของบริการคลาวด์มีหน้าที่รับผิดชอบในการเตรียมระบบสำหรับคลาวด์ การดูแลระบบและการตรวจสอบบริการ การให้ข้อมูลการตรวจสอบตามที่ร้องขอหรือจำเป็น และการจัดการสินค้าคงคลังและสินทรัพย์"},{"id":23,"q":"Which protocol allows a system to use block-level storage as if it was a SAN, but over TCP network traffic instead?","a":["SATA","iSCSI","TLS","SCSI"],"ans":"B","exp":"iSCSI is a protocol that allows for the transmission and use of SCSI commands and features over a TCP-based network. iSCSI allows systems to use block-level storage that looks and behaves as a SAN would with physical servers, but to leverage the TCP network within a virtualized environment and cloud.","qth":"โปรโตคอลใดอนุญาตให้ระบบใช้ที่เก็บข้อมูลระดับบล็อกราวกับว่าเป็น SAN แต่ใช้การรับส่งข้อมูลเครือข่าย TCP แทน?","ath":["SATA","iSCSI","TLS","iSCSI"],"expth":"iSCSเป็นโปรโตคอลที่อนุญาตให้มีการส่งและการใช้คำสั่งและคุณสมบัติ SCSI บนเครือข่ายที่ใช้ TCP iSCSI อนุญาตให้ระบบใช้ที่เก็บข้อมูลระดับบล็อกที่ดูและทำงานเหมือนกับ SAN กับเซิร์ฟเวอร์จริง แต่เพื่อใช้ประโยชน์จากเครือข่าย TCP ภายในสภาพแวดล้อมเสมือนจริงและระบบคลาวด์"},{"id":24,"q":"Which of the cloud deployment models is used by popular services such as iCloud, Dropbox, and OneDrive?","a":["Hybrid","Public","Private","Community"],"ans":"B","exp":"Popular services such as iCloud, Dropbox, and OneDrive are all publicly available and are open to any user for free, with possible add-on services offered for a cost.","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดที่ใช้บริการยอดนิยม เช่น iCloud, Dropbox และ OneDrive","ath":["ไฮบริด","สาธารณะ","ส่วนตัว","ชุมชน"],"expth":"บริการยอดนิยม เช่น iCloud, Dropbox และ OneDrive ล้วนเผยแพร่สู่สาธารณะและเปิดให้ผู้ใช้ทุกคนใช้งานได้ฟรี โดยมีบริการเสริมที่เป็นไปได้โดยมีค่าใช้จ่าย"},{"id":25,"q":"Which is the appropriate phase of the cloud data lifecycle for determining the data's classification?","a":["Create","Use","Share","Store"],"ans":"A","exp":"Any time data is created, modified, or imported, the classification needs to be evaluated and set from the earliest phase to ensure security is always properly maintained for the duration of its lifecycle.","qth":"ช่วงใดคือช่วงที่เหมาะสมสำหรับวงจรการใช้งานข้อมูลบนคลาวด์ในการพิจารณาการจัดประเภทข้อมูล","ath":["สร้าง","ใช้","แบ่งปัน","จัดเก็บ"],"expth":"ทุกครั้งที่มีการสร้าง แก้ไข หรือนำเข้าข้อมูล การจัดประเภทจะต้องได้รับการประเมินและตั้งค่าตั้งแต่ระยะแรกสุดเพื่อให้แน่ใจว่าการรักษาความปลอดภัยจะได้รับการดูแลอย่างเหมาะสมตลอดระยะเวลาของวงจรการใช้งาน"},{"id":26,"q":"Which jurisdiction lacks specific and comprehensive privacy laws at a national or top level of legal authority?","a":["European Union","Germany","Russia","United States"],"ans":"D","exp":"The United States lacks a single comprehensive law at the federal level addressing data security and privacy, but there are multiple federal laws that deal with different industries.","qth":"เขตอำนาจศาลใดขาดกฎหมายความเป็นส่วนตัวที่เฉพาะเจาะจงและครอบคลุมในหน่วยงานทางกฎหมายระดับชาติหรือระดับสูง","ath":["สหภาพยุโรป","เยอรมนี","รัสเซีย","สหรัฐอเมริกา"],"expth":"สหรัฐอเมริกาขาดกฎหมายที่ครอบคลุมเพียงฉบับเดียวในระดับรัฐบาลกลางที่เกี่ยวข้องกับความปลอดภัยของข้อมูลและความเป็นส่วนตัว แต่มีกฎหมายของรัฐบาลกลางหลายฉบับที่"},{"id":27,"q":"Which of the following threat types can occur when encryption is not properly applied or insecure transport mechanisms are used?","a":["Security misconfiguration","Insecure direct object references","Sensitive data exposure","Unvalidated redirects and forwards"],"ans":"C","exp":"Sensitive data exposure occurs when information is not properly secured through encryption and secure transport mechanisms; it can quickly become an easy and broad method for attackers to compromise information. Web applications must enforce strong encryption and security controls on the application side, but secure methods of communications with browsers or other clients used to access the information are also required. Security misconfiguration occurs when applications and systems are not properly configured for security, often a result of misapplied or inadequate baselines. Insecure direct object references occur when code references aspects of the infrastructure, especially internal or private systems, and an attacker can use that knowledge to glean more information about the infrastructure. Unvalidated redirects and forwards occur when an application has functions to forward users to other sites, and these functions are not properly secured to validate the data and redirect requests, thus allowing spoofing for malware or phishing attacks.","qth":"ภัยคุกคามประเภทใดต่อไปนี้ที่สามารถเกิดขึ้นได้เมื่อการเข้ารหัสไม่ได้ใช้อย่างเหมาะสม หรือใช้กลไกการขนส่งที่ไม่ปลอดภัย?","ath":["การกำหนดค่าความปลอดภัยผิดพลาด","การอ้างอิงวัตถุโดยตรงที่ไม่ปลอดภัย","การเปิดเผยข้อมูลที่ละเอียดอ่อน","การเปลี่ยนเส้นทางและการส่งต่อที่ไม่ได้รับการตรวจสอบ"],"expth":"การเปิดเผยข้อมูลที่ละเอียดอ่อนเกิดขึ้นเมื่อข้อมูลไม่ได้รับการรักษาความปลอดภัยอย่างเหมาะสมผ่านการเข้ารหัสและกลไกการขนส่งที่ปลอดภัย มันสามารถกลายเป็นวิธีการที่ง่ายและกว้างขวางสำหรับผู้โจมตีในการโจมตีข้อมูลได้อย่างรวดเร็ว แอปพลิเคชันเว็บจะต้องบังคับใช้การเข้ารหัสที่รัดกุมและการควบคุมความปลอดภัยในด้านแอปพลิเคชัน แต่จำเป็นต้องใช้วิธีการสื่อสารกับเบราว์เซอร์หรือไคลเอนต์อื่น ๆ ที่ใช้ในการเข้าถึงข้อมูลอย่างปลอดภัยด้วย การกำหนดค่าความปลอดภัยที่ไม่ถูกต้องเกิดขึ้นเมื่อแอปพลิเคชันและระบบไม่ได้รับการกำหนดค่าเพื่อความปลอดภัยอย่างเหมาะสม ซึ่งมักเป็นผลมาจากการใช้งานที่ไม่ถูกต้องหรือพื้นฐานที่ไม่เพียงพอ การอ้างอิงออบเจ็กต์โดยตรงที่ไม่ปลอดภัยเกิดขึ้นเมื่อโค้ดอ้างอิงแง่มุมต่างๆ ของโครงสร้างพื้นฐาน โดยเฉพาะระบบภายในหรือส่วนตัว และผู้โจมตีสามารถใช้ความรู้นั้นเพื่อรวบรวมข้อมูลเพิ่มเติมเกี่ยวกับโครงสร้างพื้นฐาน"},{"id":28,"q":"Which type of cloud model typically presents the most challenges to a cloud customer during the \"destroy\" phase of the cloud data lifecycle?","a":["IaaS","DaaS","SaaS","PaaS"],"ans":"C","exp":"With many SaaS implementations, data is not isolated to a particular customer but rather is part of the overall application. When it comes to data destruction, a particular challenge is ensuring that all of a customer's data is completely destroyed while not impacting the data of other customers.","qth":"โมเดลคลาวด์ประเภทใดที่มักนำเสนอความท้าทายมากที่สุดแก่ลูกค้าคลาวด์ในระหว่างระยะ \"ทำลาย\" ของวงจรการใช้งานข้อมูลบนคลาวด์","ath":["IaaS (โครงสร้างพื้นฐานในรูปแบบบริการ)","DaaS","Saas","PaaS"],"expth":"ด้วยการใช้งาน SaaS จำนวนมาก ข้อมูลจะไม่ถูกแยกให้กับลูกค้ารายใดรายหนึ่ง แต่เป็นส่วนหนึ่งของแอปพลิเคชันโดยรวม เมื่อพูดถึงการทำลายข้อมูล ความท้าทายเฉพาะก็คือการทำให้แน่ใจว่าข้อมูลทั้งหมดของลูกค้าจะถูกทำลายอย่างสมบูรณ์ โดยไม่ส่งผลกระทบต่อข้อมูลของลูกค้ารายอื่น"},{"id":29,"q":"Which of the following may unilaterally deem a cloud hosting model inappropriate for a system or application?","a":["Multitenancy","Certification","Regulation","Virtualization"],"ans":"C","exp":"Some regulations may require specific security controls or certifications be used for hosting certain types of data or functions, and in some circumstances they may be requirements that are unable to be met by any cloud provider.","qth":"ข้อใดต่อไปนี้อาจถือว่าโมเดลโฮสติ้งบนคลาวด์ไม่เหมาะสมสำหรับระบบหรือแอปพลิเคชันฝ่ายเดียว","ath":["การเช่าหลายรายการ","การรับรอง","กฎระเบียบ","การจำลองเสมือน"],"expth":"กฎระเบียบบางประการอาจต้องมีการควบคุมความปลอดภัยหรือการรับรองเฉพาะเพื่อใช้ในการโฮสต์ข้อมูลหรือฟังก์ชันบางประเภท และในบางกรณีอาจเป็นข้อกำหนดที่ผู้ให้บริการระบบคลาวด์รายใดไม่สามารถตอบสนองได้"},{"id":30,"q":"Which of the following is considered an internal redundancy for a data center?","a":["Power distribution units","Network circuits","Power substations","Generators"],"ans":"A","exp":"Power distribution units are internal to a data center and supply power to internal components such as racks, appliances, and cooling systems. As such, they are considered an internal redundancy.","qth":"ข้อใดต่อไปนี้ถือเป็นความซ้ำซ้อนภายในสำหรับศูนย์ข้อมูล","ath":["หน่วยจ่ายไฟ","วงจรเครือข่าย","สถานีไฟฟ้าย่อย","เครื่องกำเนิดไฟฟ้า"],"expth":"หน่วยจ่ายไฟอยู่ภายในศูนย์ข้อมูลและจ่ายพลังงานให้กับส่วนประกอบภายใน เช่น ชั้นวาง เครื่องใช้ไฟฟ้า และระบบทำความเย็น ดังนั้นจึงถือเป็นความซ้ำซ้อนภายใน"},{"id":31,"q":"Which of the following represents a control on the maximum amount of resources that a single customer, virtual machine, or application can consume within a cloud environment?","a":["Share","Reservation","Provision","Limit"],"ans":"D","exp":"Limits are put in place to enforce a maximum on the amount of memory or processing a cloud customer can use. This can be done either on a virtual machine or as a comprehensive whole for a customer, and is meant to ensure that enormous cloud resources cannot be allocated or consumed by a single host or customer to the detriment of other hosts and customers.","qth":"ข้อใดต่อไปนี้แสดงถึงการควบคุมจำนวนทรัพยากรสูงสุดที่ลูกค้า เครื่องเสมือน หรือแอปพลิเคชันรายเดียวสามารถใช้ได้ภายในสภาพแวดล้อมคลาวด์","ath":["แบ่งปัน","การจอง","การเตรียมการ","ขีดจำกัด"],"expth":"ขีดจำกัดถูกบังคับใช้เพื่อบังคับใช้จำนวนสูงสุดกับจำนวนหน่วยความจำหรือการประมวลผลที่ลูกค้าบนคลาวด์สามารถใช้ได้ ซึ่งสามารถทำได้ทั้งบนเครื่องเสมือนหรือทั้งหมดสำหรับลูกค้า และมีวัตถุประสงค์เพื่อให้แน่ใจว่าทรัพยากรคลาวด์จำนวนมหาศาลไม่สามารถจัดสรรหรือใช้โดยโฮสต์หรือลูกค้ารายเดียว ส่งผลเสียต่อโฮสต์และลูกค้าอื่นๆ"},{"id":32,"q":"Which of the following roles is responsible for peering with other cloud services and providers?","a":["Cloud auditor","Inter-cloud provider","Cloud service broker","Cloud service developer"],"ans":"B","exp":"The inter-cloud provider is responsible for peering with other cloud services and providers, as well as overseeing and managing federations and federated services.","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการเพียร์กับบริการคลาวด์และผู้ให้บริการอื่น ๆ","ath":["ผู้ตรวจสอบคลาวด์","ผู้ให้บริการระหว่างคลาวด์","นายหน้าบริการคลาวด์","ผู้พัฒนาบริการคลาวด์"],"expth":"ผู้ให้บริการระหว่างคลาวด์มีหน้าที่รับผิดชอบในการเพียร์กับบริการคลาวด์และผู้ให้บริการอื่น ๆ เช่นเดียวกับการดูแลและจัดการสหพันธรัฐและบริการแบบรวมศูนย์"},{"id":33,"q":"Which of the following does NOT relate to the hiding of sensitive data from data sets?","a":["Obfuscation","Federation","Masking","Anonymization"],"ans":"B","exp":"Federation pertains to authenticating systems between different organizations.","qth":"ข้อใดต่อไปนี้ไม่เกี่ยวข้องกับการซ่อนข้อมูลที่ละเอียดอ่อนจากชุดข้อมูล","ath":["การสร้างความสับสน","สหพันธรัฐ","การมาสก์","การลบข้อมูลระบุตัวตน"],"expth":"สหพันธรัฐเกี่ยวข้องกับการรับรองความถูกต้องของระบบระหว่างองค์กรที่แตกต่างกัน"},{"id":34,"q":"Which of the following are the storage types associated with IaaS?","a":["Volume and object","Volume and label","Volume and container","Object and target"],"ans":"A","exp":"","qth":"ประเภทพื้นที่จัดเก็บข้อมูลใดต่อไปนี้ที่เกี่ยวข้องกับ laaS?","ath":["ปริมาตรและวัตถุ","ปริมาตรและป้ายกำกับ","ปริมาตรและคอนเทนเนอร์","วัตถุและเป้าหมาย"],"expth":""},{"id":35,"q":"Which of the following represents a prioritization of applications or cloud customers for the allocation of additional requested resources when there is a limitation on available resources?","a":["Provision","Limit","Reservation","Share"],"ans":"D","exp":"The concept of shares within a cloud environment is used to mitigate and control the request for resource allocations from customers that the environment may not have the current capability to allow. Shares work by prioritizing hosts within a cloud environment through a weighting system that is defined by the cloud provider. When periods of high utilization and allocation are reached, the system automatically uses scoring of each host based on its share value to determine which hosts get access to the limited resources still available. The higher the value a particular host has, the more resources it will be allowed to utilize.","qth":"ข้อใดต่อไปนี้แสดงถึงการจัดลำดับความสำคัญของแอปพลิเคชันหรือลูกค้าระบบคลาวด์สำหรับการจัดสรรทรัพยากรที่ร้องขอเพิ่มเติมเมื่อมีข้อจำกัดเกี่ยวกับทรัพยากรที่มีอยู่","ath":["การจัดเตรียม","ขีดจำกัด","การจอง (ENE","แบ่งปัน"],"expth":"แนวคิดของการแชร์ภายในสภาพแวดล้อมระบบคลาวด์ถูกนำมาใช้เพื่อลดและควบคุมคำขอสำหรับการจัดสรรทรัพยากรจากลูกค้าที่สภาพแวดล้อมอาจไม่มีความสามารถในปัจจุบัน อนุญาต การแชร์ทำงานโดยการจัดลำดับความสำคัญของโฮสต์ภายในสภาพแวดล้อมคลาวด์ผ่านระบบการถ่วงน้ำหนักที่กำหนดโดยผู้ให้บริการคลาวด์ เมื่อถึงช่วงการใช้งานและการจัดสรรที่สูง ระบบจะใช้การให้คะแนนของแต่ละโฮสต์โดยอัตโนมัติตามมูลค่าการแบ่งปันเพื่อกำหนดว่าโฮสต์ใดที่ยังคงสามารถเข้าถึงทรัพยากรที่จำกัดได้"},{"id":36,"q":"Which of the following statements accurately describes VLANs?","a":["They are not restricted to the same data center or the same racks.","They are not restricted to the name rack but restricted to the same data center.","They are restricted to the same racks and data centers.","They are not restricted to the same rack but restricted to same switches."],"ans":"A","exp":"A virtual area network (VLAN) can span any networks within a data center, or it can span across different physical locations and data centers.","qth":"ข้อความใดต่อไปนี้อธิบาย VLAN ได้อย่างถูกต้อง","ath":["พวกมันกินไม่ถูกจำกัดไว้ที่ศูนย์ข้อมูลเดียวกันหรือแร็คเดียวกัน","พวกมันไม่ได้จำกัดอยู่ที่แร็คชื่อ แต่ถูกจำกัดไว้ที่ศูนย์ข้อมูลเดียวกัน","พวกมันถูกจำกัดไว้ที่แร็คและศูนย์ข้อมูลเดียวกัน","พวกมันไม่ได้จำกัดอยู่ที่แร็คเดียวกัน แต่ถูกจำกัดอยู่ที่สวิตช์เดียวกัน"],"expth":"พื้นที่เสมือน เครือข่าย (VLAN) สามารถขยายเครือข่ายใดๆ ภายในศูนย์ข้อมูล หรืออาจขยายข้ามสถานที่ตั้งทางกายภาพและศูนย์ข้อมูลต่างๆ ก็ได้"},{"id":37,"q":"What must be secured on physical hardware to prevent unauthorized access to systems?","a":["BIOS","SSH","RDP","ALOM"],"ans":"A","exp":"BIOS is the firmware that governs the physical initiation and boot up of a piece of hardware. If it is compromised, an attacker could have access to hosted systems and make configurations changes to expose or disable some security elements on the system.","qth":"อะไรที่ต้องได้รับการรักษาความปลอดภัยบนฮาร์ดแวร์กายภาพเพื่อป้องกันการเข้าถึงระบบโดยไม่ได้รับอนุญาต","ath":["BIOS","SSH","RDP","ALOM"],"expth":"BIOS คือเฟิร์มแวร์ที่ควบคุมการเริ่มต้นทางกายภาพและการบูตชิ้นส่วนของฮาร์ดแวร์ หากถูกบุกรุก ผู้โจมตีอาจสามารถเข้าถึงระบบที่โฮสต์และทำการเปลี่ยนแปลงการกำหนดค่าเพื่อแสดงหรือปิดใช้งานองค์ประกอบความปลอดภัยบางอย่างบนระบบ"},{"id":38,"q":"What type of PII is regulated based on the type of application or per the conditions of the specific hosting agreement?","a":["Specific","Contractual","regulated","Jurisdictional"],"ans":"B","exp":"Contractual PII has specific requirements for the handling of sensitive and personal information, as defined at a contractual level. These specific requirements will typically document the required handling procedures and policies to deal with PII. They may be in specific security controls and configurations, required policies or procedures, or limitations on who may gain authorized access to data and systems.","qth":"PII ประเภทใดถูกกำกับตามประเภทของแอปพลิเคชัน หรือตามเงื่อนไขในข้อตกลงโฮสติ้งนั้น ๆ","ath":["เฉพาะเจาะจง (Specific)","ตามสัญญา (Contractual)","ตามกฎหมายกำกับ (Regulated)","ตามเขตอำนาจศาล (Jurisdictional)"],"expth":"PII ตามสัญญามีข้อกำหนดเฉพาะเรื่องการจัดการข้อมูลส่วนบุคคลในระดับสัญญา เช่น ขั้นตอน มาตรการ และผู้ที่เข้าถึงได้"},{"id":39,"q":"Which concept BEST describes the capability for a cloud environment to automatically scale a system or application, based on its current resource demands?","a":["On-demand self-service","Resource pooling","Measured service","Rapid elasticity"],"ans":"D","exp":"Rapid elasticity allows a cloud environment to automatically add or remove resources to or from a system or application based on its current demands. Whereas a traditional data center model would require standby hardware and substantial effort to add resources in response to load increases, a cloud environment can easily and rapidly expand to meet resources demands, so long as the application is properly implemented for it.","qth":"แนวคิดใดอธิบายความสามารถที่ดีที่สุดสำหรับสภาพแวดล้อมคลาวด์ในการปรับขนาดระบบหรือแอปพลิเคชันโดยอัตโนมัติตามความต้องการทรัพยากรในปัจจุบัน","ath":["การบริการตนเองตามความต้องการ","การรวมทรัพยากร","บริการที่วัดผล","ความยืดหยุ่นอย่างรวดเร็ว"],"expth":"ความยืดหยุ่นอย่างรวดเร็วทำให้สภาพแวดล้อมคลาวด์สามารถเพิ่มหรือลบทรัพยากรเข้าหรือออกจากระบบหรือแอปพลิเคชันโดยอัตโนมัติตามความต้องการในปัจจุบัน ในขณะที่โมเดลศูนย์ข้อมูลแบบดั้งเดิมจะต้องใช้ฮาร์ดแวร์สแตนด์บายและความพยายามอย่างมากในการเพิ่มทรัพยากรเพื่อตอบสนองต่อโหลดที่เพิ่มขึ้น สภาพแวดล้อมระบบคลาวด์สามารถขยายได้อย่างง่ายดายและรวดเร็วเพื่อตอบสนองความต้องการทรัพยากร ตราบใดที่แอปพลิเคชันได้รับการติดตั้งอย่างเหมาะสม"},{"id":40,"q":"If you're using iSCSI in a cloud environment, what must come from an external protocol or application?","a":["Kerberos support","CHAP support","Authentication","Encryption"],"ans":"D","exp":"iSCSI does not natively support encryption, so another technology such as IPsec must be used to encrypt communications.","qth":"หากคุณใช้ iSCSI ในสภาพแวดล้อมคลาวด์ สิ่งที่ต้องมาจากโปรโตคอลหรือแอปพลิเคชันภายนอก","ath":["การสนับสนุน Kerberos","การสนับสนุน CHAP","การรับรองความถูกต้อง","การเข้ารหัส"],"expth":"iSCSI ไม่สนับสนุนการเข้ารหัสโดยกำเนิด ดังนั้นเทคโนโลยีอื่น เช่น IPsec จึงต้องใช้ในการเข้ารหัสการสื่อสาร"},{"id":41,"q":"Which of the following pertains to a macro level approach to data center design rather than the traditional tiered approach to data centers?","a":["IDCA","NFPA","BICSI","Uptime Institute"],"ans":"A","exp":"The standards put out by the International Data Center Authority (IDCA) have established the Infinity Paradigm, which is intended to be a comprehensive data center design and operations framework. The Infinity Paradigm shifts away from many models that rely on tiered architecture for data centers, where each successive tier increases redundancy. Instead, it emphasizes data centers being approached at a macro level, without a specific and isolated focus on certain aspects to achieve tier status.","qth":"ข้อใดต่อไปนี้เกี่ยวข้องกับแนวทางระดับมหภาคในการออกแบบศูนย์ข้อมูลมากกว่าแนวทางแบบลำดับชั้นแบบดั้งเดิมสำหรับศูนย์ข้อมูล","ath":["IDCA","NFPA","BICSI","Uptime Institute"],"expth":"มาตรฐานที่ออกโดย International Data Center Authority (IDCA) ได้กำหนด Infinity Paradigm ซึ่งมีวัตถุประสงค์เพื่อเป็นกรอบการออกแบบศูนย์ข้อมูลและการดำเนินงานที่ครอบคลุม Infinity Paradigm เปลี่ยนจากโมเดลจำนวนมากที่ต้องอาศัยสถาปัตยกรรมแบบลำดับชั้นสำหรับศูนย์ข้อมูล ซึ่งแต่ละระดับที่ต่อเนื่องกันจะเพิ่มความซ้ำซ้อน แต่จะเน้นไปที่ศูนย์ข้อมูลที่มีการเข้าถึงในระดับมหภาค โดยไม่ต้องเน้นเฉพาะและแยกออกไปในบางแง่มุมเพื่อให้ได้สถานะระดับ"},{"id":42,"q":"Why does a Type 1 hypervisor typically offer tighter security controls than a Type 2 hypervisor?","a":["A Type 1 hypervisor also controls patching of its hosted virtual machines ensure they are always secure.","A Type 1 hypervisor is tied directly to the bare metal and only runs with code necessary to perform its specific mission.","A Type 1 hypervisor performs hardware-level encryption for tighter security and efficiency.","A Type 1 hypervisor only hosts virtual machines with the same operating systems as the hypervisor."],"ans":"B","exp":"Type 1 hypervisors run directly on top of the bare metal and only contain the code and functions required to perform their purpose. They do not rely on any other systems or contain extra features to secure.","qth":"เหตุใดไฮเปอร์ไวเซอร์ Type 1 จึงให้การควบคุมความปลอดภัยที่เข้มงวดกว่าไฮเปอร์ไวเซอร์ Type 2","ath":["ไฮเปอร์ไวเซอร์ Type 1 ยังควบคุมการแพตช์ของเครื่องเสมือนที่โฮสต์ไว้ เพื่อให้มั่นใจว่ามีความปลอดภัยเสมอ","ไฮเปอร์ไวเซอร์ Type 1 เชื่อมโยงกับโลหะเปลือยโดยตรงและทำงานด้วยโค้ดที่จำเป็นเพื่อดำเนินการภารกิจเฉพาะเท่านั้น","ไฮเปอร์ไวเซอร์ Type 1 ทำการเข้ารหัสระดับฮาร์ดแวร์เพื่อความปลอดภัยและประสิทธิภาพที่เข้มงวดยิ่งขึ้น<","A ไฮเปอร์ไวเซอร์ประเภท 1 จะโฮสต์เฉพาะเครื่องเสมือนที่มีระบบปฏิบัติการเดียวกันกับไฮเปอร์ไวเซอร์"],"expth":"ไฮเปอร์ไวเซอร์ประเภท 1 ทำงานบนโลหะเปลือยโดยตรง และมีเพียงโค้ดและฟังก์ชันที่จำเป็นต่อการดำเนินการตามวัตถุประสงค์เท่านั้น พวกเขาไม่ต้องพึ่งพาระบบอื่นใดหรือมีคุณสมบัติพิเศษในการรักษาความปลอดภัย"},{"id":43,"q":"What is the data encapsulation used with the SOAP protocol referred to?","a":["Packet","Envelope","Payload","Object"],"ans":"B","exp":"Simple Object Access Protocol (SOAP) encapsulates its information in what is known as a SOAP envelope and then leverages common communications protocols for transmission.","qth":"การห่อหุ้มข้อมูลที่ใช้กับโปรโตคอล SOAP ที่อ้างถึงคืออะไร","ath":["แพ็คเก็ต","ซองจดหมาย","น้ำหนักบรรทุก","Object"],"expth":"Simple Object Access Protocol (SOAP) สรุปข้อมูลในสิ่งที่เรียกว่าซองจดหมาย SOAP จากนั้นจึงใช้ประโยชน์จากโปรโตคอลการสื่อสารทั่วไปสำหรับการส่งข้อมูล"},{"id":44,"q":"What is the biggest negative to leasing space in a data center versus building or maintain your own?","a":["Costs","Control","Certification","Regulation"],"ans":"B","exp":"When leasing space in a data center, an organization will give up a large degree of control as to how it is built and maintained, and instead must conform to the policies and procedures of the owners and operators of the data center.","qth":"อะไรคือผลเสียที่ใหญ่ที่สุดต่อการเช่าพื้นที่ในศูนย์ข้อมูลเมื่อเทียบกับการสร้างหรือบำรุงรักษาพื้นที่ของคุณเอง","ath":["ต้นทุน","การควบคุม","การรับรอง","กฎระเบียบ"],"expth":"เมื่อเช่าพื้นที่ในศูนย์ข้อมูล องค์กรจะละทิ้งการควบคุมในระดับสูงเกี่ยวกับวิธีการสร้างและบำรุงรักษา และจะต้องสอดคล้องกับนโยบายและขั้นตอนของเจ้าของและผู้ปฏิบัติงานของศูนย์ข้อมูลแทน"},{"id":45,"q":"Which aspect of archiving must be tested regularly for the duration of retention requirements?","a":["Availability","Recoverability","Auditability","Portability"],"ans":"B","exp":"In order for any archiving system to be deemed useful and compliant, regular tests must be performed to ensure the data can still be recovered and accessible, should it ever be needed, for the duration of the retention requirements.","qth":"ด้านใดของการเก็บถาวรที่ต้องทดสอบเป็นประจำตลอดระยะเวลาที่ต้องเก็บรักษา","ath":["ความพร้อมใช้","ความสามารถในการกู้คืน","ความสามารถในการตรวจสอบ","ความสามารถในการย้ายระบบ"],"expth":"ระบบเก็บถาวรต้องทดสอบเป็นประจำว่าข้อมูลยังกู้คืนและเข้าถึงได้ตลอดระยะเวลาที่กำหนดให้เก็บ"},{"id":46,"q":"Which of the following represents a minimum guaranteed resource within a cloud environment for the cloud customer?","a":["Reservation","Share","Limit","Provision"],"ans":"A","exp":"A reservation is a minimum resource that is guaranteed to a customer within a cloud environment. Within a cloud, a reservation can pertain to the two main aspects of computing: memory and processor. With a reservation in place, the cloud provider guarantees that a cloud customer will always have at minimum the necessary resources available to power on and operate any of their services.","qth":"ข้อใดต่อไปนี้แสดงถึงทรัพยากรที่มีการรับประกันขั้นต่ำภายในสภาพแวดล้อมระบบคลาวด์สำหรับลูกค้าระบบคลาวด์","ath":["การจอง","แบ่งปัน","ขีดจำกัด","การเตรียมการ"],"expth":"การจองคือทรัพยากรขั้นต่ำที่รับประกันให้กับลูกค้าภายในสภาพแวดล้อมระบบคลาวด์ ภายในระบบคลาวด์ การสำรองอาจเกี่ยวข้องกับสองส่วนหลักของการประมวลผล: หน่วยความจำและโปรเซสเซอร์ ด้วยการจองไว้ ผู้ให้บริการคลาวด์รับประกันว่าลูกค้าคลาวด์จะมีทรัพยากรที่จำเป็นเป็นอย่างน้อยเสมอสำหรับการเปิดและดำเนินการบริการใดๆ ของพวกเขา"},{"id":47,"q":"Which of the following is the biggest concern or challenge with using encryption?","a":["Dependence on keys","Cipher strength","Efficiency","Protocol standards"],"ans":"A","exp":"No matter what kind of application, system, or hosting model used, encryption is 100 percent dependent on encryption keys. Properly securing the keys and the exchange of them is the biggest and most important challenge of encryption systems.","qth":"ข้อใดต่อไปนี้เป็นข้อกังวลหรือความท้าทายที่ใหญ่ที่สุดในการใช้การเข้ารหัส","ath":["การพึ่งพาคีย์","ความแข็งแกร่งของการเข้ารหัส","ประสิทธิภาพ","มาตรฐานโปรโตคอล"],"expth":"ไม่ว่าจะใช้แอปพลิเคชัน ระบบ หรือโมเดลโฮสติ้งประเภทใด การเข้ารหัสจะขึ้นอยู่กับคีย์การเข้ารหัส 100 เปอร์เซ็นต์ การรักษาความปลอดภัยคีย์และการแลกเปลี่ยนอย่างเหมาะสมถือเป็นความท้าทายที่ใหญ่ที่สุดและสำคัญที่สุดของระบบการเข้ารหัส"},{"id":48,"q":"Which technology is NOT commonly used for security with data in transit?","a":["DNSSEC","IPsec","VPN","HTTPS"],"ans":"A","exp":"DNSSEC relates to the integrity of DNS resolutions and the prevention of spoofing or redirection, and does not pertain to the actual security of transmissions or the protection of data.","qth":"เทคโนโลยีใดที่ไม่ได้ใช้กันโดยทั่วไปเพื่อความปลอดภัยของข้อมูลที่อยู่ระหว่างการส่ง","ath":["DNSSEC","IPsec","VPN","HTTPS"],"expth":"DNSSEC เกี่ยวข้องกับความสมบูรณ์ของการแก้ไข DNS และการป้องกันการปลอมแปลงหรือการเปลี่ยนเส้นทาง และไม่เกี่ยวข้องกับความปลอดภัยที่แท้จริงของการส่งข้อมูลหรือการปกป้องข้อมูล"},{"id":49,"q":"Which of the following roles is responsible for gathering metrics on cloud services and managing cloud deployments and the deployment processes?","a":["Cloud service business manager","Cloud service operations manager","Cloud service manager","Cloud service deployment manager"],"ans":"D","exp":"The cloud service deployment manager is responsible for gathering metrics on cloud services, managing cloud deployments and the deployment process, and defining the environments and processes.","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการรวบรวมตัวชี้วัดบนบริการคลาวด์และการจัดการการปรับใช้คลาวด์และกระบวนการปรับใช้?","ath":["ผู้จัดการธุรกิจบริการคลาวด์","ผู้จัดการการดำเนินงานบริการคลาวด์","ผู้จัดการบริการคลาวด์","ตัวจัดการการปรับใช้บริการคลาวด์"],"expth":"ตัวจัดการการปรับใช้บริการคลาวด์มีหน้าที่รับผิดชอบในการรวบรวมตัวชี้วัดบนบริการคลาวด์ จัดการการปรับใช้ระบบคลาวด์และกระบวนการปรับใช้ และการกำหนดสภาพแวดล้อมและกระบวนการ"},{"id":50,"q":"What is the first stage of the cloud data lifecycle where security controls can be implemented?","a":["Use","Store","Share","Create"],"ans":"B","exp":"The \"store\" phase of the cloud data lifecycle, which typically occurs simultaneously with the \"create\" phase, or immediately thereafter, is the first phase where security controls can be implemented. In most case, the manner in which the data is stored will be based on its classification.","qth":"ขั้นตอนแรกของวงจรการใช้งานข้อมูลบนคลาวด์ที่สามารถใช้การควบคุมความปลอดภัยได้คืออะไร","ath":["ใช้","จัดเก็บ","แบ่งปัน","สร้าง"],"expth":"ระยะ \"จัดเก็บ\" ของวงจรการใช้งานข้อมูลบนคลาวด์ ซึ่งโดยทั่วไปจะเกิดขึ้นพร้อมกันกับระยะ \"สร้าง\" หรือหลังจากนั้นทันที ถือเป็นระยะแรกที่สามารถใช้การควบคุมความปลอดภัยได้ ในกรณีส่วนใหญ่ ลักษณะการจัดเก็บข้อมูลจะขึ้นอยู่กับการจัดหมวดหมู่"},{"id":51,"q":"What controls the formatting and security settings of a volume storage system within a cloud environment?","a":["Management plane","SAN host controller","Hypervisor","Operating system of the host"],"ans":"D","exp":"Once a storage LUN is allocated to a virtual machine, the operating system of that virtual machine will format, manage, and control the file system and security of the data on that LUN.","qth":"อะไรควบคุมการจัดรูปแบบและการตั้งค่าความปลอดภัยของระบบจัดเก็บข้อมูลโวลุ่มภายในสภาพแวดล้อมคลาวด์","ath":["ระนาบการจัดการ","ตัวควบคุมโฮสต์ SAN","Hypervisor","ระบบปฏิบัติการของโฮสต์"],"expth":"เมื่อ LUN พื้นที่เก็บข้อมูลถูกจัดสรรให้กับเครื่องเสมือน ระบบปฏิบัติการของเครื่องเสมือนนั้นจะจัดรูปแบบ จัดการ และควบคุมระบบไฟล์และความปลอดภัยของข้อมูลบน LUN นั้น"},{"id":52,"q":"From a legal perspective, what is the most important first step after an eDiscovery order has been received by the cloud provider?","a":["Notification","Key identification","Data collection","Virtual image snapshots"],"ans":"A","exp":"The contract should include requirements for notification by the cloud provider to the cloud customer upon the receipt of such an order. This serves a few important purposes. First, it keeps communication and trust open between the cloud provider and cloud customers. Second, and more importantly, it allows the cloud customer to potentially challenge the order if they feel they have the grounds or desire to do so.","qth":"จากมุมมองทางกฎหมาย ขั้นตอนแรกที่สำคัญที่สุดคืออะไรหลังจากได้รับคำสั่งซื้อ eDiscovery จากผู้ให้บริการคลาวด์","ath":["การแจ้งเตือน","การระบุคีย์","การรวบรวมข้อมูล","สแนปช็อตภาพเสมือน"],"expth":"สัญญาควรรวมข้อกำหนดสำหรับการแจ้งเตือนจากผู้ให้บริการคลาวด์ไปยังลูกค้าคลาวด์เมื่อได้รับคำสั่งซื้อดังกล่าว สิ่งนี้มีจุดประสงค์ที่สำคัญบางประการ ประการแรก ช่วยให้การสื่อสารและความไว้วางใจเปิดกว้างระหว่างผู้ให้บริการคลาวด์และลูกค้าคลาวด์ ประการที่สอง และที่สำคัญกว่านั้น ช่วยให้ลูกค้าระบบคลาวด์สามารถท้าทายคำสั่งซื้อได้ หากพวกเขารู้สึกว่าตนมีเหตุผลหรือต้องการทำเช่นนั้น"},{"id":53,"q":"Which of the following would make it more likely that a cloud provider would be unwilling to satisfy specific certification requirements?","a":["Resource pooling","Virtualization","Multitenancy","Regulation"],"ans":"C","exp":"With cloud providers hosting a number of different customers, it would be impractical for them to pursue additional certifications based on the needs of a specific customer. Cloud environments are built to a common denominator to serve the greatest number of customers, and especially within a public cloud model, it is not possible or practical for a cloud provider to alter their services for specific customer demands.","qth":"ข้อใดต่อไปนี้จะทำให้ผู้ให้บริการระบบคลาวด์มีแนวโน้มมากขึ้นที่จะไม่ปฏิบัติตามข้อกำหนดการรับรองเฉพาะ","ath":["การรวมทรัพยากร","การจำลองเสมือน","การเช่าหลายรายการ","ระเบียบข้อบังคับ"],"expth":"เนื่องจากผู้ให้บริการระบบคลาวด์โฮสต์ลูกค้าที่แตกต่างกันจำนวนมาก จึงเป็นไปไม่ได้สำหรับพวกเขาที่จะขอรับการรับรองเพิ่มเติมตามความต้องการของลูกค้าเฉพาะราย สภาพแวดล้อมคลาวด์ถูกสร้างขึ้นโดยมีสัดส่วนร่วมกันเพื่อรองรับลูกค้าจำนวนมากที่สุด และโดยเฉพาะอย่างยิ่งภายในโมเดลคลาวด์สาธารณะ เป็นไปไม่ได้หรือในทางปฏิบัติสำหรับผู้ให้บริการคลาวด์ในการเปลี่ยนแปลงบริการของตนตามความต้องการเฉพาะของลูกค้า"},{"id":54,"q":"Which of the following pertains to fire safety standards within a data center, specifically with their enormous electrical consumption?","a":["NFPA","BICSI","IDCA","Uptime Institute"],"ans":"A","exp":"The standards put out by the National Fire Protection Association (NFPA) cover general fire protection best practices for any type of facility, but also specific publications pertaining to IT equipment and data centers.","qth":"ข้อใดต่อไปนี้เกี่ยวข้องกับมาตรฐานความปลอดภัยจากอัคคีภัยภายในศูนย์ข้อมูล โดยเฉพาะอย่างยิ่งกับการใช้ไฟฟ้าจำนวนมหาศาล","ath":["NFPA","BICSI","IDCA","Uptime Institute"],"expth":"มาตรฐานที่ออกโดย National Fire Protection Association (NFPA) ครอบคลุมแนวทางปฏิบัติที่ดีที่สุดในการป้องกันอัคคีภัยทั่วไปสำหรับสถานที่ทุกประเภท แต่ยังรวมไปถึงสิ่งพิมพ์เฉพาะที่เกี่ยวข้องกับอุปกรณ์ IT และศูนย์ข้อมูล"},{"id":55,"q":"Which technique involves replacing values within a specific data field to protect sensitive data?","a":["Anonymization","Masking","Tokenization","Obfuscation"],"ans":"B","exp":"Masking involves replacing specific data within a data set with new values. For example, with credit card fields, as most who have ever purchased anything online can attest, nearly the entire credit card number is masked with a character such as an asterisk, with the last four digits left visible for identification and confirmation.","qth":"เทคนิคใดที่เกี่ยวข้องกับการแทนที่ค่าภายในฟิลด์ข้อมูลเฉพาะเพื่อปกป้องข้อมูลที่ละเอียดอ่อน","ath":["การลบข้อมูลระบุตัวบุคคล","การมาสก์","การแปลงโทเค็น","การทำให้งงงวย"],"expth":"การมาสก์เกี่ยวข้องกับการแทนที่ข้อมูลเฉพาะภายในชุดข้อมูลด้วยค่าใหม่ ตัวอย่างเช่น ในช่องบัตรเครดิต เนื่องจากคนส่วนใหญ่ที่เคยซื้อสินค้าทางออนไลน์สามารถยืนยันได้ หมายเลขบัตรเครดิตเกือบทั้งหมดจะถูกปกปิดด้วยอักขระ เช่น เครื่องหมายดอกจัน โดยจะเหลือตัวเลขสี่หลักสุดท้ายไว้เพื่อระบุตัวตนและการยืนยัน"},{"id":56,"q":"What expectation of data custodians is made much more challenging by a cloud implementation, especially with PaaS or SaaS?","a":["Data classification","Knowledge of systems","Access to data","Encryption requirements"],"ans":"B","exp":"Under the Federal Rules of Civil Procedure, data custodians are assumed and expected to have full and comprehensive knowledge of the internal design and architecture of their systems. In a cloud environment, especially with PaaS and SaaS, it is impossible for the data custodian to have this knowledge because those systems are controlled by the cloud provider and protected as proprietary knowledge.","qth":"ความคาดหวังของผู้ดูแลข้อมูลมีความท้าทายมากขึ้นโดยการใช้งานระบบคลาวด์ โดยเฉพาะอย่างยิ่งกับ PaaS หรือ SaaS","ath":["การจำแนกประเภทข้อมูล","ความรู้ของระบบ","การเข้าถึงข้อมูล","ข้อกำหนดในการเข้ารหัส"],"expth":"ภายใต้กฎเกณฑ์ของกระบวนการพิจารณาคดีแพ่งของรัฐบาลกลาง ผู้ดูแลข้อมูลจะถูกสันนิษฐานและคาดว่าจะมีความรู้ที่ครบถ้วนและครอบคลุมเกี่ยวกับการออกแบบภายในและสถาปัตยกรรมของ ระบบของพวกเขา ในสภาพแวดล้อมคลาวด์ โดยเฉพาะอย่างยิ่งกับ PaaS และ SaaS เป็นไปไม่ได้ที่ผู้ดูแลข้อมูลจะมีความรู้นี้ เนื่องจากระบบเหล่านั้นถูกควบคุมโดยผู้ให้บริการคลาวด์และได้รับการปกป้องเป็นความรู้ที่เป็นกรรมสิทธิ์"},{"id":57,"q":"What type of PII is controlled based on laws and carries legal penalties for noncompliance with requirements?","a":["Contractual","Regulated","Specific","Jurisdictional"],"ans":"B","exp":"Regulated PII involves those requirements put forth by specific laws or regulations, and unlike contractual PII, where a violation can lead to contractual penalties, a violation of regulated PII can lead to fines or even criminal charges in some jurisdictions. PII regulations can depend on either the jurisdiction that applies to the hosting location or application or specific legislation based on the industry or type of data used.","qth":"PII ประเภทใดถูกควบคุมด้วยกฎหมาย และมีโทษทางกฎหมายหากไม่ปฏิบัติตาม","ath":["ตามสัญญา","ตามกฎหมายกำกับ (Regulated)","เฉพาะเจาะจง","ตามเขตอำนาจศาล"],"expth":"PII ตามกฎหมายกำกับมาจากกฎหมาย หากฝ่าฝืนอาจถูกปรับหรือโทษอาญา ต่างจาก PII ตามสัญญาที่มีเพียงโทษตามสัญญา"},{"id":58,"q":"Which if the following is NOT one of the three components of a federated identity system transaction?","a":["Relying party","Identity provider","User","Proxy relay"],"ans":"D","exp":"","qth":"ซึ่งหากสิ่งต่อไปนี้ไม่ใช่หนึ่งในสามองค์ประกอบของธุรกรรมระบบข้อมูลประจำตัวแบบรวมศูนย์?","ath":["ฝ่ายที่พึ่งพา","ผู้ให้บริการข้อมูลประจำตัว","ผู้ใช้","การถ่ายทอดพร็อกซี"],"expth":""},{"id":59,"q":"Which value refers to the amount of time it takes to recover operations in a BCDR situation to meet management's objectives?","a":["RSL","RPO","SRE","RTO"],"ans":"D","exp":"The recovery time objective (RTO) is a measure of the amount of time it would take to recover operations in the event of a disaster to the point where management's objectives are met for BCDR.","qth":"ค่าใดหมายถึงระยะเวลาที่ใช้ในการกู้คืนการดำเนินงานในสถานการณ์ BCDR เพื่อให้บรรลุวัตถุประสงค์ของฝ่ายบริหาร?","ath":["RSL","RPO","SRE","RTO"],"expth":"วัตถุประสงค์ของเวลาการกู้คืน (RTO) คือการวัดระยะเวลาที่จะใช้ในการกู้คืนการดำเนินการในกรณีเกิดภัยพิบัติจนถึงจุดที่บรรลุวัตถุประสงค์ของฝ่ายบริหารสำหรับ BCDR"},{"id":60,"q":"Which of the cloud deployment models requires the cloud customer to be part of a specific group or organization in order to host cloud services within it?","a":["Community","Hybrid","Private","Public"],"ans":"A","exp":"A community cloud model is where customers that share a certain common bond or group membership come together to offer cloud services to their members, focused on common goals and interests.","qth":"โมเดลการปรับใช้คลาวด์แบบใดที่กำหนดให้ลูกค้าคลาวด์ต้องเป็นส่วนหนึ่งของกลุ่มหรือองค์กรเฉพาะเพื่อโฮสต์บริการคลาวด์ภายในกลุ่มหรือองค์กรนั้นๆ","ath":["ชุมชน","ไฮบริด","ส่วนตัว","สาธารณะ"],"expth":"โมเดลคลาวด์ชุมชนคือที่ที่ลูกค้าที่มีพันธะร่วมกันหรือการเป็นสมาชิกกลุ่มมารวมตัวกันเพื่อเสนอบริการคลาวด์ให้กับสมาชิก โดยมุ่งเน้นไปที่เป้าหมายและความสนใจร่วมกัน"},{"id":61,"q":"What provides the information to an application to make decisions about the authorization level appropriate when granting access?","a":["User","Relying party","Federation","Identity Provider"],"ans":"D","exp":"Upon successful user authentication, the identity provider gives information about the user to the relying party that it needs to make authorization decisions for granting access as well as the level of access needed.","qth":"อะไรให้ข้อมูลแก่แอปพลิเคชันเพื่อตัดสินใจเกี่ยวกับระดับการอนุญาตที่เหมาะสมเมื่อให้สิทธิ์การเข้าถึง","ath":["ผู้ใช้","ฝ่ายที่เกี่ยวข้อง","สหพันธรัฐ","ผู้ให้บริการข้อมูลประจำตัว"],"expth":"เมื่อการตรวจสอบสิทธิ์ผู้ใช้สำเร็จ ผู้ให้บริการข้อมูลประจำตัวจะให้ข้อมูลเกี่ยวกับผู้ใช้แก่ฝ่ายที่พึ่งพาซึ่งจำเป็นต้องทำการตัดสินใจในการอนุญาตสำหรับการให้สิทธิ์การเข้าถึงตลอดจนระดับของการเข้าถึงที่จำเป็น"},{"id":62,"q":"What is a standard configuration and policy set that is applied to systems and virtual machines called?","a":["Standardization","Baseline","Hardening","Redline"],"ans":"B","exp":"The most common and efficient manner of securing operating systems is through the use of baselines. A baseline is a standardized and understood set of base configurations and settings. When a new system is built or a new virtual machine is established, baselines will be applied to a new image to ensure the base configuration meets organizational policy and regulatory requirements.","qth":"การกำหนดค่ามาตรฐานและชุดนโยบายที่ใช้กับระบบและเครื่องเสมือนเรียกว่าอะไร?","ath":["การทำให้เป็นมาตรฐาน","พื้นฐาน","การแข็งตัว","เส้นแดง"],"expth":"ลักษณะทั่วไปและมีประสิทธิภาพที่สุดในการรักษาความปลอดภัยระบบปฏิบัติการคือการใช้เส้นพื้นฐาน เส้นพื้นฐานคือชุดการกำหนดค่าและการตั้งค่าพื้นฐานที่เป็นมาตรฐานและเข้าใจได้ เมื่อมีการสร้างระบบใหม่หรือสร้างเครื่องเสมือนใหม่ เส้นพื้นฐานจะถูกนำไปใช้กับอิมเมจใหม่เพื่อให้แน่ใจว่าการกำหนดค่าพื้นฐานเป็นไปตามนโยบายองค์กรและข้อกำหนดด้านกฎระเบียบ"},{"id":63,"q":"Which entity requires all collection and storing of data on their citizens to be done on hardware that resides within their borders?","a":["Russia","France","Germany","United States"],"ans":"A","exp":"Signed into law and effective starting on September 1, 2015, Russian Law 526-FZ establishes that any collecting, storing, or processing of personal information or data on Russian citizens must be done from systems and databases that are physically located with the Russian Federation.","qth":"หน่วยงานใดกำหนดให้การรวบรวมและจัดเก็บข้อมูลทั้งหมดเกี่ยวกับพลเมืองของตนบนฮาร์ดแวร์ที่อยู่ภายในขอบเขตของตน","ath":["รัสเซีย","ฝรั่งเศส","เยอรมนี","สหรัฐอเมริกา"],"expth":"ลงนามในกฎหมายและมีผลตั้งแต่วันที่ 1 กันยายน 2015 กฎหมายรัสเซีย 526-FZ กำหนดว่าการรวบรวม จัดเก็บ หรือประมวลผลข้อมูลส่วนบุคคลหรือข้อมูลใดๆ สำหรับพลเมืองรัสเซียจะต้องดำเนินการจากระบบและฐานข้อมูลที่ตั้งอยู่กับสหพันธรัฐรัสเซีย"},{"id":64,"q":"Which of the cloud cross-cutting aspects relates to the ability to easily move services and applications between different cloud providers?","a":["Reversibility","Availability","Portability","Interoperability"],"ans":"C","exp":"Portability is the ease with which a service or application can be moved between different cloud providers. Maintaining portability gives an organization great flexibility between cloud providers and the ability to shop for better deals or offerings.","qth":"แง่มุมใดที่ข้ามระบบคลาวด์ที่เกี่ยวข้องกับความสามารถสำหรับลูกค้าคลาวด์ในการลบแอปพลิเคชันและข้อมูลของตนออกจากสภาพแวดล้อมคลาวด์ได้อย่างง่ายดาย","ath":["การย้อนกลับได้","ความพร้อมใช้งาน","การพกพา","การทำงานร่วมกัน"],"expth":"การย้อนกลับคือความสามารถสำหรับลูกค้าคลาวด์ในการลบแอปพลิเคชันหรือข้อมูลของตนออกจากสภาพแวดล้อมคลาวด์ได้อย่างง่ายดาย ตลอดจนเพื่อให้แน่ใจว่ามีการติดตามแอปพลิเคชันทั้งหมดหรือ ข้อมูลถูกลบออกอย่างปลอดภัยตามข้อตกลงที่กำหนดไว้ล่วงหน้ากับผู้ให้บริการคลาวด์"},{"id":65,"q":"Which type of audit report is considered a \"restricted use\" report for its intended audience?","a":["SAS-70","SSAE-16","SOC Type 1","SOC Type 2"],"ans":"C","exp":"SOC Type 1 reports are considered \"restricted use\" reports. They are intended for management and stakeholders of an organization, clients of the service organization, and auditors of the organization. They are not intended for release beyond those audiences.","qth":"รายงานการตรวจสอบประเภทใดที่ถือเป็นรายงาน \"การใช้งานแบบจำกัด\" สำหรับกลุ่มเป้าหมาย","ath":["SAS-70","SSAE-16","SOC ประเภท 1","SOC ประเภท 2"],"expth":"รายงาน SOC Type 1 เป็นรายงานแบบจำกัดการใช้ สำหรับผู้บริหาร ผู้มีส่วนได้เสีย ลูกค้าปัจจุบัน และผู้สอบบัญชี ไม่ได้มีไว้เผยแพร่ทั่วไป"},{"id":66,"q":"Which of the following is the MOST important requirement and guidance for testing during an audit?","a":["Stakeholders","Shareholders","Management","Regulations"],"ans":"D","exp":"During any audit, regulations are the most important factor and guidelines for what must be tested. Although the requirements from management, stakeholders, and shareholders are also important, regulations are not negotiable and pose the biggest risk to any organization for compliance failure.","qth":"ข้อใดต่อไปนี้เป็นข้อกำหนดและคำแนะนำที่สำคัญที่สุดสำหรับการทดสอบในระหว่างการตรวจสอบ","ath":["ผู้มีส่วนได้ส่วนเสีย","ผู้ถือหุ้น","การจัดการ","กฎระเบียบ"],"expth":"ในระหว่างการตรวจสอบ กฎระเบียบเป็นปัจจัยและแนวทางที่สำคัญที่สุดสำหรับสิ่งที่ต้องทดสอบ แม้ว่าข้อกำหนดจากฝ่ายบริหาร ผู้มีส่วนได้ส่วนเสีย และผู้ถือหุ้นก็มีความสำคัญเช่นกัน แต่กฎระเบียบไม่สามารถเจรจาต่อรองได้และก่อให้เกิดความเสี่ยงที่ใหญ่ที่สุดสำหรับองค์กรใดๆ สำหรับความล้มเหลวในการปฏิบัติตามกฎระเบียบ"},{"id":67,"q":"Which value refers to the amount of data an organization would need to recover in the event of a BCDR situation in order to reach an acceptable level of operations?","a":["SRE","RTO","RPO","RSL"],"ans":"C","exp":"The recovery point objective (RPO) is defined as the amount of data a company would need to maintain and recover in order to function at a level acceptable to management. This may or may not be a restoration to full operating capacity, depending on what management deems as crucial and essential.","qth":"ค่าใดหมายถึงปริมาณข้อมูลที่องค์กรจะต้องกู้คืนในกรณีของสถานการณ์ BCDR เพื่อให้บรรลุระดับการปฏิบัติงานที่ยอมรับได้","ath":["SRE","RTO","RPO","RSL"],"expth":"วัตถุประสงค์จุดกู้คืน (RPO) หมายถึงปริมาณข้อมูลที่บริษัทจะต้องรักษาและกู้คืนเพื่อที่จะทำงานในระดับที่ฝ่ายบริหารยอมรับได้ นี่อาจจะเป็นหรือไม่ใช่การฟื้นฟูให้เต็มประสิทธิภาพก็ได้ ขึ้นอยู่กับสิ่งที่ฝ่ายบริหารเห็นว่าสำคัญและจำเป็น"},{"id":68,"q":"What must SOAP rely on for security?","a":["Encryption","Tokenization","TLS","SSL"],"ans":"A","exp":"Simple Object Access Protocol (SOAP) uses Extensible Markup Language (XML) for passing data, and it must rely on the encryption of those data packages for security.","qth":"SOAP ต้องพึ่งพาอะไรเพื่อความปลอดภัย","ath":["การเข้ารหัส","Tokenization","TLS","SSL"],"expth":"Simple Object Access Protocol (SOAP) ใช้ Extensible Markup Language (XML) สำหรับการส่งผ่านข้อมูล และจะต้องอาศัยการเข้ารหัสของแพ็คเกจข้อมูลเหล่านั้นเพื่อความปลอดภัย"},{"id":69,"q":"What type of data does data rights management (DRM) protect?","a":["Consumer","PII","Financial","Healthcare"],"ans":"A","exp":"DRM applies to the protection of consumer media, such as music, publications, video, movies, and soon.","qth":"การจัดการสิทธิ์ในข้อมูล (DRM) ปกป้องข้อมูลประเภทใด","ath":["ผู้บริโภค","PII (ข้อมูลส่วนบุคคลที่ระบุตัวตนได้)","การเงิน","การดูแลสุขภาพ"],"expth":"DRM นำไปใช้กับการปกป้องสื่อผู้บริโภค เช่น เพลง สิ่งพิมพ์ วิดีโอ ภาพยนตร์ และเร็วๆ นี้"},{"id":70,"q":"Which type of testing uses the same strategies and toolsets that hackers would use?","a":["Penetration","Dynamic","Static","Malicious"],"ans":"A","exp":"Penetration testing involves using the same strategies and toolsets that hackers would use against a system to discovery potential vulnerabilities.","qth":"การทดสอบประเภทใดใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮ็กเกอร์จะใช้","ath":["การเจาะระบบ","ไดนามิก","แบบคงที่","ที่เป็นอันตราย"],"expth":"การทดสอบการเจาะระบบเกี่ยวข้องกับการใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮ็กเกอร์จะใช้กับระบบเพื่อค้นหาช่องโหว่ที่อาจเกิดขึ้น"},{"id":71,"q":"Which of the following is NOT a focus or consideration of an internal audit?","a":["Certification","Design","Costs","Operational efficiency"],"ans":"A","exp":"In order to obtain and comply with certifications, independent external audits must be performed and satisfied. Although some testing of certification controls can be part of an internal audit, they will not satisfy requirements.","qth":"ข้อใดต่อไปนี้ไม่ใช่จุดมุ่งเน้นหรือการพิจารณาของการตรวจสอบภายใน การรับรองมาตรฐาน","ath":["การรับรอง","การออกแบบ","ต้นทุน","ประสิทธิภาพการดำเนินงาน"],"expth":"เพื่อให้ได้รับและปฏิบัติตามใบรับรอง จะต้องดำเนินการและปฏิบัติตามการตรวจสอบภายนอกที่เป็นอิสระและพึงพอใจ แม้ว่าการทดสอบการควบคุมการรับรองบางอย่างอาจเป็นส่วนหนึ่งของการตรวจสอบภายใน แต่ก็จะไม่เป็นไปตามข้อกำหนด"},{"id":72,"q":"What process is used within a clustered system to provide high availability and load balancing?","a":["Dynamic balancing","Dynamic clustering","Dynamic optimization","Dynamic resource scheduling"],"ans":"D","exp":"Dynamic resource scheduling (DRS) is used within all clustering systems as the method for clusters to provide high availability, scaling, management, and workload distribution and balancing of jobs and processes. From a physical infrastructure perspective, DRS is used to balance compute loads between physical hosts in a cloud to maintain the desired thresholds and limits on the physical hosts.","qth":"กระบวนการใดที่ใช้ภายในระบบคลัสเตอร์เพื่อให้มีความพร้อมใช้งานสูงและการปรับสมดุลโหลด","ath":["การปรับสมดุลแบบไดนามิก","การจัดคลัสเตอร์แบบไดนามิก","การปรับให้เหมาะสมแบบไดนามิก","การจัดสรรทรัพยากรแบบไดนามิก"],"expth":"การจัดตารางเวลาทรัพยากรแบบไดนามิก (DRS) ถูกใช้ภายในระบบการทำคลัสเตอร์ทั้งหมดเป็นวิธีการสำหรับคลัสเตอร์เพื่อให้มีความพร้อมใช้งานสูง การปรับขนาด การจัดการ และการกระจายปริมาณงาน และการปรับสมดุลของงานและกระบวนการ จากมุมมองของโครงสร้างพื้นฐานทางกายภาพ DRS ถูกใช้เพื่อสร้างสมดุลโหลดการประมวลผลระหว่างโฮสต์จริงในระบบคลาวด์ เพื่อรักษาเกณฑ์และขีดจำกัดที่ต้องการบนโฮสต์จริง"},{"id":73,"q":"What changes are necessary to application code in order to implement DNSSEC?","a":["Adding encryption modules","Implementing certificate validations","Additional DNS lookups","No changes are needed."],"ans":"D","exp":"To implement DNSSEC, no additional changes are needed to applications or their code because the integrity checks are all performed at the system level.","qth":"การเปลี่ยนแปลงใดที่จำเป็นในรหัสแอปพลิเคชันเพื่อใช้ DNSSEC","ath":["การเพิ่มโมดูลการเข้ารหัส","การใช้การตรวจสอบใบรับรอง","การค้นหา DNS เพิ่มเติม","ไม่จำเป็นต้องเปลี่ยนแปลง"],"expth":"ในการใช้ DNSSEC ไม่จำเป็นต้องมีการเปลี่ยนแปลงเพิ่มเติมกับแอปพลิเคชันหรือรหัส เนื่องจากการตรวจสอบความสมบูรณ์ทั้งหมดจะดำเนินการในระดับระบบ"},{"id":74,"q":"Which type of controls are the SOC Type 1 reports specifically focused on?","a":["Integrity","PII","Financial","Privacy"],"ans":"C","exp":"SOC Type 1 reports are focused specifically on internal controls as they relate to financial reporting.","qth":"การควบคุมประเภทใดที่รายงาน SOC ประเภท 1 เน้นเป็นพิเศษ","ath":["ความซื่อสัตย์","PII (ข้อมูลส่วนบุคคลที่ระบุตัวตนได้)","การเงิน","ความเป็นส่วนตัว"],"expth":"รายงาน SOC ประเภท 1 มุ่งเน้นไปที่การควบคุมภายในโดยเฉพาะเนื่องจากเกี่ยวข้องกับการรายงานทางการเงิน"},{"id":75,"q":"Which of the following is NOT a domain of the Cloud Controls Matrix (CCM)?","a":["Data center security","Human resources","Mobile security","Budgetary and cost controls"],"ans":"D","exp":"Budgetary and cost controls is not one of the domains outlined in the CCM.","qth":"ข้อใดต่อไปนี้ไม่ใช่โดเมนของ Cloud Controls Matrix (CCM)?","ath":["ความปลอดภัยของศูนย์ข้อมูล","ทรัพยากรบุคคล","ความปลอดภัยบนมือถือ","การควบคุมงบประมาณและต้นทุน"],"expth":"การควบคุมงบประมาณและต้นทุนไม่ใช่หนึ่งในโดเมนที่ระบุไว้ใน CCM"},{"id":76,"q":"Which security concept, if implemented correctly, will protect the data on a system, even if a malicious actor gains access to the actual system?","a":["Sandboxing","Encryption","Firewalls","Access control"],"ans":"B","exp":"In any environment, data encryption is incredibly important to prevent unauthorized exposure of data either internally or externally. If a system is compromised by an attack, having the data encrypted on the system will prevent its unauthorized exposure or export, even with the system itself being exposed.","qth":"แนวคิดด้านความปลอดภัยใด หากนำไปใช้อย่างถูกต้อง จะปกป้องข้อมูลบนระบบ แม้ว่าผู้ประสงค์ร้ายจะสามารถเข้าถึงระบบจริงได้ก็ตาม","ath":["แซนด์บ็อกซ์","การเข้ารหัส","ไฟร์วอลล์","การควบคุมการเข้าถึง"],"expth":"ในทุกสภาพแวดล้อม การเข้ารหัสข้อมูลมีความสำคัญอย่างยิ่งในการป้องกันการเปิดเผยข้อมูลโดยไม่ได้รับอนุญาตทั้งภายในหรือภายนอก หากระบบถูกบุกรุกจากการโจมตี การมีข้อมูลที่เข้ารหัสบนระบบจะป้องกันการเปิดเผยหรือการส่งออกโดยไม่ได้รับอนุญาต แม้ว่าตัวระบบเองจะถูกเปิดเผยก็ตาม"},{"id":77,"q":"Which of the following is NOT a factor that is part of a firewall configuration?","a":["Encryption","Port","Protocol","Source IP"],"ans":"A","exp":"Firewalls take into account source IP, destination IP, the port the traffic is using, as well as the network protocol (UDP/TCP). Whether or not the traffic is encrypted is not something a firewall is concerned with.","qth":"ข้อใดต่อไปนี้ไม่ใช่ปัจจัยที่เป็นส่วนหนึ่งของการกำหนดค่าไฟร์วอลล์?","ath":["การเข้ารหัส","พอร์ต","โปรโตคอล","IP ต้นทาง"],"expth":"ไฟร์วอลล์คำนึงถึง IP ต้นทาง, IP ปลายทาง พอร์ตที่การรับส่งข้อมูลใช้ รวมถึงโปรโตคอลเครือข่าย (UDP/TCP) การที่การรับส่งข้อมูลจะถูกเข้ารหัสหรือไม่นั้นไม่ใช่เรื่องที่เกี่ยวข้องกับไฟร์วอลล์"},{"id":78,"q":"Which of the cloud deployment models involves spanning multiple cloud environments or a mix of cloud hosting models?","a":["Community","Public","Hybrid","Private"],"ans":"C","exp":"A hybrid cloud model involves the use of more than one type of cloud hosting models, typically the mix of private and public cloud hosting models.","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดที่เกี่ยวข้องกับการขยายสภาพแวดล้อมคลาวด์หลายแบบหรือการผสมผสานระหว่างโมเดลโฮสติ้งบนคลาวด์","ath":["ชุมชน","สาธารณะ","ไฮบริด","ส่วนตัว"],"expth":"โมเดลคลาวด์ไฮบริดเกี่ยวข้องกับการใช้โมเดลโฮสติ้งบนคลาวด์มากกว่าหนึ่งประเภท โดยทั่วไปจะเป็นการผสมผสานระหว่างโมเดลโฮสติ้งบนคลาวด์ส่วนตัวและสาธารณะ"},{"id":79,"q":"Which of the following is NOT one of five principles of SOC Type 2 audits?","a":["Privacy","Processing integrity","Financial","Security"],"ans":"C","exp":"The SOC Type 2 audits include five principles: security, privacy, processing integrity, availability, and confidentiality.","qth":"ข้อใดต่อไปนี้ไม่ใช่หนึ่งในห้าหลักการของการตรวจสอบ SOC ประเภท 2","ath":["ความเป็นส่วนตัว","ความสมบูรณ์ของการประมวลผล","การเงิน","ความปลอดภัย"],"expth":"การตรวจสอบ SOC ประเภท 2 ประกอบด้วยหลักการห้าประการ: ความปลอดภัย ความเป็นส่วนตัว ความสมบูรณ์ของการประมวลผล ความพร้อมใช้งาน และการรักษาความลับ"},{"id":80,"q":"Which aspect of cloud computing makes data classification even more vital than in a traditional data center?","a":["Interoperability","Virtualization","Multitenancy","Portability"],"ans":"C","exp":"With multiple tenants within the same hosting environment, any failure to properly classify data may lead to potential exposure to other customers and applications within the same environment.","qth":"ด้านใดของการประมวลผลแบบคลาวด์ที่ทำให้การจำแนกข้อมูลมีความสำคัญมากกว่าในศูนย์ข้อมูลแบบเดิม","ath":["การทำงานร่วมกัน","การจำลองเสมือน","การเช่าหลายรายการ","การพกพา"],"expth":"เมื่อมีผู้เช่าหลายรายภายในสภาพแวดล้อมการโฮสต์เดียวกัน ความล้มเหลวในการจำแนกข้อมูลอย่างเหมาะสมอาจนำไปสู่การเปิดเผยต่อลูกค้าและแอปพลิเคชันอื่น ๆ ภายในสภาพแวดล้อมเดียวกัน"},{"id":81,"q":"What concept does the \"T\" represent in the STRIDE threat model?","a":["TLS","Testing","Tampering with data","Transport"],"ans":"C","exp":"Explanation Any application that sends data to the user will face the potential that the user could manipulate or alter the data, whether it resides in cookies, GET or POST commands, or headers, or manipulates client-side validations. If the user receives data from the application, it is crucial that the application validate and verify any data that is received back from the user.","qth":"แนวคิดใดที่ “T\" เป็นตัวแทนในรูปแบบภัยคุกคาม STRIDE","ath":["TLS","การทดสอบ","การเจาะข้อมูล","การขนส่ง"],"expth":"คำอธิบาย แอปพลิเคชันใด ๆ ที่ส่งข้อมูลไปยังผู้ใช้จะเผชิญกับความเป็นไปได้ที่ผู้ใช้สามารถจัดการหรือเปลี่ยนแปลงข้อมูลได้ ไม่ว่าจะอยู่ในคุกกี้ คำสั่ง GET หรือ POST หรือส่วนหัว หรือจัดการ การตรวจสอบฝั่งไคลเอ็นต์ หากผู้ใช้ได้รับข้อมูลจากแอปพลิเคชัน สิ่งสำคัญคือแอปพลิเคชันจะต้องตรวจสอบและตรวจสอบข้อมูลใด ๆ ที่ได้รับกลับมาจากผู้ใช้"},{"id":82,"q":"Which of the following would be a reason to undertake a BCDR test?","a":["Functional change of the application","Change in staff","User interface overhaul of the application","Change in regulations"],"ans":"A","exp":"Any time a major functional change of an application occurs, a new BCDR test should be done to ensure the overall strategy and process are still applicable and appropriate.","qth":"ข้อใดต่อไปนี้จะเป็นเหตุผลในการดำเนินการทดสอบ BCDR","ath":["การเปลี่ยนแปลงฟังก์ชันของแอปพลิเคชัน","การเปลี่ยนแปลงในพนักงาน","ยกเครื่องอินเทอร์เฟซผู้ใช้ของแอปพลิเคชัน","การเปลี่ยนแปลงกฎระเบียบ"],"expth":"ทุกครั้งที่มีการเปลี่ยนแปลงการทำงานที่สำคัญของแอปพลิเคชันเกิดขึ้น ควรทำการทดสอบ BCDR ใหม่เพื่อให้แน่ใจว่ากลยุทธ์และกระบวนการโดยรวมยังคงมีผลบังคับใช้และเหมาะสม"},{"id":83,"q":"Which crucial aspect of cloud computing can be most threatened by insecure APIs?","a":["Automation","Redundancy","Resource pooling","Elasticity"],"ans":"A","exp":"Cloud environments depend heavily on API calls for management and automation
