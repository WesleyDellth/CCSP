dditional security via proxying, filtering service requests, or blocking based on additional factors such as the client and requests.","qth":"ระบบใดต่อไปนี้ถูกใช้เพื่อใช้เทคนิคที่หลากหลายเพื่อค้นหาและแจ้งเตือนเกี่ยวกับภัยคุกคามและภัยคุกคามที่อาจเกิดขึ้นกับระบบและเครือข่าย เอดส์","ath":["IDS (ระบบตรวจจับการบุกรุก)","ไอพีเอส","ไฟร์วอลล์","วัฟ"],"expth":"ระบบตรวจจับการบุกรุก (IDS) ถูกนำมาใช้เพื่อเฝ้าดูการรับส่งข้อมูลเครือข่ายและการดำเนินงาน โดยใช้เกณฑ์หรือลายเซ็นที่กำหนดไว้ล่วงหน้า และแจ้งเตือนผู้ดูแลระบบหากพบสิ่งที่ต้องสงสัย ระบบป้องกันการบุกรุก (IPS) คล้ายกับ IDS แต่จริงๆ แล้วจะดำเนินการกับการรับส่งข้อมูลที่ต้องสงสัย ในขณะที่ IDS จะแจ้งเตือนเมื่อพบสิ่งที่ต้องสงสัย ไฟร์วอลล์ทำงานในระดับเครือข่ายและพิจารณาเฉพาะที่อยู่ IP พอร์ต และโปรโตคอลเท่านั้น มันไม่ได้ตรวจสอบปริมาณการใช้ข้อมูลสำหรับรูปแบบหรือเนื้อหา ไฟร์วอลล์แอปพลิเคชันเว็บ (WAF) ทำงานที่ชั้นแอปพลิเคชันและให้ความปลอดภัยเพิ่มเติมผ่านการพร็อกซี การกรองคำขอบริการ หรือการบล็อกตามปัจจัยเพิ่มเติม เช่น ไคลเอ็นต์และคำขอ"},{"id":155,"q":"Which of the following is not a risk management framework?","a":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"ans":"B","exp":"Hex GBL is a reference to a computer part in Terry Pratchett’s fictional Discworld universe. The rest are not.","qth":"ข้อใดต่อไปนี้ไม่ใช่กรอบการบริหารความเสี่ยง","ath":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"expth":"Hex GBL เป็นการอ้างอิงถึงชิ้นส่วนคอมพิวเตอร์ในจักรวาล Discworld ของ Terry Pratchett ส่วนที่เหลือไม่ได้"},{"id":156,"q":"In order to ensure ongoing compliance with regulatory requirements, which phase of the cloud data lifecycle must be tested regularly?","a":["Archive","Share","Store","Destroy"],"ans":"A","exp":"In order to ensure compliance with regulations, it is important for an organization to regularly test the restorability of archived data. As technologies change and older systems are deprecated, the risk rises for an organization to lose the ability to restore data from the format in which it is stored. With the destroy, store, and share phases, the currently used technologies will be sufficient for an organization's needs in an ongoing basis, so the risk that is elevated with archived data is not present.","qth":"เพื่อให้มั่นใจว่าสอดคล้องกับข้อกำหนดด้านกฎระเบียบอย่างต่อเนื่อง ระยะใดของวงจรการใช้งานข้อมูลบนคลาวด์จะต้องได้รับการทดสอบเป็นประจำ","ath":["เก็บถาวร","แบ่งปัน","จัดเก็บ","ทำลาย"],"expth":"เพื่อให้มั่นใจว่าเป็นไปตามกฎระเบียบ เป็นสิ่งสำคัญสำหรับองค์กรในการทดสอบความสามารถในการกู้คืนของข้อมูลที่เก็บไว้เป็นประจำ เมื่อเทคโนโลยีเปลี่ยนแปลงและระบบเก่าๆ เลิกใช้งานแล้ว องค์กรจึงมีความเสี่ยงเพิ่มขึ้นที่จะสูญเสียความสามารถในการกู้คืนข้อมูลจากรูปแบบที่จัดเก็บไว้ ด้วยขั้นตอนการทำลาย จัดเก็บ และแบ่งปัน เทคโนโลยีที่ใช้อยู่ในปัจจุบันจะเพียงพอต่อความต้องการขององค์กรอย่างต่อเนื่อง ดังนั้นจึงไม่มีความเสี่ยงที่เพิ่มขึ้นจากข้อมูลที่จัดเก็บถาวร"},{"id":157,"q":"Which of the following threat types involves leveraging a user's browser to send untrusted data to be executed with legitimate access via the user’s valid credentials?","a":["Injection","Missing function-level access control","Cross-site scripting","Cross-site request forgery"],"ans":"C","exp":"[Key corrected from source dump. Dump listed D (CSRF). Stem and explanation describe XSS: untrusted data executed in the browser.] Explanation Cross-site scripting (XSS) is an attack where a malicious actor is able to send untrusted data to a user's browser without going through any validation or sanitization processes, or perhaps the code is not properly escaped from processing by the browser. The code is then executed on the user's browser with their own access and permissions, allowing the attacker to redirect the user's web traffic, steal data from their session, or potentially access information on the user's own computer that their browser has the ability to access. Missing function-level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call. An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part of its normal processing and queries. Cross-site request forgery occurs when an attack forces an authenticated user to send forged requests to an application running under their own access and credentials.","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับการใช้ประโยชน์จากเบราว์เซอร์ของผู้ใช้เพื่อส่งข้อมูลที่ไม่น่าเชื่อถือเพื่อดำเนินการด้วยการเข้าถึงที่ถูกต้องผ่านข้อมูลประจำตัวที่ถูกต้องของผู้ใช้","ath":["การฉีด","ไม่มีการควบคุมการเข้าถึงระดับฟังก์ชัน","การเขียนสคริปต์ข้ามไซต์","การปลอมแปลงคำขอข้ามไซต์ คำตอบที่แนะนำ คำอธิบายการเขียนสคริปต์ข้ามไซต์ (XSS) เป็นการโจมตี โดยที่ผู้ประสงค์ร้ายสามารถส่งข้อมูลที่ไม่น่าเชื่อถือไปยังเบราว์เซอร์ของผู้ใช้โดยไม่ต้องผ่านกระบวนการตรวจสอบหรือฆ่าเชื้อใดๆ หรือบางทีโค้ดอาจไม่สามารถหลบหนีจากการประมวลผลโดยเบราว์เซอร์ได้อย่างเหมาะสม จากนั้นโค้ดจะถูกดำเนินการบนเบราว์เซอร์ของผู้ใช้ด้วยการเข้าถึงและการอนุญาตของตนเอง ทำให้ผู้โจมตีสามารถเปลี่ยนเส้นทางการรับส่งข้อมูลเว็บของผู้ใช้ ขโมยข้อมูลจากเซสชันของพวกเขา หรืออาจเข้าถึงข้อมูลบนคอมพิวเตอร์ของผู้ใช้เองที่เบราว์เซอร์ของพวกเขาสามารถเข้าถึงได้ การควบคุมการเข้าถึงระดับฟังก์ชันหายไปโดยที่แอปพลิเคชันตรวจสอบการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบเริ่มต้นเท่านั้น และไม่ได้ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การโจมตีแบบฉีดคือการที่ผู้ประสงค์ร้ายส่งคำสั่งหรือข้อมูลที่กำหนดเองอื่น ๆ ผ่านทางช่องป้อนข้อมูลและช่องข้อมูลโดยมีจุดประสงค์เพื่อให้แอปพลิเคชันหรือระบบดำเนินการโค้ดซึ่งเป็นส่วนหนึ่งของการประมวลผลและการสืบค้นตามปกติ การปลอมแปลงคำขอข้ามไซต์เกิดขึ้นเมื่อการโจมตีบังคับให้ผู้ใช้ที่ได้รับการรับรองความถูกต้องส่งคำขอปลอมไปยังแอปพลิเคชันที่ทำงานภายใต้การเข้าถึงและข้อมูลประจำตัวของตนเอง"],"expth":"แก้ไขเฉลยจากต้นฉบับที่ระบุ CSRF คำถามและคำอธิบายหมายถึง XSS คือการส่งข้อมูลที่ไม่น่าเชื่อถือไปให้เบราว์เซอร์ของผู้ใช้ประมวลผลภายใต้สิทธิของเขา"},{"id":158,"q":"Digital investigations have adopted many of the same methodologies and protocols as other types of criminal or scientific inquiries. What term pertains to the application of scientific norms and protocols to digital investigations?","a":["Scientific","Investigative","Methodological","Forensics"],"ans":"D","exp":"Forensics refers to the application of scientific methods and protocols to the investigation of crimes. Although forensics has traditionally been applied to well-known criminal proceedings and investigations, the term equally applies to digital investigations and methods. Although the other answers provide similar-sounding terms and ideas, none is the appropriate answer in this case.","qth":"การสืบสวนทางดิจิทัลได้นำวิธีการและระเบียบวิธีเดียวกันกับการสอบถามทางอาญาหรือวิทยาศาสตร์ประเภทอื่นๆ คำศัพท์ใดที่เกี่ยวข้องกับการประยุกต์ใช้บรรทัดฐานและระเบียบวิธีทางวิทยาศาสตร์กับการสืบสวนทางดิจิทัล","ath":["วิทยาศาสตร์","การสืบสวน","วิธีการ","นิติเวช"],"expth":"นิติเวช หมายถึงการประยุกต์ใช้วิธีการและระเบียบวิธีทางวิทยาศาสตร์ในการสืบสวนอาชญากรรม แม้ว่านิติเวชจะถูกนำมาใช้กับการดำเนินคดีและการสืบสวนคดีอาญาที่รู้จักกันดี แต่คำนี้ก็ใช้กับการสืบสวนและวิธีการทางดิจิทัลด้วยเช่นกัน แม้ว่าคำตอบอื่นๆ จะให้คำศัพท์และแนวคิดที่ฟังดูคล้ายกัน แต่ไม่มีคำตอบใดที่เหมาะสมในกรณีนี้"},{"id":159,"q":"Within a federated identity system, which entity accepts tokens from the identity provider?","a":["Assertion manager","Servicing party","Proxy party","Relying party"],"ans":"D","exp":"The relying party is attached to the application or service that a user is trying to access, and it accepts authentication tokens from the user's own identity provider in order to facilitate authentication and access. The other terms provided are all associated with federated systems, but none is the correct choice in this case.","qth":"ภายในระบบข้อมูลประจำตัวแบบรวมศูนย์ เอนทิตีใดยอมรับโทเค็นจากผู้ให้บริการข้อมูลระบุตัวตน","ath":["ผู้จัดการการยืนยัน","ฝ่ายให้บริการ","ฝ่ายพร็อกซี","ฝ่ายที่อาศัย"],"expth":"ฝ่ายที่พึ่งพานั้นแนบอยู่กับแอปพลิเคชันหรือบริการที่ผู้ใช้พยายามเข้าถึง และยอมรับโทเค็นการตรวจสอบสิทธิ์จากผู้ให้บริการข้อมูลประจำตัวของผู้ใช้เอง เพื่ออำนวยความสะดวกในการตรวจสอบสิทธิ์และการเข้าถึง ข้อกำหนดอื่นๆ ที่ให้ไว้ทั้งหมดเกี่ยวข้องกับระบบรวม แต่ไม่มีตัวเลือกที่ถูกต้องในกรณีนี้"},{"id":160,"q":"Different types of audits are intended for different audiences, such as internal, external, regulatory, and so on. Which of the following audits are considered \"restricted use\" versus being for a more broad audience?","a":["SOC Type 2","SOC Type 1","SOC Type 3","SAS-70"],"ans":"B","exp":"SOC Type 1 reports are intended for restricted use, only to be seen by the actual service organization, its current clients, or its auditors. These reports are not intended for wider or public distribution.SAS-70 audit reports have been deprecated and are no longer in use, and both the SOC Type 2 and 3 reports are designed to expand upon the SOC Type 1 reports and are for broader audiences.","qth":"การตรวจสอบประเภทต่างๆ มีไว้สำหรับผู้ชมที่แตกต่างกัน เช่น ภายใน ภายนอก หน่วยงานกำกับดูแล และอื่นๆ การตรวจสอบใดต่อไปนี้ถือเป็น \"การใช้งานแบบจำกัด\" เทียบกับการตรวจสอบสำหรับผู้ชมในวงกว้างกว่า","ath":["SOC ประเภท 2","SOC ประเภท 2","SOC ประเภท 3","SAS-70"],"expth":"รายงาน SOC ประเภท 1 มีไว้สำหรับการใช้งานแบบจำกัด เฉพาะองค์กรที่ให้บริการจริง ลูกค้าปัจจุบัน หรือผู้ตรวจสอบเท่านั้นที่สามารถเห็นได้ รายงานเหล่านี้ไม่ได้มีวัตถุประสงค์เพื่อการเผยแพร่ในวงกว้างหรือเผยแพร่สู่สาธารณะ รายงานการตรวจสอบ SAS-70 เลิกใช้แล้วและไม่มีการใช้งานอีกต่อไป และทั้งรายงาน SOC ประเภท 2 และ 3 ได้รับการออกแบบมาเพื่อขยายตามรายงาน SOC ประเภท 1 และมีไว้สำหรับผู้ชมในวงกว้าง"},{"id":161,"q":"Although host-based and network-based IDSs perform similar functions and have similar capabilities, which of the following is an advantage of a network-based IDS over a host-based IDS, assuming all capabilities are equal?","a":["Segregated from host systems","Network access","Scalability","External to system patching"],"ans":"A","exp":"A network-based IDS has the advantage of being segregated from host systems, and as such, it would not be open to compromise in the same manner a host-based system would be. Although a network-based IDS would be external to system patching, this is not the best answer here because it is a minor concern compared to segregation due to possible host compromise. Scalability is also not the best answer because, although a network-based IDS does remove processing from the host system, it is not a primary security concern. Network access is not a consideration because both a host-based IDS and a network-based IDS would have access to network resources.","qth":"แม้ว่า IDS บนโฮสต์และบนเครือข่ายจะทำงานคล้ายกันและมีความสามารถคล้ายคลึงกัน ข้อใดต่อไปนี้เป็นข้อได้เปรียบของ IDS บนเครือข่ายเหนือ IDS บนโฮสต์ โดยสมมติว่าความสามารถทั้งหมดเท่ากัน","ath":["แยกออกจากระบบโฮสต์","การเข้าถึงเครือข่าย","ความสามารถในการปรับขนาด","ภายนอกจากการแพตช์ระบบ"],"expth":"IDS บนเครือข่ายมีข้อดีของการเป็น แยกออกจากระบบโฮสต์ และด้วยเหตุนี้ มันจะไม่เปิดให้ประนีประนอมในลักษณะเดียวกับระบบโฮสต์ แม้ว่า IDS บนเครือข่ายจะอยู่ภายนอกการแพตช์ระบบ แต่นี่ไม่ใช่คำตอบที่ดีที่สุด เนื่องจากเป็นปัญหาเล็กน้อยเมื่อเทียบกับการแยกส่วนเนื่องจากการประนีประนอมของโฮสต์ที่อาจเกิดขึ้น ความสามารถในการปรับขนาดไม่ใช่คำตอบที่ดีที่สุด เนื่องจากแม้ว่า IDS บนเครือข่ายจะลบการประมวลผลออกจากระบบโฮสต์ แต่ก็ไม่ใช่ข้อกังวลด้านความปลอดภัยหลัก การเข้าถึงเครือข่ายไม่ใช่สิ่งที่ต้องพิจารณา เนื่องจากทั้ง IDS บนโฮสต์และ IDS บนเครือข่ายจะสามารถเข้าถึงทรัพยากรเครือข่ายได้"},{"id":162,"q":"DNSSEC was designed to add a layer of security to the DNS protocol. Which type of attack was the DNSSEC extension designed to mitigate?","a":["Account hijacking","Snooping","Spoofing","Data exposure"],"ans":"C","exp":"DNSSEC is an extension to the regular DNS protocol that utilizes digital signing of DNS query results, which can be verified to come from an authoritative source. This verification mitigates the ability for a rogue DNS server to be used to spoof query results and to direct users to malicious sites. DNSSEC provides for the verification of the integrity of DNS queries. It does not provide any protection from snooping or data exposure. Although it may help lessen account hijacking by preventing users from being directed to rogue sites, it cannot by itself eliminate the possibility.","qth":"DNSSEC ได้รับการออกแบบมาเพื่อเพิ่มชั้นความปลอดภัยให้กับโปรโตคอล DNS การโจมตีประเภทใดที่ส่วนขยาย DNSSEC ได้รับการออกแบบมาเพื่อบรรเทา","ath":["การไฮแจ็กบัญชี","การสอดแนม","การปลอมแปลง","การเปิดเผยข้อมูล"],"expth":"DNSSEC เป็นส่วนขยายของโปรโตคอล DNS ปกติที่ใช้การลงนามแบบดิจิทัลของผลลัพธ์การสืบค้น DNS ซึ่งสามารถยืนยันได้ว่ามาจากแหล่งที่เชื่อถือได้ การตรวจสอบนี้ช่วยลดความสามารถของเซิร์ฟเวอร์ DNS ปลอมเพื่อใช้ในการปลอมแปลงผลการค้นหาและนำผู้ใช้ไปยังไซต์ที่เป็นอันตราย DNSSEC จัดให้มีการตรวจสอบความสมบูรณ์ของการสืบค้น DNS มันไม่ได้ให้การป้องกันใด ๆ จากการสอดแนมหรือการเปิดเผยข้อมูล แม้ว่าอาจช่วยลดการขโมยบัญชีโดยการป้องกันไม่ให้ผู้ใช้ถูกพาไปยังไซต์หลอกลวง แต่ก็ไม่สามารถขจัดความเป็นไปได้ได้ด้วยตัวเอง"},{"id":163,"q":"Which aspect of cloud computing pertains to cloud customers only paying for the resources and services they actually use?","a":["Metered service","Measured billing","Metered billing","Measured service"],"ans":"D","exp":"Measured service is the aspect of cloud computing that pertains to cloud services and resources being billed in a metered way, based only on the level of consumption and duration of the cloud customer. Although they sound similar to the correct answer, none of the other choices is the actual cloud terminology.","qth":"ลักษณะใดของการประมวลผลแบบคลาวด์ที่เกี่ยวข้องกับลูกค้าระบบคลาวด์ที่ชำระค่าทรัพยากรและบริการที่พวกเขาใช้จริงเท่านั้น","ath":["บริการแบบคิดค่าบริการตามปริมาณข้อมูล","การเรียกเก็บเงินแบบวัดผล","การเรียกเก็บเงินตามปริมาณที่ใช้","บริการแบบวัดค่า"],"expth":"บริการแบบวัดผลคือลักษณะของการประมวลผลแบบคลาวด์ที่เกี่ยวข้องกับบริการระบบคลาวด์และทรัพยากรที่ถูกเรียกเก็บเงินในลักษณะแบบวัดปริมาณ โดยขึ้นอยู่กับระดับการใช้งานและระยะเวลาของระบบคลาวด์เท่านั้น ลูกค้า แม้ว่าจะฟังดูคล้ายกับคำตอบที่ถูกต้อง แต่ไม่มีตัวเลือกอื่นใดที่เป็นคำศัพท์เกี่ยวกับระบบคลาวด์ที่แท้จริง"},{"id":164,"q":"Many of the traditional concepts of systems and services for a traditional data center also apply to the cloud. Both are built around key computing concepts. Which of the following compromise the two facets of computing?","a":["CPU and software","CPU and storage","CPU and memory","Memory and networking"],"ans":"C","exp":"The CPU and memory resources of an environment together comprise its \"computing\" resources. Cloud environments, especially public clouds, are enormous pools of resources for computing and are typically divided among a large number of customers with constantly changing needs and demands. Although storage and networking are core components of a cloud environment, they do not comprise its computing core. Software, much like within a traditional data center, is highly subjective based on the application, system, service, or cloud computing model used; however, it is not one of the core cloud components.","qth":"แนวคิดดั้งเดิมหลายประการเกี่ยวกับระบบและบริการสำหรับศูนย์ข้อมูลแบบเดิมยังนำไปใช้กับระบบคลาวด์ด้วย ทั้งสองถูกสร้างขึ้นตามแนวคิดการประมวลผลที่สำคัญ ข้อใดต่อไปนี้กระทบต่อสองแง่มุมของการประมวลผล","ath":["ซีพียูและซอฟต์แวร์","CPU และที่เก็บข้อมูล","ซีพียูและหน่วยความจำ","หน่วยความจำและเครือข่าย"],"expth":"ทรัพยากร CPU และหน่วยความจำของสภาพแวดล้อมรวมกันประกอบด้วยทรัพยากร \"คอมพิวเตอร์\" สภาพแวดล้อมคลาวด์ โดยเฉพาะคลาวด์สาธารณะ เป็นแหล่งรวมทรัพยากรจำนวนมหาศาลสำหรับการประมวลผล และโดยทั่วไปจะถูกแบ่งออกตามลูกค้าจำนวนมากซึ่งมีความต้องการและความต้องการที่เปลี่ยนแปลงอยู่ตลอดเวลา แม้ว่าการจัดเก็บข้อมูลและเครือข่ายจะเป็นองค์ประกอบหลักของสภาพแวดล้อมระบบคลาวด์ แต่ก็ไม่ได้ประกอบด้วยแกนประมวลผล ซอฟต์แวร์นั้นเหมือนกับภายในศูนย์ข้อมูลแบบดั้งเดิม จะขึ้นอยู่กับแอปพลิเคชัน ระบบ บริการ หรือโมเดลการประมวลผลแบบคลาวด์ที่ใช้ อย่างไรก็ตาม นี่ไม่ใช่องค์ประกอบหลักของระบบคลาวด์"},{"id":165,"q":"Within an IaaS implementation, which of the following would NOT be a metric used to quantify service charges for the cloud customer?","a":["Memory","Number of users","Storage","CPU"],"ans":"B","exp":"Within IaaS, where the cloud customer is responsible for everything beyond the physical network, the number of users on a system would not be a factor in billing or service charges. The core cloud services for IaaS are based on the memory, storage, and CPU requirements of the cloud customer. Because the cloud customer with IaaS is responsible for its own images and deployments, these components comprise the basis of its cloud provisioning and measured services billing.","qth":"ใน IaaS ข้อใดไม่ใช่ตัวชี้วัดที่ใช้คิดค่าบริการลูกค้าโดยทั่วไป","ath":["หน่วยความจำ","จำนวนผู้ใช้","ที่เก็บข้อมูล","ซีพียู"],"expth":"จำนวนผู้ใช้ไม่ใช่หน่วยคิดเงินหลักของ IaaS ซึ่งคิดจากหน่วยความจำ ที่เก็บ และซีพียู"},{"id":166,"q":"Many different common threats exist against web-exposed services and applications. One attack involves attempting to leverage input fields to execute queries in a nested fashion that is unintended by the developers. What type of attack is this?","a":["Injection","Missing function-level access control","Cross-site scripting","Cross-site request forgery"],"ans":"A","exp":"An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part of its normal processing and queries. This can trick an application into exposing data that is not intended or authorized to be exposed, or it can potentially allow an attacker to gain insight into configurations or security controls. Missing function-level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call. Cross-site request forgery occurs when an attack forces an authenticated user to send forged requests to an application running under their own access and credentials. Cross-site scripting occurs when an attacker is able to send untrusted data to a user's browser without going through validation processes.","qth":"มีภัยคุกคามทั่วไปที่แตกต่างกันมากมายต่อบริการและแอปพลิเคชันที่เปิดบนเว็บ การโจมตีครั้งหนึ่งเกี่ยวข้องกับการพยายามใช้ประโยชน์จากฟิลด์อินพุตเพื่อดำเนินการค้นหาในลักษณะที่ซ้อนกันซึ่งนักพัฒนาไม่ได้ตั้งใจ การโจมตีประเภทนี้คืออะไร?","ath":["การฉีด","ไม่มีการควบคุมการเข้าถึงระดับฟังก์ชัน","การเขียนสคริปต์ข้ามไซต์","การปลอมแปลงคำขอข้ามไซต์"],"expth":"การโจมตีแบบฉีดคือการที่ผู้ประสงค์ร้ายส่งคำสั่งหรือข้อมูลที่กำหนดเองอื่น ๆ ผ่านทางช่องป้อนข้อมูลและช่องข้อมูลโดยมีจุดประสงค์เพื่อให้แอปพลิเคชันหรือระบบดำเนินการโค้ดซึ่งเป็นส่วนหนึ่งของการประมวลผลและการสืบค้นตามปกติ วิธีนี้สามารถหลอกให้แอปพลิเคชันเปิดเผยข้อมูลที่ไม่ได้ตั้งใจหรือได้รับอนุญาตให้เปิดเผย หรืออาจทำให้ผู้โจมตีได้รับข้อมูลเชิงลึกเกี่ยวกับการกำหนดค่าหรือการควบคุมความปลอดภัย การควบคุมการเข้าถึงระดับฟังก์ชันหายไปซึ่งแอปพลิเคชันตรวจสอบเฉพาะการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบครั้งแรก และไม่ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การปลอมแปลงคำขอข้ามไซต์เกิดขึ้นเมื่อการโจมตีบังคับให้ผู้ใช้ที่ได้รับการรับรองความถูกต้องส่งคำขอปลอมไปยังแอปพลิเคชันที่ทำงานภายใต้การเข้าถึงและข้อมูลประจำตัวของตนเอง การเขียนสคริปต์ข้ามไซต์"},{"id":167,"q":"For service provisioning and support, what is the ideal amount of interaction between a cloud customer and cloud provider?","a":["Half","Full","Minimal","Depends on the contract"],"ans":"C","exp":"The goal with any cloud-hosting setup is for the cloud customer to be able to perform most or all its functions for service provisioning and configuration without any need for support from or interaction with the cloud provider beyond the automated tools provided. To fulfill the tenants of on-demand self-service, required interaction with the cloud provider--either half time, full time, or a commensurate amount of time based on the contract--would be in opposition to a cloud's intended use. As such, these answers are incorrect.","qth":"ปริมาณปฏิสัมพันธ์ที่เหมาะสมระหว่างลูกค้ากับผู้ให้บริการในการจัดเตรียมและสนับสนุนบริการคือเท่าใด","ath":["ครึ่งหนึ่ง","เต็มที่","น้อยที่สุด","ขึ้นกับสัญญา"],"expth":"อุดมคติของ on-demand self-service คือลูกค้าจัดเตรียมบริการเองได้โดย几乎ไม่ต้องคุยกับผู้ให้บริการ"},{"id":168,"q":"What does a cloud customer purchase or obtain from a cloud provider?","a":["Services","Hosting","Servers","Customers"],"ans":"A","exp":"No matter what form they come in, \"services\" are obtained or purchased by a cloud customer from a cloud service provider. Services can come in many forms-- virtual machines, network configurations, hosting setups, and software access, just to name a few. Hosting and servers--or, with a cloud, more appropriately virtual machines--are just two examples of \"services\" that a customer would purchase from a cloud provider. \"Customers\" would never be a service that's purchased.","qth":"ลูกค้าระบบคลาวด์ซื้อหรือรับอะไรจากผู้ให้บริการระบบคลาวด์","ath":["บริการ","โฮสติ้ง","เซิร์ฟเวอร์","ลูกค้า"],"expth":"ไม่ว่าลูกค้าจะอยู่ในรูปแบบใด ลูกค้าระบบคลาวด์จะได้รับหรือซื้อ 'บริการ' จากผู้ให้บริการระบบคลาวด์ บริการต่างๆ มีอยู่หลายรูปแบบ เช่น เครื่องเสมือน การกำหนดค่าเครือข่าย การตั้งค่าโฮสติ้ง และการเข้าถึงซอฟต์แวร์ และอื่นๆ อีกมากมาย โฮสติ้งและ เซิร์ฟเวอร์หรือเครื่องเสมือนที่เหมาะสมกว่ากับคลาวด์เป็นเพียงสองตัวอย่างของ \"บริการ\" ที่ลูกค้าจะซื้อจากผู้ให้บริการคลาวด์ \"ลูกค้า\" จะไม่มีวันเป็นบริการที่ซื้อ"},{"id":169,"q":"You were recently hired as a project manager at a major university to implement cloud services for the academic and administrative systems. Because the load and demand for services at a university are very cyclical in nature, commensurate with the academic calendar, which of the following aspects of cloud computing would NOT be a primary benefit to you?","a":["Measured service","Broad network access","Resource pooling","On-demand self-service"],"ans":"B","exp":"Broad network access to cloud services, although it is an integral aspect of cloud computing, would not being a specific benefit to an organization with cyclical business needs. The other options would allow for lower costs during periods of low usage as well as provide the ability to expand services quickly and easily when needed for peak periods. Measured service allows a cloud customer to only use the resources it needs at the time, and resource pooling allows a cloud customer to access resources as needed. On-demand self-service enables the cloud customer to change its provisioned resources on its own, without the need to interact with the staff from the cloud provider.","qth":"เมื่อเร็วๆ นี้คุณได้รับการว่าจ้างให้เป็นผู้จัดการโครงการในมหาวิทยาลัยใหญ่แห่งหนึ่งเพื่อใช้บริการคลาวด์สำหรับระบบวิชาการและการบริหาร เนื่องจากภาระงานและความต้องการบริการในมหาวิทยาลัยมีลักษณะเป็นวัฏจักรอย่างมาก ซึ่งสอดคล้องกับปฏิทินการศึกษา ด้านใดต่อไปนี้ของการประมวลผลแบบคลาวด์จะไม่เป็นประโยชน์หลักสำหรับคุณ","ath":["บริการวัดผล","การเข้าถึงเครือข่ายในวงกว้าง","การรวมทรัพยากร","บริการตนเองตามความต้องการ"],"expth":"การเข้าถึงบริการคลาวด์ผ่านเครือข่ายในวงกว้าง แม้ว่าจะเป็นส่วนสำคัญของการประมวลผลแบบคลาวด์ แต่ก็ไม่ได้เป็นประโยชน์เฉพาะสำหรับองค์กรที่มีความต้องการทางธุรกิจแบบวนรอบ ตัวเลือกอื่นๆ จะช่วยให้ต้นทุนลดลงในช่วงเวลาที่มีการใช้งานน้อย พร้อมทั้งให้ความสามารถในการขยายบริการได้อย่างรวดเร็วและง่ายดายเมื่อจำเป็นในช่วงเวลาเร่งด่วน บริการที่วัดผลช่วยให้ลูกค้าระบบคลาวด์ใช้เฉพาะทรัพยากรที่ต้องการในขณะนั้นเท่านั้น และการรวมทรัพยากรช่วยให้ลูกค้าระบบคลาวด์สามารถเข้าถึงทรัพยากรได้ตามต้องการ การบริการตนเองตามความต้องการช่วยให้ลูกค้าระบบคลาวด์สามารถเปลี่ยนทรัพยากรที่จัดเตรียมไว้ได้ด้วยตัวเอง โดยไม่จำเป็นต้องโต้ตอบกับเจ้าหน้าที่จากผู้ให้บริการระบบคลาวด์"},{"id":170,"q":"Which cloud deployment model is MOST likely to offer free or very cheap services to users?","a":["Hybrid","Community","Public","Private"],"ans":"C","exp":"Public clouds offer services to anyone, regardless of affiliation, and are the most likely to offer free services to users. Examples of public clouds with free services include iCloud, Dropbox, and OneDrive. Private cloud models are designed for specific customers and for their needs, and would not offer services to the public at large, for free or otherwise. A community cloud is specific to a group of similar organizations and would not offer free or widely available public services. A hybrid cloud model would not fit the specifics of the question.","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดมีแนวโน้มที่จะเสนอบริการฟรีหรือราคาถูกมากแก่ผู้ใช้มากที่สุด","ath":["ไฮบริด","ชุมชน","สาธารณะ","ส่วนตัว"],"expth":"ระบบคลาวด์สาธารณะเสนอบริการแก่ทุกคน โดยไม่คำนึงถึงความเกี่ยวข้อง และมีแนวโน้มมากที่สุดที่จะเสนอบริการฟรีแก่ผู้ใช้ ตัวอย่างของคลาวด์สาธารณะพร้อมบริการฟรี ได้แก่ iCloud, Dropbox และ OneDrive โมเดลคลาวด์ส่วนตัวได้รับการออกแบบมาสำหรับลูกค้าเฉพาะเจาะจงและตามความต้องการของลูกค้า และจะไม่ให้บริการแก่สาธารณะในวงกว้าง โดยไม่เสียค่าใช้จ่ายหรืออื่นๆ คลาวด์ชุมชนมีไว้สำหรับกลุ่มขององค์กรที่คล้ายกันโดยเฉพาะ และจะไม่เสนอบริการสาธารณะฟรีหรือใช้ได้อย่างกว้างขวาง โมเดลคลาวด์แบบไฮบริดไม่ตรงกับคำถามเฉพาะเจาะจง"},{"id":171,"q":"With IaaS, what is responsible for handling the security and control over the volume storage space?","a":["Management plane","Operating system","Application","Hypervisor"],"ans":"B","exp":"Volume storage is allocated via a LUN to a system and then treated the same as any traditional storage. The operating system is responsible for formatting and securing volume storage as well as controlling all access to it. Applications, although they may use volume storage and have permissions to write to it, are not responsible for its formatting and security. Both a hypervisor and the management plane are outside of an individual system and are not responsible for managing the files and storage within that system.","qth":"ใน IaaS สิ่งใดรับผิดชอบความปลอดภัยและการควบคุมของ volume storage","ath":["ระนาบการจัดการ","ระบบปฏิบัติการ","แอปพลิเคชัน","ไฮเปอร์ไวเซอร์"],"expth":"เมื่อจัดสรรวอลุ่มให้เครื่องเสมือนแล้ว ระบบปฏิบัติการเป็นผู้ฟอร์แมต รักษาความปลอดภัย และควบคุมการเข้าถึง"},{"id":172,"q":"Which of the following tasks within a SaaS environment would NOT be something the cloud customer would be responsible for?","a":["Authentication mechanism","Branding","Training","User access"],"ans":"A","exp":"The authentication mechanisms and implementations are the responsibility of the cloud provider because they are core components of the application platform and service. Within a SaaS implementation, the cloud customer will provision user access, deploy branding to the application interface (typically), and provide or procure training for its users.","qth":"งานใดต่อไปนี้ภายในสภาพแวดล้อม SaaS จะไม่เป็นสิ่งที่ลูกค้าระบบคลาวด์จะต้องรับผิดชอบ","ath":["กลไกการตรวจสอบสิทธิ์","การสร้างแบรนด์","การฝึกอบรม","การเข้าถึงของผู้ใช้"],"expth":"กลไกการตรวจสอบสิทธิ์และการนำไปใช้งานเป็นความรับผิดชอบของผู้ให้บริการระบบคลาวด์ เนื่องจากเป็นองค์ประกอบหลักของแพลตฟอร์มแอปพลิเคชันและบริการ ภายในการใช้งาน SaaS ลูกค้าคลาวด์จะจัดเตรียมการเข้าถึงของผู้ใช้ ปรับใช้การสร้างแบรนด์ให้กับอินเทอร์เฟซแอปพลิเคชัน (โดยทั่วไป) และจัดเตรียมหรือจัดหาการฝึกอบรมสำหรับผู้ใช้"},{"id":173,"q":"Within a federated identity system, which of the following would you be MOST likely to use for sending information for consumption by a relying party?","a":["XML","HTML","WS-Federation","SAML"],"ans":"D","exp":"The Security Assertion Markup Language (SAML) is the most widely used method for encoding and sending attributes and other information from an identity provider to a relying party.WS-Federation, which is used by Active Directory Federation Services (ADFS), is the second most used method for sending information to a relying party, but it is not a better choice than SAML. XML is similar to SAML in the way it encodes and labels data, but it does not have all of the required extensions that SAML does. HTML is not used within federated systems at all.","qth":"ภายในระบบการระบุตัวตนแบบรวมศูนย์ ข้อใดต่อไปนี้ที่คุณมีแนวโน้มที่จะใช้มากที่สุดในการส่งข้อมูลสำหรับการใช้งานโดยฝ่ายที่เกี่ยวข้อง?","ath":["XML","HTML","WS-Federation","SAML"],"expth":"Security Assertion Markup Language (SAML) เป็นวิธีที่ใช้กันอย่างแพร่หลายมากที่สุดในการเข้ารหัสและส่งแอตทริบิวต์และข้อมูลอื่น ๆ จากผู้ให้บริการข้อมูลประจำตัวไปยังฝ่ายที่เกี่ยวข้อง WS-Federation ซึ่งใช้โดย Active Directory Federation Services (ADFS) เป็นวิธีที่ใช้มากเป็นอันดับสองในการส่งข้อมูลไปยังฝ่ายที่เกี่ยวข้อง แต่ก็ไม่ใช่ตัวเลือกที่ดีไปกว่า SAML XML มีลักษณะคล้ายกับ SAML ในด้านการเข้ารหัสและติดป้ายกำกับข้อมูล แต่ไม่มีส่วนขยายที่จำเป็นทั้งหมดเหมือนกับที่ SAML มี HTML ไม่ได้ใช้ภายในระบบรวมเลย"},{"id":174,"q":"Which data state would be most likely to use digital signatures as a security protection mechanism?","a":["Data in use","Data in transit","Archived","Data at rest"],"ans":"A","exp":"During the data-in-use state, the information has already been accessed from storage and transmitted to the service, so reliance on a technology such as digital signatures is imperative to ensure security and complement the security methods used during previous states. Data in transit relies on technologies such as TLS to encrypt network transmission of packets for security. Data at rest primarily uses encryption for stored file objects. Archived data would be the same as data at rest.","qth":"สถานะข้อมูลใดมีแนวโน้มที่จะใช้ลายเซ็นดิจิทัลเป็นกลไกการป้องกันความปลอดภัยมากที่สุด","ath":["ข้อมูลที่ใช้งาน","ข้อมูลระหว่างทาง","เก็บถาวร","ข้อมูลที่เหลือ"],"expth":"ในระหว่างสถานะข้อมูลที่ใช้งานอยู่ ข้อมูลมีการเข้าถึงแล้วจากที่เก็บข้อมูลและส่งไปยังบริการ ดังนั้นการพึ่งพาเทคโนโลยี เช่น ลายเซ็นดิจิทัลจึงเป็นสิ่งจำเป็นเพื่อให้มั่นใจในความปลอดภัยและเสริมวิธีการรักษาความปลอดภัยที่ใช้ในระหว่างนั้น รัฐก่อนหน้า ข้อมูลระหว่างทางอาศัยเทคโนโลยี เช่น TLS เพื่อเข้ารหัสการส่งแพ็กเก็ตเครือข่ายเพื่อความปลอดภัย ข้อมูลที่เหลือใช้การเข้ารหัสสำหรับออบเจ็กต์ไฟล์ที่จัดเก็บเป็นหลัก ข้อมูลที่เก็บถาวรจะเหมือนกับข้อมูลที่เหลือ"},{"id":175,"q":"Audits are either done based on the status of a system or application at a specific time or done as a study over a period of time that takes into account changes and processes. Which of the following pairs matches an audit type that is done over time, along with the minimum span of time necessary for it?","a":["SOC Type 2, one year","SOC Type 1, one year","SOC Type 2, one month","SOC Type 2, six months"],"ans":"D","exp":"SOC Type 2 audits are done over a period of time, with six months being the minimum duration. SOC Type 1 audits are designed with a scope that's a static point in time, and the other times provided for SOC Type 2 are incorrect.","qth":"การตรวจสอบจะดำเนินการตามสถานะของระบบหรือแอปพลิเคชัน ณ เวลาที่กำหนด หรือดำเนินการเป็นการศึกษาในช่วงเวลาหนึ่งโดยคำนึงถึงการเปลี่ยนแปลงและกระบวนการ คู่ใดต่อไปนี้ตรงกับประเภทการตรวจสอบที่ทำในช่วงเวลาหนึ่ง พร้อมด้วยช่วงเวลาขั้นต่ำที่จำเป็นสำหรับการตรวจสอบนั้น","ath":["SOC ประเภท 2 หนึ่งปี","SOC ประเภท 1 หนึ่งปี","SOC ประเภท 2 หนึ่งปี เดือน","SOC ประเภท 2, หกเดือน"],"expth":"การตรวจสอบ SOC ประเภท 2 จะดำเนินการตามระยะเวลาหนึ่ง โดยหกเดือนคือระยะเวลาขั้นต่ำ การตรวจสอบ SOC ประเภท 1 ได้รับการออกแบบโดยมีขอบเขตที่เป็นช่วงเวลาคงที่ และเวลาอื่นๆ ที่ระบุไว้สำหรับ SOC ประเภท 2 นั้นไม่ถูกต้อง"},{"id":176,"q":"With software-defined networking (SDN), which two types of network operations are segregated to allow for granularity and delegation of administrative access and functions?","a":["Filtering and forwarding","Filtering and firewalling","Firewalling and forwarding","Forwarding and protocol"],"ans":"A","exp":"With SDN, the filtering and forwarding capabilities and administration are separated. This allows the cloud provider to build interfaces and management tools for administrative delegation of filtering configuration, without having to allow direct access to underlying network equipment. Firewalling and protocols are both terms related to networks, but they are not components SDN is concerned with.","qth":"เมื่อใช้ระบบเครือข่ายที่กำหนดโดยซอฟต์แวร์ (SDN) การดำเนินการเครือข่ายสองประเภทใดที่ถูกแยกออกจากกันเพื่อให้มีรายละเอียดและการมอบหมายการเข้าถึงและฟังก์ชันของผู้ดูแลระบบ","ath":["การกรองและการส่งต่อ","การกรองและไฟร์วอลล์","ไฟร์วอลล์และการส่งต่อ","การส่งต่อและโปรโตคอล"],"expth":"ด้วย SDN ความสามารถในการกรองและการส่งต่อและการดูแลระบบจะถูกแยกออกจากกัน ซึ่งช่วยให้ผู้ให้บริการคลาวด์สามารถสร้างอินเทอร์เฟซและเครื่องมือการจัดการสำหรับการมอบหมายผู้ดูแลระบบการกำหนดค่าการกรอง โดยไม่ต้องอนุญาตการเข้าถึงโดยตรงไปยังอุปกรณ์เครือข่ายพื้นฐาน ไฟร์วอลล์และโปรโตคอลเป็นคำที่เกี่ยวข้องกับเครือข่าย แต่ไม่ใช่องค์ประกอบที่เกี่ยวข้องกับ SDN"},{"id":177,"q":"Which aspect of SaaS will alleviate much of the time and energy organizations spend on compliance (specifically baselines)?","a":["Maintenance","Licensing","Standardization","Development"],"ans":"C","exp":"With the entire software platform being controlled by the cloud provider, the standardization of configurations and versioning is done automatically for the cloud customer. This alleviates the customer's need to track upgrades and releases for its own systems and development; instead, the onus is on the cloud provider. Although licensing is the responsibility of the cloud customer within SaaS, it does not have an impact on compliance requirements. Within SaaS, development and maintenance of the system are solely the responsibility of the cloud provider.","qth":"แง่มุมใดของ SaaS ที่จะช่วยลดเวลาและพลังงานส่วนใหญ่ที่องค์กรใช้จ่ายในการปฏิบัติตามกฎระเบียบ (พื้นฐานโดยเฉพาะ)?","ath":["การบำรุงรักษา","การออกใบอนุญาต","การกำหนดมาตรฐาน","การพัฒนา"],"expth":"ด้วยแพลตฟอร์มซอฟต์แวร์ทั้งหมดที่ถูกควบคุมโดยผู้ให้บริการระบบคลาวด์ การกำหนดมาตรฐานของการกำหนดค่าและการกำหนดเวอร์ชันจะดำเนินการโดยอัตโนมัติสำหรับลูกค้าระบบคลาวด์ สิ่งนี้ช่วยลดความต้องการของลูกค้าในการติดตามการอัพเกรดและรีลีสสำหรับระบบและการพัฒนาของตนเอง ความรับผิดชอบอยู่ที่ผู้ให้บริการคลาวด์แทน แม้ว่าการออกใบอนุญาตจะเป็นความรับผิดชอบของลูกค้าระบบคลาวด์ภายใน SaaS แต่ก็ไม่ได้ส่งผลกระทบต่อข้อกำหนดในการปฏิบัติตามข้อกำหนด ภายใน SaaS การพัฒนาและบำรุงรักษาระบบถือเป็นความรับผิดชอบของผู้ให้บริการคลาวด์แต่เพียงผู้เดียว"},{"id":178,"q":"Where is an XML firewall most commonly and effectively deployed in the environment?","a":["Between the application and data layers","Between the presentation and application layers","Between the IPS and firewall","Between the firewall and application server"],"ans":"D","exp":"An XML firewall is most commonly deployed in line between the firewall and application server to validate XML code before it reaches the application. An XML firewall is intended to validate XML before it reaches the application. Placing the XML firewall between the presentation and application layers, between the firewall and IPS, or between the application and data layers would not serve the intended purpose.","qth":"ไฟร์วอลล์ XML ใช้งานทั่วไปและมีประสิทธิภาพมากที่สุดในสภาพแวดล้อมที่ไหน","ath":["ระหว่างแอปพลิเคชันและชั้นข้อมูล",">ระหว่างเลเยอร์การนำเสนอและแอปพลิเคชัน","ระหว่าง IPS และไฟร์วอลล์","ระหว่างไฟร์วอลล์และเซิร์ฟเวอร์แอปพลิเคชัน"],"expth":"ไฟร์วอลล์ XML มักใช้งานโดยอยู่ระหว่างไฟร์วอลล์และเซิร์ฟเวอร์แอปพลิเคชันเพื่อตรวจสอบโค้ด XML ก่อนที่จะเข้าถึงแอปพลิเคชัน ไฟร์วอลล์ XML มีวัตถุประสงค์เพื่อตรวจสอบความถูกต้องของ XML ก่อนที่จะเข้าถึงแอปพลิเคชัน การวางไฟร์วอลล์ XML ระหว่างเลเยอร์การนำเสนอและแอปพลิเคชัน ระหว่างไฟร์วอลล์และ IPS หรือระหว่างแอปพลิเคชันและชั้นข้อมูลจะไม่ตอบสนองวัตถุประสงค์ที่ตั้งใจไว้"},{"id":179,"q":"Modern web service systems are designed for high availability and resiliency. Which concept pertains to the ability to detect problems within a system, environment, or application and programmatically invoke redundant systems or processes for mitigation?","a":["Elasticity","Redundancy","Fault tolerance","Automation"],"ans":"C","exp":"Fault tolerance allows a system to continue functioning, even with degraded performance, if portions of it fail or degrade, without the entire system or service being taken down. It can detect problems within a service and invoke compensating systems or functions to keep functionality going. Although redundancy is similar to fault tolerance, it is more focused on having additional copies of systems available, either active or passive, that can take up services if one system goes down. Elasticity pertains to the ability of a system to resize to meet demands, but it is not focused on system failures. Automation, and its role in maintaining large systems with minimal intervention, is not directly related to fault tolerance.","qth":"แนวคิดใดเกี่ยวกับการตรวจพบปัญหาแล้วเรียกใช้ระบบสำรองโดยโปรแกรมได้ เพื่อให้บริการเดินต่อ","ath":["ความยืดหยุ่นเชิงยืดขยาย","ความซ้ำซ้อน","ความทนทานต่อความผิดพร่อง","ระบบอัตโนมัติ"],"expth":"Fault tolerance ทำให้ระบบทำงานต่อได้แม้บางส่วนล้มเหลว โดยตรวจจับปัญหาและเรียกกลไกชดเชย"},{"id":180,"q":"On large distributed systems with pooled resources, cloud computing relies on extensive orchestration to maintain the environment and the constant provisioning of resources. Which of the following is crucial to the orchestration and automation of networking resources within a cloud?","a":["DNSSEC","DNS","DCOM","DHCP"],"ans":"D","exp":"The Dynamic Host Configuration Protocol (DHCP) automatically configures network settings for a host so that these settings do not need to be configured on the host statically. Given the rapid and programmatic provisioning of resources within a cloud environment, this capability is crucial to cloud operations. Both DNS and its security-integrity extension DNSSEC provide name resolution to IP addresses, but neither is used for the configuration of network settings on a host. DCOM refers to the Distributed Component Object Model, which was developed by Microsoft as a means to request services across a network, and is not used for network configurations at all.","qth":"บนระบบแบบกระจายขนาดใหญ่ที่มีทรัพยากรรวมกัน การประมวลผลแบบคลาวด์อาศัยการประสานที่กว้างขวางเพื่อรักษาสภาพแวดล้อมและการจัดเตรียมทรัพยากรอย่างต่อเนื่อง ข้อใดต่อไปนี้มีความสำคัญต่อการจัดระบบและการทำงานอัตโนมัติของทรัพยากรเครือข่ายภายในระบบคลาวด์","ath":["ดีเอสเอสอีซี","ดีเอสเอสอีซี","ดีคอม","ดีเอชซีพี"],"expth":"Dynamic Host Configuration Protocol (DHCP) จะกำหนดการตั้งค่าเครือข่ายสำหรับโฮสต์โดยอัตโนมัติ ดังนั้นจึงไม่จำเป็นต้องกำหนดค่าการตั้งค่าเหล่านี้บนโฮสต์แบบคงที่ เมื่อพิจารณาถึงการจัดสรรทรัพยากรภายในสภาพแวดล้อมคลาวด์ที่รวดเร็วและเป็นโปรแกรม ความสามารถนี้จึงมีความสำคัญอย่างยิ่งต่อการดำเนินงานบนคลาวด์ ทั้ง DNS และส่วนขยายความปลอดภัยสมบูรณ์ DNSSEC ให้การจำแนกชื่อให้กับที่อยู่ IP แต่ไม่ได้ใช้ทั้งสองอย่างสำหรับการกำหนดค่าการตั้งค่าเครือข่ายบนโฮสต์ DCOM หมายถึง Distributed Component Object Model ซึ่งพัฒนาโดย Microsoft เพื่อใช้ในการร้องขอบริการผ่านเครือข่าย และไม่ได้ใช้สำหรับการกำหนดค่าเครือข่ายเลย"},{"id":181,"q":"BCDR strategies do not typically involve the entire operations of an organization, but only those deemed critical to their business. Which concept pertains to the amount of services that need to be recovered to meet BCDR objectives?","a":["RSL","RTO","RPO","SRE"],"ans":"A","exp":"The recovery service level (RSL) measures the percentage of operations that would be recovered during a BCDR situation. The recovery point objective (RPO) sets and defines the amount of data an organization must have available or accessible to reach the determined level of operations necessary during a BCDR situation. The recovery time objective (RTO) measures the amount of time necessary to recover operations to meet the BCDR plan. SRE is provided as an erroneous response.","qth":"โดยทั่วไปแล้วกลยุทธ์ BCDR จะไม่เกี่ยวข้องกับการดำเนินงานทั้งหมดขององค์กร แต่จะเกี่ยวข้องกับการดำเนินการที่ถือว่ามีความสำคัญต่อธุรกิจเท่านั้น แนวคิดใดที่เกี่ยวข้องกับจำนวนบริการที่ต้องได้รับการกู้คืนเพื่อให้บรรลุวัตถุประสงค์ BCDR","ath":["RSL","RTO","RPO","SRE"],"expth":"ระดับบริการการกู้คืน (RSL) จะวัดเปอร์เซ็นต์ของการดำเนินการที่จะได้รับการกู้คืนในระหว่างสถานการณ์ BCDR วัตถุประสงค์จุดกู้คืน (RPO) จะกำหนดและกำหนดจำนวนข้อมูลที่องค์กรต้องมีหรือสามารถเข้าถึงได้เพื่อบรรลุระดับการปฏิบัติงานที่กำหนดซึ่งจำเป็นในระหว่างสถานการณ์ BCDR วัตถุประสงค์เวลาการกู้คืน (RTO) จะวัดระยะเวลาที่จำเป็นในการกู้คืนการดำเนินการเพื่อให้เป็นไปตามแผน BCDR SRE ให้มาเป็นการตอบกลับที่ผิดพลาด"},{"id":182,"q":"During the course of an audit, which of the following would NOT be an input into the control requirements used as part of a gap analysis.","a":["Contractual requirements","Regulations","Vendor recommendations","Corporate policy"],"ans":"C","exp":"Vendor recommendations would not be pertinent to the gap analysis after an audit. Although vendor recommendations will typically play a role in the development of corporate policies or contractual requirements, they are not required. Regulations, corporate policy, and contractual requirements all determine the expected or mandated controls in place on a system.","qth":"ในระหว่างการตรวจสอบ ข้อใดต่อไปนี้จะไม่เป็นข้อมูลป้อนเข้าข้อกำหนดการควบคุมที่ใช้เป็นส่วนหนึ่งของการวิเคราะห์ช่องว่าง","ath":["ข้อกำหนดตามสัญญา","กฎระเบียบ","คำแนะนำผู้ขาย","นโยบายองค์กร"],"expth":"คำแนะนำของผู้ขายจะไม่เกี่ยวข้องกับการวิเคราะห์ช่องว่างหลังการตรวจสอบ แม้ว่าโดยทั่วไปคำแนะนำของผู้ขายจะมีบทบาทในการพัฒนานโยบายองค์กรหรือข้อกำหนดตามสัญญา แต่ก็ไม่จำเป็น กฎระเบียบ นโยบายองค์กร และข้อกำหนดตามสัญญาล้วนเป็นตัวกำหนดการควบคุมที่คาดหวังหรือได้รับมอบอำนาจในระบบ"},{"id":183,"q":"The GAPP framework was developed through a joint effort between the major Canadian and American professional accounting associations in order to assist their members with managing and preventing risks to the privacy of their data and customers. Which of the following is the meaning of GAPP?","a":["General accounting personal privacy","Generally accepted privacy practices","Generally accepted privacy principles","General accounting privacy policies"],"ans":"C","exp":"","qth":"กรอบการทำงาน GAPP ได้รับการพัฒนาผ่านความพยายามร่วมกันระหว่างสมาคมบัญชีวิชาชีพรายใหญ่ของแคนาดาและอเมริกา เพื่อช่วยสมาชิกในการจัดการและป้องกันความเสี่ยงต่อความเป็นส่วนตัวของข้อมูลและลูกค้าของตน ข้อใดต่อไปนี้คือความหมายของ GAPP","ath":["ความเป็นส่วนตัวทางบัญชีทั่วไป","หลักปฏิบัติด้านความเป็นส่วนตัวที่ยอมรับโดยทั่วไป","หลักการความเป็นส่วนตัวที่ยอมรับโดยทั่วไป","นโยบายความเป็นส่วนตัวทางบัญชีทั่วไป"],"expth":""},{"id":184,"q":"Which protocol operates at the network layer and provides for full point-to-point encryption of all communications and transmissions?","a":["IPSec","VPN","SSL","TLS"],"ans":"A","exp":"IPSec is a protocol for encrypting and authenticating packets during transmission between two parties and can involve any type of device, application, or service. The protocol performs both the authentication and negotiation of security policies between the two parties at the start of the connection and then maintains these policies throughout the lifetime of the connection. TLS operates at the application layer, not the network layer, and is widely used to secure communications between two parties. SSL is similar to TLS but has been deprecated. Although a VPN allows a secure channel for communications into a private network from an outside location, it's not a protocol.","qth":"โปรโตคอลใดทำงานที่เลเยอร์เครือข่ายและให้การเข้ารหัสแบบจุดต่อจุดเต็มรูปแบบของการสื่อสารและการส่งสัญญาณทั้งหมด?","ath":["IPsec","VPN","SSL","TLS"],"expth":"IPSec เป็นโปรโตคอลสำหรับการเข้ารหัสและการตรวจสอบความถูกต้องของแพ็คเก็ตในระหว่างการส่งระหว่างสองฝ่ายและสามารถเกี่ยวข้องกับอุปกรณ์ แอปพลิเคชัน หรือบริการประเภทใดก็ได้ โปรโตคอลดำเนินการทั้งการตรวจสอบสิทธิ์และการเจรจานโยบายความปลอดภัยระหว่าง ทั้งสองฝ่ายเมื่อเริ่มต้นการเชื่อมต่อแล้วรักษานโยบายเหล่านี้ตลอดอายุการใช้งานของการเชื่อมต่อ TLS ทำงานที่เลเยอร์แอปพลิเคชัน ไม่ใช่เลเยอร์เครือข่าย และมีการใช้กันอย่างแพร่หลายเพื่อความปลอดภัยในการสื่อสารระหว่างสองฝ่าย SSL นั้นคล้ายคลึงกับ TLS แต่เลิกใช้แล้ว แม้ว่า VPN จะอนุญาตให้มีช่องทางที่ปลอดภัยสำหรับการสื่อสารไปยังเครือข่ายส่วนตัวจากสถานที่ภายนอก แต่ก็ไม่ใช่โปรโตคอล"},{"id":185,"q":"When data discovery is undertaken, three main approaches or strategies are commonly used to determine what the type of data, its format, and composition are for the purposes of classification. Which of the following is NOT one of the three main approaches to data discovery?","a":["Content analysis","Hashing","Labels","Metadata"],"ans":"B","exp":"Hashing involves taking a block of data and, through the use of a one-way operation, producing a fixed-size value that can be used for comparison with other data. It is used primarily for protecting data and allowing for rapid comparison when matching data values such as passwords. Labels involve looking for header information or other categorizations of data to determine its type and possible classifications. Metadata involves looking at information attributes of the data, such as creator, application, type, and so on, in determining classification. Content analysis involves examining the actual data itself for its composition and classification level.","qth":"เมื่อดำเนินการค้นพบข้อมูล โดยทั่วไปจะใช้แนวทางหรือกลยุทธ์หลักสามประการเพื่อกำหนดประเภทของข้อมูล รูปแบบ และองค์ประกอบของข้อมูลเพื่อวัตถุประสงค์ในการจำแนกประเภท ข้อใดต่อไปนี้ไม่ใช่หนึ่งในสามแนวทางหลักในการค้นหาข้อมูล","ath":["การวิเคราะห์เนื้อหา","การแฮช","ป้ายกำกับ","ข้อมูลเมตา"],"expth":"การแฮชเกี่ยวข้องกับการบล็อกข้อมูลและผ่านการใช้การดำเนินการทางเดียว ทำให้เกิดค่าขนาดคงที่ซึ่งสามารถใช้ในการเปรียบเทียบกับข้อมูลอื่นๆ ซึ่งใช้เพื่อปกป้องข้อมูลเป็นหลัก และช่วยให้สามารถเปรียบเทียบได้อย่างรวดเร็วเมื่อจับคู่ค่าข้อมูล เช่น รหัสผ่าน ป้ายกำกับเกี่ยวข้องกับการค้นหาข้อมูลส่วนหัวหรือการจัดหมวดหมู่ข้อมูลอื่นๆ เพื่อกำหนดประเภทและการจำแนกประเภทที่เป็นไปได้ ข้อมูลเมตาเกี่ยวข้องกับการดูคุณลักษณะข้อมูลของข้อมูล เช่น ผู้สร้าง แอปพลิเคชัน ประเภท และอื่นๆ ในการพิจารณาการจัดหมวดหมู่ การวิเคราะห์เนื้อหาเกี่ยวข้องกับการตรวจสอบข้อมูลจริงสำหรับองค์ประกอบและระดับการจำแนกประเภท"},{"id":186,"q":"There are many situations when testing a BCDR plan is appropriate or mandated. Which of the following would not be a necessary time to test a BCDR plan?","a":["After software updates","After regulatory changes","After major configuration changes","Annually"],"ans":"B","exp":"Regulatory changes by themselves would not trigger a need for new testing of a BCDR plan. Any changes necessary for regulatory compliance would be accomplished through configuration changes or software updates, which in turn would then trigger the necessary new testing. Annual testing is crucial to any BCDR plan. Also, any time major configuration changes or software updates are done, the plan should be evaluated and tested to ensure it is still valid and complete.","qth":"มีหลายสถานการณ์ที่การทดสอบแผน BCDR มีความเหมาะสมหรือได้รับคำสั่ง เวลาใดต่อไปนี้ที่ไม่จำเป็นในการทดสอบแผน BCDR","ath":["หลังจากอัพเดตซอฟต์แวร์แล้ว","หลังจากมีการเปลี่ยนแปลงกฎระเบียบ","หลังจากการเปลี่ยนแปลงการกำหนดค่าครั้งใหญ่","เป็นประจำทุกปี"],"expth":"การเปลี่ยนแปลงด้านกฎระเบียบด้วยตนเองจะไม่กระตุ้นให้มีการทดสอบแผน BCDR ใหม่ การเปลี่ยนแปลงใดๆ ที่จำเป็นสำหรับการปฏิบัติตามกฎระเบียบจะสำเร็จได้ด้วยการเปลี่ยนแปลงการกำหนดค่าหรือการอัปเดตซอฟต์แวร์ ซึ่งจะทำให้เกิดการทดสอบใหม่ที่จำเป็น การทดสอบประจำปีมีความสำคัญอย่างยิ่งต่อแผน BCDR นอกจากนี้ ทุกครั้งที่มีการเปลี่ยนแปลงการกำหนดค่าที่สำคัญหรือการอัปเดตซอฟต์แวร์ แผนควรได้รับการประเมินและทดสอบเพื่อให้แน่ใจว่ายังคงใช้งานได้และสมบูรณ์"},{"id":187,"q":"Key maintenance and security are paramount within a cloud environment due to the widespread use of encryption for both data and transmissions. Which of the following key-management systems would provide the most robust control over and ownership of the key-management processes for the cloud customer?","a":["Remote key management service","Local key management service","Client key management service","Internal key management service"],"ans":"A","exp":"A remote key management system resides away from the cloud environment and is owned and controlled by the cloud customer. With the use of a remote service, the cloud customer can avoid being locked into a proprietary system from the cloud provider, but also must ensure that service is compatible with the services offered by the cloud provider. A local key management system resides on the actual servers using the keys, which does not provide optimal security or control over them. Both the terms internal key management service and client key management service are provided as distractors.","qth":"การบำรุงรักษาคีย์และความปลอดภัยเป็นสิ่งสำคัญยิ่งภายในสภาพแวดล้อมคลาวด์เนื่องจากมีการใช้การเข้ารหัสอย่างกว้างขวางสำหรับทั้งข้อมูลและการส่งสัญญาณ ระบบการจัดการคีย์ใดต่อไปนี้จะให้การควบคุมและความเป็นเจ้าของกระบวนการการจัดการคีย์สำหรับลูกค้าคลาวด์ที่แข็งแกร่งที่สุด","ath":["บริการการจัดการคีย์ระยะไกล","บริการการจัดการคีย์ในเครื่อง","บริการการจัดการคีย์ไคลเอ็นต์","บริการการจัดการคีย์ภายใน"],"expth":"ระบบการจัดการคีย์ Aremote อยู่ห่างจากสภาพแวดล้อมคลาวด์และเป็นเจ้าของและควบคุมโดยลูกค้าคลาวด์ ด้วยการใช้บริการระยะไกล ลูกค้าคลาวด์สามารถหลีกเลี่ยงการถูกล็อกเข้าสู่ระบบที่เป็นกรรมสิทธิ์จากผู้ให้บริการคลาวด์ได้ แต่ยังต้องตรวจสอบให้แน่ใจว่าบริการนั้นเข้ากันได้กับบริการที่ผู้ให้บริการคลาวด์นำเสนอ ระบบการจัดการคีย์ภายในเครื่องอยู่บนเซิร์ฟเวอร์จริงโดยใช้คีย์ ซึ่งไม่ได้ให้ความปลอดภัยหรือการควบคุมที่เหมาะสมที่สุด ทั้งคำว่าบริการการจัดการคีย์ภายในและบริการการจัดการคีย์ไคลเอ็นต์ถือเป็นสิ่งรบกวนสมาธิ"},{"id":188,"q":"Security is a critical yet often overlooked consideration for BCDR planning. At which stage of the planning process should security be involved?","a":["Scope definition","Requirements gathering","Analysis","Risk assessment"],"ans":"A","exp":"Defining the scope of the plan is the very first step in the overall process. Security should be included from the very earliest stages and throughout the entire process. Bringing in security at a later stage can lead to additional costs and time delays to compensate for gaps in planning. Risk assessment, requirements gathering, and analysis are all later steps in the process, and adding in security at any of those points can potentially cause increased costs and time delays.","qth":"Security is a critical yet often overlooked consideration for BCDR planning At which stage of the planning process should security be involved?","ath":["Scope definition","Requirements gathering","Analysis","Risk assessment"],"expth":"Defining the scope of the plan is the very first step in the overall process. Security should be included from the very earliest stages and throughout the entire process. Bringing in security at a later stage can lead to additional costs and time delays to compensate for gaps in planning. Risk assessment, requirements gathering, and analysis are all later steps in the process, and adding in security at any of those points can potentially cause increased costs and time delays"},{"id":189,"q":"Which type of testing uses the same strategies and toolsets that hackers would use?","a":["Static","Malicious","Penetration","Dynamic"],"ans":"C","exp":"Penetration testing involves using the same strategies and toolsets that hackers would use against a system to discovery potential vulnerabilities. Although the term malicious captures much of the intent of penetration testing from the perspective of an attacker, it is not the best answer. Static and dynamic are two types of system testing--where static is done offline and with knowledge of the system, and dynamic is done on a live system without any previous knowledge is associated-- but neither describes the type of testing being asked for in the question.","qth":"การทดสอบประเภทใดใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮ็กเกอร์จะใช้","ath":["แบบคงที่","ที่เป็นอันตราย","การเจาะระบบ","ไดนามิก"],"expth":"การทดสอบการเจาะระบบเกี่ยวข้องกับการใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮ็กเกอร์จะใช้กับระบบเพื่อค้นหาช่องโหว่ที่อาจเกิดขึ้น"},{"id":190,"q":"Which ITIL component is focused on anticipating predictable problems and ensuring that configurations and operations are in place to prevent these problems from ever occurring?","a":["Availability management","Continuity management","Configuration management","Problem management"],"ans":"D","exp":"Problem management is focused on identifying and mitigating known problems and deficiencies before they are able to occur, as well as on minimizing the impact of incidents that cannot be prevented. Continuity management (or business continuity management) is focused on planning for the successful restoration of systems or services after an unexpected outage, incident, or disaster. Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Configuration management tracks and maintains detailed information about all IT components within an organization.","qth":"องค์ประกอบ ITIL ใดที่มุ่งเน้นไปที่การคาดการณ์ปัญหาที่คาดการณ์ได้ และสร้างความมั่นใจว่าการกำหนดค่าและการดำเนินงานนั้นอยู่ในสถานที่เพื่อป้องกันไม่ให้ปัญหาเหล่านี้เกิดขึ้น","ath":["การจัดการความพร้อมใช้งาน","การจัดการความต่อเนื่อง","การจัดการการกำหนดค่า","การจัดการปัญหา"],"expth":"การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้นได้ เช่นเดียวกับการลดผลกระทบของเหตุการณ์ที่ไม่สามารถป้องกันได้ การจัดการความต่อเนื่อง (หรือการจัดการความต่อเนื่องทางธุรกิจ) มุ่งเน้นไปที่การวางแผนเพื่อการฟื้นฟูระบบหรือบริการที่ประสบความสำเร็จหลังจากการหยุดทำงาน เหตุการณ์ หรือภัยพิบัติที่ไม่คาดคิด การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการการกำหนดค่าติดตามและรักษาข้อมูลโดยละเอียดเกี่ยวกับส่วนประกอบไอทีทั้งหมดภายในองค์กร"},{"id":191,"q":"When a system needs to be exposed to the public Internet, what type of secure system would be used to perform only the desired operations?","a":["Firewall","Proxy","Honeypot","Bastion"],"ans":"D","exp":"A bastion is a system that is exposed to the public Internet to perform a specific function, but it is highly restricted and secured to just that function. Any nonessential services and access are removed from the bastion so that security countermeasures and monitoring can be focused just on the bastion's specific duties. A honeypot is a system designed to look like a production system to entice attackers, but it does not contain any real data. It is used for learning about types of attacks and enabling countermeasures for them. A firewall is used within a network to limit access between IP addresses and ports. A proxy server provides additional security to and rulesets for network traffic that is allowed to pass through it to a service destination.","qth":"เมื่อระบบจำเป็นต้องเปิดเผยต่ออินเทอร์เน็ตสาธารณะ ระบบรักษาความปลอดภัยประเภทใดที่จะใช้เพื่อดำเนินการเฉพาะการดำเนินการที่ต้องการเท่านั้น","ath":["ไฟร์วอลล์","พร็อกซี","Honeypot","Bastion"],"expth":"ป้อมปราการคือระบบที่เปิดเผยต่ออินเทอร์เน็ตสาธารณะเพื่อดำเนินการฟังก์ชันเฉพาะ แต่มีข้อจำกัดสูงและปลอดภัยเฉพาะฟังก์ชันนั้น บริการและการเข้าถึงที่ไม่จำเป็นใดๆ จะถูกลบออกจากป้อมปราการ เพื่อให้มาตรการตอบโต้และการตรวจสอบความปลอดภัยสามารถมุ่งความสนใจไปที่หน้าที่เฉพาะของป้อมปราการเท่านั้น honeypot คือระบบที่ออกแบบมาให้ดูเหมือนระบบที่ใช้งานจริงเพื่อล่อลวงผู้โจมตี แต่ไม่มีข้อมูลจริงใดๆ มันถูกใช้เพื่อเรียนรู้เกี่ยวกับประเภทของการโจมตีและเปิดใช้มาตรการตอบโต้สำหรับพวกเขา ไฟร์วอลล์ถูกใช้ภายในเครือข่ายเพื่อจำกัดการเข้าถึงระหว่างที่อยู่ IP และพอร์ต พร็อกซีเซิร์ฟเวอร์ให้การรักษาความปลอดภัยเพิ่มเติมและชุดกฎสำหรับการรับส่งข้อมูลเครือข่ายที่ได้รับอนุญาตให้ส่งผ่านไปยังปลายทางบริการ"},{"id":192,"q":"With the rapid emergence of cloud computing, very few regulations were in place that pertained to it specifically, and organizations often had to resort to using a collection of regulations that were not specific to cloud in order to drive audits and policies. Which standard from the ISO/IEC was designed specifically for cloud computing?","a":["ISO/IEC 27001","ISO/IEC 19889","ISO/IEC 27001:2015","ISO/IEC 27018"],"ans":"D","exp":"ISO/IEC 27018 was implemented to address the protection of personal and sensitive information within a cloud environment. ISO/IEC 27001 and its later 27001:2015 revision are both general-purpose data security standards. ISO/IEC 19889 is an erroneous answer.","qth":"จากการเกิดขึ้นอย่างรวดเร็วของการประมวลผลแบบคลาวด์ จึงมีกฎระเบียบน้อยมากที่เกี่ยวข้องกับการประมวลผลแบบคลาวด์โดยเฉพาะ และองค์กรต่างๆ มักจะต้องใช้ชุดของกฎระเบียบที่ไม่เฉพาะเจาะจงกับระบบคลาวด์เพื่อขับเคลื่อนการตรวจสอบและนโยบาย มาตรฐานใดจาก ISO/IEC ที่ได้รับการออกแบบมาโดยเฉพาะสำหรับการประมวลผลแบบคลาวด์","ath":["ISO/IEC 27001","ISO/IEC 19889","ISO/IEC 27001","ISO/IEC 27018"],"expth":"ISO/IEC 27018 ถูกนำมาใช้เพื่อจัดการกับการปกป้องข้อมูลส่วนบุคคลและข้อมูลที่ละเอียดอ่อนภายในสภาพแวดล้อมระบบคลาวด์ ISO/IEC 27001 และการแก้ไข 27001:2015 ในภายหลังถือเป็นมาตรฐานความปลอดภัยของข้อมูลสำหรับวัตถุประสงค์ทั่วไป ISO/IEC 19889 เป็นคำตอบที่ผิดพลาด"},{"id":193,"q":"Which component of ITIL pertains to planning, coordinating, executing, and validating changes and rollouts to production environments?","a":["Release management","Availability management","Problem management","Change management"],"ans":"A","exp":"Release management involves planning, coordinating, executing, and validating changes and rollouts to the production environment. Change management is a higher-level component than release management and also involves stakeholder and management approval, rather than specifically focusing the actual release itself. Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Problem management is focused on identifying and mitigating known problems and deficiencies before they occur.","qth":"องค์ประกอบใดของ ITIL ที่เกี่ยวข้องกับการวางแผน การประสานงาน การดำเนินการ และการตรวจสอบการเปลี่ยนแปลงและการเปิดตัวในสภาพแวดล้อมการผลิต?","ath":["การจัดการการเผยแพร่","การจัดการความพร้อมใช้งาน","การจัดการปัญหา","การจัดการการเปลี่ยนแปลง"],"expth":"การจัดการการเผยแพร่เกี่ยวข้องกับการวางแผน การประสานงาน การดำเนินการ และการตรวจสอบการเปลี่ยนแปลงและการเปิดตัวในสภาพแวดล้อมการผลิต การจัดการการเปลี่ยนแปลงเป็นองค์ประกอบในระดับที่สูงกว่าการจัดการการเผยแพร่ และยังเกี่ยวข้องกับการอนุมัติของผู้มีส่วนได้ส่วนเสียและการอนุมัติของฝ่ายบริหาร แทนที่จะเน้นไปที่การเผยแพร่จริงโดยเฉพาะ การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น"},{"id":194,"q":"What process entails taking sensitive data and removing the indirect identifiers from each data object so that the identification of a single entity would not be possible?","a":["Tokenization","Encryption","Anonymization","Masking"],"ans":"C","exp":"Anonymization is a type of masking, where indirect identifiers are removed from a data set to prevent the mapping back of data to an individual. Although masking refers to the overall approach of covering sensitive data, anonymization is the best answer here because it is more specific to exactly what is being asked. Tokenization involves the replacement of sensitive data with a key value that can be matched back to the real value. However, it is not focused on indirect identifiers or preventing the matching to an individual. Encryption refers to the overall process of protecting data via key pairs and protecting confidentiality.","qth":"กระบวนการใดที่เกี่ยวข้องกับการรับข้อมูลที่ละเอียดอ่อนและลบตัวระบุทางอ้อมออกจากแต่ละออบเจ็กต์ข้อมูล เพื่อไม่ให้สามารถระบุตัวตนของเอนทิตีเดียวได้?","ath":["การแปลงโทเค็น","การเข้ารหัส","การลบข้อมูลระบุตัวตน","การมาสก์"],"expth":"การลบข้อมูลระบุตัวตนเป็นประเภทของการมาสก์ โดยที่ตัวระบุทางอ้อมจะถูกลบออกจากชุดข้อมูลเพื่อป้องกันการแมปด้านหลังของข้อมูลไปยังแต่ละบุคคล แม้ว่าการปิดบังจะหมายถึงวิธีการโดยรวมในการปกปิดข้อมูลที่ละเอียดอ่อน แต่การลบข้อมูลระบุตัวตนเป็นคำตอบที่ดีที่สุดที่นี่ เนื่องจากมีความเฉพาะเจาะจงมากขึ้นกับสิ่งที่ถูกถาม Tokenization เกี่ยวข้องกับการแทนที่ข้อมูลที่ละเอียดอ่อนด้วยค่าคีย์ที่สามารถจับคู่กลับเป็นมูลค่าจริงได้ อย่างไรก็ตาม ไม่ได้มุ่งเน้นไปที่ตัวระบุทางอ้อมหรือการป้องกันการจับคู่กับแต่ละบุคคล การเข้ารหัสหมายถึงกระบวนการโดยรวมในการปกป้องข้อมูลผ่านคู่คีย์และการปกป้องความลับ"},{"id":195,"q":"Because cloud providers will not give detailed information out about their infrastructures and practices to the general public, they will often use established auditing reports to ensure public trust, where the reputation of the auditors serves for assurance. Which type of audit reports can be used for general public trust assurances?","a":["SOC 2","SAS-70","SOC 3","SOC 1"],"ans":"C","exp":"SOC Type 3 audit reports are very similar to SOC Type 2, with the exception that they are intended for general release and public audiences.SAS-70 audits have been deprecated. SOC Type 1 audit reports have a narrow scope and are intended for very limited release, whereas SOC Type 2 audit reports are intended for wider audiences but not general release.","qth":"เนื่องจากผู้ให้บริการระบบคลาวด์จะไม่ให้ข้อมูลโดยละเอียดเกี่ยวกับโครงสร้างพื้นฐานและแนวทางปฏิบัติของตนแก่สาธารณชนทั่วไป พวกเขามักจะใช้รายงานการตรวจสอบที่จัดทำขึ้นเพื่อให้มั่นใจในความไว้วางใจของสาธารณะ โดยที่ชื่อเสียงของผู้ตรวจสอบทำหน้าที่ในการรับประกัน รายงานการตรวจสอบประเภทใดที่สามารถใช้เพื่อการรับรองความไว้วางใจของสาธารณะทั่วไป","ath":["เอสโอซี 2","SAS-70","สคส.3","สค 1"],"expth":"รายงานการตรวจสอบ SOC ประเภท 3 มีความคล้ายคลึงกับ SOC ประเภท 2 มาก โดยมีข้อยกเว้นว่ามีไว้สำหรับการเผยแพร่ทั่วไปและผู้ชมสาธารณะ การตรวจสอบ SAS-70 เลิกใช้แล้ว รายงานการตรวจสอบ SOC ประเภท 1 มีขอบเขตที่แคบและมีไว้สำหรับการเผยแพร่ที่จำกัดมาก ในขณะที่รายงานการตรวจสอบ SOC ประเภท 2 มีไว้สำหรับผู้ชมในวงกว้าง แต่ไม่ใช่การเผยแพร่ทั่วไป"},{"id":196,"q":"Which of the following concepts is NOT one of the core components to an encryption system architecture?","a":["Software","Network","Keys","Data"],"ans":"B","exp":"The network utilized is not one of the key components of an encryption system architecture. In fact, a network is not even required for encryption systems or the processing and protection of data. The data, software used for the encryption engine itself, and the keys used to implement the encryption are all core components of an encryption system architecture.","qth":"แนวคิดใดต่อไปนี้ไม่ใช่องค์ประกอบหลักอย่างหนึ่งของสถาปัตยกรรมระบบการเข้ารหัส","ath":["ซอฟต์แวร์","เครือข่าย","คีย์","ข้อมูล"],"expth":"เครือข่ายที่ใช้ไม่ใช่องค์ประกอบสำคัญของสถาปัตยกรรมระบบการเข้ารหัส ในความเป็นจริงแล้ว เครือข่ายไม่จำเป็นแม้แต่สำหรับระบบการเข้ารหัสหรือการประมวลผลและการปกป้องข้อมูล ข้อมูล ซอฟต์แวร์ที่ใช้สำหรับกลไกการเข้ารหัส และคีย์ที่ใช้ในการเข้ารหัสล้วนเป็นองค์ประกอบหลักของสถาปัตยกรรมระบบการเข้ารหัส"},{"id":197,"q":"Which of the following is NOT a major regulatory framework?","a":["PCI DSS","HIPAA","SOX","FIPS 140-2"],"ans":"D","exp":"FIPS 140-2 is a United States certification standard for cryptographic modules, and it provides guidance and requirements for their use based on the requirements of the data classification. However, these are not actual regulatory requirements. The Health Insurance Portability and Accountability Act (HIPAA), Sarbanes-Oxley Act (SOX), and the Payment Card Industry Data Security Standard (PCI DSS) are all major regulatory frameworks either by law or specific to an industry.","qth":"ข้อใดต่อไปนี้ไม่ใช่กรอบการกำกับดูแลที่สำคัญ","ath":["PCI DSS","HIPAA","SOX","FIPS 140-2"],"expth":"FIPS 140-2 เป็นมาตรฐานการรับรองของสหรัฐอเมริกาสำหรับโมดูลการเข้ารหัส และให้คำแนะนำและข้อกำหนดสำหรับการใช้งานโดยอิงตามข้อกำหนดของการจำแนกประเภทข้อมูล อย่างไรก็ตาม สิ่งเหล่านี้ไม่ใช่ข้อกำหนดด้านกฎระเบียบที่แท้จริง Health Insurance Portability and Accountability Act (HIPAA), Sarbanes Oxley Act (SOX) และ Payment Card Industry Data Security Standard (PCI DSS) ล้วนเป็นกรอบการกำกับดูแลที่สำคัญไม่ว่าจะตามกฎหมายหรือเฉพาะเจาะจงในอุตสาหกรรม"},{"id":198,"q":"An audit scope statement defines the limits and outcomes from an audit. Which of the following would NOT be included as part of an audit scope statement?","a":["Reports","Certification","Billing","Exclusions"],"ans":"C","exp":"Billing for an audit, or other cost-related items, would not be part of an audit scope statement and would instead be handled prior to the actual audit as part of the contract between the organization and auditors. Reports, exclusions to the scope of the audit, and required certifications on behalf of the systems or auditors are all crucial elements of an audit scope statement.","qth":"คำชี้แจงขอบเขตการตรวจสอบจะกำหนดขีดจำกัดและผลลัพธ์จากการตรวจสอบ ข้อใดต่อไปนี้จะไม่รวมอยู่ในส่วนหนึ่งของคำชี้แจงขอบเขตการตรวจสอบ","ath":["รายงาน","การรับรอง","การเรียกเก็บเงิน","การยกเว้น"],"expth":"การเรียกเก็บเงินสำหรับการตรวจสอบหรือรายการอื่น ๆ ที่เกี่ยวข้องกับต้นทุน จะไม่เป็นส่วนหนึ่งของคำชี้แจงขอบเขตการตรวจสอบ และจะได้รับการจัดการก่อนการตรวจสอบจริงแทนซึ่งเป็นส่วนหนึ่งของสัญญาระหว่างองค์กรและผู้ตรวจสอบ รายงาน การยกเว้นขอบเขตของการตรวจสอบ และการรับรองที่จำเป็นในนามของระบบหรือผู้ตรวจสอบ ล้วนเป็นองค์ประกอบที่สำคัญของคำชี้แจงเกี่ยวกับขอบเขตการตรวจสอบ"},{"id":199,"q":"What concept and operational process must be spelled out clearly, as far as roles and responsibilities go, between the cloud provider and cloud customer for the mitigation of any problems or security events?","a":["Incident response","Problem management","Change management","Conflict response"],"ans":"A","exp":"Incident response is the process through which security or operational issues are handled, including and coordination with and communication to the appropriate stakeholders. None of the other terms provided is the correct response.","qth":"แนวคิดและกระบวนการปฏิบัติงานใดที่ต้องอธิบายให้ชัดเจนเท่าที่บทบาทและความรับผิดชอบระหว่างผู้ให้บริการคลาวด์และลูกค้าคลาวด์ เพื่อลดปัญหาหรือเหตุการณ์ด้านความปลอดภัย","ath":["การตอบสนองต่อเหตุการณ์","การจัดการปัญหา","การจัดการการเปลี่ยนแปลง","การตอบสนองต่อความขัดแย้ง"],"expth":"การตอบสนองต่อเหตุการณ์คือกระบวนการที่ใช้จัดการปัญหาด้านความปลอดภัยหรือการปฏิบัติงาน รวมถึงการประสานงานและการสื่อสารไปยังผู้มีส่วนได้ส่วนเสียที่เหมาะสม ไม่มีข้อกำหนดอื่นใดที่ให้ไว้เป็นคำตอบที่ถูกต้อง"},{"id":200,"q":"Cloud systems are increasingly used for BCDR solutions for organizations. What aspect of cloud computing makes their use for BCDR the most attractive?","a":["On-demand self-service","Measured service","Portability","Broad network access"],"ans":"B","exp":"Business continuity and disaster recovery (BCDR) solutions largely sit idle until they are actually needed. This traditionally has led to increased costs for an organization because physical hardware must be purchased and operational but is not used. By using a cloud system, an organization will only pay for systems when they are being used and only for the duration of use, thus eliminating the need for extra hardware and costs. Portability is the ability to easily move services among different cloud providers. Broad network access allows access to users and staff from anywhere and from different clients, and although this would be important for a BCDR situation, it is not the best answer in this case. On-demand self-service allows users to provision services automatically and when needed, and although this too would be important for BCDR situations, it is not the best answer because it does not address costs or the biggest benefits to an organization.","qth":"ระบบคลาวด์ถูกนำมาใช้มากขึ้นสำหรับโซลูชัน BCDR สำหรับองค์กร แง่มุมใดของการประมวลผลแบบคลาวด์ที่ทำให้การใช้งาน BCDR น่าสนใจที่สุด","ath":["บริการตนเองตามความต้องการ","บริการวัดผล","การพกพา","การเข้าถึงเครือข่ายในวงกว้าง"],"expth":"โซลูชันความต่อเนื่องทางธุรกิจและการกู้คืนระบบ (BCDR) ส่วนใหญ่ไม่ได้ใช้งานจนกว่าจะมีความจำเป็นจริงๆ ซึ่งแต่เดิมได้นำไปสู่ต้นทุนที่เพิ่มขึ้นสำหรับองค์กร เนื่องจากต้องซื้อและใช้งานฮาร์ดแวร์ทางกายภาพ แต่ไม่ได้ใช้ เมื่อใช้ระบบคลาวด์ องค์กรจะชำระค่าระบบเฉพาะเมื่อมีการใช้งานและตามระยะเวลาการใช้งานเท่านั้น จึงขจัดความจำเป็นในการใช้ฮาร์ดแวร์และค่าใช้จ่ายเพิ่มเติม การพกพาคือความสามารถในการย้ายบริการระหว่างผู้ให้บริการคลาวด์ต่างๆ ได้อย่างง่ายดาย การเข้าถึงเครือข่ายแบบกว้างทำให้ผู้ใช้และพนักงานสามารถเข้าถึงได้จากทุกที่และจากไคลเอนต์ที่แตกต่างกัน และถึงแม้ว่านี่จะมีความสำคัญสำหรับสถานการณ์ BCDR แต่ก็ไม่ใช่คำตอบที่ดีที่สุดในกรณีนี้ การบริการตนเองตามความต้องการช่วยให้ผู้ใช้สามารถจัดเตรียมบริการได้โดยอัตโนมัติและเมื่อจำเป็น"},{"id":201,"q":"What's a potential problem when object storage versus volume storage is used within IaaS for application use and dependency?","a":["Object storage is only optimized for small files.","Object storage is its own system, and data consistency depends on replication.","Object storage may have availability issues.","Object storage is dependent on access control from the host server."],"ans":"B","exp":"Object storage runs on its own independent systems, which have their own redundancy and distribution. To ensure data consistency, sufficient time is needed for objects to fully replicate to all potential locations before being accessed. Object storage is optimized for high availability and will not be any less reliable than any other virtual machine within a cloud environment. It is hosted on a separate system that does not have dependencies in local host servers for access control, and it is optimized for files of all different sizes and uses.","qth":"จะเกิดปัญหาอะไรขึ้นเมื่อมีการใช้พื้นที่จัดเก็บอ็อบเจ็กต์เทียบกับพื้นที่จัดเก็บโวลุ่มภายใน laaS สำหรับการใช้งานแอปพลิเคชันและการพึ่งพา?","ath":["พื้นที่จัดเก็บอ็อบเจ็กต์ได้รับการปรับให้เหมาะสมสำหรับไฟล์ขนาดเล็กเท่านั้น","พื้นที่จัดเก็บอ็อบเจ็กต์เป็นระบบของตัวเอง และความสอดคล้องของข้อมูลขึ้นอยู่กับการจำลองแบบ","พื้นที่จัดเก็บอ็อบเจ็กต์อาจมีปัญหาด้านความพร้อมใช้งาน","พื้นที่จัดเก็บอ็อบเจ็กต์ขึ้นอยู่กับการควบคุมการเข้าถึงจากเซิร์ฟเวอร์โฮสต์"],"expth":"พื้นที่จัดเก็บอ็อบเจ็กต์ทำงาน ระบบอิสระของตัวเอง ซึ่งมีความซ้ำซ้อนและการกระจายของตัวเอง เพื่อให้มั่นใจถึงความสอดคล้องของข้อมูล จึงต้องใช้เวลาเพียงพอสำหรับออบเจ็กต์ในการจำลองแบบเต็มรูปแบบไปยังตำแหน่งที่เป็นไปได้ทั้งหมดก่อนที่จะเข้าถึง พื้นที่เก็บข้อมูลออบเจ็กต์ได้รับการปรับให้เหมาะสมเพื่อความพร้อมใช้งานสูงและจะไม่น่าเชื่อถือน้อยกว่าเครื่องเสมือนอื่น ๆ ภายในสภาพแวดล้อมคลาวด์ มันถูกโฮสต์บนระบบแยกต่างหากที่ไม่มีการพึ่งพาในเซิร์ฟเวอร์โฮสต์ในพื้นที่สำหรับการควบคุมการเข้าถึง และได้รับการปรับให้เหมาะสมสำหรับไฟล์ที่มีขนาดและการใช้งานที่แตกต่างกันทั้งหมด"},{"id":202,"q":"Many aspects of cloud computing bring enormous benefits over a traditional data center, but also introduce new challenges unique to cloud computing. Which of the following aspects of cloud computing makes appropriate data classification of high importance?","a":["Multitenancy","Interoperability","Portability","Reversibility"],"ans":"A","exp":"With multitenancy, where different cloud customers all share the same physical systems and networks, data classification becomes even more important to ensure that the appropriate security controls are applied immediately to prevent any potential leakage or exposure to other customers. Portability refers to the ability to move easily from one cloud provider to another. Interoperability refers to the ability to reuse components and services for different uses. Reversibility refers to the ability of the cloud customer to quickly and completely remove all data and services from a cloud provider and to verify the removal.","qth":"การประมวลผลแบบคลาวด์ในหลายแง่มุมนำมาซึ่งผลประโยชน์มหาศาลเหนือศูนย์ข้อมูลแบบเดิม แต่ยังนำเสนอความท้าทายใหม่ ๆ ที่ไม่ซ้ำกับการประมวลผลบนคลาวด์ ด้านใดต่อไปนี้ของการประมวลผลแบบคลาวด์ที่ทำให้การจำแนกข้อมูลที่เหมาะสมและมีความสำคัญสูง?","ath":["การครอบครองหลายรายการ","การทำงานร่วมกัน","การพกพา","การย้อนกลับได้"],"expth":"ด้วยการเช่าหลายครั้ง โดยที่ลูกค้าคลาวด์ที่แตกต่างกันทั้งหมดใช้ระบบและเครือข่ายทางกายภาพเดียวกัน การจำแนกประเภทข้อมูลมีความสำคัญมากยิ่งขึ้นเพื่อให้แน่ใจว่าการรักษาความปลอดภัยที่เหมาะสม การควบคุมจะถูกนำไปใช้ทันทีเพื่อป้องกันการรั่วไหลหรือการสัมผัสกับลูกค้ารายอื่นที่อาจเกิดขึ้น การพกพาหมายถึงความสามารถในการย้ายจากผู้ให้บริการคลาวด์รายหนึ่งไปยังอีกรายหนึ่งได้อย่างง่ายดาย ความสามารถในการทำงานร่วมกันหมายถึงความสามารถในการนำส่วนประกอบและบริการกลับมาใช้ใหม่สำหรับการใช้งานที่แตกต่างกัน การย้อนกลับได้หมายถึงความสามารถของลูกค้าคลาวด์ในการลบข้อมูลและบริการทั้งหมดออกจากผู้ให้บริการคลาวด์อย่างรวดเร็วและสมบูรณ์ และเพื่อตรวจสอบการลบออก"},{"id":203,"q":"Without the extensive funds of a large corporation, a small-sized company could gain considerable and cost-effective services for which of the following concepts by moving to a cloud environment?","a":["Regulatory","Security","Testing","Development"],"ans":"B","exp":"Cloud environments, regardless of the specific deployment model used, have extensive and robust security controls in place, especially in regard to physical and infrastructure security. A small company can leverage the extensive security controls and monitoring provided by a cloud provider, which they would unlikely ever be able to afford on their own. Moving to a cloud would not result in any gains for development and testing because these areas require the same rigor regardless of where deployment and hosting occur. Regulatory compliance in a cloud would not be a gain for an organization because it would likely result in additional oversight and auditing as well as require the organization to adapt to a new environment.","qth":"หากไม่มีเงินทุนจำนวนมากของบริษัทขนาดใหญ่ บริษัทขนาดเล็กสามารถได้รับบริการจำนวนมากและคุ้มค่าสำหรับแนวคิดใดต่อไปนี้โดยการย้ายไปยังสภาพแวดล้อมระบบคลาวด์","ath":["กฎระเบียบ","ความปลอดภัย","การทดสอบ","การพัฒนา"],"expth":"สภาพแวดล้อมระบบคลาวด์ โดยไม่คำนึงถึงรูปแบบการใช้งานเฉพาะที่ใช้ มีการควบคุมความปลอดภัยที่ครอบคลุมและแข็งแกร่งในสถานที่ โดยเฉพาะอย่างยิ่งในส่วนที่เกี่ยวกับทางกายภาพและโครงสร้างพื้นฐาน ความปลอดภัย บริษัทขนาดเล็กสามารถใช้ประโยชน์จากการควบคุมและการตรวจสอบความปลอดภัยที่ครอบคลุมโดยผู้ให้บริการระบบคลาวด์ ซึ่งพวกเขาไม่น่าจะซื้อได้ด้วยตัวเอง การย้ายไปยังระบบคลาวด์จะไม่ส่งผลให้เกิดประโยชน์ใดๆ ในการพัฒนาและการทดสอบ เนื่องจากพื้นที่เหล่านี้ต้องการความเข้มงวดแบบเดียวกัน ไม่ว่าการใช้งานและการโฮสต์จะเกิดขึ้นที่ใดก็ตาม การปฏิบัติตามกฎระเบียบในระบบคลาวด์จะไม่เป็นประโยชน์สำหรับองค์กร เนื่องจากอาจส่งผลให้เกิดการกำกับดูแลและการตรวจสอบเพิ่มเติม รวมถึงกำหนดให้องค์กรต้องปรับตัวเข้ากับสภาพแวดล้อมใหม่"},{"id":204,"q":"BCDR strategies typically do not involve the entire operations of an organization, but only those deemed critical to their business. Which concept pertains to the amount of data and services needed to reach the predetermined level of operations?","a":["SRE","RPO","RSL","RTO"],"ans":"B","exp":"The recovery point objective (RPO) sets and defines the amount of data an organization must have available or accessible to reach the predetermined level of operations necessary during a BCDR situation. The recovery time objective (RTO) measures the amount of time necessary to recover operations to meet the BCDR plan. The recovery service level (RSL) measures the percentage of operations that would be recovered during a BCDR situation. SRE is provided as an erroneous response.","qth":"โดยทั่วไปแล้วกลยุทธ์ BCDR จะไม่เกี่ยวข้องกับการดำเนินงานทั้งหมดขององค์กร แต่จะเกี่ยวข้องกับการดำเนินการที่ถือว่ามีความสำคัญต่อธุรกิจเท่านั้น แนวคิดใดที่เกี่ยวข้องกับปริมาณข้อมูลและบริการที่จำเป็นในการบรรลุระดับการดำเนินงานที่กำหนดไว้","ath":["SRE","RPO","RSL","RTO"],"expth":"วัตถุประสงค์จุดกู้คืน (RPO) กำหนดและกำหนดจำนวนข้อมูลที่องค์กรต้องมีหรือสามารถเข้าถึงได้เพื่อให้บรรลุระดับการดำเนินงานที่กำหนดไว้ล่วงหน้าที่จำเป็นในระหว่างสถานการณ์ BCDR วัตถุประสงค์เวลาการกู้คืน (RTO) จะวัดระยะเวลาที่จำเป็นในการกู้คืนการดำเนินการเพื่อให้เป็นไปตามแผน BCDR ระดับบริการการกู้คืน (RSL) จะวัดเปอร์เซ็นต์ของการดำเนินการที่จะได้รับการกู้คืนในระหว่างสถานการณ์ BCDR SRE ให้มาเป็นการตอบกลับที่ผิดพลาด"},{"id":205,"q":"Which of the following is NOT a commonly used communications method within cloud environments to secure data in transit?","a":["IPSec","HTTPS","VPN","DNSSEC"],"ans":"D","exp":"DNSSEC is used as a security extension to DNS lookup queries in order to ensure the authenticity and authoritativeness of hostname resolutions, in order to prevent spoofing and redirection of traffic. Although it is a very important concept to be employed for security practices, it is not used to secure or encrypt data transmissions. HTTPS is the most commonly used security mechanism for data communications between clients and websites and web services. IPSec is less commonly used, but is also intended to secure communications between servers. VPN is commonly used to secure traffic into a network area or subnet for developers and administrative users.","qth":"ข้อใดต่อไปนี้ไม่ใช่วิธีการสื่อสารที่ใช้กันทั่วไปภายในสภาพแวดล้อมคลาวด์เพื่อรักษาความปลอดภัยข้อมูลระหว่างทาง","ath":["IPSec","HTTPS","VPN","DNSSEC"],"expth":"DNSSEC ถูกใช้เป็นส่วนขยายการรักษาความปลอดภัยสำหรับการสืบค้นการค้นหา DNS เพื่อให้มั่นใจถึงความถูกต้องและความน่าเชื่อถือของการแก้ไขชื่อโฮสต์ เพื่อป้องกันการปลอมแปลงและการเปลี่ยนเส้นทางการรับส่งข้อมูล แม้ว่าจะเป็นแนวคิดที่สำคัญมากที่จะใช้สำหรับแนวทางปฏิบัติด้านความปลอดภัย แต่ก็ไม่ได้ใช้เพื่อรักษาความปลอดภัยหรือเข้ารหัสการส่งข้อมูล HTTPS เป็นกลไกความปลอดภัยที่ใช้กันมากที่สุดสำหรับการสื่อสารข้อมูลระหว่างไคลเอนต์และเว็บไซต์และบริการบนเว็บ IPSec ไม่ค่อยมีคนใช้ แต่ก็มีจุดมุ่งหมายเพื่อความปลอดภัยในการสื่อสารระหว่างเซิร์ฟเวอร์ด้วย โดยทั่วไปจะใช้ VPN เพื่อรักษาความปลอดภัยการรับส่งข้อมูลในพื้นที่เครือข่ายหรือซับเน็ตสำหรับนักพัฒนาและผู้ใช้ที่เป็นผู้ดูแลระบบ"},{"id":206,"q":"Which crucial aspect of cloud computing can be most threatened by insecure APIs?","a":["Automation","Resource pooling","Elasticity","Redundancy"],"ans":"A","exp":"Cloud environments depend heavily on API calls for management and automation. Any vulnerability with the APIs can cause significant risk and exposure to all tenants of the cloud environment. Resource pooling and elasticity could both be impacted by insecure APIs, as both require automation and orchestration to operate properly, but automation is the better answer here. Redundancy would not be directly impacted by insecure APIs.","qth":"ลักษณะสำคัญใดของคลาวด์ที่ถูกคุกคามมากที่สุดเมื่อ API ไม่ปลอดภัย","ath":["ระบบอัตโนมัติ","การรวมทรัพยากร","ความยืดหยุ่นเชิงยืดขยาย","ความซ้ำซ้อน"],"expth":"การบริหารคลาวด์พึ่ง API หาก API ไม่ปลอดภัย ระบบอัตโนมัติทั้งหมดเสี่ยง"},{"id":207,"q":"The WS-Security standards are built around all of the following standards except which one?","a":["SAML","WDSL","XML","SOAP"],"ans":"A","exp":"The WS-Security specifications, as well as the WS-Federation system, are built upon XML, WDSL, and SOAP. SAML is a very similar protocol that is used as an alternative to WS.XML, WDSL, and SOAP are all integral to the WS-Security specifications.","qth":"มาตรฐาน WS-Security ถูกสร้างขึ้นโดยใช้มาตรฐานต่อไปนี้ทั้งหมด ยกเว้นมาตรฐานใด","ath":["SAML","WSDL","XML","SOAP"],"expth":"ข้อกำหนด WS-Security เช่นเดียวกับระบบ WS-Federation นั้นสร้างขึ้นจาก XML, WDSL และ SOAP SAML เป็นโปรโตคอลที่คล้ายกันมากซึ่งใช้เป็นทางเลือกแทน WS.XML, WDSL และ SOAP ล้วนรวมอยู่ในข้อกำหนดเฉพาะของ WS-Security"},{"id":208,"q":"Which protocol, as a part of TLS, handles negotiating and establishing a connection between two parties?","a":["Record","Binding","Negotiation","Handshake"],"ans":"D","exp":"The TLS handshake protocol is what negotiates and establishes the TLS connection between two parties and enables a secure communications channel to then handle data transmissions. The TLS record protocol is the actual secure communications method for transmitting data; it's responsible for the encryption and authentication of packets throughout their transmission between the parties, and in some cases it also performs compression. Negotiation and binding are not protocols under TLS.","qth":"โปรโตคอลใดซึ่งเป็นส่วนหนึ่งของ TLS ที่จะจัดการการเจรจาและสร้างการเชื่อมต่อระหว่างสองฝ่าย","ath":["บันทึก","การเชื่อมโยง","การเจรจาต่อรอง","การจับมือกัน"],"expth":"โปรโตคอลการจับมือกันของ TLS คือสิ่งที่เจรจาและสร้างการเชื่อมต่อ TLS ระหว่างสองฝ่าย และเปิดใช้งานช่องทางการสื่อสารที่ปลอดภัยเพื่อจัดการการส่งข้อมูล โปรโตคอลบันทึก TLS เป็นวิธีการสื่อสารที่ปลอดภัยอย่างแท้จริงสำหรับการส่งข้อมูล ฉันรับผิดชอบในการเข้ารหัสและการรับรองความถูกต้องของแพ็กเก็ตตลอดการส่งข้อมูลระหว่างฝ่ายต่างๆ และในบางกรณีก็ทำการบีบอัดด้วย การเจรจาและการผูกมัดไม่ใช่โปรโตคอลภายใต้ TLS"},{"id":209,"q":"BCDR strategies typically do not involve the entire operations of an organization, but only those deemed critical to their business. Which concept pertains to the required amount of time to restore services to the predete
