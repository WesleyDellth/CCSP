ity can’t be transferred to the cloud provider."],"ans":"D","exp":"State notification laws and the loss of proprietary data/intellectual property pre-existed the cloud; only the lack of ability to transfer liability is new.","qth":"When reviewing the BIA after a cloud migration, the organization should take into account new factors related to data breach impacts. One of these new factors is:","ath":["Many states have data breach notification laws","Breaches can cause the loss of proprietary data","Breaches can cause the loss of intellectual property","Legal liability can't be transferred to the cloud provider"],"expth":"State notification laws and the loss of proprietary data/intellectual property pre-existed the cloud; only the lack of ability to transfer liability is new"},{"id":278,"q":"The cloud customer will have the most control of their data and systems, and the cloud provider will have the least amount of responsibility, in which cloud computing arrangement?","a":["IaaS","SaaS","Community cloud","PaaS"],"ans":"A","exp":"IaaS entails the cloud customer installing and maintaining the OS, programs, and data; PaaS has the customer installing programs and data; in SaaS, the customer only uploads data. In a community cloud, data and device owners are distributed.","qth":"The cloud customer will have the most control of their data and systems, and the cloud provider will have the least amount of responsibility, in which cloud computing arrangement?","ath":["IaaS (โครงสร้างพื้นฐานในรูปแบบบริการ)","SaaS","Community cloud","PaaS"],"expth":"laaS entails the cloud customer instaling and maintaining the OS, programs, and data; PaaS has the customer installing programs and data; in SaaS, the customer only uploads data. In a community cloud, data and device owners are distributed"},{"id":279,"q":"Countermeasures for protecting cloud operations against external attackers include all of the following except:","a":["Continual monitoring for anomalous activity.","Detailed and extensive background checks.","Regular and detailed configuration/change management activities","Hardened devices and systems, including servers, hosts, hypervisors, and virtual machines."],"ans":"B","exp":"Background checks are controls for attenuating potential threats from internal actors; external threats aren’t likely to submit to background checks.","qth":"Countermeasures for protecting cloud operations against external attackers include all of the following except:","ath":["Continual monitoring for anomalous activity","Detailed and extensive background checks","Regular and detailed configuration/change management activities","Hard"],"expth":"Background checks are controls for attenuating potential threats from internal actors; external threats aren't likely to submit to background checks"},{"id":280,"q":"User access to the cloud environment can be administered in all of the following ways except:","a":["Provider provides administration on behalf the customer","Customer directly administers access","Third party provides administration on behalf of the customer","Customer provides administration on behalf of the provider"],"ans":"D","exp":"The customer does not administer on behalf of the provider. All the rest are possible options.","qth":"User access to the cloud environment can be administered in al of the following ways except","ath":["Provider provides administration on behalf the customer","Customer directly administers access","Third party provides administration on behalf of the customer","Customer provides administration on behalf of the provider"],"expth":"The customer does not administer on behalf of the provider. All the rest are possible options"},{"id":281,"q":"Countermeasures for protecting cloud operations against internal threats include all of the following except:","a":["Extensive and comprehensive training programs, including initial, recurring, and refresher sessions","Skills and knowledge testing","Hardened perimeter devices","Aggressive background checks"],"ans":"C","exp":"Hardened perimeter devices are more useful at attenuating the risk of external attack.","qth":"Countermeasures for protecting cloud operations against internal threats include all of the following except","ath":["Extensive and comprehensive training programs, including initial, recurring, and refresher sessions","Skills and knowledge testing","Hard","Aggressive background checks"],"expth":"Hard"},{"id":282,"q":"Because of multitenancy, specific risks in the public cloud that don’t exist in the other cloud service models include all the following except:","a":["DoS/DDoS","Information bleed","Risk of loss/disclosure due to legal seizures","Escalation of privilege"],"ans":"A","exp":"DoS/DDoS threats and risks are not unique to the public cloud model.","qth":"Because of multitenancy, specific risks in the public cloud that don't exist in the other cloud service models include all the following except","ath":["DoS/DDoS","Information bleed","Risk of loss/disclosure due to legal seizures","Escalation of privilege"],"expth":"DoS/DDoS threats and risks are not unique to the public cloud model"},{"id":283,"q":"What is the cloud service model in which the customer is responsible for administration of the OS?","a":["QaaS","SaaS","PaaS","IaaS"],"ans":"D","exp":"In IaaS, the cloud provider only owns the hardware and supplies the utilities. The customer is responsible for the OS, programs, and data. In PaaS and SaaS, the provider also owns the OS. There is no QaaS. That is a red herring.","qth":"What is the cloud service model in which the customer is responsible for administration of the OS?","ath":["QaaS","SaaS","PaaS","IaaS (โครงสร้างพื้นฐานในรูปแบบบริการ)"],"expth":"In laaS, the cloud provider only owns the hardware and supplies the utilities. The customer is responsible for the OS, programs, and data. In PaaS and SaaS, the provider also owns the OS. There is no QaaS. That is a red herring"},{"id":284,"q":"All of the following are techniques to enhance the portability of cloud data, in order to minimize the potential of vendor lock-in except:","a":["Ensure there are no physical limitations to moving","Use DRM and DLP solutions widely throughout the cloud operation","Ensure favorable contract terms to support portability","Avoid proprietary data formats"],"ans":"B","exp":"DRM and DLP are used for increased authentication/access control and egress monitoring, respectively, and would actually decrease portability instead of enhancing it.","qth":"All of the following are techniques to enhance the portability of cloud data, in order to minimize the potential of vendor lock-in except:","ath":["Ensure there are no physical limitations to moving","Use DRM and DLP solutions widely throughout the cloud operation","Ensure favorable contract terms to support portability","Avoid proprietary data formats"],"expth":"DRM and DLP are used for increased authentication/access control and egress monitoring, respectively, and would actually decrease portability instead of enhancing it"},{"id":285,"q":"Which kind of SSAE audit report is a cloud customer most likely to receive from a cloud provider?","a":["SOC 1 Type 1","SOC 2 Type 2","SOC 3","SOC 1 Type 2"],"ans":"C","exp":"The SOC 3 is the least detailed, so the provider is not concerned about revealing it. The SOC 1 Types 1 and 2 are about financial reporting, and not relevant. The SOC 2 Type 2 is much more detailed and will most likely be kept closely held by the provider.","qth":"รายงานตรวจสอบ SSAE ชนิดใดที่ลูกค้าคลาวด์มีโอกาสได้รับจากผู้ให้บริการมากที่สุด","ath":["SOC 1 Type 1","SOC 2 Type 2","SOC 3","SOC 1 Type 2"],"expth":"SOC 3 รายละเอียดน้อยที่สุด ผู้ให้บริการจึงเปิดเผยได้ง่ายกว่า SOC 2 Type 2"},{"id":286,"q":"As a result of scandals involving publicly traded corporations such as Enron, WorldCom, and Adelphi, Congress passed legislation known as:","a":["SOX","HIPAA","FERPA","GLBA"],"ans":"A","exp":"Sarbanes-Oxley was a direct response to corporate scandals. FERPA is related to education. GLBA is about the financial industry. HIPAA is about health care.","qth":"As a result of scandals involving publicly traded corporations such as Enron, WorldCom, and Adelphi, Congress passed legislation known as:","ath":["SOX","HIPAA","FERPA","GLBA"],"expth":"Sarbanes-Oxley was a direct response to corporate scandals. FERPA is related to education. GLBA is about the financial industry. HIPAA is about health care"},{"id":287,"q":"The application normative framework is best described as which of the following?","a":["A superset of the ONF","A stand-alone framework for storing security practices for the ONF","The complete ONF","A subnet of the ONF"],"ans":"D","exp":"Remember, there is a one-to-many ratio of ONF to ANF; each organization has one ONF and many ANFs (one for each application in the organization). Therefore, the ANF is a subset of the ONF.","qth":"The application normative framework is best described as which of the following?","ath":["A superset of the ONF","A stand-alone framework for storing security practices for the ONF","The complete ONF","A subnet of the ONF"],"expth":"Remember, there is a one-to-many ratio of ONF to ANF; each organization has one ONF and many ANFs (one for each application in the organization) Therefore, the ANF is a subset of the ONF"},{"id":288,"q":"Which of the following best describes the Organizational Normative Framework (ONF)?","a":["A set of application security, and best practices, catalogued and leveraged by the organization","A container for components of an application’s security, best practices catalogued and leveraged by the organization","A framework of containers for some of the components of application security, best practices, catalogued and leveraged by the organization","A framework of containers for all components of application security, best practices, catalogued and leveraged by the organization."],"ans":"D","exp":"Option B is incorrect, because it refers to a specific applications security elements, meaning it is about an ANF, not the ONF. C is true, but not as complete as D, making D the better choice. C suggests that the framework contains only “some” of the components, which is why B (which describes “all” components) is better","qth":"Which of the following best describes the Organizational Normative Framework (ONF)?","ath":["Aset of application security, and best practices, catalogued and leveraged by the organization","A container for components of an application's security, best practices catalogued and leveraged by the organization","A framework of containers for some of the components of application security, best practices, catalogued and leveraged by the organization","A framework of containers for all components of application security, best practices, catalogued and leveraged by the organization"],"expth":"Option B is incorrect, because it refers to a specific applications security elements, meaning it is about an ANF, not the ONF. C is true, but not as complete as D, making D the better choice. C suggests that the framework contains only 1€somex€ of the components, which is why B (which describes x€alla€ components) is better"},{"id":289,"q":"Which of the following best describes the purpose and scope of ISO/IEC 27034-1?","a":["Describes international privacy standards for cloud computing","Serves as a newer replacement for NIST 800-52 r4","Provides on overview of network and infrastructure security designed to secure cloud applications.","Provides an overview of application security that introduces definitive concepts, principles, and processes involved in application security."],"ans":"D","exp":"","qth":"Which of the following best describes the purpose and scope of ISO/IEC 27034-1?","ath":["Describes international privacy standards for cloud computing","Serves as a newer replacement for NIST 800-52 14","Provides on overview of network and infrastructure security designed to secure cloud applications","Provides an overview of application security that introduces definitive concepts, principles, and processes involved in application security"],"expth":""},{"id":290,"q":"APIs are defined as which of the following?","a":["A set of protocols, and tools for building software applications to access a web-based software application or tool","A set of routines, standards, protocols, and tools for building software applications to access a web-based software application or tool","A set of standards for building software applications to access a web-based software application or tool","A set of routines and tools for building software applications to access web-based software applications"],"ans":"B","exp":"All the answers are true, but B is the most complete.","qth":"API ถูกนิยามว่าอย่างไร","ath":["ชุดโปรโตคอลและเครื่องมือสำหรับสร้างแอปเพื่อเข้าถึงบริการเว็บ","ชุดรูทีน มาตรฐาน โปรโตคอล และเครื่องมือสำหรับสร้างซอฟต์แวร์แอปพลิเคชัน","ชุดมาตรฐานสำหรับสร้างแอปเพื่อเข้าถึงบริการเว็บ","ชุดรูทีนและเครื่องมือสำหรับสร้างแอปเพื่อเข้าถึงบริการเว็บ"],"expth":"ทุกข้อถูกในระดับหนึ่ง แต่ข้อที่ครบที่สุดคือชุดรูทีน มาตรฐาน โปรโตคอล และเครื่องมือ"},{"id":291,"q":"Which of the following best describes data masking?","a":["A method for creating similar but inauthentic datasets used for software testing and user training.","A method used to protect prying eyes from data such as social security numbers and credit card data.","A method where the last few numbers in a dataset are not obscured. These are often used for authentication.","Data masking involves stripping out all digits in a string of numbers so as to obscure the original number."],"ans":"A","exp":"All of these answers are actually correct, but A is the best answer, because it is the most general, includes the others, and is therefore the optimum choice. This is a good example of the type of question that can appear on the actual exam.","qth":"ข้อใดบรรยาย data masking ได้ดีที่สุด","ath":["วิธีสร้างชุดข้อมูลที่คล้ายของจริงแต่ไม่ใช่ของจริง เพื่อใช้พัฒนา/ทดสอบซอฟต์แวร์","วิธีป้องกันไม่ให้เห็นข้อมูลเช่นเลขประกันสังคม","วิธีที่เลขท้ายไม่กี่หลักยังมองเห็นได้","การลบเลขทุกหลักในสายตัวเลขออก"],"expth":"หลายข้อถูกในแง่หนึ่ง แต่ข้อกว้างที่สุดคือการสร้างชุดข้อมูลจำลองสำหรับพัฒนาซอฟต์แวร์"},{"id":292,"q":"A localized incident or disaster can be addressed in a cost-effective manner by using which of the following?","a":["UPS","Generators","Joint operating agreements","Strict adherence to applicable regulations"],"ans":"C","exp":"Joint operating agreements can provide nearby relocation sites so that a disruption limited to the organization’s own facility and campus can be addressed at a different facility and campus. UPS and generators are not limited to serving needs for localized causes. Regulations do not promote cost savings and are not often the immediate concern during BC/DR activities.","qth":"A localized incident or disaster can be addressed in a cost-effective manner by using which of the following?","ath":["UPS","Generators","Joint operating agreements","Strict adherence to applicable regulations"],"expth":"Joint operating agreements can provide nearby relocation sites so that a disruption limited to the organization's own facility and campus can be addressed at a different facility and campus. UPS and generators are not limited to serving needs for localized causes. Regulations do not promote cost savings and are not often the immediate concern during BC/DR activities"},{"id":293,"q":"In addition to battery backup, a UPS can offer which capability?","a":["Breach alert","Confidentiality","Communication redundancy","Line conditioning"],"ans":"D","exp":"A UPS can provide line conditioning, adjusting power so that it is optimized for the devices it serves and smoothing any power fluctuations; it does not offer any of the other listed functions.","qth":"In addition to battery backup, a UPS can offer which capability?","ath":["Breach alert","Confidentiality","Communication redundancy","Line conditioning"],"expth":"APS can provide line conditioning, adjusting power so that it is optimized for the devices it serves and smoothing any power fluctuations; it does not offer any of the other listed functions"},{"id":294,"q":"For performance purposes, OS monitoring should include all of the following except:","a":["Disk space","Disk I/O usage","CPU usage","Print spooling"],"ans":"D","exp":"Print spooling is not a metric for system performance; all the rest are.","qth":"For performance purposes, OS monitoring should include all of the following except:","ath":["Disk space","Disk I/0 usage","CPU usage","Print spooling"],"expth":"Print spooling is not a metric for system performance; al the rest are"},{"id":295,"q":"Identity and access management (IAM) is a security discipline that ensures which of the following?","a":["That all users are properly authorized","That the right individual gets access to the right resources at the right time for the right reasons.","That all users are properly authenticated","That unauthorized users will get access to the right resources at the right time for the right reasons"],"ans":"B","exp":"Options A and C are also correct, but included in B, making B the best choice. D is incorrect, because we don’t want unauthorized users gaining access.","qth":"Identity and access management (IAM) is a security discipline that ensures which of the following?","ath":["That all users are properly authorized","That the right individual gets access to the right resources at the right time for the right reasons","That all users are properly authenticated","That unauthorized users will get access to the right resources at the right time for the right reasons"],"expth":"Options A and C are also correct, but included in B, making B the best choice. D is incorrect, because we don't want unauthorized users gaining access"},{"id":296,"q":"Maintenance mode requires all of these actions except:","a":["Remove all active production instances","Ensure logging continues","Initiate enhanced security controls","Prevent new logins"],"ans":"C","exp":"While the other answers are all steps in moving from normal operations to maintenance mode, we do not necessarily initiate any enhanced security controls.","qth":"Maintenance mode requires all of these actions except","ath":["Remove all active production instances","Ensure logging continues","initiate enhanced security controls","Prevent new logins"],"expth":"While the other answers are all steps in moving from normal operations to maintenance mode, we do not necessarily initiate any enhanced security controls"},{"id":297,"q":"What is one of the reasons a baseline might be changed?","a":["Numerous change requests","To reduce redundancy","Natural disaster","Power fluctuation"],"ans":"A","exp":"If the CMB is receiving numerous change requests to the point where the amount of requests would drop by modifying the baseline, then that is a good reason to change the baseline. None of the other reasons should involve the baseline at all.","qth":"What is one of the reasons a baseline might be changed?","ath":["Numerous change requests","To reduce redundancy","Natural disaster","Power fluctuation"],"expth":"If the CMB is receiving numerous change requests to the point where the amount of requests would drop by modifying the baseline, then that is a good reason to change the baseline. None of the other reasons should involve the baseline at all"},{"id":298,"q":"In a federated identity arrangement using a trusted third-party model, who is the identity provider and who is the relying party?","a":["The users of the various organizations within the federations within the federation/a CASB","Each member organization/a trusted third party","Each member organization/each member organization","A contracted third party/the various member organizations of the federation"],"ans":"D","exp":"In a trusted third-party model of federation, each member organization outsources the review and approval task to a third party they all trust. This makes the third party the identifier (it issues and manages identities for all users in all organizations in the federation), and the various member organizations are the relying parties (the resource providers that share resources based on approval from the third party).","qth":"In a federated identity arrangement using a trusted third-party model, who is the identity provider and who is the relying party?","ath":["The users of the various organizations within the federations within the federation/a CASB","Each member organization/a trusted third party","Each member organization/each member organization","Acontracted third party/the various member organizations of the federation"],"expth":"In a trusted third-party model of federation, each member organization outsources the review and approval task to a third party they all trust. This makes the third party the identifier (it issues and manages identities for all users in all organizations in the federation), and the various member organizations are the relying parties (the resource providers that share resources based on approval from the third party)"},{"id":299,"q":"Database activity monitoring (DAM) can be:","a":["Host-based or network-based","Server-based or client-based","Used in the place of encryption","Used in place of data masking"],"ans":"A","exp":"We don’t use DAM in place of encryption or masking; DAM augments these options without replacing them. We don’t usually think of the database interaction as client-server, so A is the best answer.","qth":"Database activity monitoring (DAM) can be:","ath":["Host-based or network-based","Server-based or client-based","Used in the place of encryption","Used in place of data masking"],"expth":"We don't use DAM in place of encryption or masking; DAM augments these options without replacing them. We don't usually think of the database interaction as client-server, so Ais the best answer"},{"id":300,"q":"The BC/DR kit should include all of the following except:","a":["Annotated asset inventory","Flashlight","Hard drives","Documentation equipment"],"ans":"C","exp":"While hard drives may be useful in the kit (for instance, if they store BC/DR data such as inventory lists, baselines, and patches), they are not necessarily required. All the other items should be included.","qth":"The BC/DR kit should include all of the following except:","ath":["Annotated asset inventory","Flashlight","Hard drives","Documentation equipment"],"expth":"While hard drives may be useful in the kit (for instance, if they store BC/DR data such as inventory lists, baselines, and patches), they are not necessarily required All the other items should be included"},{"id":301,"q":"Which of the following storage types is most closely associated with a database-type storage implementation?","a":["Object","Unstructured","Volume","Structured"],"ans":"D","exp":"Structured storage involves organized and categorized data, which most closely resembles and operates like a database system would.","qth":"ประเภทพื้นที่เก็บข้อมูลใดต่อไปนี้มีความสัมพันธ์อย่างใกล้ชิดกับการใช้งานพื้นที่เก็บข้อมูลประเภทฐานข้อมูลมากที่สุด","ath":["วัตถุ","ไม่มีโครงสร้าง","ปริมาณ","ไม่มีโครงสร้าง"],"expth":"พื้นที่จัดเก็บที่มีโครงสร้างเกี่ยวข้องกับการจัดระเบียบและจัดหมวดหมู่ข้อมูลที่คล้ายคลึงและดำเนินการอย่างใกล้ชิดที่สุดเหมือนกับระบบฐานข้อมูล"},{"id":302,"q":"Which of the following is the least challenging with regard to eDiscovery in the cloud?","a":["Identifying roles such as data owner, controller and processor","Decentralization of data storage","Forensic analysis","Complexities of International law"],"ans":"C","exp":"Forensic analysis is the least challenging of the answers provided as it refers to the analysis of data once it is obtained. The challenges revolve around obtaining the data for analysis due to the complexities of international law, the decentralization of data storage or difficulty knowing where to look, and identifying the data owner, controller, and processor.","qth":"Which of the following is the least challenging with regard to eDiscovery in the cloud?","ath":["Identifying roles such as data owner, controller and processor","Decentralization of data storage","Forensic analysis","Complexities of International law"],"expth":"Forensic analysis is the least challenging of the answers provided as it refers to the analysis of data once it is obtained. The challenges revolve around obtaining the data for analysis due to the complexities of international law, the decentralization of data storage or difficulty knowing where to look, and identifying the data owner, controller, and processor"},{"id":303,"q":"Which of the following is not a way to manage risk?","a":["Transferring","Accepting","Mitigating","Enveloping"],"ans":"D","exp":"Enveloping is a nonsense term, unrelated to risk management. The rest are not.","qth":"Which of the following is not a way to manage risk?","ath":["Transferring","Accepting","Mitigating","Enveloping"],"expth":"Enveloping is a nonsense term, unrelated to risk management. The rest are not"},{"id":304,"q":"Which of the following is not an example of a highly regulated environment?","a":["Financial services","Healthcare","Public companies","Wholesale or distribution"],"ans":"D","exp":"Wholesalers or distributors are generally not regulated, although the products they sell may be.","qth":"Which of the following is not an example of a highly regulated environment?","ath":["Financial services","Healthcare","Public companies","Wholesale or distribution"],"expth":"Wholesalers or distributors are generally not regulated, although the products they sell may be"},{"id":305,"q":"Which of the following best describes a cloud carrier?","a":["The intermediary who provides connectivity and transport of cloud providers and cloud consumers","A person or entity responsible for making a cloud service available to consumers","The person or entity responsible for transporting data across the Internet","The person or entity responsible for keeping cloud services running for customers"],"ans":"A","exp":"A cloud carrier is the intermediary who provides connectivity and transport of cloud services between cloud providers and cloud customers.","qth":"Which of the following best describes a cloud carrier?","ath":["The intermediary who provides connectivity and transport of cloud providers and cloud consumers","Aperson or entity responsible for making a cloud service available to consumers","The person or entity responsible for transporting data across the Internet","The person or entity responsible for keeping cloud services running for customers"],"expth":"A cloud carrier is the intermediary who provides connectivity and transport of cloud services between cloud providers and cloud customers"},{"id":306,"q":"Which of the following is the dominant driver behind the regulations to which a system or application must adhere?","a":["Data source","Locality","Contract","SLA"],"ans":"B","exp":"The locality--or physical location and jurisdiction where the system or data resides--is the dominant driver of regulations. This may be based on the type of data contained within the application or the way in which the data is used. The contract and SLA both articulate requirements for regulatory compliance and the responsibilities for the cloud provider and cloud customer, but neither artifact defines the actual requirements. Instead, the contract and SLA merely form the official documentation between the cloud provider and cloud customer. The source of the data may place contractual requirements or best practice guidelines on its usage, but ultimately jurisdiction has legal force and greater authority.","qth":"Which of the following is the dominant driver behind the regulations to which a system or application must adhere?","ath":["Data source","Locality","Contract","SLA"],"expth":"The locality-or physical location and jurisdiction where the system or data resides~is the dominant driver of regulations. This may be based on the type of data contained within the application or the way in which the data is used. The contract and SLA both articulate requirements for regulatory compliance and the responsibilities for the cloud provider and cloud customer, but neither artifact defines the actual requirements. Instead, the contract and SLA merely form the official documentation between the cloud provider and cloud customer. The source of the data may place contractual requirements or best practice guidelines on its usage, but ultimately jurisdiction has legal force and greater authority"},{"id":307,"q":"When using a SaaS solution, what is the capability provided to the customer?","a":["To use the provider’s applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), or a program interface. The consumer does manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings.","To use the consumer’s applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), or a program interface. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings.","To use the consumer’s applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), or a program interface. The consumer does manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings.","To use the provider’s applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), or a program interface. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings."],"ans":"D","exp":"According to “The NIST Definition of Cloud Computing,” in SaaS, “The capability provided to the consumer is to use the provider’s applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (e.g., web-based e-mail), or a program interface. The consumer does not manage or control the underlying cloud infrastructure including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings.”","qth":"เมื่อใช้ SaaS ความสามารถที่ลูกค้าได้รับคืออะไร","ath":["ใช้แอปของผู้ให้บริการบนโครงสร้างคลาวด์ แต่ผู้บริโภคควบคุมโครงสร้างพื้นฐานได้","ใช้แอปของผู้บริโภคบนโครงสร้างคลาวด์ โดยผู้บริโภคไม่ควบคุมโครงสร้างพื้นฐาน","ใช้แอปของผู้บริโภคบนโครงสร้างคลาวด์ และผู้บริโภคควบคุมโครงสร้างพื้นฐานได้","ใช้แอปของผู้ให้บริการบนโครงสร้างคลาวด์ โดยผู้บริโภคไม่ควบคุมโครงสร้างพื้นฐาน ยกเว้นการตั้งค่าแอปของผู้ใช้บางส่วน"],"expth":"ตาม NIST ใน SaaS ผู้บริโภคใช้แอปของผู้ให้บริการบนโครงสร้างคลาวด์ และไม่ควบคุมโครงสร้างพื้นฐาน ยกเว้นการตั้งค่าเฉพาะผู้ใช้บางส่วน"}];

let order = BANK.map((_,i)=>i);
let idx = 0;
let examMode = false;
let lang = localStorage.getItem(langKey) || "both";
const state = loadState();

function loadState(){
  try{ return Object.assign({answers:{},flags:{}}, JSON.parse(localStorage.getItem(storeKey)||"{}")); }
  catch(e){ return {answers:{},flags:{}}; }
}
function saveState(){ localStorage.setItem(storeKey, JSON.stringify(state)); }
function ui(){ return lang==="th" ? UI.th : UI.en; }
function showEN(){ return lang==="en" || lang==="both"; }
function showTH(){ return lang==="th" || lang==="both"; }

function applyChrome(){
  const u = ui();
  document.getElementById("title").textContent = u.title;
  document.getElementById("subtitle").textContent = u.subtitle;
  document.getElementById("lblQ").textContent = u.q;
  document.getElementById("lblScore").textContent = u.score;
  document.getElementById("lblAns").textContent = u.ans;
  document.getElementById("lblAcc").textContent = u.acc;
  document.getElementById("lblTr").textContent = u.tr;
  document.getElementById("prevBtn").textContent = u.prev;
  document.getElementById("nextBtn").textContent = u.next;
  document.getElementById("jumpH").textContent = u.jump;
  document.getElementById("exph").textContent = u.expl;
  document.getElementById("keys").textContent = u.keys;
  document.getElementById("shuffleBtn").textContent = u.shuffle;
  document.getElementById("resetBtn").textContent = u.reset;
  document.getElementById("examBtn").textContent = examMode ? u.examOn : u.examOff;
  document.getElementById("disc").textContent = u.disc;
  document.getElementById("langEN").classList.toggle("on", lang==="en");
  document.getElementById("langTH").classList.toggle("on", lang==="th");
  document.getElementById("langBOTH").classList.toggle("on", lang==="both");
}

function currentList(){
  const q = (document.getElementById("search").value||"").toLowerCase().trim();
  const f = document.getElementById("filter").value;
  return order.filter(i=>{
    const item = BANK[i];
    const blob = (item.q+" "+(item.qth||"")+" "+item.a.join(" ")+" "+(item.ath||[]).join(" ")).toLowerCase();
    if(q && !blob.includes(q)) return false;
    const st = state.answers[item.id];
    const flagged = !!state.flags[item.id];
    if(f==="unseen" && st) return false;
    if(f==="flagged" && !flagged) return false;
    if(f==="wrong" && !(st && st.pick!==item.ans)) return false;
    if(f==="right" && !(st && st.pick===item.ans)) return false;
    return true;
  });
}

function render(){
  applyChrome();
  const list = currentList();
  const u = ui();
  const translated = BANK.filter(x=>x.qth).length;
  document.getElementById("trcount").textContent = translated+"/"+BANK.length;
  if(!list.length){
    document.getElementById("qtext").textContent = u.noq;
    document.getElementById("qth").textContent = "";
    document.getElementById("opts").innerHTML = "";
    document.getElementById("explain").classList.remove("show");
    return;
  }
  if(!list.includes(idx)) idx = list[0];
  const item = BANK[idx];
  document.getElementById("pos").textContent = list.indexOf(idx)+1;
  document.getElementById("total").textContent = list.length;
  document.getElementById("qid").textContent = "Q"+item.id+" / "+BANK.length;
  document.getElementById("flagBtn").textContent = state.flags[item.id] ? u.flagOn : u.flagOff;

  const qEl = document.getElementById("qtext");
  const qthEl = document.getElementById("qth");
  if(lang==="th"){
    qEl.textContent = item.qth || item.q;
    qthEl.textContent = item.qth ? "" : u.missing;
  } else if(lang==="en"){
    qEl.textContent = item.q;
    qthEl.textContent = "";
  } else {
    qEl.textContent = item.q;
    qthEl.textContent = item.qth || u.missing;
  }

  const answered = state.answers[item.id];
  const reveal = !!answered && !examMode;
  const opts = document.getElementById("opts");
  opts.innerHTML = "";
  LETTERS.forEach((L,i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    if(answered && answered.pick===L) b.classList.add("selected");
    if(reveal){
      if(L===item.ans) b.classList.add("correct");
      else if(answered.pick===L && L!==item.ans) b.classList.add("wrong");
    }
    const en = item.a[i] || "";
    const tht = (item.ath && item.ath[i]) || "";
    let body = "";
    if(lang==="th"){
      body = '<span class="en">'+escapeHtml(tht || en)+'</span>' +
             (tht? "" : '<span class="th">'+escapeHtml(u.missing)+'</span>');
    } else if(lang==="en"){
      body = '<span class="en">'+escapeHtml(en)+'</span>';
    } else {
      body = '<span class="en">'+escapeHtml(en)+'</span>' +
             (tht? '<span class="th">'+escapeHtml(tht)+'</span>' : '<span class="th">'+escapeHtml(u.missing)+'</span>');
    }
    b.innerHTML = '<span class="letter">'+L+'</span><span class="optbody">'+body+'</span>';
    b.addEventListener("click", ()=>choose(L));
    opts.appendChild(b);
  });

  const expl = document.getElementById("explain");
  if(reveal){
    expl.classList.add("show");
    const ok = answered.pick===item.ans;
    let html = "<p><b>"+(ok?u.correct:u.incorrect)+".</b> "+u.sugg+": <b>"+item.ans+"</b></p>";
    if(showEN()) html += "<p class='exp-en'>"+escapeHtml(item.exp||u.noexp)+"</p>";
    if(showTH()) html += "<p class='exp-th'>"+escapeHtml(item.expth|| (item.exp?u.missing:u.noexp))+"</p>";
    document.getElementById("expbody").innerHTML = html;
  } else expl.classList.remove("show");

  updateStats();
  renderGrid(list);
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function choose(letter){
  state.answers[BANK[idx].id] = {pick:letter};
  saveState(); render();
}
function updateStats(){
  let done=0, right=0;
  BANK.forEach(item=>{
    const st = state.answers[item.id];
    if(st){ done++; if(st.pick===item.ans) right++; }
  });
  document.getElementById("score").textContent = right;
  document.getElementById("answered").textContent = done+"/"+BANK.length;
  document.getElementById("acc").textContent = done? Math.round(right/done*100)+"%" : "—";
  document.getElementById("bar").style.width = (done/BANK.length*100)+"%";
}
function renderGrid(list){
  const g = document.getElementById("grid");
  g.innerHTML = "";
  list.forEach(i=>{
    const item = BANK[i];
    const b = document.createElement("button");
    b.className = "gbtn";
    b.textContent = item.id;
    if(i===idx) b.classList.add("cur");
    const st = state.answers[item.id];
    if(st) b.classList.add(examMode ? "selected" : (st.pick===item.ans?"ok":"no"));
    if(state.flags[item.id]) b.classList.add("flag");
    b.addEventListener("click", ()=>{ idx=i; render(); window.scrollTo({top:0,behavior:"smooth"}); });
    g.appendChild(b);
  });
}
function next(){
  const list = currentList();
  const p = list.indexOf(idx);
  if(p>=0 && p<list.length-1) idx = list[p+1];
  render();
}
function prev(){
  const list = currentList();
  const p = list.indexOf(idx);
  if(p>0) idx = list[p-1];
  render();
}
function setLang(v){
  lang = v;
  localStorage.setItem(langKey, v);
  render();
}

document.getElementById("nextBtn").onclick = next;
document.getElementById("prevBtn").onclick = prev;
document.getElementById("flagBtn").onclick = ()=>{
  const id = BANK[idx].id;
  state.flags[id] = !state.flags[id];
  saveState(); render();
};
document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", ()=>{
  const list = currentList();
  if(list.length) idx = list[0];
  render();
});
document.getElementById("shuffleBtn").onclick = ()=>{
  order = BANK.map((_,i)=>i).sort(()=>Math.random()-0.5);
  idx = order[0]; render();
};
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm(lang==="th" ? "ล้างคำตอบและธงทั้งหมด?" : "Clear all answers and flags?")){
    state.answers={}; state.flags={}; saveState(); render();
  }
};
document.getElementById("examBtn").onclick = function(){
  examMode = !examMode; render();
};
document.getElementById("langEN").onclick = ()=>setLang("en");
document.getElementById("langTH").onclick = ()=>setLang("th");
document.getElementById("langBOTH").onclick = ()=>setLang("both");
document.addEventListener("keydown", e=>{
  if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  const k = e.key.toUpperCase();
  if("ABCD".includes(k)) choose(k);
  if(k==="N" || e.key==="ArrowRight") next();
  if(k==="P" || e.key==="ArrowLeft") prev();
  if(k==="F") document.getElementById("flagBtn").click();
  if(k==="T"){
    setLang(lang==="en" ? "th" : lang==="th" ? "both" : "en");
  }
});

idx = order[0];
render();
</script>
</body>
</html>
