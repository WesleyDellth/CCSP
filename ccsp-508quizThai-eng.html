<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CCSP Practice Quiz — EN / TH</title>
<style>
:root{
  --bg:#0f1419; --bg2:#161d27; --card:#1c2533; --line:#2a3648;
  --text:#e8eef7; --muted:#93a0b5; --accent:#4cc9f0; --accent2:#7c5cff;
  --good:#2ecc71; --bad:#ff5d73; --warn:#ffc857; --chip:#243044; --th:#ffd59a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
button,input,select{font:inherit}
.app{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#081018}
h1{font-size:1.12rem;margin:0}
.sub{color:var(--muted);font-size:.82rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.chip b{color:var(--text);font-weight:650}
.langbar{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:fit-content}
.langbar button{background:var(--bg2);border:0;color:var(--muted);padding:8px 16px;cursor:pointer}
.langbar button.on{background:linear-gradient(135deg,#1e8fb8,#4cc9f0);color:#06202a;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select, .btn{
  background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 12px
}
.toolbar input{min-width:200px;flex:1}
.btn{cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,#1e8fb8,#4cc9f0);color:#06202a;font-weight:700;border:0}
.btn.ghost{background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.82rem}
.qtext{font-size:1.08rem;font-weight:600;margin:0 0 6px;white-space:pre-wrap}
.qth{color:var(--th);font-weight:500;font-size:1rem;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%;color:var(--text)}
.opt:hover{border-color:#4a5d78}
.letter{flex:0 0 28px;height:28px;border-radius:8px;background:#2a3648;display:grid;place-items:center;font-weight:700}
.optbody{flex:1}
.en{display:block}
.th{display:block;color:var(--th);font-size:.95rem;margin-top:3px}
.opt.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--good);background:rgba(46,204,113,.08)}
.opt.correct .letter{background:var(--good);color:#06210f}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.08)}
.opt.wrong .letter{background:var(--bad);color:#2a050c}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:#132033;border:1px solid #2a4a66;display:none}
.explain.show{display:block}
.explain h3{margin:0 0 6px;font-size:.85rem;color:var(--accent)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.progress{height:8px;background:#243044;border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .25s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:16px}
.gbtn{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);cursor:pointer}
.gbtn.cur{outline:2px solid var(--accent)}
.gbtn.ok{background:rgba(46,204,113,.18);color:var(--good);border-color:transparent}
.gbtn.no{background:rgba(255,93,115,.18);color:var(--bad);border-color:transparent}
.gbtn.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.disclaimer{margin-top:22px;color:var(--muted);font-size:.78rem;line-height:1.45}
.k{font-size:.75rem;color:var(--muted)}
.missing{opacity:.85}
.missing .th{color:#c9b08a}
@media (max-width:640px){
  .qtext{font-size:1rem}
  .toolbar input{min-width:0;width:100%}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <h1 id="title">CCSP Practice Quiz</h1>
        <div class="sub" id="subtitle">EN / TH study mode · unofficial question bank</div>
      </div>
    </div>
    <div class="stats">
      <span class="chip"><span id="lblQ">Question</span> <b id="pos">1</b> / <b id="total">0</b></span>
      <span class="chip"><span id="lblScore">Score</span> <b id="score">0</b></span>
      <span class="chip"><span id="lblAns">Answered</span> <b id="answered">0</b></span>
      <span class="chip"><span id="lblAcc">Accuracy</span> <b id="acc">—</b></span>
      <span class="chip"><span id="lblTr">Thai</span> <b id="trcount">0</b></span>
    </div>
  </header>

  <div class="langbar" role="tablist" aria-label="Language">
    <button type="button" id="langEN">English</button>
    <button type="button" id="langTH">ไทย</button>
    <button type="button" id="langBOTH" class="on">ทั้งสอง · Both</button>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="Search / ค้นหา…" />
    <select id="filter">
      <option value="all">All / ทั้งหมด</option>
      <option value="unseen">Unanswered / ยังไม่ตอบ</option>
      <option value="flagged">Flagged / ติดธง</option>
      <option value="wrong">Incorrect / ผิด</option>
      <option value="right">Correct / ถูก</option>
      <option value="thai">Has Thai / มีคำแปล</option>
    </select>
    <button class="btn" id="shuffleBtn">Shuffle</button>
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn" id="examBtn">Exam mode: Off</button>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <section class="card" id="card">
    <div class="qmeta">
      <span id="qid">Q1 · Topic 1</span>
      <span><button class="btn ghost" id="flagBtn">☆ Flag</button></span>
    </div>
    <p class="qtext" id="qtext"></p>
    <p class="qth" id="qth"></p>
    <div class="opts" id="opts"></div>
    <div class="explain" id="explain">
      <h3 id="exph">Explanation / คำอธิบาย</h3>
      <div id="expbody"></div>
    </div>
    <div class="nav">
      <button class="btn" id="prevBtn">← Prev</button>
      <button class="btn primary" id="nextBtn">Next →</button>
      <span class="k" id="keys">Keys: A–D · N next · P prev · F flag · T language</span>
    </div>
  </section>

  <h2 id="jumpH" style="font-size:.95rem;margin:22px 0 8px;color:var(--muted)">Jump to question</h2>
  <div class="grid" id="grid"></div>

  <p class="disclaimer" id="disc"></p>
</div>
<script>
const BANK = [{"id":1,"topic":1,"q":"Which of the following roles is responsible for creating cloud components and the testing and validation of services?","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการสร้างส่วนประกอบระบบคลาวด์ รวมถึงการทดสอบและการตรวจสอบความถูกต้องของบริการ","a":["Cloud auditor","Inter-cloud provider","Cloud service broker","Cloud service developer"],"ath":["ผู้ตรวจสอบระบบคลาวด์","ผู้ให้บริการระหว่างระบบคลาวด์","นายหน้าบริการระบบคลาวด์","ผู้พัฒนาบริการระบบคลาวด์"],"ans":"D","exp":"The cloud service developer is responsible for developing and creating cloud components and services, as well as for testing and validating services","expth":"นักพัฒนาบริการระบบคลาวด์มีหน้าที่รับผิดชอบในการพัฒนาและสร้างส่วนประกอบและบริการระบบคลาวด์ ตลอดจนการทดสอบและการตรวจสอบบริการ"},{"id":2,"topic":1,"q":"What is the best source for information about securing a physical asset's BIOS?","qth":"แหล่งที่ดีที่สุดสำหรับข้อมูลเกี่ยวกับการรักษาความปลอดภัยของ BIOS ของทรัพย์สินทางกายภาพคืออะไร","a":["Security policies","Manual pages","Vendor documentation","Regulations"],"ath":["นโยบายความปลอดภัย","หน้าคู่มือ","เอกสารประกอบของผู้จำหน่าย","ข้อบังคับ"],"ans":"C","exp":"Vendor documentation from the manufacturer of the physical hardware is the best source of best practices for securing the BIOS","expth":"เอกสารของผู้จำหน่ายจากผู้ผลิตฮาร์ดแวร์ทางกายภาพเป็นแหล่งที่ดีที่สุดสำหรับแนวทางปฏิบัติที่ดีที่สุดในการรักษาความปลอดภัยของ BIOS"},{"id":3,"topic":1,"q":"Which of the following is not a component of contractual PII?","qth":"ข้อใดต่อไปนี้ไม่ใช่องค์ประกอบของ PII ตามสัญญา","a":["Scope of processing","Value of data","Location of data","Use of subcontractors"],"ath":["ขอบเขตของการประมวลผล","มูลค่าของข้อมูล","ตำแหน่งของข้อมูล","การใช้ผู้รับเหมาช่วง"],"ans":"B","exp":"The value of data itself has nothing to do with contractual PII. Contractual PII components typically include scope of processing, location of data, use of subcontractors, security controls, return/deletion of data, and audit rights. (Dump listed C; community consensus is B.)","expth":"มูลค่าของข้อมูลนั้นไม่เกี่ยวข้องกับ PII ตามสัญญา โดยทั่วไปส่วนประกอบ PII ตามสัญญาจะรวมถึงขอบเขตของการประมวลผล ตำแหน่งของข้อมูล การใช้ผู้รับเหมาช่วง การควบคุมความปลอดภัย การส่งคืน/การลบข้อมูล และสิทธิ์ในการตรวจสอบ (ดัมพ์อยู่ในรายการ C; ฉันทามติของชุมชนคือ B)"},{"id":4,"topic":1,"q":"Which of the following concepts refers to a cloud customer paying only for the resources and offerings they use within a cloud environment, and only for the duration that they are consuming them?","qth":"แนวคิดใดต่อไปนี้หมายถึงลูกค้าระบบคลาวด์ที่ชำระเงินเฉพาะทรัพยากรและข้อเสนอที่พวกเขาใช้ภายในสภาพแวดล้อมระบบคลาวด์ และเฉพาะตามระยะเวลาที่พวกเขาใช้งานเท่านั้น","a":["Consumable service","Measured service","Billable service","Metered service"],"ath":["บริการแบบสิ้นเปลือง","บริการที่วัดผล","บริการที่เรียกเก็บเงินได้","บริการแบบคิดค่าบริการตามปริมาณข้อมูล"],"ans":"B","exp":"Measured service is where cloud services are delivered and billed in a metered way, where the cloud customer only pays for those that they actually use, and for ‘the duration of time that they use them","expth":"บริการแบบวัดคือที่ที่บริการระบบคลาวด์ถูกส่งมอบและเรียกเก็บเงินในลักษณะแบบคิดค่าบริการตามปริมาณ โดยที่ลูกค้าระบบคลาวด์เท่านั้น จ่ายตามที่พวกเขาใช้จริง และตามระยะเวลาที่พวกเขาใช้งาน"},{"id":5,"topic":1,"q":"Which of the following roles involves testing, monitoring, and securing cloud services for an organization?","qth":"บทบาทใดต่อไปนี้ที่เกี่ยวข้องกับการทดสอบ การตรวจสอบ และการรักษาความปลอดภัยบริการคลาวด์สำหรับองค์กร","a":["Cloud service integrator","Cloud service business manager","Cloud service user","Cloud service administrator"],"ath":["ผู้รวมบริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์","ผู้ใช้บริการคลาวด์","ผู้ดูแลระบบบริการคลาวด์"],"ans":"D","exp":"The cloud service administrator is responsible for testing cloud services, monitoring services, administering security for services, providing usage reports on cloud services, and addressing problem reports","expth":"ผู้ดูแลระบบบริการคลาวด์มีหน้าที่รับผิดชอบในการทดสอบบริการคลาวด์ ตรวจสอบบริการ บริหารจัดการความปลอดภัยสำหรับบริการ จัดทำรายงานการใช้งานบนบริการคลาวด์ และจัดการรายงานปัญหา"},{"id":6,"topic":1,"q":"What is the only data format permitted with the SOAP API?","qth":"รูปแบบข้อมูลเดียวที่อนุญาตให้ใช้กับ SOAP API คืออะไร","a":["HTML","SAML","XSML","XML"],"ath":["HTML","SAML","XSML","XML"],"ans":"D","exp":"The SOAP protocol only supports the XML data format","expth":"โปรโตคอล SOAP รองรับเฉพาะรูปแบบข้อมูล XML เท่านั้น"},{"id":7,"topic":1,"q":"Which data formats are most commonly used with the REST API?","qth":"รูปแบบข้อมูลใดที่ใช้บ่อยที่สุดกับ REST API","a":["JSON and SAML","XML and SAML","XML and JSON","SAML and HTML"],"ath":["JSON และ SAML","XML และ SAML","XML และ JSON","SAML และ HTML"],"ans":"C","exp":"JavaScript Object Notation (JSON) and Extensible Markup Language (XML) are the most commonly used data formats for the Representational State Transfer (REST) API, and are typically implemented with caching for increased scalability and performance","expth":"JavaScript Object Notation (JSON) และ Extensible Markup Language (XML) เป็นรูปแบบข้อมูลที่ใช้บ่อยที่สุดสำหรับ Representational State Transfer (REST) API และโดยทั่วไปจะนำไปใช้กับ แคชเพื่อเพิ่มความสามารถในการขยายและประสิทธิภาพ"},{"id":8,"topic":1,"q":"Which of the following threat types involves an application that does not validate authorization for portions of itself after the initial checks?","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับแอปพลิเคชันที่ไม่ตรวจสอบการอนุญาตสำหรับส่วนของตัวเองหลังจากการตรวจสอบครั้งแรก","a":["Injection","Missing function-level access control","Cross-site request forgery","Cross-site scripting"],"ath":["การฉีด","การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การปลอมแปลงคำขอข้ามไซต์","การเขียนสคริปต์ข้ามไซต์"],"ans":"B","exp":"Itis imperative that an application perform checks when each function or portion of the application is accessed, to ensure that the user is properly authorized to access it. Without continual checks each time a function is accessed, an attacker could forge requests to access portions of the application where authorization has not been granted","expth":"จำเป็นที่แอปพลิเคชันจะต้องตรวจสอบเมื่อมีการเข้าถึงแต่ละฟังก์ชันหรือส่วนของแอปพลิเคชัน เพื่อให้แน่ใจว่าผู้ใช้ ได้รับอนุญาตให้เข้าถึงอย่างถูกต้อง หากไม่มีการตรวจสอบอย่างต่อเนื่องในแต่ละครั้งที่มีการเข้าถึงฟังก์ชัน ผู้โจมตีสามารถปลอมแปลงคำขอเพื่อเข้าถึงบางส่วนของแอปพลิเคชันที่ไม่ได้รับการอนุญาต"},{"id":9,"topic":1,"q":"Which of the following roles involves overseeing billing, purchasing, and requesting audit reports for an organization within a cloud environment?","qth":"บทบาทใดต่อไปนี้ที่เกี่ยวข้องกับการดูแลการเรียกเก็บเงิน การจัดซื้อ และการขอรายงานการตรวจสอบสำหรับองค์กรภายในสภาพแวดล้อมคลาวด์","a":["Cloud service user","Cloud service business manager","Cloud service administrator","Cloud service integrator"],"ath":["ผู้ใช้บริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์","ผู้ดูแลระบบบริการคลาวด์","ผู้รวมบริการคลาวด์"],"ans":"B","exp":"The cloud service business manager is responsible for overseeing business and billing administration, purchasing cloud services, and requesting audit reports when necessary","expth":"ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่รับผิดชอบในการดูแลธุรกิจและการบริหารการเรียกเก็บเงิน การจัดซื้อบริการคลาวด์ และการขอรายงานการตรวจสอบเมื่อจำเป็น"},{"id":10,"topic":1,"q":"What is the biggest concern with hosting a key management system outside of the cloud environment?","qth":"ข้อกังวลที่ใหญ่ที่สุดในการโฮสต์ระบบการจัดการคีย์นอกสภาพแวดล้อมคลาวด์คืออะไร","a":["Confidentiality","Portability","Availability","Integrity"],"ath":["การรักษาความลับ","การพกพา","ความพร้อมใช้งาน","ความสมบูรณ์"],"ans":"C","exp":"When a key management system is outside of the cloud environment hosting the application, availabilty is a primary concern because any access issues with the encryption keys will render the entire application unusable","expth":"เมื่อระบบการจัดการคีย์อยู่นอกสภาพแวดล้อมคลาวด์ที่โฮสต์แอปพลิเคชัน ความพร้อมใช้งานถือเป็นข้อกังวลหลักเนื่องจากปัญหาการเข้าถึงด้วยคีย์การเข้ารหัสจะทำให้แอปพลิเคชันทั้งหมดใช้งานไม่ได้"},{"id":11,"topic":1,"q":"Which of the following approaches would NOT be considered sufficient to meet the requirements of secure data destruction within a cloud environment?","qth":"แนวทางใดต่อไปนี้จะไม่ถือว่าเพียงพอต่อข้อกำหนดในการทำลายข้อมูลที่ปลอดภัยภายในสภาพแวดล้อมคลาวด์","a":["Cryptographic erasure","Zeroing","Overwriting","Deletion"],"ath":["การลบการเข้ารหัสลับ","การทำให้เป็นศูนย์","การเขียนทับ","การลบ"],"ans":"D","exp":"Deletion merely removes the pointers to data on a system; it does nothing to actually remove and sanitize the data. As such, the data remains in a recoverable state, and more secure methods are needed to ensure it has been destroyed and is not recoverable by another party","expth":"การลบเป็นเพียงการลบตัวชี้ไปยังข้อมูลบนระบบเท่านั้น มันไม่ได้ทำอะไรเลยที่จะลบและฆ่าเชื้อข้อมูลจริงๆ ด้วยเหตุนี้ ข้อมูลจึงยังคงอยู่ในสถานะที่สามารถกู้คืนได้ และจำเป็นต้องมีวิธีการที่ปลอดภัยกว่านี้เพื่อให้แน่ใจว่าข้อมูลจะถูกทำลายและไม่สามารถกู้คืนได้โดยบุคคลอื่น"},{"id":12,"topic":1,"q":"Which of the following cloud aspects complicates eDiscovery?","qth":"ลักษณะระบบคลาวด์ข้อใดต่อไปนี้ทำให้ eDiscovery ซับซ้อน","a":["Resource pooling","On-demand self-service","Multitenancy","Measured service"],"ath":["การรวมทรัพยากร","การบริการตนเองตามความต้องการ","การเช่าหลายรายการ","บริการที่วัดผล"],"ans":"C","exp":"With multitenancy, eDiscovery becomes more complicated because the data collection involves extra steps to ensure that only those customers or systems that are within scope are turned over to the requesting authority","expth":"ด้วยการเช่าหลายรายการ eDiscovery จะซับซ้อนมากขึ้นเนื่องจากการรวบรวมข้อมูลเกี่ยวข้องกับขั้นตอนเพิ่มเติมเพื่อให้แน่ใจว่าเฉพาะลูกค้าหรือระบบที่อยู่ภายในขอบเขตเท่านั้นที่จะถูกส่งต่อไปยังหน่วยงานที่ร้องขอ"},{"id":13,"topic":1,"q":"What does the management plane typically utilize to perform administrative functions on the hypervisors that it has access to?","qth":"โดยทั่วไปแล้ว Management Plane จะใช้อะไรเพื่อทำหน้าที่การดูแลระบบบนไฮเปอร์ไวเซอร์ที่สามารถเข้าถึงได้?","a":["Scripts","RDP","APIs","XML"],"ath":["สคริปต์","RDP","APIs","XML"],"ans":"C","exp":"The functions of the management plane are typically exposed as a series of remote calls and function executions and as a set of APIs. These APIs are typically leveraged through either a client or a web portal, with the latter being the most common","expth":"ฟังก์ชันของ Management Plane โดยทั่วไปจะถูกเปิดเผยเป็นชุดของการเรียกระยะไกลและการดำเนินการฟังก์ชัน และเป็นชุดของ API โดยทั่วไปแล้ว API เหล่านี้จะถูกใช้ประโยชน์ผ่านทางไคลเอนต์หรือเว็บพอร์ทัล โดยอย่างหลังจะเป็นแบบที่พบบ่อยที่สุด"},{"id":14,"topic":1,"q":"What is a serious complication an organization faces from the perspective of compliance with international operations?","qth":"ภาวะแทรกซ้อนร้ายแรงที่องค์กรเผชิญจากมุมมองของการปฏิบัติตามการดำเนินงานระหว่างประเทศคืออะไร","a":["Different certifications","Multiple jurisdictions","Different capabilities","Different operational procedures"],"ath":["การรับรองที่แตกต่างกัน","เขตอำนาจศาลหลายแห่ง","ความสามารถที่แตกต่างกัน","ขั้นตอนการปฏิบัติงานที่แตกต่างกัน"],"ans":"B","exp":"When operating within a global framework, a security professional runs into a multitude of jurisdictions and requirements, and many times they might be in contention with one other or not clearly applicable. These requirements can include the location of the users and the type of data they enter into systems, the laws governing the organization that owns the application and any regulatory requirements they may have, as well as the appropriate laws and regulations for the jurisdiction housing the IT resources and where the data is actually stored, which might be multiple jurisdictions as well","expth":"เมื่อปฏิบัติงานภายในกรอบการทำงานระดับโลก ผู้เชี่ยวชาญด้านความปลอดภัยจะต้องพบกับเขตอำนาจศาลและข้อกำหนดมากมาย และหลายครั้งที่พวกเขาอาจขัดแย้งกันเองหรือไม่สามารถนำไปใช้ได้อย่างชัดเจน ข้อกำหนดเหล่านี้อาจรวมถึงตำแหน่งของผู้ใช้และประเภทของข้อมูลที่ผู้ใช้ป้อนเข้าสู่ระบบ กฎหมายที่ควบคุมองค์กรที่เป็นเจ้าของแอปพลิเคชันและข้อกำหนดด้านกฎระเบียบใดๆ ที่ผู้ใช้อาจมี ตลอดจนกฎหมายและข้อบังคับที่เหมาะสมสำหรับเขตอำนาจศาลที่เป็นที่เก็บทรัพยากรด้านไอที และสถานที่ที่ข้อมูลถูกจัดเก็บจริง ซึ่งอาจเป็นเขตอำนาจศาลหลายแห่งเช่นกัน"},{"id":15,"topic":1,"q":"Which networking concept in a cloud environment allows for network segregation and isolation of IP spaces?","qth":"แนวคิดเครือข่ายใดในสภาพแวดล้อมคลาวด์ที่อนุญาตให้มีการแยกเครือข่ายและการแยกพื้นที่ IP","a":["PLAN","WAN","LAN","VLAN"],"ath":["PLAN","WAN","LAN","VLAN"],"ans":"D","exp":"A virtual area network (VLAN) allows the logical separation and isolation of networks and IP spaces to provide enhanced security and controls","expth":"เครือข่ายพื้นที่เสมือน (VLAN) ช่วยให้สามารถแยกและแยกเครือข่ายและพื้นที่ IP เชิงตรรกะเพื่อเพิ่มความปลอดภัยและการควบคุม"},{"id":16,"topic":1,"q":"Which of the following standards primarily pertains to cabling designs and setups in a data center?","qth":"มาตรฐานใดต่อไปนี้เกี่ยวข้องกับการออกแบบและการตั้งค่าสายเคเบิลในศูนย์ข้อมูลเป็นหลัก","a":["IDCA","BICSI","NFPA","Uptime Institute"],"ath":["IDCA","BICSI","NFPA","Uptime Institute"],"ans":"B","exp":"The standards put out by Building Industry Consulting Service International (BICS!) primarily cover complex cabling designs and setups for data centers, but also include specifications on power, energy efficiency, and hot/cold aisle setups","expth":"มาตรฐานที่จัดทำโดย Building Industry Consulting Service International (BICS!) ครอบคลุมการออกแบบและการตั้งค่าสายเคเบิลที่ซับซ้อนสำหรับศูนย์ข้อมูลเป็นหลัก แต่ยังรวมถึงข้อกำหนดด้านพลังงาน ประสิทธิภาพการใช้พลังงาน และการตั้งค่าทางเดินร้อน/เย็น"},{"id":17,"topic":1,"q":"Which of the following publishes the most commonly used standard for data center design in regard to tiers and topologies?","qth":"ข้อใดต่อไปนี้เผยแพร่มาตรฐานที่ใช้บ่อยที่สุดสำหรับการออกแบบศูนย์ข้อมูลในส่วนที่เกี่ยวกับเทียร์และโทโพโลยี","a":["IDCA","Uptime Institute","NFPA","BICSI"],"ath":["IDCA","Uptime Institute","NFPA","BICSI"],"ans":"B","exp":"The Uptime Institute publishes the most commonly used and widely known standard on data center tiers and topologies. It is based on a series of four tiers, with each progressive increase in number representing more stringent, reliable, and redundant systems for security, connectivity, fault tolerance, redundancy, and cooling","expth":"Uptime Institute เผยแพร่มาตรฐานที่ใช้บ่อยที่สุดและเป็นที่รู้จักอย่างกว้างขวางเกี่ยวกับเทียร์และโทโพโลยีของศูนย์ข้อมูล โดยอิงจากชุดข้อมูลสี่ระดับ โดยแต่ละระดับที่เพิ่มขึ้นอย่างต่อเนื่องแสดงถึงระบบที่เข้มงวด เชื่อถือได้ และซ้ำซ้อนมากขึ้นสำหรับการรักษาความปลอดภัย การเชื่อมต่อ การทนต่อข้อผิดพลาด การสำรอง และการระบายความร้อน"},{"id":18,"topic":1,"q":"What type of segregation and separation of resources is needed within a cloud environment for multitenancy purposes versus a traditional data center model?","qth":"การแบ่งแยกและการแยกทรัพยากรประเภทใดเป็นสิ่งจำเป็นภายในสภาพแวดล้อมคลาวด์เพื่อวัตถุประสงค์ในการเช่าหลายเครื่อง เมื่อเทียบกับโมเดลศูนย์ข้อมูลแบบเดิม","a":["Virtual","Security","Physical","Logical"],"ath":["เสมือน","ความปลอดภัย","ทางกายภาพ","ตรรกะ"],"ans":"D","exp":"Cloud environments lack the ability to physically separate resources lke a traditional data center can. To compensate, cloud computing logical segregation concepts are employed. These include VLANs, sandboxing, and the use of virtual network devices such as firewalls","expth":"สภาพแวดล้อมคลาวด์ขาดความสามารถในการแยกทรัพยากรทางกายภาพเหมือนกับที่ศูนย์ข้อมูลแบบเดิมสามารถทำได้ เพื่อชดเชย มีการใช้แนวคิดการแบ่งแยกเชิงตรรกะของการประมวลผลแบบคลาวด์ ซึ่งรวมถึง VLAN, แซนด์บ็อกซ์ และการใช้อุปกรณ์เครือข่ายเสมือน เช่น ไฟร์วอลล์"},{"id":19,"topic":1,"q":"Which United States law is focused on data related to health records and privacy?","qth":"กฎหมายใดของสหรัฐอเมริกาที่มุ่งเน้นไปที่ข้อมูลที่เกี่ยวข้องกับบันทึกด้านสุขภาพและความเป็นส่วนตัว","a":["Safe Harbor","SOX","GLBA","HIPAA"],"ath":["Safe Harbor","SOX","GLBA","HIPAA"],"ans":"D","exp":"The Health Insurance Portability and Accountability Act (HIPAA) requires the U.S. Federal Department of Health and Human Services to publish and enforce regulations pertaining to electronic health records and identifiers between patients, providers, and insurance companies. It is focused on the security controls and confidentiality of medical records, rather than the specific technologies used, so long as they meet the requirements of the regulations","expth":"กฎหมาย Health Insurance Portability and Accountability Act (HIPAA) กำหนดให้กระทรวงสาธารณสุขและบริการมนุษย์แห่งสหรัฐอเมริกาต้องเผยแพร่และบังคับใช้กฎระเบียบที่เกี่ยวข้องกับบันทึกสุขภาพทางอิเล็กทรอนิกส์และตัวระบุระหว่างผู้ป่วย ผู้ให้บริการ และบริษัทประกันภัย โดยมุ่งเน้นไปที่การควบคุมความปลอดภัยและการรักษาความลับของเวชระเบียน มากกว่าเทคโนโลยีเฉพาะที่ใช้ ตราบใดที่เป็นไปตามข้อกำหนดของกฎระเบียบ"},{"id":20,"topic":1,"q":"What is used for local, physical access to hardware within a data center?","qth":"อะไรใช้สำหรับการเข้าถึงฮาร์ดแวร์ภายในเครื่องภายในศูนย์ข้อมูล","a":["SSH","KVM","VPN","RDP"],"ath":["SSH","KVM","VPN","RDP"],"ans":"B","exp":"Local, physical access in a data center is done via KVM (keyboard, video, mouse) switches","expth":"การเข้าถึงทางกายภาพภายในเครื่องในศูนย์ข้อมูลทำได้ผ่านสวิตช์ KVM (คีย์บอร์ด วิดีโอ เมาส์)"},{"id":21,"topic":1,"q":"Within an Infrastructure as a Service model, which of the following would NOT be a measured service?","qth":"ภายในโครงสร้างพื้นฐานในรูปแบบบริการ ข้อใดต่อไปนี้ที่จะไม่ใช่บริการที่วัดผล","a":["CPU","Storage","Number of users","Memory"],"ath":["CPU","พื้นที่เก็บข้อมูล","จำนวนผู้ใช้","หน่วยความจำ"],"ans":"C","exp":"Within laaS, the number of users on a system is not relevant to the particular hosting model in regard to cloud resources. laaS is focused on infrastructure needs of a system or application. Therefore, a factor such as the number of users that could affect licensing requirements, for example, would apply to the SaaS model, or in some instances to PaaS","expth":"ภายใน laaS จำนวนผู้ใช้บนระบบไม่เกี่ยวข้องกับรูปแบบการโฮสต์เฉพาะที่เกี่ยวข้องกับทรัพยากรระบบคลาวด์ laaS มุ่งเน้นไปที่ความต้องการโครงสร้างพื้นฐานของระบบหรือแอปพลิเคชัน ดังนั้น ปัจจัย เช่น จำนวนผู้ใช้ที่อาจส่งผลต่อข้อกำหนดสิทธิ์การใช้งาน เช่น จะนำไปใช้กับโมเดล SaaS หรือในบางกรณีกับ PaaS"},{"id":22,"topic":1,"q":"Which of the following is NOT a criterion for data within the scope of eDiscovery?","qth":"ข้อใดต่อไปนี้ไม่ใช่เกณฑ์สำหรับข้อมูลภายในขอบเขตของ eDiscovery","a":["Possession","Custody","Control","Archive"],"ath":["การครอบครอง","การดูแล","การควบคุม","การเก็บถาวร"],"ans":"D","exp":"eDiscovery pertains to information and data that is in the possession, control, and custody of an organization","expth":"eDiscovery เกี่ยวข้องกับข้อมูลและข้อมูลที่อยู่ในความครอบครอง การควบคุม และการดูแลขององค์กร"},{"id":23,"topic":1,"q":"Which United States law is focused on accounting and financial practices of organizations?","qth":"กฎหมายของสหรัฐอเมริกาข้อใดที่มุ่งเน้นไปที่แนวทางปฏิบัติด้านการบัญชีและการเงินขององค์กร","a":["Safe Harbor","GLBA","SOX","HIPAA"],"ath":["Safe Harbor","GLBA","SOX","HIPAA"],"ans":"C","exp":"The Sarbanes-Oxley (SOX) Act is not an act that pertains to privacy or IT security directly, but rather regulates accounting and financial practices used by organizations. It was passed to protect stakeholders and shareholders from improper practices and errors, and it sets forth rules for compliance, regulated and enforced by the Securities and Exchange Commission (SEC). The main influence on IT systems and operations is the requirements it sets for data retention, specifically in regard to what types of records must be preserved and for how long","expth":"กฎหมาย Sarbanes-Oxley (SOX) ไม่ใช่การกระทำที่เกี่ยวข้องกับความเป็นส่วนตัวหรือความปลอดภัยด้านไอทีโดยตรง แต่ควบคุมแนวทางปฏิบัติด้านการบัญชีและการเงินที่องค์กรใช้ เอกสารดังกล่าวถูกส่งผ่านเพื่อปกป้องผู้มีส่วนได้ส่วนเสียและผู้ถือหุ้นจากการปฏิบัติที่ไม่เหมาะสมและข้อผิดพลาด และได้กำหนดกฎเกณฑ์สำหรับการปฏิบัติตาม ควบคุมและบังคับใช้โดยสำนักงานคณะกรรมการกำกับหลักทรัพย์และตลาดหลักทรัพย์ (SEC) อิทธิพลหลักต่อระบบไอทีและการดำเนินงานคือข้อกำหนดที่ตั้งไว้สำหรับการเก็บรักษาข้อมูล โดยเฉพาะในเรื่องประเภทของบันทึกที่ต้องได้รับการเก็บรักษาและระยะเวลานานเท่าใด"},{"id":24,"topic":1,"q":"What type of masking strategy involves making a separate and distinct copy of data with masking in place?","qth":"กลยุทธ์การมาสก์ประเภทใดที่เกี่ยวข้องกับการสร้างสำเนาข้อมูลแยกต่างหากและแยกกันโดยมีการมาสก์อยู่","a":["Dynamic","Replication","Static","Duplication"],"ath":["ไดนามิก","การจำลองแบบ","แบบคงที่","การทำสำเนา"],"ans":"C","exp":"With static masking, a separate and distinct copy of the data set is created with masking in place. This is typically done through a script or other process that takes a standard data set, processes it to mask the appropriate and predefined fields, and then outputs the data set as a new one with the completed masking done","expth":"ด้วยการมาสก์แบบคงที่ สำเนาชุดข้อมูลที่แยกจากกันและชัดเจนจะถูกสร้างขึ้นโดยมีการปิดบังไว้ โดยทั่วไปจะทำผ่านสคริปต์หรือกระบวนการอื่นๆ ที่ใช้ชุดข้อมูลมาตรฐาน ประมวลผลเพื่อมาสก์ฟิลด์ที่เหมาะสมและกำหนดไว้ล่วงหน้า จากนั้นจึงส่งออกชุดข้อมูลเป็นชุดใหม่โดยทำการมาสก์เสร็จสมบูรณ์แล้ว"},{"id":25,"topic":1,"q":"Which of the following storage types is most closely associated with a database-type storage implementation?","qth":"ประเภทพื้นที่เก็บข้อมูลใดต่อไปนี้มีความสัมพันธ์อย่างใกล้ชิดกับการใช้งานพื้นที่เก็บข้อมูลประเภทฐานข้อมูลมากที่สุด","a":["Object","Unstructured","Volume","Structured"],"ath":["วัตถุ","ไม่มีโครงสร้าง","ปริมาณ","มีโครงสร้าง"],"ans":"D","exp":"Structured storage involves organized and categorized data, which most closely resembles and operates like a database system would","expth":"พื้นที่จัดเก็บที่มีโครงสร้างเกี่ยวข้องกับการจัดระเบียบและจัดหมวดหมู่ข้อมูลที่คล้ายคลึงและดำเนินการอย่างใกล้ชิดที่สุดเหมือนกับระบบฐานข้อมูล"},{"id":26,"topic":1,"q":"Which of the following roles is responsible for overseeing customer relationships and the processing of financial transactions?","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการดูแลความสัมพันธ์กับลูกค้าและการประมวลผลธุรกรรมทางการเงิน","a":["Cloud service manager","Cloud service deployment","Cloud service business manager","Cloud service operations manager"],"ath":["ผู้จัดการบริการคลาวด์","การปรับใช้บริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์","ผู้จัดการฝ่ายปฏิบัติการบริการคลาวด์"],"ans":"C","exp":"The cloud service business manager is responsible for overseeing business plans and customer relationships as well as processing financial transactions","expth":"ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่รับผิดชอบในการดูแลแผนธุรกิจและความสัมพันธ์กับลูกค้าตลอดจนการประมวลผลธุรกรรมทางการเงิน"},{"id":27,"topic":1,"q":"Which protocol does the REST API depend on?","qth":"REST API ขึ้นอยู่กับโปรโตคอลใด","a":["HTTP","XML","SAML","SSH"],"ath":["HTTP","XML","SAML","SSH"],"ans":"A","exp":"Representational State Transfer (REST) is a software architectural scheme that applies the components, connectors, and data conduits for many web applications used on the Internet. It uses and relies on the HTTP protocol and supports a variety of data formats","expth":"Representational State Transfer (REST) ​​คือโครงร่างสถาปัตยกรรมซอฟต์แวร์ที่ใช้ส่วนประกอบ ตัวเชื่อมต่อ และท่อร้อยสายข้อมูลสำหรับแอปพลิเคชันเว็บจำนวนมากที่ใช้บนอินเทอร์เน็ต ใช้และอาศัยโปรโตคอล HTTP และรองรับรูปแบบข้อมูลที่หลากหลาย"},{"id":28,"topic":1,"q":"Which United States program was designed to enable organizations to bridge the gap between privacy laws and requirements of the United States and the European Union?","qth":"โปรแกรมใดของสหรัฐอเมริกาที่ได้รับการออกแบบมาเพื่อช่วยให้องค์กรต่างๆ สามารถเชื่อมช่องว่างระหว่างกฎหมายความเป็นส่วนตัวและข้อกำหนดของสหรัฐอเมริกาและสหภาพยุโรปได้","a":["GLBA","HIPAA","Safe Harbor","SOX"],"ath":["GLBA","HIPAA","Safe Harbor","SOX"],"ans":"C","exp":"Due to the lack of an adequate privacy law or protection at the federal level in the United States, European privacy regulations generally prohibit the exporting or sharing of Pll from Europe with the United States. Participation in the Safe Harbor program is voluntary on behalf of an organization, but it does require them to conform to specific requirements and policies that mirror those from the EU. Thus, organizations can fulfill requirements for data sharing and export and possibly serve customers in the EU","expth":"เนื่องจากขาดกฎหมายความเป็นส่วนตัวที่เพียงพอหรือการคุ้มครองในระดับรัฐบาลกลางในสหรัฐอเมริกา โดยทั่วไปกฎระเบียบด้านความเป็นส่วนตัวของยุโรปจะห้ามการส่งออกหรือการแบ่งปัน Pll จากยุโรปกับสหรัฐอเมริกา การเข้าร่วมในโครงการ Safe Harbor เป็นไปโดยสมัครใจในนามขององค์กร แต่กำหนดให้ต้องปฏิบัติตามข้อกำหนดและนโยบายเฉพาะที่สะท้อนข้อกำหนดและนโยบายจากสหภาพยุโรป ดังนั้นองค์กรจึงสามารถปฏิบัติตามข้อกำหนดสำหรับการแบ่งปันข้อมูลและการส่งออก และอาจให้บริการลูกค้าในสหภาพยุโรปได้"},{"id":29,"topic":1,"q":"What is the biggest benefit to leasing space in a data center versus building or maintain your own?","qth":"ประโยชน์ที่ใหญ่ที่สุดของการเช่าพื้นที่ในศูนย์ข้อมูลเทียบกับการสร้างหรือบำรุงรักษาของคุณเองคืออะไร","a":["Certification","Costs","Regulation","Control"],"ath":["การรับรอง","ต้นทุน","กฎระเบียบ","การควบคุม"],"ans":"B","exp":"When leasing space in a data center, an organization can avoid the enormous startup and building costs associated with a data center, and can instead leverage economies of scale by grouping with other organizations and sharing costs","expth":"เมื่อเช่าพื้นที่ในศูนย์ข้อมูล องค์กรสามารถหลีกเลี่ยงต้นทุนการเริ่มต้นและการสร้างอันมหาศาลที่เกี่ยวข้องกับศูนย์ข้อมูล และสามารถใช้ประโยชน์จากการประหยัดจากขนาดโดยการจัดกลุ่มกับองค์กรอื่นและแบ่งปันต้นทุนแทน"},{"id":30,"topic":1,"q":"Which of the following security measures done at the network layer in a traditional data center are also applicable to a cloud environment?","qth":"มาตรการรักษาความปลอดภัยใดต่อไปนี้ที่ทำที่เลเยอร์เครือข่ายในศูนย์ข้อมูลแบบเดิมที่สามารถใช้ได้กับสภาพแวดล้อมระบบคลาวด์ด้วย?","a":["Dedicated switches","Trust zones","Redundant network circuits","Direct connections"],"ath":["สวิตช์เฉพาะ","โซนความน่าเชื่อถือ","วงจรเครือข่ายสำรอง","การเชื่อมต่อโดยตรง"],"ans":"B","exp":"Trust zones can be implemented to separate systems or tiers along logical lines for great security and access controls. Each zone can then have its own security controls and monitoring based on its particular needs","expth":"โซนความเชื่อถือสามารถนำมาใช้เพื่อแยกระบบหรือระดับตามสายลอจิคัลเพื่อความปลอดภัยและการควบคุมการเข้าถึงที่ยอดเยี่ยม แต่ละโซนจะมีการควบคุมความปลอดภัยและการตรวจติดตามตามความต้องการเฉพาะของตนเองได้"},{"id":31,"topic":1,"q":"Which aspect of cloud computing will be most negatively impacted by vendor lock-in?","qth":"แง่มุมใดของการประมวลผลแบบคลาวด์ที่จะได้รับผลกระทบทางลบมากที่สุดจากการล็อคอินของผู้ขาย","a":["Elasticity","Reversibility","Interoperability","Portability"],"ath":["ความยืดหยุ่น","การย้อนกลับได้","การทำงานร่วมกัน","การพกพา"],"ans":"D","exp":"A cloud customer utilizing proprietary APIs or services from one cloud provider that are unlikely to be available from another cloud provider will most negatively impact portability","expth":"ลูกค้าคลาวด์ที่ใช้ API หรือบริการที่เป็นกรรมสิทธิ์จากผู้ให้บริการคลาวด์รายหนึ่งซึ่งไม่น่าจะพร้อมใช้งานจากผู้ให้บริการคลาวด์รายอื่นจะส่งผลเสียต่อความสามารถในการพกพามากที่สุด"},{"id":32,"topic":1,"q":"Which of the following APIs are most commonly used within a cloud environment?","qth":"API ใดต่อไปนี้ที่ใช้บ่อยที่สุดภายในสภาพแวดล้อมระบบคลาวด์","a":["REST and SAML","SOAP and REST","REST and XML","XML and SAML"],"ath":["REST และ SAML","SOAP และ REST","REST และ XML","XML และ SAML"],"ans":"B","exp":"Simple Object Access Protocol (SOAP) and Representational State Transfer (REST) are the most commonly used APIs within a cloud environment. Extensible Markup Language (XML) and Security Assertion Markup Language (SAML) are both standards for exchanging encoded data between two parties, with XML being for more general use and SAML focused on authentication and authorization data","expth":"Simple Object Access Protocol (SOAP) และ Representational State Transfer (REST) ​​เป็น API ที่ใช้บ่อยที่สุดภายในสภาพแวดล้อมระบบคลาวด์ Extensible Markup Language (XML) และ Security Assertion Markup Language (SAML) เป็นทั้งมาตรฐานสำหรับการแลกเปลี่ยนข้อมูลที่เข้ารหัสระหว่างสองฝ่าย โดยที่ XML นั้นมีไว้สำหรับการใช้งานทั่วไปมากกว่า และ SAML จะเน้นที่ข้อมูลการตรวจสอบสิทธิ์และการอนุญาต"},{"id":33,"topic":1,"q":"Which of the following attempts to establish an international standard for eDiscovery processes and best practices?","qth":"ความพยายามใดต่อไปนี้เพื่อสร้างมาตรฐานสากลสำหรับกระบวนการ eDiscovery และแนวปฏิบัติที่ดีที่สุด?","a":["ISO/IEC 31000","ISO/IEC 27050","ISO/IEC 19888","ISO/IEC 27001"],"ath":["ISO/IEC 31000","ISO/IEC 27050","ISO/IEC 19888","ISO/IEC 27001"],"ans":"B","exp":"ISO/IEC 27050 strives to establish an internationally accepted standard for eDiscovery processes and best practices. It encompasses all steps of the eDiscovery process: identification, preservation, collection, processing, review, analysis, and the final production of the requested data","expth":"ISO/IEC 27050 มุ่งมั่นที่จะสร้างมาตรฐานที่เป็นที่ยอมรับในระดับสากล สำหรับกระบวนการ eDiscovery และแนวปฏิบัติที่ดีที่สุด โดยครอบคลุมทุกขั้นตอนของกระบวนการ eDiscovery: การระบุ การเก็บรักษา การรวบรวม การประมวลผล การทบทวน การวิเคราะห์ และการผลิตขั้นสุดท้ายของข้อมูลที่ร้องขอ"},{"id":34,"topic":1,"q":"Which of the following roles is responsible for obtaining new customers and securing contracts and agreements?","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการรับลูกค้าใหม่และการรักษาสัญญาและข้อตกลง","a":["Inter-cloud provider","Cloud service broker","Cloud auditor","Cloud service developer"],"ath":["ผู้ให้บริการระหว่างคลาวด์","นายหน้าบริการคลาวด์","ผู้ตรวจสอบระบบคลาวด์","นักพัฒนาบริการระบบคลาวด์"],"ans":"B","exp":"The cloud service broker is responsible for obtaining new customers, analyzing the marketplace, and securing contracts and agreements","expth":"นายหน้าบริการระบบคลาวด์มีหน้าที่รับผิดชอบในการรับลูกค้าใหม่ การวิเคราะห์ตลาด และการรักษาความปลอดภัยสัญญาและข้อตกลง"},{"id":35,"topic":1,"q":"Which term relates to the application of scientific methods and practices to evidence?","qth":"คำใดที่เกี่ยวข้องกับการประยุกต์ใช้วิธีการและแนวปฏิบัติทางวิทยาศาสตร์กับหลักฐาน","a":["Forensics","Methodical","Theoretical","Measured"],"ath":["นิติวิทยาศาสตร์","ระเบียบวิธี","เชิงทฤษฎี","วัดผล"],"ans":"A","exp":"Forensics is the application of scientific and methodical processes to identify, collect, preserve, analyze, and summarize/report digital information and evidence","expth":"นิติวิทยาศาสตร์คือการประยุกต์ใช้กระบวนการทางวิทยาศาสตร์และระเบียบวิธีเพื่อระบุ รวบรวม เก็บรักษา วิเคราะห์ และสรุป/รายงานข้อมูลและหลักฐานดิจิทัล"},{"id":36,"topic":1,"q":"Which of the following roles involves the provisioning and delivery of cloud services?","qth":"บทบาทใดต่อไปนี้เกี่ยวข้องกับการจัดเตรียมและการส่งมอบบริการคลาวด์","a":["Cloud service deployment manager","Cloud service business manager","Cloud service manager","Cloud service operations manager"],"ath":["ตัวจัดการการปรับใช้บริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์","ผู้จัดการบริการคลาวด์","ผู้จัดการฝ่ายปฏิบัติการบริการคลาวด์"],"ans":"C","exp":"The cloud service manager is responsible for the delivery of cloud services, the provisioning of cloud services, and the overall management of cloud services","expth":"ผู้จัดการบริการคลาวด์มีหน้าที่รับผิดชอบในการส่งมอบบริการคลาวด์ การจัดเตรียมบริการคลาวด์ และการจัดการโดยรวมของบริการคลาวด์"},{"id":37,"topic":1,"q":"What is the primary reason that makes resolving jurisdictional conflicts complicated?","qth":"อะไรคือสาเหตุหลักที่ทำให้การแก้ไขข้อขัดแย้งในเขตอำนาจศาลมีความซับซ้อน","a":["Different technology standards","Costs","Language barriers","Lack of international authority"],"ath":["มาตรฐานเทคโนโลยีที่แตกต่างกัน","ต้นทุน","อุปสรรคทางภาษา","การขาดอำนาจระหว่างประเทศ"],"ans":"D","exp":"With international operations, systems ultimately cross many jurisdictional boundaries, and many times, they conflict with each other. The major hurdle to overcome for an organization is the lack of an ultimate international authority to mediate such conflicts, with a likely result of legal efforts in each jurisdiction","expth":"ด้วยการดำเนินงานระหว่างประเทศ ในที่สุดระบบก็ข้ามขอบเขตเขตอำนาจศาลจำนวนมาก และหลายครั้งที่ขัดแย้งกันเอง อุปสรรคสำคัญที่ต้องเอาชนะสำหรับองค์กรคือการขาดอำนาจระหว่างประเทศขั้นสูงสุดในการไกล่เกลี่ยข้อขัดแย้งดังกล่าว โดยน่าจะเป็นผลมาจากความพยายามทางกฎหมายในแต่ละเขตอำนาจศาล"},{"id":38,"topic":1,"q":"GAAPs are created and maintained by which organization?","qth":"GAAP ถูกสร้างและดูแลโดยองค์กรใด","a":["ISO/IEC","AICPA","PCI Council","ISO"],"ath":["ISO/IEC","AICPA","สภา PCI","ISO"],"ans":"B","exp":"The AICPA is the organization responsible for generating and maintaining what are the Generally Accepted Accounting Practices in the United States","expth":"AICPA เป็นองค์กรที่รับผิดชอบในการสร้างและรักษาแนวทางปฏิบัติทางการบัญชีที่ยอมรับโดยทั่วไปในสหรัฐอเมริกา"},{"id":39,"topic":1,"q":"Which of the following roles is responsible for preparing systems for the cloud, administering and monitoring services, and managing inventory and assets?","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการเตรียมระบบสำหรับคลาวด์ การดูแลระบบและการตรวจสอบบริการ และการจัดการสินค้าคงคลังและสินทรัพย์","a":["Cloud service business manager","Cloud service deployment manager","Cloud service operations manager","Cloud service manager"],"ath":["ผู้จัดการธุรกิจบริการคลาวด์","ตัวจัดการการปรับใช้บริการคลาวด์","ผู้จัดการฝ่ายปฏิบัติการของบริการคลาวด์","ผู้จัดการฝ่ายบริการคลาวด์"],"ans":"C","exp":"The cloud service operations manager is responsible for preparing systems for the cloud, administering and monitoring services, providing audit data as requested or required, and managing inventory and assets","expth":"ผู้จัดการฝ่ายปฏิบัติการของบริการคลาวด์มีหน้าที่รับผิดชอบในการเตรียมระบบสำหรับคลาวด์ การดูแลระบบและการตรวจสอบบริการ การให้ข้อมูลการตรวจสอบตามที่ร้องขอหรือจำเป็น และการจัดการสินค้าคงคลังและสินทรัพย์"},{"id":40,"topic":1,"q":"Which protocol allows a system to use block-level storage as if it was a SAN, but over TCP network traffic instead?","qth":"โปรโตคอลใดอนุญาตให้ระบบใช้ที่เก็บข้อมูลระดับบล็อกราวกับว่าเป็น SAN แต่ใช้การรับส่งข้อมูลเครือข่าย TCP แทน?","a":["SATA","iSCSI","TLS","SCSI"],"ath":["SATA","iSCSI","TLS","SCSI"],"ans":"B","exp":"iSCSlis a protocol that allows for the transmission and use of SCSI commands and features over a TCP-based network. iSCSI allows systems to use block-level storage that looks and behaves as a SAN would with physical servers, but to leverage the TCP network within a virtualized environment and cloud","expth":"iSCSเป็นโปรโตคอลที่อนุญาตให้มีการส่งและการใช้คำสั่งและคุณสมบัติ SCSI บนเครือข่ายที่ใช้ TCP iSCSI อนุญาตให้ระบบใช้ที่เก็บข้อมูลระดับบล็อกที่ดูและทำงานเหมือนกับ SAN กับเซิร์ฟเวอร์จริง แต่เพื่อใช้ประโยชน์จากเครือข่าย TCP ภายในสภาพแวดล้อมเสมือนจริงและระบบคลาวด์"},{"id":41,"topic":1,"q":"Which of the cloud deployment models is used by popular services such as iCloud, Dropbox, and OneDrive?","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดที่ใช้บริการยอดนิยม เช่น iCloud, Dropbox และ OneDrive","a":["Hybrid","Public","Private","Community"],"ath":["ไฮบริด","สาธารณะ","ส่วนตัว","ชุมชน"],"ans":"B","exp":"Popular services such as iCloud, Dropbox, and OneDrive are all publicly available and are open to any user for free, with possible add-on services offered for a cost","expth":"บริการยอดนิยม เช่น iCloud, Dropbox และ OneDrive ล้วนเผยแพร่สู่สาธารณะและเปิดให้ผู้ใช้ทุกคนใช้งานได้ฟรี โดยมีบริการเสริมที่เป็นไปได้โดยมีค่าใช้จ่าย"},{"id":42,"topic":1,"q":"Why does a Type 2 hypervisor typically offer less security control than a Type 1 hypervisor?","qth":"เหตุใดไฮเปอร์ไวเซอร์ Type 2 จึงเสนอการควบคุมความปลอดภัยน้อยกว่าไฮเปอร์ไวเซอร์ Type 1?","a":["A Type 2 hypervisor runs on top of another operating system and is dependent on the security of the OS for its own security","A Type 2 hypervisor allows users to directly perform some functions with their own access","A Type 2 hypervisor is open source, so attackers can more easily find exploitable vulnerabilities with that access","A Type 2 hypervisor is always exposed to the public Internet for federated identity access"],"ath":["ไฮเปอร์ไวเซอร์ Type 2 ทำงานบนระบบปฏิบัติการอื่นและขึ้นอยู่กับความปลอดภัยของระบบปฏิบัติการเพื่อความปลอดภัยของตัวเอง","ไฮเปอร์ไวเซอร์ Type 2 อนุญาตให้ผู้ใช้ดำเนินการฟังก์ชันบางอย่างได้โดยตรงด้วยการเข้าถึงของตนเอง","ไฮเปอร์ไวเซอร์ Type 2 เป็นโอเพ่นซอร์ส ดังนั้นผู้โจมตีจึงสามารถค้นหาช่องโหว่ที่สามารถใช้ประโยชน์ได้ง่ายกว่าด้วยสิ่งนั้น การเข้าถึง","ไฮเปอร์ไวเซอร์ประเภท 2 จะถูกเปิดเผยต่ออินเทอร์เน็ตสาธารณะเสมอสำหรับการเข้าถึงข้อมูลประจำตัวแบบรวมศูนย์"],"ans":"A","exp":"A Type 2 hypervisor differs from a Type 1 hypervisor in that it runs on top of another operating system rather than directly tied into the underlying hardware of the virtual host servers. With this type of implementation, additional security and architecture concerns come into play because the interaction between the operating system and the hypervisor becomes a critical link. The hypervisor no longer has direct interaction and control over the underlying hardware, which means that some performance will be lost due to the operating system in the middle needing its own resources, patching requirements, and operational oversight","expth":"ไฮเปอร์ไวเซอร์ประเภท 2 แตกต่างจากไฮเปอร์ไวเซอร์ประเภท 1 ตรงที่มันจะทำงานบนระบบปฏิบัติการอื่น แทนที่จะเชื่อมโยงโดยตรงกับฮาร์ดแวร์พื้นฐานของเซิร์ฟเวอร์โฮสต์เสมือน ด้วยการใช้งานประเภทนี้ ข้อกังวลด้านความปลอดภัยและสถาปัตยกรรมเพิ่มเติมเข้ามามีบทบาท เนื่องจากการโต้ตอบระหว่างระบบปฏิบัติการและไฮเปอร์ไวเซอร์กลายเป็นจุดเชื่อมโยงที่สำคัญ ไฮเปอร์ไวเซอร์ไม่มีการโต้ตอบและควบคุมฮาร์ดแวร์ที่เกี่ยวข้องโดยตรงอีกต่อไป ซึ่งหมายความว่าประสิทธิภาพบางส่วนจะหายไปเนื่องจากระบบปฏิบัติการตรงกลางต้องการทรัพยากรของตัวเอง ข้อกำหนดในการแพตช์ และการควบคุมการปฏิบัติงาน"},{"id":43,"topic":1,"q":"Which is the appropriate phase of the cloud data lifecycle for determining the data’ classification?","qth":"ช่วงใดคือช่วงที่เหมาะสมสำหรับวงจรการใช้งานข้อมูลบนคลาวด์ในการพิจารณาการจัดประเภทข้อมูล","a":["Create","Use","Share","Store"],"ath":["สร้าง","ใช้","แบ่งปัน","จัดเก็บ"],"ans":"A","exp":"Any time data is created, modified, or imported, the classification needs to be evaluated and set from the earliest phase to ensure security is always properly maintained for the duration of its lifecycle","expth":"ทุกครั้งที่มีการสร้าง แก้ไข หรือนำเข้าข้อมูล การจัดประเภทจะต้องได้รับการประเมินและตั้งค่าตั้งแต่ระยะแรกสุดเพื่อให้แน่ใจว่าการรักษาความปลอดภัยจะได้รับการดูแลอย่างเหมาะสมตลอดระยะเวลาของวงจรการใช้งาน"},{"id":44,"topic":1,"q":"Which of the following is the optimal temperature for a data center, per the guidelines established by the America Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE)?","qth":"ข้อใดต่อไปนี้คืออุณหภูมิที่เหมาะสมที่สุดสำหรับศูนย์ข้อมูล ตามหลักเกณฑ์ที่กำหนดโดย America Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE)?","a":["69.8-86.0degF (21-30degC)","64.4-80.6degF(18-27degC)","51.8-66.2degF(11-19degC)","44.6-60-8degF(7-16degC)"],"ath":["69.8-86.0degF (21-30degC)","64.4-80.6degF(18-27degC)","51.8-66.2degF(11-19degC)","44.6-60-8degF(7-16degC)"],"ans":"B","exp":"The guidelines from ASHRAE establish 64.4-80.6degF (18-27degC) as the optimal temperature for a data center","expth":"แนวทางปฏิบัติจาก ASHRAE จัดทำขึ้น 64.4-80.6degF (18-27degC) เป็นอุณหภูมิที่เหมาะสมที่สุดสำหรับศูนย์ข้อมูล"},{"id":45,"topic":1,"q":"Which of the following is not a risk management framework?","qth":"ข้อใดต่อไปนี้ไม่ใช่กรอบการบริหารความเสี่ยง","a":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"ath":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"ans":"B","exp":"Hex GBL is a reference to a computer part in Terry Pratchett's fictional Discworld universe. The rest are not","expth":"Hex GBL เป็นการอ้างอิงถึงชิ้นส่วนคอมพิวเตอร์ในจักรวาล Discworld ของ Terry Pratchett ส่วนที่เหลือไม่ได้"},{"id":46,"topic":1,"q":"Which of the following threat types involves the sending of untrusted data to a user's browser to be executed with their own credentials and access?","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับการส่งข้อมูลที่ไม่น่าเชื่อถือไปยังเบราว์เซอร์ของผู้ใช้เพื่อดำเนินการด้วยข้อมูลประจำตัวและการเข้าถึงของตนเอง","a":["Missing function level access control","Cross-site scripting (ERE)","Cross-site request forgery","Injection"],"ath":["การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การเขียนสคริปต์ข้ามไซต์ (ERE)","การปลอมแปลงคำขอข้ามไซต์","การฉีด"],"ans":"B","exp":"Cross-site scripting (XSS) is an attack where a malicious actor is able to send untrusted data to a user's browser without going through any validation or sanitization processes, or where the code is not properly escaped from processing by the browser. The code is then executed on the user's browser with the user's own access and permissions, allowing an attackerto redirect their web traffic, steal data from their session, or potentially access information on the user's own computer that their browser has the ability to access","expth":"การเขียนสคริปต์ข้ามไซต์ (XSS) คือการโจมตีที่มีผู้ประสงค์ร้าย สามารถส่งข้อมูลที่ไม่น่าเชื่อถือไปยังเบราว์เซอร์ของผู้ใช้โดยไม่ต้องผ่านกระบวนการตรวจสอบหรือฆ่าเชื้อใดๆ หรือในกรณีที่เบราว์เซอร์ไม่สามารถหลบหนีโค้ดจากการประมวลผลได้อย่างถูกต้อง จากนั้นโค้ดจะถูกดำเนินการบนเบราว์เซอร์ของผู้ใช้ด้วยการเข้าถึงและการอนุญาตของผู้ใช้เอง ทำให้ผู้โจมตีเปลี่ยนเส้นทางการรับส่งข้อมูลเว็บ ขโมยข้อมูลจากเซสชัน หรืออาจเข้าถึงข้อมูลบนคอมพิวเตอร์ของผู้ใช้เองที่เบราว์เซอร์ของพวกเขาสามารถเข้าถึงได้"},{"id":47,"topic":1,"q":"How is an object stored within an object storage system?","qth":"อ็อบเจ็กต์ถูกจัดเก็บภายในระบบหน่วยเก็บข้อมูลอ็อบเจ็กต์อย่างไร","a":["Key value","Database","LDAP","Tree structure"],"ath":["ค่าคีย์","ฐานข้อมูล","LDAP","โครงสร้างต้นไม้"],"ans":"A","exp":"Object storage uses a flat structure with key values to store and access objects","expth":"หน่วยเก็บข้อมูลอ็อบเจ็กต์ใช้โครงสร้างแบบเรียบที่มีค่าคีย์เพื่อจัดเก็บและเข้าถึงอ็อบเจ็กต์"},{"id":48,"topic":1,"q":"Which of the following is NOT a regulatory system from the United States federal government?","qth":"ข้อใดต่อไปนี้ไม่ใช่ระบบการกำกับดูแลจากรัฐบาลกลางของสหรัฐอเมริกา","a":["PCI DSS","FISMA","SOX","HIPAA"],"ath":["PCI DSS","FISMA","SOX","HIPAA"],"ans":"A","exp":"The payment card industry data security standard (PCI DSS) pertains to organizations that handle credit card transactions and is an industry regulatory standard, not a governmental one","expth":"มาตรฐานความปลอดภัยข้อมูลอุตสาหกรรมบัตรชำระเงิน (PCI DSS) เกี่ยวข้องกับองค์กรที่จัดการธุรกรรมบัตรเครดิตและเป็นมาตรฐานการกำกับดูแลอุตสาหกรรม ไม่ใช่ของภาครัฐ"},{"id":49,"topic":1,"q":"Which jurisdiction lacks specific and comprehensive privacy laws at a national or top level of legal authority?","qth":"เขตอำนาจศาลใดขาดกฎหมายความเป็นส่วนตัวที่เฉพาะเจาะจงและครอบคลุมในหน่วยงานทางกฎหมายระดับชาติหรือระดับสูง","a":["European Union","Germany","Russia","United States"],"ath":["สหภาพยุโรป","เยอรมนี","รัสเซีย","สหรัฐอเมริกา"],"ans":"D","exp":"The United States lacks a single comprehensive law at the federal level addressing data security and privacy, but there are multiple federal laws that","expth":"สหรัฐอเมริกาขาดกฎหมายที่ครอบคลุมเพียงฉบับเดียวในระดับรัฐบาลกลางที่เกี่ยวข้องกับความปลอดภัยของข้อมูลและความเป็นส่วนตัว แต่มีกฎหมายของรัฐบาลกลางหลายฉบับที่"},{"id":50,"topic":1,"q":"Which United States law is focused on Pll as it relates to the financial industry?","qth":"กฎหมายใดของสหรัฐอเมริกาที่เน้นไปที่ Pll ที่เกี่ยวข้องกับอุตสาหกรรมการเงิน","a":["HIPAA","SOX","Safe Harbor","GLBA"],"ath":["HIPAA","SOX","Safe Harbor","GLBA"],"ans":"D","exp":"The GLBA, as it is commonly called based on the lead sponsors and authors of the act, is officially known as \"The Financial Modernization Act of 1999.\" It is specifically focused on Pll as it relates to financial institutions. There are three specific components of it, covering various areas and use, on top of a general requirement that all financial institutions must provide all users and customers with a written copy of their privacy policies and practices, including with whom and for what reasons their information may be shared with other entities","expth":"GLBA ตามปกติเรียกตามผู้สนับสนุนหลักและผู้ประพันธ์กฎหมายนี้ มีชื่ออย่างเป็นทางการในชื่อ \"The Financial Modernization Act of 1999\" มีการเน้นไปที่ Pll โดยเฉพาะเนื่องจากเกี่ยวข้องกับสถาบันการเงิน มีองค์ประกอบเฉพาะสามส่วน ซึ่งครอบคลุมพื้นที่และการใช้งานต่างๆ นอกเหนือจากข้อกำหนดทั่วไปที่สถาบันการเงินทุกแห่งต้องจัดเตรียมสำเนานโยบายและแนวปฏิบัติด้านความเป็นส่วนตัวของผู้ใช้และลูกค้าทั้งหมด รวมถึงใครและด้วยเหตุใดข้อมูลของพวกเขาจึงอาจถูกแบ่งปันกับหน่วยงานอื่น ๆ"},{"id":51,"topic":1,"q":"Which of the following threat types can occur when encryption is not properly applied or insecure transport mechanisms are used?","qth":"ภัยคุกคามประเภทใดต่อไปนี้ที่สามารถเกิดขึ้นได้เมื่อการเข้ารหัสไม่ได้ใช้อย่างเหมาะสม หรือใช้กลไกการขนส่งที่ไม่ปลอดภัย?","a":["Security misconfiguration","Insecure direct object references","Sensitive data exposure","Unvalidated redirects and forwards"],"ath":["การกำหนดค่าความปลอดภัยผิดพลาด","การอ้างอิงวัตถุโดยตรงที่ไม่ปลอดภัย","การเปิดเผยข้อมูลที่ละเอียดอ่อน","การเปลี่ยนเส้นทางและการส่งต่อที่ไม่ได้รับการตรวจสอบ"],"ans":"C","exp":"Sensitive data exposure occurs when information is not properly secured through encryption and secure transport mechanisms; it can quickly become an easy and broad method for attackers to compromise information. Web applications must enforce strong encryption and security controls on the application side, but secure methods of communications with browsers or other clients used to access the information are also required. Security misconfiguration occurs when applications and systems are not properly configured for security, often a result of misapplied or inadequate baselines. Insecure direct object references occur when code references aspects of the infrastructure, especially internal or private systems, and an attacker can use that knowledge to glean more information about the infrastru","expth":"การเปิดเผยข้อมูลที่ละเอียดอ่อนเกิดขึ้นเมื่อข้อมูลไม่ได้รับการรักษาความปลอดภัยอย่างเหมาะสมผ่านการเข้ารหัสและกลไกการขนส่งที่ปลอดภัย มันสามารถกลายเป็นวิธีการที่ง่ายและกว้างขวางสำหรับผู้โจมตีในการโจมตีข้อมูลได้อย่างรวดเร็ว แอปพลิเคชันเว็บจะต้องบังคับใช้การเข้ารหัสที่รัดกุมและการควบคุมความปลอดภัยในด้านแอปพลิเคชัน แต่จำเป็นต้องใช้วิธีการสื่อสารกับเบราว์เซอร์หรือไคลเอนต์อื่น ๆ ที่ใช้ในการเข้าถึงข้อมูลอย่างปลอดภัยด้วย การกำหนดค่าความปลอดภัยที่ไม่ถูกต้องเกิดขึ้นเมื่อแอปพลิเคชันและระบบไม่ได้รับการกำหนดค่าเพื่อความปลอดภัยอย่างเหมาะสม ซึ่งมักเป็นผลมาจากการใช้งานที่ไม่ถูกต้องหรือพื้นฐานที่ไม่เพียงพอ การอ้างอิงออบเจ็กต์โดยตรงที่ไม่ปลอดภัยเกิดขึ้นเมื่อโค้ดอ้างอิงแง่มุมต่างๆ ของโครงสร้างพื้นฐาน โดยเฉพาะระบบภายในหรือส่วนตัว และผู้โจมตีสามารถใช้ความรู้นั้นเพื่อรวบรวมข้อมูลเพิ่มเติมเกี่ยวกับโครงสร้างพื้นฐาน"},{"id":52,"topic":1,"q":"What is the best approach for dealing with services or utlities that are installed on a system but not needed to perform their desired function?","qth":"วิธีที่ดีที่สุดในการจัดการกับบริการหรือโปรแกรมอรรถประโยชน์ที่ติดตั้งบนระบบแต่ไม่จำเป็นเพื่อทำหน้าที่ที่ต้องการคืออะไร?","a":["Remove","Monitor","Disable","Stop"],"ath":["ลบ","จอภาพ","ปิดการใช้งาน","หยุด"],"ans":"A","exp":"The best practice is to totally remove any unneeded services and utilities on a system to prevent any chance of compromise of use. If they are just disabled, itis possible for them to be inadvertently started again at any point, or another exploit could be used to start them again. Removing also negates the need to patch and maintain them going forward","expth":"แนวทางปฏิบัติที่ดีที่สุดคือการลบบริการและยูทิลิตี้ที่ไม่จำเป็นใด ๆ บนระบบออกทั้งหมด เพื่อป้องกันโอกาสที่จะประนีประนอมในการใช้งาน หากพวกเขาเพิ่งปิดการใช้งาน ก็เป็นไปได้ที่พวกเขาจะเริ่มต้นใหม่อีกครั้งโดยไม่ได้ตั้งใจเมื่อใดก็ได้ หรืออาจใช้ช่องโหว่อื่นเพื่อเริ่มต้นใหม่อีกครั้ง การลบออกยังทำให้ไม่จำเป็นต้องแพตช์และดูแลรักษาไว้ข้างหน้าอีกด้วย"},{"id":53,"topic":1,"q":"Which of the following actions will NOT make data part of the \"create\" phase of the cloud data lifecycle?","qth":"การดำเนินการใดต่อไปนี้จะไม่ทำให้ข้อมูลเป็นส่วนหนึ่งของระยะ \"สร้าง\" ของวงจรการใช้งานข้อมูลบนคลาวด์","a":["Modifying metadata","Importing data","Modifying data","Constructing new data"],"ath":["การแก้ไขข้อมูลเมตา","การนำเข้าข้อมูล","การแก้ไขข้อมูล","การสร้างข้อมูลใหม่"],"ans":"A","exp":"Although the initial phase is called “create,” it can also refer to modification. In essence, any time data is considered \"new itis in the create phase. This can come from data that is newly created, data that is imported into a system and is new to that system, or data that is already present and modified into a new form or value Modifying the metadata does not change the actual data","expth":"แม้ว่าระยะเริ่มต้นจะเรียกว่า “สร้าง” แต่ก็สามารถหมายถึงการแก้ไขได้เช่นกัน โดยพื้นฐานแล้วข้อมูลใดๆ ก็ตามถือเป็น “ข้อมูลใหม่ในระยะสร้าง” ซึ่งอาจมาจากข้อมูลที่สร้างขึ้นใหม่ ข้อมูลที่นำเข้ามาในระบบและเป็นข้อมูลใหม่ในระบบนั้น หรือข้อมูลที่มีอยู่แล้วและแก้ไขเป็นรูปแบบหรือค่าใหม่ การแก้ไขเมตาดาต้าไม่ทำให้ข้อมูลจริงเปลี่ยนแปลง"},{"id":54,"topic":1,"q":"What are the two protocols that TLS uses?","qth":"สองโปรโตคอลที่ TLS ใช้คืออะไร","a":["Handshake and record","Transport and initiate","Handshake and transport","Record and transmit"],"ath":["จับมือกันและบันทึก","ขนส่งและเริ่มต้น","จับมือและขนส่ง","บันทึกและส่ง"],"ans":"A","exp":"TLS uses the handshake protocol to establish and negotiate the TLS connection, and it uses the record protocol for the secure transmission of data","expth":"TLS ใช้โปรโตคอลจับมือเพื่อสร้างและเจรจาการเชื่อมต่อ TLS และใช้โปรโตคอลบันทึกสำหรับการส่งข้อมูลอย่างปลอดภัย"},{"id":55,"topic":1,"q":"Which type of cloud model typically presents the most challenges to a cloud customer during the \"destroy\" phase of the cloud data lifecycle?","qth":"โมเดลคลาวด์ประเภทใดที่มักนำเสนอความท้าทายมากที่สุดแก่ลูกค้าคลาวด์ในระหว่างระยะ \"ทำลาย\" ของวงจรการใช้งานข้อมูลบนคลาวด์","a":["laaS","DaaS","Saas","PaaS"],"ath":["laaS","DaaS","Saas","PaaS"],"ans":"C","exp":"With many SaaS implementations, data is not isolated to a particular customer but rather is part of the overall application. When it comes to data destruction, a particular challenge is ensuring that all of a customer's data is completely destroyed while not impacting the data of other customers","expth":"ด้วยการใช้งาน SaaS จำนวนมาก ข้อมูลจะไม่ถูกแยกให้กับลูกค้ารายใดรายหนึ่ง แต่เป็นส่วนหนึ่งของแอปพลิเคชันโดยรวม เมื่อพูดถึงการทำลายข้อมูล ความท้าทายเฉพาะก็คือการทำให้แน่ใจว่าข้อมูลทั้งหมดของลูกค้าจะถูกทำลายอย่างสมบูรณ์ โดยไม่ส่งผลกระทบต่อข้อมูลของลูกค้ารายอื่น"},{"id":56,"topic":1,"q":"Which of the following may unilaterally deem a cloud hosting model inappropriate for a system or application?","qth":"ข้อใดต่อไปนี้อาจถือว่าโมเดลโฮสติ้งบนคลาวด์ไม่เหมาะสมสำหรับระบบหรือแอปพลิเคชันฝ่ายเดียว","a":["Multitenancy","Certification","Regulation","Virtualization"],"ath":["การเช่าหลายรายการ","การรับรอง","กฎระเบียบ","การจำลองเสมือน"],"ans":"C","exp":"Some regulations may require specific security controls or certifications be used for hosting certain types of data or functions, and in some circumstances they may be requirements that are unable to be met by any cloud provider","expth":"กฎระเบียบบางประการอาจต้องมีการควบคุมความปลอดภัยหรือการรับรองเฉพาะเพื่อใช้ในการโฮสต์ข้อมูลหรือฟังก์ชันบางประเภท และในบางกรณีอาจเป็นข้อกำหนดที่ผู้ให้บริการระบบคลาวด์รายใดไม่สามารถตอบสนองได้"},{"id":57,"topic":1,"q":"Which of the following is considered an internal redundancy for a data center?","qth":"ข้อใดต่อไปนี้ถือเป็นความซ้ำซ้อนภายในสำหรับศูนย์ข้อมูล","a":["Power distribution units","Network circuits","Power substations","Generators"],"ath":["หน่วยจ่ายไฟ","วงจรเครือข่าย","สถานีไฟฟ้าย่อย","เครื่องกำเนิดไฟฟ้า"],"ans":"A","exp":"Power distribution units are internal to a data center and supply power to internal components such as racks, appliances, and cooling systems. As such, they are considered an internal redundancy","expth":"หน่วยจ่ายไฟอยู่ภายในศูนย์ข้อมูลและจ่ายพลังงานให้กับส่วนประกอบภายใน เช่น ชั้นวาง เครื่องใช้ไฟฟ้า และระบบทำความเย็น ดังนั้นจึงถือเป็นความซ้ำซ้อนภายใน"},{"id":58,"topic":1,"q":"Which of the following represents a control on the maximum amount of resources that a single customer, virtual machine, or application can consume within a cloud environment?","qth":"ข้อใดต่อไปนี้แสดงถึงการควบคุมจำนวนทรัพยากรสูงสุดที่ลูกค้า เครื่องเสมือน หรือแอปพลิเคชันรายเดียวสามารถใช้ได้ภายในสภาพแวดล้อมคลาวด์","a":["Share","Reservation","Provision","Limit"],"ath":["แบ่งปัน","การจอง","การเตรียมการ","ขีดจำกัด"],"ans":"D","exp":"Limits are put in place to enforce a maximum on the amount of memory or processing a cloud customer can use. This can be done either on a virtual machine or as a comprehensive whole for a customer, and is meant to ensure that enormous cloud resources cannot be allocated or consumed by a single host or customer to the detriment of other hosts and customers","expth":"ขีดจำกัดถูกบังคับใช้เพื่อบังคับใช้จำนวนสูงสุดกับจำนวนหน่วยความจำหรือการประมวลผลที่ลูกค้าบนคลาวด์สามารถใช้ได้ ซึ่งสามารถทำได้ทั้งบนเครื่องเสมือนหรือทั้งหมดสำหรับลูกค้า และมีวัตถุประสงค์เพื่อให้แน่ใจว่าทรัพยากรคลาวด์จำนวนมหาศาลไม่สามารถจัดสรรหรือใช้โดยโฮสต์หรือลูกค้ารายเดียว ส่งผลเสียต่อโฮสต์และลูกค้าอื่นๆ"},{"id":59,"topic":1,"q":"Which of the following roles is responsible for peering with other cloud services and providers?","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการเพียร์กับบริการคลาวด์และผู้ให้บริการอื่น ๆ","a":["Cloud auditor","Inter-cloud provider","Cloud service broker","Cloud service developer"],"ath":["ผู้ตรวจสอบคลาวด์","ผู้ให้บริการระหว่างคลาวด์","นายหน้าบริการคลาวด์","ผู้พัฒนาบริการคลาวด์"],"ans":"B","exp":"The inter-cloud provider is responsible for peering with other cloud services and providers, as well as overseeing and managing federations and federated services,","expth":"ผู้ให้บริการระหว่างคลาวด์มีหน้าที่รับผิดชอบในการเพียร์กับบริการคลาวด์และผู้ให้บริการอื่น ๆ เช่นเดียวกับการดูแลและจัดการสหพันธรัฐและบริการแบบรวมศูนย์"},{"id":60,"topic":1,"q":"Which of the following does NOT relate to the hiding of sensitive data from data sets?","qth":"ข้อใดต่อไปนี้ไม่เกี่ยวข้องกับการซ่อนข้อมูลที่ละเอียดอ่อนจากชุดข้อมูล","a":["Obfuscation","Federation","Masking","Anonymization"],"ath":["การสร้างความสับสน","สหพันธรัฐ","การมาสก์","การลบข้อมูลระบุตัวตน"],"ans":"B","exp":"Federation pertains to authenticating systems between different organizations","expth":"สหพันธรัฐเกี่ยวข้องกับการรับรองความถูกต้องของระบบระหว่างองค์กรที่แตกต่างกัน"},{"id":61,"topic":1,"q":"Which of the following are the storage types associated with laaS?","qth":"ประเภทพื้นที่จัดเก็บข้อมูลใดต่อไปนี้ที่เกี่ยวข้องกับ laaS?","a":["Volume and object","Volume and label","Volume and container","Object and target"],"ath":["ปริมาตรและวัตถุ","ปริมาตรและป้ายกำกับ","ปริมาตรและคอนเทนเนอร์","วัตถุและเป้าหมาย"],"ans":"A","exp":"","expth":""},{"id":62,"topic":1,"q":"Which technology can be useful during the \"share\" phase of the cloud data lifecycle to continue to protect data as it leaves the original system and security controls?","qth":"เทคโนโลยีใดที่มีประโยชน์ในระหว่างระยะ \"แบ่งปัน\" ของวงจรการใช้งานข้อมูลบนคลาวด์เพื่อปกป้องข้อมูลต่อไปเมื่อออกจากระบบเดิมและการควบคุมความปลอดภัย","a":["IPS","WAF","DLP","IDS"],"ath":["IPS","WAF","DLP","IDS"],"ans":"C","exp":"Data loss prevention (DLP) can be applied to data that is leaving the security enclave to continue to enforce access restrictions and policies on other clients and systems","expth":"การป้องกันข้อมูลสูญหาย (DLP) สามารถนำไปใช้กับข้อมูลที่ออกจากขอบเขตการรักษาความปลอดภัยเพื่อบังคับใช้ข้อจำกัดและนโยบายการเข้าถึงบนไคลเอนต์และระบบอื่น ๆ ต่อไป"},{"id":63,"topic":1,"q":"Which of the following storage types is most closely associated with a traditional file system and tree structure?","qth":"พื้นที่จัดเก็บข้อมูลประเภทใดต่อไปนี้มีความเกี่ยวข้องอย่างใกล้ชิดที่สุดกับระบบไฟล์และโครงสร้างแบบต้นไม้แบบดั้งเดิมมากที่สุด?","a":["Volume","Unstructured","Object","Structured"],"ath":["ไดรฟ์ข้อมูล","ไม่มีโครงสร้าง","วัตถุ","มีโครงสร้าง"],"ans":"A","exp":"Volume storage works as a virtual hard drive that is attached to a virtual machine. The operating system sees the volume the same as how a traditional drive on a physical server would be seen","expth":"พื้นที่จัดเก็บไดรฟ์ข้อมูลทำงานเป็นฮาร์ดไดรฟ์เสมือนที่เชื่อมต่อกับเครื่องเสมือน ระบบปฏิบัติการจะเห็นไดรฟ์ข้อมูลเหมือนกับที่จะเห็นไดรฟ์แบบเดิมบนเซิร์ฟเวอร์จริง"},{"id":64,"topic":1,"q":"Which of the following represents a prioritization of applications or cloud customers for the allocation of additional requested resources when there is a limitation on available resources?","qth":"ข้อใดต่อไปนี้แสดงถึงการจัดลำดับความสำคัญของแอปพลิเคชันหรือลูกค้าระบบคลาวด์สำหรับการจัดสรรทรัพยากรที่ร้องขอเพิ่มเติมเมื่อมีข้อจำกัดเกี่ยวกับทรัพยากรที่มีอยู่","a":["Provision","Limit","Reservation (ENE","Share"],"ath":["การจัดเตรียม","ขีดจำกัด","การจอง (ENE","แบ่งปัน"],"ans":"D","exp":"The concept of shares within a cloud environment is used to mitigate and control the request for resource allocations from customers that the environment may not have the current capability to allow. Shares work by prioritizing hosts within a cloud environment through a weighting system that is defined by the cloud provider. When periods of high utilization and allocation are reached, the system automatically uses scoring of each host based on its share value to determine which hosts get access to the limited resources still available. The higher the value a particular host has, the more resources it will be allowed to utilize","expth":"แนวคิดของการแชร์ภายในสภาพแวดล้อมระบบคลาวด์ถูกนำมาใช้เพื่อลดและควบคุมคำขอสำหรับการจัดสรรทรัพยากรจากลูกค้าที่สภาพแวดล้อมอาจไม่มีความสามารถในปัจจุบัน อนุญาต การแชร์ทำงานโดยการจัดลำดับความสำคัญของโฮสต์ภายในสภาพแวดล้อมคลาวด์ผ่านระบบการถ่วงน้ำหนักที่กำหนดโดยผู้ให้บริการคลาวด์ เมื่อถึงช่วงการใช้งานและการจัดสรรที่สูง ระบบจะใช้การให้คะแนนของแต่ละโฮสต์โดยอัตโนมัติตามมูลค่าการแบ่งปันเพื่อกำหนดว่าโฮสต์ใดที่ยังคงสามารถเข้าถึงทรัพยากรที่จำกัดได้"},{"id":65,"topic":1,"q":"Which type of audit report does many cloud providers use to instill confidence in their policies, practices, and procedures to current and potential customers?","qth":"รายงานการตรวจสอบประเภทใดที่ผู้ให้บริการระบบคลาวด์จำนวนมากใช้เพื่อปลูกฝังความมั่นใจในนโยบาย แนวทางปฏิบัติ และขั้นตอนต่างๆ ให้กับลูกค้าปัจจุบันและผู้ที่มีแนวโน้มจะเป็นลูกค้า","a":["SAS-70","SOC2","Soc1","SOX"],"ath":["SAS-70","SOC2","Soc1","SOX"],"ans":"B","exp":"One approach that many cloud providers opt to take is to undergo a SOC 2 audit and make the report available to cloud customers and potential cloud customers as a way of providing security confidence without having to open their systems or sensitive information to the masses","expth":"แนวทางหนึ่งที่ผู้ให้บริการระบบคลาวด์หลายรายเลือกใช้คือการได้รับการตรวจสอบ SOC 2 และจัดทำรายงานให้แก่ลูกค้าระบบคลาวด์และลูกค้าระบบคลาวด์ในอนาคต ซึ่งเป็นวิธีการหนึ่งในการสร้างความมั่นใจด้านความปลอดภัยโดยไม่ต้องมี เพื่อเปิดระบบหรือข้อมูลที่ละเอียดอ่อนของตนสู่มวลชน"},{"id":66,"topic":1,"q":"Which of the following statements accurately describes VLANs?","qth":"ข้อความใดต่อไปนี้อธิบาย VLAN ได้อย่างถูกต้อง","a":["They ate not restricted to the same data center or the same racks","They are not restricted to the name rack but restricted to the same data center","They are restricted to the same racks and data centers","They are not restricted to the same rack but restricted to same switches"],"ath":["พวกมันกินไม่ถูกจำกัดไว้ที่ศูนย์ข้อมูลเดียวกันหรือแร็คเดียวกัน","พวกมันไม่ได้จำกัดอยู่ที่แร็คชื่อ แต่ถูกจำกัดไว้ที่ศูนย์ข้อมูลเดียวกัน","พวกมันถูกจำกัดไว้ที่แร็คและศูนย์ข้อมูลเดียวกัน","พวกมันไม่ได้จำกัดอยู่ที่แร็คเดียวกัน แต่ถูกจำกัดอยู่ที่สวิตช์เดียวกัน"],"ans":"A","exp":"A virtual area network (VLAN) can span any networks within a data center, or it can span across different physical locations and data centers","expth":"พื้นที่เสมือน เครือข่าย (VLAN) สามารถขยายเครือข่ายใดๆ ภายในศูนย์ข้อมูล หรืออาจขยายข้ามสถานที่ตั้งทางกายภาพและศูนย์ข้อมูลต่างๆ ก็ได้"},{"id":67,"topic":1,"q":"What must be secured on physical hardware to prevent unauthorized access to systems?","qth":"อะไรที่ต้องได้รับการรักษาความปลอดภัยบนฮาร์ดแวร์กายภาพเพื่อป้องกันการเข้าถึงระบบโดยไม่ได้รับอนุญาต","a":["BIOS","SSH","RDP","ALOM"],"ath":["BIOS","SSH","RDP","ALOM"],"ans":"A","exp":"BIOS is the firmware that governs the physical initiation and boot up of a piece of hardware. If it is compromised, an attacker could have access to hosted systems and make configurations changes to expose or disable some security elements on the system","expth":"BIOS คือเฟิร์มแวร์ที่ควบคุมการเริ่มต้นทางกายภาพและการบูตชิ้นส่วนของฮาร์ดแวร์ หากถูกบุกรุก ผู้โจมตีอาจสามารถเข้าถึงระบบที่โฮสต์และทำการเปลี่ยนแปลงการกำหนดค่าเพื่อแสดงหรือปิดใช้งานองค์ประกอบความปลอดภัยบางอย่างบนระบบ"},{"id":68,"topic":1,"q":"What type of Pll is regulated based on the type of application or per the conditions of the specific hosting agreement?","qth":"Pll ประเภทใดที่ได้รับการควบคุมตามประเภทของแอปพลิเคชันหรือตามเงื่อนไขของข้อตกลงโฮสติ้งเฉพาะ","a":["Specific","Contractual","regulated","Jurisdictional"],"ath":["เฉพาะ","ตามสัญญา","ได้รับการควบคุม","เขตอำนาจศาล"],"ans":"B","exp":"Contractual Pll has specific requirements for the handling of sensitive and personal information, as defined at a contractual level. These specific requirements wil typically document the required handling procedures and policies to","expth":"Contractual Pll มีข้อกำหนดเฉพาะสำหรับการจัดการข้อมูลที่ละเอียดอ่อนและข้อมูลส่วนบุคคล ตามที่กำหนดไว้ในระดับสัญญา ข้อกำหนดเฉพาะเหล่านี้โดยทั่วไปจะจัดทำเอกสารขั้นตอนการจัดการและนโยบายที่จำเป็นไว้"},{"id":69,"topic":1,"q":"Which of the following security technologies is commonly used to give administrators access into trust zones within an environment?","qth":"เทคโนโลยีความปลอดภัยใดต่อไปนี้ที่ใช้โดยทั่วไปเพื่อให้ผู้ดูแลระบบสามารถเข้าถึงโซนที่เชื่อถือได้ภายในสภาพแวดล้อม","a":["VPN","WAF","IPSec","HTTPS"],"ath":["VPN","WAF","IPSec","HTTPS"],"ans":"A","exp":"Virtual private networks (VPNs) are commonly used to allow access into trust zones. Via a VPN, access can be controlled and logged and only allowed through secure channels by authorized users. It also adds an additional layer of encryption and protection to communications","expth":"เครือข่ายส่วนตัวเสมือน (VPN) มักใช้เพื่ออนุญาตการเข้าถึงโซนที่เชื่อถือได้ ผ่าน VPN สามารถควบคุมและบันทึกการเข้าถึงและอนุญาตผ่านช่องทางที่ปลอดภัยโดยผู้ใช้ที่ได้รับอนุญาตเท่านั้น นอกจากนี้ยังเพิ่มการเข้ารหัสและการป้องกันการสื่อสารอีกชั้นหนึ่ง"},{"id":70,"topic":1,"q":"Which concept BEST describes the capability for a cloud environment to automatically scale a system or application, based on its current resource demands?","qth":"แนวคิดใดอธิบายความสามารถที่ดีที่สุดสำหรับสภาพแวดล้อมคลาวด์ในการปรับขนาดระบบหรือแอปพลิเคชันโดยอัตโนมัติตามความต้องการทรัพยากรในปัจจุบัน","a":["On-demand self-service","Resource pooling","Measured service","Rapid elasticity"],"ath":["การบริการตนเองตามความต้องการ","การรวมทรัพยากร","บริการที่วัดผล","ความยืดหยุ่นอย่างรวดเร็ว"],"ans":"D","exp":"Rapid elasticity allows a cloud environment to automatically add or remove resources to or from a system or application based on its current demands. Whereas a traditional data center model would require standby hardware and substantial effort to add resources in response to load increases, a cloud environment can easily and rapidly expand to meet resources demands, so long as the application is properly implemented for it","expth":"ความยืดหยุ่นอย่างรวดเร็วทำให้สภาพแวดล้อมคลาวด์สามารถเพิ่มหรือลบทรัพยากรเข้าหรือออกจากระบบหรือแอปพลิเคชันโดยอัตโนมัติตามความต้องการในปัจจุบัน ในขณะที่โมเดลศูนย์ข้อมูลแบบดั้งเดิมจะต้องใช้ฮาร์ดแวร์สแตนด์บายและความพยายามอย่างมากในการเพิ่มทรัพยากรเพื่อตอบสนองต่อโหลดที่เพิ่มขึ้น สภาพแวดล้อมระบบคลาวด์สามารถขยายได้อย่างง่ายดายและรวดเร็วเพื่อตอบสนองความต้องการทรัพยากร ตราบใดที่แอปพลิเคชันได้รับการติดตั้งอย่างเหมาะสม"},{"id":71,"topic":1,"q":"If you're using iSCSI in a cloud environment, what must come from an external protocol or application?","qth":"หากคุณใช้ iSCSI ในสภาพแวดล้อมคลาวด์ สิ่งที่ต้องมาจากโปรโตคอลหรือแอปพลิเคชันภายนอก","a":["Kerberos support","CHAP support","Authentication","Encryption"],"ath":["การสนับสนุน Kerberos","การสนับสนุน CHAP","การรับรองความถูกต้อง","การเข้ารหัส"],"ans":"D","exp":"iSCSI does not natively support encryption, so another technology such as IPsec must be used to encrypt communications","expth":"iSCSI ไม่สนับสนุนการเข้ารหัสโดยกำเนิด ดังนั้นเทคโนโลยีอื่น เช่น IPsec จึงต้องใช้ในการเข้ารหัสการสื่อสาร"},{"id":72,"topic":1,"q":"Which of the following pertains to a macro level approach to data center design rather than the traditional tiered approach to data centers?","qth":"ข้อใดต่อไปนี้เกี่ยวข้องกับแนวทางระดับมหภาคในการออกแบบศูนย์ข้อมูลมากกว่าแนวทางแบบลำดับชั้นแบบดั้งเดิมสำหรับศูนย์ข้อมูล","a":["IDCA","NFPA","BICSI","Uptime Institute"],"ath":["IDCA","NFPA","BICSI","Uptime Institute"],"ans":"A","exp":"The standards put out by the International Data Center Authority (IDCA) have established the Infinity Paradigm, which is intended to be a comprehensive data center design and operations framework. The Infinity Paradigm shifts away from many models that rely on tiered architecture for data centers, where each successive tier increases redundancy. Instead, it emphasizes data centers being approached at a macro level, without a specific and isolated focus on certain aspects to achieve tier status","expth":"มาตรฐานที่ออกโดย International Data Center Authority (IDCA) ได้กำหนด Infinity Paradigm ซึ่งมีวัตถุประสงค์เพื่อเป็นกรอบการออกแบบศูนย์ข้อมูลและการดำเนินงานที่ครอบคลุม Infinity Paradigm เปลี่ยนจากโมเดลจำนวนมากที่ต้องอาศัยสถาปัตยกรรมแบบลำดับชั้นสำหรับศูนย์ข้อมูล ซึ่งแต่ละระดับที่ต่อเนื่องกันจะเพิ่มความซ้ำซ้อน แต่จะเน้นไปที่ศูนย์ข้อมูลที่มีการเข้าถึงในระดับมหภาค โดยไม่ต้องเน้นเฉพาะและแยกออกไปในบางแง่มุมเพื่อให้ได้สถานะระดับ"},{"id":73,"topic":1,"q":"What does the REST API support that SOAP does NOT support?","qth":"REST API รองรับอะไรบ้างที่ SOAP ไม่รองรับ?","a":["Caching","Encryption","Acceleration","Redundancy"],"ath":["การแคช","การเข้ารหัส","การเร่งความเร็ว","ความซ้ำซ้อน"],"ans":"A","exp":"The SOAP protocol does not support caching, whereas the REST API does","expth":"โปรโตคอล SOAP ไม่รองรับการแคช ในขณะที่ REST API รองรับ"},{"id":74,"topic":1,"q":"Why does a Type 1 hypervisor typically offer tighter security controls than a Type 2 hypervisor?","qth":"เหตุใดไฮเปอร์ไวเซอร์ Type 1 จึงให้การควบคุมความปลอดภัยที่เข้มงวดกว่าไฮเปอร์ไวเซอร์ Type 2","a":["A Type 1 hypervisor also controls patching of its hosted virtual machines ensure they are always secure","A Type 1 hypervisor is tied directly to the bare metal and only runs with code necessary to perform its specific mission","A Type 1 hypervisor performs hardware-level encryption for tighter security and efficiency","A Type 1 hypervisor only hosts virtual machines with the same operating systems as the hypervisor"],"ath":["ไฮเปอร์ไวเซอร์ Type 1 ยังควบคุมการแพตช์ของเครื่องเสมือนที่โฮสต์ไว้ เพื่อให้มั่นใจว่ามีความปลอดภัยเสมอ","ไฮเปอร์ไวเซอร์ Type 1 เชื่อมโยงกับโลหะเปลือยโดยตรงและทำงานด้วยโค้ดที่จำเป็นเพื่อดำเนินการภารกิจเฉพาะเท่านั้น","ไฮเปอร์ไวเซอร์ Type 1 ทำการเข้ารหัสระดับฮาร์ดแวร์เพื่อความปลอดภัยและประสิทธิภาพที่เข้มงวดยิ่งขึ้น<","A ไฮเปอร์ไวเซอร์ประเภท 1 จะโฮสต์เฉพาะเครื่องเสมือนที่มีระบบปฏิบัติการเดียวกันกับไฮเปอร์ไวเซอร์"],"ans":"B","exp":"Type 1 hypervisors run directly on top of the bare metal and only contain the code and functions required to perform their purpose. They do not rely on any other systems or contain extra features to secure","expth":"ไฮเปอร์ไวเซอร์ประเภท 1 ทำงานบนโลหะเปลือยโดยตรง และมีเพียงโค้ดและฟังก์ชันที่จำเป็นต่อการดำเนินการตามวัตถุประสงค์เท่านั้น พวกเขาไม่ต้องพึ่งพาระบบอื่นใดหรือมีคุณสมบัติพิเศษในการรักษาความปลอดภัย"},{"id":75,"topic":1,"q":"Which of the following are the storage types associated with PaaS?","qth":"ประเภทพื้นที่จัดเก็บข้อมูลใดต่อไปนี้ที่เกี่ยวข้องกับ PaaS?","a":["Structured and freeform","Volume and object","Structured and unstructured (ERED","Database and file system"],"ath":["มีโครงสร้างและรูปแบบอิสระ","ปริมาตรและวัตถุ","มีโครงสร้างและไม่มีโครงสร้าง (ERED","ฐานข้อมูลและระบบไฟล์"],"ans":"C","exp":"","expth":""},{"id":76,"topic":1,"q":"Which of the following threat types can occur when baselines are not appropriately applied or unauthorized changes are made?","qth":"ภัยคุกคามประเภทใดต่อไปนี้ที่สามารถเกิดขึ้นได้เมื่อบรรทัดฐานไม่ได้ใช้อย่างเหมาะสมหรือทำการเปลี่ยนแปลงโดยไม่ได้รับอนุญาต","a":["Insecure direct object references","Unvalidated redirects and forwards","Security misconfiguration","Sensitive data exposure"],"ath":["การอ้างอิงออบเจ็กต์โดยตรงที่ไม่ปลอดภัย","การเปลี่ยนเส้นทางและการส่งต่อที่ไม่ถูกต้อง","การกำหนดค่าความปลอดภัยผิดพลาด","การเปิดเผยข้อมูลที่ละเอียดอ่อน"],"ans":"C","exp":"Security misconfigurations occur when applications and systems are not properly configured or maintained in a secure manner. This can be caused from a shortcoming in security baselines or configurations, unauthorized changes to system configurations, or a failure to patch and upgrade systems as the vendor releases security patches","expth":"การกำหนดค่าความปลอดภัยผิดพลาดเกิดขึ้นเมื่อแอปพลิเคชันและระบบไม่ได้รับการกำหนดค่าหรือบำรุงรักษาอย่างเหมาะสมในลักษณะที่ปลอดภัย สาเหตุนี้อาจเกิดจากข้อบกพร่องในบรรทัดฐานหรือการกำหนดค่าความปลอดภัย การเปลี่ยนแปลงการกำหนดค่าระบบโดยไม่ได้รับอนุญาต หรือความล้มเหลวในการแก้ไขและอัปเกรดระบบในขณะที่ผู้จำหน่ายออกแพทช์รักษาความปลอดภัย"},{"id":77,"topic":1,"q":"What is the data encapsulation used with the SOAP protocol referred to?","qth":"การห่อหุ้มข้อมูลที่ใช้กับโปรโตคอล SOAP ที่อ้างถึงคืออะไร","a":["Packet","Envelope","Payload","Object"],"ath":["แพ็คเก็ต","ซองจดหมาย","น้ำหนักบรรทุก","Object"],"ans":"B","exp":"Simple Object Access Protocol (SOAP) encapsulates its information in what is known as a SOAP envelope and then leverages common communications protocols for transmission","expth":"Simple Object Access Protocol (SOAP) สรุปข้อมูลในสิ่งที่เรียกว่าซองจดหมาย SOAP จากนั้นจึงใช้ประโยชน์จากโปรโตคอลการสื่อสารทั่วไปสำหรับการส่งข้อมูล"},{"id":78,"topic":1,"q":"Which of the following threat types can occur when an application does not properly validate input and can be leveraged to send users to malicious sites that appear to be legitimate?","qth":"ภัยคุกคามประเภทใดต่อไปนี้ที่สามารถเกิดขึ้นได้เมื่อแอปพลิเคชันไม่ตรวจสอบอินพุตอย่างเหมาะสมและสามารถใช้ประโยชน์เพื่อส่งผู้ใช้ไปยังไซต์ที่เป็นอันตรายซึ่งดูเหมือนว่าถูกต้องตามกฎหมาย","a":["Unvalidated redirects and forwards","Insecure direct object references","Security miscomfiguration","Sensitive data exposure"],"ath":["การเปลี่ยนเส้นทางและการส่งต่อที่ไม่ได้รับการตรวจสอบ","การอ้างอิงวัตถุโดยตรงที่ไม่ปลอดภัย","การกำหนดค่าความปลอดภัยที่ไม่ถูกต้อง","การเปิดเผยข้อมูลที่ละเอียดอ่อน"],"ans":"A","exp":"Many web applications offer redirect or forward pages that send users to different, external sites. If these pages are not properly secured and validated, attackers can use the application to forward users off to sites for phishing or malware attempts. These attempts can often be more successful than direct phishing attempts because users will trust the site or application that sent them there, and they will assume it has been properly validated and approved by the trusted application's owners or operators. Security misconfiguration occurs when applications and systems are not properly configured for securty--often a result of misapplied or inadequate baselines. Insecure direct object references occur when code references aspects of the infrastructure, especially internal or private system","expth":"เว็บแอปพลิเคชันจำนวนมากเสนอการเปลี่ยนเส้นทางหรือส่งต่อเพจที่ส่งผู้ใช้ไปยังภายนอกที่แตกต่างกัน เว็บไซต์ หากหน้าเหล่านี้ไม่ได้รับการรักษาความปลอดภัยและตรวจสอบอย่างถูกต้อง ผู้โจมตีสามารถใช้แอปพลิเคชันเพื่อส่งต่อผู้ใช้ไปยังไซต์เพื่อพยายามฟิชชิ่งหรือมัลแวร์ ความพยายามเหล่านี้มักจะประสบความสำเร็จมากกว่าความพยายามฟิชชิ่งโดยตรง เนื่องจากผู้ใช้จะเชื่อถือไซต์หรือแอปพลิเคชันที่ส่งพวกเขาไปที่นั่น และพวกเขาจะถือว่าได้รับการตรวจสอบและอนุมัติอย่างเหมาะสมโด
