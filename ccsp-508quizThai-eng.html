บขององค์กรของระบบ","การควบคุมองค์กรของบริการ","การควบคุมองค์กรของระบบ"],"ans":"C","exp":"","expth":""},{"id":173,"topic":1,"q":"What does the REST API use to protect data transmissions?","qth":"REST API ใช้อะไรเพื่อป้องกันการส่งข้อมูล","a":["NetBIOS","VPN","Encapsulation","TLS"],"ath":["NetBIOS","VPN","Encapsulation","TLS"],"ans":"D","exp":"Representational State Transfer (REST) uses TLS for communication over secured channels. Although REST also supports SSL, at this point SSL has been phased out due to vulnerabilities and has been replaced by TLS","expth":"Representational State Transfer (REST) ​​ใช้ TLS สำหรับการสื่อสารผ่านช่องทางที่ปลอดภัย แม้ว่า REST จะรองรับ SSL ด้วยเช่นกัน แต่ ณ จุดนี้ SSL ได้ถูกยกเลิกเนื่องจากช่องโหว่และถูกแทนที่ด้วย TLS"},{"id":174,"topic":1,"q":"What strategy involves replacing sensitive data with opaque values, usually with a means of mapping it back to the original value?","qth":"กลยุทธ์ใดที่เกี่ยวข้องกับการแทนที่ข้อมูลที่ละเอียดอ่อนด้วยค่าทึบแสง ซึ่งโดยปกติแล้วจะใช้วิธีการแมปกลับเป็นค่าดั้งเดิม","a":["Masking","Anonymization","Tokenization","Obfuscation"],"ath":["การมาสก์","การทำให้ไม่ระบุชื่อ","การทำให้เป็นโทเค็น","การทำให้งงงวย"],"ans":"C","exp":"Tokenization is the practice of utilizing a random and opaque \"token\" value in data to replace what otherwise would be a sensitive or protected data object. The token value is usually generated by the application with a means to map it back to the actual real value, and then the token value is placed in the data set with the same formatting and requirements of the actual real value so that the application can continue to function without different modifications or code changes","expth":"การทำให้เป็นโทเค็นคือแนวทางปฏิบัติของการใช้ค่า \"โทเค็น\" แบบสุ่มและทึบแสงในข้อมูลเพื่อแทนที่สิ่งอื่นใดที่จะเป็นออบเจ็กต์ข้อมูลที่ละเอียดอ่อนหรือได้รับการปกป้อง โดยปกติแล้วค่าโทเค็นจะถูกสร้างขึ้นโดยแอปพลิเคชันโดยมีวิธีการแมปกลับไปยังมูลค่าจริงจริง จากนั้นค่าโทเค็นจะถูกวางไว้ในชุดข้อมูลที่มีการจัดรูปแบบและข้อกำหนดเดียวกันกับมูลค่าจริงจริง เพื่อให้แอปพลิเคชันสามารถทำงานได้ต่อไปโดยไม่มีการแก้ไขหรือการเปลี่ยนแปลงโค้ดที่แตกต่างกัน"},{"id":175,"topic":1,"q":"With software-defined networking, what aspect of networking is abstracted from the forwarding of traffic?","qth":"เมื่อใช้ระบบเครือข่ายที่กำหนดโดยซอฟต์แวร์ ลักษณะใดของเครือข่ายจะถูกแยกออกจากการส่งต่อการรับส่งข้อมูล?","a":["Routing (EXE)","Session","Filtering","Firewalling"],"ath":["การกำหนดเส้นทาง (Routing)","เซสชัน (Session)","การกรอง (Filtering)","ไฟร์วอลล์ (Firewall)"],"ans":"C","exp":"With software-defined networking (SDN), the filtering of network traffic is separated from the forwarding of network traffic so that it can be independently administered","expth":"ด้วยเครือข่ายที่กำหนดโดยซอฟต์แวร์ (SDN) การกรองการรับส่งข้อมูลเครือข่ายจะถูกแยกออกจากการส่งต่อการรับส่งข้อมูลเครือข่าย เพื่อให้สามารถจัดการได้อย่างอิสระ"},{"id":177,"topic":1,"q":"What does dynamic application security testing (DAST) NOT entail?","qth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบไดนามิก (DAST) ไม่เกี่ยวข้องกับอะไร","a":["Scanning","Probing","Discovery","Knowledge of the system"],"ath":["การสแกน","การตรวจสอบ","การค้นพบ","ความรู้เกี่ยวกับระบบ"],"ans":"D","exp":"Dynamic application security testing (DAST) is considered \"black box\" testing and begins with no inside knowledge of the application or its configurations Everything about the application must be discovered during the testing","expth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบไดนามิก (DAST) ถือเป็นการทดสอบ \"กล่องดำ\" และเริ่มต้นด้วยการไม่มีความรู้ภายในเกี่ยวกับแอปพลิเคชันหรือการกำหนดค่าของแอปพลิเคชัน ทุกอย่างเกี่ยวกับแอปพลิเคชันจะต้องถูกค้นพบในระหว่างการทดสอบ"},{"id":178,"topic":1,"q":"Where is an XML firewall most commonly deployed in the environment?","qth":"ไฟร์วอลล์ XML ใช้งานทั่วไปในสภาพแวดล้อมที่ไหน","a":["Between the application and data layers","Between the IPS and firewall","Between the presentation and application layers","Between the firewall and application server"],"ath":["ระหว่างแอปพลิเคชันและชั้นข้อมูล","ระหว่าง IPS และไฟร์วอลล์","ระหว่างเลเยอร์การนำเสนอและแอปพลิเคชัน","ระหว่างไฟร์วอลล์และเซิร์ฟเวอร์แอปพลิเคชัน"],"ans":"D","exp":"XML firewalls are most commonly deployed in ine between the firewall and application server to validate XML code before it reaches the application","expth":"ไฟร์วอลล์ XML มักถูกนำไปใช้งานโดยทั่วไประหว่างไฟร์วอลล์และเซิร์ฟเวอร์แอปพลิเคชันเพื่อตรวจสอบโค้ด XML ก่อนที่จะเข้าถึงแอปพลิเคชัน"},{"id":179,"topic":1,"q":"What type of masking strategy involves replacing data on a system while it passes between the data and application layers?","qth":"กลยุทธ์การมาสก์ประเภทใดที่เกี่ยวข้องกับการแทนที่ข้อมูลบนระบบในขณะที่ส่งผ่านระหว่างข้อมูลและเลเยอร์แอปพลิเคชัน","a":["Dynamic","Static","Replication","Duplication"],"ath":["ไดนามิก","คงที่","การจำลอง","การทำสำเนา"],"ans":"A","exp":"With dynamic masking, production environments are protected with the masking process being implemented between the application and data layers of the application. This allows for a masking translation to take place live in the system and during normal application processing of data","expth":"ด้วยการมาสก์แบบไดนามิก สภาพแวดล้อมการผลิตได้รับการปกป้องด้วยกระบวนการมาสก์ที่ถูกนำมาใช้ระหว่างแอปพลิเคชันและชั้นข้อมูลของแอปพลิเคชัน ซึ่งช่วยให้การแปลแบบมาสก์เกิดขึ้นในระบบและในระหว่างการประมวลผลข้อมูลแอปพลิเคชันปกติ"},{"id":180,"topic":1,"q":"Which of the following is a widely used tool for code development, branching, and collaboration?","qth":"ข้อใดต่อไปนี้เป็นเครื่องมือที่ใช้กันอย่างแพร่หลายสำหรับการพัฒนาโค้ด การแตกสาขา และการทำงานร่วมกัน","a":["GitHub","Maestro","Orchestrator","Conductor"],"ath":["GitHub","Maestro","Orchestrator","Conductor"],"ans":"A","exp":"GitHub is an open source tool that developers leverage for code collaboration, branching, and versioning,","expth":"GitHub เป็นเครื่องมือโอเพ่นซอร์สที่นักพัฒนาใช้ประโยชน์จากการทำงานร่วมกันของโค้ด การแตกสาขา และการกำหนดเวอร์ชัน"},{"id":181,"topic":1,"q":"Which aspect of security is DNSSEC designed to ensure?","qth":"ความปลอดภัยด้านใดที่ DNSSEC ออกแบบมาให้มั่นใจ","a":["Integrity (EEX)","Authentication","Availability","Confidentiality"],"ath":["ความสมบูรณ์ (EEX)","การรับรองความถูกต้อง","ความพร้อมใช้งาน","การรักษาความลับ"],"ans":"D","exp":"DNSSEC is a security extension to the regular DNS protocol and services that allows for the validation of the integrity of DNS lookups. It does not address confidentiality or availability at all. It allows for a DNS client to perform DNS lookups and validate both their origin and authority via the cryptographic signature that accompanies the DNS response","expth":"DNSSEC เป็นส่วนขยายการรักษาความปลอดภัยสำหรับโปรโตคอลและบริการ DNS ปกติที่ช่วยให้สามารถตรวจสอบความถูกต้องของความสมบูรณ์ของการค้นหา DNS ไม่ได้กล่าวถึงการรักษาความลับหรือความพร้อมแต่อย่างใด ช่วยให้ไคลเอนต์ DNS ทำการค้นหา DNS และตรวจสอบทั้งต้นทางและสิทธิ์ผ่านลายเซ็นการเข้ารหัสที่มาพร้อมกับการตอบสนอง DNS"},{"id":182,"topic":1,"q":"Which process serves to prove the identity and credentials of a user requesting access to an application or data?","qth":"กระบวนการใดที่ทำหน้าที่พิสูจน์ตัวตนและข้อมูลประจำตัวของผู้ใช้ที่ร้องขอการเข้าถึงแอปพลิเคชันหรือข้อมูล","a":["Repudiation","Authentication","Identification","Authorization"],"ath":["การปฏิเสธ","การรับรองความถูกต้อง","การระบุตัวตน","การให้สิทธิ์"],"ans":"B","exp":"Authentication is the process of proving whether the identity presented by a user is true and valid. This can be done through common mechanisms such as user ID and password combinations or with more secure methods such as multifactor authentication","expth":"การรับรองความถูกต้องเป็นกระบวนการในการพิสูจน์ว่าข้อมูลประจำตัวที่นำเสนอโดยผู้ใช้นั้นเป็นจริงและถูกต้องหรือไม่ ซึ่งสามารถทำได้ผ่านกลไกทั่วไป เช่น การผสม ID ผู้ใช้และรหัสผ่าน หรือด้วยวิธีที่ปลอดภัยยิ่งขึ้น เช่น การรับรองความถูกต้องแบบหลายปัจจัย"},{"id":183,"topic":1,"q":"Who would be responsible for implementing IPsec to secure communications for an application?","qth":"ใครจะเป็นผู้รับผิดชอบในการใช้ IPsec เพื่อรักษาความปลอดภัยการสื่อสารสำหรับแอปพลิเคชัน","a":["Developers","Systems staff","Auditors","Cloud customer"],"ath":["นักพัฒนา","เจ้าหน้าที่ระบบ","ผู้ตรวจสอบ","ลูกค้าระบบคลาวด์"],"ans":"B","exp":"Because IPsec is implemented at the system or network level, itis the responsibility of the systems staff. IPsec removes the responsibility from developers, whereas other technologies such as TLS would be implemented by developers","expth":"เนื่องจาก IPsec ถูกนำไปใช้ในระดับระบบหรือเครือข่าย จึงเป็นความรับผิดชอบของเจ้าหน้าที่ระบบ IPsec ขจัดความรับผิดชอบออกจากนักพัฒนา ในขณะที่เทคโนโลยีอื่นๆ เช่น TLS จะถูกนำไปใช้โดยนักพัฒนา"},{"id":184,"topic":1,"q":"What is the minimum regularity for testing a BCDR plan to meet best practices?","qth":"ความสม่ำเสมอขั้นต่ำในการทดสอบแผน BCDR เพื่อให้เป็นไปตามแนวทางปฏิบัติที่ดีที่สุดคืออะไร","a":["Once year","Once a month","Every six months","When the budget allows it"],"ath":["ปีละครั้ง","เดือนละครั้ง","ทุกหกเดือน","เมื่องบประมาณเอื้ออำนวย"],"ans":"A","exp":"Best practices and industry standards dictate that a BCDR solution should be tested at least once a year, though specific regulatory requirements may dictate more regular testing. The BCDR plan should also be tested whenever a major modification to a system occurs","expth":"แนวทางปฏิบัติที่ดีที่สุดและมาตรฐานอุตสาหกรรมกำหนดว่าควรทดสอบโซลูชัน BCDR อย่างน้อยปีละครั้ง แม้ว่าข้อกำหนดด้านกฎระเบียบเฉพาะอาจกำหนดการทดสอบตามปกติมากกว่าก็ตาม แผน BCDR ควรได้รับการทดสอบทุกครั้งที่มีการปรับเปลี่ยนระบบครั้งใหญ่เกิดขึ้น"},{"id":185,"topic":1,"q":"Other than cost savings realized due to measured service, what is another facet of cloud computing that will typically save substantial costs in time and money for an organization in the event of a disaster?","qth":"นอกจากการประหยัดต้นทุนจากบริการแบบวัดปริมาณแล้ว แง่มุมใดของการประมวลผลแบบคลาวด์ที่มักช่วยประหยัดเวลาและเงินได้มากเมื่อเกิดภัยพิบัติ","a":["Broad network access","Interoperability","Resource pooling","Portability"],"ath":["การเข้าถึงเครือข่ายอย่างกว้างขวาง (Broad network access)","ความสามารถในการทำงานร่วมกัน (Interoperability)","การรวมทรัพยากร (Resource pooling)","ความสามารถในการพกพา/ย้ายระบบ (Portability)"],"ans":"A","exp":"With a typical BCDR solution, an organization would need some number of staff to quickly travel to the location of the BCDR site to configure systems and applications for recovery. With a cloud environment, everything is done over broad network access, with no need (or even possibility) to travel to a remote site at any time","expth":"ในแผน BCDR แบบดั้งเดิม องค์กรต้องส่งทีมงานเดินทางไปยังไซต์สำรองเพื่อตั้งค่าระบบ แต่ในระบบคลาวด์ทุกอย่างทำผ่านเครือข่ายที่เข้าถึงได้กว้าง จึงไม่จำเป็นต้องเดินทางไปยังไซต์ระยะไกล"},{"id":186,"topic":1,"q":"Which of the following is NOT part of a retention policy?","qth":"ข้อใดต่อไปนี้ไม่เป็นส่วนหนึ่งของนโยบายการเก็บรักษา","a":["Format","Costs","Accessibility","Duration"],"ath":["รูปแบบ","ต้นทุน","การเข้าถึง","ระยะเวลา"],"ans":"B","exp":"The data retention policy covers the duration, format, technologies, protection, and accessibility of archives, but does not address the specific costs of its implementation and maintenance","expth":"นโยบายการเก็บรักษาข้อมูลครอบคลุมระยะเวลา รูปแบบ เทคโนโลยี การป้องกัน และการเข้าถึงข้อมูลที่เก็บถาวร แต่ไม่ได้ระบุถึงต้นทุนเฉพาะของการดำเนินการและการบำรุงรักษา"},{"id":187,"topic":1,"q":"Which aspect of cloud computing would make the use of a cloud the most attractive as a BCDR solution?","qth":"แง่มุมใดของการประมวลผลแบบคลาวด์ที่จะทำให้การใช้คลาวด์เป็นโซลูชัน BCDR ที่น่าสนใจที่สุด","a":["Interoperability","Resource pooling","Portability","Measured service"],"ath":["การทำงานร่วมกัน","การรวมทรัพยากร","การพกพา","บริการวัดผล"],"ans":"D","exp":"Measured service means that costs are only incurred when a cloud customer is actually using cloud services. This is i","expth":"บริการที่วัดผลหมายความว่าต้นทุนจะเกิดขึ้นเฉพาะเมื่อลูกค้าระบบคลาวด์ใช้บริการระบบคลาวด์จริงๆ เท่านั้น นี่คือฉัน"},{"id":188,"topic":1,"q":"Which of the cloud deployment models offers the easiest initial setup and access for the cloud customer?","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดที่นำเสนอการตั้งค่าเริ่มต้นและการเข้าถึงที่ง่ายที่สุดสำหรับลูกค้าระบบคลาวด์","a":["Hybrid","Community","Private","Public"],"ath":["ไฮบริด","ชุมชน","ส่วนตัว","สาธารณะ"],"ans":"D","exp":"Because the public cloud model is available to everyone, in most instances all a customer will need to do to gain access is set up an account and provide a credit card number through the service's web portal. No additional contract negotiations, agreements, or specific group memberships are typically needed to get started","expth":"เนื่องจากโมเดลคลาวด์สาธารณะพร้อมใช้งานสำหรับทุกคน ในกรณีส่วนใหญ่ ลูกค้าทุกคนจะต้องดำเนินการเพื่อให้ได้รับการเข้าถึงคือการตั้งค่าบัญชีและระบุหมายเลขบัตรเครดิตผ่านทางเว็บพอร์ทัลของบริการ โดยทั่วไปไม่จำเป็นต้องมีการเจรจาสัญญา ข้อตกลง หรือการเป็นสมาชิกกลุ่มเพิ่มเติมใดๆ ในการเริ่มต้น"},{"id":189,"topic":1,"q":"Which of the following is NOT something that an HIDS will monitor?","qth":"ข้อใดต่อไปนี้ไม่ใช่สิ่งที่ HIDS จะตรวจสอบ","a":["Configurations","User logins","Critical system files","Network traffic"],"ath":["การกำหนดค่า","การเข้าสู่ระบบของผู้ใช้","ไฟล์ระบบที่สำคัญ","การรับส่งข้อมูลเครือข่าย"],"ans":"B","exp":"Ahost intrusion detection system (HIDS) monitors network traffic as well as critical system files and configurations","expth":"Ahost Intrusion Detection System (HIDS) ตรวจสอบการรับส่งข้อมูลเครือข่ายตลอดจนไฟล์ระบบและการกำหนดค่าที่สำคัญ"},{"id":190,"topic":1,"q":"Which of the following technologies is used to monitor network traffic and notify if any potential threats or attacks are noticed? AIPS","qth":"เทคโนโลยีใดต่อไปนี้ใช้ในการตรวจสอบการรับส่งข้อมูลเครือข่ายและแจ้งเตือนหากสังเกตเห็นภัยคุกคามหรือการโจมตีที่อาจเกิดขึ้น เอไอพีเอส","a":["HIDS","WAF","Firewall","IDS"],"ath":["ซ่อน","วัฟ","ไฟร์วอลล์","ไอดีเอส"],"ans":"D","exp":"An intrusion detection system (IDS) is designed to analyze network packets, compare their contents or characteristics against a set of configurations or signatures, and alert personnel if anything is detected that could constitute a threat or is otherwise designated for alerting","expth":"ระบบตรวจจับการบุกรุก (IDS) ได้รับการออกแบบมาเพื่อวิเคราะห์แพ็คเก็ตเครือข่าย เปรียบเทียบเนื้อหาหรือคุณลักษณะกับชุดการกำหนดค่าหรือลายเซ็น และแจ้งเตือนบุคลากรหากตรวจพบสิ่งใดที่อาจก่อให้เกิดภัยคุกคามหรือถูกกำหนดไว้สำหรับการแจ้งเตือน"},{"id":191,"topic":1,"q":"What concept does the \"A\" represent in the DREAD model?","qth":"แนวคิด \"A\" แสดงถึงแนวคิดใดในโมเดล DREAD?","a":["Affected users (EEXEITD","Authentication","Affinity","Authorization"],"ath":["ผู้ใช้ที่ได้รับผลกระทบ (EEEXEITD","การตรวจสอบสิทธิ์","Affinity","การให้สิทธิ์"],"ans":"A","exp":"Affected users refers to the percentage of users who would be impacted by a successful exploit. Scoring ranges from 0, which means no users are impacted, to 10, which means all users are impacted","expth":"ผู้ใช้ที่ได้รับผลกระทบหมายถึงเปอร์เซ็นต์ของผู้ใช้ที่จะได้รับผลกระทบจากการหาประโยชน์ที่ประสบความสำเร็จ ช่วงการให้คะแนนมีตั้งแต่ 0 ซึ่งหมายความว่าไม่มีผู้ใช้ใดได้รับผลกระทบ ถึง 10 ซึ่งหมายถึง ผู้ใช้ทุกคนได้รับผลกระทบ"},{"id":192,"topic":1,"q":"Which attribute of data poses the biggest challenge for data discovery?","qth":"คุณลักษณะใดของข้อมูลที่เป็นความท้าทายที่ใหญ่ที่สุดสำหรับการค้นพบข้อมูล","a":["Labels","Quality","Volume","Format"],"ath":["ป้ายกำกับ","คุณภาพ","ปริมาณ","รูปแบบ"],"ans":"B","exp":"The main problem when it comes to data discovery is the quality of the data that analysis is being performed against. Data that is malformed, incorrectly stored or labeled, or incomplete makes it very difficult to use analytical tools against","expth":"ปัญหาหลักเมื่อพูดถึงการค้นพบข้อมูลคือคุณภาพของข้อมูลที่ดำเนินการวิเคราะห์ ข้อมูลที่มีรูปแบบไม่ถูกต้อง จัดเก็บหรือติดป้ายกำกับไม่ถูกต้อง หรือไม่สมบูรณ์ทำให้ยากต่อการใช้เครื่องมือวิเคราะห์เพื่อต่อต้าน"},{"id":193,"topic":1,"q":"What does static application security testing (SAST) offer as a tool to the testers?","qth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบคงที่ (SAST) ให้อะไรเป็นเครื่องมือสำหรับผู้ทดสอบ","a":["Production system scanning","Injection attempts","Source code access","Live testing"],"ath":["การสแกนระบบการผลิต","ความพยายามในการฉีด","การเข้าถึงซอร์สโค้ด","การทดสอบแบบสด"],"ans":"C","exp":"Static application security testing (SAST) is conducted with knowledge of the system, including source code, and is done against offline systems","expth":"การทดสอบความปลอดภัยของแอปพลิเคชันแบบคงที่ (SAST) ดำเนินการด้วยความรู้เกี่ยวกับระบบ รวมถึงซอร์สโค้ด และดำเนินการกับระบบออฟไลน์"},{"id":194,"topic":1,"q":"Which of the following service capabilities gives the cloud customer an established and maintained framework to deploy code and applications?","qth":"ความสามารถในการบริการใดต่อไปนี้ช่วยให้ลูกค้าคลาวด์มีเฟรมเวิร์กที่จัดตั้งขึ้นและดูแลรักษาไว้เพื่อปรับใช้โค้ดและแอปพลิเคชัน?","a":["Software","Desktop","Platform","Infrastructure"],"ath":["ซอฟต์แวร์","เดสก์ท็อป","แพลตฟอร์ม","โครงสร้างพื้นฐาน"],"ans":"C","exp":"The platform service capability provides programming languages and libraries from the cloud provider, where the customer can deploy their own code and applications into a managed and controlled framework","expth":"ความสามารถในการให้บริการแพลตฟอร์มจัดเตรียมภาษาการเขียนโปรแกรมและไลบรารีจากผู้ให้บริการคลาวด์ ซึ่งลูกค้าสามารถปรับใช้โค้ดและแอปพลิเคชันของตนเองในเฟรมเวิร์กที่ได้รับการจัดการและควบคุม"},{"id":195,"topic":1,"q":"What process is used within a cloud environment to maintain resource balancing and ensure that resources are available where and when needed?","qth":"กระบวนการใดที่ใช้ภายในสภาพแวดล้อมคลาวด์เพื่อรักษาสมดุลของทรัพยากรและรับรองว่าทรัพยากรพร้อมใช้งานทุกที่และทุกเวลาที่จำเป็น","a":["Dynamic clustering","Dynamic balancing","Dynamic resource scheduling","Dynamic optimization"],"ath":["การจัดกลุ่มแบบไดนามิก","การปรับสมดุลแบบไดนามิก","การจัดกำหนดการทรัพยากรแบบไดนามิก","การปรับให้เหมาะสมแบบไดนามิก"],"ans":"D","exp":"Dynamic optimization is the process through which the cloud environment is constantly maintained to ensure resources are available when and where needed, and that physical nodes do not become overloaded or near capacity, while others are underutilized","expth":"การปรับให้เหมาะสมแบบไดนามิกเป็นกระบวนการที่สภาพแวดล้อมคลาวด์ได้รับการดูแลอย่างต่อเนื่องเพื่อให้แน่ใจว่าทรัพยากรจะพร้อมใช้งานในเวลาและในสถานที่ที่จำเป็น และโหนดทางกายภาพไม่ มีภาระมากเกินไปหรือใกล้จะสามารถรองรับได้ ในขณะที่ส่วนอื่นๆ ใช้งานน้อยเกินไป"},{"id":196,"topic":1,"q":"Which value refers to the percentage of production level restoration needed to meet BCDR objectives?","qth":"ค่าใดที่อ้างอิงถึงเปอร์เซ็นต์ของการฟื้นฟูระดับการผลิตที่จำเป็นเพื่อให้บรรลุวัตถุประสงค์ BCDR","a":["RPO","RTO","RSL","SRE"],"ath":["RPO","RTO","RSL","SRE"],"ans":"C","exp":"The recovery service level (RSL) is a percentage measure of the total typical production service level that needs to be restored to meet BCDR objectives in the case of a failure","expth":"ระดับบริการกู้คืน (RSL) คือเปอร์เซ็นต์การวัดของระดับบริการการผลิตทั่วไปทั้งหมดที่จำเป็นต้องได้รับการกู้คืนเพื่อให้บรรลุวัตถุประสงค์ BCDR ในกรณีที่เกิดความล้มเหลว"},{"id":197,"topic":1,"q":"Over time, what is a primary concern for data archiving?","qth":"เมื่อเวลาผ่านไป อะไรคือข้อกังวลหลักสำหรับการจัดเก็บข้อมูลถาวร?","a":["Size of archives","Format of archives","Recoverability","Regulatory changes"],"ath":["ขนาดของไฟล์เก็บถาวร","รูปแบบของไฟล์เก็บถาวร","ความสามารถในการกู้คืน","การเปลี่ยนแปลงด้านกฎระเบียบ"],"ans":"C","exp":"Over time, maintaining the ability to restore and read archives is a primary concern for data archiving. As technologies change and new systems are brought in, it is imperative for an organization to ensure they are still able to restore and access archives for the duration of the required retention period","expth":"เมื่อเวลาผ่านไป การรักษาความสามารถในการกู้คืนและอ่านไฟล์เก็บถาวรถือเป็นข้อกังวลหลักสำหรับการเก็บข้อมูลถาวร เมื่อเทคโนโลยีเปลี่ยนแปลงและระบบใหม่ๆ เข้ามา องค์กรจึงจำเป็นต้องตรวจสอบให้แน่ใจว่ายังคงสามารถกู้คืนและเข้าถึงไฟล์เก็บถาวรได้ตลอดระยะเวลาการเก็บรักษาที่กำหนด"},{"id":198,"topic":1,"q":"What is an often overlooked concept that is essential to protecting the confidentiality of data?","qth":"แนวคิดที่มักถูกมองข้ามซึ่งจำเป็นต่อการปกป้องความลับของข้อมูลคืออะไร","a":["Strong password","Training","Security controls","Policies"],"ath":["รหัสผ่านที่รัดกุม","การฝึกอบรม","การควบคุมความปลอดภัย","นโยบาย"],"ans":"B","exp":"While the main focus of confidentiality revolves around technological requirements or particular security methods, an important and often overlooked aspect of safeguarding data confidentiality is appropriate and comprehensive training for those with access to it. Training should be focused on the safe handling of sensitive information overall, including best practices for network activities as well as physical security of the devices or workstations used to access the application","expth":"ในขณะที่จุดสนใจหลักของการรักษาความลับนั้นเกี่ยวข้องกับข้อกำหนดทางเทคโนโลยีหรือวิธีการรักษาความปลอดภัยโดยเฉพาะ แต่แง่มุมที่สำคัญและมักถูกมองข้ามในการปกป้องการรักษาความลับของข้อมูลนั้นเป็นการฝึกอบรมที่เหมาะสมและครอบคลุมสำหรับผู้ที่สามารถเข้าถึงข้อมูลได้ การฝึกอบรมควรมุ่งเน้นไปที่การจัดการข้อมูลที่ละเอียดอ่อนโดยรวมอย่างปลอดภัย รวมถึงแนวทางปฏิบัติที่ดีที่สุดสำหรับกิจกรรมเครือข่าย เช่นเดียวกับความปลอดภัยทางกายภาพของอุปกรณ์หรือเวิร์กสเตชันที่ใช้ในการเข้าถึงแอปพลิเคชัน"},{"id":199,"topic":1,"q":"Which of the cloud deployment models offers the most control and input to the cloud customer as to how the overall cloud environment is implemented and configured?","qth":"โมเดลการใช้งานคลาวด์ใดที่ให้การควบคุมและการป้อนข้อมูลแก่ลูกค้าคลาวด์มากที่สุดเกี่ยวกับวิธีการใช้งานและกำหนดค่าสภาพแวดล้อมคลาวด์โดยรวม","a":["Public","Community","Hybrid","Private"],"ath":["สาธารณะ","ชุมชน","ไฮบริด","ส่วนตัว"],"ans":"D","exp":"A private cloud model, and the specific contractual relationships involved, will give a cloud customer the most level of input and control over how the overall cloud environment is designed and implemented. This would be even more so in cases where the private cloud is owned and operated by the same organization that is hosting services within it","expth":"โมเดลคลาวด์ส่วนตัวและความสัมพันธ์ตามสัญญาเฉพาะที่เกี่ยวข้อง จะทำให้ลูกค้าคลาวด์ได้รับข้อมูลและควบคุมวิธีการออกแบบและใช้งานสภาพแวดล้อมคลาวด์โดยรวมในระดับสูงสุด ซึ่งจะยิ่งมากกว่านี้ในกรณีที่ระบบคลาวด์ส่วนตัวเป็นเจ้าของและดำเนินการโดยองค์กรเดียวกันกับที่โฮสต์บริการภายในระบบ"},{"id":200,"topic":1,"q":"What concept does the \"D\" represent with the STRIDE threat model?","qth":"แนวคิดใดที่ \"D\" แสดงถึงโมเดลภัยคุกคาม STRIDE","a":["Data loss","Denial of service","Data breach","Distributed"],"ath":["การสูญเสียข้อมูล","การปฏิเสธการบริการ","การละเมิดข้อมูล","แบบกระจาย"],"ans":"B","exp":"Any application can be a possible target of denial-of-service (DoS) attacks. From the application side, the developers should minimize how many operations are performed for non-authenticated users. This will keep the application running as quickly as possible and using the least amount of system resources to help minimize the impact of any such attacks","expth":"แอปพลิเคชันใดๆ ก็สามารถเป็นเป้าหมายที่เป็นไปได้ของการโจมตีแบบปฏิเสธการให้บริการ (DoS) จากฝั่งแอปพลิเคชัน นักพัฒนาควรลดจำนวนการดำเนินการสำหรับผู้ใช้ที่ไม่ได้รับการรับรองความถูกต้องให้เหลือน้อยที่สุด ซึ่งจะทำให้แอปพลิเคชันทำงานเร็วที่สุดเท่าที่จะเป็นไปได้ และใช้ทรัพยากรระบบน้อยที่สุดเพื่อช่วยลดผลกระทบของการโจมตีดังกล่าว"},{"id":201,"topic":1,"q":"Your boss has tasked your team with getting your legacy systems and applications connected with new cloud-based services that management has decided are crucial to customer service and offerings. Which role would you be assuming under this directive?","qth":"หัวหน้าของคุณมอบหมายให้ทีมของคุณเชื่อมต่อระบบและแอปพลิเคชันเดิมของคุณเข้ากับบริการบนคลาวด์ใหม่ที่ฝ่ายบริหารตัดสินใจว่ามีความสำคัญต่อการบริการลูกค้าและข้อเสนอ คุณจะรับบทบาทใดภายใต้คำสั่งนี้","a":["Cloud service administrator","Cloud service user","Cloud service integrator","Cloud service business manager"],"ath":["ผู้ดูแลระบบบริการคลาวด์","ผู้ใช้บริการคลาวด์","ผู้รวมบริการคลาวด์","ผู้จัดการธุรกิจบริการคลาวด์"],"ans":"C","exp":"The cloud service integrator role is responsible for connecting and integrating existing services and applications with cloud-based services.A cloud service administrator is responsible for testing, monitoring, and securing cloud services, as well as providing usage reporting and dealing with service problems. The cloud service user is someone who consumes cloud services. The cloud service business manager is responsible for overseeing the billing, auditing, and purchasing of cloud services","expth":"บทบาทผู้รวมบริการคลาวด์มีหน้าที่รับผิดชอบในการเชื่อมต่อและรวมบริการและแอปพลิเคชันที่มีอยู่เข้ากับบริการบนคลาวด์ ผู้ดูแลระบบบริการคลาวด์มีหน้าที่ทดสอบ ตรวจสอบ และรักษาความปลอดภัยบริการคลาวด์ รวมถึงจัดทำรายงานการใช้งานและจัดการกับปัญหาการบริการ ผู้ใช้บริการคลาวด์คือบุคคลที่ใช้บริการคลาวด์ ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่ดูแลการเรียกเก็บเงิน การตรวจสอบ และการจัดซื้อบริการคลาวด์"},{"id":202,"topic":1,"q":"One of the main components of system audits is the ability to track changes over time and to match these changes with continued compliance and internal processes Which aspect of cloud computing makes this particular component more challenging than in a traditional data center?","qth":"หนึ่งในองค์ประกอบหลักของการตรวจสอบระบบคือความสามารถในการติดตามการเปลี่ยนแปลงเมื่อเวลาผ่านไปและเพื่อให้ตรงกับการเปลี่ยนแปลงเหล่านี้กับการปฏิบัติตามข้อกำหนดและกระบวนการภายในอย่างต่อเนื่อง แง่มุมใดของการประมวลผลแบบคลาวด์ที่ทำให้องค์ประกอบเฉพาะนี้มีความท้าทายมากกว่าในศูนย์ข้อมูลแบบเดิม","a":["Portability","Virtualization","Elasticity","Resource pooling"],"ath":["การพกพา","การจำลองเสมือน","ความยืดหยุ่น","การรวมทรัพยากร"],"ans":"B","exp":"Cloud services make exclusive use of virtualization, and systems change over time, including the addition, subtraction, and reimaging of virtual machines. Itis extremely unlikely that the exact same virtual machines and images used in a previous audit would stil be in use or even available for a later audit, making the tracking of changes over time extremely dificult, or even impossible. Elasticity refers to the ability to add and remove resources from a system or service to meet current demand, and although it plays a factor in making the tracking of virtual machines very difficult over time, it is not the best answer in this case. Resource pooling pertains to a cloud environment sharing a large amount of resources between different customers and services. Portabilty refers to the ability","expth":"บริการคลาวด์ใช้งานการจำลองเสมือนโดยเฉพาะ และระบบจะเปลี่ยนแปลงไปตามกาลเวลา รวมถึงส่วนเพิ่มเติม การลบและการจำลองเครื่องเสมือนใหม่ ไม่น่าเป็นไปได้อย่างยิ่งที่เครื่องเสมือนและรูปภาพที่ใช้ในการตรวจสอบครั้งก่อนจะยังคงถูกใช้งานหรือพร้อมสำหรับการตรวจสอบในภายหลัง ทำให้การติดตามการเปลี่ยนแปลงเมื่อเวลาผ่านไปเป็นเรื่องยากอย่างยิ่งหรือเป็นไปไม่ได้เลย ความยืดหยุ่นหมายถึงความสามารถในการเพิ่มและลบทรัพยากรออกจากระบบหรือบริการเพื่อตอบสนองความต้องการในปัจจุบัน และถึงแม้จะมีปัจจัยที่ทำให้การติดตามเครื่องเสมือนเป็นเรื่องยากมากเมื่อเวลาผ่านไป แต่ก็ไม่ใช่คำตอบที่ดีที่สุดในกรณีนี้ การรวมทรัพยากรเกี่ยวข้องกับสภาพแวดล้อมคลาวด์ที่แบ่งปันทรัพยากรจำนวนมากระหว่างลูกค้าและบริการที่แตกต่างกัน การพกพาหมายถึงความสามารถ"},{"id":203,"topic":1,"q":"In the wake of many scandals with major corporations involving fraud and the deception of investors and regulators, which of the following laws was passed to govern accounting and financial records and disclosures?","qth":"หลังจากเกิดเรื่องอื้อฉาวจำนวนมากกับบริษัทใหญ่ ๆ ที่เกี่ยวข้องกับการฉ้อโกงและการหลอกลวงนักลงทุนและหน่วยงานกำกับดูแล กฎหมายใดต่อไปนี้ที่ผ่านเพื่อควบคุมบันทึกทางบัญชีและการเงินและการเปิดเผยข้อมูล","a":["GLBA","Safe Harbor","HIPAA","sox"],"ath":["GLBA","Safe Harbor","HIPAA","sox"],"ans":"D","exp":"The Sarbanes-Oxley Act (SOX) regulates the financial and accounting practices used by organizations in order to protect shareholders from improper practices and accounting errors. The Health Insurance Portability and Accountability Act (HIPAA) pertains to the protection of patient medical records and privacy. The Gramm-Leach-Blley Act (GLBA) focuses on the use of Pll within financial institutions. The Safe Harbor program was designed by the US government as a way for American companies to comply with European Union privacy laws","expth":"กฎหมาย Sarbanes-Oxley (SOX) ควบคุมแนวทางปฏิบัติทางการเงินและการบัญชีที่องค์กรใช้เพื่อปกป้องผู้ถือหุ้นจาก การปฏิบัติที่ไม่เหมาะสมและข้อผิดพลาดทางบัญชี กฎหมาย Health Insurance Portability and Accountability Act (HIPAA) เกี่ยวข้องกับการคุ้มครองเวชระเบียนของผู้ป่วยและความเป็นส่วนตัว พระราชบัญญัติ Gramm-Leach-Blley (GLBA) มุ่งเน้นไปที่การใช้ Pll ภายในสถาบันการเงิน โครงการ Safe Harbor ได้รับการออกแบบโดยรัฐบาลสหรัฐฯ เพื่อเป็นแนวทางสำหรับบริษัทอเมริกันในการปฏิบัติตามกฎหมายความเป็นส่วนตัวของสหภาพยุโรป"},{"id":204,"topic":1,"q":"Which one of the following threat types to applications and services involves the sending of requests that are invalid and manipulated through a user's client to execute commands on the application under the user's own credentials?","qth":"ภัยคุกคามประเภทใดประเภทหนึ่งต่อแอปพลิเคชันและบริการต่อไปนี้เกี่ยวข้องกับการส่งคำขอที่ไม่ถูกต้องและจัดการผ่านไคลเอนต์ของผู้ใช้เพื่อรันคำสั่งบนแอปพลิเคชันภายใต้ข้อมูลประจำตัวของผู้ใช้เอง","a":["Injection","Missing function-level access control","Cross-site scripting","Cross-site request forgery"],"ath":["การฉีด","การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การเขียนสคริปต์ข้ามไซต์","การปลอมแปลงคำขอข้ามไซต์"],"ans":"D","exp":"A ctoss-site request forgery (CSRF) attack forces a client that a user has used to authenticate to an application to send forged requests under the user's own credentials to execute commands and requests that the application thinks are coming from a trusted client and user. Although this type of attack cannot be used to steal data directly because the attacker has no way of seeing the results of the commands, it does open other ways to compromise an application. Missing function-level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call. Cross-site scripting occurs when an attacker is able to send untrusted data to a user's browser without going through validation processes. An inject","expth":"A ctoss-site การโจมตี request forgery (CSRF) บังคับให้ไคลเอ็นต์ที่ผู้ใช้ใช้ในการตรวจสอบแอปพลิเคชันเพื่อส่งคำขอปลอมแปลงภายใต้ข้อมูลประจำตัวของผู้ใช้เองเพื่อดำเนินการคำสั่งและคำขอที่แอปพลิเคชันคิดว่ามาจากไคลเอ็นต์และผู้ใช้ที่เชื่อถือได้ แม้ว่าการโจมตีประเภทนี้จะไม่สามารถใช้เพื่อขโมยข้อมูลได้โดยตรง เนื่องจากผู้โจมตีไม่มีทางเห็นผลลัพธ์ของคำสั่งได้ แต่ก็เปิดช่องทางอื่นในการประนีประนอมแอปพลิเคชัน การควบคุมการเข้าถึงระดับฟังก์ชันหายไปโดยที่แอปพลิเคชันตรวจสอบการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบเริ่มต้นเท่านั้น และไม่ได้ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การเขียนสคริปต์ข้ามไซต์เกิดขึ้นเมื่อผู้โจมตีสามารถส่งข้อมูลที่ไม่น่าเชื่อถือไปยังเบราว์เซอร์ของผู้ใช้โดยไม่ต้องผ่านกระบวนการตรวจสอบ การฉีด"},{"id":205,"topic":1,"q":"Which cloud service category would be most i","qth":"หมวดหมู่บริการคลาวด์ใดที่จะเป็น i","a":["DaaS","PaaS","laaS","SaaS"],"ath":["DaaS","PaaS","laaS","SaaS"],"ans":"B","exp":"Platform as a Service would allow software developers to quickly and easily deploy their applications among different hosting providers for testing and validation in order to determine the best option. Although laaS would also be appropriate for hosting applications, it would require too much configuration of application servers and libraries in order to test code. Conversely, PaaS would provide a ready-to-use environment from the onset. DaaS would not be appropriate in any way for software developers to use to deploy applications. laaS would not be appropriate in this scenario because it would require the developers to also deploy and maintain the operating system images or to contract with another firm to do so. SaaS, being a fully functional software platform, would not be appropriate f","expth":"แพลตฟอร์มที่เป็นบริการจะช่วยให้นักพัฒนาซอฟต์แวร์สามารถปรับใช้แอปพลิเคชันของตนอย่างรวดเร็วและง่ายดายระหว่างผู้ให้บริการโฮสติ้งต่างๆ สำหรับการทดสอบและการตรวจสอบความถูกต้อง เพื่อที่จะกำหนดตัวเลือกที่ดีที่สุด แม้ว่า laaS จะเหมาะสมสำหรับการโฮสต์แอปพลิเคชัน แต่ก็จำเป็นต้องมีการกำหนดค่าเซิร์ฟเวอร์แอปพลิเคชันและไลบรารีมากเกินไปเพื่อทดสอบโค้ด ในทางกลับกัน PaaS จะจัดเตรียมสภาพแวดล้อมที่พร้อมใช้งานตั้งแต่เริ่มต้น DaaS ไม่เหมาะสมสำหรับนักพัฒนาซอฟต์แวร์ในการปรับใช้แอปพลิเคชันในทางใดทางหนึ่ง laaS จะไม่เหมาะสมในสถานการณ์นี้ เนื่องจากนักพัฒนาจะต้องปรับใช้และบำรุงรักษาอิมเมจระบบปฏิบัติการด้วย หรือต้องทำสัญญากับบริษัทอื่นเพื่อดำเนินการดังกล่าว SaaS ซึ่งเป็นแพลตฟอร์มซอฟต์แวร์ที่ทำงานได้อย่างสมบูรณ์นั้นไม่เหมาะสม"},{"id":206,"topic":1,"q":"You just hired an outside developer to modernize some applications with new web services and functionality. In order to implement a comprehensive test platform for validation, the developer needs a data set that resembles a production data set in both size and composition. In order to accomplish this, what type of masking would you use?","qth":"คุณเพิ่งจ้างนักพัฒนาภายนอกให้ปรับปรุงแอปพลิเคชันบางตัวให้ทันสมัยด้วยบริการเว็บและฟังก์ชันการทำงานใหม่ๆ เพื่อที่จะใช้แพลตฟอร์มการทดสอบที่ครอบคลุมสำหรับการตรวจสอบความถูกต้อง นักพัฒนาจำเป็นต้องมีชุดข้อมูลที่คล้ายกับชุดข้อมูลการผลิตทั้งขนาดและองค์ประกอบ เพื่อให้บรรลุเป้าหมายนี้ คุณจะใช้การมาสก์ประเภทใด","a":["Development","Replicated","Static","Dynamic"],"ath":["การพัฒนา","จำลองแบบแล้ว","คงที่","พลวัต"],"ans":"C","exp":"Static masking takes a data set and produces a copy of it, but with sensitive data fields masked. This allows for a full data set from production for testing purposes, but without any sensitive data. Dynamic masking works with a live system and is not used to produce a distinct copy. The terms \"replicated\" and \"development\" are not types of masking","expth":"การมาสก์แบบคงที่จะใช้ชุดข้อมูลและสร้างสำเนาของชุดข้อมูลนั้น แต่จะมีการปิดบังช่องข้อมูลที่ละเอียดอ่อนไว้ ซึ่งช่วยให้ชุดข้อมูลทั้งหมดจากการผลิตเพื่อวัตถุประสงค์ในการทดสอบ แต่ไม่มีข้อมูลที่ละเอียดอ่อนใดๆ การมาสก์แบบไดนามิกใช้งานได้กับระบบที่ใช้งานจริง และไม่ได้ใช้เพื่อสร้างสำเนาที่ชัดเจน คำว่า \"ทำซ้ำ\" และ \"การพัฒนา\" ไม่ใช่ประเภทของการปิดบัง"},{"id":207,"topic":1,"q":"In order to prevent cloud customers from potentially consuming enormous amounts of resources within a cloud environment and thus having a negative impact on other customers, what concept is commonly used by a cloud provider?","qth":"เพื่อป้องกันไม่ให้ลูกค้าระบบคลาวด์ใช้ทรัพยากรจำนวนมหาศาลภายในสภาพแวดล้อมระบบคลาวด์และส่งผลเสียต่อลูกค้ารายอื่น ผู้ให้บริการระบบคลาวด์ใช้แนวคิดใดโดยทั่วไป","a":["Limit","Cap","Throttle","Reservation"],"ath":["ขีดจำกัด","ขีดจำกัด","คันเร่ง","การจอง"],"ans":"A","exp":"A limit puts a maximum value on the amount of resources that may be consumed by either a system, a service, or a cloud customer. It is commonly used to prevent one entity from consuming enormous amounts of resources and having an operational impact on other tenants within the same cloud system. Limits can either be hard or somewhat flexible, meaning a customer can borrow from other customers while still having their actual limit preserved. A reservation is a guarantee to a cloud customer that a certain level of resources will always be available to them, regardless of what operational demands are currently placed on the cloud environment. Both cap and throttle are terms that sound similar to limit, but they are not the correct terms in this case","expth":"ขีดจำกัดจะกำหนดมูลค่าสูงสุดให้กับปริมาณทรัพยากรที่อาจใช้โดยระบบ บริการ หรือลูกค้าระบบคลาวด์ โดยทั่วไปจะใช้เพื่อป้องกันไม่ให้หน่วยงานหนึ่งใช้ทรัพยากรจำนวนมหาศาลและมีผลกระทบต่อการปฏิบัติงานกับผู้เช่ารายอื่นภายในระบบคลาวด์เดียวกัน ขีดจำกัดอาจยากหรือค่อนข้างยืดหยุ่น ซึ่งหมายความว่าลูกค้าสามารถยืมจากลูกค้ารายอื่นๆ ได้ในขณะที่ยังคงรักษาขีดจำกัดที่แท้จริงไว้ การจองเป็นการรับประกันให้กับลูกค้าระบบคลาวด์ว่าจะมีทรัพยากรในระดับหนึ่งอยู่เสมอ โดยไม่คำนึงถึงความต้องการในการปฏิบัติงานบนสภาพแวดล้อมระบบคลาวด์ในปัจจุบัน ทั้ง cap และ throttle เป็นคำที่ฟังดูคล้ายกับคำว่า Limit แต่ไม่ใช่คำที่ถูกต้องในกรณีนี้"},{"id":208,"topic":1,"q":"Where is a DLP solution generally installed when utilized for monitoring data at rest?","qth":"โดยทั่วไปโซลูชัน DLP จะติดตั้งไว้ที่ใดเมื่อใช้สำหรับการตรวจสอบข้อมูลที่เหลือ","a":["Network firewall","Host system","Application server","Database server"],"ath":["ไฟร์วอลล์เครือข่าย","ระบบโฮสต์","เซิร์ฟเวอร์แอปพลิเคชัน","เซิร์ฟเวอร์ฐานข้อมูล"],"ans":"B","exp":"To monitor data at rest appropriately, the DLP solution would be installed on the host system where the data resides. A database server, in some situations, may be an appropriate answer, but the host system is the best answer because a database server is only one example of where data could reside. An application server processes data and typically sits between the data and presentation zones, and as such, does not store data at rest. A network firewall would be more appropriate for data in transit because it is not a place where data would reside","expth":"ในการตรวจสอบข้อมูลที่เหลืออย่างเหมาะสม โซลูชัน DLP จะถูกติดตั้งบนระบบโฮสต์ที่มีข้อมูลอยู่ ในบางสถานการณ์ เซิร์ฟเวอร์ฐานข้อมูลอาจเป็นคำตอบที่เหมาะสม แต่ระบบโฮสต์คือคำตอบที่ดีที่สุด เนื่องจากเซิร์ฟเวอร์ฐานข้อมูลเป็นเพียงตัวอย่างหนึ่งของตำแหน่งข้อมูลที่อาจมีอยู่ แอปพลิเคชันเซิร์ฟเวอร์จะประมวลผลข้อมูลและโดยทั่วไปจะอยู่ระหว่างข้อมูลและโซนการนำเสนอ ด้วยเหตุนี้จึงไม่จัดเก็บข้อมูลที่อยู่นิ่ง ไฟร์วอลล์เครือข่ายจะเหมาะสมกว่าสำหรับข้อมูลที่อยู่ระหว่างทางเนื่องจากไม่ใช่ที่ที่ข้อมูลจะอยู่"},{"id":209,"topic":1,"q":"Which of the following aspects of security is solely the responsibility of the cloud provider?","qth":"ความปลอดภัยด้านใดต่อไปนี้เป็นความรับผิดชอบของผู้ให้บริการคลาวด์แต่เพียงผู้เดียว","a":["Regulatory compliance","Physical security","Operating system auditing","Personal security of developers"],"ath":["การปฏิบัติตามกฎระเบียบ","ความปลอดภัยทางกายภาพ","การตรวจสอบระบบปฏิบัติการ","ความปลอดภัยส่วนบุคคลของนักพัฒนา"],"ans":"B","exp":"Regardless of the particular cloud service used, physical security of hardware and facilities is always the sole responsibility of the cloud provider. The cloud provider may release information about their physical security policies and procedures to ensure any particular requirements of potential customers will meet their regulatory obligations. Personal security of developers and regulatory compliance are always the responsibility of the cloud customer. Responsibility for operating systems, and the auditing of them, will differ based on the cloud service category used","expth":"ไม่ว่าบริการคลาวด์ที่ใช้โดยเฉพาะ การรักษาความปลอดภัยทางกายภาพของฮาร์ดแวร์และสิ่งอำนวยความสะดวกจะเป็นความรับผิดชอบของผู้ให้บริการคลาวด์แต่เพียงผู้เดียวเสมอ ผู้ให้บริการระบบคลาวด์อาจเปิดเผยข้อมูลเกี่ยวกับนโยบายและขั้นตอนด้านความปลอดภัยทางกายภาพเพื่อให้แน่ใจว่าข้อกำหนดเฉพาะของผู้มีโอกาสเป็นลูกค้าจะเป็นไปตามภาระผูกพันด้านกฎระเบียบของพวกเขา ความปลอดภัยส่วนบุคคลของนักพัฒนาและการปฏิบัติตามกฎระเบียบถือเป็นความรับผิดชอบของลูกค้าระบบคลาวด์เสมอ ความรับผิดชอบสำหรับระบบปฏิบัติการและการตรวจสอบจะแตกต่างกันไปตามหมวดหมู่บริการคลาวด์ที่ใช้"},{"id":210,"topic":1,"q":"Humidity levels for a data center are a prime concetn for maintaining electrical and computing resources properly as well as ensuring that conditions are optimal for top performance Which of the following is the optimal humidity level, as established by ASHRAE?","qth":"ระดับความชื้นสำหรับศูนย์ข้อมูลเป็นแนวคิดหลักสำหรับการบำรุงรักษาทรัพยากรไฟฟ้าและคอมพิวเตอร์อย่างเหมาะสม ตลอดจนสร้างความมั่นใจว่าสภาวะต่างๆ เหมาะสมที่สุดเพื่อประสิทธิภาพสูงสุด ข้อใดต่อไปนี้คือระดับความชื้นที่เหมาะสมที่สุด ตามที่ ASHRAE กำหนด","a":["20 to 40 percent relative humidity","50 to 75 percent relative humidity","40 to 60 percent relative humidity","30 to 50 percent relative humidity"],"ath":["ความชื้นสัมพัทธ์ 20 ถึง 40 เปอร์เซ็นต์","ความชื้นสัมพัทธ์ 50 ถึง 75 เปอร์เซ็นต์","ความชื้นสัมพัทธ์ 40 ถึง 60 เปอร์เซ็นต์<","ความชื้นสัมพัทธ์ 30 ถึง 50 เปอร์เซ็นต์ ความชื้น"],"ans":"C","exp":"The American Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE) recommends 40 to 60 percent relatively humidity for data centers None of these options is the recommendation from ASHRAE","expth":"The American Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE) แนะนำความชื้นสัมพัทธ์ 40 ถึง 60 เปอร์เซ็นต์สำหรับศูนย์ข้อมูล ไม่มีตัวเลือกใดเหล่านี้เป็นคำแนะนำจาก ASHRAE"},{"id":211,"topic":1,"q":"Within a SaaS environment, what is the responsibility on the part of the cloud customer in regard to procuring the software used?","qth":"ภายในสภาพแวดล้อม SaaS ลูกค้าคลาวด์มีความรับผิดชอบอะไรในการจัดหาซอฟต์แวร์ที่ใช้","a":["Maintenance","Licensing","Development","Purchasing"],"ath":["การบำรุงรักษา","การออกใบอนุญาต","การพัฒนา","การจัดซื้อ"],"ans":"B","exp":"Within a SaaS implementation, the cloud customer licenses the use of the software from the cloud provider because SaaS delivers a fully functional application to the customer. With SaaS, the cloud provider is responsible for the entire software application and any necessary infrastructure to develop, run, and maintain it The purchasing, development, and maintenance are fully the responsibility of the cloud provider","expth":"ภายในการใช้งาน SaaS ลูกค้าคลาวด์จะออกใบอนุญาตการใช้ซอฟต์แวร์จากผู้ให้บริการคลาวด์ เนื่องจาก SaaS มอบแอปพลิเคชันที่ทำงานได้อย่างสมบูรณ์ให้กับลูกค้า ด้วย SaaS ผู้ให้บริการคลาวด์จะรับผิดชอบแอปพลิเคชันซอฟต์แวร์ทั้งหมดและโครงสร้างพื้นฐานที่จำเป็นในการพัฒนา ใช้งาน และบำรุงรักษา การจัดซื้อ การพัฒนา และการบำรุงรักษาถือเป็นความรับผิดชอบของผู้ให้บริการคลาวด์อย่างเต็มที่"},{"id":212,"topic":1,"q":"Implementing baselines on systems would take an enormous amount of time and resources if the staff had to apply them to each server, and over time, it would be almost impossible to keep all the systems in sync on an ongoing basis Which of the following is NOT a package that can be used for implementing and maintaining baselines across an enterprise?","qth":"การนำพื้นฐานไปใช้ในระบบจะต้องใช้เวลาและทรัพยากรจำนวนมหาศาลหากพนักงานต้องนำไปใช้กับเซิร์ฟเวอร์แต่ละเครื่อง และเมื่อเวลาผ่านไป แทบเป็นไปไม่ได้เลยที่จะซิงค์ระบบทั้งหมดอย่างต่อเนื่องอย่างต่อเนื่อง ข้อใดต่อไปนี้ไม่ใช่แพ็คเกจที่สามารถนำมาใช้สำหรับการดำเนินการและบำรุงรักษาพื้นฐานทั่วทั้งองค์กร","a":["Puppet","SCCM","Chef","GitHub"],"ath":["หุ่นเชิด","สคซีเอ็ม","เชฟ","GitHub"],"ans":"D","exp":"GitHub is a software development platform that serves as a code repository and versioning system. It is solely used for software development and would not be appropriate for applying baselines to systems. Puppet is an open-source configuration management tool that runs on many platforms and can be used to apply and maintain baselines. The Software Center Configuration Manager (SCCM) was developed by Microsoft for managing systems across large groups of servers Chef is also a system for maintaining large groups of systems throughout an enterprise","expth":"GitHub เป็นแพลตฟอร์มการพัฒนาซอฟต์แวร์ที่ทำหน้าที่เป็นที่เก็บโค้ดและระบบการกำหนดเวอร์ชัน ใช้สำหรับการพัฒนาซอฟต์แวร์เท่านั้น และไม่เหมาะสมสำหรับการประยุกต์ใช้พื้นฐานกับระบบ Puppet เป็นเครื่องมือการจัดการการกำหนดค่าแบบโอเพ่นซอร์สที่ทำงานบนหลายแพลตฟอร์ม และสามารถใช้เพื่อนำไปใช้และรักษาพื้นฐานได้ Software Center Configuration Manager (SCCM) ได้รับการพัฒนาโดย Microsoft สำหรับการจัดการระบบข้ามเซิร์ฟเวอร์กลุ่มใหญ่ นอกจากนี้ Chef ยังเป็นระบบสำหรับบำรุงรักษาระบบกลุ่มใหญ่ทั่วทั้งองค์กร"},{"id":213,"topic":1,"q":"From the perspective of compliance, what is the most important consideration when it comes to data center location?","qth":"จากมุมมองของการปฏิบัติตามข้อกำหนด ข้อพิจารณาที่สำคัญที่สุดเมื่อพูดถึงที่ตั้งศูนย์ข้อมูลคืออะไร","a":["Natural disasters","Utility access","Jurisdiction","Personnel access"],"ath":["ภัยธรรมชาติ","การเข้าถึงสาธารณูปโภค","เขตอำนาจศาล","การเข้าถึงบุคลากร"],"ans":"C","exp":"Jurisdiction will dictate much of the compliance and audit requirements for a data center. Although all the aspects listed are very important to security, from a strict compliance perspective, jurisdiction is the most important. Personnel access, natural disasters, and utility access are all important operational considerations for selecting a data center location, but they are not related to compliance issues like jurisdiction is","expth":"เขตอำนาจศาลจะกำหนดข้อกำหนดส่วนใหญ่ในการปฏิบัติตามข้อกำหนดและการตรวจสอบสำหรับศูนย์ข้อมูล แม้ว่าทุกประเด็นที่ระบุไว้จะมีความสำคัญมากต่อการรักษาความปลอดภัย แต่จากมุมมองของการปฏิบัติตามข้อกำหนดที่เข้มงวด เขตอำนาจศาลก็มีความสำคัญที่สุด การเข้าถึงบุคลากร ภัยพิบัติทางธรรมชาติ และการเข้าถึงสาธารณูปโภค ล้วนเป็นข้อพิจารณาในการปฏิบัติงานที่สำคัญในการเลือกที่ตั้งศูนย์ข้อมูล แต่ไม่เกี่ยวข้องกับปัญหาการปฏิบัติตามกฎระเบียบ เช่น เขตอำนาจศาล"},{"id":214,"topic":1,"q":"Different certifications and standards take different approaches to data center design and operations. Although many traditional approaches use a tiered methodology, which of the following utilizes a macro-level approach to data center design?","qth":"การรับรองและมาตรฐานที่แตกต่างกันใช้แนวทางการออกแบบและการดำเนินงานศูนย์ข้อมูลที่แตกต่างกัน แม้ว่าวิธีการดั้งเดิมหลายวิธีจะใช้วิธีการแบบเป็นชั้น แต่วิธีใดต่อไปนี้ใช้แนวทางระดับมหภาคในการออกแบบศูนย์ข้อมูล","a":["IDCA","BICSI","Uptime Institute","NFPA"],"ath":["ไอดีซีเอ","บิกซี่","สถาบันอัพไทม์","ส.ส.อ"],"ans":"A","exp":"The Infinity Paradigm of the International Data Center Authority (IDCA) takes a macro-level approach to data center design. The IDCA does not use a specific, focused approach on specific components to achieve tier status. Building Industry Consulting Services International (BICSI) issues certifications for data center cabling. The National Fire Protection Association (NFPA) publishes a broad range of fire safety and design standards for many different types of facilities. The Uptime Institute publishes the most widely known and used standard for data center topologies and tiers","expth":"กระบวนทัศน์อันไม่มีที่สิ้นสุดของหน่วยงานศูนย์ข้อมูลระหว่างประเทศ (IDCA) ใช้แนวทางระดับมหภาคในการออกแบบศูนย์ข้อมูล IDCA ไม่ได้ใช้แนวทางเฉพาะเจาะจงกับองค์ประกอบเฉพาะเพื่อให้ได้สถานะระดับ Building Industry Consulting Services International (BICSI) ออกใบรับรองสำหรับสายเคเบิลศูนย์ข้อมูล สมาคมป้องกันอัคคีภัยแห่งชาติ (NFPA) เผยแพร่มาตรฐานความปลอดภัยจากอัคคีภัยและการออกแบบที่หลากหลายสำหรับสิ่งอำนวยความสะดวกประเภทต่างๆ Uptime Institute เผยแพร่มาตรฐานที่เป็นที่รู้จักและใช้กันอย่างแพร่หลายที่สุดสำหรับโทโพโลยีและระดับของศูนย์ข้อมูล"},{"id":215,"topic":1,"q":"The European Union is often considered the world leader in regard to the privacy of personal data and has declared privacy to be a “human right” In what year did the EU first assert this principle?","qth":"สหภาพยุโรปมักถูกมองว่าเป็นผู้นำระดับโลกในด้านความเป็นส่วนตัวของข้อมูลส่วนบุคคล และได้ประกาศให้ความเป็นส่วนตัวเป็น “สิทธิมนุษยชน” ในปีใดที่สหภาพยุโรปยืนยันหลักการนี้เป็นครั้งแรก","a":["1995,","2000","2010","1999"],"ath":["1995,","2000","2010","1999"],"ans":"A","exp":"The EU passed Directive 95/46 EC in 1995, which established data privacy as a human right. The other years listed are incorrect","expth":"สหภาพยุโรปผ่าน Directive 95/46 EC ในปี 1995 ซึ่งกำหนดความเป็นส่วนตัวของข้อมูล เป็นสิทธิมนุษยชน ปีอื่นๆ ที่แสดงไว้ไม่ถูกต้อง"},{"id":216,"topic":1,"q":"ADLP solution/implementation has three main components. Which of the following is NOT one of the three main components?","qth":"โซลูชัน/การใช้งาน ADLP มีองค์ประกอบหลักสามประการ ข้อใดต่อไปนี้ไม่ใช่หนึ่งในสามองค์ประกอบหลัก","a":["Monitoring","Enforcement","Auditing","Discovery and classification"],"ath":["การตรวจสอบ","การบังคับใช้","การตรวจสอบ","การค้นพบและการจำแนกประเภท"],"ans":"C","exp":"Auditing, which can be supported to varying degrees by DLP solutions, is not a core component of them. Data loss prevention (DLP) solutions have core components of discovery and classification, enforcement, and monitoring. Discovery and classification are concerned with determining which data should be applied to the DLP policies, and then determining its classification level. Monitoring is concerned with the actual watching of data and how it's used through its various stages. Enforcement is the actual application of policies determined from the discovery stage and then triggered during the monitoring stage","expth":"การตรวจสอบซึ่งสามารถรองรับระดับที่แตกต่างกันโดยโซลูชัน DLP ไม่ใช่องค์ประกอบหลักขององค์ประกอบเหล่านั้น โซลูชันการป้องกันข้อมูลสูญหาย (DLP) มีองค์ประกอบหลักในการค้นหาและการจัดประเภท การบังคับใช้ และการตรวจสอบ การค้นพบและการจำแนกประเภทเกี่ยวข้องกับการกำหนดว่าข้อมูลใดที่ควรนำไปใช้กับนโยบาย DLP จากนั้นจึงกำหนดระดับการจำแนกประเภท การตรวจสอบเกี่ยวข้องกับการเฝ้าดูข้อมูลจริงและวิธีการใช้งานผ่านขั้นตอนต่างๆ การบังคับใช้เป็นการนำนโยบายไปใช้จริงซึ่งกำหนดจากขั้นตอนการค้นพบ จากนั้นจึงทริกเกอร์ในระหว่างขั้นตอนการติดตาม"},{"id":217,"topic":1,"q":"What type of storage structure does object storage employ to maintain files?","qth":"โครงสร้างหน่วยเก็บข้อมูลประเภทใดที่หน่วยเก็บข้อมูลอ็อบเจ็กต์ใช้เพื่อรักษาไฟล์?","a":["Directory","Hierarchical","tree","Flat"],"ath":["ไดเร็กทอรี","ลำดับชั้น","แผนผัง","แฟลต"],"ans":"D","exp":"Object storage uses a flat file system to hold storage objects; it assigns files a key value that is then used to access them, rather than relying on directories or descriptive filenames. Typical storage layouts such as tree, directory, and hierarchical structures are used within volume storage, whereas object storage maintains a flat structure with key values","expth":"หน่วยเก็บข้อมูลอ็อบเจ็กต์ใช้ระบบไฟล์แบบแฟลตเพื่อเก็บอ็อบเจ็กต์หน่วยเก็บข้อมูล โดยจะกำหนดค่าคีย์ให้กับไฟล์ที่จะใช้ในการเข้าถึง แทนที่จะอาศัยไดเร็กทอรีหรือชื่อไฟล์ที่สื่อความหมาย เค้าโครงพื้นที่จัดเก็บข้อมูลทั่วไป เช่น แผนภูมิ ไดเร็กทอรี และโครงสร้างลำดับชั้นจะใช้ภายในพื้นที่จัดเก็บวอลุ่ม ในขณะที่พื้นที่จัดเก็บอ็อบเจ็กต์จะรักษาโครงสร้างเรียบๆ ที่มีค่าคีย์"},{"id":218,"topic":1,"q":"Which cloud storage type requires special consideration on the part of the cloud customer to ensure they do not program themselves into a vendor lock-in situation?","qth":"ที่เก็บข้อมูลบนคลาวด์ประเภทใดที่ต้องพิจารณาเป็นพิเศษจากลูกค้าคลาวด์ เพื่อให้แน่ใจว่าพวกเขาไม่ได้ตั้งโปรแกรมตัวเองให้อยู่ในสถานการณ์ที่ผู้ขายล็อคอิน","a":["Unstructured","Object","Volume","Structured"],"ath":["ไม่มีโครงสร้าง","วัตถุ","ปริมาณ","มีโครงสร้าง"],"ans":"D","exp":"Structured storage is designed, maintained, and implemented by a cloud service provider as part of a PaaS offering. It is specificto that cloud provider and the way they have opted to implement systems, so special care is required to ensure that applications are not designed in a way that will lock the cloud customer into a specific cloud provider with that dependency. Unstructured storage for auxiliary files would not lock a customer into a specific provider. With volume and object storage, because the cloud customer maintains their own systems with laaS, moving and replicating to a different cloud provider would be very easy","expth":"พื้นที่จัดเก็บข้อมูลที่มีโครงสร้างได้รับการออกแบบ ดูแลรักษา และนำไปใช้โดยผู้ให้บริการระบบคลาวด์ โดยเป็นส่วนหนึ่งของข้อเสนอ PaaS เป็นเรื่องเฉพาะเจาะจงสำหรับผู้ให้บริการคลาวด์รายนั้นและวิธีการที่พวกเขาเลือกใช้ระบบ ดังนั้นจึงจำเป็นต้องมีการดูแลเป็นพิเศษเพื่อให้แน่ใจว่าแอปพลิเคชันไม่ได้ได้รับการออกแบบในลักษณะที่จะล็อคลูกค้าคลาวด์เข้ากับผู้ให้บริการคลาวด์รายใดรายหนึ่งที่มีการพึ่งพานั้น พื้นที่จัดเก็บข้อมูลที่ไม่มีโครงสร้างสำหรับไฟล์เสริมจะไม่ล็อคลูกค้าเข้ากับผู้ให้บริการรายใดรายหนึ่ง ด้วยพื้นที่จัดเก็บปริมาณและอ็อบเจ็กต์ เนื่องจากลูกค้าคลาวด์ดูแลรักษาระบบของตนเองด้วย laaS การย้ายและการจำลองไปยังผู้ให้บริการคลาวด์รายอื่นจึงเป็นเรื่องง่ายมาก"},{"id":219,"topic":1,"q":"Which cloud deployment model would be i","qth":"โมเดลการปรับใช้ระบบคลาวด์แบบใดที่จะเป็นแบบ i","a":["Private","Public","Hybrid","Community"],"ath":["ส่วนตัว","สาธารณะ","ไฮบริด","ชุมชน"],"ans":"D","exp":"A community cloud is owned and maintained by similar organizations working toward a common goal. In this case, the universities would all have very similar needs and calendar requirements, and they would not be financial competitors of each other. Therefore, this would be an i","expth":"ระบบคลาวด์ชุมชนเป็นเจ้าของและดูแลรักษาโดยองค์กรที่คล้ายกันซึ่งทำงานเพื่อบรรลุเป้าหมายร่วมกัน ในกรณีนี้ มหาวิทยาลัยทุกแห่งจะมีความต้องการและข้อกำหนดปฏิทินที่คล้ายกันมากและจะไม่ใช่คู่แข่งทางการเงินของกันและกัน ดังนั้น นี่จะเป็น i"},{"id":220,"topic":1,"q":"Data centers have enormous power resources that are distributed and consumed throughout the entire facility Which of the following standards pertains to the proper fire safety standards within that scope?","qth":"ศูนย์ข้อมูลมีแหล่งพลังงานจำนวนมหาศาลที่กระจายและใช้ทั่วทั้งสถานที่ มาตรฐานใดต่อไปนี้ที่เกี่ยวข้องกับมาตรฐานความปลอดภัยจากอัคคีภัยที่เหมาะสมภายในขอบเขตนั้น","a":["IDCA","BICSI","NFPA","Uptime Institute"],"ath":["IDCA","BICSI","NFPA","Uptime Institute"],"ans":"C","exp":"The National Fire Protection Association (NFPA) publishes a broad range of fire safety and design standards for many different types of facilities. Building Industry Consulting Services International (BICSI) issues certifications for data center cabling. The Uptime Institute publishes the most widely known and used standard for data center topologies and tiers. The International Data Center Authority (IDCA) offers the Infinity Paradigm, which takes a macro-level approach to data center design","expth":"สมาคมป้องกันอัคคีภัยแห่งชาติ (NFPA) เผยแพร่มาตรฐานความปลอดภัยจากอัคคีภัยและการออกแบบที่หลากหลายสำหรับสิ่งอำนวยความสะดวกประเภทต่างๆ มากมาย Building Industry Consulting Services International (BICSI) ออกใบรับรองสำหรับสายเคเบิลศูนย์ข้อมูล Uptime Institute เผยแพร่มาตรฐานที่เป็นที่รู้จักและใช้กันอย่างแพร่หลายที่สุดสำหรับโทโพโลยีและระดับของศูนย์ข้อมูล หน่วยงานศูนย์ข้อมูลระหว่างประเทศ (IDCA) นำเสนอ Infinity Paradigm ซึ่งใช้แนวทางระดับมหภาคในการออกแบบศูนย์ข้อมูล"},{"id":221,"topic":1,"q":"Which of the following threat types involves an application that does not validate authorization for portions of itself beyond when the user first enters it?","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับแอปพลิเคชันที่ไม่ตรวจสอบการอนุญาตสำหรับส่วนของตัวเองนอกเหนือจากเมื่อผู้ใช้เข้ามาครั้งแรก","a":["Cross-site request forgery","Missing function-level access control","Injection","Cross-site scripting"],"ath":["การปลอมแปลงคำขอข้ามไซต์","การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การฉีด","การเขียนสคริปต์ข้ามไซต์"],"ans":"B","exp":"Itis imperative that applications do checks when each function or portion of the application is accessed to ensure that the user is properly authorized. Without continual checks each time a function is accessed, an attacker could forge requests to access portions of the application where authorization has not been granted. An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part of its normal processing and queries. Cross-site scripting occurs when an attacker is able to send untrusted data to a user's browser without going through validation processes. Cross-site request forgery occurs when an attack forces an authenticated user to send forged requests to","expth":"มีความจำเป็นที่แอปพลิเคชันจะต้องตรวจสอบเมื่อมีการเข้าถึงแต่ละฟังก์ชันหรือส่วนของแอปพลิเคชันเพื่อให้แน่ใจว่า ผู้ใช้ได้รับอนุญาตอย่างถูกต้อง หากไม่มีการตรวจสอบอย่างต่อเนื่องในแต่ละครั้งที่มีการเข้าถึงฟังก์ชัน ผู้โจมตีสามารถปลอมแปลงคำขอเพื่อเข้าถึงบางส่วนของแอปพลิเคชันที่ไม่ได้รับอนุญาตได้ การโจมตีแบบฉีดคือการที่ผู้ประสงค์ร้ายส่งคำสั่งหรือข้อมูลที่กำหนดเองอื่น ๆ ผ่านทางช่องป้อนข้อมูลและช่องข้อมูลโดยมีจุดประสงค์เพื่อให้แอปพลิเคชันหรือระบบดำเนินการโค้ดซึ่งเป็นส่วนหนึ่งของการประมวลผลและการสืบค้นตามปกติ การเขียนสคริปต์ข้ามไซต์เกิดขึ้นเมื่อผู้โจมตีสามารถส่งข้อมูลที่ไม่น่าเชื่อถือไปยังเบราว์เซอร์ของผู้ใช้โดยไม่ต้องผ่านกระบวนการตรวจสอบ การปลอมแปลงคำขอข้ามไซต์เกิดขึ้นเมื่อการโจมตีบังคับให้ผู้ใช้ที่ได้รับการรับรองความถูกต้องส่งคำขอปลอมไป"},{"id":223,"topic":1,"q":"Although the REST API supports a wide variety of data formats for communications and exchange, which data formats are the most commonly used?","qth":"แม้ว่า REST API จะรองรับรูปแบบข้อมูลที่หลากหลายสำหรับการสื่อสารและการแลกเปลี่ยน รูปแบบข้อมูลใดที่ใช้บ่อยที่สุด?","a":["SAML and HTML","XML and SAML","XML and JSON","JSON and SAML"],"ath":["SAML และ HTML","XML และ SAML","XML และ JSON","JSON และ SAML"],"ans":"C","exp":"JavaScript Object Notation (JSON) and Extensible Markup Language (XML) are the most commonly used data formats for the Representational State Transfer (REST) API and are typically implemented with caching for increased scalability and performance. Extensible Markup Language (XML) and Security Assertion Markup Language (SAML) are both standards for exchanging encoded data between two parties, with XML being for more general use and SAML focused on authentication and authorization data. HTML is used for authoring web pages for consumption by web browsers","expth":"JavaScript Object Notation (JSON) และ Extensible Markup Language (XML) เป็นรูปแบบข้อมูลที่ใช้บ่อยที่สุดสำหรับ Representational State Transfer (REST) API และโดยทั่วไปจะใช้งานพร้อมกับแคชเพื่อเพิ่มความสามารถในการปรับขนาดและประสิทธิภาพ Extensible Markup Language (XML) และ Security Assertion Markup Language (SAML) เป็นทั้งมาตรฐานสำหรับการแลกเปลี่ยนข้อมูลที่เข้ารหัสระหว่างสองฝ่าย โดยที่ XML นั้นมีไว้สำหรับการใช้งานทั่วไปมากกว่า และ SAML จะเน้นไปที่ข้อมูลการตรวจสอบสิทธิ์และการอนุญาต HTML ใช้สำหรับการเขียนหน้าเว็บเพื่อให้เว็บเบราว์เซอร์ใช้งาน"},{"id":224,"topic":1,"q":"The share phase of the cloud data lifecycle involves allowing data to leave the application, to be shared with external systems, services, or even other vendors/ contractors. What technology would be useful for protecting data at this point? AIDS","qth":"ระยะการแบ่งปันของวงจรการใช้งานข้อมูลบนคลาวด์เกี่ยวข้องกับการอนุญาตให้ข้อมูลออกจากแอปพลิเคชัน เพื่อแบ่งปันกับระบบภายนอก บริการ หรือแม้แต่ผู้จำหน่าย/ผู้รับเหมารายอื่น เทคโนโลยีใดที่จะเป็นประโยชน์ในการปกป้องข้อมูล ณ จุดนี้? เอดส์","a":["IPS","DLP","IPS","WAF"],"ath":["ไอพีเอส","ดีแอลพี","ไอพีเอส","วัฟ"],"ans":"B","exp":"Data loss prevention (DLP) solutions allow for control of data outside of the application or original system. They can enforce granular control such as printing, copying, and being read by others, as well as forcing expiration of access. Intrusion detection system (IDS) and intrusion prevention system (IPS) solutions are used for detecting and blocking suspicious and malicious traffic, respectively, whereas a web application firewall (WAF) is used for enforcing security or other controls on web based applications","expth":"โซลูชันการป้องกันข้อมูลสูญหาย (DLP) ช่วยให้สามารถควบคุมข้อมูลภายนอกแอปพลิเคชันหรือระบบดั้งเดิมได้ พวกเขาสามารถบังคับใช้การควบคุมโดยละเอียด เช่น การพิมพ์ การคัดลอก และการอ่านโดยผู้อื่น รวมถึงการบังคับให้การเข้าถึงหมดอายุ โซลูชันระบบตรวจจับการบุกรุก (IDS) และระบบป้องกันการบุกรุก (IPS) ใช้สำหรับตรวจจับและบล็อกการรับส่งข้อมูลที่น่าสงสัยและเป็นอันตราย ตามลำดับ ในขณะที่ไฟร์วอลล์แอปพลิเคชันเว็บ (WAF) ใช้เพื่อบังคับใช้ความปลอดภัยหรือการควบคุมอื่นๆ บนแอปพลิเคชันบนเว็บ"},{"id":225,"topic":1,"q":"When an APIis being leveraged, it wll encapsulate its data for transmission back to the requesting party or service What is the data encapsulation used with the SOAP protocol referred to as?","qth":"เมื่อมีการใช้ประโยชน์จาก API มันจะห่อหุ้มข้อมูลเพื่อส่งกลับไปยังฝ่ายที่ร้องขอหรือบริการ การห่อหุ้มข้อมูลที่ใช้กับโปรโตคอล SOAP คืออะไร","a":["Packet","Payload","Object","Envelope"],"ath":["แพ็คเก็ต","น้ำหนักบรรทุก","Object","ซองจดหมาย"],"ans":"D","exp":"Simple Object Access Protocol (SOAP) encapsulates its information in what is known as a SOAP envelope. It then leverages common communications protocols for transmission. Object is a type of cloud storage, but also a commonly used term with certain types of programming languages. Packet and payload are terms that sound similar to envelope but are not correct in this case","expth":"Simple Object Access Protocol (SOAP) จะห่อหุ้มข้อมูลในสิ่งที่เรียกว่าซอง SOAP จากนั้นจะใช้ประโยชน์จากโปรโตคอลการสื่อสารทั่วไปสำหรับการส่งข้อมูล Object คือพื้นที่เก็บข้อมูลบนคลาวด์ประเภทหนึ่ง แต่ยังเป็นคำที่ใช้กันทั่วไปกับภาษาการเขียนโปรแกรมบางประเภท แพ็คเก็ตและเพย์โหลดเป็นคำที่ฟังดูคล้ายกับซองจดหมาย แต่ในกรณีนี้จะไม่ถูกต้อง"},{"id":226,"topic":1,"q":"From a security perspective, what component of a cloud computing infrastructure represents the biggest concern?","qth":"จากมุมมองด้านความปลอดภัย องค์ประกอบใดของโครงสร้างพื้นฐานการประมวลผลแบบคลาวด์ที่แสดงถึงข้อกังวลที่ใหญ่ที่สุด","a":["Hypervisor","Management plane","Object storage","Encryption"],"ath":["ไฮเปอร์ไวเซอร์","ระนาบการจัดการ","พื้นที่จัดเก็บอ็อบเจ็กต์","การเข้ารหัส"],"ans":"B","exp":"The management plane will have broad administrative access to all host systems throughout an environment; as such, it represents the most pressing security concerns A compromise of the management plane can directly lead to compromises of any other systems within the environment. Although hypervisors represent a significant security concern to an environment because their compromise would expose any virtual systems hosted within them, the management plane is a better choice in this case because it controls multiple hypervisors. Encryption and object storage both represent lower-level security concerns","expth":"ระนาบการจัดการจะสามารถเข้าถึงระบบโฮสต์ทั้งหมดในระดับผู้ดูแลระบบได้ทั่วทั้งสภาพแวดล้อม ด้วยเหตุนี้ จึงแสดงถึงข้อกังวลด้านความปลอดภัยที่เร่งด่วนที่สุด การประนีประนอมของระนาบการจัดการสามารถนำไปสู่การประนีประนอมของระบบอื่น ๆ ภายในสภาพแวดล้อมได้โดยตรง แม้ว่าไฮเปอร์ไวเซอร์จะแสดงถึงข้อกังวลด้านความปลอดภัยที่สำคัญต่อสภาพแวดล้อม เนื่องจากการประนีประนอมจะทำให้ระบบเสมือนใดๆ ที่โฮสต์อยู่ภายในนั้น ระนาบการจัดการเป็นตัวเลือกที่ดีกว่าในกรณีนี้ เนื่องจากมีการควบคุมไฮเปอร์ไวเซอร์หลายตัว การเข้ารหัสและการจัดเก็บอ็อบเจ็กต์แสดงถึงข้อกังวลด้านความปลอดภัยระดับล่าง"},{"id":227,"topic":1,"q":"Which of the following is NOT one of the main intended goals of a DLP solution?","qth":"ข้อใดต่อไปนี้ไม่ใช่เป้าหมายหลักประการหนึ่งของโซลูชัน DLP","a":["Showing due diligence (EEX)","Preventing malicious insiders","Regulatory compliance","Managing and minimizing risk"],"ath":["การแสดงการตรวจสอบสถานะ (EEX)","การป้องกันบุคคลภายในที่เป็นอันตราย","การปฏิบัติตามกฎระเบียบ","การจัดการและการลดความเสี่ยง"],"ans":"B","exp":"Data loss prevention (DLP) extends the capabilities for data protection beyond the standard and traditional security controls that are offered by operating systems, application containers, and network devices. DLP is not specifically implemented to counter malicious insiders, and would not be particularly effective in doing so, because a malicious insider with legitimate access would have other ways to obtain data. DLP is a set of practices and controls to manage and minimize risk, comply with regulatory requirements, and show due diligence with the protection of data","expth":"การป้องกันข้อมูลสูญหาย (DLP) ขยายขีดความสามารถสำหรับการปกป้องข้อมูลที่เหนือกว่าการควบคุมความปลอดภัยมาตรฐานและแบบดั้งเดิมที่นำเสนอโดยระบบปฏิบัติการ คอนเทนเนอร์แอปพลิเคชัน และเครือข่าย อุปกรณ์ DLP ไม่ได้ถูกนำมาใช้โดยเฉพาะเพื่อตอบโต้บุคคลภายในที่ประสงค์ร้าย และจะไม่มีประสิทธิภาพเป็นพิเศษในการทำเช่นนั้น เนื่องจากบุคคลภายในที่เป็นอันตรายซึ่งมีการเข้าถึงที่ถูกต้องตามกฎหมายจะมีวิธีอื่นในการรับข้อมูล DLP คือชุดของแนวทางปฏิบัติและการควบคุมในการจัดการและลดความเสี่ยง ปฏิบัติตามข้อกำหนดด้านกฎระเบียบ และแสดงความรอบคอบด้วยการปกป้องข้อมูล"},{"id":228,"topic":1,"q":"Data center and operations design traditionally takes a tiered, topological approach, Which of the following standards is focused on that approach and is prevalently used throughout the industry?","qth":"การออกแบบศูนย์ข้อมูลและการดำเนินงานมักจะใช้แนวทางโทโพโลยีแบบเป็นชั้น มาตรฐานใดต่อไปนี้มุ่งเน้นไปที่แนวทางดังกล่าวและมีการใช้อย่างแพร่หลายทั่วทั้งอุตสาหกรรม","a":["IDCA","NFPA","BICSI","Uptime Institute"],"ath":["IDCA","NFPA","BICSI","Uptime Institute"],"ans":"D","exp":"The Uptime Institute publishes the most widely known and used standard for data center topologies and tiers. The National Fire Protection Association (NFPA) publishes a broad range of fire safety and design standards for many different types of facilities. Building Industry Consulting Services International (BICSI) issues certifications for data center cabling. The International Data Center Authority (IDCA) offers the Infinity Paradigm, which takes a macro-level approach to data center design","expth":"Uptime Institute เผยแพร่มาตรฐานที่เป็นที่รู้จักและใช้กันอย่างแพร่หลายที่สุดสำหรับโทโพโลยีและระดับของศูนย์ข้อมูล สมาคมป้องกันอัคคีภัยแห่งชาติ (NFPA) เผยแพร่มาตรฐานความปลอดภัยจากอัคคีภัยและการออกแบบที่หลากหลายสำหรับสิ่งอำนวยความสะดวกประเภทต่างๆ Building Industry Consulting Services International (BICSI) ออกใบรับรองสำหรับสายเคเบิลศูนย์ข้อมูล หน่วยงานศูนย์ข้อมูลระหว่างประเทศ (IDCA) นำเสนอ Infinity Paradigm ซึ่งใช้แนวทางระดับมหภาคในการออกแบบศูนย์ข้อมูล"},{"id":229,"topic":1,"q":"Jurisdictions have a broad range of privacy requirements pertaining to the handling of personal data and information. Which jurisdiction requires all storage and processing of data that pertains to its citizens to be done on hardware that is physically located within its borders?","qth":"เขตอำนาจศาลมีข้อกำหนดความเป็นส่วนตัวที่หลากหลายที่เกี่ยวข้องกับการจัดการข้อมูลส่วนบุคคลและข้อมูล เขตอำนาจศาลใดกำหนดให้การจัดเก็บและการประมวลผลข้อมูลทั้งหมดที่เกี่ยวข้องกับพลเมืองของตนทำบนฮาร์ดแวร์ซึ่งตั้งอยู่ภายในขอบเขตของตน","a":["Japan","United States","European Union","Russia"],"ath":["ญี่ปุ่น","สหรัฐอเมริกา","สหภาพยุโรป","รัสเซีย"],"ans":"D","exp":"The Russian government requires all data and processing of information about its citizens to be done solely on systems and applications that reside within the physical borders of the country. The United States, European Union, and Japan focus their data privacy laws on requirements and methods for the protection of data, rather than where the data physically resides","expth":"รัฐบาลรัสเซียกำหนดให้ข้อมูลและการประมวลผลข้อมูลเกี่ยวกับพลเมืองของตนทั้งหมดดำเนินการบนระบบและแอปพลิเคชันที่อยู่ภายในขอบเขตทางกายภาพของประเทศเท่านั้น สหรัฐอเมริกา สหภาพยุโรป และญี่ปุ่นให้ความสำคัญกับกฎหมายความเป็นส่วนตัวของข้อมูลไปที่ข้อกำหนดและวิธีการในการปกป้องข้อมูล แทนที่จะเป็นพื้นที่ที่มีข้อมูลอยู่จริง"},{"id":230,"topic":1,"q":"The management plane is used to administer a cloud environment and perform administrative tasks across a variety of systems, but most specifically it's used with the hypervisors What does the management plane typically leverage for this orchestration?","qth":"ส่วนการจัดการใช้เพื่อจัดการสภาพแวดล้อมคลาวด์และดำเนินงานด้านการดูแลระบบทั่วทั้งระบบต่างๆ แต่โดยเฉพาะอย่างยิ่ง มันถูกใช้กับไฮเปอร์ไวเซอร์ โดยทั่วไปแล้วระนาบการจัดการจะใช้ประโยชน์จากการจัดระเบียบนี้อย่างไร","a":["APIs","Scripts","TLS","XML"],"ath":["APIs","สคริปต์","TLS","XML"],"ans":"A","exp":"The management plane uses APIs to execute remote calls across the cloud environment to various management systems, especially hypervisors. This allows a centralized administrative interface, often a web portal, to orchestrate tasks throughout an enterprise. Scripts may be utilized to execute API calls, but they are not used directly to interact with systems. XML is used for data encoding and transmission, but not for executing remote calls. TLS is used to encrypt communications and may be used with API calls, but it is not the actual process for executing commands","expth":"ระนาบการจัดการใช้ API เพื่อดำเนินการเรียกระยะไกลผ่านสภาพแวดล้อมคลาวด์ไปยังระบบการจัดการต่างๆ โดยเฉพาะไฮเปอร์ไวเซอร์ ซึ่งช่วยให้อินเทอร์เฟซการดูแลระบบแบบรวมศูนย์ ซึ่งมักเป็นเว็บพอร์ทัล สามารถจัดระเบียบงานทั่วทั้งองค์กรได้ สคริปต์อาจใช้เพื่อดำเนินการเรียก API แต่จะไม่ได้ใช้โดยตรงเพื่อโต้ตอบกับระบบ XML ใช้สำหรับการเข้ารหัสและการส่งข้อมูล แต่ไม่ใช่สำหรับการโทรระยะไกล TLS ใช้เพื่อเข้ารหัสการสื่อสารและอาจใช้กับการเรียก API แต่ไม่ใช่กระบวนการจริงสำหรับการดำเนินการคำสั่ง"},{"id":231,"topic":1,"q":"When dealing with Pll, which category pertains to those requirements that can carty legal sanctions or penalties for failure to adequately safeguard the data and address compliance requirements?","qth":"เมื่อจัดการกับ Pll หมวดหมู่ใดที่เกี่ยวข้องกับข้อกำหนดเหล่านั้นที่สามารถลงโทษทางกฎหมายหรือบทลงโทษสำหรับความล้มเหลวในการปกป้องข้อมูลอย่างเพียงพอและปฏิบัติตามข้อกำหนดการปฏิบัติตามข้อกำหนด","a":["Contractual","Jurisdictional","Regulated","Legal"],"ath":["ตามสัญญา","เขตอำนาจศาล","ควบคุม","กฎหมาย"],"ans":"C","exp":"Regulated Pll pertains to data that is outlined in law and regulations. Violations of the requirements for the protection of regulated Pll can carry legal sanctions or penalties. Contractual Pll involves required data protection that is determined by the actual service contract between the cloud provider and cloud customer, rather than outlined by law. Violations of the provisions of contractual Pll carry potential financial or contractual implications, but not legal sanctions. Legal and jurisdictional are similar terms to regulated, but neither is the official term used","expth":"Regulated Pll เกี่ยวข้องกับข้อมูลที่ระบุไว้ในกฎหมายและข้อบังคับ การละเมิดข้อกำหนดสำหรับการคุ้มครอง Pll ที่มีการควบคุมสามารถดำเนินการคว่ำบาตรทางกฎหมายหรือบทลงโทษได้ Contractual Pll เกี่ยวข้องกับการปกป้องข้อมูลที่จำเป็นซึ่งกำหนดโดยสัญญาบริการจริงระหว่างผู้ให้บริการระบบคลาวด์และลูกค้าระบบคลาวด์ แทนที่จะกำหนดไว้โดยกฎหมาย การละเมิดบทบัญญัติของสัญญา Pll อาจมีผลกระทบทางการเงินหรือสัญญา แต่ไม่ใช่การลงโทษทางกฎหมาย กฎหมายและเขตอำนาจศาลเป็นข้อกำหนดที่คล้ายกันกับการควบคุม แต่ก็ไม่ได้ใช้คำที่เป็นทางการเช่นกัน"},{"id":232,"topic":1,"q":"Although the United States does not have a single, comprehensive privacy and regulatory framework, a number of specific regulations pertain to types of data or populations Which of the following is NOT a regulatory system from the United States federal government? AL HIPAA","qth":"แม้ว่าสหรัฐอเมริกาจะไม่มีกรอบความเป็นส่วนตัวและข้อบังคับที่ครอบคลุมเพียงข้อเดียว แต่มีข้อบังคับเฉพาะจำนวนหนึ่งที่เกี่ยวข้องกับประเภทของข้อมูลหรือประชากร ข้อใดต่อไปนี้ไม่ใช่ระบบการกำกับดูแลจากรัฐบาลกลางของสหรัฐอเมริกา อัลฮิปา","a":["HIPAA","SOX","FISMA","PCI-DSS"],"ath":["ฮิปา","สอกซ์","ฟิสมา","PCI-DSS"],"ans":"D","exp":"The Payment Card Industry Data Security Standard (PCI DSS) pertains to organizations that handle credit card transactions and is an industry-regulatory standard, not a governmental one. The Sarbanes-Oxley Act (SOX) was passed in 2002 and pertains to financial records and reporting, as well as transparency requirements for shareholders and other stakeholders. The Health Insurance Portability and Accountability Act (HIPAA) was passed in 1996 and pertains to data privacy and security for medical records. FISMA refers to the Federal Information Security Management Act of 2002 and pertains to the protection of all US federal government IT systems, with the exception of national security systems","expth":"มาตรฐานความปลอดภัยของข้อมูลอุตสาหกรรมบัตรชำระเงิน (PCI DSS) เกี่ยวข้องกับองค์กรที่จัดการธุรกรรมบัตรเครดิตและเป็นมาตรฐานการกำกับดูแลอุตสาหกรรม ไม่ใช่มาตรฐานของรัฐบาล Sarbanes-Oxley Act (SOX) ได้รับการอนุมัติในปี 2545 และเกี่ยวข้องกับบันทึกและการรายงานทางการเงิน รวมถึงข้อกำหนดด้านความโปร่งใสสำหรับผู้ถือหุ้นและผู้มีส่วนได้ส่วนเสียอื่นๆ กฎหมาย Health Insurance Portability and Accountability Act (HIPAA) ได้รับการอนุมัติในปี 1996 และเกี่ยวข้องกับความเป็นส่วนตัวและความปลอดภัยของข้อมูลสำหรับเวชระเบียน FISMA อ้างถึง Federal Information Security Management Act ปี 2002 และเกี่ยวข้องกับการคุ้มครองระบบ IT ของรัฐบาลกลางสหรัฐอเมริกาทั้งหมด ยกเว้นระบบรักษาความปลอดภัยแห่งชาติ"},{"id":233,"topic":1,"q":"The president of your company has tasked you with implementing cloud services as the most efficient way of obtaining a robust disaster recovery configuration for your production services Which of the cloud deployment models would you MOST likely be exploring?","qth":"ประธานบริษัทของคุณได้มอบหมายให้คุณนำบริการระบบคลาวด์ไปใช้เป็นวิธีที่มีประสิทธิภาพมากที่สุดในการรับการกำหนดค่าการกู้คืนระบบที่มีประสิทธิภาพสำหรับบริการการผลิตของคุณ โมเดลการปรับใช้ระบบคลาวด์ใดที่คุณน่าจะสำรวจมากที่สุด","a":["Hybrid CEE","Private","Community","Public"],"ath":["ไฮบริด CEE","ส่วนตัว","ชุมชน","สาธารณะ"],"ans":"A","exp":"A hybrid cloud model spans two more different hosting configurations or cloud providers. This would enable an organization to continue using its current hosting configuration, while adding additional cloud services to enable disaster recovery capabilities. The other cloud deployment models--public, private, and community would not be applicable for seeking a disaster recovery configuration where cloud services are to be leveraged for that purpose rather than production service hosting","expth":"โมเดลคลาวด์แบบไฮบริดครอบคลุมการกำหนดค่าโฮสติ้งหรือผู้ให้บริการคลาวด์ที่แตกต่างกันอีกสองแบบ สิ่งนี้จะช่วยให้องค์กรสามารถใช้การกำหนดค่าโฮสติ้งปัจจุบันต่อไปได้ ในขณะเดียวกันก็เพิ่มบริการคลาวด์เพิ่มเติมเพื่อเปิดใช้งานความสามารถในการกู้คืนระบบ โมเดลการปรับใช้ระบบคลาวด์อื่นๆ ได้แก่ สาธารณะ ส่วนตัว และชุมชน ไม่สามารถใช้ได้กับการค้นหาการกำหนดค่าการกู้คืนความเสียหาย โดยที่จะใช้บริการคลาวด์เพื่อวัตถุประสงค์ดังกล่าว แทนที่จะใช้การโฮสต์บริการที่ใช้งานจริง"},{"id":234,"topic":1,"q":"If you are running an application that has strict legal requirements that the data cannot reside on systems that contain other applications or systems, which aspect of cloud computing would be prohibitive in this case?","qth":"หากคุณใช้งานแอปพลิเคชันที่มีข้อกำหนดทางกฎหมายที่เข้มงวดซึ่งข้อมูลไม่สามารถอยู่บนระบบที่มีแอปพลิเคชันหรือระบบอื่นได้ แง่มุมใดของการประมวลผลแบบคลาวด์ที่อาจถูกห้ามในกรณีนี้","a":["Multitenancy","Broad network access","Portability","Elasticity"],"ath":["การเช่าหลายรายการ","การเข้าถึงเครือข่ายในวงกว้าง","การพกพา","ความยืดหยุ่น"],"ans":"D","exp":"Multitenancy is the aspect of cloud computing that involves having multiple customers and applications running within the same system and sharing the same resources. Although considerable mechanisms are in place to ensure isolation and separation, the data and applications are ultimately using shared resources. Broad network access refers to the ability to access cloud services from any location or client. Portability refers to the ability to easily move cloud services between different cloud providers, whereas elasticity refers to the capabilities of a cloud environment to add or remove services, as needed, to meet current demand","expth":"การเช่าหลายรายการเป็นลักษณะของการประมวลผลแบบคลาวด์ที่เกี่ยวข้องกับการมีลูกค้าหลายรายและแอปพลิเคชันที่ทำงานภายในระบบเดียวกันและแบ่งปันทรัพยากรเดียวกัน แม้ว่าจะมีกลไกสำคัญเพื่อให้แน่ใจว่ามีการแยกและการแยกออกจากกัน แต่ข้อมูลและแอปพลิเคชันก็ใช้ทรัพยากรที่ใช้ร่วมกันในท้ายที่สุด การเข้าถึงเครือข่ายแบบกว้างหมายถึงความสามารถในการเข้าถึงบริการคลาวด์จากสถานที่หรือไคลเอนต์ใดๆ ความสามารถในการพกพาหมายถึงความสามารถในการย้ายบริการคลาวด์ระหว่างผู้ให้บริการคลาวด์ต่างๆ ได้อย่างง่ายดาย ในขณะที่ความยืดหยุ่นหมายถึงความสามารถของสภาพแวดล้อมคลาวด์ในการเพิ่มหรือลบบริการ ตามความจำเป็น เพื่อตอบสนองความต้องการในปัจจุบัน"},{"id":235,"topic":1,"q":"The REST API is a widely used standard for communications of web-based services between clients and the servers hosting them, Which protocol does the REST API depend on?","qth":"REST API เป็นมาตรฐานที่ใช้กันอย่างแพร่หลายสำหรับการสื่อสารของบริการบนเว็บระหว่างไคลเอนต์และเซิร์ฟเวอร์ที่โฮสต์บริการเหล่านั้น REST API ขึ้นอยู่กับโปรโตคอลใด","a":["HTTP","SSH","SAML","XML"],"ath":["HTTP","SSH","SAML","XML"],"ans":"A","exp":"Representational State Transfer (REST) is a software architectural scheme that applies the components, connectors, and data conduits for many web applications used on the Internet. It uses and relies on the HTTP protocol and supports a variety of data formats. Extensible Markup Language (XML) and Security Assertion Markup Language (SAML) are both standards for exchanging encoded data between two parties, with XML being for more general use and SAML focused on authentication and authorization data. Secure Shell client (SSH) is a secure method for allowing remote login to systems over a network","expth":"Representational State Transfer (REST) ​​คือโครงร่างสถาปัตยกรรมซอฟต์แวร์ที่ใช้ส่วนประกอบ ตัวเชื่อมต่อ และท่อร้อยสายข้อมูลสำหรับแอปพลิเคชันเว็บจำนวนมากที่ใช้บนอินเทอร์เน็ต ใช้และอาศัยโปรโตคอล HTTP และรองรับรูปแบบข้อมูลที่หลากหลาย Extensible Markup Language (XML) และ Security Assertion Markup Language (SAML) เป็นทั้งมาตรฐานสำหรับการแลกเปลี่ยนข้อมูลที่เข้ารหัสระหว่างสองฝ่าย โดยที่ XML นั้นมีไว้สำหรับการใช้งานทั่วไปมากกว่า และ SAML จะเน้นไปที่ข้อมูลการตรวจสอบสิทธิ์และการอนุญาต Secure Shell client (SSH) เป็นวิธีการที่ปลอดภัยสำหรับการอนุญาตให้เข้าสู่ระบบระยะไกลไปยังระบบผ่านเครือข่าย"},{"id":236,"topic":1,"q":"Which of the following actions will NOT make data part of the create phase of the cloud data lifecycle?","qth":"การดำเนินการใดต่อไปนี้จะไม่ทำให้ข้อมูลเป็นส่วนหนึ่งของระยะการสร้างของวงจรการใช้งานข้อมูลบนคลาวด์","a":["Modify data","Modify metadata","New data","Import data"],"ath":["แก้ไขข้อมูล","แก้ไขข้อมูลเมตา","ข้อมูลใหม่","นำเข้าข้อมูล"],"ans":"B","exp":"Modifying the metadata does not change the actual data. Although this initial phase is called \"create,\" it can also refer to modification. In essence, any time data is considered \"new\" it is in the create phase. This can come from data that is newly created, data that is imported into a system and is new to that system, or data that is already present and is modified into a new form or value","expth":"การแก้ไขข้อมูลเมตาไม่เปลี่ยนแปลงข้อมูลจริง แม้ว่าระยะเริ่มต้นนี้เรียกว่า \"สร้าง\" แต่ก็สามารถหมายถึงการแก้ไขได้เช่นกัน โดยพื้นฐานแล้ว ข้อมูลจะถือเป็นข้อมูล \"ใหม่\" ทุกครั้งซึ่งอยู่ในขั้นตอนการสร้าง ซึ่งอาจมาจากข้อมูลที่สร้างขึ้นใหม่ ข้อมูลที่นำเข้าเข้าสู่ระบบและเป็นข้อมูลใหม่ในระบบนั้น หรือข้อมูลที่มีอยู่แล้วและถูกแก้ไขเป็นรูปแบบหรือค่าใหม่"},{"id":237,"topic":1,"q":"Most APIs will support a variety of different data formats or structures However, the SOAP AP! will only support which one of the following data formats?","qth":"API ส่วนใหญ่จะสนับสนุนรูปแบบข้อมูลหรือโครงสร้างที่หลากหลาย อย่างไรก็ตาม SOAP AP! จะรองรับเฉพาะรูปแบบข้อมูลใดต่อไปนี้เท่านั้น","a":["XML","XSLT","JSON","SAML"],"ath":["XML","XSLT","JSON","SAML"],"ans":"A","exp":"The Simple Object Access Protocol (SOAP) protocol only supports the Extensible Markup Language (XML) data format. Although the other options are all data formats or data structures, they are not supported by SOAP","expth":"โปรโตคอล Simple Object Access Protocol (SOAP) รองรับเฉพาะรูปแบบข้อมูล Extensible Markup Language (XML) เท่านั้น แม้ว่าตัวเลือกอื่นๆ จะเป็นรูปแบบข้อมูลหรือโครงสร้างข้อมูลทั้งหมด แต่ SOAP ก็ไม่รองรับ"},{"id":238,"topic":1,"q":"Which cloud storage type is typically used to house virtual machine images that are used throughout the environment?","qth":"พื้นที่เก็บข้อมูลบนคลาวด์ประเภทใดโดยทั่วไปจะใช้เพื่อจัดเก็บอิมเมจเครื่องเสมือนที่ใช้ทั่วทั้งสภาพแวดล้อม","a":["Structured","Unstructured","Volume","Object"],"ath":["มีโครงสร้าง","ไม่มีโครงสร้าง","ปริมาณ","วัตถุ"],"ans":"D","exp":"Object storage is typically used to house virtual machine images because it is independent from other systems and is focused solely on storage. It is also the most appropriate for handling large individual files. Volume storage, because it is allocated to a specific host, would not be appropriate for the storing of virtual images, Structured and unstructured are storage types specificto PaaS and would not be used for storing items used throughout a cloud environment","expth":"พื้นที่จัดเก็บออบเจ็กต์มักจะใช้เพื่อจัดเก็บอิมเมจเครื่องเสมือนเนื่องจากเป็นอิสระจากระบบอื่นและเน้นที่พื้นที่จัดเก็บเพียงอย่างเดียว นอกจากนี้ยังเหมาะสมที่สุดสำหรับการจัดการไฟล์แต่ละไฟล์ขนาดใหญ่ พื้นที่จัดเก็บไดรฟ์ข้อมูล เนื่องจากได้รับการจัดสรรให้กับโฮสต์เฉพาะ จึงไม่เหมาะสมสำหรับการจัดเก็บภาพเสมือน ประเภทพื้นที่จัดเก็บที่มีโครงสร้างและไม่มีโครงสร้างเป็นประเภทพื้นที่จัดเก็บเฉพาะสำหรับ PaaS และจะไม่ถูกนำมาใช้สำหรับการจัดเก็บรายการที่ใช้ทั่วทั้งสภาพแวดล้อมคลาวด์"},{"id":239,"topic":1,"q":"With an API, various features and optimizations are highly desirable to scalability, reliability, and security What do
