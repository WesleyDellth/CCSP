s":"A","exp":"An SOC 1 is a report on controls at a service organization that may be relevant to a user entity's internal control over financial reporting. An SOC 2 report is based on the existing SysTrust and WebTrust principles. The purpose of an SOC 2 report is to evaluate an organizatior's information systems relevant to security, availabilty, processing integrity, confidentiality, or privacy. An SOC 3 report is also based on the existing SysTrust and WebTrust principles, like a SOC 2 report The difference is that the SOC 3 report does not detail the testing performed","expth":"An SOC 1 is a report on controls at a service organization that may be relevant to a user entity's internal control over financial reporting. An SOC 2 report is based on the existing SysTrust and WebTrust principles. The purpose of an SOC 2 report is to evaluate an organizatior's information systems relevant to security, availabilty, processing integrity, confidentiality, or privacy. An SOC 3 report is also based on the existing SysTrust and WebTrust principles, like a SOC 2 report The difference is that the SOC 3 report does not detail the testing performed"},{"id":404,"topic":1,"q":"Gathering business requirements can aid the organization in determining all of this information about organizational assets, except","qth":"Gathering business requirements can aid the organization in determining all of this information about organizational assets, except","a":["Full inventory","Criticality","Value","Usefulness"],"ath":["Full inventory","Criticality","Value","Usefulness"],"ans":"D","exp":"When we gather information about business requirements, we need to do a complete inventory, receive accurate valuation of assets (usually from the owners of those assets), and assess criticality; this collection of information does not tell us, objectively, how useful an asset is, however","expth":"When we gather information about business requirements, we need to do a complete inventory, receive accurate valuation of assets (usually from the owners of those assets), and assess criticality; this collection of information does not tell us, objectively, how useful an asset is, however"},{"id":405,"topic":1,"q":"In attempting to provide a layered defense, the security practitioner should convince senior management to include security controls of which type?","qth":"In attempting to provide a layered defense, the security practitioner should convince senior management to include security controls of which type?","a":["Physical","All of the above","technological","Administrative"],"ath":["Physical","All of the above","technological","Administrative"],"ans":"B","exp":"Layered defense calls for a diverse approach to security","expth":"Layered defense calls for a diverse approach to security"},{"id":406,"topic":1,"q":"The BIA can be used to provide information about all the following, except","qth":"The BIA can be used to provide information about all the following, except","a":["BC/DR planning","Risk analysis","Secure acquisition","Selection of security controls"],"ath":["BC/DR planning","Risk analysis","Secure acquisition","Selection of security controls"],"ans":"C","exp":"The business impact analysis gathers asset valuation information that is beneficial for risk analysis and selection of security controls (it helps avoid putting the ten- dollar lock on the five-dollar bicycle), and criticality information that helps in BC/DR planning by letting the organization understand which systems, data, and personnel are necessary to continuously maintain. However, it does not aid secure acquisition efforts, since the assets examined by the BIA have already been acquired","expth":"The business impact analysis gathers asset valuation information that is beneficial for risk analysis and selection of security controls (it helps avoid putting the ten- dollar lock on the five-dollar bicycle), and criticality information that helps in BC/DR planning by letting the organization understand which systems, data, and personnel are necessary to continuously maintain. However, it does not aid secure acquisition efforts, since the assets examined by the BIA have already been acquired"},{"id":407,"topic":1,"q":"Which of the following are cloud computing roles?","qth":"Which of the following are cloud computing roles?","a":["Cloud service broker and user","Cloud customer and financial auditor","CSP and backup service provider","Cloud service auditor and object"],"ath":["Cloud service broker and user","Cloud customer and financial auditor","CSP and backup service provider","Cloud service auditor and object"],"ans":"C","exp":"The following groups form the key roles and functions associated with cloud computing. They do not constitute an exhaustive list but highlight the main roles and functions within cloud computing Cloud customer: An individual or entity that utilizes or subscribes to cloud based services or resources. CSP: A company that provides cloud-based platform, infrastructure, application, or storage services to other organizations or individuals, usually for a fee; otherwise known to clients €as a service Cloud backup service provider: A third-party entity that manages and holds operational responsibilities for cloud-based data backup services and solutions to customers from a central data center. CSB: Typically a third-party entity or company that looks to extend or enhance value to multiple custome","expth":"The following groups form the key roles and functions associated with cloud computing. They do not constitute an exhaustive list but highlight the main roles and functions within cloud computing Cloud customer: An individual or entity that utilizes or subscribes to cloud based services or resources. CSP: A company that provides cloud-based platform, infrastructure, application, or storage services to other organizations or individuals, usually for a fee; otherwise known to clients €as a service Cloud backup service provider: A third-party entity that manages and holds operational responsibilities for cloud-based data backup services and solutions to customers from a central data center. CSB: Typically a third-party entity or company that looks to extend or enhance value to multiple custome"},{"id":408,"topic":1,"q":"Which of the following are considered to be the building blocks of cloud computing?","qth":"Which of the following are considered to be the building blocks of cloud computing?","a":["CPU, RAM, storage, and networking","Data, CPU, RAM, and access control","Data, access control, virtualization, and services","Storage, networking, printing, and virtualization"],"ath":["CPU, RAM, storage, and networking","Data, CPU, RAM, and access control","Data, access control, virtualization, and services","Storage, networking, printing, and virtualization"],"ans":"A","exp":"","expth":""},{"id":409,"topic":1,"q":"Which of the following is considered a physical control?","qth":"Which of the following is considered a physical control?","a":["Fences","Ceilings","Carpets","Doors"],"ath":["Fences","Ceilings","Carpets","Doors"],"ans":"A","exp":"Fences are physical controls; carpets and ceilings are architectural features, and a door is not necessarily a control: the lock on the door would be a physical security control. Although you might think of a door as a potential answer, the best answer is the fence; the exam will have questions where more than one answer is correct, and the answer that will score you points is the one that is most correct","expth":"Fences are physical controls; carpets and ceilings are architectural features, and a door is not necessarily a control: the lock on the door would be a physical security control. Although you might think of a door as a potential answer, the best answer is the fence; the exam will have questions where more than one answer is correct, and the answer that will score you points is the one that is most correct"},{"id":410,"topic":1,"q":"What is an experimental technology th great accuracy what her regular IT management expense will be","expth":"According to the MSP Alliance, typically MSPs have the following distinguishing characteristics Have some form of NOC service Have some form of help desk service ~ Can remotely monitor and manage all or a majority of the objects for the customer Can proactively maintain the objects under management for the customer ~ Can deliver these solutions with some form of predictable biling model, where the customer knows with great accuracy what her regular IT management expense will be"},{"id":412,"topic":1,"q":"To protect data on user devices in a BYOD environment, the organization should consider requiring all the following, except","qth":"To protect data on user devices in a BYOD environment, the organization should consider requiring all the following, except","a":["Multifactor authentication","DLP agents","Two-person integrity","Local encryption"],"ath":["Multifactor authentication","DLP agents","Two-person integrity","Local encryption"],"ans":"C","exp":"Although all the other options are ways to harden a mobile device, two-person integrity is a concept that has nothing to do with the topic, and, if implemented, would require everyone in your organization to walk around in pairs while using their mobile devices","expth":"Although all the other options are ways to harden a mobile device, two-person integrity is a concept that has nothing to do with the topic, and, if implemented, would require everyone in your organization to walk around in pairs while using their mobile devices"},{"id":413,"topic":1,"q":"Tokenization requires two distinct","qth":"Tokenization requires two distinct","a":["Authentication factors","Personnel","Databases","Encryption"],"ath":["Authentication factors","Personnel","Databases","Encryption"],"ans":"C","exp":"In order to implement tokenization, there will need to be two databases: the database containing the raw, original data, and the token database containing tokens that map to original data. Having two-factor authenticationis nice, but certainly not required. Encryption keys are not necessary for tokenization. Two-person integrity does not have anything to do with tokenization","expth":"In order to implement tokenization, there will need to be two databases: the database containing the raw, original data, and the token database containing tokens that map to original data. Having two-factor authenticationis nice, but certainly not required. Encryption keys are not necessary for tokenization. Two-person integrity does not have anything to do with tokenization"},{"id":414,"topic":1,"q":"DLP can be combined with what other security technology to enhance data controls?","qth":"DLP can be combined with what other security technology to enhance data controls?","a":["DRM","Hypervisor","SIEM","Kerberos"],"ath":["DRM","Hypervisor","SIEM","Kerberos"],"ans":"A","exp":"DLP can be combined with DRM to protect intellectual property; both are designed to","expth":"DLP can be combined with DRM to protect intellectual property; both are designed to"},{"id":415,"topic":1,"q":"What is the intellectual property protection for a confidential recipe for muffins?","qth":"What is the intellectual property protection for a confidential recipe for muffins?","a":["Patent","Trademark","Trade secret","Copyright"],"ath":["Patent","Trademark","Trade secret","Copyright"],"ans":"C","exp":"Confidential recipes unique to the organization are trade secrets. The other answers listed are answers to other questions","expth":"Confidential recipes unique to the organization are trade secrets. The other answers listed are answers to other questions"},{"id":416,"topic":1,"q":"Every security program and process should have which of the following?","qth":"Every security program and process should have which of the following?","a":["Severe penalties","Multifactor authentication","Foundational policy","Homomorphic encryption"],"ath":["Severe penalties","Multifactor authentication","Foundational policy","Homomorphic encryption"],"ans":"C","exp":"Policy drives all programs and functions in the organization; the organization should not conduct any operations that dor't have a policy governing them. Penalties may or may not be an element of policy, and severity depends on the topic. Multifactor authentication and homomorphic encryption are red herrings here","expth":"Policy drives all programs and functions in the organization; the organization should not conduct any operations that dor't have a policy governing them. Penalties may or may not be an element of policy, and severity depends on the topic. Multifactor authentication and homomorphic encryption are red herrings here"},{"id":417,"topic":1,"q":"DLP solutions can aid in deterring loss due to which of the following?","qth":"DLP solutions can aid in deterring loss due to which of the following?","a":["Inadvertent disclosure","Natural disaster","Randomization","Device failure"],"ath":["Inadvertent disclosure","Natural disaster","Randomization","Device failure"],"ans":"D","exp":"DLP solutions may protect against inadvertent disclosure. Randomization is a technique for obscuring data, not a risk to data. DLP tools will not protect against risks from natural disasters, or against impacts due to device failure","expth":"DLP solutions may protect against inadvertent disclosure. Randomization is a technique for obscuring data, not a risk to data. DLP tools will not protect against risks from natural disasters, or against impacts due to device failure"},{"id":418,"topic":1,"q":"All policies within the organization should include a section that includes all of the following, except","qth":"All policies within the organization should include a section that includes all of the following, except","a":["Policy adjudication","Policy maintenance","Policy review","Policy enforcement"],"ath":["Policy adjudication","Policy maintenance","Policy review","Policy enforcement"],"ans":"D","exp":"All the elements except adjudication need to be addressed in each policy. Adjudication is not an element of policy","expth":"All the elements except adjudication need to be addressed in each policy. Adjudication is not an element of policy"},{"id":419,"topic":1,"q":"Proper implementation of DLP solutions for successful function requires which of the following?","qth":"Proper implementation of DLP solutions for successful function requires which of the following?","a":["Physical access limitations","USB connectivity","Accurate data categorization","Physical presence"],"ath":["Physical access limitations","USB connectivity","Accurate data categorization","Physical presence"],"ans":"C","exp":"DLP tools need to be aware of which information to monitor and which requires categorization (usually done upon data creation, by the data owners). DLPs can be implemented with or without physical access or presence. USB connectivity has nothing to do with DLP solutions","expth":"DLP tools need to be aware of which information to monitor and which requires categorization (usually done upon data creation, by the data owners). DLPs can be implemented with or without physical access or presence. USB connectivity has nothing to do with DLP solutions"},{"id":420,"topic":1,"q":"What is the experimental technology that might lead to the possibility of processing encrypted data without having to decrypt it first?","qth":"เทคโนโลยีทดลองใดที่อาจนำไปสู่ความเป็นไปได้ในการประมวลผลข้อมูลที่เข้ารหัสโดยไม่ต้องถอดรหัสก่อน","a":["AES","Link encryption","One-time pads","Homomorphic encryption"],"ath":["AES","การเข้ารหัสลิงก์","แผ่นแบบครั้งเดียว","การเข้ารหัสแบบ Homomorphic"],"ans":"D","exp":"AES is an encryption standard. Link encryption is a method for protecting communications traffic. One-time pads are an encryption method","expth":"AES เป็นมาตรฐานการเข้ารหัส การเข้ารหัสลิงก์เป็นวิธีหนึ่งในการป้องกันการรับส่งข้อมูลการสื่อสาร แพดแบบครั้งเดียวเป็นวิธีการเข้ารหัส"},{"id":421,"topic":1,"q":"Data labels could include all the following, except:","qth":"ป้ายกำกับข้อมูลอาจมีสิ่งต่อไปนี้ทั้งหมด ยกเว้น:","a":["Multifactor authentication","Access restrictions","Confidentiality level","Distribution limitations"],"ath":["การตรวจสอบสิทธิ์แบบหลายปัจจัย","ข้อจำกัดการเข้าถึง","ระดับการรักษาความลับ","ข้อจำกัดในการเผยแพร่"],"ans":"A","exp":"All the others might be included in data labels, but multifactor authentication is a procedure used for access control, not a label","expth":"อื่นๆ ทั้งหมดอาจรวมอยู่ในป้ายกำกับข้อมูล แต่การตรวจสอบสิทธิ์แบบหลายปัจจัยเป็นขั้นตอนที่ใช้สำหรับการควบคุมการเข้าถึง ไม่ใช่ป้ายกำกับ"},{"id":422,"topic":1,"q":"In the cloud motif, the data owner is usually:","qth":"ในมาตรฐานระบบคลาวด์ เจ้าของข้อมูลมักจะ:","a":["The cloud provider","In another jurisdiction","The cloud customer","The cloud access security broker"],"ath":["ผู้ให้บริการระบบคลาวด์","ในเขตอำนาจศาลอื่น","ลูกค้าระบบคลาวด์","นายหน้ารักษาความปลอดภัยการเข้าถึงระบบคลาวด์"],"ans":"C","exp":"The data owner is usually considered the cloud customer in a cloud configuration; the data in question is the customer's information, being processed in the cloud The cloud provider is only leasing services and hardware to the customer. The cloud access security broker (CASB) only handles access control on behaalf of the cloud customer, and is not in direct contact with the production data","expth":"โดยปกติแล้วเจ้าของข้อมูลจะถือเป็นลูกค้าระบบคลาวด์ในการกำหนดค่าระบบคลาวด์ ข้อมูลที่เป็นปัญหาคือข้อมูลของลูกค้าที่กำลังประมวลผลในระบบคลาวด์ ผู้ให้บริการคลาวด์เป็นเพียงการเช่าบริการและฮาร์ดแวร์ให้กับลูกค้าเท่านั้น นายหน้ารักษาความปลอดภัยการเข้าถึงระบบคลาวด์ (CASB) จะจัดการการควบคุมการเข้าถึงในนามของลูกค้าระบบคลาวด์เท่านั้น และไม่ได้ติดต่อกับข้อมูลการผลิตโดยตรง"},{"id":423,"topic":1,"q":"The goals of DLP solution implementation include all of the following, except","qth":"เป้าหมายของการนำโซลูชัน DLP ไปใช้ประกอบด้วยสิ่งต่อไปนี้ทั้งหมด ยกเว้น","a":["Elasticity","Policy enforcement","Data discovery","Loss of mitigation"],"ath":["ความยืดหยุ่น","การบังคับใช้นโยบาย","การค้นพบข้อมูล","การสูญเสียการบรรเทาผลกระทบ"],"ans":"A","exp":"DLP does not have anything to do with elasticity, which is the capabilty of the environment to scale up or down according to demand. All the rest are goals of DLP implementations","expth":"DLP ไม่มีส่วนเกี่ยวข้องกับความยืดหยุ่น ซึ่งเป็นความสามารถของสภาพแวดล้อมในการขยายขนาดหรือลดขนาดตามความต้องการ ที่เหลือทั้งหมดเป็นเป้าหมายของการนำ DLP ไปใช้"},{"id":424,"topic":1,"q":"What is the intellectual property protection for a useful manufacturing innovation?","qth":"การคุ้มครองทรัพย์สินทางปัญญาสำหรับนวัตกรรมการผลิตที่มีประโยชน์คืออะไร","a":["Trademark","Copyright","patent","Trade secret"],"ath":["เครื่องหมายการค้า","ลิขสิทธิ์","สิทธิบัตร","ความลับทางการค้า"],"ans":"C","exp":"Patents protect processes (as well as inventions, new plantlife, and decorative patterns). The other answers listed are answers to other questions","expth":"สิทธิบัตรปกป้องกระบวนการ (เช่นเดียวกับสิ่งประดิษฐ์ พืชพรรณใหม่ๆ และลวดลายตกแต่ง) คำตอบอื่นๆ ที่แสดงเป็นคำตอบสำหรับคำถามอื่นๆ"},{"id":425,"topic":1,"q":"The most pragmatic option for data disposal in the cloud is which of the following?","qth":"ตัวเลือกที่ใช้งานได้จริงที่สุดสำหรับการกำจัดข้อมูลในระบบคลาวด์คือข้อใดต่อไปนี้","a":["Cryptoshredding","Overwriting","Cold fusion","Melting"],"ath":["การเข้ารหัสลับ","การเขียนทับ","การหลอมรวมแบบเย็น","การหลอมละลาย"],"ans":"A","exp":"We don't have physical ownership, control, or even access to the devices holding the data, so physical destruction, including melting, is not an option. Overwriting is a possibility, but it is complicated by the difficulty of locating all the sectors and storage areas that might have contained our data, and by the likelihood that constant backups in the cloud increase the chance we'll miss something as it's being overwritten. Cryptoshredding is the only reasonable alternative. Cold fusion is ared herring","expth":"เราไม่มีสิทธิ์เป็นเจ้าของทางกายภาพ การควบคุม หรือแม้แต่การเข้าถึงอุปกรณ์ที่เก็บข้อมูล ดังนั้นการทำลายทางกายภาพ รวมถึงการหลอมละลาย จึงไม่ใช่ทางเลือก การเขียนทับมีความเป็นไปได้ แต่มีความซับซ้อนเนื่องจากความยากในการค้นหาเซกเตอร์และพื้นที่จัดเก็บข้อมูลทั้งหมดที่อาจมีข้อมูลของเรา และความเป็นไปได้ที่การสำรองข้อมูลอย่างต่อเนื่องในระบบคลาวด์จะเพิ่มโอกาสที่เราจะพลาดบางสิ่งบางอย่างในขณะที่มันถูกเขียนทับ Cryptoshredding เป็นทางเลือกเดียวที่สมเหตุสมผล ฟิวชั่นเย็นเป็นปลาเฮอริ่ง"},{"id":426,"topic":1,"q":"In the cloud motif, the data processor is usually:","qth":"ในมาตรฐานระบบคลาวด์ ผู้ประมวลผลข้อมูลมักจะ:","a":["The cloud customer","The cloud provider","The cloud access security broker","The party that assigns access rights"],"ath":["ลูกค้าคลาวด์","ผู้ให้บริการคลาวด์","นายหน้าความปลอดภัยการเข้าถึงคลาวด์ (CASB)","ฝ่ายที่ได้รับมอบสิทธิ์การเข้าถึง"],"ans":"B","exp":"In legal terms, when 1€data processora€ is defined, it refers to anyone who stores, handles, moves, or manipulates data on behalf of the data owner or controller. In the cloud computing realm, this is the cloud provider","expth":"ในแง่กฎหมาย เมื่อกำหนด 1€ตัวประมวลผลข้อมูล€ จะหมายถึงใครก็ตามที่จัดเก็บ จัดการ ย้าย หรือจัดการข้อมูลในนามของเจ้าของข้อมูลหรือผู้ควบคุม ในขอบเขตการประมวลผลแบบคลาวด์ นี่คือผู้ให้บริการคลาวด์"},{"id":427,"topic":1,"q":"What is the intellectual property protection for the tangible expression of a creative idea?","qth":"การคุ้มครองทรัพย์สินทางปัญญาสำหรับการแสดงออกที่จับต้องได้ของความคิดสร้างสรรค์คืออะไร","a":["Trade secret","Copyright","Trademark","Patent"],"ath":["ความลับทางการค้า","ลิขสิทธิ์","เครื่องหมายการค้า","สิทธิบัตร"],"ans":"B","exp":"Copyrights are protected tangible expressions of creative works. The other answers listed are answers to subsequent questions","expth":"ลิขสิทธิ์ได้รับการคุ้มครองการแสดงออกที่จับต้องได้ของงานสร้างสรรค์ คำตอบอื่นๆ ที่แสดงเป็นคำตอบสำหรับคำถามต่อๆ ไป"},{"id":428,"topic":1,"q":"The goals of SIEM solution implementation include all of the following, except","qth":"เป้าหมายของการนำโซลูชัน SIEM ไปใช้ประกอบด้วยสิ่งต่อไปนี้ทั้งหมด ยกเว้น","a":["Dashboarding","Performance enhancement","Trend analysis","Centralization of log streams"],"ath":["แดชบอร์ด","การเพิ่มประสิทธิภาพการทำงาน","การวิเคราะห์แนวโน้ม","การรวมศูนย์ของสตรีมบันทึก"],"ans":"B","exp":"SIEM does not intend to provide any enhancement of performance; in fact, a SIEM solution may decrease performance because of additional overhead. All the rest are goals of SIEM implementations","expth":"SIEM ไม่ได้ตั้งใจที่จะจัดให้มีการปรับปรุงประสิทธิภาพใดๆ ที่จริงแล้ว โซลูชัน SIEM อาจลดประสิทธิภาพลงเนื่องจากมีค่าใช้จ่ายเพิ่มเติม ที่เหลือทั้งหมดเป็นเป้าหมายของการนำ SIEM ไปใช้"},{"id":429,"topic":1,"q":"Data masking can be used to provide all of the following functionality, except","qth":"การมาสก์ข้อมูลสามารถใช้เพื่อจัดเตรียมฟังก์ชันการทำงานทั้งหมดต่อไปนี้ ยกเว้น","a":["Secure remote access","test data in sandboxed environments","Authentication of privileged users","Enforcing least privilege"],"ath":["การเข้าถึงระยะไกลที่ปลอดภัย","ทดสอบข้อมูลในสภาพแวดล้อมแบบแซนด์บ็อกซ์","การตรวจสอบสิทธิ์ของผู้ใช้ที่มีสิทธิ์พิเศษ","การบังคับใช้สิทธิ์ขั้นต่ำ"],"ans":"C","exp":"Data masking does not support authentication in any way. All the others are excellent use cases for data masking","expth":"การมาสก์ข้อมูลไม่สนับสนุนการตรวจสอบสิทธิ์ในทางใดทางหนึ่ง ส่วนอื่นๆ ทั้งหมดเป็นกรณีการใช้งานที่ยอดเยี่ยมสำหรับการปกปิดข้อมูล"},{"id":430,"topic":1,"q":"Allof the following are terms used to described the practice of obscuring original raw data so that only a portion is displayed for operational purposes, except","qth":"ทั้งหมดต่อไปนี้เป็นคำศัพท์ที่ใช้อธิบายแนวทางปฏิบัติในการปกปิดข้อมูลดิบต้นฉบับเพื่อให้แสดงเพียงบางส่วนเพื่อวัตถุประสงค์ในการปฏิบัติงาน ยกเว้น","a":["Tokenization","Masking","Data discovery","Obfuscation"],"ath":["Tokenization","Masking","Data Discovery","Obfuscation"],"ans":"C","exp":"Data discovery is a term used to describe the process of identifying information according to specific traits or categories. The rest are all methods for obscuring data","expth":"Data Discovery เป็นคำที่ใช้อธิบายกระบวนการระบุข้อมูลตามลักษณะหรือหมวดหมู่เฉพาะ ที่เหลือเป็นวิธีการปกปิดข้อมูลทั้งหมด"},{"id":431,"topic":1,"q":"DLP solutions can aid in deterring loss due to which of the following?","qth":"โซลูชัน DLP สามารถช่วยในการยับยั้งการสูญเสียเนื่องจากสาเหตุใดต่อไปนี้","a":["Power failure","Performance","Bad policy","Malicious disclosure"],"ath":["ไฟฟ้าขัดข้อง","ประสิทธิภาพ","นโยบายที่ไม่ดี","การเปิดเผยที่เป็นอันตราย"],"ans":"D","exp":"DLP tools can identify outbound traffic that violates the organization's policies. DLP will not protect against losses due to performance issues or power failures The DLP solution must be configured according to the organization's policies, so bad policies will attenuate the effectiveness of DLP tools, not the other way around","expth":"เครื่องมือ DLP สามารถระบุการรับส่งข้อมูลขาออกที่ละเมิดนโยบายขององค์กร DLP จะไม่ป้องกันการสูญเสียอันเนื่องมาจากปัญหาด้านประสิทธิภาพหรือไฟฟ้าขัดข้อง โซลูชัน DLP จะต้องได้รับการกำหนดค่าตามนโยบายขององค์กร ดังนั้นนโยบายที่ไม่ดีจะลดประสิทธิภาพของเครื่องมือ DLP ไม่ใช่วิธีอื่น"},{"id":432,"topic":1,"q":"All the following are data analytics modes, except","qth":"ทั้งหมดต่อไปนี้เป็นโหมดการวิเคราะห์ข้อมูล ยกเว้น","a":["Datamining","Agile business intelligence","Refractory iterations","Real-time analytics"],"ath":["การขุดข้อมูล","ระบบธุรกิจอัจฉริยะแบบ Agile","การทำซ้ำแบบทนไฟ","การวิเคราะห์แบบเรียลไทม์"],"ans":"C","exp":"All the others are data analytics methods, but a€refractory iterations is a nonsense term thrown in as a red herring","expth":"วิธีอื่นๆ ทั้งหมดเป็นวิธีการวิเคราะห์ข้อมูล แต่การวนซ้ำแบบทนไฟ€เป็นคำที่ไร้สาระที่ถูกโยนเข้ามาในฐานะปลาเฮอริ่งแดง"},{"id":433,"topic":1,"q":"What are the U.S. State Department controls on technology exports known as?","qth":"การควบคุมการส่งออกเทคโนโลยีของกระทรวงการต่างประเทศสหรัฐฯ เรียกว่าอะไร?","a":["DRM","ITAR","EAR","EAR/ITAR"],"ath":["DRM","ITAR","EAR","EAR/ITAR"],"ans":"B","exp":"ITAR is a Department of State program. Evaluation assurance levels are part of the Common Criteria standard from ISO. Digital rights management tools are used for protecting electronic processing of intellectual property","expth":"ITAR เป็นโครงการของกระทรวงการต่างประเทศ ระดับการรับประกันการประเมินเป็นส่วนหนึ่งของมาตรฐาน Common Criteria จาก ISO เครื่องมือการจัดการสิทธิ์ดิจิทัลใช้เพื่อปกป้องการประมวลผลทรัพย์สินทางปัญญาทางอิเล็กทรอนิกส์"},{"id":434,"topic":1,"q":"When crafting plans and policies for data archiving, we should consider all of the following, except","qth":"เมื่อจัดทำแผนและนโยบายสำหรับการจัดเก็บข้อมูล เราควรพิจารณาสิ่งต่อไปนี้ทั้งหมด ยกเว้น","a":["The backup process","Immediacy of the technology","Archive location","The format of the data"],"ath":["กระบวนการสำรองข้อมูล","ความรวดเร็วของเทคโนโลยี","ตำแหน่งในการเก็บข้อมูล","รูปแบบของข้อมูล"],"ans":"D","exp":"","expth":""},{"id":435,"topic":1,"q":"DLP solutions can aid in deterring loss due to which of the following?","qth":"โซลูชัน DLP สามารถช่วยในการยับยั้งการสูญเสียเนื่องจากสาเหตุใดต่อไปนี้","a":["Device failure","Randomization","Inadvertent disclosure","Natural disaster"],"ath":["ความล้มเหลวของอุปกรณ์","การสุ่ม","การเปิดเผยโดยไม่ตั้งใจ","ภัยพิบัติทางธรรมชาติ"],"ans":"C","exp":"DLP solutions may protect against inadvertent disclosure. Randomization is a technique for obscuring data, not a risk to data. DLP tools will not protect against risks from natural disasters, or against impacts due to device failure","expth":"โซลูชัน DLP อาจป้องกันการเปิดเผยโดยไม่ได้ตั้งใจ การสุ่มเป็นเทคนิคในการปกปิดข้อมูล ไม่ใช่ความเสี่ยงต่อข้อมูล เครื่องมือ DLP จะไม่ป้องกันความเสี่ยงจากภัยธรรมชาติหรือผลกระทบเนื่องจากอุปกรณ์ขัดข้อง"},{"id":436,"topic":1,"q":"DLP can be combined with what other security technology to enhance data controls?","qth":"DLP สามารถใช้ร่วมกับเทคโนโลยีความปลอดภัยอื่นๆ เพื่อปรับปรุงการควบคุมข้อมูลได้หรือไม่","a":["SIEM","Hypervisors","DRM","Kerberos"],"ath":["SIEM","ไฮเปอร์ไวเซอร์","DRM","Kerberos"],"ans":"C","exp":"DLP can be combined with DRM to protect intellectual property; both are designed to","expth":"DLP สามารถใช้ร่วมกับ DRM เพื่อปกป้องทรัพย์สินทางปัญญา; ทั้งสองได้รับการออกแบบมาเพื่อ"},{"id":437,"topic":1,"q":"The goals of SIEM solution implementation include all of the following, except","qth":"เป้าหมายของการนำโซลูชัน SIEM ไปใช้ประกอบด้วยสิ่งต่อไปนี้ทั้งหมด ยกเว้น","a":["Dashboarding","Performance enhancement","Trend analysis","Centralization of log streams"],"ath":["แดชบอร์ด","การเพิ่มประสิทธิภาพการทำงาน","การวิเคราะห์แนวโน้ม","การรวมศูนย์ของสตรีมบันทึก"],"ans":"B","exp":"SIEM does not intend to provide any enhancement of performance; in fact, a SIEM solution may decrease performance because of additional overhead. All the rest are goals of SIEM implementations","expth":"SIEM ไม่ได้ตั้งใจที่จะจัดให้มีการปรับปรุงประสิทธิภาพใดๆ ที่จริงแล้ว โซลูชัน SIEM อาจลดประสิทธิภาพลงเนื่องจากมีค่าใช้จ่ายเพิ่มเติม ที่เหลือทั้งหมดเป็นเป้าหมายของการนำ SIEM ไปใช้"},{"id":438,"topic":1,"q":"Data masking can be used to provide all of the following functionality, except","qth":"การมาสก์ข้อมูลสามารถใช้เพื่อจัดเตรียมฟังก์ชันการทำงานทั้งหมดต่อไปนี้ ยกเว้น","a":["Test data in sandboxed environments","Authentication of privileged users","Enforcing least privilege","Secure remote access"],"ath":["ทดสอบข้อมูลในสภาพแวดล้อมแบบแซนด์บ็อกซ์","การตรวจสอบสิทธิ์ของผู้ใช้ที่มีสิทธิ์พิเศษ","การบังคับใช้สิทธิ์ขั้นต่ำ","การเข้าถึงระยะไกลที่ปลอดภัย"],"ans":"B","exp":"Data masking does not support authentication in any way. All the others are excellent use cases for data masking","expth":"การมาสก์ข้อมูลไม่สนับสนุนการตรวจสอบสิทธิ์ในทางใดทางหนึ่ง ส่วนอื่นๆ ทั้งหมดเป็นกรณีการใช้งานที่ยอดเยี่ยมสำหรับการปกปิดข้อมูล"},{"id":439,"topic":1,"q":"Cryptographic keys for encrypted data stored in the cloud should be","qth":"คีย์การเข้ารหัสลับสำหรับข้อมูลที่เข้ารหัสที่จัดเก็บไว้ในคลาวด์ควร","a":["Not stored with the cloud provider","Generated with redundancy","At least 128 bits long","Split into groups"],"ath":["ไม่จัดเก็บไว้กับผู้ให้บริการคลาวด์","สร้างขึ้นด้วยความซ้ำซ้อน","ความยาวอย่างน้อย 128 บิต","แบ่งออกเป็นกลุ่ม"],"ans":"A","exp":"Cryptographic keys should not be stored along with the data they secure, regardless of key length. We don't split crypto keys or generate redundant keys (doing so would violate the principle of secrecy necessary for keys to serve their purpose),","expth":"ไม่ควรจัดเก็บคีย์การเข้ารหัสลับพร้อมกับข้อมูลที่พวกเขารักษาความปลอดภัย ไม่ว่าคีย์จะมีความยาวเท่าใดก็ตาม เราไม่แยกคีย์ crypto หรือสร้างคีย์ที่ซ้ำซ้อน (การกระทำดังกล่าวจะเป็นการละเมิดหลักการการรักษาความลับที่จำเป็นสำหรับคีย์ในการให้บริการตามวัตถุประสงค์)"},{"id":440,"topic":1,"q":"Tokenization requires two distinct","qth":"การทำให้เป็นโทเค็นต้องใช้สองบุคคลที่แตกต่างกัน","a":["Personnel","Authentication factors","Encryption keys","Databases"],"ath":["บุคลากร","ปัจจัยการตรวจสอบสิทธิ์","คีย์การเข้ารหัส","ฐานข้อมูล"],"ans":"D","exp":"In order to implement tokenization, there will need to be two databases: the database containing the raw, original data, and the token database containing tokens that map to original data. Having two-factor authenticationis nice, but certainly not required. Encryption keys are not necessary for tokenization. Two-person integrity does not have anything to do with tokenization","expth":"เพื่อที่จะนำโทเค็นไปใช้ จะต้องมีฐานข้อมูลสองแห่ง: ฐานข้อมูลที่ประกอบด้วยข้อมูลดิบที่เป็นต้นฉบับ และฐานข้อมูลโทเค็นที่มีโทเค็นที่แมปกับข้อมูลต้นฉบับ การมีการรับรองความถูกต้องด้วยสองปัจจัยเป็นสิ่งที่ดี แต่ก็ไม่จำเป็นอย่างแน่นอน คีย์การเข้ารหัสไม่จำเป็นสำหรับโทเค็น ความซื่อสัตย์ของคนสองคนไม่มีส่วนเกี่ยวข้องกับการสร้างโทเค็น"},{"id":441,"topic":1,"q":"Best practices for key management include all of the following, except","qth":"แนวทางปฏิบัติที่ดีที่สุดสำหรับการจัดการคีย์รวมถึงสิ่งต่อไปนี้ทั้งหมด ยกเว้น","a":["Ensure multifactor authentication","Pass keys out of band","Have key recovery processes","Maintain key security"],"ath":["ตรวจสอบให้แน่ใจว่ามีการตรวจสอบสิทธิ์แบบหลายปัจจัย","ส่งคีย์ออกจากแบนด์","มีกระบวนการกู้คืนคีย์","รักษาความปลอดภัยของคีย์"],"ans":"A","exp":"We should do all of these except for requiring multifactor authentication, which is pointless in key management","expth":"เราควรดำเนินการทั้งหมดเหล่านี้ ยกเว้นการกำหนดให้ต้องมีการตรวจสอบสิทธิ์แบบหลายปัจจัย ซึ่งไม่มีจุดหมายในการจัดการคีย์"},{"id":442,"topic":1,"q":"Data labels could include all the following, except:","qth":"ป้ายกำกับข้อมูลอาจมีสิ่งต่อไปนี้ทั้งหมด ยกเว้น:","a":["Distribution limitations","Multifactor authentication","Confidentiality level","Access restrictions"],"ath":["ข้อจำกัดในการเผยแพร่","การตรวจสอบสิทธิ์แบบหลายปัจจัย","ระดับการรักษาความลับ","ข้อจำกัดการเข้าถึง"],"ans":"B","exp":"All the others might be included in data labels, but multifactor authentication is a procedure used for access control, not a label","expth":"อื่นๆ ทั้งหมดอาจรวมอยู่ในป้ายกำกับข้อมูล แต่การตรวจสอบสิทธิ์แบบหลายปัจจัยเป็นขั้นตอนที่ใช้สำหรับการควบคุมการเข้าถึง ไม่ใช่ป้ายกำกับ"},{"id":443,"topic":1,"q":"What is the correct order of the phases of the data life cycle?","qth":"ลำดับที่ถูกต้องของระยะของวงจรชีวิตข้อมูลคืออะไร","a":["Create, Use, Store, Share, Archive, Destroy","Create, Archive, Store, Share, Use, Destroy","Create, Store, Use, Archive, Share, Destroy","Create, Store, Use, Share, Archive, Destroy"],"ath":["สร้าง ใช้ จัดเก็บ แบ่งปัน เก็บถาวร ทำลาย","สร้าง เก็บถาวร จัดเก็บ แบ่งปัน ใช้ ทำลาย","สร้าง จัดเก็บ ใช้ เก็บถาวร แบ่งปัน ทำลาย","สร้าง จัดเก็บ ใช้ แบ่งปัน เก็บถาวร ทำลาย"],"ans":"D","exp":"The other options are the names of the phases, but out of proper order","expth":"ตัวเลือกอื่น ๆ คือชื่อของเฟส แต่ไม่อยู่ใน สั่งซื้อที่เหมาะสม"},{"id":444,"topic":1,"q":"Cryptographic keys should be secured","qth":"คีย์การเข้ารหัสควรมีการรักษาความปลอดภัย","a":["To allevel at least as high as the data they can decrypt","In vaults","With two-person integrity","By armed guards"],"ath":["เพื่อเพิ่มระดับอย่างน้อยให้สูงเท่ากับข้อมูลที่พวกเขาสามารถถอดรหัสได้","ในห้องนิรภัย","ด้วยความสมบูรณ์ของคนสองคน","โดยเจ้าหน้าที่ติดอาวุธ"],"ans":"A","exp":"The physical security of crypto keys is of some concern, but guards or vaults are not always necessary. Two-person integrity might be a good practice for protecting keys. The best answer to this question is option A, because it is always true, whereas the remaining options depend on circumstances","expth":"ความปลอดภัยทางกายภาพของคีย์เข้ารหัสเป็นสิ่งที่น่ากังวลอยู่บ้าง แต่เจ้าหน้าที่หรือห้องนิรภัยไม่จำเป็นเสมอไป ความซื่อสัตย์สุจริตของคนสองคนอาจเป็นแนวทางปฏิบัติที่ดีในการปกป้องกุญแจ คำตอบที่ดีที่สุดสำหรับคำถามนี้คือตัวเลือก A เพราะมันจะเป็นจริงเสมอ ในขณะที่ตัวเลือกที่เหลือจะขึ้นอยู่กับสถานการณ์"},{"id":445,"topic":1,"q":"What is the experimental technology that might lead to the possibility of processing encrypted data without having to decrypt it first?","qth":"เทคโนโลยีทดลองใดที่อาจนำไปสู่ความเป็นไปได้ในการประมวลผลข้อมูลที่เข้ารหัสโดยไม่ต้องถอดรหัสก่อน?","a":["One-time pads","Link encryption","Homomorphic encryption","AES"],"ath":["แพดแบบครั้งเดียว","การเข้ารหัสลิงก์","การเข้ารหัสแบบ Homomorphic","AES"],"ans":"C","exp":"AES is an encryption standard. Link encryption is a method for protecting communications traffic. One-time pads are an encryption method","expth":"AES เป็นมาตรฐานการเข้ารหัส การเข้ารหัสลิงก์เป็นวิธีหนึ่งในการป้องกันการรับส่งข้อมูลการสื่อสาร แพดแบบครั้งเดียวเป็นวิธีการเข้ารหัส"},{"id":446,"topic":1,"q":"What are third-party providers of IAM functions for the cloud environment?","qth":"ผู้ให้บริการฟังก์ชัน IAM บุคคลที่สามสำหรับสภาพแวดล้อมระบบคลาวด์คืออะไร","a":["AESs","SIEMs","DLPs","CASBs"],"ath":["AESs","SIEMs","DLPs","CASBs"],"ans":"D","exp":"Data loss, leak prevention, and protection is a family of tools used to reduce the possibility of unauthorized disclosure of sensitive information. SIEMs are tools used to collate and manage log data. AES is an encryption standard","expth":"การสูญหายของข้อมูล การป้องกันการรั่วไหล และการป้องกันคือกลุ่มเครื่องมือที่ใช้เพื่อลดความเป็นไปได้ของการเปิดเผยข้อมูลที่ละเอียดอ่อนโดยไม่ได้รับอนุญาต SIEM เป็นเครื่องมือที่ใช้ในการเปรียบเทียบและจัดการข้อมูลบันทึก AES เป็นมาตรฐานการเข้ารหัส"},{"id":447,"topic":1,"q":"Data labels could include all the following, except:","qth":"ป้ายกำกับข้อมูลอาจมีรายการต่อไปนี้ทั้งหมด ยกเว้น:","a":["Data value","Data of scheduled destruction","Date data was created","Data owner"],"ath":["ค่าข้อมูล","ข้อมูลการทำลายตามกำหนดเวลา","วันที่สร้างข้อมูล","เจ้าของข้อมูล"],"ans":"A","exp":"All the others might be included in data labels, but we dor't usually include data value, since itis prone to change frequently, and because it might not be information we want to disclose to anyone who does not have need to know","expth":"รายการอื่นๆ ทั้งหมดอาจรวมอยู่ในป้ายกำกับข้อมูล แต่โดยปกติแล้วเราจะไม่รวมค่าข้อมูล เนื่องจากมีแนวโน้มที่จะเปลี่ยนแปลงบ่อยครั้ง และเนื่องจากอาจไม่ใช่ข้อมูลที่เราต้องการเปิดเผยแก่ใครก็ตามที่ไม่จำเป็นต้องทราบ"},{"id":448,"topic":1,"q":"What are the U.S. Commerce Department controls on technology exports known as?","qth":"กระทรวงพาณิชย์ของสหรัฐอเมริกาควบคุมการส่งออกเทคโนโลยีที่เรียกว่าอะไร","a":["ITAR","DRM","EAR (ERE","EAL"],"ath":["ITAR","DRM","EAR (ERE","EAL"],"ans":"C","exp":"EAR is a Commerce Department program. Evaluation assurance levels are part of the Common Criteria standard from ISO. Digital rights management tools are used for protecting electronic processing of intellectual property","expth":"EAR เป็นโปรแกรมของกระทรวงพาณิชย์ ระดับการประกันการประเมินเป็นส่วนหนึ่งของมาตรฐาน Common Criteria จาก ISO เครื่องมือการจัดการสิทธิ์ดิจิทัลใช้เพื่อปกป้องการประมวลผลทางอิเล็กทรอนิกส์ของทรัพย์สินทางปัญญา"},{"id":449,"topic":1,"q":"All of these are methods of data discovery, except","qth":"ทั้งหมดนี้เป็นวิธีการค้นพบข้อมูล ยกเว้น","a":["Label-based","User-based","Content-based","Metadata-based"],"ath":["ตามป้ายกำกับ","ตามผู้ใช้","ตามเนื้อหา","ตามข้อมูลเมตา"],"ans":"B","exp":"All the others are valid methods of data discovery; user-based is a red herring with no meaning","expth":"วิธีอื่นๆ ทั้งหมดเป็นวิธีการที่ถูกต้องในการค้นพบข้อมูล ขึ้นอยู่กับผู้ใช้เป็นปลาเฮอริ่งแดงที่ไม่มีความหมาย"},{"id":450,"topic":1,"q":"The various models generally available for cloud BC/DR activities include all of the following except","qth":"The various models generally available for cloud BC/DR activities include all of the following except","a":["Private architecture, cloud backup","Cloud provider, backup from another cloud provider","Cloud provider, backup from same provider","Cloud provider, backup from private provider"],"ath":["Private architecture, cloud backup","Cloud provider, backup from another cloud provider","Cloud provider, backup from same provider","Cloud provider, backup from private provider"],"ans":"D","exp":"This is not a normal configuration and would not likely provide genuine benef","expth":"This is not a normal configuration and would not likely provide genuine benef"},{"id":451,"topic":1,"q":"Which kind of SSAE audit reviews controls dealing with the organization's controls for assuring the confidentiality, integrity, and availability of data?","qth":"Which kind of SSAE audit reviews controls dealing with the organization's controls for assuring the confidentiality, integrity, and availability of data?","a":["SOC1","SOC2","SOC3","SOC4"],"ath":["SOC1","SOC2","SOC3","SOC4"],"ans":"B","exp":"SOC 2 deals with the CIA triad. SOC 1 is for financial reporting. SOC 3 is only an attestation by the auditor. There is no SOC 4","expth":"SOC 2 deals with the CIA triad. SOC 1 is for financial reporting. SOC 3 is only an attestation by the auditor. There is no SOC 4"},{"id":452,"topic":1,"q":"To address shared monitoring and testing responsibilities in a cloud configuration, the provider might offer all these to the cloud customer except","qth":"To address shared monitoring and testing responsibilities in a cloud configuration, the provider might offer all these to the cloud customer except","a":["Access to audit logs and performance data","DLP solution results","Security control administration","SIM, SEIM. and SEM logs"],"ath":["Access to audit logs and performance data","DLP solution results","Security control administration","SIM, SEIM. and SEM logs"],"ans":"C","exp":"While the provider might share any of the other options listed, the provider will not share administration of security controls with the customer. Security controls are the sole province of the provider","expth":"While the provider might share any of the other options listed, the provider will not share administration of security controls with the customer. Security controls are the sole province of the provider"},{"id":453,"topic":1,"q":"Which kind of SSAE audit report is most beneficial for a cloud customer, even though it’s unlikely the cloud provider will share it?","qth":"Which kind of SSAE audit report is most beneficial for a cloud customer, even though it’s unlikely the cloud provider will share it?","a":["S0C3","SOC1 Type2","SOC2 Type 2","SOC1 Type1"],"ath":["S0C3","SOC1 Type2","SOC2 Type 2","SOC1 Type1"],"ans":"C","exp":"The SOC 3 is the least detailed, so the provider is not concerned about revealing it. The SOC 1 Types 1 and 2 are about financial reporting and not relevant. The SOC 2 Type 2 is much more detailed and will most likely be kept closely held by the provider","expth":"The SOC 3 is the least detailed, so the provider is not concerned about revealing it. The SOC 1 Types 1 and 2 are about financial reporting and not relevant. The SOC 2 Type 2 is much more detailed and will most likely be kept closely held by the provider"},{"id":454,"topic":1,"q":"When reviewing the BIA after a cloud migration, the organization should take into account new factors related to data breach impacts. One of these new factors is:","qth":"When reviewing the BIA after a cloud migration, the organization should take into account new factors related to data breach impacts. One of these new factors is:","a":["Many states have data breach notification laws","Breaches can cause the loss of proprietary data","Breaches can cause the loss of intellectual property","Legal liability can't be transferred to the cloud provider"],"ath":["Many states have data breach notification laws","Breaches can cause the loss of proprietary data","Breaches can cause the loss of intellectual property","Legal liability can't be transferred to the cloud provider"],"ans":"D","exp":"State notification laws and the loss of proprietary data/intellectual property pre-existed the cloud; only the lack of ability to transfer liability is new","expth":"State notification laws and the loss of proprietary data/intellectual property pre-existed the cloud; only the lack of ability to transfer liability is new"},{"id":455,"topic":1,"q":"What is the term we use to describe the general ease and efficiency of moving data from one cloud provider either to another cloud provider or down from the cloud?","qth":"What is the term we use to describe the general ease and efficiency of moving data from one cloud provider either to another cloud provider or down from the cloud?","a":["Obfuscation","Elasticity","Mobility","Portability"],"ath":["Obfuscation","Elasticity","Mobility","Portability"],"ans":"D","exp":"Elasticity is the name for the benefit of cloud computing where resources can be apportioned as necessary to meet customer demand. Obfuscation is a technique to hide full raw datasets, either from personnel who do not have need to know or for use in testing. Mobility is not a term pertinent to the CBK","expth":"Elasticity is the name for the benefit of cloud computing where resources can be apportioned as necessary to meet customer demand. Obfuscation is a technique to hide full raw datasets, either from personnel who do not have need to know or for use in testing. Mobility is not a term pertinent to the CBK"},{"id":456,"topic":1,"q":"Countermeasures for protecting cloud operations against internal threats include all of the following except","qth":"Countermeasures for protecting cloud operations against internal threats include all of the following except","a":["Mandatory vacation","Least privilege","Separation of duties","Conflict of interest"],"ath":["Mandatory vacation","Least privilege","Separation of duties","Conflict of interest"],"ans":"D","exp":"Conflict of interest is a threat, not a control","expth":"Conflict of interest is a threat, not a control"},{"id":457,"topic":1,"q":"The cloud customer will have the most control of their data and systems, and the cloud provider will have the least amount of responsibility, in which cloud computing arrangement?","qth":"The cloud customer will have the most control of their data and systems, and the cloud provider will have the least amount of responsibility, in which cloud computing arrangement?","a":["laaS","SaaS","Community cloud","PaaS"],"ath":["laaS","SaaS","Community cloud","PaaS"],"ans":"A","exp":"laaS entails the cloud customer instaling and maintaining the OS, programs, and data; PaaS has the customer installing programs and data; in SaaS, the customer only uploads data. In a community cloud, data and device owners are distributed","expth":"laaS entails the cloud customer instaling and maintaining the OS, programs, and data; PaaS has the customer installing programs and data; in SaaS, the customer only uploads data. In a community cloud, data and device owners are distributed"},{"id":458,"topic":1,"q":"Countermeasures for protecting cloud operations against external attackers include all of the following except:","qth":"Countermeasures for protecting cloud operations against external attackers include all of the following except:","a":["Continual monitoring for anomalous activity","Detailed and extensive background checks","Regular and detailed configuration/change management activities","Hard"],"ath":["Continual monitoring for anomalous activity","Detailed and extensive background checks","Regular and detailed configuration/change management activities","Hard"],"ans":"B","exp":"Background checks are controls for attenuating potential threats from internal actors; external threats aren't likely to submit to background checks","expth":"Background checks are controls for attenuating potential threats from internal actors; external threats aren't likely to submit to background checks"},{"id":459,"topic":1,"q":"User access to the cloud environment can be administered in al of the following ways except","qth":"User access to the cloud environment can be administered in al of the following ways except","a":["Provider provides administration on behalf the customer","Customer directly administers access","Third party provides administration on behalf of the customer","Customer provides administration on behalf of the provider"],"ath":["Provider provides administration on behalf the customer","Customer directly administers access","Third party provides administration on behalf of the customer","Customer provides administration on behalf of the provider"],"ans":"D","exp":"The customer does not administer on behalf of the provider. All the rest are possible options","expth":"The customer does not administer on behalf of the provider. All the rest are possible options"},{"id":460,"topic":1,"q":"Countermeasures for protecting cloud operations against internal threats include all of the following except","qth":"Countermeasures for protecting cloud operations against internal threats include all of the following except","a":["Extensive and comprehensive training programs, including initial, recurring, and refresher sessions","Skills and knowledge testing","Hard","Aggressive background checks"],"ath":["Extensive and comprehensive training programs, including initial, recurring, and refresher sessions","Skills and knowledge testing","Hard","Aggressive background checks"],"ans":"C","exp":"Hard","expth":"Hard"},{"id":461,"topic":1,"q":"Each of the following are dependencies that must be considered when reviewing the BIA after cloud migration except","qth":"Each of the following are dependencies that must be considered when reviewing the BIA after cloud migration except","a":["The cloud provider's utilities","The cloud provider's suppliers","The cloud provider's resellers","The cloud provider's vendors"],"ath":["The cloud provider's utilities","The cloud provider's suppliers","The cloud provider's resellers","The cloud provider's vendors"],"ans":"C","exp":"The cloud provider's resellers are a marketing and sales mechanism, not an operational dependency that could affect the security of a cloud customer","expth":"The cloud provider's resellers are a marketing and sales mechanism, not an operational dependency that could affect the security of a cloud customer"},{"id":462,"topic":1,"q":"Because of multitenancy, specific risks in the public cloud that don't exist in the other cloud service models include all the following except","qth":"Because of multitenancy, specific risks in the public cloud that don't exist in the other cloud service models include all the following except","a":["DoS/DDoS","Information bleed","Risk of loss/disclosure due to legal seizures","Escalation of privilege"],"ath":["DoS/DDoS","Information bleed","Risk of loss/disclosure due to legal seizures","Escalation of privilege"],"ans":"A","exp":"DoS/DDoS threats and risks are not unique to the public cloud model","expth":"DoS/DDoS threats and risks are not unique to the public cloud model"},{"id":463,"topic":1,"q":"What is the cloud service model in which the customer is responsible for administration of the OS?","qth":"What is the cloud service model in which the customer is responsible for administration of the OS?","a":["QaaS","SaaS","PaaS","laaS"],"ath":["QaaS","SaaS","PaaS","laaS"],"ans":"D","exp":"In laaS, the cloud provider only owns the hardware and supplies the utilities. The customer is responsible for the OS, programs, and data. In PaaS and SaaS, the provider also owns the OS. There is no QaaS. That is a red herring","expth":"In laaS, the cloud provider only owns the hardware and supplies the utilities. The customer is responsible for the OS, programs, and data. In PaaS and SaaS, the provider also owns the OS. There is no QaaS. That is a red herring"},{"id":464,"topic":1,"q":"All of the following are techniques to enhance the portability of cloud data, in order to minimize the potential of vendor lock-in except:","qth":"All of the following are techniques to enhance the portability of cloud data, in order to minimize the potential of vendor lock-in except:","a":["Ensure there are no physical limitations to moving","Use DRM and DLP solutions widely throughout the cloud operation","Ensure favorable contract terms to support portability","Avoid proprietary data formats"],"ath":["Ensure there are no physical limitations to moving","Use DRM and DLP solutions widely throughout the cloud operation","Ensure favorable contract terms to support portability","Avoid proprietary data formats"],"ans":"B","exp":"DRM and DLP are used for increased authentication/access control and egress monitoring, respectively, and would actually decrease portability instead of enhancing it","expth":"DRM and DLP are used for increased authentication/access control and egress monitoring, respectively, and would actually decrease portability instead of enhancing it"},{"id":465,"topic":1,"q":"Hardening the operating system refers to all of the following except:","qth":"Hardening the operating system refers to all of the following except:","a":["Limiting administrator access","Closing unused ports","Removing antimalware agents","Removing unnecessary services and libraries"],"ath":["Limiting administrator access","Closing unused ports","Removing antimalware agents","Removing unnecessary services and libraries"],"ans":"C","exp":"Removing antimalware agents. Hardening the operating system means making it more secure. Limiting administrator access, closing unused ports, and removing unnecessary services and libraries all have the potential to make an OS more secure. But removing antimalware agents would actually make the system less secure. If anything, antimalware agents should be added, not removed","expth":"Removing antimalware agents. Hardening the operating system means making it more secure. Limiting administrator access, closing unused ports, and removing unnecessary services and libraries all have the potential to make an OS more secure. But removing antimalware agents would actually make the system less secure. If anything, antimalware agents should be added, not removed"},{"id":466,"topic":1,"q":"Which kind of SSAE audit report is a cloud customer most likely to receive from a cloud provider?","qth":"Which kind of SSAE audit report is a cloud customer most likely to receive from a cloud provider?","a":["SOC 1 Type1","SOC 2 Type 2","soc3","SOC 1 Type 2"],"ath":["SOC 1 Type1","SOC 2 Type 2","soc3","SOC 1 Type 2"],"ans":"C","exp":"The SOC 3 is the least detailed, so the provider is not concerned about revealing it. The SOC 1 Types 1 and 2 are about financial reporting, and not relevant. The SOC 2 Type 2 is much more detailed and will most likely be kept closely held by the provider","expth":"The SOC 3 is the least detailed, so the provider is not concerned about revealing it. The SOC 1 Types 1 and 2 are about financial reporting, and not relevant. The SOC 2 Type 2 is much more detailed and will most likely be kept closely held by the provider"},{"id":467,"topic":1,"q":"The cloud customer's trust in the cloud provider can be enhanced by all of the following except","qth":"The cloud customer's trust in the cloud provider can be enhanced by all of the following except","a":["SLAs","Shared administration","Audits","Real-time video surveillance"],"ath":["SLAs","Shared administration","Audits","Real-time video surveillance"],"ans":"D","exp":"Video surveillance will not provide meaningful information and will not enhance trust. All the others will do it","expth":"Video surveillance will not provide meaningful information and will not enhance trust. All the others will do it"},{"id":468,"topic":1,"q":"As a res ngement using a trusted third-party model, who is the identity provider and who is the relying party?","qth":"In a federated identity arrangement using a trusted third-party model, who is the identity provider and who is the relying party?","a":["The users of the various organizations within the federations within the federation/a CASB","Each member organization/a trusted third party","Each member organization/each member organization","Acontracted third party/the various member organizations of the federation"],"ath":["The users of the various organizations within the federations within the federation/a CASB","Each member organization/a trusted third party","Each member organization/each member organization","Acontracted third party/the various member organizations of the federation"],"ans":"D","exp":"In a trusted third-party model of federation, each member organization outsources the review and approval task to a third party they all trust. This makes the third party the identifier (it issues and manages identities for all users in all organizations in the federation), and the various member organizations are the relying parties (the resource providers that share resources based on approval from the third party)","expth":"In a trusted third-party model of federation, each member organization outsources the review and approval task to a third party they all trust. This makes the third party the identifier (it issues and manages identities for all users in all organizations in the federation), and the various member organizations are the relying parties (the resource providers that share resources based on approval from the third party)"},{"id":487,"topic":1,"q":"Database activity monitoring (DAM) can be:","qth":"Database activity monitoring (DAM) can be:","a":["Host-based or network-based","Server-based or client-based","Used in the place of encryption","Used in place of data masking"],"ath":["Host-based or network-based","Server-based or client-based","Used in th
