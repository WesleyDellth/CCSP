ระยะเวลาขั้นต่ำ การตรวจสอบ SOC ประเภท 1 ได้รับการออกแบบโดยมีขอบเขตที่เป็นช่วงเวลาคงที่ และเวลาอื่นๆ ที่ระบุไว้สำหรับ SOC ประเภท 2 นั้นไม่ถูกต้อง"},{"id":292,"topic":1,"q":"With software-defined networking (SDN), which two types of network operations are segregated to allow for granularity and delegation of administrative access and functions?","qth":"เมื่อใช้ระบบเครือข่ายที่กำหนดโดยซอฟต์แวร์ (SDN) การดำเนินการเครือข่ายสองประเภทใดที่ถูกแยกออกจากกันเพื่อให้มีรายละเอียดและการมอบหมายการเข้าถึงและฟังก์ชันของผู้ดูแลระบบ","a":["Filtering and forwarding","Filtering and firewalling","Firewalling and forwarding","Forwarding and protocol"],"ath":["การกรองและการส่งต่อ","การกรองและไฟร์วอลล์","ไฟร์วอลล์และการส่งต่อ","การส่งต่อและโปรโตคอล"],"ans":"A","exp":"With SDN, the filtering and forwarding capabilities and administration are separated. This allows the cloud provider to build interfaces and management tools for administrative delegation of filtering configuration, without having to allow direct access to underlying network equipment. Firewalling and protocols are both terms related to networks, but they are not components SDN is concerned wit","expth":"ด้วย SDN ความสามารถในการกรองและการส่งต่อและการดูแลระบบจะถูกแยกออกจากกัน ซึ่งช่วยให้ผู้ให้บริการคลาวด์สามารถสร้างอินเทอร์เฟซและเครื่องมือการจัดการสำหรับการมอบหมายผู้ดูแลระบบการกำหนดค่าการกรอง โดยไม่ต้องอนุญาตการเข้าถึงโดยตรงไปยังอุปกรณ์เครือข่ายพื้นฐาน ไฟร์วอลล์และโปรโตคอลเป็นคำที่เกี่ยวข้องกับเครือข่าย แต่ไม่ใช่องค์ประกอบที่เกี่ยวข้องกับ SDN"},{"id":293,"topic":1,"q":"Along with humidity, temperature is crucial to a data center for optimal operations and protection of equipment. Which of the following is the optimal temperature range as set by ASHRAE?","qth":"นอกจากความชื้นแล้ว อุณหภูมิยังมีความสำคัญต่อศูนย์ข้อมูลเพื่อการปฏิบัติงานและการปกป้องอุปกรณ์อย่างเหมาะสมที่สุด ช่วงอุณหภูมิใดต่อไปนี้เป็นช่วงอุณหภูมิที่เหมาะสมที่สุดที่กำหนดโดย ASHRAE","a":["69.8 to 86.0°F (21 to 30°C)","51.8 to 66.2°F (11 to 19°C)","64.4 to 80.6°F (18 to 27°C)","44.6 to 60.8°F (7 to 16°C)"],"ath":["69.8 ถึง 86.0°F (21 ถึง 30°C)","51.8 ถึง 66.2°F (11 ถึง 19°C)","64.4 ถึง 80.6°F (18 ถึง 27°C)","44.6 ถึง 60.8°F (7 ถึง 16°C)"],"ans":"C","exp":"The American Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE) recommends 64.4 to 80.6 degrees Fahrenheit (or 18 to 27 degrees Celsius) as the optimal temperature range for data centers. None of these options is the recommendation from ASHRAE","expth":"The American Society of Heating, Refrigeration and Air Conditioning Engineers (ASHRAE) แนะนำให้อุณหภูมิ 64.4 ถึง 80.6 องศาฟาเรนไฮต์ (หรือ 18 ถึง 27 องศาเซลเซียส) เป็นช่วงอุณหภูมิที่เหมาะสมที่สุดสำหรับศูนย์ข้อมูล ตัวเลือกเหล่านี้ไม่ใช่คำแนะนำจาก ASHRAE"},{"id":294,"topic":1,"q":"Which of the following statements best describes a Type 1 hypervisor?","qth":"ข้อความใดต่อไปนี้อธิบายไฮเปอร์ไวเซอร์ประเภท 1 ได้ดีที่สุด","a":["The hypervisor software runs within an operating system tied to the hardware","The hypervisor software runs as a client on a server and needs an external service to administer it","The hypervisor software runs on top of an application layer","The hypervisor software runs directly on a€bare metala€ without an intermediary,"],"ath":["ซอฟต์แวร์ไฮเปอร์ไวเซอร์ทำงานภายในระบบปฏิบัติการที่เชื่อมโยงกับฮาร์ดแวร์","ซอฟต์แวร์ไฮเปอร์ไวเซอร์ทำงานเป็นไคลเอ็นต์บนเซิร์ฟเวอร์และต้องการบริการภายนอกเพื่อดูแลระบบ","ซอฟต์แวร์ไฮเปอร์ไวเซอร์ทำงานบนเลเยอร์แอปพลิเคชัน","ซอฟต์แวร์ไฮเปอร์ไวเซอร์ทำงานโดยตรงบน a€bare metala€ โดยไม่มี ตัวกลาง"],"ans":"D","exp":"With a Type 1 hypervisor, the hypervisor software runs directly on top of the bare-metal system, without any intermediary layer or hosting system. None of these statements describes a Type 1 hypervisor","expth":"ด้วยไฮเปอร์ไวเซอร์ Type 1 ซอฟต์แวร์ไฮเปอร์ไวเซอร์จะทำงานโดยตรงบนระบบ Bare-Metal โดยไม่มีเลเยอร์ตัวกลางหรือระบบโฮสติ้ง ข้อความเหล่านี้ไม่ได้อธิบายถึงไฮเปอร์ไวเซอร์ประเภท 1"},{"id":295,"topic":1,"q":"Which cloud storage type resembles a virtual hard drive and can be utilized in the same manner and with the same type of features and capabilities?","qth":"ที่เก็บข้อมูลบนคลาวด์ประเภทใดที่มีลักษณะคล้ายกับฮาร์ดไดรฟ์เสมือน และสามารถใช้งานได้ในลักษณะเดียวกันและมีคุณสมบัติและความสามารถประเภทเดียวกัน","a":["Volume","Unstructured","Structured","Object"],"ath":["ไดรฟ์ข้อมูล","ไม่มีโครงสร้าง","มีโครงสร้าง","Object"],"ans":"A","exp":"Volume storage is allocated and mounted as a virtual hard drive within laaS implementations, and it can be maintained and used the same way a traditional file system can. Object storage uses a flat structure on remote services that is accessed via opaque descriptors, structured storage resembles database storage, and unstructured storage is used to hold auxiliary files in conjunction with applications hosted within a PaaS implementation","expth":"พื้นที่เก็บข้อมูลไดรฟ์ข้อมูลได้รับการจัดสรรและติดตั้งเป็นฮาร์ดไดรฟ์เสมือนภายในการใช้งาน laaS และสามารถบำรุงรักษาและใช้งานได้ในลักษณะเดียวกับที่ระบบไฟล์แบบเดิมสามารถทำได้ พื้นที่จัดเก็บอ็อบเจ็กต์ใช้โครงสร้างเรียบบนบริการระยะไกลที่เข้าถึงได้ผ่านตัวอธิบายทึบ พื้นที่จัดเก็บที่มีโครงสร้างคล้ายกับพื้นที่จัดเก็บฐานข้อมูล และพื้นที่จัดเก็บที่ไม่มีโครงสร้างใช้เพื่อเก็บไฟล์เสริมร่วมกับแอปพลิเคชันที่โฮสต์ภายในการนำ PaaS ไปใช้"},{"id":296,"topic":1,"q":"Which aspect of SaaS will alleviate much of the time and energy organizations spend on compliance (specifically baselines)?","qth":"แง่มุมใดของ SaaS ที่จะช่วยลดเวลาและพลังงานส่วนใหญ่ที่องค์กรใช้จ่ายในการปฏิบัติตามกฎระเบียบ (พื้นฐานโดยเฉพาะ)?","a":["Maintenance","Licensing","Standardization","Development"],"ath":["การบำรุงรักษา","การออกใบอนุญาต","การกำหนดมาตรฐาน","การพัฒนา"],"ans":"C","exp":"With the entire software platform being controlled by the cloud provider, the standardization of configurations and versioning is done automatically for the cloud customer. This alleviates the customer's need to track upgrades and releases for its own systems and development; instead, the onus is on the cloud provider. Although licensing is the responsibilty of the cloud customer within SaaS, it does not have an impact on compliance requirements. Within SaaS, development and maintenance of the system are solely the responsibility of the cloud provider","expth":"ด้วยแพลตฟอร์มซอฟต์แวร์ทั้งหมดที่ถูกควบคุมโดยผู้ให้บริการระบบคลาวด์ การกำหนดมาตรฐานของการกำหนดค่าและการกำหนดเวอร์ชันจะดำเนินการโดยอัตโนมัติสำหรับลูกค้าระบบคลาวด์ สิ่งนี้ช่วยลดความต้องการของลูกค้าในการติดตามการอัพเกรดและรีลีสสำหรับระบบและการพัฒนาของตนเอง ความรับผิดชอบอยู่ที่ผู้ให้บริการคลาวด์แทน แม้ว่าการออกใบอนุญาตจะเป็นความรับผิดชอบของลูกค้าระบบคลาวด์ภายใน SaaS แต่ก็ไม่ได้ส่งผลกระทบต่อข้อกำหนดในการปฏิบัติตามข้อกำหนด ภายใน SaaS การพัฒนาและบำรุงรักษาระบบถือเป็นความรับผิดชอบของผู้ให้บริการคลาวด์แต่เพียงผู้เดียว"},{"id":297,"topic":1,"q":"Many tools and technologies are available for securing or monitoring data in transit within a data center, whether it is a traditional data center or a cloud. Which of the following is NOT a technology for securing data in transit?","qth":"มีเครื่องมือและเทคโนโลยีมากมายสำหรับการรักษาความปลอดภัยหรือการตรวจสอบข้อมูลระหว่างทางภายในศูนย์ข้อมูล ไม่ว่าจะเป็นศูนย์ข้อมูลแบบดั้งเดิมหรือบนคลาวด์ ข้อใดต่อไปนี้ไม่ใช่เทคโนโลยีสำหรับการรักษาความปลอดภัยข้อมูลระหว่างทาง","a":["VPN","TLS","DNSSEC","HTTPS"],"ath":["วีพีพีเอ็น","ทลส","ดีเอสเอสอีซี","HTTPS"],"ans":"C","exp":"DNSSEC is an extension of the normal DNS protocol that enables a system to verify the integrity of a DNS query resolution by signing it from the authoritative source and verifying the signing chain. It is not used for securing data transmissions or exchanges. HTTPS is the most common method for securing web service and data calls within a cloud, and TLS is the current standard for encrypting HTTPS traffic. VPNs are widely used for securing data transmissions and service access","expth":"DNSSEC เป็นส่วนขยายของโปรโตคอล DNS ปกติที่ช่วยให้ระบบสามารถตรวจสอบความสมบูรณ์ของการแก้ปัญหาการสืบค้น DNS โดยการลงนามจากแหล่งที่เชื่อถือได้และตรวจสอบห่วงโซ่การลงนาม ไม่ได้ใช้เพื่อความปลอดภัยในการส่งหรือแลกเปลี่ยนข้อมูล HTTPS เป็นวิธีการทั่วไปในการรักษาความปลอดภัยบริการเว็บและการโทรข้อมูลภายในระบบคลาวด์ และ TLS เป็นมาตรฐานปัจจุบันสำหรับการเข้ารหัสการรับส่งข้อมูล HTTPS VPN ถูกนำมาใช้กันอย่างแพร่หลายในการรักษาความปลอดภัยการส่งข้อมูลและการเข้าถึงบริการ"},{"id":298,"topic":1,"q":"With a federated identity system, where would a user perform their authentication when requesting services or application access?","qth":"ด้วยระบบการระบุตัวตนแบบรวมศูนย์ ผู้ใช้จะดำเนินการตรวจสอบสิทธิ์ของตนที่ไหนเมื่อร้องขอบริการหรือการเข้าถึงแอปพลิเคชัน","a":["Cloud provider","The application","Their home organization","Third-party authentication system"],"ath":["ผู้ให้บริการคลาวด์","แอปพลิเคชัน","องค์กรบ้านเกิดของผู้ใช้","ระบบยืนยันตัวตนของบุคคลที่สาม"],"ans":"C","exp":"With a federated identity system, a user will perform authentication with their home organization, and the application will accept the authentication tokens and user information from the identity provider in order to grant access. The purpose of a federated system is to allow users to authenticate from their home organization. Therefore, using the application or a third-party authentication system would be contrary to the purpose of a federated system because it necessitates the creation of additional accounts. The use of a cloud provider would not be relevant to the operations of a federated system","expth":"ด้วยระบบการระบุตัวตนแบบรวมศูนย์ ผู้ใช้จะดำเนินการตรวจสอบสิทธิ์กับองค์กรที่บ้านของตน และแอปพลิเคชันจะยอมรับโทเค็นการตรวจสอบสิทธิ์และข้อมูลผู้ใช้จากผู้ให้บริการข้อมูลระบุตัวตนเพื่อให้สิทธิ์ในการเข้าถึง วัตถุประสงค์ของระบบรวมศูนย์คือการอนุญาตให้ผู้ใช้ตรวจสอบสิทธิ์จากองค์กรที่บ้านของตน ดังนั้น การใช้แอปพลิเคชันหรือระบบการตรวจสอบความถูกต้องของบุคคลที่สามจะขัดแย้งกับวัตถุประสงค์ของระบบรวมศูนย์ เนื่องจากจำเป็นต้องสร้างบัญชีเพิ่มเติม การใช้ผู้ให้บริการคลาวด์จะไม่เกี่ยวข้องกับการทำงานของระบบรวมศูนย์"},{"id":299,"topic":1,"q":"Where is an XML firewall most commonly and effectively deployed in the environment?","qth":"ไฟร์วอลล์ XML ใช้งานทั่วไปและมีประสิทธิภาพมากที่สุดในสภาพแวดล้อมที่ไหน","a":["Between the application and data layers","Between the presentation and application layers","Between the IPS and firewall","Between the firewall and application server"],"ath":["ระหว่างแอปพลิเคชันและชั้นข้อมูล",">ระหว่างเลเยอร์การนำเสนอและแอปพลิเคชัน","ระหว่าง IPS และไฟร์วอลล์","ระหว่างไฟร์วอลล์และเซิร์ฟเวอร์แอปพลิเคชัน"],"ans":"D","exp":"An XML firewall is most commonly deployed in line between the firewall and application server to validate XML code before it reaches the application. An XML firewall is intended to validate XML before it reaches the application. Placing the XML firewall between the presentation and application layers, between the firewall and IPS, or between the application and data layers would not serve the intended purpose","expth":"ไฟร์วอลล์ XML มักใช้งานโดยอยู่ระหว่างไฟร์วอลล์และเซิร์ฟเวอร์แอปพลิเคชันเพื่อตรวจสอบโค้ด XML ก่อนที่จะเข้าถึงแอปพลิเคชัน ไฟร์วอลล์ XML มีวัตถุประสงค์เพื่อตรวจสอบความถูกต้องของ XML ก่อนที่จะเข้าถึงแอปพลิเคชัน การวางไฟร์วอลล์ XML ระหว่างเลเยอร์การนำเสนอและแอปพลิเคชัน ระหว่างไฟร์วอลล์และ IPS หรือระหว่างแอปพลิเคชันและชั้นข้อมูลจะไม่ตอบสนองวัตถุประสงค์ที่ตั้งใจไว้"},{"id":300,"topic":1,"q":"Modern web service systems are designed for high availabilty and resiliency. Which concept pertains to the ability to detect problems within a system, environment, or application and programmatically invoke redundant systems or processes for mitigation?","qth":"ระบบบริการเว็บสมัยใหม่ได้รับการออกแบบเพื่อความพร้อมใช้งานและความยืดหยุ่นสูง แนวคิดใดที่เกี่ยวข้องกับความสามารถในการตรวจจับปัญหาภายในระบบ สภาพแวดล้อม หรือแอปพลิเคชัน และเรียกใช้ระบบหรือกระบวนการที่ซ้ำซ้อนทางโปรแกรมเพื่อบรรเทาผลกระทบ?","a":["Elasticity","Redundancy","Fault tolerance","Automation"],"ath":["ความยืดหยุ่น","ความซ้ำซ้อน","ความทนทานต่อข้อผิดพลาด","การทำงานอัตโนมัติ"],"ans":"C","exp":"Fault tolerance allows a system to continue functioning, even with degraded performance, if portions of it fal or degrade, without the entire system or service being taken down. It can detect problems within a service and invoke compensating systems or functions to keep functionality going. Although redundancy is similar to fault tolerance, it is more focused on having additional copies of systems available, either active or passive, that can take up services if one system goes down Elasticity pertains to the ability of a system to resize to meet demands, but it is not focused on system failures. Automation, and its role in maintaining large systems with minimal intervention, is not directly related to fault tolerance","expth":"ความทนทานต่อข้อผิดพลาดทำให้ระบบสามารถทำงานได้ต่อไป แม้ว่าประสิทธิภาพจะลดลง หากบางส่วนของระบบล้มเหลวหรือลดลง โดยไม่ต้องใช้ระบบหรือบริการทั้งหมด ลง สามารถตรวจจับปัญหาภายในบริการและเรียกใช้ระบบหรือฟังก์ชันชดเชยเพื่อให้ฟังก์ชันการทำงานดำเนินต่อไปได้ แม้ว่าความซ้ำซ้อนจะคล้ายกับความทนทานต่อความเสียหาย แต่จะเน้นไปที่การมีสำเนาของระบบเพิ่มเติม ทั้งแบบแอ็คทีฟหรือแบบพาสซีฟ ซึ่งสามารถเข้ารับบริการได้หากระบบใดระบบหนึ่งหยุดทำงาน ความยืดหยุ่นเกี่ยวข้องกับความสามารถของระบบในการปรับขนาดเพื่อตอบสนองความต้องการ แต่ไม่ได้มุ่งเน้นไปที่ความล้มเหลวของระบบ ระบบอัตโนมัติและบทบาทของระบบในการดูแลรักษาระบบขนาดใหญ่โดยมีการแทรกแซงน้อยที่สุดไม่เกี่ยวข้องโดยตรงกับความทนทานต่อข้อผิดพลาด"},{"id":301,"topic":1,"q":"On large distributed systems with pooled resources, cloud computing relies on extensive orchestration to maintain the environment and the constant provisioning of resources. Which of the following is crucial to the orchestration and automation of networking resources within a cloud?","qth":"บนระบบแบบกระจายขนาดใหญ่ที่มีทรัพยากรรวมกัน การประมวลผลแบบคลาวด์อาศัยการประสานที่กว้างขวางเพื่อรักษาสภาพแวดล้อมและการจัดเตรียมทรัพยากรอย่างต่อเนื่อง ข้อใดต่อไปนี้มีความสำคัญต่อการจัดระบบและการทำงานอัตโนมัติของทรัพยากรเครือข่ายภายในระบบคลาวด์","a":["DNSSEC","DNS","DCOM","DHCP"],"ath":["ดีเอสเอสอีซี","DNS","ดีคอม","ดีเอชซีพี"],"ans":"D","exp":"The Dynamic Host Configuration Protocol (DHCP) automatically configures network settings for a host so that these settings do not need to be configured on the host statically. Given the rapid and programmatic provisioning of resources within a cloud environment, this capability is crucial to cloud operations. Both DNS and its security-integrity extension DNSSEC provide name resolution to IP addresses, but neither is used for the configuration of network settings on a host. DCOM refers to the Distributed Component Object Model, which was developed by Microsoft as a means to request services across a network, and is not used for network configurations at all","expth":"Dynamic Host Configuration Protocol (DHCP) จะกำหนดการตั้งค่าเครือข่ายสำหรับโฮสต์โดยอัตโนมัติ ดังนั้นจึงไม่จำเป็นต้องกำหนดค่าการตั้งค่าเหล่านี้บนโฮสต์แบบคงที่ เมื่อพิจารณาถึงการจัดสรรทรัพยากรภายในสภาพแวดล้อมคลาวด์ที่รวดเร็วและเป็นโปรแกรม ความสามารถนี้จึงมีความสำคัญอย่างยิ่งต่อการดำเนินงานบนคลาวด์ ทั้ง DNS และส่วนขยายความปลอดภัยสมบูรณ์ DNSSEC ให้การจำแนกชื่อให้กับที่อยู่ IP แต่ไม่ได้ใช้ทั้งสองอย่างสำหรับการกำหนดค่าการตั้งค่าเครือข่ายบนโฮสต์ DCOM หมายถึง Distributed Component Object Model ซึ่งพัฒนาโดย Microsoft เพื่อใช้ในการร้องขอบริการผ่านเครือข่าย และไม่ได้ใช้สำหรับการกำหนดค่าเครือข่ายเลย"},{"id":302,"topic":1,"q":"BCDR strategies do not typically involve the entire operations of an organization, but only those deemed critical to their business. Which concept pertains to the amount of services that need to be recovered to meet BCDR objectives?","qth":"โดยทั่วไปแล้วกลยุทธ์ BCDR จะไม่เกี่ยวข้องกับการดำเนินงานทั้งหมดขององค์กร แต่จะเกี่ยวข้องกับการดำเนินการที่ถือว่ามีความสำคัญต่อธุรกิจเท่านั้น แนวคิดใดที่เกี่ยวข้องกับจำนวนบริการที่ต้องได้รับการกู้คืนเพื่อให้บรรลุวัตถุประสงค์ BCDR","a":["RSL","RTO","RPO","SRE"],"ath":["RSL","RTO","RPO","SRE"],"ans":"A","exp":"The recovery service level (RSL) measures the percentage of operations that would be recovered during a BCDR situation. The recovery point objective (RPO) sets and defines the amount of data an organization must have available or accessible to reach the determined level of operations necessary during a BCDR situation. The recovery time objective (RTO) measures the amount of time necessary to recover operations to meet the BCDR plan. SRE is provided as an erroneous response","expth":"ระดับบริการการกู้คืน (RSL) จะวัดเปอร์เซ็นต์ของการดำเนินการที่จะได้รับการกู้คืนในระหว่างสถานการณ์ BCDR วัตถุประสงค์จุดกู้คืน (RPO) จะกำหนดและกำหนดจำนวนข้อมูลที่องค์กรต้องมีหรือสามารถเข้าถึงได้เพื่อบรรลุระดับการปฏิบัติงานที่กำหนดซึ่งจำเป็นในระหว่างสถานการณ์ BCDR วัตถุประสงค์เวลาการกู้คืน (RTO) จะวัดระยะเวลาที่จำเป็นในการกู้คืนการดำเนินการเพื่อให้เป็นไปตามแผน BCDR SRE ให้มาเป็นการตอบกลับที่ผิดพลาด"},{"id":303,"topic":1,"q":"During the course of an audit, which of the following would NOT be an input into the control requirements used as part of a gap analysis","qth":"ในระหว่างการตรวจสอบ ข้อใดต่อไปนี้จะไม่เป็นข้อมูลป้อนเข้าข้อกำหนดการควบคุมที่ใช้เป็นส่วนหนึ่งของการวิเคราะห์ช่องว่าง","a":["Contractual requirements","Regulations","Vendor recommendations","Corporate policy"],"ath":["ข้อกำหนดตามสัญญา","กฎระเบียบ","คำแนะนำผู้ขาย","นโยบายองค์กร"],"ans":"C","exp":"Vendor recommendations would not be pertinent to the gap analysis after an audit. Although vendor recommendations will typically play a role in the development of corporate policies or contractual requirements, they are not required. Regulations, corporate policy, and contractual requirements all determine the expected or mandated controls in place on a system","expth":"คำแนะนำของผู้ขายจะไม่เกี่ยวข้องกับการวิเคราะห์ช่องว่างหลังการตรวจสอบ แม้ว่าโดยทั่วไปคำแนะนำของผู้ขายจะมีบทบาทในการพัฒนานโยบายองค์กรหรือข้อกำหนดตามสัญญา แต่ก็ไม่จำเป็น กฎระเบียบ นโยบายองค์กร และข้อกำหนดตามสัญญาล้วนเป็นตัวกำหนดการควบคุมที่คาดหวังหรือได้รับมอบอำนาจในระบบ"},{"id":304,"topic":1,"q":"The GAPP framework was developed through a joint effort between the major Canadian and American professional accounting associations in order to assist their members with managing and preventing risks to the privacy of their data and customers. Which of the following is the meaning of GAPP?","qth":"กรอบการทำงาน GAPP ได้รับการพัฒนาผ่านความพยายามร่วมกันระหว่างสมาคมบัญชีวิชาชีพรายใหญ่ของแคนาดาและอเมริกา เพื่อช่วยสมาชิกในการจัดการและป้องกันความเสี่ยงต่อความเป็นส่วนตัวของข้อมูลและลูกค้าของตน ข้อใดต่อไปนี้คือความหมายของ GAPP","a":["General accounting personal privacy","Generally accepted privacy practices","Generally accepted privacy principles","General accounting privacy policies"],"ath":["ความเป็นส่วนตัวทางบัญชีทั่วไป","หลักปฏิบัติด้านความเป็นส่วนตัวที่ยอมรับโดยทั่วไป","หลักการความเป็นส่วนตัวที่ยอมรับโดยทั่วไป","นโยบายความเป็นส่วนตัวทางบัญชีทั่วไป"],"ans":"C","exp":"","expth":""},{"id":305,"topic":1,"q":"Which protocol operates at the network layer and provides for full point-to-point encryption of all communications and transmissions?","qth":"โปรโตคอลใดทำงานที่เลเยอร์เครือข่ายและให้การเข้ารหัสแบบจุดต่อจุดเต็มรูปแบบของการสื่อสารและการส่งสัญญาณทั้งหมด?","a":["PSec (ERED","VPN","SSL","TLS"],"ath":["PSec (ERED","VPN","SSL","TLS"],"ans":"A","exp":"IPSec is a protocol for encrypting and authenticating packets during transmission between two parties and can involve any type of device, application, or service The protocol performs both the authentication and negotiation of security policies between the two parties at the start of the connection and then maintains these policies throughout the lifetime of the connection. TLS operates at the application layer, not the network layer, and is widely used to secure communications between two parties. SSL is similar to TLS but has been deprecated, Although a VPN allows a secure channel for communications into a private network from an outside location, it's not a protocol","expth":"IPSec เป็นโปรโตคอลสำหรับการเข้ารหัสและการตรวจสอบความถูกต้องของแพ็คเก็ตในระหว่างการส่งระหว่างสองฝ่ายและสามารถเกี่ยวข้องกับอุปกรณ์ แอปพลิเคชัน หรือบริการประเภทใดก็ได้ โปรโตคอลดำเนินการทั้งการตรวจสอบสิทธิ์และการเจรจานโยบายความปลอดภัยระหว่าง ทั้งสองฝ่ายเมื่อเริ่มต้นการเชื่อมต่อแล้วรักษานโยบายเหล่านี้ตลอดอายุการใช้งานของการเชื่อมต่อ TLS ทำงานที่เลเยอร์แอปพลิเคชัน ไม่ใช่เลเยอร์เครือข่าย และมีการใช้กันอย่างแพร่หลายเพื่อความปลอดภัยในการสื่อสารระหว่างสองฝ่าย SSL นั้นคล้ายคลึงกับ TLS แต่เลิกใช้แล้ว แม้ว่า VPN จะอนุญาตให้มีช่องทางที่ปลอดภัยสำหรับการสื่อสารไปยังเครือข่ายส่วนตัวจากสถานที่ภายนอก แต่ก็ไม่ใช่โปรโตคอล"},{"id":306,"topic":1,"q":"When data discovery is undertaken, three main approaches or strategies are commonly used to determine what the type of data, its format, and composition are for the purposes of classification. Which of the following is NOT one of the three main approaches to data discovery?","qth":"เมื่อดำเนินการค้นพบข้อมูล โดยทั่วไปจะใช้แนวทางหรือกลยุทธ์หลักสามประการเพื่อกำหนดประเภทของข้อมูล รูปแบบ และองค์ประกอบของข้อมูลเพื่อวัตถุประสงค์ในการจำแนกประเภท ข้อใดต่อไปนี้ไม่ใช่หนึ่งในสามแนวทางหลักในการค้นหาข้อมูล","a":["Content analysis","Hashing","Labels","Metadata"],"ath":["การวิเคราะห์เนื้อหา","การแฮช","ป้ายกำกับ","ข้อมูลเมตา"],"ans":"B","exp":"Hashing involves taking a block of data and, through the use of a one-way operation, producing a fixed-size value that can be used for comparison with other data Itis used primarily for protecting data and allowing for rapid comparison when matching data values such as passwords. Labels involve looking for header information or other categorizations of data to determine its type and possible classifications. Metadata involves looking at information attributes of the data, such as creator, application, type, and so on, in determining classification. Content analysis involves examining the actual data itself for its composition and classification level","expth":"การแฮชเกี่ยวข้องกับการบล็อกข้อมูลและผ่านการใช้การดำเนินการทางเดียว ทำให้เกิดค่าขนาดคงที่ซึ่งสามารถใช้ในการเปรียบเทียบกับข้อมูลอื่นๆ ซึ่งใช้เพื่อปกป้องข้อมูลเป็นหลัก และช่วยให้สามารถเปรียบเทียบได้อย่างรวดเร็วเมื่อจับคู่ค่าข้อมูล เช่น รหัสผ่าน ป้ายกำกับเกี่ยวข้องกับการค้นหาข้อมูลส่วนหัวหรือการจัดหมวดหมู่ข้อมูลอื่นๆ เพื่อกำหนดประเภทและการจำแนกประเภทที่เป็นไปได้ ข้อมูลเมตาเกี่ยวข้องกับการดูคุณลักษณะข้อมูลของข้อมูล เช่น ผู้สร้าง แอปพลิเคชัน ประเภท และอื่นๆ ในการพิจารณาการจัดหมวดหมู่ การวิเคราะห์เนื้อหาเกี่ยวข้องกับการตรวจสอบข้อมูลจริงสำหรับองค์ประกอบและระดับการจำแนกประเภท"},{"id":307,"topic":1,"q":"There are many situations when testing a BCDR plan is appropriate or mandated. Which of the following would not be anecessary time to test a BCDR plan?","qth":"มีหลายสถานการณ์ที่การทดสอบแผน BCDR มีความเหมาะสมหรือได้รับคำสั่ง เวลาใดต่อไปนี้ที่ไม่จำเป็นในการทดสอบแผน BCDR","a":["After software updates","After regulatory changes","After major configuration changes","Annually"],"ath":["หลังจากอัพเดตซอฟต์แวร์แล้ว","หลังจากมีการเปลี่ยนแปลงกฎระเบียบ","หลังจากการเปลี่ยนแปลงการกำหนดค่าครั้งใหญ่","เป็นประจำทุกปี"],"ans":"B","exp":"Regulatory changes by themselves would not trigger a need for new testing of a BCDR plan. Any changes necessary for regulatory compliance would be accomplished through configuration changes or software updates, which in turn would then trigger the necessary new testing. Annual testing is crucial to any BCDR plan. Also, any time major configuration changes or software updates are done, the plan should be evaluated and tested to ensure it s still valid and complete","expth":"การเปลี่ยนแปลงด้านกฎระเบียบด้วยตนเองจะไม่กระตุ้นให้มีการทดสอบแผน BCDR ใหม่ การเปลี่ยนแปลงใดๆ ที่จำเป็นสำหรับการปฏิบัติตามกฎระเบียบจะสำเร็จได้ด้วยการเปลี่ยนแปลงการกำหนดค่าหรือการอัปเดตซอฟต์แวร์ ซึ่งจะทำให้เกิดการทดสอบใหม่ที่จำเป็น การทดสอบประจำปีมีความสำคัญอย่างยิ่งต่อแผน BCDR นอกจากนี้ ทุกครั้งที่มีการเปลี่ยนแปลงการกำหนดค่าที่สำคัญหรือการอัปเดตซอฟต์แวร์ แผนควรได้รับการประเมินและทดสอบเพื่อให้แน่ใจว่ายังคงใช้งานได้และสมบูรณ์"},{"id":308,"topic":1,"q":"Key maintenance and security are paramount within a cloud environment due to the widespread use of encryption for both data and transmissions Which of the following key- management systems would provide the most robust control over and ownership of the key-management processes for the cloud customer?","qth":"การบำรุงรักษาคีย์และความปลอดภัยเป็นสิ่งสำคัญยิ่งภายในสภาพแวดล้อมคลาวด์เนื่องจากมีการใช้การเข้ารหัสอย่างกว้างขวางสำหรับทั้งข้อมูลและการส่งสัญญาณ ระบบการจัดการคีย์ใดต่อไปนี้จะให้การควบคุมและความเป็นเจ้าของกระบวนการการจัดการคีย์สำหรับลูกค้าคลาวด์ที่แข็งแกร่งที่สุด","a":["Remote key management service","Local key management service","Client key management service","Internal key management service"],"ath":["บริการการจัดการคีย์ระยะไกล","บริการการจัดการคีย์ในเครื่อง","บริการการจัดการคีย์ไคลเอ็นต์","บริการการจัดการคีย์ภายใน"],"ans":"A","exp":"Aremote key management system resides away from the cloud environment and is owned and controlled by the cloud customer. With the use of a remote service, the cloud customer can avoid being locked into a proprietary system from the cloud provider, but also must ensure that service is compatible with the services offered by the cloud provider. A local key management system resides on the actual servers using the keys, which does not provide optimal security or control over them. Both the terms internal key management service and client key management service are provided as distractors","expth":"ระบบการจัดการคีย์ Aremote อยู่ห่างจากสภาพแวดล้อมคลาวด์และเป็นเจ้าของและควบคุมโดยลูกค้าคลาวด์ ด้วยการใช้บริการระยะไกล ลูกค้าคลาวด์สามารถหลีกเลี่ยงการถูกล็อกเข้าสู่ระบบที่เป็นกรรมสิทธิ์จากผู้ให้บริการคลาวด์ได้ แต่ยังต้องตรวจสอบให้แน่ใจว่าบริการนั้นเข้ากันได้กับบริการที่ผู้ให้บริการคลาวด์นำเสนอ ระบบการจัดการคีย์ภายในเครื่องอยู่บนเซิร์ฟเวอร์จริงโดยใช้คีย์ ซึ่งไม่ได้ให้ความปลอดภัยหรือการควบคุมที่เหมาะสมที่สุด ทั้งคำว่าบริการการจัดการคีย์ภายในและบริการการจัดการคีย์ไคลเอ็นต์ถือเป็นสิ่งรบกวนสมาธิ"},{"id":309,"topic":1,"q":"Security is a critical yet often overlooked consideration for BCDR planning At which stage of the planning process should security be involved?","qth":"Security is a critical yet often overlooked consideration for BCDR planning At which stage of the planning process should security be involved?","a":["Scope definition","Requirements gathering","Analysis","Risk assessment"],"ath":["Scope definition","Requirements gathering","Analysis","Risk assessment"],"ans":"A","exp":"Defining the scope of the plan is the very first step in the overall process. Security should be included from the very earliest stages and throughout the entire process. Bringing in security at a later stage can lead to additional costs and time delays to compensate for gaps in planning. Risk assessment, requirements gathering, and analysis are all later steps in the process, and adding in security at any of those points can potentially cause increased costs and time delays","expth":"Defining the scope of the plan is the very first step in the overall process. Security should be included from the very earliest stages and throughout the entire process. Bringing in security at a later stage can lead to additional costs and time delays to compensate for gaps in planning. Risk assessment, requirements gathering, and analysis are all later steps in the process, and adding in security at any of those points can potentially cause increased costs and time delays"},{"id":310,"topic":1,"q":"Which type of testing uses the same strategies and toolsets that hackers would use?","qth":"การทดสอบประเภทใดใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮกเกอร์จะใช้","a":["Static","Malicious","Penetration","Dynamic"],"ath":["แบบคงที่","ที่เป็นอันตราย","การเจาะระบบ","ไดนามิก"],"ans":"C","exp":"Penetration testing involves using the same strategies and toolsets that hackers would use against a system to discovery potential vulnerabilities. Although the term malicious captures much of the intent of penetration testing from the perspective of an attacker, it is not the best answer. Static and dynamic are two types of system testing--where static is done offline and with knowledge of the system, and dynamic is done on a live system without any previous knowledge is associated--but neither describes the type of testing being asked for in the question","expth":"การทดสอบการเจาะระบบเกี่ยวข้องกับการใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮ็กเกอร์จะใช้กับระบบเพื่อค้นหาช่องโหว่ที่อาจเกิดขึ้น แม้ว่าคำว่ามุ่งร้ายจะจับจุดประสงค์ของการทดสอบการเจาะระบบได้มากจากมุมมองของผู้โจมตี แต่ก็ไม่ใช่คำตอบที่ดีที่สุด การทดสอบระบบแบบคงที่และไดนามิกเป็นสองประเภท โดยที่แบบคงที่จะทำแบบออฟไลน์และมีความรู้เกี่ยวกับระบบ และแบบไดนามิกจะทำบนระบบที่ใช้งานจริงโดยไม่มีความรู้ก่อนหน้านี้เกี่ยวข้อง - แต่ไม่ได้อธิบายประเภทของการทดสอบที่ถูกถามในคำถาม"},{"id":311,"topic":1,"q":"Which of the following statements about Type 1 hypervisors is true?","qth":"ข้อความใดต่อไปนี้เกี่ยวกับไฮเปอร์ไวเซอร์ประเภท 1 เป็นจริง?","a":["The hardware vendor and software vendor are different","The hardware vendor and software vendor are the same","The hardware vendor provides an open platform for software vendors","The hardware vendor and software vendor should always be different for the sake of security"],"ath":["ผู้จำหน่ายฮาร์ดแวร์และผู้จำหน่ายซอฟต์แวร์แตกต่างกัน","ผู้จำหน่ายฮาร์ดแวร์และผู้จำหน่ายซอฟต์แวร์เหมือนกัน","ผู้จำหน่ายฮาร์ดแวร์จัดให้มีแพลตฟอร์มแบบเปิดสำหรับผู้จำหน่ายซอฟต์แวร์","ผู้จำหน่ายฮาร์ดแวร์และผู้จำหน่ายซอฟต์แวร์ควรแตกต่างกันเสมอเพื่อความปลอดภัย"],"ans":"B","exp":"With a Type 1 hypervisor, the management software and hardware are tightly tied together and provided by the same vendor on a closed platform. This allows for optimal security, performance, and support. The other answers are all incorrect descriptions of a Type 1 hypervisor","expth":"ด้วยไฮเปอร์ไวเซอร์ประเภท 1 ซอฟต์แวร์การจัดการและฮาร์ดแวร์จะเชื่อมโยงกันอย่างแน่นหนาและจัดเตรียมโดย ผู้จำหน่ายรายเดียวกันบนแพลตฟอร์มแบบปิด ซึ่งช่วยให้มีการรักษาความปลอดภัย ประสิทธิภาพ และการสนับสนุนที่เหมาะสมที่สุด คำตอบอื่น ๆ ล้วนเป็นคำอธิบายที่ไม่ถูกต้องของไฮเปอร์ไวเซอร์ประเภท 1"},{"id":312,"topic":1,"q":"Which format is the most commonly used standard for exchanging information within a federated identity system?","qth":"รูปแบบใดที่เป็นมาตรฐานที่ใช้กันมากที่สุดสำหรับการแลกเปลี่ยนข้อมูลภายในระบบการระบุตัวตนแบบรวมศูนย์","a":["XML","HTML","SAML","JSON"],"ath":["XML","HTML","SAML","JSON"],"ans":"C","exp":"Security Assertion Markup Language (SAML) is the most common data format for information exchange within a federated identity system. It is used to transmit and exchange authentication and authorization data.XML is similar to SAML, but it's used for general-purpose data encoding and labeling and is not used for the exchange of authentication and authorization data in the way that SAML is for federated systems. JSON is used similarly to XML, as a text-based data exchange format that typically uses attribute-value pairings, but it's not used for authentication and authorization exchange. HTML is used only for encoding web pages for web browsers and is not used for data exchange~and certainly not in a federated system,","expth":"Security Assertion Markup Language (SAML) เป็นรูปแบบข้อมูลที่พบบ่อยที่สุดสำหรับการแลกเปลี่ยนข้อมูลภายในระบบการระบุตัวตนแบบรวมศูนย์ ใช้เพื่อส่งและแลกเปลี่ยนข้อมูลการตรวจสอบสิทธิ์และการอนุญาต XML คล้ายกับ SAML แต่ใช้สำหรับการเข้ารหัสและการติดป้ายกำกับข้อมูลวัตถุประสงค์ทั่วไป และไม่ได้ใช้สำหรับการแลกเปลี่ยนข้อมูลการตรวจสอบสิทธิ์และการอนุญาตในลักษณะที่ SAML ใช้สำหรับระบบรวมศูนย์ JSON ถูกใช้คล้ายกับ XML เป็นรูปแบบการแลกเปลี่ยนข้อมูลแบบข้อความที่โดยทั่วไปจะใช้การจับคู่ค่าแอตทริบิวต์ แต่ไม่ได้ใช้สำหรับการตรวจสอบสิทธิ์และการแลกเปลี่ยนการให้สิทธิ์ HTML ใช้สำหรับการเข้ารหัสหน้าเว็บสำหรับเว็บเบราว์เซอร์เท่านั้น และไม่ได้ใช้สำหรับการแลกเปลี่ยนข้อมูล~และไม่ได้อยู่ในระบบรวมศูนย์อย่างแน่นอน"},{"id":313,"topic":1,"q":"Which ITIL component is focused on anticipating predictable problems and ensuring that configurations and operations are in place to prevent these problems from ever occurring?","qth":"องค์ประกอบ ITIL ใดที่มุ่งเน้นไปที่การคาดการณ์ปัญหาที่คาดการณ์ได้ และสร้างความมั่นใจว่าการกำหนดค่าและการดำเนินงานนั้นอยู่ในสถานที่เพื่อป้องกันไม่ให้ปัญหาเหล่านี้เกิดขึ้น","a":["Availability management","Continuity management","Configuration management","Problem management"],"ath":["การจัดการความพร้อมใช้งาน","การจัดการความต่อเนื่อง","การจัดการการกำหนดค่า","การจัดการปัญหา"],"ans":"D","exp":"Problem management is focused on identifying and mitigating known problems and deficiencies before they are able to occur, as well as on minimizing the impact of incidents that cannot be prevented. Continuity management (or business continuity management) is focused on planning for the successful restoration of systems or services after an unexpected outage, incident, or disaster. Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Configuration management tracks and maintains detailed information about all IT components within an organization","expth":"การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้นได้ เช่นเดียวกับการลดผลกระทบของเหตุการณ์ที่ไม่สามารถป้องกันได้ การจัดการความต่อเนื่อง (หรือการจัดการความต่อเนื่องทางธุรกิจ) มุ่งเน้นไปที่การวางแผนเพื่อการฟื้นฟูระบบหรือบริการที่ประสบความสำเร็จหลังจากการหยุดทำงาน เหตุการณ์ หรือภัยพิบัติที่ไม่คาดคิด การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการการกำหนดค่าติดตามและรักษาข้อมูลโดยละเอียดเกี่ยวกับส่วนประกอบไอทีทั้งหมดภายในองค์กร"},{"id":314,"topic":1,"q":"Which of the following areas of responsibility would be shared between the cloud customer and cloud provider within the Software as a Service (SaaS) category?","qth":"ความรับผิดชอบด้านใดต่อไปนี้ที่จะถูกแบ่งปันระหว่างลูกค้าระบบคลาวด์และผู้ให้บริการระบบคลาวด์ภายในหมวดหมู่ซอฟต์แวร์เป็นบริการ (SaaS)","a":["Data","Governance","Application","Physical"],"ath":["ข้อมูล","การกำกับดูแล","แอปพลิเคชัน","ทางกายภาพ"],"ans":"C","exp":"With Saas, the application is a shared responsibility between the cloud provider and cloud customer. Although the cloud provider is responsible for deploying, maintaining, and securing the application, the cloud customer does carry some responsibility for the configuration of users and options. Regardless of the cloud service category used, the physical environment is always the sole responsibility of the cloud provider. With all cloud service categories, the data and governance are always the sole responsibility of the cloud customer","expth":"ด้วย Saas แอปพลิเคชันจะเป็นความรับผิดชอบร่วมกันระหว่างผู้ให้บริการระบบคลาวด์และลูกค้าระบบคลาวด์ แม้ว่าผู้ให้บริการระบบคลาวด์จะรับผิดชอบในการปรับใช้ ดูแลรักษา และรักษาความปลอดภัยแอปพลิเคชัน แต่ลูกค้าระบบคลาวด์ก็มีความรับผิดชอบบางประการในการกำหนดค่าผู้ใช้และตัวเลือกต่างๆ ไม่ว่าบริการคลาวด์จะใช้ประเภทใด สภาพแวดล้อมทางกายภาพจะเป็นความรับผิดชอบของผู้ให้บริการคลาวด์แต่เพียงผู้เดียวเสมอ สำหรับบริการคลาวด์ทุกประเภท ข้อมูลและการกำกับดูแลถือเป็นความรับผิดชอบของลูกค้าคลาวด์แต่เพียงผู้เดียว"},{"id":315,"topic":1,"q":"When a system needs to be exposed to the public Internet, what type of secure system would be used to perform only the desired operations?","qth":"เมื่อระบบจำเป็นต้องเปิดเผยต่ออินเทอร์เน็ตสาธารณะ ระบบรักษาความปลอดภัยประเภทใดที่จะใช้เพื่อดำเนินการเฉพาะการดำเนินการที่ต้องการเท่านั้น","a":["Firewall","Proxy","Honeypot","Bastion"],"ath":["ไฟร์วอลล์","พร็อกซี","Honeypot","Bastion"],"ans":"D","exp":"A bastion is a system that is exposed to the public Internet to perform a specific function, but it is highly restricted and secured to just that function. Any nonessential services and access are removed from the bastion so that security countermeasures and monitoring can be focused just on the bastion's specific duties. A honeypot is a system designed to look like a production system to entice attackers, but it does not contain any real data, It is used for learning about types of attacks and enabling countermeasures for them. A firewall is used within a network to limit access between IP addresses and ports. A proxy server provides additional security to and rulesets for network traffic that is allowed to pass through it to a service destination","expth":"ป้อมปราการคือระบบที่เปิดเผยต่ออินเทอร์เน็ตสาธารณะเพื่อดำเนินการฟังก์ชันเฉพาะ แต่มีข้อจำกัดสูงและปลอดภัยเฉพาะฟังก์ชันนั้น บริการและการเข้าถึงที่ไม่จำเป็นใดๆ จะถูกลบออกจากป้อมปราการ เพื่อให้มาตรการตอบโต้และการตรวจสอบความปลอดภัยสามารถมุ่งความสนใจไปที่หน้าที่เฉพาะของป้อมปราการเท่านั้น honeypot คือระบบที่ออกแบบมาให้ดูเหมือนระบบที่ใช้งานจริงเพื่อล่อลวงผู้โจมตี แต่ไม่มีข้อมูลจริงใดๆ มันถูกใช้เพื่อเรียนรู้เกี่ยวกับประเภทของการโจมตีและเปิดใช้มาตรการตอบโต้สำหรับพวกเขา ไฟร์วอลล์ถูกใช้ภายในเครือข่ายเพื่อจำกัดการเข้าถึงระหว่างที่อยู่ IP และพอร์ต พร็อกซีเซิร์ฟเวอร์ให้การรักษาความปลอดภัยเพิ่มเติมและชุดกฎสำหรับการรับส่งข้อมูลเครือข่ายที่ได้รับอนุญาตให้ส่งผ่านไปยังปลายทางบริการ"},{"id":316,"topic":1,"q":"With the rapid emergence of cloud computing, very few regulations were in place that pertained to it specifically, and organizations often had to resort to using a collection of regulations that were not specific to cloud in order to drive audits and policies. Which standard from the ISO/IEC was designed specifically for cloud computing?","qth":"จากการเกิดขึ้นอย่างรวดเร็วของการประมวลผลแบบคลาวด์ จึงมีกฎระเบียบน้อยมากที่เกี่ยวข้องกับการประมวลผลแบบคลาวด์โดยเฉพาะ และองค์กรต่างๆ มักจะต้องใช้ชุดของกฎระเบียบที่ไม่เฉพาะเจาะจงกับระบบคลาวด์เพื่อขับเคลื่อนการตรวจสอบและนโยบาย มาตรฐานใดจาก ISO/IEC ที่ได้รับการออกแบบมาโดยเฉพาะสำหรับการประมวลผลแบบคลาวด์","a":["ISO/IEC 27001","ISO/IEC 19889","ISO/IEC 27001:2015","ISO/IEC 27018"],"ath":["ISO/IEC 27001","ISO/IEC 19889","ISO/IEC 27001:2015","ISO/IEC 27018"],"ans":"D","exp":"ISO/IEC 27018 was implemented to address the protection of personal and sensitive information within a cloud environment. ISO/IEC 27001 and its later 27001:2015 revision are both general-purpose data security standards. ISO/IEC 19889 is an erroneous answer","expth":"ISO/IEC 27018 ถูกนำมาใช้เพื่อจัดการกับการปกป้องข้อมูลส่วนบุคคลและข้อมูลที่ละเอียดอ่อนภายในสภาพแวดล้อมระบบคลาวด์ ISO/IEC 27001 และการแก้ไข 27001:2015 ในภายหลังถือเป็นมาตรฐานความปลอดภัยของข้อมูลสำหรับวัตถุประสงค์ทั่วไป ISO/IEC 19889 เป็นคำตอบที่ผิดพลาด"},{"id":317,"topic":1,"q":"Which of the following is NOT considered a type of data loss?","qth":"ข้อใดต่อไปนี้ไม่ถือเป็นประเภทของการสูญหายของข้อมูล","a":["Data corruption","Stolen by hackers","Accidental deletion","Lost or destroyed encryption keys"],"ath":["ความเสียหายของข้อมูล","ถูกขโมยโดยแฮกเกอร์","การลบโดยไม่ตั้งใจ","คีย์การเข้ารหัสที่สูญหายหรือถูกทำลาย"],"ans":"B","exp":"The exposure of data by hackers is considered a data breach. Data loss focuses on the data availability rather than security. Data loss occurs when data becomes lost, unavailable, or destroyed, when it should not have been","expth":"การเปิดเผยข้อมูลโดยแฮกเกอร์ถือเป็นการละเมิดข้อมูล การสูญเสียข้อมูลมุ่งเน้นไปที่ความพร้อมใช้งานของข้อมูลมากกว่าความปลอดภัย การสูญเสียข้อมูลเกิดขึ้นเมื่อข้อมูลสูญหาย ไม่พร้อมใช้งาน หรือถูกทำลายทั้งที่ไม่ควรเป็นเช่นนั้น"},{"id":318,"topic":1,"q":"Which of the following jurisdictions lacks a comprehensive national policy on data privacy and the protection of personally identifiable information (Pll)?","qth":"เขตอำนาจศาลใดต่อไปนี้ขาดนโยบายระดับชาติที่ครอบคลุมเกี่ยวกับความเป็นส่วนตัวของข้อมูลและการคุ้มครองข้อมูลส่วนบุคคลที่สามารถระบุตัวบุคคลได้ (Pll)?","a":["European Union","Asian-Pacific Economic Cooperation","United States","Russia"],"ath":["สหภาพยุโรป","ความร่วมมือทางเศรษฐกิจเอเชีย-แปซิฟิก","สหรัฐอเมริกา","รัสเซีย"],"ans":"C","exp":"The United States has a myriad of regulations focused on specific types of data, such as healthcare and financial, but lacks an overall comprehensive privacy law on the national level. The European Union, the Asian-Pacific Economic Cooperation, and Russia all have national privacy protections and regulations for the handling the Pll data of their citizens","expth":"สหรัฐอเมริกามีกฎระเบียบมากมายที่มุ่งเน้นไปที่ข้อมูลบางประเภท เช่น การดูแลสุขภาพและการเงิน แต่ขาดกฎหมายความเป็นส่วนตัวโดยรวมที่ครอบคลุมเกี่ยวกับ ระดับชาติ สหภาพยุโรป ความร่วมมือทางเศรษฐกิจเอเชีย-แปซิฟิก และรัสเซีย ต่างก็มีการคุ้มครองความเป็นส่วนตัวและกฎระเบียบระดับชาติสำหรับการจัดการข้อมูล Pll ของพลเมืองของตน"},{"id":319,"topic":1,"q":"Which component of ITIL involves planning for the restoration of services after an unexpected outage or incident?","qth":"องค์ประกอบใดของ ITIL ที่เกี่ยวข้องกับการวางแผนสำหรับการฟื้นฟูบริการหลังจากการหยุดทำงานหรือเหตุการณ์ที่ไม่คาดคิด","a":["Continuity management","Problem management","Configuration management","Availability management"],"ath":["การจัดการความต่อเนื่อง","การจัดการปัญหา","การจัดการการกำหนดค่า","การจัดการความพร้อมใช้งาน"],"ans":"A","exp":"Continuity management (or business continuity management) is focused on planning for the successful restoration of systems or services after an unexpected outage, incident, or disaster. Problem management is focused on identifying and mitigating known problems and deficiencies before they occur. Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Configuration management tracks and maintains detailed information about all IT components within an organization","expth":"การจัดการความต่อเนื่อง (หรือการจัดการความต่อเนื่องทางธุรกิจ) มุ่งเน้นไปที่การวางแผนสำหรับการกู้คืนระบบหรือบริการที่ประสบความสำเร็จหลังจากการหยุดทำงาน เหตุการณ์ หรือภัยพิบัติที่ไม่คาดคิด การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการการกำหนดค่าติดตามและรักษาข้อมูลโดยละเอียดเกี่ยวกับส่วนประกอบไอทีทั้งหมดภายในองค์กร"},{"id":320,"topic":1,"q":"Which component of ITIL pertains to planning, coordinating, executing, and validating changes and rollouts to production environments?","qth":"องค์ประกอบใดของ ITIL ที่เกี่ยวข้องกับการวางแผน การประสานงาน การดำเนินการ และการตรวจสอบการเปลี่ยนแปลงและการเปิดตัวในสภาพแวดล้อมการผลิต?","a":["Release management","Availability management","Problem management","Change management"],"ath":["การจัดการการเผยแพร่","การจัดการความพร้อมใช้งาน","การจัดการปัญหา","การจัดการการเปลี่ยนแปลง"],"ans":"D","exp":"Release management involves planning, coordinating, executing, and validating changes and rollouts to the production environment. Change management is a higher-level component than release management and also involves stakeholder and management approval, rather than specifically focusing the actual release itself. Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Problem management is focused on identifying and mitigating known problems and deficiencies before they occur","expth":"การจัดการการเผยแพร่เกี่ยวข้องกับการวางแผน การประสานงาน การดำเนินการ และการตรวจสอบการเปลี่ยนแปลงและการเปิดตัวในสภาพแวดล้อมการผลิต การจัดการการเปลี่ยนแปลงเป็นองค์ประกอบในระดับที่สูงกว่าการจัดการการเผยแพร่ และยังเกี่ยวข้องกับการอนุมัติของผู้มีส่วนได้ส่วนเสียและการอนุมัติของฝ่ายบริหาร แทนที่จะเน้นไปที่การเผยแพร่จริงโดยเฉพาะ การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น"},{"id":321,"topic":1,"q":"What process entails taking sensitive data and removing the indirect identifiers from each data object so that the identification of a single entity would not be possible?","qth":"กระบวนการใดที่เกี่ยวข้องกับการรับข้อมูลที่ละเอียดอ่อนและลบตัวระบุทางอ้อมออกจากแต่ละออบเจ็กต์ข้อมูล เพื่อไม่ให้สามารถระบุตัวตนของเอนทิตีเดียวได้?","a":["Tokenization","Encryption","Anonymization","Masking"],"ath":["การแปลงโทเค็น","การเข้ารหัส","การลบข้อมูลระบุตัวตน","การมาสก์"],"ans":"C","exp":"Anonymization is a type of masking, where indirect identifiers are removed from a data set to prevent the mapping back of data to an individual, Although masking refers to the overall approach of covering sensitive data, anonymization is the best answer here because it is more specific to exactly what is being asked. Tokenization involves the replacement of sensitive data with a key value that can be matched back to the real value. However, it is not focused on indirect identifiers or preventing the matching to an individual. Encryption refers to the overall process of protecting data via key pairs and protecting confidentiality","expth":"การลบข้อมูลระบุตัวตนเป็นประเภทของการมาสก์ โดยที่ตัวระบุทางอ้อมจะถูกลบออกจากชุดข้อมูลเพื่อป้องกันการแมปด้านหลังของข้อมูลไปยังแต่ละบุคคล แม้ว่าการปิดบังจะหมายถึงวิธีการโดยรวมในการปกปิดข้อมูลที่ละเอียดอ่อน แต่การลบข้อมูลระบุตัวตนเป็นคำตอบที่ดีที่สุดที่นี่ เนื่องจากมีความเฉพาะเจาะจงมากขึ้นกับสิ่งที่ถูกถาม Tokenization เกี่ยวข้องกับการแทนที่ข้อมูลที่ละเอียดอ่อนด้วยค่าคีย์ที่สามารถจับคู่กลับเป็นมูลค่าจริงได้ อย่างไรก็ตาม ไม่ได้มุ่งเน้นไปที่ตัวระบุทางอ้อมหรือการป้องกันการจับคู่กับแต่ละบุคคล การเข้ารหัสหมายถึงกระบวนการโดยรวมในการปกป้องข้อมูลผ่านคู่คีย์และการปกป้องความลับ"},{"id":322,"topic":1,"q":"Because cloud providers will not give detailed information out about their infrastructures and practices to the general public, they will often use established auditing reports to ensure public trust, where the reputation of the auditors serves for assurance Which type of audit reports can be used for general public trust assurances?","qth":"เนื่องจากผู้ให้บริการระบบคลาวด์จะไม่ให้ข้อมูลโดยละเอียดเกี่ยวกับโครงสร้างพื้นฐานและแนวทางปฏิบัติของตนแก่สาธารณชนทั่วไป พวกเขามักจะใช้รายงานการตรวจสอบที่จัดทำขึ้นเพื่อให้มั่นใจในความไว้วางใจของสาธารณะ โดยที่ชื่อเสียงของผู้ตรวจสอบทำหน้าที่ในการรับประกัน รายงานการตรวจสอบประเภทใดที่สามารถใช้เพื่อการรับรองความไว้วางใจของสาธารณะทั่วไป","a":["SOC 2","SAS-70","SOC 3","SOC 1"],"ath":["เอสโอซี 2","SAS-70","สคส.3","สค 1"],"ans":"C","exp":"SOC Type 3 audit reports are very similar to SOC Type 2, with the exception that they are intended for general release and public audiences.SAS-70 audits have been deprecated. SOC Type 1 audit reports have a narrow scope and are intended for very limited release, whereas SOC Type 2 audit reports are intended for wider audiences but not general release","expth":"รายงานการตรวจสอบ SOC ประเภท 3 มีความคล้ายคลึงกับ SOC ประเภท 2 มาก โดยมีข้อยกเว้นว่ามีไว้สำหรับการเผยแพร่ทั่วไปและผู้ชมสาธารณะ การตรวจสอบ SAS-70 เลิกใช้แล้ว รายงานการตรวจสอบ SOC ประเภท 1 มีขอบเขตที่แคบและมีไว้สำหรับการเผยแพร่ที่จำกัดมาก ในขณะที่รายงานการตรวจสอบ SOC ประเภท 2 มีไว้สำหรับผู้ชมในวงกว้าง แต่ไม่ใช่การเผยแพร่ทั่วไป"},{"id":323,"topic":1,"q":"Which of the following concepts is NOT one of the core components to an encryption system architecture?","qth":"แนวคิดใดต่อไปนี้ไม่ใช่องค์ประกอบหลักอย่างหนึ่งของสถาปัตยกรรมระบบการเข้ารหัส","a":["Software","Network","Keys","Data"],"ath":["ซอฟต์แวร์","เครือข่าย","คีย์","ข้อมูล"],"ans":"B","exp":"The network utilized is not one of the key components of an encryption system architecture. In fact, a network is not even required for encryption systems or the processing and protection of data. The data, software used for the encryption engine itself, and the keys used to implement the encryption are all core components of an encryption system architecture","expth":"เครือข่ายที่ใช้ไม่ใช่องค์ประกอบสำคัญของสถาปัตยกรรมระบบการเข้ารหัส ในความเป็นจริงแล้ว เครือข่ายไม่จำเป็นแม้แต่สำหรับระบบการเข้ารหัสหรือการประมวลผลและการปกป้องข้อมูล ข้อมูล ซอฟต์แวร์ที่ใช้สำหรับกลไกการเข้ารหัส และคีย์ที่ใช้ในการเข้ารหัสล้วนเป็นองค์ประกอบหลักของสถาปัตยกรรมระบบการเข้ารหัส"},{"id":324,"topic":1,"q":"For optimal security, trust zones are used for network segmentation and isolation. They allow for the separation of various systems and tiers, each with its own security level Which of the following is typically used to allow administrative personnel access to trust zones?","qth":"เพื่อความปลอดภัยสูงสุด โซนความเชื่อถือจะถูกใช้สำหรับการแบ่งส่วนและการแยกเครือข่าย อนุญาตให้มีการแยกระบบและระดับต่างๆ โดยแต่ละระดับมีระดับความปลอดภัยของตัวเอง โดยทั่วไปจะใช้ข้อใดต่อไปนี้เพื่ออนุญาตให้บุคลากรผู้ดูแลระบบเข้าถึงโซนที่เชื่อถือได้","a":["IPSec","SSH","VPN","TLs"],"ath":["IPSec","SSH","VPN","TLs"],"ans":"C","exp":"Virtual private networks (VPNs) are used to provide administrative personnel with secure communication channels through security systems and into trust zones They allow staff who perform system administration tasks to have access to ports and systems that are not allowed from the public Internet. IPSec is an encryption protocol for point-to-point communications at the network level, and may be used within a trust zone but not to give access into a trust zone. TLS enables encryption of communications between systems and services and would likely be used to secure the VPN communications, but it does not represent the overall concept being asked for in the question. SSH allows for secure shell access to systems, but not for general access into trust zones","expth":"เครือข่ายส่วนตัวเสมือน (VPN) ถูกนำมาใช้เพื่อให้บุคลากรด้านการบริหารมีช่องทางการสื่อสารที่ปลอดภัยผ่านระบบรักษาความปลอดภัยและเข้าไปในโซนที่เชื่อถือได้ พวกเขาอนุญาตให้พนักงานที่ปฏิบัติงานการบริหารระบบสามารถเข้าถึงพอร์ตและระบบที่ ไม่ได้รับอนุญาตจากอินเทอร์เน็ตสาธารณะ IPSec เป็นโปรโตคอลการเข้ารหัสสำหรับการสื่อสารแบบจุดต่อจุดในระดับเครือข่าย และอาจใช้ภายในโซนที่เชื่อถือแต่ไม่ให้สิทธิ์ในการเข้าถึงโซนที่เชื่อถือ TLS เปิดใช้งานการเข้ารหัสการสื่อสารระหว่างระบบและบริการ และมีแนวโน้มที่จะใช้เพื่อรักษาความปลอดภัยการสื่อสาร VPN แต่ไม่ได้แสดงถึงแนวคิดโดยรวมที่ถูกถามในคำถาม SSH อนุญาตให้มีการเข้าถึงเชลล์อย่างปลอดภัยไปยังระบบ แต่ไม่ใช่สำหรับการเข้าถึงโซนความเชื่อถือทั่วไป"},{"id":325,"topic":1,"q":"Which of the following is NOT a major regulatory framework?","qth":"ข้อใดต่อไปนี้ไม่ใช่กรอบการกำกับดูแลที่สำคัญ","a":["PCI DSS","HIPAA","SOX","FIPS 140-2"],"ath":["PCI DSS","HIPAA","SOX","FIPS 140-2"],"ans":"D","exp":"FIPS 140-2 is a United States certification standard for cryptographic modules, and it provides guidance and requirements for their use based on the requirements of the data classification. However, these are not actual regulatory requirements. The Health Insurance Portability and Accountability Act (HIPAA), Sarbanes Oxley Act (SOX), and the Payment Card Industry Data Security Standard (PCI DSS) are all major regulatory frameworks either by law or specificto an industry","expth":"FIPS 140-2 เป็นมาตรฐานการรับรองของสหรัฐอเมริกาสำหรับโมดูลการเข้ารหัส และให้คำแนะนำและข้อกำหนดสำหรับการใช้งานโดยอิงตามข้อกำหนดของการจำแนกประเภทข้อมูล อย่างไรก็ตาม สิ่งเหล่านี้ไม่ใช่ข้อกำหนดด้านกฎระเบียบที่แท้จริง Health Insurance Portability and Accountability Act (HIPAA), Sarbanes Oxley Act (SOX) และ Payment Card Industry Data Security Standard (PCI DSS) ล้วนเป็นกรอบการกำกับดูแลที่สำคัญไม่ว่าจะตามกฎหมายหรือเฉพาะเจาะจงในอุตสาหกรรม"},{"id":326,"topic":1,"q":"As part of the auditing process, getting a report on the deviations between intended configurations and actual policy is often crucial for an organization, What term pertains to the process of generating such a report?","qth":"ในฐานะส่วนหนึ่งของกระบวนการตรวจสอบ การได้รับรายงานเกี่ยวกับการเบี่ยงเบนระหว่างการกำหนดค่าที่ต้องการและนโยบายจริงมักจะมีความสำคัญสำหรับองค์กร คำใดที่เกี่ยวข้องกับกระบวนการสร้างรายงานดังกล่าว?","a":["Deficiencies","Findings","Gap analysis","Errors"],"ath":["ข้อบกพร่อง","การค้นพบ","การวิเคราะห์ช่องว่าง","ข้อผิดพลาด"],"ans":"C","exp":"The gap analysis determines if there are any differences between the actual configurations in use on systems and the policies that govern what the configurations are expected or mandated to be. The other terms provided are all similar to the correct answer (\"findings in particular is often used to articulate deviations in configurations), but gap analysis is the official term used","expth":"การวิเคราะห์ช่องว่างจะกำหนดว่ามีความแตกต่างใด ๆ ระหว่างการกำหนดค่าจริงที่ใช้งานบนระบบและ นโยบายที่ควบคุมการกำหนดค่าที่คาดหวังหรือได้รับคำสั่งให้เป็น ข้อกำหนดอื่นๆ ที่ให้ไว้ล้วนคล้ายกับคำตอบที่ถูกต้อง (\"ข้อค้นพบโดยเฉพาะมักใช้เพื่อระบุความเบี่ยงเบนในการกำหนดค่า) แต่การวิเคราะห์ช่องว่างเป็นคำที่เป็นทางการที่ใช้"},{"id":327,"topic":1,"q":"An audit scope statement defines the limits and outcomes from an audit. Which of the following would NOT be included as part of an audit scope statement?","qth":"คำชี้แจงขอบเขตการตรวจสอบจะกำหนดขีดจำกัดและผลลัพธ์จากการตรวจสอบ ข้อใดต่อไปนี้จะไม่รวมอยู่ในส่วนหนึ่งของคำชี้แจงขอบเขตการตรวจสอบ","a":["Reports","Certification","Billing","Exclusions"],"ath":["รายงาน","การรับรอง","การเรียกเก็บเงิน","การยกเว้น"],"ans":"C","exp":"Billing for an audit, or other cost-related items, would not be part of an audit scope statement and would instead be handled prior to the actual audit as part of the contract between the organization and auditors. Reports, exclusions to the scope of the audit, and required certifications on behalf of the systems or auditors are all crucial elements of an audit scope statement","expth":"การเรียกเก็บเงินสำหรับการตรวจสอบหรือรายการอื่น ๆ ที่เกี่ยวข้องกับต้นทุน จะไม่เป็นส่วนหนึ่งของคำชี้แจงขอบเขตการตรวจสอบ และจะได้รับการจัดการก่อนการตรวจสอบจริงแทนซึ่งเป็นส่วนหนึ่งของสัญญาระหว่างองค์กรและผู้ตรวจสอบ รายงาน การยกเว้นขอบเขตของการตรวจสอบ และการรับรองที่จำเป็นในนามของระบบหรือผู้ตรวจสอบ ล้วนเป็นองค์ประกอบที่สำคัญของคำชี้แจงเกี่ยวกับขอบเขตการตรวจสอบ"},{"id":328,"topic":1,"q":"What concept and operational process must be spelled out clearly, as far as roles and responsibilities go, between the cloud provider and cloud customer for the mitigation of any problems or security events?","qth":"แนวคิดและกระบวนการปฏิบัติงานใดที่ต้องอธิบายให้ชัดเจนเท่าที่บทบาทและความรับผิดชอบระหว่างผู้ให้บริการคลาวด์และลูกค้าคลาวด์ เพื่อลดปัญหาหรือเหตุการณ์ด้านความปลอดภัย","a":["Incident response","Problem management","Change management","Confit response"],"ath":["การตอบสนองต่อเหตุการณ์","การจัดการปัญหา","การจัดการการเปลี่ยนแปลง","การตอบสนองแบบ Confit"],"ans":"A","exp":"Incident response is the process through which security or operational issues are handled, including and coordination with and communication to the appropriate stakeholders. None of the other terms provided is the correct response","expth":"การตอบสนองต่อเหตุการณ์คือกระบวนการที่ใช้จัดการปัญหาด้านความปลอดภัยหรือการปฏิบัติงาน รวมถึงการประสานงานและการสื่อสารไปยังผู้มีส่วนได้ส่วนเสียที่เหมาะสม ไม่มีข้อกำหนดอื่นใดที่ให้ไว้เป็นคำตอบที่ถูกต้อง"},{"id":329,"topic":1,"q":"Your new CISO is placing increased importance and focus on regulatory compliance as your applications and systems move into cloud environments Which of the following would NOT be a major focus of yours as you develop a project plan to focus on regulatory compliance?","qth":"CISO ใหม่ของคุณให้ความสำคัญเพิ่มขึ้นและมุ่งเน้นไปที่การปฏิบัติตามกฎระเบียบเมื่อแอปพลิเคชันและระบบของคุณย้ายเข้าสู่สภาพแวดล้อมคลาวด์ ข้อใดต่อไปนี้ที่จะไม่เป็นจุดสนใจหลักของคุณเมื่อคุณพัฒนาแผนโครงการเพื่อมุ่งเน้นไปที่การปฏิบัติตามกฎระเบียบ","a":["Data in transit","Data in use","Data at rest","Data custodian"],"ath":["ข้อมูลระหว่างทาง","ข้อมูลที่ใช้งานอยู่","ข้อมูลที่เหลือ","ผู้ดูแลข้อมูล"],"ans":"D","exp":"The jurisdictions where data is being stored, processed, or consumed are the ones that dictate the regulatory frameworks and compliance requirements, regardless of who the data owner or custodian might be. The other concepts for protecting data would all play a prominent role in regulatory compliance with a move to the cloud environment. Each concept needs to be evaluated based on the new configurations as well as any potential changes in jurisdiction or requirements introduced with the move to a cloud","expth":"เขตอำนาจศาลที่ข้อมูลถูกจัดเก็บ ประมวลผล หรือใช้คือเขตอำนาจที่กำหนดกรอบการกำกับดูแลและข้อกำหนดในการปฏิบัติตามข้อกำหนด ไม่ว่าเจ้าของข้อมูลหรือผู้ดูแลข้อมูลจะเป็นใครก็ตาม แนวคิดอื่นๆ ในการปกป้องข้อมูลล้วนมีบทบาทสำคัญในการปฏิบัติตามกฎระเบียบด้วยการย้ายไปยังสภาพแวดล้อมคลาวด์ แต่ละแนวคิดจะต้องได้รับการประเมินตามการกำหนดค่าใหม่ตลอดจนการเปลี่ยนแปลงที่อาจเกิดขึ้นในเขตอำนาจศาลหรือข้อกำหนดที่เกิดขึ้นพร้อมกับการย้ายไปยังระบบคลาวด์"},{"id":330,"topic":1,"q":"Cloud systems are increasingly used for BCDR solutions for organizations. What aspect of cloud computing makes their use for BCDR the most attractive?","qth":"ระบบคลาวด์ถูกนำมาใช้มากขึ้นสำหรับโซลูชัน BCDR สำหรับองค์กร แง่มุมใดของการประมวลผลแบบคลาวด์ที่ทำให้การใช้งาน BCDR น่าสนใจที่สุด","a":["On-demand self-service","Measured service","Portability","Broad network access"],"ath":["บริการตนเองตามความต้องการ","บริการวัดผล","การพกพา","การเข้าถึงเครือข่ายในวงกว้าง"],"ans":"B","exp":"Business continuity and disaster recovery (BCDR) solutions largely sit idle until they are actually needed. This traditionally has led to increased costs for an organization because physical hardware must be purchased and operational but is not used. By using a cloud system, an organization will only pay for systems when they are being used and only for the duration of use, thus eliminating the need for extra hardware and costs. Portability is the abilty to easily move services among different cloud providers. Broad network access allows access to users and staff from anywhere and from different clients, and although this would be important for a BCDR situation, itis not the best answer in this case. On-demand self-service allows users to provision services automatically and when needed, a","expth":"โซลูชันความต่อเนื่องทางธุรกิจและการกู้คืนระบบ (BCDR) ส่วนใหญ่ไม่ได้ใช้งานจนกว่าจะมีความจำเป็นจริงๆ ซึ่งแต่เดิมได้นำไปสู่ต้นทุนที่เพิ่มขึ้นสำหรับองค์กร เนื่องจากต้องซื้อและใช้งานฮาร์ดแวร์ทางกายภาพ แต่ไม่ได้ใช้ เมื่อใช้ระบบคลาวด์ องค์กรจะชำระค่าระบบเฉพาะเมื่อมีการใช้งานและตามระยะเวลาการใช้งานเท่านั้น จึงขจัดความจำเป็นในการใช้ฮาร์ดแวร์และค่าใช้จ่ายเพิ่มเติม การพกพาคือความสามารถในการย้ายบริการระหว่างผู้ให้บริการคลาวด์ต่างๆ ได้อย่างง่ายดาย การเข้าถึงเครือข่ายแบบกว้างทำให้ผู้ใช้และพนักงานสามารถเข้าถึงได้จากทุกที่และจากไคลเอนต์ที่แตกต่างกัน และถึงแม้ว่านี่จะมีความสำคัญสำหรับสถานการณ์ BCDR แต่ก็ไม่ใช่คำตอบที่ดีที่สุดในกรณีนี้ การบริการตนเองตามความต้องการช่วยให้ผู้ใช้สามารถจัดเตรียมบริการได้โดยอัตโนมัติและเมื่อจำเป็น"},{"id":331,"topic":1,"q":"What's a potential problem when object storage versus volume storage is used within laaS for application use and dependency?","qth":"จะเกิดปัญหาอะไรขึ้นเมื่อมีการใช้พื้นที่จัดเก็บอ็อบเจ็กต์เทียบกับพื้นที่จัดเก็บโวลุ่มภายใน laaS สำหรับการใช้งานแอปพลิเคชันและการพึ่งพา?","a":["Object storage is only optimized for small files","Object storage is its own system, and data consistency depends on replication","Object storage may have availability issues","Object storage is dependent on access control from the host server"],"ath":["พื้นที่จัดเก็บอ็อบเจ็กต์ได้รับการปรับให้เหมาะสมสำหรับไฟล์ขนาดเล็กเท่านั้น","พื้นที่จัดเก็บอ็อบเจ็กต์เป็นระบบของตัวเอง และความสอดคล้องของข้อมูลขึ้นอยู่กับการจำลองแบบ","พื้นที่จัดเก็บอ็อบเจ็กต์อาจมีปัญหาด้านความพร้อมใช้งาน","พื้นที่จัดเก็บอ็อบเจ็กต์ขึ้นอยู่กับการควบคุมการเข้าถึงจากเซิร์ฟเวอร์โฮสต์"],"ans":"B","exp":"Object storage runs on its own independent systems, which have their own redundancy and distribution. To ensure data consistency, sufficient time is needed for objects to fully replicate to all potential locations before being accessed, Object storage is optimized for high availability and will not be any less reliable than any other virtual machine within a cloud environment. Itis hosted on a separate system that does not have dependencies in local host servers for access control, and it is optimized for files of all different sizes and uses","expth":"พื้นที่จัดเก็บอ็อบเจ็กต์ทำงาน ระบบอิสระของตัวเอง ซึ่งมีความซ้ำซ้อนและการกระจายของตัวเอง เพื่อให้มั่นใจถึงความสอดคล้องของข้อมูล จึงต้องใช้เวลาเพียงพอสำหรับออบเจ็กต์ในการจำลองแบบเต็มรูปแบบไปยังตำแหน่งที่เป็นไปได้ทั้งหมดก่อนที่จะเข้าถึง พื้นที่เก็บข้อมูลออบเจ็กต์ได้รับการปรับให้เหมาะสมเพื่อความพร้อมใช้งานสูงและจะไม่น่าเชื่อถือน้อยกว่าเครื่องเสมือนอื่น ๆ ภายในสภาพแวดล้อมคลาวด์ มันถูกโฮสต์บนระบบแยกต่างหากที่ไม่มีการพึ่งพาในเซิร์ฟเวอร์โฮสต์ในพื้นที่สำหรับการควบคุมการเข้าถึง และได้รับการปรับให้เหมาะสมสำหรับไฟล์ที่มีขนาดและการใช้งานที่แตกต่างกันทั้งหมด"},{"id":332,"topic":1,"q":"Many aspects of cloud computing bring enormous benefits over a traditional data center, but also introduce new challenges unique to cloud computing Which of the following aspects of cloud computing makes appropriate data classification of high importance?","qth":"การประมวลผลแบบคลาวด์ในหลายแง่มุมนำมาซึ่งผลประโยชน์มหาศาลเหนือศูนย์ข้อมูลแบบเดิม แต่ยังนำเสนอความท้าทายใหม่ ๆ ที่ไม่ซ้ำกับการประมวลผลบนคลาวด์ ด้านใดต่อไปนี้ของการประมวลผลแบบคลาวด์ที่ทำให้การจำแนกข้อมูลที่เหมาะสมและมีความสำคัญสูง?","a":["Multitenancy","Interoperability","Portability","Reversibility"],"ath":["การครอบครองหลายรายการ","การทำงานร่วมกัน","การพกพา","การย้อนกลับได้"],"ans":"A","exp":"With multitenancy, where different cloud customers all share the same physical systems and networks, data classification becomes even more important to ensure that the appropriate security controls are applied immediately to prevent any potential leakage or exposure to other customers. Portability refers to the ability to move easily from one cloud provider to another. Interoperability refers to the ability to reuse components and services for different uses. Reversibility refers to the ability of the cloud customer to quickly and completely remove all data and services from a cloud provider and to verify the removal","expth":"ด้วยการเช่าหลายครั้ง โดยที่ลูกค้าคลาวด์ที่แตกต่างกันทั้งหมดใช้ระบบและเครือข่ายทางกายภาพเดียวกัน การจำแนกประเภทข้อมูลมีความสำคัญมากยิ่งขึ้นเพื่อให้แน่ใจว่าการรักษาความปลอดภัยที่เหมาะสม การควบคุมจะถูกนำไปใช้ทันทีเพื่อป้องกันการรั่วไหลหรือการสัมผัสกับลูกค้ารายอื่นที่อาจเกิดขึ้น การพกพาหมายถึงความสามารถในการย้ายจากผู้ให้บริการคลาวด์รายหนึ่งไปยังอีกรายหนึ่งได้อย่างง่ายดาย ความสามารถในการทำงานร่วมกันหมายถึงความสามารถในการนำส่วนประกอบและบริการกลับมาใช้ใหม่สำหรับการใช้งานที่แตกต่างกัน การย้อนกลับได้หมายถึงความสามารถของลูกค้าคลาวด์ในการลบข้อมูลและบริการทั้งหมดออกจากผู้ให้บริการคลาวด์อย่างรวดเร็วและสมบูรณ์ และเพื่อตรวจสอบการลบออก"},{"id":333,"topic":1,"q":"Without the extensive funds of a large corporation, a small-sized company could gain considerable and cost-effective services for which of the following concepts by moving to a cloud environment?","qth":"หากไม่มีเงินทุนจำนวนมากของบริษัทขนาดใหญ่ บริษัทขนาดเล็กสามารถได้รับบริการจำนวนมากและคุ้มค่าสำหรับแนวคิดใดต่อไปนี้โดยการย้ายไปยังสภาพแวดล้อมระบบคลาวด์","a":["Regulatory","Security","Testing","Development"],"ath":["กฎระเบียบ","ความปลอดภัย","การทดสอบ","การพัฒนา"],"ans":"B","exp":"Cloud environments, regardless of the specific deployment model used, have extensive and robust security controls in place, especially in regard to physical and infrastructure security. A small company can leverage the extensive security controls and monitoring provided by a cloud provider, which they would unlikely ever be able to afford on their own. Moving to a cloud would not result in any gains for development and testing because these areas require the same rigor regardless of where deployment and hosting occur. Regulatory compliance in a cloud would not be a gain for an organization because it would likely result in additional oversight and auditing as well as require the organization to adapt to a new environment","expth":"สภาพแวดล้อมระบบคลาวด์ โดยไม่คำนึงถึงรูปแบบการใช้งานเฉพาะที่ใช้ มีการควบคุมความปลอดภัยที่ครอบคลุมและแข็งแกร่งในสถานที่ โดยเฉพาะอย่างยิ่งในส่วนที่เกี่ยวกับทางกายภาพและโครงสร้างพื้นฐาน ความปลอดภัย บริษัทขนาดเล็กสามารถใช้ประโยชน์จากการควบคุมและการตรวจสอบความปลอดภัยที่ครอบคลุมโดยผู้ให้บริการระบบคลาวด์ ซึ่งพวกเขาไม่น่าจะซื้อได้ด้วยตัวเอง การย้ายไปยังระบบคลาวด์จะไม่ส่งผลให้เกิดประโยชน์ใดๆ ในการพัฒนาและการทดสอบ เนื่องจากพื้นที่เหล่านี้ต้องการความเข้มงวดแบบเดียวกัน ไม่ว่าการใช้งานและการโฮสต์จะเกิดขึ้นที่ใดก็ตาม การปฏิบัติตามกฎระเบียบในระบบคลาวด์จะไม่เป็นประโยชน์สำหรับองค์กร เนื่องจากอาจส่งผลให้เกิดการกำกับดูแลและการตรวจสอบเพิ่มเติม รวมถึงกำหนดให้องค์กรต้องปรับตัวเข้ากับสภาพแวดล้อมใหม่"},{"id":334,"topic":1,"q":"BCDR strategies typically do not involve the entire operations of an organization, but only those deemed critical to their business. Which concept pertains to the amount of data and services needed to reach the predetermined level of operations?","qth":"โดยทั่วไปแล้วกลยุทธ์ BCDR จะไม่เกี่ยวข้องกับการดำเนินงานทั้งหมดขององค์กร แต่จะเกี่ยวข้องกับการดำเนินการที่ถือว่ามีความสำคัญต่อธุรกิจเท่านั้น แนวคิดใดที่เกี่ยวข้องกับปริมาณข้อมูลและบริการที่จำเป็นในการบรรลุระดับการดำเนินงานที่กำหนดไว้","a":["SRE","RPO","RSL","RTO"],"ath":["SRE","RPO","RSL","RTO"],"ans":"B","exp":"The recovery point objective (RPO) sets and defines the amount of data an organization must have available or accessible to reach the predetermined level of operations necessary during a BCDR situation. The recovery time objective (RTO) measures the amount of time necessary to recover operations to meet the BCDR plan. The recovery service level (RSL) measures the percentage of operations that would be recovered during a BCDR situation. SRE is provided as an erroneous response,","expth":"วัตถุประสงค์จุดกู้คืน (RPO) กำหนดและกำหนดจำนวนข้อมูลที่องค์กรต้องมีหรือสามารถเข้าถึงได้เพื่อให้บรรลุระดับการดำเนินงานที่กำหนดไว้ล่วงหน้าที่จำเป็นในระหว่างสถานการณ์ BCDR วัตถุประสงค์เวลาการกู้คืน (RTO) จะวัดระยะเวลาที่จำเป็นในการกู้คืนการดำเนินการเพื่อให้เป็นไปตามแผน BCDR ระดับบริการการกู้คืน (RSL) จะวัดเปอร์เซ็นต์ของการดำเนินการที่จะได้รับการกู้คืนในระหว่างสถานการณ์ BCDR SRE ให้มาเป็นการตอบกลับที่ผิดพลาด"},{"id":335,"topic":1,"q":"Which of the following is NOT a commonly used communications method within cloud environments to secure data in transit?","qth":"ข้อใดต่อไปนี้ไม่ใช่วิธีการสื่อสารที่ใช้กันทั่วไปภายในสภาพแวดล้อมคลาวด์เพื่อรักษาความปลอดภัยข้อมูลระหว่างทาง","a":["IPSec","HTTPS","VPN","DNSSEC"],"ath":["IPSec","HTTPS","VPN","DNSSEC"],"ans":"D","exp":"DNSSEC is used as a security extension to DNS lookup queries in order to ensure the authenticity and authoritativeness of hostname resolutions, in order to prevent spoofing and redirection of traffic. Although it is a very important concept to be employed for security practices, it is not used to secure or encrypt data transmissions. HTTPS is the most commonly used security mechanism for data communications between clients and websites and web services. IPSec is less commonly used, but is also intended to secure communications between servers. VPN is commonly used to secure trafic into a network area or subnet for developers and administrative users","expth":"DNSSEC ถูกใช้เป็นส่วนขยายการรักษาความปลอดภัยสำหรับการสืบค้นการค้นหา DNS เพื่อให้มั่นใจถึงความถูกต้องและความน่าเชื่อถือของการแก้ไขชื่อโฮสต์ เพื่อป้องกันการปลอมแปลงและการเปลี่ยนเส้นทางการรับส่งข้อมูล แม้ว่าจะเป็นแนวคิดที่สำคัญมากที่จะใช้สำหรับแนวทางปฏิบัติด้านความปลอดภัย แต่ก็ไม่ได้ใช้เพื่อรักษาความปลอดภัยหรือเข้ารหัสการส่งข้อมูล HTTPS เป็นกลไกความปลอดภัยที่ใช้กันมากที่สุดสำหรับการสื่อสารข้อมูลระหว่างไคลเอนต์และเว็บไซต์และบริการบนเว็บ IPSec ไม่ค่อยมีคนใช้ แต่ก็มีจุดมุ่งหมายเพื่อความปลอดภัยในการสื่อสารระหว่างเซิร์ฟเวอร์ด้วย โดยทั่วไปจะใช้ VPN เพื่อรักษาความปลอดภัยการรับส่งข้อมูลในพื้นที่เครือข่ายหรือซับเน็ตสำหรับนักพัฒนาและผู้ใช้ที่เป็นผู้ดูแลระบบ"},{"id":336,"topic":1,"q":"Which crucial aspect of cloud computing can be most threat","qth":"ลักษณะสำคัญประการใดของการประมวลผลแบบคลาวด์ที่สามารถเป็นภัยคุกคามได้มากที่สุด","a":["Automation","Resource pooling","Elasticity","Redundancy"],"ath":["การทำงานอัตโนมัติ","การรวมทรัพยากร","ความยืดหยุ่น","ความซ้ำซ้อน"],"ans":"A","exp":"Cloud environments depend heavily on API calls for management and automation. Any vulnerability with the APIs can cause significant risk and exposure to all tenants of the cloud environment. Resource pooling and elasticity could both be impacted by insecure APIs, as both require automation and orchestration to operate properly, but automation is the better answer here. Redundancy would not be directly impacted by insecure APIs","expth":"สภาพแวดล้อมระบบคลาวด์ขึ้นอยู่กับการเรียก API อย่างมากสำหรับการจัดการและระบบอัตโนมัติ ช่องโหว่ใดๆ ก็ตามที่มี API สามารถก่อให้เกิดความเสี่ยงที่สำคัญและความเสี่ยงต่อผู้เช่าทั้งหมดในสภาพแวดล้อมคลาวด์ การรวมทรัพยากรและความยืดหยุ่นอาจได้รับผลกระทบจาก API ที่ไม่ปลอดภัย เนื่องจากทั้งสองต้องใช้ระบบอัตโนมัติและการจัดการเพื่อให้ทำงานได้อย่างถูกต้อง แต่ระบบอัตโนมัติคือคำตอบที่ดีกว่าในที่นี้ ความซ้ำซ้อนจะไม่ได้รับผลกระทบโดยตรงจาก API ที่ไม่ปลอดภัย"},{"id":337,"topic":1,"q":"The WS-Security standards are built around all of the following standards except which one?","qth":"มาตรฐาน WS-Security ถูกสร้างขึ้นโดยใช้มาตรฐานต่อไปนี้ทั้งหมด ยกเว้นมาตรฐานใด","a":["SAML","WSDL","XML","SOAP"],"ath":["SAML","WSDL","XML","SOAP"],"ans":"A","exp":"The WS-Security specifications, as well as the WS-Federation system, are built upon XML, WDSL, and SOAP. SAML is a very similar protocol that is used as an alternative to WS.XML, WDSL, and SOAP are all integral to the WS-Security specifications","expth":"ข้อกำหนด WS-Security เช่นเดียวกับระบบ WS-Federation นั้นสร้างขึ้นจาก XML, WDSL และ SOAP SAML เป็นโปรโตคอลที่คล้ายกันมากซึ่งใช้เป็นทางเลือกแทน WS.XML, WDSL และ SOAP ล้วนรวมอยู่ในข้อกำหนดเฉพาะของ WS-Security"},{"id":338,"topic":1,"q":"Which protocol, as a part of TLS, handles negotiating and establishing a connection between two parties?","qth":"โปรโตคอลใดซึ่งเป็นส่วนหนึ่งของ TLS ที่จะจัดการการเจรจาและสร้างการเชื่อมต่อระหว่างสองฝ่าย","a":["Record","Binding","Negotiation","Handshake"],"ath":["บันทึก","การเชื่อมโยง","การเจรจาต่อรอง","การจับมือกัน"],"ans":"D","exp":"The TLS handshake protocol is what negotiates and establishes the TLS connection between two parties and enables a secure communications channel to then handle data transmissions. The TLS record protocol is the actual secure communications method for transmitting data; i's responsible for the encryption and authentication of packets throughout their transmission between the parties, and in some cases it also performs compression. Negotiation and binding are not protocols under TLS","expth":"โปรโตคอลการจับมือกันของ TLS คือสิ่งที่เจรจาและสร้างการเชื่อมต่อ TLS ระหว่างสองฝ่าย และเปิดใช้งานช่องทางการสื่อสารที่ปลอดภัยเพื่อจัดการการส่งข้อมูล โปรโตคอลบันทึก TLS เป็นวิธีการสื่อสารที่ปลอดภัยอย่างแท้จริงสำหรับการส่งข้อมูล ฉันรับผิดชอบในการเข้ารหัสและการรับรองความถูกต้องของแพ็กเก็ตตลอดการส่งข้อมูลระหว่างฝ่ายต่างๆ และในบางกรณีก็ทำการบีบอัดด้วย การเจรจาและการผูกมัดไม่ใช่โปรโตคอลภายใต้ TLS"},{"id":339,"topic":1,"q":"BCDR strategies typically do not involve the entire operations of an organization, but only those deemed critical to their business. Which concept pertains to the required amount of time to restore services to the predetermined level?","qth":"โดยทั่วไปแล้วกลยุทธ์ BCDR จะไม่เกี่ยวข้องกับการดำเนินงานทั้งหมดขององค์กร แต่จะเกี่ยวข้องกับการดำเนินการที่ถือว่ามีความสำคัญต่อธุรกิจเท่านั้น แนวคิดใดที่เกี่ยวข้องกับระยะเวลาที่ต้องการในการกู้คืนบริการให้อยู่ในระดับที่กำหนดไว้ล่วงหน้า","a":["RPO","RSL","RTO","SRE"],"ath":["RPO","RSL","RTO","SRE"],"ans":"C","exp":"The recovery time objective (RTO) measures the amount of time necessary to recover operations to meet the BCDR plan. The recovery service level (RSL) measures the percentage of operations that would be recovered during a BCDR situation. The recovery point objective (RPO) sets and defines the amount of data an organization must have available or accessible to reach the predetermined level of operations necessary during a BCDR situation. SRE is provided as an erroneous response","expth":"วัตถุประสงค์ของเวลาการกู้คืน (RTO) จะวัดระยะเวลาที่จำเป็นในการกู้คืนการดำเนินการเพื่อให้เป็นไปตามแผน BCDR ระดับบริการการกู้คืน (RSL) จะวัดเปอร์เซ็นต์ของการดำเนินการที่จะได้รับการกู้คืนในระหว่างสถานการณ์ BCDR วัตถุประสงค์จุดกู้คืน (RPO) จะกำหนดและกำหนดจำนวนข้อมูลที่องค์กรต้องมีหรือสามารถเข้าถึงได้เพื่อบรรลุระดับการปฏิบัติงานที่กำหนดไว้ล่วงหน้าซึ่งจำเป็นในระหว่างสถานการณ์ BCDR SRE ให้มาเป็นการตอบกลับที่ผิดพลาด"},{"id":340,"topic":1,"q":"Your company is in the planning stages of moving applications that have large data sets to a cloud environment What strategy for data removal would be the MOST appropriate for you to recommend if costs and speed are primary considerations?","qth":"บริษัทของคุณอยู่ในขั้นตอนการวางแผนการย้ายแอปพลิเคชันที่มีชุดข้อมูลขนาดใหญ่ไปยังสภาพแวดล้อมคลาวด์ กลยุทธ์ใดในการลบข้อมูลจะเหมาะสมที่สุดสำหรับคุณในการแนะนำหากคำนึงถึงต้นทุนและความเร็วเป็นหลัก","a":["Shredding","Media destruction","Crypthographic erasure","Overwriting"],"ath":["ทำลายเอกสาร","การทำลายสื่อ","การลบการเข้ารหัส","การเขียนทับ"],"ans":"C","exp":"Cryptographic erasure involves having the data encrypted, typically as a matter of standard operations, and then rendering the data useless and unreadable by destroying the encryption keys for it. It represents a very cheap and immediate way to destroy data, and it works in all environments. With a cloud environment and muttitenancy, media destruction or the physical destruction of storage devices, including shredding, would not be possible. Depending on the environment, overwriting may or may not be possible, but cryptographic erasure is the best answer because it is always an available option and is very quick to implement","expth":"การลบการเข้ารหัสเกี่ยวข้องกับการมีการเข้ารหัสข้อมูล ซึ่งโดยทั่วไปจะเป็นเรื่องของการดำเนินการมาตรฐาน จากนั้นทำให้ข้อมูลไร้ประโยชน์และไม่สามารถอ่านได้โดยการทำลายคีย์การเข้ารหัสของมัน มันเป็นวิธีที่ประหยัดและรวดเร็วในการทำลายข้อมูล และใช้งานได้ในทุกสภาพแวดล้อม ด้วยสภาพแวดล้อมคลาวด์และการเปลี่ยนแปลง การทำลายสื่อหรือการทำลายทางกายภาพของอุปกรณ์จัดเก็บข้อมูล รวมถึงการทำลายเอกสาร จะไม่สามารถทำได้ การเขียนทับอาจหรืออาจเป็นไปไม่ได้ก็ได้ ขึ้นอยู่กับสภาพแวดล้อม แต่การลบข้อมูลเข้ารหัสลับเป็นคำตอบที่ดีที่สุด เนื่องจากเป็นตัวเลือกที่พร้อมใช้งานเสมอและนำไปใช้ได้รวดเร็วมาก"},{"id":342,"topic":1,"q":"IRM solutions allow an organization to place different restrictions on data usage than would otherwise be possible through traditional security controls Which of the following controls would be possible with IRM that would not with traditional security controls?","qth":"โซลูชัน IRM ช่วยให้องค์กรวางข้อจำกัดในการใช้ข้อมูลที่แตกต่างกันเกินกว่าที่จะเป็นไปได้ผ่านการควบคุมความปลอดภัยแบบดั้งเดิม การควบคุมใดต่อไปนี้ที่เป็นไปได้ด้วย IRM ที่จะไม่ใช้กับการควบคุมความปลอดภัยแบบดั้งเดิม","a":["Copy","Read","Delete","Print"],"ath":["คัดลอก","อ่าน","ลบ","พิมพ์"],"ans":"D","exp":"Traditional security controls would not be able to restrict a user from printing something that they have the ability to access and read, but IRM solutions would allow for such a restriction. If a user has permissions to read a file, he can also copy the file or print it under traditional controls, and the ability to modify or write will give the user the ability to delete","expth":"การควบคุมความปลอดภัยแบบดั้งเดิมจะไม่สามารถจำกัดผู้ใช้จากการพิมพ์สิ่งที่พวกเขามีความสามารถในการเข้าถึงและอ่าน แต่โซลูชัน IRM จะอนุญาต สำหรับข้อจำกัดดังกล่าว หากผู้ใช้มีสิทธิ์ในการอ่านไฟล์ เขายังสามารถคัดลอกไฟล์หรือพิมพ์ภายใต้การควบคุมแบบเดิมได้ และความสามารถในการแก้ไขหรือเขียนจะทำให้ผู้ใช้สามารถลบได้"},{"id":343,"topic":1,"q":"Which data protection strategy would be useful for a situation where the ability to remove sensitive data from a set is needed, but a requirement to retain the ability to map back to the original values is also present?","qth":"กลยุทธ์การปกป้องข้อมูลใดที่จะเป็นประโยชน์สำหรับสถานการณ์ที่จำเป็นต้องมีความสามารถในการลบข้อมูลที่ละเอียดอ่อนออกจากชุด แต่มีข้อกำหนดในการรักษาความสามารถในการแมปกลับไปเป็นค่าดั้งเดิมด้วย","a":["Masking","Tokenization","Encryption","Anonymization"],"ath":["การมาสก์","การทำโทเค็น","การเข้ารหัส","การทำให้ไม่ระบุชื่อ"],"ans":"B","exp":"Tokenization involves the replacement of sensitive data fields with key or token values, which can ultimately be mapped back to the original, sensitive data values. Masking refers to the overall approach to covering sensitive data, and anonymization is a type of masking, where indirect identifiers are removed from a data set to prevent the mapping back of data to an individual. Encryption refers to the overall process of protecting data via key pairs and protecting confidentiality","expth":"การทำโทเค็นเกี่ยวข้องกับการแทนที่ฟิลด์ข้อมูลที่ละเอียดอ่อนด้วยค่าคีย์หรือโทเค็น ซึ่งท้ายที่สุดสามารถแมปกลับไปที่ ค่าข้อมูลต้นฉบับที่ละเอียดอ่อน การมาสก์หมายถึงวิธีการโดยรวมในการปกปิดข้อมูลที่ละเอียดอ่อน และการไม่เปิดเผยตัวตนเป็นการมาสก์ประเภทหนึ่ง โดยที่ตัวระบุทางอ้อมจะถูกลบออกจากชุดข้อมูลเพื่อป้องกันการแมปข้อมูลด้านหลังไปยังแต่ละบุคคล การเข้ารหัสหมายถึงกระบวนการโดยรวมในการปกป้องข้อมูลผ่านคู่คีย์และการปกป้องความลับ"},{"id":344,"topic":1,"q":"A comprehensive BCDR plan will encapsulate many traditional data-center concerns. What is one consideration that is often overlooked with the formulation of a BCDR plan?","qth":"แผน BCDR ที่ครอบคลุมจะสรุปข้อกังวลด้านศูนย์ข้อมูลแบบดั้งเดิมหลายประการ ข้อพิจารณาประการหนึ่งที่มักถูกมองข้ามในการจัดทำแผน BCDR คืออะไร","a":["Availability of staff","Capacity at the BCDR site","Restoration of services","Change management processes"],"ath":["ความพร้อมของพนักงาน","ความจุที่ไซต์ BCDR","การฟื้นฟูบริการ","กระบวนการจัดการการเปลี่ยนแปลง"],"ans":"C","exp":"BCDR planning tends to focus so much on the failing over of services in the case of a disaster that recovery back to primary hosting after the disaster is often overlooked. In many instances, this can be just as complex a process as failing over, if not more so. Availability of staff, capacity at the BCDR site, and change management processes are typically integral to BCDR plans and are common components of them,","expth":"การวางแผน BCDR มีแนวโน้มที่จะมุ่งเน้นไปที่ความล้มเหลวของบริการในกรณีเกิดภัยพิบัติ ซึ่งมักถูกมองข้ามการกู้คืนกลับไปยังโฮสติ้งหลักหลังจากเกิดภัยพิบัติ ในหลายกรณี นี่อาจเป็นกระบวนการที่ซับซ้อนพอๆ กับการล้มเหลว หรือมากกว่านั้น ความพร้อมของพนักงาน กำลังการผลิตที่ไซต์ BCDR และกระบวนการจัดการการเปลี่ยนแปลง โดยทั่วไปจะรวมอยู่ในแผน BCDR และเป็นองค์ประกอบทั่วไป"},{"id":345,"topic":1,"q":"Which of the following is NOT one of the components of multifactor authentication?","qth":"ข้อใดต่อไปนี้ไม่ใช่ส่วนประกอบหนึ่งของการตรวจสอบสิทธิ์แบบหลายปัจจัย","a":["Something the user knows","Something the user has","Something the user sends","Something the user is"],"ath":["สิ่งที่ผู้ใช้รู้","บางสิ่งที่ผู้ใช้มี","บางสิ่งที่ผู้ใช้ส่ง","บางสิ่งที่ผู้ใช้เป็น"],"ans":"C","exp":"Multifactor authentication systems are composed of something the user knows, has, and/or is, not something the user sends. Multifactor authentication commonly uses something that a user knows, has, and/or is (such as biometrics or features)","expth":"ระบบการตรวจสอบสิทธิ์แบบหลายปัจจัยประกอบด้วยบางสิ่งที่ผู้ใช้รู้ มี และ/หรือไม่ใช่ ไม่ใช่สิ่งที่ผู้ใช้ส่ง โดยทั่วไปการรับรองความถูกต้องแบบหลายปัจจัยจะใช้สิ่งที่ผู้ใช้ทราบ มี และ/หรือเป็น (เช่น ข้อมูลชีวมาตรหรือฟีเจอร์)"},{"id":346,"topic":1,"q":"Above and beyond general regulations for data privacy and protection, certain types of data are subjected to more rigorous regulations and oversight Which of the following is not a regulatory framework for more sensitive or specialized data?","qth":"เหนือและนอกเหนือจากกฎระเบียบทั่วไปสำหรับความเป็นส่วนตัวและการปกป้องข้อมูล ข้อมูลบางประเภทอยู่ภายใต้กฎระเบียบและการกำกับดูแลที่เข้มงวดมากขึ้น ข้อใดต่อไปนี้ไม่ใช่กรอบการทำงานด้านกฎระเบียบสำหรับข้อมูลที่ละเอียดอ่อนหรือเฉพาะทางมากกว่า","a":["FIPS 140-2","FedRAMP","PCI DSS","HIPAA"],"ath":["FIPS 140-2","FedRAMP","PCI DSS","HIPAA"],"ans":"A","exp":"The FIPS 140-2 standard pertains to the certification of cryptographic modules and is not a regulatory framework. The Payment Card Industry Data Security Standard (PCI DSS), the Federal Risk and Authorization Management Program (FedRAMP), and the Health Insurance Portability and Accountability Act (HIPAA) are all regulatory frameworks for sensitive or specialized data","expth":"มาตรฐาน FIPS 140-2 เกี่ยวข้องกับ การรับรองโมดูลการเข้ารหัสและไม่ใช่กรอบการกำกับดูแล มาตรฐานความปลอดภัยของข้อมูลอุตสาหกรรมบัตรชำระเงิน (PCI DSS), Federal Risk and Authorization Management Program (FedRAMP) และ Health Insurance Portability and Accountability Act (HIP
