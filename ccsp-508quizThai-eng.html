es the REST API support that the SOAP API does NOT support?","qth":"เมื่อใช้ API คุณสมบัติต่างๆ และการเพิ่มประสิทธิภาพเป็นที่ต้องการอย่างมากในด้านความสามารถในการปรับขนาด ความน่าเชื่อถือ และความปลอดภัย REST API รองรับอะไรบ้างที่ SOAP API ไม่รองรับ?","a":["Acceleration","Caching","Redundancy","Encryption"],"ath":["การเร่งความเร็ว","การแคช","ความซ้ำซ้อน","การเข้ารหัส"],"ans":"B","exp":"The Simple Object Access Protocol (SOAP) does not support caching, whereas the Representational State Transfer (REST) API does. The other options are all capabilities that are either not supported by SOAP or not supported by any API and must be provided by external features","expth":"Simple Object Access Protocol (SOAP) ไม่รองรับการแคช ในขณะที่ Representational State Transfer (REST) API ทำ ตัวเลือกอื่นๆ คือความสามารถทั้งหมดที่ SOAP ไม่รองรับหรือไม่รองรับโดย API ใดๆ และต้องมาจากฟีเจอร์ภายนอก"},{"id":240,"topic":1,"q":"Although much of the attention given to data security is focused on keeping data private and only accessible by authorized individuals, of equal importance is the trustworthiness of the data. Which concept encapsulates this?","qth":"แม้ว่าความใส่ใจส่วนใหญ่ที่มอบให้กับความปลอดภัยของข้อมูลจะมุ่งเน้นไปที่การรักษาข้อมูลให้เป็นส่วนตัวและสามารถเข้าถึงได้โดยบุคคลที่ได้รับอนุญาตเท่านั้น แต่สิ่งที่มีความสำคัญเท่าเทียมกันก็คือความน่าเชื่อถือของข้อมูล แนวคิดใดที่สรุปสิ่งนี้","a":["Validity","Integrity","Accessibility","Confidentiality"],"ath":["ความถูกต้อง","ความซื่อสัตย์","การเข้าถึง","การรักษาความลับ"],"ans":"B","exp":"Integrity refers to the trustworthiness of data and whether its format and values are true and have not been corrupted or otherwise altered through unauthorized means Confidentiality refers to keeping data from being access or viewed by unauthorized parties. Accessibility means that data is available and ready when needed by a user or service. Validity can mean a variety of things that are somewhat similar to integrity, but it's not the most appropriate answer in this case","expth":"ความสมบูรณ์หมายถึงความน่าเชื่อถือของข้อมูล และรูปแบบและค่าของข้อมูลนั้นเป็นจริงหรือไม่ และไม่เสียหายหรือเปลี่ยนแปลงด้วยวิธีที่ไม่ได้รับอนุญาต การรักษาความลับหมายถึงการรักษาข้อมูลไม่ให้เข้าถึงหรือดูโดยบุคคลที่ไม่ได้รับอนุญาต การเข้าถึงหมายถึงข้อมูลจะพร้อมใช้งานและพร้อมเมื่อผู้ใช้หรือบริการต้องการ ความถูกต้องอาจหมายถึงหลายสิ่งหลายอย่างที่ค่อนข้างคล้ายกับความสมบูรณ์ แต่ไม่ใช่คำตอบที่เหมาะสมที่สุดในกรณีนี้"},{"id":241,"topic":1,"q":"Three central concepts define what type of data and information an organization is responsible for pertaining to eDiscovery. Which of the following are the three components that comprise required disclosure?","qth":"แนวคิดหลักสามประการกำหนดประเภทของข้อมูลและสารสนเทศที่องค์กรรับผิดชอบเกี่ยวกับ eDiscovery องค์ประกอบใดต่อไปนี้เป็นองค์ประกอบสามประการที่ประกอบด้วยการเปิดเผยที่จำเป็น","a":["Possession, ownership, control","Ownership, use, creation","Control, custody, use","Possession, custody, control"],"ath":["การครอบครอง ความเป็นเจ้าของ การควบคุม","ความเป็นเจ้าของ การใช้ การสร้าง","การควบคุม การดูแล การใช้","การครอบครอง การดูแล การควบคุม"],"ans":"D","exp":"Data that falls under the purview of an eDiscovery request is that which is in the possession, custody, or control of the organization. Although this is an easy concept in a traditional data center, it can be difficult to distinguish who actually possesses and controls the data in a cloud environment due to multitenancy and resource pooling. Although these options provide similar-sounding terms, they are ultimately incorrect","expth":"ข้อมูลที่อยู่ภายใต้ขอบเขตของคำขอ eDiscovery คือข้อมูลที่อยู่ในความครอบครอง การดูแล หรือการควบคุมขององค์กร แม้ว่านี่จะเป็นแนวคิดที่ง่ายในศูนย์ข้อมูลแบบดั้งเดิม แต่ก็อาจเป็นเรื่องยากที่จะแยกแยะว่าใครเป็นเจ้าของและควบคุมข้อมูลในสภาพแวดล้อมคลาวด์เนื่องจากการเช่าหลายรายการและการรวมทรัพยากรเข้าด้วยกัน แม้ว่าตัวเลือกเหล่านี้จะมีคำศัพท์ที่ฟังดูคล้ายกัน แต่ท้ายที่สุดแล้วกลับไม่ถูกต้อง"},{"id":242,"topic":1,"q":"Which of the following threat types involves the sending of commands or arbitrary data through input fields in an application in an attempt to get that code executed as part of normal processing?","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับการส่งคำสั่งหรือข้อมูลที่กำหนดเองผ่านฟิลด์อินพุตในแอปพลิเคชันเพื่อพยายามเรียกใช้โค้ดนั้นโดยเป็นส่วนหนึ่งของการประมวลผลปกติ","a":["Cross-site scripting","Missing function-level access control","Injection","Cross-site forgery"],"ath":["การเขียนสคริปต์ข้ามไซต์","การควบคุมการเข้าถึงระดับฟังก์ชันที่ขาดหายไป","การฉีด","การปลอมแปลงข้ามไซต์"],"ans":"C","exp":"An injection attack is where a malicious actor will send commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part ofits normal processing and queries. This can trick an application into exposing data that is not intended or authorized to be exposed, or it could potentially allow an attacker to gain insight into configurations or security controls. Missing function-level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call. Cross-site request forgery occurs when an attack forces an authenticated user to send forged requests to an application running under their own access and credentials. Cross-site scri","expth":"การโจมตีแบบฉีดคือจุดที่ผู้ประสงค์ร้ายจะส่งคำสั่งหรือข้อมูลที่กำหนดเองอื่น ๆ ผ่านการป้อนข้อมูล และช่องข้อมูลโดยมีจุดประสงค์เพื่อให้แอปพลิเคชันหรือระบบดำเนินการโค้ดซึ่งเป็นส่วนหนึ่งของการประมวลผลและการสืบค้นตามปกติ วิธีนี้สามารถหลอกให้แอปพลิเคชันเปิดเผยข้อมูลที่ไม่ได้ตั้งใจหรือได้รับอนุญาตให้เปิดเผย หรืออาจทำให้ผู้โจมตีได้รับข้อมูลเชิงลึกเกี่ยวกับการกำหนดค่าหรือการควบคุมความปลอดภัย การควบคุมการเข้าถึงระดับฟังก์ชันหายไปโดยที่แอปพลิเคชันตรวจสอบการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบเริ่มต้นเท่านั้น และไม่ได้ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การปลอมแปลงคำขอข้ามไซต์เกิดขึ้นเมื่อการโจมตีบังคับให้ผู้ใช้ที่ได้รับการตรวจสอบสิทธิ์ส่งคำขอปลอมไปยังแอปพลิเคชันที่ทำงานภายใต้การเข้าถึงและข้อมูลประจำตัวของตนเอง การเขียนข้ามไซต์"},{"id":243,"topic":1,"q":"With a cloud service category where the cloud customer is responsible for deploying all services, systems, and components needed for their applications, which of the following storage types are MOST likely to be available to them?","qth":"ด้วยหมวดหมู่บริการคลาวด์ที่ลูกค้าคลาวด์มีหน้าที่รับผิดชอบในการปรับใช้บริการ ระบบ และส่วนประกอบทั้งหมดที่จำเป็นสำหรับแอปพลิเคชันของตน ประเภทพื้นที่จัดเก็บข้อมูลใดต่อไปนี้มีแนวโน้มที่จะพร้อมใช้งานมากที่สุด","a":["Structured and hierarchical","Volume and object","Volume and database","Structured and unstructured"],"ath":["มีโครงสร้างและลำดับชั้น","ปริมาณและวัตถุ","ปริมาณและฐานข้อมูล","มีโครงสร้างและไม่มีโครงสร้าง"],"ans":"B","exp":"The question is describing the Infrastructure as a Service (laaS) cloud offering, and as such, the volume and object storage types will be available to the customer, Structured and unstructured are storage types associated with PaaS, and although the other answers present similat-sounding storage types, they are a mix of real and fake names","expth":"คำถามกำลังอธิบายโครงสร้างพื้นฐานว่าเป็น การนำเสนอบริการบนคลาวด์ของบริการ (laaS) และด้วยเหตุนี้ ประเภทพื้นที่จัดเก็บข้อมูลวอลุ่มและอ็อบเจ็กต์จะพร้อมใช้งานสำหรับลูกค้า ประเภทพื้นที่จัดเก็บข้อมูลที่มีโครงสร้างและไม่มีโครงสร้างเป็นประเภทพื้นที่จัดเก็บข้อมูลที่เกี่ยวข้องกับ PaaS และแม้ว่าคำตอบอื่น ๆ จะแสดงประเภทพื้นที่จัดเก็บข้อมูลที่ฟังดูคล้ายกัน แต่ก็เป็นการผสมผสานระหว่างชื่อจริงและชื่อปลอม"},{"id":244,"topic":1,"q":"Which of the following roles would be responsible for managing memberships in federations and the use and integration of federated services?","qth":"บทบาทใดต่อไปนี้จะต้องรับผิดชอบในการจัดการสมาชิกในสหพันธรัฐและการใช้และการผสานรวมบริการแบบรวมศูนย์","a":["Inter-cloud provider","Cloud service business manager","Cloud service administrator","Cloud service integrator"],"ath":["ผู้ให้บริการระหว่างระบบคลาวด์","ผู้จัดการธุรกิจบริการระบบคลาวด์","ผู้ดูแลระบบบริการระบบคลาวด์","ผู้รวมบริการระบบคลาวด์"],"ans":"A","exp":"The inter-cloud provider is responsible for peering with other cloud services and providers, as well as overseeing and managing federations and federated services. A cloud service administrator is responsible for testing, monitoring, and securing cloud services, as well as providing usage reporting and dealing with service problems. The cloud service integrator is responsible for connecting existing systems and services with a cloud. The cloud service business manager is responsible for overseeing the billing, auditing, and purchasing of cloud services","expth":"ผู้ให้บริการระบบระหว่างระบบคลาวด์มีหน้าที่รับผิดชอบในการเพียร์กับบริการและผู้ให้บริการระบบคลาวด์อื่นๆ ตลอดจนดูแลและจัดการระบบสหพันธรัฐและบริการแบบรวมศูนย์ ผู้ดูแลระบบบริการคลาวด์มีหน้าที่รับผิดชอบในการทดสอบ ตรวจสอบ และรักษาความปลอดภัยบริการคลาวด์ รวมถึงจัดทำรายงานการใช้งานและจัดการกับปัญหาการบริการ ผู้รวมบริการคลาวด์มีหน้าที่รับผิดชอบในการเชื่อมต่อระบบและบริการที่มีอยู่กับคลาวด์ ผู้จัดการธุรกิจบริการคลาวด์มีหน้าที่ดูแลการเรียกเก็บเงิน การตรวจสอบ และการจัดซื้อบริการคลาวด์"},{"id":245,"topic":1,"q":"Which data state would be most likely to use TLS as a protection mechanism?","qth":"สถานะข้อมูลใดมีแนวโน้มที่จะใช้ TLS เป็นกลไกการป้องกันมากที่สุด","a":["Data in use","Data at rest","Archived","Data in transit"],"ath":["ข้อมูลที่ใช้งาน","ข้อมูลที่เหลือ","เก็บถาวร","ข้อมูลระหว่างทาง"],"ans":"D","exp":"TLS would be used with data in transit, when packets are exchanged between clients or services and sent across a network. During the data-in-use state, the data is already protected via a technology such as TLS as it is exchanged over the network and then relies on other technologies such as digital signatures for protection while being used. The data-at-rest state primarily uses encryption for stored file objects. Archived data would be the same as data at rest","expth":"TLS จะถูกใช้กับข้อมูลระหว่างทาง เมื่อมีการแลกเปลี่ยนแพ็กเก็ตระหว่างไคลเอนต์หรือบริการและส่งข้ามเครือข่าย ในระหว่างสถานะข้อมูลใช้งานอยู่ ข้อมูลได้รับการปกป้องด้วยเทคโนโลยี เช่น TLS เมื่อมีการแลกเปลี่ยนผ่านเครือข่าย จากนั้นจึงอาศัยเทคโนโลยีอื่นๆ เช่น ลายเซ็นดิจิทัล เพื่อป้องกันขณะใช้งาน สถานะข้อมูลที่เหลือใช้การเข้ารหัสสำหรับออบเจ็กต์ไฟล์ที่จัดเก็บเป็นหลัก ข้อมูลที่เก็บถาวรจะเหมือนกับข้อมูลที่เหลือ"},{"id":246,"topic":1,"q":"You are working for a cloud service provider and receive an eDiscovery order pertaining to one of your customers Which of the following would be the most appropriate action to take first?","qth":"คุณกำลังทำงานให้กับผู้ให้บริการระบบคลาวด์และได้รับคำสั่งซื้อ eDiscovery ที่เกี่ยวข้องกับหนึ่งในลูกค้าของคุณ ข้อใดต่อไปนี้เป็นการดำเนินการที่เหมาะสมที่สุดในการดำเนินการก่อน","a":["Take a shapshot of the virtual machines","Escrow the encryption keys","Copy the data","Notify the customer"],"ath":["ถ่ายภาพของเครื่องเสมือน","ฝากคีย์การเข้ารหัส","คัดลอกข้อมูล","แจ้งเตือนลูกค้า"],"ans":"D","exp":"When a cloud service provider receives an eDiscovery order pertaining to one of their customers, the first action they must take is to notify the customer. This allows the customer to be aware of what was received, as well as to conduct a review to determine if any challenges are necessary or warranted. Taking snapshots of virtual machines, copying data, and escrowing encryption keys are all processes involved in the actual collection of data and should not be performed until the customer has been notified of the request","expth":"เมื่อผู้ให้บริการระบบคลาวด์ได้รับคำสั่งซื้อ eDiscovery ที่เกี่ยวข้องกับคำสั่งซื้อนั้น ของลูกค้า สิ่งแรกที่พวกเขาต้องทำคือการแจ้งให้ลูกค้าทราบ วิธีนี้ช่วยให้ลูกค้าทราบถึงสิ่งที่ได้รับ ตลอดจนดำเนินการตรวจสอบเพื่อพิจารณาว่าความท้าทายใดๆ ที่จำเป็นหรือรับประกันหรือไม่ การถ่ายภาพสแน็ปช็อตของเครื่องเสมือน การคัดลอกข้อมูล และการเข้ารหัสคีย์เอสโครว์เป็นกระบวนการทั้งหมดที่เกี่ยวข้องกับการรวบรวมข้อมูลจริง และไม่ควรดำเนินการจนกว่าลูกค้าจะได้รับแจ้งถึงคำขอ"},{"id":247,"topic":1,"q":"Ifa cloud computing customer wishes to guarantee that a minimum level of resources will always be available, which of the following set of services would compromise the reservation?","qth":"หากลูกค้าการประมวลผลแบบคลาวด์ของ Ifa ต้องการรับประกันว่าทรัพยากรในระดับขั้นต่ำจะพร้อมใช้งานเสมอ ชุดบริการใดต่อไปนี้ที่อาจส่งผลต่อการสำรอง","a":["Memory and networking","CPU and software","CPU and storage","CPU and memory"],"ath":["หน่วยความจำและเครือข่าย","CPU และซอฟต์แวร์","CPU และพื้นที่เก็บข้อมูล","CPU และหน่วยความจำ"],"ans":"D","exp":"A reservation guarantees to a cloud customer that they will have access to a minimal level of resources to run their systems, which will help mitigate against DoS attacks or systems that consume high levels of resources. A reservation pertains to memory and CPU resources. Under the concept of a reservation, memory and CPU are the guaranteed resources, but storage and networking are not included even though they are core components of cloud computing. Software would be out of scope for a guarantee and doesn't really pertain to the concept","expth":"การสำรองรับประกันกับลูกค้าระบบคลาวด์ว่าพวกเขาจะสามารถเข้าถึงทรัพยากรในระดับต่ำสุดเพื่อรันระบบ ซึ่งจะช่วยบรรเทาลง การโจมตี DoS หรือระบบที่ใช้ทรัพยากรในระดับสูง การสำรองเกี่ยวข้องกับหน่วยความจำและทรัพยากร CPU ภายใต้แนวคิดของการสำรอง หน่วยความจำและ CPU เป็นทรัพยากรที่รับประกัน แต่พื้นที่เก็บข้อมูลและเครือข่ายจะไม่รวมอยู่ด้วย แม้ว่าจะเป็นองค์ประกอบหลักของการประมวลผลแบบคลาวด์ก็ตาม ซอฟต์แวร์จะอยู่นอกขอบเขตการรับประกันและไม่เกี่ยวข้องกับแนวคิดนี้จริงๆ"},{"id":248,"topic":1,"q":"Which of the following threat types can occur when baselines are not appropriately applied or when unauthorized changes are made?","qth":"ภัยคุกคามประเภทใดต่อไปนี้ที่สามารถเกิดขึ้นได้เมื่อมีการใช้บรรทัดฐานไม่เหมาะสมหรือเมื่อทำการเปลี่ยนแปลงโดยไม่ได้รับอนุญาต","a":["Security misconfiguration","Insecure direct object references","Unvalidated redirects and forwards","Sensitive data exposure"],"ath":["การกำหนดค่าความปลอดภัยผิดพลาด","การอ้างอิงออบเจ็กต์โดยตรงที่ไม่ปลอดภัย","การเปลี่ยนเส้นทางและการส่งต่อที่ไม่ถูกต้อง","การเปิดเผยข้อมูลที่ละเอียดอ่อน"],"ans":"A","exp":"Security misconfigurations occur when applications and systems are not properly configured or maintained in a secure manner. This can be due to a shortcoming in security baselines or configurations, unauthorized changes to system configurations, or a failure to patch and upgrade systems as the vendor releases security patches Insecure direct object references occur when code references aspects of the infrastructure, especially internal or private systems, and an attacker can use that knowledge to glean more information about the infrastructure. Unvalidated redirects and forwards occur when an application has functions to forward users to other sites, and these functions are not properly secured to validate the data and redirect requests, allowing spoofing for malware or phishing attacks. S","expth":"การกำหนดค่าความปลอดภัยผิดพลาดเกิดขึ้นเมื่อแอปพลิเคชันและระบบไม่ได้รับการกำหนดค่าหรือบำรุงรักษาอย่างเหมาะสมในลักษณะที่ปลอดภัย ซึ่งอาจเนื่องมาจากข้อบกพร่องในบรรทัดฐานหรือการกำหนดค่าการรักษาความปลอดภัย การเปลี่ยนแปลงการกำหนดค่าระบบโดยไม่ได้รับอนุญาต หรือความล้มเหลวในการแก้ไขและอัปเกรดระบบเนื่องจากผู้จำหน่ายออกแพทช์รักษาความปลอดภัย การอ้างอิงออบเจ็กต์โดยตรงที่ไม่ปลอดภัยเกิดขึ้นเมื่อโค้ดอ้างอิงแง่มุมต่างๆ ของโครงสร้างพื้นฐาน โดยเฉพาะอย่างยิ่งระบบภายในหรือส่วนตัว และผู้โจมตีสามารถใช้ความรู้นั้นเพื่อรวบรวมข้อมูลเพิ่มเติมเกี่ยวกับโครงสร้างพื้นฐาน การเปลี่ยนเส้นทางและการส่งต่อที่ไม่ถูกต้องเกิดขึ้นเมื่อแอปพลิเคชันมีฟังก์ชันในการส่งต่อผู้ใช้ไปยังไซต์อื่น และฟังก์ชันเหล่านี้ไม่ได้รับการรักษาความปลอดภัยอย่างเหมาะสมในการตรวจสอบข้อมูลและคำขอเปลี่ยนเส้นทาง ทำให้เกิดการปลอมแปลงการโจมตีของมัลแวร์หรือฟิชชิ่ง ส"},{"id":249,"topic":1,"q":"Which of the following is considered an internal redundancy for a data center?","qth":"ข้อใดต่อไปนี้ถือเป็นความซ้ำซ้อนภายในสำหรับศูนย์ข้อมูล","a":["Power feeds","Chillers","Network circuits","Generators"],"ath":["ตัวป้อนพลังงาน","ชิลเลอร์","วงจรเครือข่าย","เครื่องกำเนิดไฟฟ้า"],"ans":"B","exp":"Chillers and cooling systems are internal to a data center and its operations, and as such they are considered an internal redundancy. Power feeds, network circuits, and generators are all external to a data center and provide utility services to them, which makes them an external redundancy","expth":"ชิลเลอร์และระบบทำความเย็นเป็นแบบภายในของศูนย์ข้อมูลและการดำเนินงานของศูนย์ และด้วยเหตุนี้ จึงถือเป็นความซ้ำซ้อนภายใน การจ่ายพลังงาน วงจรเครือข่าย และเครื่องกำเนิดไฟฟ้าทั้งหมดอยู่ภายนอกศูนย์ข้อมูลและให้บริการสาธารณูปโภคแก่สิ่งเหล่านั้น ซึ่งทำให้เป็นสิ่งซ้ำซ้อนภายนอก"},{"id":250,"topic":1,"q":"Which of the following threat types involves the sending of invalid and manipulated requests through a user's client to execute commands on the application under their own credentials?","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับการส่งคำขอที่ไม่ถูกต้องและถูกจัดการผ่านไคลเอนต์ของผู้ใช้เพื่อรันคำสั่งบนแอปพลิเคชันภายใต้ข้อมูลประจำตัวของตนเอง","a":["Injection","Cross-site request forgery","Missing function-level access control","Cross-site scripting"],"ath":["การฉีด","การปลอมแปลงคำขอข้ามไซต์","ไม่มีการควบคุมการเข้าถึงระดับฟังก์ชัน","การเขียนสคริปต์ข้ามไซต์"],"ans":"B","exp":"A ctoss-site request forgery (CSRF) attack forces a client that a user has used to authenticate to an application to send forged requests under the user's own credentials to execute commands and requests that the application thinks are coming from a trusted client and user. Although this type of attack cannot be used to steal data directly because the attacker has no way to see the results of the commands, it does open other ways to compromise an application. Missing function- level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the applic","expth":"กองกำลังโจมตีการปลอมแปลงคำขอ ctoss-site (CSRF) ไคลเอนต์ที่ผู้ใช้ใช้ในการตรวจสอบแอปพลิเคชันเพื่อส่งคำขอปลอมแปลงภายใต้ข้อมูลประจำตัวของผู้ใช้เองเพื่อดำเนินการคำสั่งและคำขอที่แอปพลิเคชันคิดว่ามาจากไคลเอนต์และผู้ใช้ที่เชื่อถือได้ แม้ว่าการโจมตีประเภทนี้จะไม่สามารถใช้เพื่อขโมยข้อมูลได้โดยตรง เนื่องจากผู้โจมตีไม่มีทางดูผลลัพธ์ของคำสั่งได้ แต่ก็เปิดช่องทางอื่นในการบุกรุกแอปพลิเคชัน การควบคุมการเข้าถึงระดับฟังก์ชันหายไปซึ่งแอปพลิเคชันตรวจสอบเฉพาะการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบเริ่มต้นเท่านั้น และไม่ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การโจมตีแบบฉีดคือการที่ผู้ประสงค์ร้ายส่งคำสั่งหรือข้อมูลอื่น ๆ ตามอำเภอใจผ่านอินพุตและช่องข้อมูลโดยมีจุดประสงค์เพื่อให้แอปพลิเคชัน"},{"id":251,"topic":1,"q":"With finite resources available within a cloud, even the largest cloud providers will at times need to determine which customers will receive additional resources first. What is the term associated with this determination?","qth":"ด้วยทรัพยากรที่มีอยู่อย่างจำกัดภายในระบบคลาวด์ แม้แต่ผู้ให้บริการระบบคลาวด์รายใหญ่ที่สุดก็ยังจำเป็นต้องตัดสินใจว่าลูกค้ารายใดจะได้รับทรัพยากรเพิ่มเติมก่อน คำที่เกี่ยวข้องกับการตัดสินใจนี้คืออะไร?","a":["Weighting","Prioritization (UENCE)","Shares (NaI","Scoring"],"ath":["การถ่วงน้ำหนัก","การจัดลำดับความสำคัญ (UENCE)","หุ้น (NaI","การให้คะแนน"],"ans":"C","exp":"Shares are used within a cloud environment to prioritize resource allocation when customer requests exceed the available resources. Cloud providers utilize shares by assigning a priority score to each customer and allocating resources to those with the highest scores first. Scoring is a component of shares that determines the actual order in which to allocate resources. Neither weighting nor prioritization is the correct term in this case","expth":"การแชร์จะใช้ภายในสภาพแวดล้อมคลาวด์เพื่อจัดลำดับความสำคัญของการจัดสรรทรัพยากรเมื่อคำขอของลูกค้าเกินทรัพยากรที่มีอยู่ ผู้ให้บริการคลาวด์ใช้การแบ่งปันโดยกำหนดคะแนนลำดับความสำคัญให้กับลูกค้าแต่ละราย และจัดสรรทรัพยากรให้กับลูกค้าที่มีคะแนนสูงสุดก่อน การให้คะแนนเป็นองค์ประกอบของการแบ่งปันที่กำหนดลำดับที่แท้จริงในการจัดสรรทรัพยากร การถ่วงน้ำหนักหรือการจัดลำดับความสำคัญไม่ใช่คำที่ถูกต้องในกรณีนี้"},{"id":252,"topic":1,"q":"In order to comply with regulatory requirements, which of the following secure erasure methods would be available to a cloud customer using volume storage within the laaS service model?","qth":"เพื่อให้เป็นไปตามข้อกำหนดด้านกฎระเบียบ ลูกค้าระบบคลาวด์จะใช้วิธีลบข้อมูลอย่างปลอดภัยวิธีใดต่อไปนี้ได้โดยใช้พื้นที่จัดเก็บข้อมูลจำนวนมากภายในโมเดลบริการ laaS","a":["Demagnetizing","Shredding","Degaussing","Cryptographic erasure"],"ath":["การลดอำนาจแม่เหล็ก","การทำลายล้าง","การล้างสนามแม่เหล็ก","การลบข้อมูลด้วยการเข้ารหัสลับ"],"ans":"D","exp":"Cryptographic erasure is a secure method to destroy data by destroying the keys that were used to encrypt it. This method is universally available for volume storage on laaS and is also extremely quick. Shredding, degaussing, and demagnetizing are all physically destructive methods that would not be permitted within a cloud environment using shared resources","expth":"การลบข้อมูลด้วยการเข้ารหัสลับเป็นวิธีการที่ปลอดภัยในการทำลายข้อมูลโดยการทำลายคีย์ที่ใช้ในการเข้ารหัส วิธีการนี้สามารถใช้ได้ทั่วโลกสำหรับพื้นที่จัดเก็บปริมาณข้อมูลบน laaS และยังทำได้รวดเร็วมากอีกด้วย การทำลาย การล้างสนามแม่เหล็ก และการล้างอำนาจแม่เหล็กล้วนเป็นวิธีการทำลายล้างทางกายภาพที่จะไม่ได้รับอนุญาตภายในสภาพแวดล้อมคลาวด์โดยใช้ทรัพยากรที่ใช้ร่วมกัน"},{"id":253,"topic":1,"q":"Where is a DLP solution generally installed when utilized for monitoring data in use?","qth":"โดยทั่วไปแล้วโซลูชัน DLP จะติดตั้งไว้ที่ใดเมื่อใช้สำหรับการตรวจสอบข้อมูลที่ใช้งานอยู่","a":["Application server","Database server","Network perimeter","User’s client"],"ath":["เซิร์ฟเวอร์แอปพลิเคชัน","เซิร์ฟเวอร์ฐานข้อมูล","ขอบเขตเครือข่าย","ไคลเอนต์ของผู้ใช้"],"ans":"D","exp":"To monitor data in use, the DLP solution's optimal location would be on the user's client or workstation, where the data would be used or processed, and where it would be most vulnerable to access or exposure. The network perimeter is most appropriate for data in transit, and an application server would serve as middle stage between data at rest and data in use, but is a less correct answer than a user's client. A database server would be an example of a location appropriate for monitoring data at rest","expth":"ในการตรวจสอบข้อมูลที่ใช้งานอยู่ ตำแหน่งที่เหมาะสมที่สุดของโซลูชัน DLP จะอยู่บนไคลเอนต์หรือเวิร์กสเตชันของผู้ใช้ ที่ซึ่งข้อมูลจะถูกใช้หรือประมวลผล และตำแหน่งที่เสี่ยงต่อการเข้าถึงหรือเปิดเผยมากที่สุด ขอบเขตเครือข่ายเหมาะสมที่สุดสำหรับข้อมูลระหว่างทาง และแอปพลิเคชันเซิร์ฟเวอร์จะทำหน้าที่เป็นกึ่งกลางระหว่างข้อมูลที่เหลือและข้อมูลที่ใช้งาน แต่เป็นคำตอบที่ถูกต้องน้อยกว่าไคลเอนต์ของผู้ใช้ เซิร์ฟเวอร์ฐานข้อมูลจะเป็นตัวอย่างของตำแหน่งที่เหมาะสมสำหรับการตรวจสอบข้อมูลที่เหลือ"},{"id":254,"topic":1,"q":"Which of the following aspects of cloud computing would make it more likely that a cloud provider would be unwilling to satisfy specific certification requirements?","qth":"ลักษณะใดต่อไปนี้ของการประมวลผลแบบคลาวด์จะทำให้ผู้ให้บริการระบบคลาวด์มีแนวโน้มมากขึ้นที่จะไม่ปฏิบัติตามข้อกำหนดการรับรองเฉพาะ","a":["Regulation","Multitenancy","Virtualization","Resource pooling"],"ath":["กฎระเบียบ","การเช่าหลายรายการ","การจำลองเสมือน","การรวมทรัพยากร"],"ans":"B","exp":"With cloud providers hosting a number of different customers, it would be impractical for them to pursue additional certifications based on the needs of a specific customer. Cloud environments are built to a common denominator to serve the greatest number of customers. Especially within a public cloud model, itis not possible or practical for a cloud provider to alter its services for specific customer demands. Resource pooling and virtualization within a cloud environment would be the same for all customers, and would not impact certifications that a cloud provider might be willing to pursue. Regulations would form the basis for certification problems and would be a reason for a cloud provider to pursue specific certifications to meet customer requirements","expth":"เมื่อมีผู้ให้บริการระบบคลาวด์โฮสต์ลูกค้าที่แตกต่างกันจำนวนหนึ่ง จึงเป็นไปไม่ได้สำหรับพวกเขาที่จะปฏิบัติตามการรับรองเพิ่มเติมตามความต้องการของลูกค้าเฉพาะราย สภาพแวดล้อมคลาวด์ถูกสร้างขึ้นเพื่อให้มีส่วนร่วมเพื่อรองรับลูกค้าจำนวนมากที่สุด โดยเฉพาะอย่างยิ่งภายในโมเดลคลาวด์สาธารณะ ผู้ให้บริการคลาวด์เป็นไปไม่ได้หรือในทางปฏิบัติที่จะปรับเปลี่ยนบริการตามความต้องการเฉพาะของลูกค้า การรวมทรัพยากรและการจำลองเสมือนภายในสภาพแวดล้อมคลาวด์จะเหมือนกันสำหรับลูกค้าทุกคน และจะไม่ส่งผลกระทบต่อการรับรองที่ผู้ให้บริการคลาวด์อาจเต็มใจที่จะปฏิบัติตาม กฎระเบียบต่างๆ จะเป็นพื้นฐานสำหรับปัญหาการรับรอง และจะเป็นเหตุผลให้ผู้ให้บริการระบบคลาวด์ดำเนินการรับรองเฉพาะเพื่อให้ตรงตามความต้องการของลูกค้า"},{"id":255,"topic":1,"q":"Which phase of the cloud data lifecycle would be the MOST appropriate for the use of DLP technologies to protect the data?","qth":"ระยะใดของวงจรชีวิตข้อมูลบนคลาวด์ที่จะเหมาะสมที่สุดสำหรับการใช้เทคโนโลยี DLP เพื่อปกป้องข้อมูล?","a":["Use","Store","Share","Create"],"ath":["ใช้ (Use)","จัดเก็บ (Store)","แบ่งปัน (Share)","สร้าง (Create)"],"ans":"C","exp":"During the share phase, data is allowed to leave the application for consumption by other vendors, systems, or services. At this point, as the data is leaving the security controls of the application, the use of DLP technologies is appropriate to control how the data is used or to force expiration. During the use, create, and store phases, traditional security controls are available and are more appropriate because the data is stil internal to the application","expth":"ในระหว่างระยะการแบ่งปัน ข้อมูลจะได้รับอนุญาตให้ออกจากแอปพลิเคชันเพื่อการใช้งานโดยผู้จำหน่าย ระบบ หรือบริการอื่น ๆ ณ จุดนี้ เนื่องจากข้อมูลออกจากการควบคุมความปลอดภัยของแอปพลิเคชัน การใช้เทคโนโลยี DLP จึงเหมาะสมในการควบคุมวิธีการใช้ข้อมูลหรือบังคับให้หมดอายุ ในระหว่างขั้นตอนการใช้งาน สร้าง และจัดเก็บ การควบคุมความปลอดภัยแบบดั้งเดิมจะพร้อมใช้งานและมีความเหมาะสมมากกว่า เนื่องจากข้อมูลยังอยู่ภายในแอปพลิเคชัน"},{"id":256,"topic":1,"q":"During which phase of the cloud data lifecycle is it possible for the classification of data to change?","qth":"ในระหว่างช่วงใดของวงจรการใช้งานข้อมูลบนคลาวด์ เป็นไปได้ที่การจัดประเภทของข้อมูลจะเปลี่ยนแปลง","a":["Use","Archive","Create","Share"],"ath":["ใช้","การเก็บถาวร","สร้าง","แบ่งปัน"],"ans":"C","exp":"The create phase encompasses any time data is created, imported, or modified, With any change in the content or value of data, the classification may also change. It must be continually reevaluated to ensure proper security. During the use, share, and archive phases, the data is not modified in any way, so the original classification is still relevant","expth":"ขั้นตอนการสร้างจะครอบคลุมทุกครั้งที่มีการสร้าง นำเข้า หรือแก้ไขข้อมูล เมื่อมีการเปลี่ยนแปลงในเนื้อหาหรือค่าของข้อมูล การจำแนกประเภทก็อาจเปลี่ยนแปลงได้เช่นกัน จะต้องมีการประเมินใหม่อย่างต่อเนื่องเพื่อให้มั่นใจถึงความปลอดภัยที่เหมาะสม ในระหว่างขั้นตอนการใช้งาน แบ่งปัน และเก็บถาวร ข้อมูลจะไม่ได้รับการแก้ไขใดๆ ดังนั้นการจำแนกประเภทเดิมยังคงมีความเกี่ยวข้อง"},{"id":257,"topic":1,"q":"If akey feature of cloud computing that your organization desires is the ability to scale and expand without limit or concern about available resources, which cloud deployment model would you MOST likely be considering?","qth":"หากคุณลักษณะสำคัญของการประมวลผลแบบคลาวด์ที่องค์กรของคุณต้องการคือความสามารถในการปรับขนาดและขยายได้โดยไม่มีขีดจำกัดหรือข้อกังวลเกี่ยวกับทรัพยากรที่มีอยู่ โมเดลการปรับใช้ระบบคลาวด์แบบใดที่คุณน่าจะพิจารณามากที่สุด","a":["Public","Hybrid","Private","Community"],"ath":["สาธารณะ","ไฮบริด","ส่วนตัว","ชุมชน"],"ans":"A","exp":"Public clouds, such as AWS and Azure, are massive systems run by major corporations, and they account for a significant share of Internet traffic and services. They are always expanding, offer enormous resources to customers, and are the least likely to run into resource constraints compared to the other deployment models. Private clouds would likely have the resources available for specific uses and could not be assumed to have a large pool of resources available for expansion. A community cloud would have the same issues as a private cloud, being targeted to similar organizations. A hybrid cloud, because it spans multiple clouds, would not fit the bill either, without the use of individual cloud models","expth":"ระบบคลาวด์สาธารณะ เช่น AWS และ Azure เป็นระบบขนาดใหญ่ที่ดำเนินการโดยองค์กรขนาดใหญ่ และมีส่วนทำให้เกิดส่วนแบ่งที่สำคัญของ การรับส่งข้อมูลอินเทอร์เน็ตและบริการ โดยจะขยายตัวอยู่เสมอ นำเสนอทรัพยากรจำนวนมหาศาลให้กับลูกค้า และมีแนวโน้มที่จะพบกับข้อจำกัดด้านทรัพยากรน้อยที่สุดเมื่อเทียบกับโมเดลการใช้งานอื่นๆ คลาวด์ส่วนตัวน่าจะมีทรัพยากรที่พร้อมใช้งานสำหรับการใช้งานเฉพาะ และไม่สามารถสันนิษฐานได้ว่ามีแหล่งทรัพยากรจำนวนมากสำหรับการขยาย คลาวด์ชุมชนจะมีปัญหาเช่นเดียวกับคลาวด์ส่วนตัว โดยมีเป้าหมายไปที่องค์กรที่คล้ายคลึงกัน ไฮบริดคลาวด์เนื่องจากครอบคลุมหลายคลาวด์ จึงไม่เหมาะกับความต้องการเช่นกัน หากไม่มีการใช้โมเดลคลาวด์แยกกัน"},{"id":258,"topic":1,"q":"What is a serious complication an organization faces from the compliance perspective with international operations?","qth":"ภาวะแทรกซ้อนร้ายแรงที่องค์กรเผชิญจากมุมมองการปฏิบัติตามกฎระเบียบกับการดำเนินงานระหว่างประเทศคืออะไร","a":["Multiple jurisdictions","Different certifications","Different operational procedures","Different capabilities"],"ath":["เขตอำนาจศาลหลายแห่ง","การรับรองที่แตกต่างกัน","ขั้นตอนการปฏิบัติงานที่แตกต่างกัน","ความสามารถที่แตกต่างกัน"],"ans":"A","exp":"When operating within a global framework, a security professional runs into a multitude of jurisdictions and requirements, which often may not be clearly applicable or may be in contention with each other. These requirements can involve the location of the users and the type of data they enter into systems, the laws governing the organization that owns the application and any regulatory requirements they may have, and finally the appropriate laws and regulations for the jurisdiction housing the IT resources and where the data is actually stored, which may be multiple jurisdictions as well. Different certifications would not come into play as a challenge because the major IT and data center certifications are international and would apply to any cloud provider. Different capabilities and di","expth":"เมื่อดำเนินการภายในกรอบการทำงานระดับโลก ผู้เชี่ยวชาญด้านความปลอดภัยจะต้องพบกับเขตอำนาจศาลและข้อกำหนดจำนวนมาก ซึ่งมักจะไม่สามารถนำไปใช้ได้อย่างชัดเจนหรืออาจขัดแย้งกันเอง ข้อกำหนดเหล่านี้อาจเกี่ยวข้องกับตำแหน่งของผู้ใช้และประเภทของข้อมูลที่ผู้ใช้ป้อนเข้าสู่ระบบ กฎหมายที่ควบคุมองค์กรที่เป็นเจ้าของแอปพลิเคชันและข้อกำหนดด้านกฎระเบียบใดๆ ที่ผู้ใช้อาจมี และสุดท้ายคือกฎหมายและข้อบังคับที่เหมาะสมสำหรับเขตอำนาจศาลซึ่งเป็นที่เก็บทรัพยากรด้านไอที และสถานที่ที่ข้อมูลถูกจัดเก็บจริง ซึ่งอาจมีหลายเขตอำนาจศาลเช่นกัน การรับรองที่แตกต่างกันจะไม่ถือเป็นความท้าทาย เนื่องจากการรับรองด้านไอทีและศูนย์ข้อมูลหลักๆ เป็นการรับรองระดับสากลและจะนำไปใช้กับผู้ให้บริการระบบคลาวด์ทุกราย ความสามารถที่แตกต่างกันและได"},{"id":259,"topic":1,"q":"ISO/IEC has established international standards for many aspects of computing and any processes or procedures related to information technology. Which ISO/IEC standard has been established to provide a framework for handling eDiscovery processes?","qth":"ISO/IEC ได้กำหนดมาตรฐานสากลสำหรับแง่มุมต่างๆ ของคอมพิวเตอร์และกระบวนการหรือขั้นตอนใดๆ ที่เกี่ยวข้องกับเทคโนโลยีสารสนเทศ มาตรฐาน ISO/IEC ใดที่ได้รับการจัดตั้งขึ้นเพื่อเป็นกรอบการทำงานสำหรับการจัดการกระบวนการ eDiscovery","a":["ISO/IEC 27001","ISO/IEC 27002","ISO/IEC 27040","ISO/IEC 27050"],"ath":["ISO/IEC 27001","ISO/IEC27002","ISO/IEC 27040","ISO/IEC 27050"],"ans":"D","exp":"ISO/IEC 27050 strives to establish an internationally accepted standard for eDiscovery processes and best practices. It encompasses all steps of the eDiscovery process, including the identification, preservation, collection, processing, review, analysis, and the final production of the requested data archive. ISO/IEC 27001 is a general security specification for an information security management system. ISO/IEC 27002 gives best practice recommendations for information security management. ISO/IEC 27040 is focused on the security of storage systems","expth":"ISO/IEC 27050 มุ่งมั่นที่จะสร้างมาตรฐานที่เป็นที่ยอมรับในระดับสากลสำหรับกระบวนการ eDiscovery และแนวปฏิบัติที่ดีที่สุด โดยครอบคลุมทุกขั้นตอนของกระบวนการ eDiscovery รวมถึงการระบุ การเก็บรักษา การรวบรวม การประมวลผล การทบทวน การวิเคราะห์ และการผลิตขั้นสุดท้ายของการเก็บถาวรข้อมูลที่ร้องขอ ISO/IEC 27001 เป็นข้อกำหนดด้านความปลอดภัยทั่วไปสำหรับระบบการจัดการความปลอดภัยของข้อมูล ISO/IEC 27002 ให้คำแนะนำแนวปฏิบัติที่ดีที่สุดสำหรับการจัดการความปลอดภัยของข้อมูล ISO/IEC 27040 มุ่งเน้นไปที่ความปลอดภัยของระบบจัดเก็บข้อมูล"},{"id":260,"topic":1,"q":"If a company needed to guarantee through contract and SLAs that a cloud provider would always have available sufficient resources to start their services and provide a certain level of provisioning, what would the contract need to refer to?","qth":"หากบริษัทจำเป็นต้องรับประกันผ่านสัญญาและ SLA ว่าผู้ให้บริการระบบคลาวด์จะมีทรัพยากรเพียงพอเสมอในการเริ่มต้นบริการและจัดเตรียมการจัดเตรียมในระดับหนึ่ง สัญญาจำเป็นต้องอ้างอิงถึงอะไร","a":["Limit","Reservation","Assurance","Guarantee"],"ath":["ขีดจำกัด","การจอง","การประกัน","รับประกัน"],"ans":"B","exp":"A reservation guarantees to a cloud customer that they will have access to a minimal level of resources to run their systems, which will help mitigate against DoS attacks or systems that consume high levels of resources. A limit refers to the enforcement of a maximum level of resources that can be consumed by or allocated to a cloud customer, service, or system. Both guarantee and assurance are terms that sound similar to reservation, but they are not correct choices","expth":"การจองรับประกันกับลูกค้าระบบคลาวด์ว่าพวกเขาจะสามารถเข้าถึงทรัพยากรในระดับต่ำสุดเพื่อรันระบบ ซึ่งจะช่วยบรรเทาการโจมตี DoS หรือระบบที่ใช้ทรัพยากรในระดับสูง ขีดจำกัดหมายถึงการบังคับใช้ทรัพยากรในระดับสูงสุดที่สามารถนำมาใช้หรือจัดสรรให้กับลูกค้าบริการหรือระบบคลาวด์ได้ ทั้งการรับประกันและการรับประกันเป็นเงื่อนไขที่ฟังดูคล้ายกับการจอง แต่ไม่ใช่ตัวเลือกที่ถูกต้อง"},{"id":261,"topic":1,"q":"Many aspects and features of cloud computing can make eDiscovery compliance more difficult or costly. Which aspect of cloud computing would be the MOST complicating factor?","qth":"ลักษณะและคุณลักษณะหลายประการของการประมวลผลแบบคลาวด์สามารถทำให้การปฏิบัติตามข้อกำหนดของ eDiscovery ยากขึ้นหรือมีค่าใช้จ่ายสูง แง่มุมใดของการประมวลผลแบบคลาวด์จะเป็นปัจจัยที่ซับซ้อนที่สุด","a":["Measured service","Broad network access","Multitenancy","Portability"],"ath":["บริการวัดผล","การเข้าถึงเครือข่ายในวงกว้าง","การเช่าหลายรายการ","การพกพา"],"ans":"C","exp":"With multitenancy, multiple customers share the same physical hardware and systems. With the nature of a cloud environment and how it writes data across diverse systems that are shared by others, the process of eDiscovery becomes much more complicated. Administrators cannot pull physical drives or easily isolate which data to capture. They not only have to focus on which data they need to collect, while ensuring they find all of it, but they also have to make sure that other data is not accidently collected and exposed along with it. Measured service is the aspect of a cloud where customers only pay for the services they are actually using, and for the duration of their use. Portabilty refers to the ease with which an application or service can be moved among different cloud providers. Bro","expth":"ด้วยการเช่าหลายราย ลูกค้าหลายรายจึงใช้ฮาร์ดแวร์และระบบทางกายภาพเดียวกัน ด้วยธรรมชาติของสภาพแวดล้อมคลาวด์และวิธีที่ระบบเขียนข้อมูลบนระบบที่หลากหลายซึ่งผู้อื่นใช้ร่วมกัน กระบวนการของ eDiscovery จึงมีความซับซ้อนมากขึ้น ผู้ดูแลระบบไม่สามารถดึงไดรฟ์จริงหรือแยกข้อมูลที่จะบันทึกได้อย่างง่ายดาย พวกเขาไม่เพียงแต่ต้องมุ่งเน้นไปที่ข้อมูลที่ต้องการรวบรวม ในขณะเดียวกันก็ให้แน่ใจว่าพวกเขาจะพบข้อมูลทั้งหมด แต่พวกเขายังต้องตรวจสอบให้แน่ใจด้วยว่าข้อมูลอื่น ๆ จะไม่ถูกรวบรวมและเปิดเผยไปพร้อมกับข้อมูลนั้นโดยไม่ได้ตั้งใจ บริการที่วัดผลคือลักษณะของคลาวด์ที่ลูกค้าชำระค่าบริการเฉพาะที่พวกเขาใช้จริงและตามระยะเวลาการใช้งานเท่านั้น การพกพาหมายถึงความง่ายในการเคลื่อนย้ายแอปพลิเคชันหรือบริการระหว่างผู้ให้บริการคลาวด์รายต่างๆ พี่ชาย"},{"id":262,"topic":1,"q":"Which of the following is the most crucial decision any company must make when considering cloud migration?","qth":"ข้อใดต่อไปนี้เป็นการตัดสินใจที่สำคัญที่สุดที่บริษัทต้องทำเมื่อพิจารณาการย้ายระบบคลาวด์","a":["Jurisdiction","Control","Security","Costs"],"ath":["เขตอำนาจศาล","การควบคุม","ความปลอดภัย","ต้นทุน"],"ans":"B","exp":"When leasing space in a data center versus utilizing cloud services, a customer has a much greater control over its systems and services, from both the hardware/ software perspective and the operational management perspective. Costs, regulations, and security are all prime considerations regardless of the hosting type selected. Although regulations will be the same in either hosting solution, in most instances, costs and security will be greater factors with leased space","expth":"เมื่อเช่าพื้นที่ในศูนย์ข้อมูลเทียบกับการใช้บริการคลาวด์ ลูกค้าจะสามารถควบคุมระบบและบริการของตนได้มากขึ้น จากทั้งมุมมองของฮาร์ดแวร์/ซอฟต์แวร์ และมุมมองการจัดการการปฏิบัติงาน ค่าใช้จ่าย กฎระเบียบ และความปลอดภัยล้วนเป็นข้อพิจารณาที่สำคัญโดยไม่คำนึงถึงประเภทโฮสติ้งที่เลือก แม้ว่ากฎเกณฑ์ในโซลูชันโฮสติ้งทั้งสองแบบจะเหมือนกัน แต่ในกรณีส่วนใหญ่ ต้นทุนและความปลอดภัยจะเป็นปัจจัยมากกว่าสำหรับพื้นที่เช่า"},{"id":263,"topic":1,"q":"Which of the following systems is used to employ a variety of different techniques to discover and alert on threats and potential threats to systems and networks? AIDS","qth":"ระบบใดต่อไปนี้ถูกใช้เพื่อใช้เทคนิคที่หลากหลายเพื่อค้นหาและแจ้งเตือนเกี่ยวกับภัยคุกคามและภัยคุกคามที่อาจเกิดขึ้นกับระบบและเครือข่าย เอดส์","a":["SIEM","IPS","Firewall","WAF"],"ath":["เสียม","ไอพีเอส","ไฟร์วอลล์","วัฟ"],"ans":"A","exp":"An intrusion detection system (IDS) is implemented to watch network traffic and operations, using predefined criteria or signatures, and alert administrators if anything suspect is found. An intrusion prevention system (IPS) is similar to an IDS but actually takes action against suspect traffic, whereas an IDS just alerts when it finds anything suspect. A firewall works at the network level and only takes into account IP addresses, ports, and protocols; it does not inspect the traffic for patterns or content. A web application firewall (WAF) works at the application layer and provides additional security via proxying, filtering service requests, or blocking based on additional factors such as the client and requests","expth":"ระบบตรวจจับการบุกรุก (IDS) ถูกนำมาใช้เพื่อเฝ้าดูการรับส่งข้อมูลเครือข่ายและการดำเนินงาน โดยใช้เกณฑ์หรือลายเซ็นที่กำหนดไว้ล่วงหน้า และแจ้งเตือนผู้ดูแลระบบหากพบสิ่งที่ต้องสงสัย ระบบป้องกันการบุกรุก (IPS) คล้ายกับ IDS แต่จริงๆ แล้วจะดำเนินการกับการรับส่งข้อมูลที่ต้องสงสัย ในขณะที่ IDS จะแจ้งเตือนเมื่อพบสิ่งที่ต้องสงสัย ไฟร์วอลล์ทำงานในระดับเครือข่ายและพิจารณาเฉพาะที่อยู่ IP พอร์ต และโปรโตคอลเท่านั้น มันไม่ได้ตรวจสอบปริมาณการใช้ข้อมูลสำหรับรูปแบบหรือเนื้อหา ไฟร์วอลล์แอปพลิเคชันเว็บ (WAF) ทำงานที่ชั้นแอปพลิเคชันและให้ความปลอดภัยเพิ่มเติมผ่านการพร็อกซี การกรองคำขอบริการ หรือการบล็อกตามปัจจัยเพิ่มเติม เช่น ไคลเอ็นต์และคำขอ"},{"id":264,"topic":1,"q":"Which of the following is not a risk management framework?","qth":"ข้อใดต่อไปนี้ไม่ใช่กรอบการบริหารความเสี่ยง","a":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"ath":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"ans":"B","exp":"Hex GBL is a reference to a computer part in Terry Pratchett's fictional Discworld universe. The rest are not","expth":"Hex GBL เป็นการอ้างอิงถึงชิ้นส่วนคอมพิวเตอร์ในจักรวาล Discworld ของ Terry Pratchett ส่วนที่เหลือไม่ได้"},{"id":265,"topic":1,"q":"In order to ensure ongoing compliance with regulatory requirements, which phase of the cloud data lifecycle must be tested regularly?","qth":"เพื่อให้มั่นใจว่าสอดคล้องกับข้อกำหนดด้านกฎระเบียบอย่างต่อเนื่อง ระยะใดของวงจรการใช้งานข้อมูลบนคลาวด์จะต้องได้รับการทดสอบเป็นประจำ","a":["Archive","Share","Store","Destroy"],"ath":["เก็บถาวร","แบ่งปัน","จัดเก็บ","ทำลาย"],"ans":"A","exp":"In order to ensure compliance with regulations, it is important for an organization to regularly test the restorability of archived data. As technologies change and older systems are deprecated, the risk rises for an organization to lose the ability to restore data from the format in which it is stored. With the destroy, store, and share phases, the currently used technologies will be sufficient for an organization's needs in an ongoing basis, so the risk that is elevated with archived data is not present","expth":"เพื่อให้มั่นใจว่าเป็นไปตามกฎระเบียบ เป็นสิ่งสำคัญสำหรับองค์กรในการทดสอบความสามารถในการกู้คืนของข้อมูลที่เก็บไว้เป็นประจำ เมื่อเทคโนโลยีเปลี่ยนแปลงและระบบเก่าๆ เลิกใช้งานแล้ว องค์กรจึงมีความเสี่ยงเพิ่มขึ้นที่จะสูญเสียความสามารถในการกู้คืนข้อมูลจากรูปแบบที่จัดเก็บไว้ ด้วยขั้นตอนการทำลาย จัดเก็บ และแบ่งปัน เทคโนโลยีที่ใช้อยู่ในปัจจุบันจะเพียงพอต่อความต้องการขององค์กรอย่างต่อเนื่อง ดังนั้นจึงไม่มีความเสี่ยงที่เพิ่มขึ้นจากข้อมูลที่จัดเก็บถาวร"},{"id":266,"topic":1,"q":"Which of the following threat types involves leveraging a user's browser to send untrusted data to be executed with legitimate access via the user's valid credentials?","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับการใช้ประโยชน์จากเบราว์เซอร์ของผู้ใช้เพื่อส่งข้อมูลที่ไม่น่าเชื่อถือเพื่อดำเนินการด้วยการเข้าถึงที่ถูกต้องผ่านข้อมูลประจำตัวที่ถูกต้องของผู้ใช้","a":["Injection","Missing function-level access control","Cross-site scripting","Cross-site request forgery Suggested Answ Explanation Cross-site scripting (XSS) is an attack where a malicious actor is able to send untrusted data to a user's browser without going through any validation or sanitization processes, or perhaps the code is not properly escaped from processing by the browser. The code is then executed on the user's browser with their own access and permissions, allowing the attacker to redirect the user's web traffic, steal data from their session, or potentially access information on the user's own computer that their browser has the ability to access. Missing function-level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call. An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part of its normal processing and queries. Cross-site request forgery occurs when an attack forces an authenticated user to send forged requests to an application running under their own access and credentials"],"ath":["การฉีด","ไม่มีการควบคุมการเข้าถึงระดับฟังก์ชัน","การเขียนสคริปต์ข้ามไซต์","การปลอมแปลงคำขอข้ามไซต์ คำตอบที่แนะนำ คำอธิบายการเขียนสคริปต์ข้ามไซต์ (XSS) เป็นการโจมตี โดยที่ผู้ประสงค์ร้ายสามารถส่งข้อมูลที่ไม่น่าเชื่อถือไปยังเบราว์เซอร์ของผู้ใช้โดยไม่ต้องผ่านกระบวนการตรวจสอบหรือฆ่าเชื้อใดๆ หรือบางทีโค้ดอาจไม่สามารถหลบหนีจากการประมวลผลโดยเบราว์เซอร์ได้อย่างเหมาะสม จากนั้นโค้ดจะถูกดำเนินการบนเบราว์เซอร์ของผู้ใช้ด้วยการเข้าถึงและการอนุญาตของตนเอง ทำให้ผู้โจมตีสามารถเปลี่ยนเส้นทางการรับส่งข้อมูลเว็บของผู้ใช้ ขโมยข้อมูลจากเซสชันของพวกเขา หรืออาจเข้าถึงข้อมูลบนคอมพิวเตอร์ของผู้ใช้เองที่เบราว์เซอร์ของพวกเขาสามารถเข้าถึงได้ การควบคุมการเข้าถึงระดับฟังก์ชันหายไปโดยที่แอปพลิเคชันตรวจสอบการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบเริ่มต้นเท่านั้น และไม่ได้ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การโจมตีแบบฉีดคือการที่ผู้ประสงค์ร้ายส่งคำสั่งหรือข้อมูลที่กำหนดเองอื่น ๆ ผ่านทางช่องป้อนข้อมูลและช่องข้อมูลโดยมีจุดประสงค์เพื่อให้แอปพลิเคชันหรือระบบดำเนินการโค้ดซึ่งเป็นส่วนหนึ่งของการประมวลผลและการสืบค้นตามปกติ การปลอมแปลงคำขอข้ามไซต์เกิดขึ้นเมื่อการโจมตีบังคับให้ผู้ใช้ที่ได้รับการรับรองความถูกต้องส่งคำขอปลอมไปยังแอปพลิเคชันที่ทำงานภายใต้การเข้าถึงและข้อมูลประจำตัวของตนเอง"],"ans":"C","exp":"","expth":""},{"id":267,"topic":1,"q":"Digital investigations have adopted many of the same methodologies and protocols as other types of criminal or scientific inquiries What term pertains to the application of scientific norms and protocols to digital investigations?","qth":"การสืบสวนทางดิจิทัลได้นำวิธีการและระเบียบวิธีเดียวกันกับการสอบถามทางอาญาหรือวิทยาศาสตร์ประเภทอื่นๆ คำศัพท์ใดที่เกี่ยวข้องกับการประยุกต์ใช้บรรทัดฐานและระเบียบวิธีทางวิทยาศาสตร์กับการสืบสวนทางดิจิทัล","a":["Scientific","Investigative","Methodological","Forensics"],"ath":["วิทยาศาสตร์","การสืบสวน","วิธีการ","นิติเวช"],"ans":"D","exp":"Forensics refers to the application of scientific methods and protocols to the investigation of crimes. Although forensics has traditionally been applied to well known criminal proceedings and investigations, the term equally applies to digital investigations and methods. Although the other answers provide similar sounding terms and ideas, none is the appropriate answer in this case","expth":"นิติเวช หมายถึงการประยุกต์ใช้วิธีการและระเบียบวิธีทางวิทยาศาสตร์ในการสืบสวนอาชญากรรม แม้ว่านิติเวชจะถูกนำมาใช้กับการดำเนินคดีและการสืบสวนคดีอาญาที่รู้จักกันดี แต่คำนี้ก็ใช้กับการสืบสวนและวิธีการทางดิจิทัลด้วยเช่นกัน แม้ว่าคำตอบอื่นๆ จะให้คำศัพท์และแนวคิดที่ฟังดูคล้ายกัน แต่ไม่มีคำตอบใดที่เหมาะสมในกรณีนี้"},{"id":268,"topic":1,"q":"Within a federated identity system, which entity accepts tokens from the identity provider?","qth":"ภายในระบบข้อมูลประจำตัวแบบรวมศูนย์ เอนทิตีใดยอมรับโทเค็นจากผู้ให้บริการข้อมูลระบุตัวตน","a":["Assertion manager","Servicing party","Proxy party","Relying party"],"ath":["ผู้จัดการการยืนยัน","ฝ่ายให้บริการ","ฝ่ายพร็อกซี","ฝ่ายที่อาศัย"],"ans":"D","exp":"The relying party is attached to the application or service that a user is trying to access, and it accepts authentication tokens from the user's own identity provider in order to facilitate authentication and access. The other terms provided are all associated with federated systems, but none is the correct choice in this case","expth":"ฝ่ายที่พึ่งพานั้นแนบอยู่กับแอปพลิเคชันหรือบริการที่ผู้ใช้พยายามเข้าถึง และยอมรับโทเค็นการตรวจสอบสิทธิ์จากผู้ให้บริการข้อมูลประจำตัวของผู้ใช้เอง เพื่ออำนวยความสะดวกในการตรวจสอบสิทธิ์และการเข้าถึง ข้อกำหนดอื่นๆ ที่ให้ไว้ทั้งหมดเกี่ยวข้องกับระบบรวม แต่ไม่มีตัวเลือกที่ถูกต้องในกรณีนี้"},{"id":269,"topic":1,"q":"Different types of audits are intended for different audiences, such as internal, external, regulatory, and so on. Which of the following audits are considered \"restricted use\" versus being for a more broad audience?","qth":"การตรวจสอบประเภทต่างๆ มีไว้สำหรับผู้ชมที่แตกต่างกัน เช่น ภายใน ภายนอก หน่วยงานกำกับดูแล และอื่นๆ การตรวจสอบใดต่อไปนี้ถือเป็น \"การใช้งานแบบจำกัด\" เทียบกับการตรวจสอบสำหรับผู้ชมในวงกว้างกว่า","a":["SOC Type 2","SOC Type1","SOC Type 3","SAS-70"],"ath":["SOC ประเภท 2","SOC ประเภทที่ 1","SOC ประเภท 3","SAS-70"],"ans":"B","exp":"SOC Type 1 reports are intended for restricted use, only to be seen by the actual service organization, its current clients, or its auditors. These reports are not intended for wider or public distribution. SAS-70 audit reports have been deprecated and are no longer in use, and both the SOC Type 2 and 3 reports are designed to expand upon the SOC Type 1 reports and are for broader audiences","expth":"รายงาน SOC ประเภท 1 มีไว้สำหรับการใช้งานแบบจำกัด เฉพาะองค์กรที่ให้บริการจริง ลูกค้าปัจจุบัน หรือผู้ตรวจสอบเท่านั้นที่สามารถเห็นได้ รายงานเหล่านี้ไม่ได้มีวัตถุประสงค์เพื่อการเผยแพร่ในวงกว้างหรือเผยแพร่สู่สาธารณะ รายงานการตรวจสอบ SAS-70 เลิกใช้แล้วและไม่มีการใช้งานอีกต่อไป และทั้งรายงาน SOC ประเภท 2 และ 3 ได้รับการออกแบบมาเพื่อขยายตามรายงาน SOC ประเภท 1 และมีไว้สำหรับผู้ชมในวงกว้าง"},{"id":270,"topic":1,"q":"Although host-based and network-based IDSs perform similar functions and have similar capabilities, which of the following is an advantage of a network-based IDS over a host-based IDS, assuming all capabilities are equal?","qth":"แม้ว่า IDS บนโฮสต์และบนเครือข่ายจะทำงานคล้ายกันและมีความสามารถคล้ายคลึงกัน ข้อใดต่อไปนี้เป็นข้อได้เปรียบของ IDS บนเครือข่ายเหนือ IDS บนโฮสต์ โดยสมมติว่าความสามารถทั้งหมดเท่ากัน","a":["Segregated from host systems","Network access","Scalability","External to system patching"],"ath":["แยกออกจากระบบโฮสต์","การเข้าถึงเครือข่าย","ความสามารถในการปรับขนาด","ภายนอกจากการแพตช์ระบบ"],"ans":"A","exp":"A network-based IDS has the advantage of being segregated from host systems, and as such, it would not be open to compromise in the same manner a host- based system would be. Although a network-based IDS would be external to system patching, this is not the best answer here because it is a minor concern compared to segregation due to possible host compromise. Scalability is also not the best answer because, although a network-based IDS does remove processing from the host system, itis not a primary security concern. Network access is not a consideration because both a host-based IDS and a network-based IDS would have access to network resources","expth":"IDS บนเครือข่ายมีข้อดีของการเป็น แยกออกจากระบบโฮสต์ และด้วยเหตุนี้ มันจะไม่เปิดให้ประนีประนอมในลักษณะเดียวกับระบบโฮสต์ แม้ว่า IDS บนเครือข่ายจะอยู่ภายนอกการแพตช์ระบบ แต่นี่ไม่ใช่คำตอบที่ดีที่สุด เนื่องจากเป็นปัญหาเล็กน้อยเมื่อเทียบกับการแยกส่วนเนื่องจากการประนีประนอมของโฮสต์ที่อาจเกิดขึ้น ความสามารถในการปรับขนาดไม่ใช่คำตอบที่ดีที่สุด เนื่องจากแม้ว่า IDS บนเครือข่ายจะลบการประมวลผลออกจากระบบโฮสต์ แต่ก็ไม่ใช่ข้อกังวลด้านความปลอดภัยหลัก การเข้าถึงเครือข่ายไม่ใช่สิ่งที่ต้องพิจารณา เนื่องจากทั้ง IDS บนโฮสต์และ IDS บนเครือข่ายจะสามารถเข้าถึงทรัพยากรเครือข่ายได้"},{"id":271,"topic":1,"q":"DNSSEC was designed to add a layer of security to the DNS protocol Which type of attack was the DNSSEC extension designed to mitigate?","qth":"DNSSEC ได้รับการออกแบบมาเพื่อเพิ่มชั้นความปลอดภัยให้กับโปรโตคอล DNS การโจมตีประเภทใดที่ส่วนขยาย DNSSEC ได้รับการออกแบบมาเพื่อบรรเทา","a":["Account hijacking","Snooping","Spoofing","Data exposure"],"ath":["การไฮแจ็กบัญชี","การสอดแนม","การปลอมแปลง","การเปิดเผยข้อมูล"],"ans":"C","exp":"DNSSEC is an extension to the regular DNS protocol that utilizes digital signing of DNS query results, which can be verified to come from an authoritative source. This verification mitigates the ability for a rogue DNS server to be used to spoof query results and to direct users to malicious sites. DNSSEC provides for the verification of the integrity of DNS queries. It does not provide any protection from snooping or data exposure. Although it may help lessen account hijacking by preventing users from being directed to rogue sites, it cannot by itself eliminate the possibility","expth":"DNSSEC เป็นส่วนขยายของโปรโตคอล DNS ปกติที่ใช้การลงนามแบบดิจิทัลของผลลัพธ์การสืบค้น DNS ซึ่งสามารถยืนยันได้ว่ามาจากแหล่งที่เชื่อถือได้ การตรวจสอบนี้ช่วยลดความสามารถของเซิร์ฟเวอร์ DNS ปลอมเพื่อใช้ในการปลอมแปลงผลการค้นหาและนำผู้ใช้ไปยังไซต์ที่เป็นอันตราย DNSSEC จัดให้มีการตรวจสอบความสมบูรณ์ของการสืบค้น DNS มันไม่ได้ให้การป้องกันใด ๆ จากการสอดแนมหรือการเปิดเผยข้อมูล แม้ว่าอาจช่วยลดการขโมยบัญชีโดยการป้องกันไม่ให้ผู้ใช้ถูกพาไปยังไซต์หลอกลวง แต่ก็ไม่สามารถขจัดความเป็นไปได้ได้ด้วยตัวเอง"},{"id":272,"topic":1,"q":"Which aspect of cloud computing pertains to cloud customers only paying for the resources and services they actually use?","qth":"ลักษณะใดของการประมวลผลแบบคลาวด์ที่เกี่ยวข้องกับลูกค้าระบบคลาวด์ที่ชำระค่าทรัพยากรและบริการที่พวกเขาใช้จริงเท่านั้น","a":["Metered service","Measured billing","Metered bling","Measured service"],"ath":["บริการแบบคิดค่าบริการตามปริมาณข้อมูล","การเรียกเก็บเงินแบบวัดผล","ค่าบริการแบบวัดปริมาณ","บริการแบบวัดค่า"],"ans":"D","exp":"Measured service is the aspect of cloud computing that pertains to cloud services and resources being billed in a metered way, based only on the level of consumption and duration of the cloud customer. Although they sound similar to the correct answer, none of the other choices is the actual cloud terminology,","expth":"บริการแบบวัดผลคือลักษณะของการประมวลผลแบบคลาวด์ที่เกี่ยวข้องกับบริการระบบคลาวด์และทรัพยากรที่ถูกเรียกเก็บเงินในลักษณะแบบวัดปริมาณ โดยขึ้นอยู่กับระดับการใช้งานและระยะเวลาของระบบคลาวด์เท่านั้น ลูกค้า แม้ว่าจะฟังดูคล้ายกับคำตอบที่ถูกต้อง แต่ไม่มีตัวเลือกอื่นใดที่เป็นคำศัพท์เกี่ยวกับระบบคลาวด์ที่แท้จริง"},{"id":273,"topic":1,"q":"Many of the traditional concepts of systems and services for a traditional data center also apply to the cloud. Both are built around key computing concepts. Which of the following compromise the two facets of computing?","qth":"แนวคิดดั้งเดิมหลายประการเกี่ยวกับระบบและบริการสำหรับศูนย์ข้อมูลแบบเดิมยังนำไปใช้กับระบบคลาวด์ด้วย ทั้งสองถูกสร้างขึ้นตามแนวคิดการประมวลผลที่สำคัญ ข้อใดต่อไปนี้กระทบต่อสองแง่มุมของการประมวลผล","a":["CPU and software","CPU and storage","CPU and memory","Memory and networking"],"ath":["ซีพียูและซอฟต์แวร์","CPU และที่เก็บข้อมูล","ซีพียูและหน่วยความจำ","หน่วยความจำและเครือข่าย"],"ans":"C","exp":"The CPU and memory resources of an environment together comprise its \"computing\" resources. Cloud environments, especially public clouds, are enormous pools of resources for computing and are typically divided among a large number of customers with constantly changing needs and demands. Although storage and networking are core components of a cloud environment, they do not comprise its computing core. Software, much like within a traditional data center, is highly subjective based on the application, system, service, or cloud computing model used; however, it is not one of the core cloud components","expth":"ทรัพยากร CPU และหน่วยความจำของสภาพแวดล้อมรวมกันประกอบด้วยทรัพยากร \"คอมพิวเตอร์\" สภาพแวดล้อมคลาวด์ โดยเฉพาะคลาวด์สาธารณะ เป็นแหล่งรวมทรัพยากรจำนวนมหาศาลสำหรับการประมวลผล และโดยทั่วไปจะถูกแบ่งออกตามลูกค้าจำนวนมากซึ่งมีความต้องการและความต้องการที่เปลี่ยนแปลงอยู่ตลอดเวลา แม้ว่าการจัดเก็บข้อมูลและเครือข่ายจะเป็นองค์ประกอบหลักของสภาพแวดล้อมระบบคลาวด์ แต่ก็ไม่ได้ประกอบด้วยแกนประมวลผล ซอฟต์แวร์นั้นเหมือนกับภายในศูนย์ข้อมูลแบบดั้งเดิม จะขึ้นอยู่กับแอปพลิเคชัน ระบบ บริการ หรือโมเดลการประมวลผลแบบคลาวด์ที่ใช้ อย่างไรก็ตาม นี่ไม่ใช่องค์ประกอบหลักของระบบคลาวด์"},{"id":274,"topic":1,"q":"With a cloud service category where the cloud customer is provided a full application framework into which to deploy their code and services, which storage types are MOST likely to be available to them?","qth":"ด้วยหมวดหมู่บริการคลาวด์ที่ลูกค้าคลาวด์ได้รับมอบเฟรมเวิร์กแอปพลิเคชันเต็มรูปแบบเพื่อปรับใช้โค้ดและบริการของตน พื้นที่จัดเก็บข้อมูลประเภทใดที่มีแนวโน้มมากที่สุดสำหรับพวกเขา","a":["Structured and unstructured","Structured and hierarchical","Volume and database","Volume and object"],"ath":["มีโครงสร้างและไม่มีโครงสร้าง","มีโครงสร้างและลำดับชั้น","ปริมาณและฐานข้อมูล","ปริมาณและวัตถุ"],"ans":"A","exp":"The question is describing the Platform as a Service (PaaS) cloud offering, and as such, structured and unstructured storage types will be available to the customer. Volume and object are storage types associated with laaS, and although the other answers present similar-sounding storage types, they are a mix of real and fake names","expth":"คำถามกำลังอธิบายแพลตฟอร์มในรูปแบบบริการคลาวด์ (PaaS) และด้วยเหตุนี้ ประเภทพื้นที่จัดเก็บข้อมูลที่มีโครงสร้างและไม่มีโครงสร้างจึงจะพร้อมใช้งานสำหรับลูกค้า ปริมาตรและอ็อบเจ็กต์เป็นประเภทการจัดเก็บข้อมูลที่เกี่ยวข้องกับ laaS และแม้ว่าคำตอบอื่น ๆ จะแสดงประเภทการจัดเก็บข้อมูลที่ฟังดูคล้ายกัน แต่เป็นชื่อจริงและชื่อปลอมผสมกัน"},{"id":275,"topic":1,"q":"Firewalls are used to provide network security throughout an enterprise and to control what information can be accessed--and to a certain extent, through what means. Which of the following is NOT something that firewalls are concerned with?","qth":"ไฟร์วอลล์ใช้เพื่อรักษาความปลอดภัยเครือข่ายทั่วทั้งองค์กร และเพื่อควบคุมข้อมูลที่สามารถเข้าถึงได้ และในระดับหนึ่ง ผ่านช่องทางใด ข้อใดต่อไปนี้ไม่ใช่สิ่งที่ไฟร์วอลล์เกี่ยวข้อง","a":["IP address","Encryption","Port","Protocol"],"ath":["ที่อยู่ IP","การเข้ารหัส","พอร์ต","โปรโตคอล"],"ans":"B","exp":"Firewalls work at the network level and control traffic based on the source, destination, protocol, and ports. Whether or not the traffic is encrypted is not a factor with firewalls and their decisions about routing traffic. Firewalls work primarily with IP addresses, ports, and protocols","expth":"ไฟร์วอลล์ทำงานในระดับเครือข่ายและควบคุมการรับส่งข้อมูลตามต้นทาง ปลายทาง โปรโตคอล และพอร์ต การที่การรับส่งข้อมูลจะถูกเข้ารหัสหรือไม่นั้นไม่ใช่ปัจจัยของไฟร์วอลล์และการตัดสินใจเกี่ยวกับการกำหนดเส้นทางการรับส่งข้อมูล ไฟร์วอลล์ทำงานกับที่อยู่ IP พอร์ต และโปรโตคอลเป็นหลัก"},{"id":276,"topic":1,"q":"Within an laaS implementation, which of the following would NOT be a metric used to quantify service charges for the cloud customer?","qth":"ภายในการใช้งาน laaS ข้อใดต่อไปนี้ที่จะไม่เป็นตัววัดที่ใช้ในการวัดปริมาณค่าบริการสำหรับลูกค้าคลาวด์","a":["Memory","Number of users","Storage","CPU"],"ath":["หน่วยความจำ","จำนวนผู้ใช้","พื้นที่เก็บข้อมูล","CPU"],"ans":"B","exp":"Within laaS, where the cloud customer is responsible for everything beyond the physical network, the number of users on a system would not be a factor in billing or service charges. The core cloud services for laaS are based on the memory, storage, and CPU requirements of the cloud customer. Because the cloud customer with laaS is responsible for its own images and deployments, these components comprise the basis of its cloud provisioning and measured services billing","expth":"ภายใน laaS ซึ่งลูกค้าคลาวด์รับผิดชอบทุกอย่างนอกเหนือจากเครือข่ายทางกายภาพ จำนวนผู้ใช้ในระบบจะไม่เป็นปัจจัยในการเรียกเก็บเงินหรือค่าบริการ บริการคลาวด์หลักสำหรับ laaS ขึ้นอยู่กับข้อกำหนดของหน่วยความจำ พื้นที่จัดเก็บ และ CPU ของลูกค้าคลาวด์ เนื่องจากลูกค้าระบบคลาวด์ที่มี laaS มีหน้าที่รับผิดชอบด้านอิมเมจและการปรับใช้ของตนเอง ส่วนประกอบเหล่านี้จึงประกอบด้วยพื้นฐานของการจัดเตรียมระบบคลาวด์และการเรียกเก็บเงินบริการที่วัดผล"},{"id":277,"topic":1,"q":"Many different common threats exist against web-exposed services and applications. One attack involves attempting to leverage input fields to execute queries in a nested fashion that is unintended by the developers What type of attack is this?","qth":"มีภัยคุกคามทั่วไปที่แตกต่างกันมากมายต่อบริการและแอปพลิเคชันที่เปิดบนเว็บ การโจมตีครั้งหนึ่งเกี่ยวข้องกับการพยายามใช้ประโยชน์จากฟิลด์อินพุตเพื่อดำเนินการค้นหาในลักษณะที่ซ้อนกันซึ่งนักพัฒนาไม่ได้ตั้งใจ การโจมตีประเภทนี้คืออะไร?","a":["Injection","Missing function-level access control","Cross-site scripting","Cross-site request forgery"],"ath":["การฉีด","ไม่มีการควบคุมการเข้าถึงระดับฟังก์ชัน","การเขียนสคริปต์ข้ามไซต์","การปลอมแปลงคำขอข้ามไซต์"],"ans":"A","exp":"An injection attack is where a malicious actor sends commands or other arbitrary data through input and data fields with the intent of having the application or system execute the code as part of its normal processing and queries. This can trick an application into exposing data that is not intended or authorized to be exposed, or it can potentially allow an attacker to gain insight into configurations or security controls. Missing function-level access control exists where an application only checks for authorization during the initial login process and does not further validate with each function call, Cross-site request forgery occurs when an attack forces an authenticated user to send forged requests to an application running under their own access and credentials. Cross-site scripting","expth":"การโจมตีแบบฉีดคือการที่ผู้ประสงค์ร้ายส่งคำสั่งหรือข้อมูลที่กำหนดเองอื่น ๆ ผ่านทางช่องป้อนข้อมูลและช่องข้อมูลโดยมีจุดประสงค์เพื่อให้แอปพลิเคชันหรือระบบดำเนินการโค้ดซึ่งเป็นส่วนหนึ่งของการประมวลผลและการสืบค้นตามปกติ วิธีนี้สามารถหลอกให้แอปพลิเคชันเปิดเผยข้อมูลที่ไม่ได้ตั้งใจหรือได้รับอนุญาตให้เปิดเผย หรืออาจทำให้ผู้โจมตีได้รับข้อมูลเชิงลึกเกี่ยวกับการกำหนดค่าหรือการควบคุมความปลอดภัย การควบคุมการเข้าถึงระดับฟังก์ชันหายไปซึ่งแอปพลิเคชันตรวจสอบเฉพาะการอนุญาตในระหว่างกระบวนการเข้าสู่ระบบครั้งแรก และไม่ตรวจสอบเพิ่มเติมด้วยการเรียกใช้ฟังก์ชันแต่ละครั้ง การปลอมแปลงคำขอข้ามไซต์เกิดขึ้นเมื่อการโจมตีบังคับให้ผู้ใช้ที่ได้รับการรับรองความถูกต้องส่งคำขอปลอมไปยังแอปพลิเคชันที่ทำงานภายใต้การเข้าถึงและข้อมูลประจำตัวของตนเอง การเขียนสคริปต์ข้ามไซต์"},{"id":278,"topic":1,"q":"For service provisioning and support, what is the i","qth":"สำหรับการจัดเตรียมบริการและการสนับสนุน อะไรคือ i","a":["Half","Full","Minimal","Depends on the contract"],"ath":["ครึ่ง","เต็ม","ขั้นต่ำ","ขึ้นอยู่กับสัญญา"],"ans":"C","exp":"The goal with any cloud-hosting setup is for the cloud customer to be able to perform most or allits functions for service provisioning and configuration without any need for support from or interaction with the cloud provider beyond the automated tools provided. To fulfil the tenants of on-demand self-service, required interaction with the cloud provider--either half time, full ime, or a commensurate amount of time based on the contract--would be in opposition to a cloud's intended use. As such, ‘these answers are incorrect","expth":"เป้าหมายในการตั้งค่าโฮสติ้งบนคลาวด์คือเพื่อให้ลูกค้าระบบคลาวด์สามารถดำเนินการฟังก์ชันส่วนใหญ่หรือทั้งหมดสำหรับการจัดเตรียมบริการและการกำหนดค่า โดยไม่จำเป็นต้องได้รับความช่วยเหลือจากหรือโต้ตอบกับผู้ให้บริการคลาวด์ นอกเหนือจากเครื่องมืออัตโนมัติที่มีให้ เพื่อเติมเต็มความต้องการของผู้เช่าบริการตนเองตามความต้องการ การโต้ตอบที่จำเป็นกับผู้ให้บริการคลาวด์ ไม่ว่าจะเป็นครึ่งเวลา เต็มเวลา หรือระยะเวลาที่เหมาะสมตามสัญญา จะขัดแย้งกับการใช้งานตามวัตถุประสงค์ของคลาวด์ ด้วยเหตุนี้ 'คำตอบเหล่านี้จึงไม่ถูกต้อง'"},{"id":279,"topic":1,"q":"What does a cloud customer purchase or obtain from a cloud provider?","qth":"ลูกค้าระบบคลาวด์ซื้อหรือรับอะไรจากผู้ให้บริการระบบคลาวด์","a":["Services","Hosting","Servers","Customers"],"ath":["บริการ","โฮสติ้ง","เซิร์ฟเวอร์","ลูกค้า"],"ans":"D","exp":"No matter what form they come in, 'services\" are obtained or purchased by a cloud customer from a cloud service provider. Services can come in many forms— virtual machines, network configurations, hosting setups, and software access, just to name a few. Hosting and servers-or, with a cloud, more appropriately virtual machines-are just two examples of \"services\" that a customer would purchase from a cloud provider. \"Customers\" would never be a service that's purchased","expth":"ไม่ว่าลูกค้าจะอยู่ในรูปแบบใด ลูกค้าระบบคลาวด์จะได้รับหรือซื้อ 'บริการ' จากผู้ให้บริการระบบคลาวด์ บริการต่างๆ มีอยู่หลายรูปแบบ เช่น เครื่องเสมือน การกำหนดค่าเครือข่าย การตั้งค่าโฮสติ้ง และการเข้าถึงซอฟต์แวร์ และอื่นๆ อีกมากมาย โฮสติ้งและ เซิร์ฟเวอร์หรือเครื่องเสมือนที่เหมาะสมกว่ากับคลาวด์เป็นเพียงสองตัวอย่างของ \"บริการ\" ที่ลูกค้าจะซื้อจากผู้ให้บริการคลาวด์ \"ลูกค้า\" จะไม่มีวันเป็นบริการที่ซื้อ"},{"id":280,"topic":1,"q":"Which phase of the cloud data lifecycle represents the first instance where security controls can be implemented?","qth":"ระยะใดของวงจรชีวิตข้อมูลบนคลาวด์แสดงถึงอินสแตนซ์แรกที่สามารถใช้การควบคุมความปลอดภัยได้","a":["Use","Share","Store","Create (EEN)"],"ath":["ใช้","แบ่งปัน","ร้านค้า","สร้าง (EEN)"],"ans":"C","exp":"The store phase occurs immediately after the create phase, and as data is committed to storage structures, the first opportunity for security controls to be implemented is realized, During the create phase, the data is not yet part of a system where security controls can be applied, and although the use and share phases also entail the application of security controls, they are not the first phase where the process occurs","expth":"ระยะการจัดเก็บเกิดขึ้นทันทีหลังจากขั้นตอนการสร้าง และเนื่องจากข้อมูลถูกส่งไปยังโครงสร้างการจัดเก็บข้อมูล โอกาสแรกสำหรับการควบคุมความปลอดภัยที่จะนำไปใช้จึงเกิดขึ้น ในระหว่างขั้นตอนการสร้าง ข้อมูลยังไม่ได้เป็นส่วนหนึ่งของระบบที่สามารถควบคุมความปลอดภัยได้ นำไปใช้ และแม้ว่าขั้นตอนการใช้และการแบ่งปันยังต้องนำมาประยุกต์ใช้การควบคุมความปลอดภัยด้วย แต่ก็ไม่ใช่ระยะแรกที่กระบวนการเกิดขึ้น"},{"id":281,"topic":1,"q":"You were recently hired as a project manager at a major university to implement cloud services for the academic and administrative systems. Because the load and demand for services at a university are very cyclical in nature, commensurate with the academic calendar, which of the following aspects of cloud computing would NOT be a primary benefit to you?","qth":"เมื่อเร็วๆ นี้คุณได้รับการว่าจ้างให้เป็นผู้จัดการโครงการในมหาวิทยาลัยใหญ่แห่งหนึ่งเพื่อใช้บริการคลาวด์สำหรับระบบวิชาการและการบริหาร เนื่องจากภาระงานและความต้องการบริการในมหาวิทยาลัยมีลักษณะเป็นวัฏจักรอย่างมาก ซึ่งสอดคล้องกับปฏิทินการศึกษา ด้านใดต่อไปนี้ของการประมวลผลแบบคลาวด์จะไม่เป็นประโยชน์หลักสำหรับคุณ","a":["Measured service","Broad network access","Resource pooling","On-demand self-service"],"ath":["บริการวัดผล","การเข้าถึงเครือข่ายในวงกว้าง","การรวมทรัพยากร","บริการตนเองตามความต้องการ"],"ans":"B","exp":"Broad network access to cloud services, although it is an integral aspect of cloud computing, would not being a specific benefit to an organization with cyclical business needs. The other options would allow for lower costs during periods of low usage as well as provide the ability to expand services quickly and easily when needed for peak periods. Measured service allows a cloud customerto only use the resources it needs at the time, and resource pooling allows a cloud customerto access resources as needed. On-demand self-service enables the cloud customerto change its provisioned resources on its own, without the need to interact with the staff from the cloud provider","expth":"การเข้าถึงบริการคลาวด์ผ่านเครือข่ายในวงกว้าง แม้ว่าจะเป็นส่วนสำคัญของการประมวลผลแบบคลาวด์ แต่ก็ไม่ได้เป็นประโยชน์เฉพาะสำหรับองค์กรที่มีความต้องการทางธุรกิจแบบวนรอบ ตัวเลือกอื่นๆ จะช่วยให้ต้นทุนลดลงในช่วงเวลาที่มีการใช้งานน้อย พร้อมทั้งให้ความสามารถในการขยายบริการได้อย่างรวดเร็วและง่ายดายเมื่อจำเป็นในช่วงเวลาเร่งด่วน บริการที่วัดผลช่วยให้ลูกค้าระบบคลาวด์ใช้เฉพาะทรัพยากรที่ต้องการในขณะนั้นเท่านั้น และการรวมทรัพยากรช่วยให้ลูกค้าระบบคลาวด์สามารถเข้าถึงทรัพยากรได้ตามต้องการ การบริการตนเองตามความต้องการช่วยให้ลูกค้าระบบคลาวด์สามารถเปลี่ยนทรัพยากรที่จัดเตรียมไว้ได้ด้วยตัวเอง โดยไม่จำเป็นต้องโต้ตอบกับเจ้าหน้าที่จากผู้ให้บริการระบบคลาวด์"},{"id":282,"topic":1,"q":"Which cloud deployment model is MOST likely to offer free or very cheap services to users?","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดมีแนวโน้มที่จะเสนอบริการฟรีหรือราคาถูกมากแก่ผู้ใช้มากที่สุด","a":["Hybrid","Community","Public","Private"],"ath":["ไฮบริด","ชุมชน","สาธารณะ","ส่วนตัว"],"ans":"C","exp":"Public clouds offer services to anyone, regardless of affiliation, and are the most likely to offer free services to users. Examples of public clouds with free services include iCloud, Dropbox, and OneDrive. Private cloud models are designed for specific customers and for their needs, and would not offer services to the public at large, for free or otherwise. A community cloud is specific to a group of similar organizations and would not offer free or widely available public services. A hybrid cloud model would not fit the specifics of the question","expth":"ระบบคลาวด์สาธารณะเสนอบริการแก่ทุกคน โดยไม่คำนึงถึงความเกี่ยวข้อง และมีแนวโน้มมากที่สุดที่จะเสนอบริการฟรีแก่ผู้ใช้ ตัวอย่างของคลาวด์สาธารณะพร้อมบริการฟรี ได้แก่ iCloud, Dropbox และ OneDrive โมเดลคลาวด์ส่วนตัวได้รับการออกแบบมาสำหรับลูกค้าเฉพาะเจาะจงและตามความต้องการของลูกค้า และจะไม่ให้บริการแก่สาธารณะในวงกว้าง โดยไม่เสียค่าใช้จ่ายหรืออื่นๆ คลาวด์ชุมชนมีไว้สำหรับกลุ่มขององค์กรที่คล้ายกันโดยเฉพาะ และจะไม่เสนอบริการสาธารณะฟรีหรือใช้ได้อย่างกว้างขวาง โมเดลคลาวด์แบบไฮบริดไม่ตรงกับคำถามเฉพาะเจาะจง"},{"id":283,"topic":1,"q":"Where is a DLP solution generally installed when utilized for monitoring data in transit?","qth":"โดยทั่วไปโซลูชัน DLP จะติดตั้งไว้ที่ใดเมื่อใช้สำหรับการตรวจสอบข้อมูลระหว่างทาง","a":["Network perimeter","Database server","Application server","Web server"],"ath":["ขอบเขตเครือข่าย","เซิร์ฟเวอร์ฐานข้อมูล","เซิร์ฟเวอร์แอปพลิเคชัน","เว็บเซิร์ฟเวอร์"],"ans":"D","exp":"To monitor data in transit, a DLP solution would optimally be installed at the network perimeter, to ensure that data leaving the network through various protocols, conforms to security controls and policies. An application server or a web server would be more appropriate for monitoring data in use, and a database server would be an example of a location appropriate for monitoring data at rest","expth":"ในการตรวจสอบข้อมูลระหว่างทาง โซลูชัน DLP จะได้รับการติดตั้งอย่างเหมาะสมที่ขอบเขตเครือข่าย เพื่อให้แน่ใจว่าข้อมูลที่ออกจากเครือข่ายผ่านโปรโตคอลต่างๆ สอดคล้องกับการควบคุมความปลอดภัยและนโยบาย แอปพลิเคชันเซิร์ฟเวอร์หรือเว็บเซิร์ฟเวอร์จะเหมาะสมกว่าสำหรับการตรวจสอบข้อมูลที่ใช้งานอยู่ และเซิร์ฟเวอร์ฐานข้อมูลจะเป็นตัวอย่างของตำแหน่งที่เหมาะสมสำหรับการตรวจสอบข้อมูลที่เหลือ"},{"id":284,"topic":1,"q":"With laaS, what is responsible for handling the security and control over the volume storage space?","qth":"เมื่อใช้ laaS อะไรมีหน้าที่รับผิดชอบในการจัดการความปลอดภัยและการควบคุมพื้นที่จัดเก็บข้อมูลโวลุ่ม?","a":["Management plane","Operating system","Application","Hypervisor"],"ath":["ระนาบการจัดการ","ระบบปฏิบัติการ","แอปพลิเคชัน","Hypervisor"],"ans":"B","exp":"Volume storage is allocated via a LUN to a system and then treated the same as any traditional storage. The operating system is responsible for formatting and securing Volume storage as well as controlling all access to it. Applications, although they may use volume storage and have permissions to write to it, are not responsible for its formatting and security. Both a hypervisor and the management plane are outside of an individual system and are not responsible for managing the files and storage within that system","expth":"พื้นที่จัดเก็บไดรฟ์ข้อมูลจะถูกจัดสรรผ่าน LUN ให้กับระบบ จากนั้นจึงปฏิบัติเช่นเดียวกับที่จัดเก็บข้อมูลแบบดั้งเดิม ระบบปฏิบัติการมีหน้าที่รับผิดชอบในการจัดรูปแบบและรักษาความปลอดภัยที่จัดเก็บข้อมูล Volume รวมถึงควบคุมการเข้าถึงทั้งหมด แอปพลิเคชัน แม้ว่าอาจใช้พื้นที่จัดเก็บข้อมูลโวลุ่มและมีสิทธิ์ในการเขียนข้อมูล แต่ก็จะไม่รับผิดชอบต่อการจัดรูปแบบและความปลอดภัยของแอปพลิเคชัน ทั้งไฮเปอร์ไวเซอร์และระนาบการจัดการอยู่นอกระบบแต่ละระบบ และไม่รับผิดชอบในการจัดการไฟล์และพื้นที่เก็บข้อมูลภายในระบบนั้น"},{"id":285,"topic":1,"q":"Configurations and policies for a system can come from a variety of sources and take a variety of formats. Which concept pertains to the application of a set of configurations and policies that is applied to all systems or a class of systems?","qth":"การกำหนดค่าและนโยบายสำหรับระบบอาจมาจากแหล่งที่มาที่หลากหลายและมีรูปแบบที่หลากหลาย แนวคิดใดที่เกี่ยวข้องกับการประยุกต์ใช้ชุดการกำหนดค่าและนโยบายที่ใช้กับทุกระบบหรือคลาสของระบบ","a":["Hardening","Leveling","Baselines","Standards"],"ath":["การแข็งตัว","การปรับระดับ","เส้นพื้นฐาน","มาตรฐาน"],"ans":"C","exp":"Baselines are a set of configurations and policies applied to all new systems or services, and they serve as the basis for deploying any other services on top of them. Although standards often form the basis for baselines, the term is applicable in this case. Hardening is the process of securing a system, often through the application of baselines. Levelingis an extraneous but similar term to baselining","expth":"เส้นพื้นฐานคือชุดของการกำหนดค่าและนโยบายที่ใช้กับระบบหรือบริการใหม่ทั้งหมด และทำหน้าที่เป็นพื้นฐานสำหรับการปรับใช้บริการอื่นใดที่นอกเหนือไปจากนั้น แม้ว่ามาตรฐานมักจะเป็นพื้นฐานสำหรับเส้นพื้นฐาน แต่คำนี้ก็สามารถนำไปใช้ได้ในกรณีนี้ การชุบแข็งเป็นกระบวนการรักษาความปลอดภัยของระบบ บ่อยครั้งผ่านการประยุกต์ใช้พื้นฐาน การปรับระดับเป็นคำที่ไม่เกี่ยวข้องแต่คล้ายกับการปรับระดับพื้นฐาน"},{"id":286,"topic":1,"q":"Which of the following tasks within a SaaS environment would NOT be something the cloud customer would be responsible for?","qth":"งานใดต่อไปนี้ภายในสภาพแวดล้อม SaaS จะไม่เป็นสิ่งที่ลูกค้าระบบคลาวด์จะต้องรับผิดชอบ","a":["Authentication mechanism","Branding","Training","User access"],"ath":["กลไกการตรวจสอบสิทธิ์","การสร้างแบรนด์","การฝึกอบรม","การเข้าถึงของผู้ใช้"],"ans":"A","exp":"The authentication mechanisms and implementations are the responsibility of the cloud provider because they are core components of the application platform and service. Within a SaaS implementation, the cloud customer will provision user access, deploy branding to the application interface (typically), and provide or procure training for its users","expth":"กลไกการตรวจสอบสิทธิ์และการนำไปใช้งานเป็นความรับผิดชอบของผู้ให้บริการระบบคลาวด์ เนื่องจากเป็นองค์ประกอบหลักของแพลตฟอร์มแอปพลิเคชันและบริการ ภายในการใช้งาน SaaS ลูกค้าคลาวด์จะจัดเตรียมการเข้าถึงของผู้ใช้ ปรับใช้การสร้างแบรนด์ให้กับอินเทอร์เฟซแอปพลิเคชัน (โดยทั่วไป) และจัดเตรียมหรือจัดหาการฝึกอบรมสำหรับผู้ใช้"},{"id":287,"topic":1,"q":"An SLA contains the official requirements for contract performance and satisfaction between the cloud provider and cloud customer. Which of the following would NOT be a component with measurable metrics and requirements as part of an SLA?","qth":"SLA ประกอบด้วยข้อกำหนดอย่างเป็นทางการสำหรับการปฏิบัติตามสัญญาและความพึงพอใจระหว่างผู้ให้บริการระบบคลาวด์และลูกค้าระบบคลาวด์ ข้อใดต่อไปนี้จะไม่เป็นองค์ประกอบที่มีหน่วยวัดและข้อกำหนดที่สามารถวัดผลได้ซึ่งเป็นส่วนหนึ่งของ SLA","a":["Network","Users","Memory","CPU"],"ath":["เครือข่าย","ผู้ใช้","หน่วยความจำ","ซีพียู"],"ans":"B","exp":"Dealing with users or user access would not be an appropriate item for inclusion in an SLA specifically. However, user access and user experience would be covered indirectly through other metrics. Memory, CPU, and network resources are all typically included within an SLA for availability and response times when dealing with any incidents","expth":"การจัดการกับผู้ใช้หรือการเข้าถึงของผู้ใช้จะไม่ใช่รายการที่เหมาะสมสำหรับการรวมไว้ใน SLA โดยเฉพาะ อย่างไรก็ตาม การเข้าถึงของผู้ใช้และประสบการณ์ของผู้ใช้จะครอบคลุมโดยอ้อมผ่านตัวชี้วัดอื่นๆ โดยทั่วไปทรัพยากรหน่วยความจำ CPU และเครือข่ายทั้งหมดจะรวมอยู่ใน SLA สำหรับความพร้อมใช้งานและเวลาตอบสนองเมื่อจัดการกับเหตุการณ์ใดๆ"},{"id":288,"topic":1,"q":"Within a federated identity system, which of the following would you be MOST likely to use for sending information for consumption by a relying party?","qth":"ภายในระบบการระบุตัวตนแบบรวมศูนย์ ข้อใดต่อไปนี้ที่คุณมีแนวโน้มที่จะใช้มากที่สุดในการส่งข้อมูลสำหรับการใช้งานโดยฝ่ายที่เกี่ยวข้อง?","a":["XML","HTML","WS-Federation","SAML"],"ath":["XML","HTML","WS-Federation","SAML"],"ans":"D","exp":"The Security Assertion Markup Language (SAML) is the most widely used method for encoding and sending attributes and other information from an identity provider to a relying party. WS-Federation, which is used by Active Directory Federation Services (ADFS), is the second most used method for sending information to a relying party, but it is not a better choice than SAML. XML is similar to SAML in the way it encodes and labels data, but it does not have all of the required extensions that SAML does. HTML is not used within federated systems at all","expth":"Security Assertion Markup Language (SAML) เป็นวิธีที่ใช้กันอย่างแพร่หลายมากที่สุดในการเข้ารหัสและส่งแอตทริบิวต์และข้อมูลอื่น ๆ จากผู้ให้บริการข้อมูลประจำตัวไปยังฝ่ายที่เกี่ยวข้อง WS-Federation ซึ่งใช้โดย Active Directory Federation Services (ADFS) เป็นวิธีที่ใช้มากเป็นอันดับสองในการส่งข้อมูลไปยังฝ่ายที่เกี่ยวข้อง แต่ก็ไม่ใช่ตัวเลือกที่ดีไปกว่า SAML XML มีลักษณะคล้ายกับ SAML ในด้านการเข้ารหัสและติดป้ายกำกับข้อมูล แต่ไม่มีส่วนขยายที่จำเป็นทั้งหมดเหมือนกับที่ SAML มี HTML ไม่ได้ใช้ภายในระบบรวมเลย"},{"id":289,"topic":1,"q":"Which data state would be most likely to use digital signatures as a security protection mechanism?","qth":"สถานะข้อมูลใดมีแนวโน้มที่จะใช้ลายเซ็นดิจิทัลเป็นกลไกการป้องกันความปลอดภัยมากที่สุด","a":["Data in use","Data in transit","Archived","Data at rest"],"ath":["ข้อมูลที่ใช้งาน","ข้อมูลระหว่างทาง","เก็บถาวร","ข้อมูลที่เหลือ"],"ans":"A","exp":"During the data-in-use state, the information has already been accessed from storage and transmitted to the service, so reliance on a technology such as digital signatures is imperative to ensure security and complement the security methods used during previous states. Data in transit relies on technologies such as TLS to encrypt network transmission of packets for security. Data at rest primarily uses encryption for stored file objects. Archived data would be the same as data at rest","expth":"ในระหว่างสถานะข้อมูลที่ใช้งานอยู่ ข้อมูลมีการเข้าถึงแล้วจากที่เก็บข้อมูลและส่งไปยังบริการ ดังนั้นการพึ่งพาเทคโนโลยี เช่น ลายเซ็นดิจิทัลจึงเป็นสิ่งจำเป็นเพื่อให้มั่นใจในความปลอดภัยและเสริมวิธีการรักษาความปลอดภัยที่ใช้ในระหว่างนั้น รัฐก่อนหน้า ข้อมูลระหว่างทางอาศัยเทคโนโลยี เช่น TLS เพื่อเข้ารหัสการส่งแพ็กเก็ตเครือข่ายเพื่อความปลอดภัย ข้อมูลที่เหลือใช้การเข้ารหัสสำหรับออบเจ็กต์ไฟล์ที่จัดเก็บเป็นหลัก ข้อมูลที่เก็บถาวรจะเหมือนกับข้อมูลที่เหลือ"},{"id":290,"topic":1,"q":"There is a large gap between the privacy laws of the United States and those of the European Union. Bridging this gap is necessary for American companies to do business with European companies and in European markets in many situations, as the American companies are required to comply with the stricter requirements. Which US program was designed to help companies overcome these differences?","qth":"มีช่องว่างขนาดใหญ่ระหว่างกฎหมายความเป็นส่วนตัวของสหรัฐอเมริกาและของสหภาพยุโรป การเชื่อมช่องว่างนี้เป็นสิ่งจำเป็นสำหรับบริษัทอเมริกันในการทำธุรกิจกับบริษัทในยุโรปและในตลาดยุโรปในหลาย ๆ สถานการณ์ เนื่องจากบริษัทอเมริกันจะต้องปฏิบัติตามข้อกำหนดที่เข้มงวดมากขึ้น โปรแกรมใดของสหรัฐอเมริกาที่ได้รับการออกแบบมาเพื่อช่วยให้บริษัทต่างๆ เอาชนะความแตกต่างเหล่านี้","a":["SOX","HIPAA","GLBA","Safe Harbor"],"ath":["SOX","HIPAA","GLBA","Safe Harbor"],"ans":"D","exp":"The Safe Harbor regulations were developed by the Department of Commerce and are meant to serve as a way to bridge the gap between privacy regulations of the European Union and the United States. Due to the lack of adequate privacy laws and protection on the federal level in the US, European privacy regulations generally prohibit the exporting of Pll from Europe to the United States. Participation in the Safe Harbor program is voluntary on the part of US organizations. These organizations must conform to specific requirements and policies that mirror those from the EU, thus possibly fulfilling the EU requirements for data sharing and export. This way, American businesses can be allowed to serve customers in the EU. The Health Insurance Portability and Accountability Act (HIPAA) pertains to","expth":"กฎระเบียบของ Safe Harbor ได้รับการพัฒนาโดยกระทรวงพาณิชย์และมีจุดมุ่งหมายเพื่อใช้เป็นช่องทางในการเชื่อมช่องว่างระหว่างกฎระเบียบด้านความเป็นส่วนตัวของสหภาพยุโรปและสหรัฐอเมริกา เนื่องจากขาดกฎหมายความเป็นส่วนตัวที่เพียงพอและการคุ้มครองในระดับรัฐบาลกลางในสหรัฐอเมริกา โดยทั่วไปกฎระเบียบด้านความเป็นส่วนตัวของยุโรปจึงห้ามไม่ให้ส่งออก Pll จากยุโรปไปยังสหรัฐอเมริกา การเข้าร่วมในโครงการ Safe Harbor นั้นเป็นไปโดยสมัครใจจากองค์กรในสหรัฐฯ องค์กรเหล่านี้จะต้องปฏิบัติตามข้อกำหนดและนโยบายเฉพาะที่สะท้อนข้อกำหนดและนโยบายจากสหภาพยุโรป ดังนั้นจึงอาจเป็นไปตามข้อกำหนดของสหภาพยุโรปสำหรับการแบ่งปันและส่งออกข้อมูล ด้วยวิธีนี้ ธุรกิจอเมริกันจึงสามารถได้รับอนุญาตให้ให้บริการลูกค้าในสหภาพยุโรปได้ กฎหมาย Health Insurance Portability and Accountability Act (HIPAA) เกี่ยวข้องกับ"},{"id":291,"topic":1,"q":"Audits are either done based on the status of a system or application at a specific time or done as a study over a period of time that takes into account changes and processes Which of the following pairs matches an audit type that is done over time, along with the minimum span of time necessary for it?","qth":"การตรวจสอบจะดำเนินการตามสถานะของระบบหรือแอปพลิเคชัน ณ เวลาที่กำหนด หรือดำเนินการเป็นการศึกษาในช่วงเวลาหนึ่งโดยคำนึงถึงการเปลี่ยนแปลงและกระบวนการ คู่ใดต่อไปนี้ตรงกับประเภทการตรวจสอบที่ทำในช่วงเวลาหนึ่ง พร้อมด้วยช่วงเวลาขั้นต่ำที่จำเป็นสำหรับการตรวจสอบนั้น","a":["SOC Type 2, one year","SOC Type 1, one year","SOC Type 2, one month","SOC Type 2, six months"],"ath":["SOC ประเภท 2 หนึ่งปี","SOC ประเภท 1 หนึ่งปี","SOC ประเภท 2 หนึ่งปี เดือน","SOC ประเภท 2, หกเดือน"],"ans":"D","exp":"SOC Type 2 audits are done over a period of time, with six months being the minimum duration. SOC Type 1 audits are designed with a scope that's a static point in time, and the other times provided for SOC Type 2 are incorrect","expth":"การตรวจสอบ SOC ประเภท 2 จะดำเนินการตามระยะเวลาหนึ่ง โดยหกเดือนคือ
