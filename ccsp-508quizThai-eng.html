AA) ล้วนเป็นกรอบการทำงานด้านกฎระเบียบสำหรับข้อมูลที่ละเอียดอ่อนหรือเฉพาะทาง"},{"id":347,"topic":1,"q":"Which data sanitation method is also commonly referred to as \"zeroing\"?","qth":"วิธีการสุขาภิบาลข้อมูลแบบใดที่เรียกกันทั่วไปว่า \"การทำให้เป็นศูนย์\"?","a":["Overwriting","Nullfication","Blanking","Deleting"],"ath":["การเขียนทับ","การทำให้เป็นโมฆะ","การว่าง","การลบ"],"ans":"A","exp":"The zeroing of data--or the writing of null values or arbitrary data to ensure deletion has been fully completed-is officially referred to as overwriting. Nullfication, deleting, and blanking are provided as distractor terms","expth":"การทำให้ข้อมูลเป็นศูนย์ - หรือการเขียนค่าว่างหรือข้อมูลที่กำหนดเองเพื่อให้แน่ใจว่าการลบเสร็จสมบูรณ์ - เรียกอย่างเป็นทางการว่าการเขียนทับ การลบล้าง การลบ และการเว้นว่างถือเป็นเงื่อนไขที่ทำให้เสียสมาธิ"},{"id":348,"topic":1,"q":"What is the concept of isolating an application from the underlying operating system for testing purposes?","qth":"แนวคิดของการแยกแอปพลิเคชันออกจากระบบปฏิบัติการพื้นฐานเพื่อการทดสอบคืออะไร","a":["Abstracting","Application virtualization","Hosting","Sandboxing (EXIT"],"ath":["นามธรรม","การจำลองเสมือนของแอปพลิเคชัน","โฮสติ้ง","Sandboxing (ออก"],"ans":"B","exp":"Application virtualization is a software implementation that allows applications and programs to run in an isolated environment rather than directly interacting with the operating system. Sandboxing refers to segregating information or processes for security or testing purposes, but it's not directly related to isolation from the underlying operating system, Abstracting sounds similar to the correct term but is not pertinent to the question, and hosting is provided as an erroneous answer,","expth":"การจำลองเสมือนของแอปพลิเคชันคือการใช้งานซอฟต์แวร์ที่อนุญาตให้แอปพลิเคชันและโปรแกรมทำงานในสภาพแวดล้อมที่แยกออกมาแทนที่จะโต้ตอบกับระบบปฏิบัติการโดยตรง Sandboxing หมายถึงการแยกข้อมูลหรือกระบวนการเพื่อความปลอดภัย หรือวัตถุประสงค์ในการทดสอบ แต่ไม่เกี่ยวข้องโดยตรงกับการแยกจากระบบปฏิบัติการพื้นฐาน Abstracting ฟังดูคล้ายกับคำที่ถูกต้อง แต่ไม่เกี่ยวข้องกับคำถาม และการโฮสต์นั้นมีให้เป็นคำตอบที่ผิดพลาด"},{"id":349,"topic":1,"q":"Which of the following could be used as a second component of multifactor authentication if a user has an RSA token?","qth":"ข้อใดต่อไปนี้สามารถใช้เป็นองค์ประกอบที่สองของการตรวจสอบสิทธิ์แบบหลายปัจจัยได้หากผู้ใช้มีโทเค็น RSA","a":["Access card","USB thumb drive","Retina scan","RFID"],"ath":["การ์ดเข้าถึง","ธัมบ์ไดรฟ์ USB","การสแกนจอตา","RFID"],"ans":"C","exp":"A retina scan could be used in conjunction with an RSA token because it is a biometric factor, and thus a different type of factor. An access card, RFID, and USB thumb drive are all items in possession of a user, the same as an RSA token, and as such would not be appropriate","expth":"การสแกนจอตาสามารถใช้ร่วมกับโทเค็น RSA ได้เนื่องจากเป็นปัจจัยทางชีวมิติ และด้วยเหตุนี้จึงเป็นปัจจัยประเภทอื่น บัตรเข้าใช้งาน RFID และธัมบ์ไดรฟ์ USB ล้วนเป็นสิ่งของที่ผู้ใช้ครอบครอง เช่นเดียวกับโทเค็น RSA และด้วยเหตุนี้จึงไม่เหมาะสม"},{"id":350,"topic":1,"q":"Which of the following is NOT one of the official risk rating categories?","qth":"ข้อใดต่อไปนี้ไม่ใช่หมวดหมู่การจัดอันดับความเสี่ยงอย่างเป็นทางการ","a":["Critical","Low","Catastrophic","Minimal"],"ath":["วิกฤต","ต่ำ","ภัยพิบัติ","ขั้นต่ำ"],"ans":"C","exp":"The official categories of cloud risk ratings are Minimal, Low, Moderate, High, and Critical","expth":"หมวดหมู่อย่างเป็นทางการของการจัดอันดับความเสี่ยงของระบบคลาวด์ ได้แก่ ขั้นต่ำ ต่ำ ปานกลาง สูง และวิกฤต"},{"id":351,"topic":1,"q":"SOC Type 1 reports are considered \"restricted use,” in that they are intended only for limited audiences and purposes. Which of the following is NOT a population that would be appropriate for a SOC Type 1 report?","qth":"รายงาน SOC ประเภท 1 ถือเป็น \"การใช้งานแบบจำกัด\" เนื่องจากมีไว้สำหรับผู้ชมและวัตถุประสงค์ที่จำกัดเท่านั้น ข้อใดต่อไปนี้ไม่ใช่ประชากรที่เหมาะสมสำหรับรายงาน SOC ประเภท 1","a":["Current clients","Auditors","Potential clients","The service organization"],"ath":["ลูกค้าปัจจุบัน","ผู้ตรวจสอบบัญชี","ผู้มีโอกาสเป็นลูกค้า","องค์กรบริการ"],"ans":"C","exp":"Potential clients are not served by SOC Type 1 audits. A Type 2 or Type 3 report would be appropriate for potential clients. SOC Type 1 reports are intended for restricted use, where only the service organization itself, current clients, or auditors would have access to them","expth":"ผู้มีโอกาสเป็นลูกค้าไม่ได้รับบริการจากการตรวจสอบ SOC ประเภท 1 รายงานประเภท 2 หรือประเภท 3 จะเหมาะสมสำหรับผู้มีโอกาสเป็นลูกค้า รายงาน SOC ประเภท 1 มีไว้สำหรับการใช้งานแบบจำกัด โดยมีเพียงองค์กรที่ให้บริการ ลูกค้าปัจจุบัน หรือผู้ตรวจสอบเท่านั้นที่จะสามารถเข้าถึงได้"},{"id":352,"topic":1,"q":"Having a reservation in a cloud environment can ensure operations continue in the event of high utilization across the cloud. Which of the following would NOT be a capability covered by reservations?","qth":"การจองในสภาพแวดล้อมคลาวด์ช่วยให้มั่นใจได้ว่าการดำเนินงานจะดำเนินต่อไปในกรณีที่มีการใช้งานสูงบนคลาวด์ ข้อใดต่อไปนี้จะไม่ครอบคลุมความสามารถในการจอง","a":["Performing business operations","Starting virtual machines","Running applications","Auto-scaling"],"ath":["ดำเนินธุรกิจ","การเริ่มต้นเครื่องเสมือน","กำลังเรียกใช้แอปพลิเคชัน","ปรับขนาดอัตโนมัติ"],"ans":"D","exp":"A reservation will not guarantee auto-scaling is available because it involves the allocation of additional resources beyond what a cloud customer already has provisioned. Reservations will guarantee minimal resources are available to start virtual machines, run applications, and perform normal business operations","expth":"การจองจะไม่รับประกันว่าการปรับขนาดอัตโนมัติจะพร้อมใช้งาน เนื่องจากเกี่ยวข้องกับการจัดสรรทรัพยากรเพิ่มเติมนอกเหนือจากที่ลูกค้าระบบคลาวด์จัดเตรียมไว้แล้ว การจองจะรับประกันว่าทรัพยากรขั้นต่ำจะพร้อมใช้งานเพื่อเริ่มเครื่องเสมือน เรียกใช้แอปพลิเคชัน และดำเนินธุรกิจตามปกติ"},{"id":353,"topic":1,"q":"What must SOAP rely on for security since it does not provide security as a built-in capability?","qth":"อะไรที่ต้องพึ่งพา SOAP เพื่อความปลอดภัยเนื่องจากไม่ได้จัดเตรียมความปลอดภัยตามความสามารถในตัว","a":["Encryption","Tokenization","TLS","SSL"],"ath":["การเข้ารหัส","Tokenization","TLS","SSL"],"ans":"A","exp":"Simple Object Access Protocol (SOAP) uses Extensible Markup Language (XML) for data passing, and it must rely on the encryption of those data packages for security. TLS and SSL (before it was deprecated) represent two commons approaches to using encryption for protection of data transmissions. However, they are only two possible options and do not encapsulate the overall concept the question is looking for. Tokenization, which involves the replacement of sensitive data with opaque values, would not be appropriate for use with SOAP because the actual data is needed by the services","expth":"Simple Object Access Protocol (SOAP) ใช้ Extensible Markup Language (XML) สำหรับการส่งผ่านข้อมูล และจะต้องอาศัยการเข้ารหัสของแพ็คเกจข้อมูลเหล่านั้นเพื่อความปลอดภัย TLS และ SSL (ก่อนที่จะเลิกใช้งาน) แสดงถึงแนวทางทั่วไปสองประการในการใช้การเข้ารหัสเพื่อป้องกันการส่งข้อมูล อย่างไรก็ตาม นี่เป็นเพียงสองตัวเลือกที่เป็นไปได้ และไม่ได้สรุปแนวคิดโดยรวมที่คำถามกำลังมองหา Tokenization ซึ่งเกี่ยวข้องกับการแทนที่ข้อมูลที่ละเอียดอ่อนด้วยค่าทึบแสง จะไม่เหมาะสมสำหรับการใช้กับ SOAP เนื่องจากบริการจำเป็นต้องใช้ข้อมูลจริง"},{"id":354,"topic":1,"q":"With a federated identity system, what does the identity provider send information to after a successful authentication?","qth":"ด้วยระบบข้อมูลประจำตัวแบบรวมศูนย์ ผู้ให้บริการข้อมูลประจำตัวจะส่งข้อมูลไปทำอะไรหลังจากการตรวจสอบความถูกต้องสำเร็จ","a":["Relying party","Service originator","Service relay","Service relay"],"ath":["ฝ่ายที่เกี่ยวข้อง","ผู้ริเริ่มบริการ","การถ่ายทอดบริการ","การถ่ายทอดบริการ"],"ans":"A","exp":"Upon successful authentication, the identity provider sends an assertion with appropriate attributes to the relying party to grant access and assign appropriate roles to the user. The other terms provided are similar sounding to the correct term but are not actual components of a federated system","expth":"เมื่อการตรวจสอบความถูกต้องสำเร็จ ผู้ให้บริการข้อมูลประจำตัวจะส่งการยืนยันพร้อมคุณลักษณะที่เหมาะสมไปยังฝ่ายที่เกี่ยวข้องเพื่อให้สิทธิ์การเข้าถึงและกำหนดบทบาทที่เหมาะสมให้กับผู้ใช้ ข้อกำหนดอื่นๆ ที่ให้ไว้นั้นฟังดูคล้ายกับคำที่ถูกต้อง แต่ไม่ใช่ส่วนประกอบที่แท้จริงของระบบแบบรวมศูนย์"},{"id":355,"topic":1,"q":"Which of the following technologies is NOT commonly used for accessing systems and services in a cloud environment in a secure manner?","qth":"เทคโนโลยีใดต่อไปนี้ที่มักไม่ใช้สำหรับการเข้าถึงระบบและบริการในสภาพแวดล้อมคลาวด์อย่างปลอดภัย","a":["KVM","HTTPS","VPN","TLS"],"ath":["KVM","HTTPS","VPN","TLS"],"ans":"A","exp":"A keyboard-video-mouse (KVM) system is commonly used for directly accessing server terminals in a data center. Itis not a method that would be possible within a cloud environment, primarily due to the use virtualized systems, but also because only the cloud provider's staff would be allowed the physical access to hardware systems that's provided by a KVM. Hypertext Transfer Protocol Secure (HTTPS), virtual private network (VPN), and Transport Layer Security (TLS) are all technologies and protocols that are widely used with cloud implementations for secure access to systems and services","expth":"ระบบคีย์บอร์ด-วิดีโอ-เมาส์ (KVM) มักใช้สำหรับการเข้าถึงเทอร์มินัลเซิร์ฟเวอร์ในศูนย์ข้อมูลโดยตรง ไม่ใช่วิธีการที่เป็นไปได้ภายในสภาพแวดล้อมคลาวด์ โดยหลักมาจากการใช้ระบบเสมือนจริง แต่ยังเป็นเพราะมีเพียงพนักงานของผู้ให้บริการคลาวด์เท่านั้นที่ได้รับอนุญาตให้เข้าถึงทางกายภาพไปยังระบบฮาร์ดแวร์ที่ KVM มอบให้ Hypertext Transfer Protocol Secure (HTTPS), เครือข่ายส่วนตัวเสมือน (VPN) และ Transport Layer Security (TLS) เป็นเทคโนโลยีและโปรโตคอลทั้งหมดที่ใช้กันอย่างแพร่หลายกับการใช้งานระบบคลาวด์เพื่อการเข้าถึงระบบและบริการอย่างปลอดภัย"},{"id":356,"topic":1,"q":"Which component of ITIL involves handling anything that can impact services for either internal or public users?","qth":"องค์ประกอบใดของ ITIL ที่เกี่ยวข้องกับการจัดการทุกสิ่งที่สามารถส่งผลกระทบต่อบริการสำหรับผู้ใช้ภายในหรือสาธารณะ","a":["Incident management","Deployment management","Problem management","Change management"],"ath":["การจัดการเหตุการณ์","การจัดการการปรับใช้","การจัดการปัญหา","การจัดการการเปลี่ยนแปลง"],"ans":"D","exp":"Explanation Incident management is focused on limiting the impact of disruptions to an organization's services or operations, as well as returning their state to full operational status as soon as possible. Problem management is focused on identifying and mitigating known problems and deficiencies before they occur. Deployment management is a subcomponent of change management and is where the actual code or configuration change is put into place. Change management involves the processes and procedures that allow an organization to make changes to its IT systems and services in a controlled manner","expth":"คำอธิบาย การจัดการเหตุการณ์มุ่งเน้นไปที่การจำกัดผลกระทบของการหยุดชะงักในบริการหรือการดำเนินงานขององค์กร รวมถึงการคืนสถานะสู่สถานะการปฏิบัติงานเต็มรูปแบบโดยเร็วที่สุด การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น การจัดการการปรับใช้เป็นองค์ประกอบย่อยของการจัดการการเปลี่ยนแปลงและเป็นจุดที่มีการเปลี่ยนแปลงโค้ดหรือการกำหนดค่าจริง การจัดการการเปลี่ยนแปลงเกี่ยวข้องกับกระบวนการและขั้นตอนที่ช่วยให้องค์กรทำการเปลี่ยนแปลงระบบไอทีและบริการในลักษณะที่ได้รับการควบคุม"},{"id":357,"topic":1,"q":"Which protocol, as a part of TLS, handles the actual secure communications and transmission of data?","qth":"โปรโตคอลใดซึ่งเป็นส่วนหนึ่งของ TLS ที่จัดการการสื่อสารและการส่งข้อมูลที่ปลอดภัยจริง","a":["Negotiation","Handshake","Transfer","Record"],"ath":["การเจรจาต่อรอง","จับมือกัน","การถ่ายโอน","บันทึก"],"ans":"D","exp":"The TLS record protocol is the actual secure communications method for transmitting data; it's responsible for encrypting and authenticating packets throughout their transmission between the parties, and in some cases it also performs compression. The TLS handshake protocol is what negotiates and establishes the TLS connection between two parties and enables the secure communications channel to then handle data transmissions. Negotiation and transfer are not protocols under TLS","expth":"โปรโตคอลบันทึก TLS เป็นวิธีการสื่อสารที่ปลอดภัยจริงสำหรับการส่งข้อมูล มีหน้าที่รับผิดชอบในการเข้ารหัสและรับรองความถูกต้องของแพ็กเก็ตตลอดการส่งข้อมูลระหว่างฝ่ายต่างๆ และในบางกรณีก็ทำการบีบอัดด้วย โปรโตคอลการจับมือ TLS คือสิ่งที่เจรจาและสร้างการเชื่อมต่อ TLS ระหว่างทั้งสองฝ่าย และช่วยให้ช่องทางการสื่อสารที่ปลอดภัยสามารถจัดการการส่งข้อมูลได้ การเจรจาและการโอนไม่ใช่โปรโตคอลภายใต้ TLS"},{"id":358,"topic":1,"q":"Which of the following terms is NOT a commonly used category of risk acceptance?","qth":"คำใดต่อไปนี้ไม่ใช่ประเภทการยอมรับความเสี่ยงที่ใช้กันทั่วไป?","a":["Moderate","Critical","Minimal","Accepted"],"ath":["ปานกลาง","สำคัญ","น้อยที่สุด","ยอมรับแล้ว"],"ans":"D","exp":"Explanation Accepted is not a risk acceptance category. The risk acceptance categories are minimal, low, moderate, high, and critical","expth":"คำอธิบาย ยอมรับแล้ว ไม่ใช่ประเภทการยอมรับความเสี่ยง ประเภทการยอมรับความเสี่ยง ได้แก่ น้อยที่สุด ต่ำ ปานกลาง สูง และวิกฤต"},{"id":359,"topic":1,"q":"Many activities within a cloud environment are performed via programmatic means, where complex and distributed operations are handled without the need to perform each step individually. Which of the following concepts does this describe?","qth":"กิจกรรมจำนวนมากภายในสภาพแวดล้อมคลาวด์ดำเนินการผ่านวิธีการทางโปรแกรม โดยมีการจัดการการดำเนินการที่ซับซ้อนและกระจายโดยไม่จำเป็นต้องดำเนินการแต่ละขั้นตอนแยกกัน สิ่งนี้อธิบายแนวคิดใดต่อไปนี้","a":["Orchestration","Provisioning","Automation","Allocation"],"ath":["การเรียบเรียง","การจัดเตรียม","ระบบอัตโนมัติ","การจัดสรร"],"ans":"A","exp":"Orchestration is the programmatic means of managing and coordinating activities within a cloud environment and allowing for a commensurate level of automation and self-service. Provisioning, allocation, and automation are all components of orchestration, but none refers to the overall concept","expth":"การจัดประสานเป็นวิธีทางโปรแกรมในการจัดการและประสานงานกิจกรรมภายในสภาพแวดล้อมคลาวด์ และช่วยให้มีระบบอัตโนมัติและการบริการตนเองในระดับที่เหมาะสม การจัดเตรียม การจัดสรร และระบบอัตโนมัติล้วนเป็นองค์ประกอบของการจัดการ แต่ไม่มีสิ่งใดที่อ้างอิงถึงแนวคิดโดยรวม"},{"id":360,"topic":1,"q":"Being in a cloud environment, cloud customers lose alot of insight and knowledge as to how their data is stored and their systems are deployed Which concept from the ISO/IEC cloud standards relates to the necessity of the cloud provider to inform the cloud customer on these issues?","qth":"เมื่ออยู่ในสภาพแวดล้อมคลาวด์ ลูกค้าคลาวด์จะสูญเสียข้อมูลเชิงลึกและความรู้อย่างมากเกี่ยวกับวิธีการจัดเก็บข้อมูลและระบบของพวกเขาถูกปรับใช้ แนวคิดใดจากมาตรฐานคลาวด์ ISO/IEC ที่เกี่ยวข้องกับความจำเป็นของผู้ให้บริการคลาวด์ในการแจ้งให้ลูกค้าคลาวด์ทราบเกี่ยวกับปัญหาเหล่านี้","a":["Disclosure","Transparency","Openness","Documentation"],"ath":["การเปิดเผยข้อมูล","ความโปร่งใส","การเปิดกว้าง","เอกสารประกอบ"],"ans":"B","exp":"Transparency is the official process by which a cloud provider discloses insight and information into its configurations or operations to the appropriate audiences. Disclosure, openness, and documentation are all terms that sound similar to the correct answer, but none of them is the correct term in this case","expth":"ความโปร่งใสเป็นกระบวนการอย่างเป็นทางการที่ ผู้ให้บริการระบบคลาวด์เปิดเผยข้อมูลเชิงลึกและข้อมูลในการกำหนดค่าหรือการดำเนินงานแก่ผู้ชมที่เหมาะสม การเปิดเผย การเปิดเผย และการจัดทำเอกสารล้วนเป็นคำศัพท์ที่ฟังดูคล้ายกับคำตอบที่ถูกต้อง แต่ไม่มีคำใดเป็นคำที่ถูกต้องในกรณีนี้"},{"id":361,"topic":1,"q":"Your IT steering committee has, at a high level, approved your project to begin using cloud services. However, the committee is concerned with getting locked into a single cloud provider and has flagged the ability to easily move between cloud providers as a top priority. It also wants to save costs by reusing components Which cross-cutting aspect of cloud computing would be your primary focus as your project plan continues to develop and you begin to evaluate cloud providers?","qth":"คณะกรรมการกำกับดูแลด้านไอทีของคุณได้อนุมัติโครงการของคุณในระดับสูงเพื่อเริ่มใช้บริการคลาวด์ อย่างไรก็ตาม คณะกรรมการกังวลเกี่ยวกับการล็อคตัวให้เข้ากับผู้ให้บริการคลาวด์เพียงรายเดียว และได้ทำเครื่องหมายความสามารถในการย้ายระหว่างผู้ให้บริการคลาวด์อย่างง่ายดายเป็นลำดับความสำคัญสูงสุด นอกจากนี้ยังต้องการประหยัดค่าใช้จ่ายด้วยการนำส่วนประกอบกลับมาใช้ใหม่ แง่มุมใดของการประมวลผลแบบคลาวด์ที่จะกลายเป็นจุดสนใจหลักของคุณในขณะที่แผนโครงการของคุณยังคงพัฒนาต่อไปและคุณเริ่มประเมินผู้ให้บริการคลาวด์","a":["Interoperability","Resiliency","Scalability","Portability (EEX)"],"ath":["การทำงานร่วมกัน","ความยืดหยุ่น","ความสามารถในการขยายขนาด","การพกพา (EEX)"],"ans":"D","exp":"Interoperability is ability to easily move between cloud providers, by either moving or reusing components and services. This can pertain to any cloud deployment model, and it gives organizations the ability to constantly evaluate costs and services as well as move their businessto another cloud provider as needed or desired. Portability relates to the wholesale moving of services from one cloud providerto another, not necessarily the reuse of components or services for other purposes. Although resiliency is not an official concept within cloud computing, it certainly would be found throughout other topics such as elasticity, auto-scaling, and resource pooling. Scalability pertainsto changing resource allocationsto a service to meet current demand, either upward or downward in scope","expth":"ความสามารถในการทำงานร่วมกันคือความสามารถในการเคลื่อนย้ายระหว่างผู้ให้บริการคลาวด์ได้อย่างง่ายดาย โดยการย้ายหรือนำส่วนประกอบและบริการกลับมาใช้ใหม่ ซึ่งอาจเกี่ยวข้องกับรูปแบบการใช้งานระบบคลาวด์ใดๆ ก็ตาม และช่วยให้องค์กรต่างๆ สามารถประเมินต้นทุนและบริการได้อย่างต่อเนื่อง ตลอดจนย้ายธุรกิจไปยังผู้ให้บริการระบบคลาวด์รายอื่นตามความจำเป็นหรือต้องการ ความสามารถในการพกพาเกี่ยวข้องกับการย้ายบริการแบบขายส่งจากผู้ให้บริการคลาวด์รายหนึ่งไปยังอีกรายหนึ่ง โดยไม่จำเป็นต้องนำส่วนประกอบหรือบริการกลับมาใช้ซ้ำเพื่อวัตถุประสงค์อื่น แม้ว่าความยืดหยุ่นจะไม่ใช่แนวคิดอย่างเป็นทางการในการประมวลผลแบบคลาวด์ แต่จะพบได้ในหัวข้ออื่นๆ เช่น ความยืดหยุ่น การปรับขนาดอัตโนมัติ และการรวมทรัพยากร ความสามารถในการปรับขนาดเกี่ยวข้องกับการเปลี่ยนการจัดสรรทรัพยากรเป็นบริการเพื่อตอบสนองความต้องการในปัจจุบัน ไม่ว่าจะเพิ่มขึ้นหรือลดลงในขอบเขต"},{"id":362,"topic":1,"q":"Which of the following provides assurance, to a predetermined acceptable level of certainty, that an entity is indeed who they claim to be?","qth":"ข้อใดต่อไปนี้ให้การรับประกันในระดับความแน่นอนที่ยอมรับได้ที่กำหนดไว้ล่วงหน้าว่าเอนทิตีคือบุคคลที่พวกเขาอ้างว่าเป็นจริงๆ?","a":["Authentication","Identification","Proofing","Authorization"],"ath":["การรับรองความถูกต้อง","การระบุตัวตน","การพิสูจน์อักษร","การให้สิทธิ์"],"ans":"A","exp":"Authentication goes a step further than identification by providing a means for proving an entity's identification. Authentication is most commonly done through mechanisms such as passwords. Identification involves ascertaining who the entity is, but without a means of proving it, such as a name or user ID. Authorization occurs after authentication and sets access permissions and other privileges within a system or application for the user. Proofing is not a term that is relevant to the question","expth":"การรับรองความถูกต้องก้าวไปไกลกว่าการระบุตัวตนโดยการจัดเตรียมวิธีการในการพิสูจน์การระบุตัวตนของนิติบุคคล การรับรองความถูกต้องมักกระทำผ่านกลไกต่างๆ เช่น รหัสผ่าน การระบุเกี่ยวข้องกับการสืบหาว่าบุคคลนั้นคือใคร แต่ไม่มีวิธีการพิสูจน์ เช่น ชื่อหรือรหัสผู้ใช้ การอนุญาตเกิดขึ้นหลังจากการรับรองความถูกต้องและตั้งค่าสิทธิ์การเข้าถึงและสิทธิพิเศษอื่น ๆ ภายในระบบหรือแอปพลิเคชันสำหรับผู้ใช้ การพิสูจน์อักษรไม่ใช่คำที่เกี่ยวข้องกับคำถาม"},{"id":363,"topic":1,"q":"Whereas a contract articulates overall priorities and requirements for a business relationship, which artifact enumerates specific compliance requirements, metrics, and response times?","qth":"ในขณะที่สัญญาระบุถึงลำดับความสำคัญและข้อกำหนดโดยรวมสำหรับความสัมพันธ์ทางธุรกิจ ซึ่งระบุข้อกำหนดในการปฏิบัติตามข้อกำหนด ตัวชี้วัด และเวลาตอบสนองที่เฉพาะเจาะจง","a":["Service level agreement","Service level contract","Service compliance contract","Service level amendment"],"ath":["ข้อตกลงระดับบริการ","สัญญาระดับบริการ","สัญญาการปฏิบัติตามข้อกำหนดด้านบริการ","การแก้ไขระดับบริการ"],"ans":"A","exp":"The service level agreement (SLA) articulates minimum requirements for uptime, availabilty, processes, customer service and support, security controls, auditing requirements, and any other key aspect or requirement of the contract. Although the other choices sound similar to the correct answer, none is the proper term for this, concept","expth":"ข้อตกลงระดับบริการ (SLA) ระบุข้อกำหนดขั้นต่ำสำหรับสถานะการออนไลน์ ความพร้อมใช้งาน กระบวนการ การบริการลูกค้า และ การสนับสนุน การควบคุมความปลอดภัย ข้อกำหนดการตรวจสอบ และประเด็นสำคัญหรือข้อกำหนดอื่น ๆ ของสัญญา แม้ว่าตัวเลือกอื่นๆ จะฟังดูคล้ายกับคำตอบที่ถูกต้อง แต่ก็ไม่มีคำใดที่เหมาะสมสำหรับแนวคิดนี้"},{"id":364,"topic":1,"q":"When an organization is considering the use of cloud services for BCDR planning and solutions, which of the following cloud concepts would be the most important?","qth":"เมื่อองค์กรกำลังพิจารณาใช้บริการระบบคลาวด์สำหรับการวางแผนและโซลูชัน BCDR แนวคิดระบบคลาวด์ข้อใดต่อไปนี้จะมีความสำคัญมากที่สุด","a":["Reversibility","Elasticity","Interoperability","Portability"],"ath":["การย้อนกลับได้","ความยืดหยุ่น","การทำงานร่วมกัน","การพกพา"],"ans":"D","exp":"Portabilty is the ability for a service or system to easily move among different cloud providers. This is essential for using a cloud solution for BCDR because vendor lock-in would inhibit easily moving and setting up services in the event of a disaster, or it would necessitate a large number of configuration or component changes to implement. Interoperabilty, or the ability to reuse components for other services or systems, would not be an important factor for BCDR. Reversibility, or the ability to remove all data quickly and completely from a cloud environment, would be important at the end of a disaster, but would not be important during setup and deployment. Elasticity, or the ability to resize resources to meet current demand, would be very beneficial to a BCDR situation, but not as v","expth":"การพกพาคือความสามารถของบริการหรือระบบในการเคลื่อนย้ายระหว่างผู้ให้บริการคลาวด์รายต่างๆ ได้อย่างง่ายดาย นี่เป็นสิ่งสำคัญสำหรับการใช้โซลูชันระบบคลาวด์สำหรับ BCDR เนื่องจากการล็อคอินของผู้จำหน่ายจะขัดขวางการเคลื่อนย้ายและการตั้งค่าบริการอย่างง่ายดายในกรณีที่เกิดภัยพิบัติ หรือจำเป็นต้องมีการกำหนดค่าหรือการเปลี่ยนแปลงส่วนประกอบจำนวนมากเพื่อนำไปใช้ ความสามารถในการทำงานร่วมกันหรือความสามารถในการนำส่วนประกอบกลับมาใช้ใหม่สำหรับบริการหรือระบบอื่นๆ จะไม่เป็นปัจจัยสำคัญสำหรับ BCDR ความสามารถในการย้อนกลับได้หรือความสามารถในการลบข้อมูลทั้งหมดอย่างรวดเร็วและสมบูรณ์ออกจากสภาพแวดล้อมคลาวด์จะมีความสำคัญเมื่อสิ้นสุดภัยพิบัติ แต่จะไม่สำคัญในระหว่างการตั้งค่าและการปรับใช้ ความยืดหยุ่นหรือความสามารถในการปรับขนาดทรัพยากรให้ตรงกับความต้องการในปัจจุบัน จะเป็นประโยชน์อย่างยิ่งต่อสถานการณ์ BCDR แต่ไม่เป็นผลดีต่อสถานการณ์"},{"id":365,"topic":1,"q":"What masking strategy involves the replacing of sensitive data at the time it is accessed and used as it flows between the data and application layers of a service?","qth":"กลยุทธ์การมาสก์ใดที่เกี่ยวข้องกับการแทนที่ข้อมูลที่ละเอียดอ่อนในเวลาที่มีการเข้าถึงและใช้งานในขณะที่ข้อมูลไหลระหว่างชั้นข้อมูลและแอปพลิเคชันของบริการ","a":["Active","Static","Dynamic","Transactional"],"ath":["ใช้งานอยู่","คงที่","ไดนามิก","ธุรกรรม"],"ans":"C","exp":"Dynamic masking involves the live replacing of sensitive data fields during transactional use between the data and application layers of a service. Static masking involves creating a full data set with the sensitive data fields masked, but is not done during live transactions like dynamic masking. Active and transactional are offered as similar types of answers but are not types of masking","expth":"การมาสก์แบบไดนามิกเกี่ยวข้องกับการแทนที่ฟิลด์ข้อมูลที่ละเอียดอ่อนแบบเรียลไทม์ในระหว่างการใช้งานธุรกรรมระหว่างชั้นข้อมูลและแอปพลิเคชันของบริการ การมาสก์แบบคงที่เกี่ยวข้องกับการสร้างชุดข้อมูลเต็มรูปแบบโดยมีการมาสก์ช่องข้อมูลที่ละเอียดอ่อน แต่จะไม่ได้เกิดขึ้นระหว่างการทำธุรกรรมจริง เช่น การมาสก์แบบไดนามิก คำตอบที่ใช้งานอยู่และธุรกรรมเสนอเป็นคำตอบประเภทเดียวกัน แต่ไม่ใช่ประเภทของการมาสก์"},{"id":366,"topic":1,"q":"Which of the following would be considered an example of insufficient due diligence leading to security or operational problems when moving to a cloud?","qth":"ข้อใดต่อไปนี้ถือเป็นตัวอย่างของความรอบคอบไม่เพียงพอที่นำไปสู่ปัญหาด้านความปลอดภัยหรือการปฏิบัติงานเมื่อย้ายไปยังระบบคลาวด์","a":["Monitoring","Use of a remote key management system","Programming languages used","Reliance on physical network controls"],"ath":["การตรวจสอบ","การใช้ระบบการจัดการคีย์ระยะไกล","ภาษาการเขียนโปรแกรมที่ใช้","การพึ่งพาการควบคุมเครือข่ายทางกายภาพ"],"ans":"D","exp":"Many organizations in a traditional data center make heavy use of physical network controls for security. Although this is a perfectly acceptable best practice in a traditional data center, this reliance is not something that will port to a cloud environment. The failure of an organization to properly understand and adapt to the difference in network controls when moving to a cloud wil likely leave an application with security holes and vulnerabilities. The use of a remote key management system, monitoring, or certain programming languages would not constitute insufficient due diligence by itself","expth":"หลายองค์กรในศูนย์ข้อมูลแบบดั้งเดิมใช้การควบคุมเครือข่ายทางกายภาพอย่างหนักเพื่อความปลอดภัย แม้ว่านี่จะเป็นแนวปฏิบัติที่ดีที่สุดที่ยอมรับได้อย่างสมบูรณ์แบบในศูนย์ข้อมูลแบบดั้งเดิม แต่การพึ่งพานี้ไม่ใช่สิ่งที่จะส่งต่อไปยังสภาพแวดล้อมคลาวด์ ความล้มเหลวขององค์กรในการทำความเข้าใจและปรับตัวให้เข้ากับความแตกต่างในการควบคุมเครือข่ายอย่างเหมาะสมเมื่อย้ายไปยังระบบคลาวด์อาจทำให้แอปพลิเคชันมีช่องโหว่ด้านความปลอดภัยและช่องโหว่ การใช้ระบบการจัดการคีย์ระยะไกล การตรวจสอบ หรือภาษาการเขียนโปรแกรมบางภาษาไม่ถือเป็นการตรวจสอบสถานะที่ไม่เพียงพอ"},{"id":367,"topic":1,"q":"Which aspect of cloud computing serves as the biggest challenge to using DLP to protect data at rest?","qth":"ด้านใดของการประมวลผลแบบคลาวด์ที่ทำหน้าที่เป็นความท้าทายที่ใหญ่ที่สุดในการใช้ DLP เพื่อปกป้องข้อมูลที่อยู่นิ่ง","a":["Portability","Resource pooling","Interoperability","Reversibility"],"ath":["การพกพา","การรวมทรัพยากร","การทำงานร่วมกัน","การย้อนกลับได้"],"ans":"B","exp":"Resource pooling serves as the biggest challenge to using DLP solutions to protect data at rest because data is spread across large systems, which are also shared by many different clients. With the data always moving and being distributed, additional challenges for protection are created versus a physical and isolated storage system. Portability is the ability to easily move between different cloud providers, and interoperability is focused on the ability to reuse components or services. Reversibility pertains to the ability of a cloud customer to easily and completely remove their data and services from a cloud provider","expth":"การรวมทรัพยากรถือเป็นความท้าทายที่ใหญ่ที่สุดในการใช้โซลูชัน DLP เพื่อปกป้องข้อมูลที่อยู่นิ่ง เนื่องจากข้อมูลถูกกระจายไปทั่วระบบขนาดใหญ่ ซึ่งมีการแชร์โดยไคลเอ็นต์ที่แตกต่างกันจำนวนมาก เนื่องจากข้อมูลมีการเคลื่อนย้ายและกระจายอยู่ตลอดเวลา ความท้าทายเพิ่มเติมในการป้องกันจึงถูกสร้างขึ้นเมื่อเทียบกับระบบจัดเก็บข้อมูลทางกายภาพและแบบแยกส่วน ความสามารถในการพกพาคือความสามารถในการเคลื่อนย้ายระหว่างผู้ให้บริการคลาวด์ที่แตกต่างกันได้อย่างง่ายดาย และความสามารถในการทำงานร่วมกันมุ่งเน้นไปที่ความสามารถในการนำส่วนประกอบหรือบริการกลับมาใช้ใหม่ ความสามารถในการย้อนกลับเกี่ยวข้องกับความสามารถของลูกค้าระบบคลาวด์ในการลบข้อมูลและบริการของตนออกจากผู้ให้บริการระบบคลาวด์ได้อย่างง่ายดายและสมบูรณ์"},{"id":368,"topic":1,"q":"What category of Pll data can carry potential fines or even criminal charges for its improper use or disclosure?","qth":"ข้อมูล Pll ประเภทใดที่สามารถนำค่าปรับที่อาจเกิดขึ้นหรือแม้กระทั่งข้อหาทางอาญาสำหรับการใช้หรือการเปิดเผยที่ไม่เหมาะสม","a":["Protected","Legal","Regulated","Contractual"],"ath":["ได้รับการคุ้มครอง","กฎหมาย","ควบคุม","ตามสัญญา"],"ans":"C","exp":"Regulated Pll data carries legal and jurisdictional requirements, along with official penalties for its misuse or disclosure, which can be either civil or criminal in nature. Legal and protected are similar terms, but neither is the correct answer in this case. Contractual requirements can carry financial or contractual impacts for the improper use or disclosure of Pll data, but not legal or criminal penalties that are officially enforced","expth":"ข้อมูล Pll ที่มีการควบคุมมีข้อกำหนดทางกฎหมายและเขตอำนาจศาล พร้อมด้วยบทลงโทษอย่างเป็นทางการสำหรับการใช้ในทางที่ผิดหรือการเปิดเผยข้อมูล ซึ่งอาจเป็นได้ทั้งทางแพ่งหรือทางอาญา กฎหมายและการคุ้มครองเป็นคำที่คล้ายกัน แต่ก็ไม่ใช่คำตอบที่ถูกต้องในกรณีนี้ ข้อกำหนดทางสัญญาอาจมีผลกระทบทางการเงินหรือทางสัญญาสำหรับการใช้หรือการเปิดเผยข้อมูล Pll ที่ไม่เหมาะสม แต่ไม่ใช่บทลงโทษทางกฎหมายหรือทางอาญาที่บังคับใช้อย่างเป็นทางการ"},{"id":369,"topic":1,"q":"A variety of security systems can be integrated within a network—some that just monitor for threats and issue alerts, and others that take action based on signatures, behavior, and other types of rules to actively stop potential threats. Which type of technology is best described here?","qth":"ระบบรักษาความปลอดภัยที่หลากหลายสามารถบูรณาการภายในเครือข่ายได้ บางส่วนจะตรวจสอบภัยคุกคามและออกการแจ้งเตือนเท่านั้น และระบบอื่นๆ ที่ดำเนินการตามลายเซ็น พฤติกรรม และกฎประเภทอื่นๆ เพื่อหยุดภัยคุกคามที่อาจเกิดขึ้น เทคโนโลยีประเภทใดที่อธิบายได้ดีที่สุดที่นี่","a":["IDS","IPS","Proxy","Firewall"],"ath":["ไอดีเอส","ไอพีเอส","หนังสือมอบฉันทะ","ไฟร์วอลล์"],"ans":"B","exp":"An intrusion prevention system (IPS) can inspect traffic and detect any suspicious traffic based on a variety of factors, but it can also actively block such traffic. Although an IDS can detect the same types of suspicious traffic as an IPS, itis only design to alert, not to block. Afirewall is only concerned with IP addresses, ports, and protocols; it cannot be used for the signature-based detection of traffic. A proxy can limit or direct traffic based on more extensive factors than a network firewall can, but it's not capable of using the same signature detection rules as an IPS","expth":"ระบบป้องกันการบุกรุก (IPS) สามารถตรวจสอบการรับส่งข้อมูลและตรวจจับการรับส่งข้อมูลที่น่าสงสัยโดยพิจารณาจากปัจจัยหลายประการ แต่ยังสามารถบล็อกการรับส่งข้อมูลดังกล่าวได้ด้วยเช่นกัน แม้ว่า IDS จะสามารถตรวจจับการรับส่งข้อมูลที่น่าสงสัยประเภทเดียวกันกับ IPS ได้ แต่ออกแบบมาเพื่อแจ้งเตือนเท่านั้น ไม่ใช่เพื่อบล็อก Afirewall เกี่ยวข้องกับที่อยู่ IP พอร์ตและโปรโตคอลเท่านั้น ไม่สามารถใช้สำหรับการตรวจหาการรับส่งข้อมูลตามลายเซ็น พร็อกซีสามารถจำกัดหรือกำหนดเส้นทางการรับส่งข้อมูลโดยพิจารณาจากปัจจัยที่ครอบคลุมมากกว่าไฟร์วอลล์เครือข่าย แต่จะไม่สามารถใช้กฎการตรวจจับลายเซ็นเดียวกันกับ IPS"},{"id":370,"topic":1,"q":"Upon completing a risk analysis, a company has four different approaches to addressing risk. Which approach it takes will be based on costs, available options, and adherence to any regulatory requirements from independent audits Which of the following groupings correctly represents the four possible approaches?","qth":"เมื่อเสร็จสิ้นการวิเคราะห์ความเสี่ยง บริษัทมีสี่แนวทางที่แตกต่างกันในการจัดการกับความเสี่ยง แนวทางใดที่ใช้จะขึ้นอยู่กับต้นทุน ตัวเลือกที่มีอยู่ และการปฏิบัติตามข้อกำหนดด้านกฎระเบียบจากการตรวจสอบอิสระ การจัดกลุ่มใดต่อไปนี้แสดงถึงแนวทางที่เป็นไปได้ทั้งสี่วิธีอย่างถูกต้อง","a":["Accept, avoid, transfer, mitigate","Accept, deny, transfer, mitigate","Accept, deny, mitigate, revise","Accept, dismiss, transfer, mitigate"],"ath":["ยอมรับ หลีกเลี่ยง โอน บรรเทา","ยอมรับ ปฏิเสธ โอน บรรเทา","ยอมรับ ปฏิเสธ บรรเทา แก้ไข","ยอมรับ ยกเลิก โอน บรรเทา"],"ans":"A","exp":"The four possible approaches to risk are as follows: accept (do not patch and continue with the risk), avoid (implement solutions to prevent the risk from occurring), transfer (take out insurance), and mitigate (change configurations or patch to resolve the risk). Each of these answers contains at least one incorrect approach name","expth":"แนวทางที่เป็นไปได้สี่ประการสำหรับความเสี่ยงมีดังนี้: ยอมรับ (อย่าแก้ไขและดำเนินการกับความเสี่ยงต่อไป) หลีกเลี่ยง (ใช้วิธีแก้ปัญหาเพื่อป้องกันความเสี่ยงที่จะเกิดขึ้น) ถ่ายโอน (นำประกันออก) และบรรเทา (เปลี่ยนการกำหนดค่าหรือแพทช์เพื่อแก้ไขความเสี่ยง) แต่ละคำตอบเหล่านี้มีชื่อแนวทางที่ไม่ถูกต้องอย่างน้อยหนึ่งชื่อ"},{"id":371,"topic":1,"q":"Which of the following is NOT a component of access control?","qth":"ข้อใดต่อไปนี้ไม่ใช่องค์ประกอบของการควบคุมการเข้าถึง","a":["Accounting","Federation","Authorization","Authentication"],"ath":["การบัญชี","สหพันธรัฐ","การอนุญาต","การตรวจสอบสิทธิ์"],"ans":"B","exp":"Federation is not a component of access control. Instead, it is used to allow users possessing credentials from other authorities and systems to access services outside of their domain. This allows for access and trust without the need to create additional, local credentials. Access control encompasses not only the key concepts of authorization and authentication, but also accounting. Accounting consists of collecting and maintaining logs for both authentication and authorization for operational and regulatory requirements","expth":"สหพันธรัฐไม่ใช่องค์ประกอบของการควบคุมการเข้าถึง แต่ใช้เพื่ออนุญาตให้ผู้ใช้ที่มีข้อมูลรับรองจากหน่วยงานและระบบอื่น ๆ เข้าถึงบริการภายนอกโดเมนของตนได้ ซึ่งช่วยให้เข้าถึงและไว้วางใจได้โดยไม่จำเป็นต้องสร้างข้อมูลรับรองท้องถิ่นเพิ่มเติม การควบคุมการเข้าถึงไม่เพียงแต่ครอบคลุมแนวคิดหลักของการอนุญาตและการรับรองความถูกต้องเท่านั้น แต่ยังรวมถึงการบัญชีด้วย การบัญชีประกอบด้วยการรวบรวมและดูแลรักษาบันทึกสำหรับการตรวจสอบและการอนุญาตสำหรับข้อกำหนดด้านการปฏิบัติงานและกฎระเบียบ"},{"id":372,"topic":1,"q":"What concept does the A represent within the DREAD model?","qth":"แนวคิดใดที่ A เป็นตัวแทนภายในโมเดล DREAD?","a":["Affected users","Authorization","Authentication","Affinity"],"ath":["ผู้ใช้ที่ได้รับผลกระทบ","การอนุญาต","การรับรองความถูกต้อง","ความสัมพันธ์"],"ans":"A","exp":"The concept of affected users measures the percentage of users who would be impacted by a successful exploit. Scoring ranges from 0, which would impact no users, to 10, which would impact all users. None of the other options provided is the correct term","expth":"แนวคิดของผู้ใช้ที่ได้รับผลกระทบจะวัดเปอร์เซ็นต์ของผู้ใช้ที่จะได้รับผลกระทบจากการหาประโยชน์ที่ประสบความสำเร็จ การให้คะแนนมีตั้งแต่ 0 ซึ่งจะส่งผลต่อผู้ใช้ทั้งหมด จนถึง 10 ซึ่งจะส่งผลต่อผู้ใช้ทั้งหมด ไม่มีตัวเลือกอื่นใดที่ให้ไว้เป็นคำที่ถูกต้อง"},{"id":373,"topic":1,"q":"With an application hosted in a cloud environment, who could be the recipient of an eDiscovery order?","qth":"ใครบ้างที่เป็นผู้รับคำสั่งซื้อ eDiscovery ได้ด้วยแอปพลิเคชันที่โฮสต์ในสภาพแวดล้อมคลาวด์","a":["Users","Both the cloud provider and cloud customer","The cloud customer","The cloud provider"],"ath":["ผู้ใช้","ทั้งผู้ให้บริการคลาวด์และลูกค้าคลาวด์","ลูกค้าคลาวด์","ผู้ให้บริการคลาวด์"],"ans":"B","exp":"Either the cloud customer or the cloud provider could receive an eDiscovery order, and in almost all circumstances they would need to work together to ensure compliance","expth":"ลูกค้าคลาวด์หรือผู้ให้บริการคลาวด์สามารถรับคำสั่งซื้อ eDiscovery ได้ และในเกือบทุกสถานการณ์ พวกเขาจำเป็นต้องทำงานร่วมกันเพื่อให้มั่นใจว่าเป็นไปตามข้อกำหนด"},{"id":374,"topic":1,"q":"Which ITIL component focuses on ensuring that system resources, processes, and personnel are properly allocated to meet SLA requirements?","qth":"องค์ประกอบ ITIL ใดที่มุ่งเน้นเพื่อให้แน่ใจว่าทรัพยากรระบบ กระบวนการ และบุคลากรได้รับการจัดสรรอย่างเหมาะสมเพื่อให้ตรงตามข้อกำหนด SLA","a":["Continuity management","Availability management","Configuration management","Problem management"],"ath":["การจัดการความต่อเนื่อง","การจัดการความพร้อมใช้งาน","การจัดการการกำหนดค่า","การจัดการปัญหา"],"ans":"B","exp":"Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Continuity management (or business continuity management) is focused on planning for the successful restoration of systems or services after an unexpected outage, incident, or disaster. Configuration management tracks and maintains detailed information about all IT components within an organization. Problem management is focused on identifying and mitigating known problems and deficiencies before they occur","expth":"การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการความต่อเนื่อง (หรือการจัดการความต่อเนื่องทางธุรกิจ) มุ่งเน้นไปที่การวางแผนเพื่อการฟื้นฟูระบบหรือบริการที่ประสบความสำเร็จหลังจากการหยุดทำงาน เหตุการณ์ หรือภัยพิบัติที่ไม่คาดคิด การจัดการการกำหนดค่าติดตามและรักษาข้อมูลโดยละเอียดเกี่ยวกับส่วนประกอบไอทีทั้งหมดภายในองค์กร การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น"},{"id":375,"topic":1,"q":"Which ITIL component is an ongoing, iterative process of tracking all deployed and configured resources that an organization uses and depends on, whether they are hosted in a traditional data center or a cloud?","qth":"องค์ประกอบ ITIL ใดที่เป็นกระบวนการต่อเนื่องและวนซ้ำในการติดตามทรัพยากรที่ใช้งานและกำหนดค่าทั้งหมดที่องค์กรใช้และขึ้นอยู่กับว่าโฮสต์อยู่ในศูนย์ข้อมูลแบบดั้งเดิมหรือบนคลาวด์","a":["Problem management","Continuity management","Availability management","Configuration management"],"ath":["การจัดการปัญหา","การจัดการความต่อเนื่อง","การจัดการความพร้อมใช้งาน","การจัดการการกำหนดค่า"],"ans":"D","exp":"Configuration management tracks and maintains detailed information about all IT components within an organization. Availability management is focused on making sure system resources, processes, personnel, and toolsets are properly allocated and secured to meet SLA requirements. Continuity management (or business continuity management) is focused on planning for the successful restoration of systems or services after an unexpected outage, incident, or disaster, Problem management is focused on identifying and mitigating known problems and deficiencies before they occur","expth":"การจัดการการกำหนดค่าติดตามและรักษาข้อมูลโดยละเอียดเกี่ยวกับส่วนประกอบไอทีทั้งหมดภายในองค์กร การจัดการความพร้อมใช้งานมุ่งเน้นไปที่การทำให้แน่ใจว่าทรัพยากรระบบ กระบวนการ บุคลากร และชุดเครื่องมือได้รับการจัดสรรอย่างเหมาะสมและปลอดภัยเพื่อให้เป็นไปตามข้อกำหนด SLA การจัดการความต่อเนื่อง (หรือการจัดการความต่อเนื่องทางธุรกิจ) มุ่งเน้นไปที่การวางแผนเพื่อการฟื้นฟูระบบหรือบริการที่ประสบความสำเร็จหลังจากการหยุดทำงาน เหตุการณ์ หรือภัยพิบัติที่ไม่คาดคิด การจัดการปัญหามุ่งเน้นไปที่การระบุและการบรรเทาปัญหาและข้อบกพร่องที่ทราบก่อนที่จะเกิดขึ้น"},{"id":376,"topic":1,"q":"When beginning an audit, both the system owner and the auditors must agree on various aspects of the final audit report Which of the following would NOT be something that is predefined as part of the audit agreement?","qth":"เมื่อเริ่มต้นการตรวจสอบ ทั้งเจ้าของระบบและผู้ตรวจสอบต้องตกลงกันในแง่มุมต่างๆ ของรายงานการตรวจสอบขั้นสุดท้าย ข้อใดต่อไปนี้จะไม่ใช่สิ่งที่ถูกกำหนดไว้ล่วงหน้าโดยเป็นส่วนหนึ่งของข้อตกลงการตรวจสอบ","a":["Size","Format","Structure","Audience"],"ath":["ขนาด","รูปแบบ","โครงสร้าง","ผู้ชม"],"ans":"A","exp":"Explanation The ultimate size of the audit report is not something that would ever be included in the audit scope or definition. Decisions about the content of the report should be the only factor that drives the ultimate size of the report. The structure, audience, and format of the audit report are all crucial elements that must be defined and ag","expth":"คำอธิบาย ขนาดสูงสุดของรายงานการตรวจสอบไม่ใช่สิ่งที่จะรวมอยู่ในขอบเขตหรือคำจำกัดความของการตรวจสอบ การตัดสินใจเกี่ยวกับเนื้อหาของรายงานควรเป็นปัจจัยเดียวที่ขับเคลื่อนขนาดสูงสุดของรายงาน โครงสร้าง ผู้ชม และรูปแบบของรายงานการตรวจสอบล้วนเป็นองค์ประกอบสำคัญที่ต้องกำหนดและ ag"},{"id":378,"topic":1,"q":"Which of the following is the concept of segregating information or processes, within the same system or application, for security reasons?","qth":"ข้อใดต่อไปนี้เป็นแนวคิดของการแยกข้อมูลหรือกระบวนการภายในระบบหรือแอปพลิเคชันเดียวกันด้วยเหตุผลด้านความปลอดภัย","a":["Cell blocking","Sandboxing","Pooling","Fencing"],"ath":["การบล็อกเซลล์","แซนด์บ็อกซ์","การรวมกลุ่ม","ฟันดาบ"],"ans":"B","exp":"Sandboxing involves the segregation and isolation of information or processes from other information or processes within the same system or application, typically for security concerns. Sandboxing is generally used for data isolation (for example, keeping different communities and populations of users isolated from others with similar data). In IT terminology, pooling typically means bringing together and consolidating resources or services, not segregating or separating them. Cell blocking and fencing are both erroneous terms","expth":"แซนด์บ็อกซ์เกี่ยวข้องกับการแยกและการแยกข้อมูลหรือกระบวนการจากข้อมูลหรือกระบวนการอื่นภายในระบบหรือแอปพลิเคชันเดียวกัน ซึ่งโดยทั่วไปแล้วจะเกี่ยวข้องกับข้อกังวลด้านความปลอดภัย โดยทั่วไปแซนด์บ็อกซ์จะใช้สำหรับการแยกข้อมูล (เช่น แยกชุมชนและประชากรของผู้ใช้ที่แตกต่างกันออกจากผู้อื่นที่มีข้อมูลคล้ายกัน) ในคำศัพท์ด้านไอที โดยทั่วไปการรวมกลุ่มหมายถึงการรวบรวมและรวบรวมทรัพยากรหรือบริการ โดยไม่แบ่งแยกหรือแยกออกจากกัน การปิดกั้นเซลล์และการฟันดาบเป็นคำที่ผิดทั้งคู่"},{"id":379,"topic":1,"q":"Which cloud service category most commonly uses client-side key management systems?","qth":"บริการคลาวด์ประเภทใดที่ใช้ระบบการจัดการคีย์ฝั่งไคลเอ็นต์บ่อยที่สุด","a":["Software as a Service","Infrastructure as a Service","Platform as a Service","Desktop as a Service"],"ath":["ซอฟต์แวร์เป็นบริการ","โครงสร้างพื้นฐานเป็นบริการ","แพลตฟอร์มเป็นบริการ","เดสก์ท็อปเป็นบริการ"],"ans":"A","exp":"SaaS most commonly uses client-side key management. With this type of implementation, the software for doing key management is supplied by the cloud provider, but is hosted and run by the cloud customer. This allows for full integration with the SaaS implementation, but also provides full control to the cloud customer. Although the cloud provider may offer software for performing key management to the cloud customers, with the Infrastructure, Platform, and Desktop as a Service categories, the customers would largely be responsible for their own options and implementations and would not be bound by the offerings from the cloud provider","expth":"SaaS มักใช้การจัดการคีย์ฝั่งไคลเอ็นต์มากที่สุด ด้วยการใช้งานประเภทนี้ ซอฟต์แวร์สำหรับจัดการคีย์จะได้รับจากผู้ให้บริการระบบคลาวด์ แต่โฮสต์และดำเนินการโดยลูกค้าระบบคลาวด์ ซึ่งช่วยให้สามารถบูรณาการเข้ากับการใช้งาน SaaS ได้อย่างสมบูรณ์ แต่ยังให้การควบคุมเต็มรูปแบบแก่ลูกค้าระบบคลาวด์อีกด้วย แม้ว่าผู้ให้บริการคลาวด์อาจเสนอซอฟต์แวร์สำหรับดำเนินการจัดการคีย์ให้กับลูกค้าคลาวด์ โดยมีหมวดหมู่โครงสร้างพื้นฐาน แพลตฟอร์ม และเดสก์ท็อปเป็นบริการ ลูกค้าส่วนใหญ่จะรับผิดชอบต่อตัวเลือกและการใช้งานของตนเอง และจะไม่ผูกพันกับข้อเสนอจากผู้ให้บริการคลาวด์"},{"id":380,"topic":1,"q":"Apart from using encryption at the file system level, what technology is the most widely used to protect data stored in an object storage system?","qth":"นอกเหนือจากการใช้การเข้ารหัสในระดับระบบไฟล์ เทคโนโลยีใดที่ใช้กันอย่างแพร่หลายมากที่สุดในการปกป้องข้อมูลที่จัดเก็บไว้ในระบบจัดเก็บข้อมูลออบเจ็กต์","a":["TLS","HTTPS","VPN","IRM"],"ath":["TLS","HTTPS","VPN","IRM"],"ans":"D","exp":"Information rights management (IRM) technologies allow security controls and policies to be enforced on a data object regardless of where it resides. They also allow for extended controls such as expirations and copying restrictions, which are not available through traditional control mechanisms. Hypertext Transfer Protocol Secure (HTTPS), virtual private network (VPN), and Transport Layer Security (TLS) are all technologies and protocols that are widely used with cloud implementations for secure access to systems and services and likely will be used in conjunction with other object data protection strategies","expth":"เทคโนโลยีการจัดการสิทธิ์ในข้อมูล (IRM) ช่วยให้สามารถบังคับใช้การควบคุมความปลอดภัยและนโยบายกับออบเจ็กต์ข้อมูลได้ไม่ว่าวัตถุข้อมูลจะอยู่ที่ใดก็ตาม นอกจากนี้ยังอนุญาตให้มีการควบคุมเพิ่มเติม เช่น การหมดอายุและการจำกัดการคัดลอก ซึ่งไม่สามารถทำได้ผ่านกลไกการควบคุมแบบดั้งเดิม Hypertext Transfer Protocol Secure (HTTPS), เครือข่ายส่วนตัวเสมือน (VPN) และ Transport Layer Security (TLS) เป็นเทคโนโลยีและโปรโตคอลทั้งหมดที่ใช้กันอย่างแพร่หลายกับการใช้งานระบบคลาวด์เพื่อการเข้าถึงระบบและบริการอย่างปลอดภัย และมีแนวโน้มที่จะใช้ร่วมกับกลยุทธ์การปกป้องข้อมูลอ็อบเจ็กต์อื่น ๆ"},{"id":381,"topic":1,"q":"Which of the following types of data would fall under data rights management (DRM) rather than information rights management (IRM)?","qth":"ข้อมูลประเภทใดต่อไปนี้ที่จะอยู่ภายใต้การจัดการสิทธิ์ในข้อมูล (DRM) มากกว่าการจัดการสิทธิ์ในข้อมูล (IRM)?","a":["Personnel data","Security profiles","Publications","Financial records"],"ath":["ข้อมูลบุคลากร","โปรไฟล์ความปลอดภัย","สิ่งพิมพ์","บันทึกทางการเงิน"],"ans":"C","exp":"Whereas IRM is used to protect a broad range of data, DRM is focused specifically on the protection of consumer media, such as publications, music, movies, and so on. IRM is used to protect general institution data, so financial records, personnel data, and security profiles would all fall under the auspices of IRM","expth":"ในขณะที่ IRM ถูกใช้เพื่อปกป้องข้อมูลที่หลากหลาย DRM มุ่งเน้นไปที่การปกป้องสื่อผู้บริโภคโดยเฉพาะ เช่น สิ่งพิมพ์ เพลง ภาพยนตร์ และ ต่อไป IRM ถูกใช้เพื่อปกป้องข้อมูลสถาบันทั่วไป ดังนั้นบันทึกทางการเงิน ข้อมูลบุคลากร และโปรไฟล์ความปลอดภัยทั้งหมดจะอยู่ภายใต้การอุปถัมภ์ของ IRM"},{"id":382,"topic":1,"q":"Different security testing methodologies offer different strategies and approaches to testing systems, requiring security personnel to determine the best type to use for their specific circumstances. What does dynamic application security testing (DAST) NOT entail that SAST does?","qth":"วิธีการทดสอบความปลอดภัยที่แตกต่างกันนำเสนอกลยุทธ์และแนวทางที่แตกต่างกันในการทดสอบระบบ โดยกำหนดให้เจ้าหน้าที่รักษาความปลอดภัยกำหนดประเภทที่ดีที่สุดที่จะใช้สำหรับสถานการณ์เฉพาะของตน การทดสอบความปลอดภัยของแอปพลิเคชันแบบไดนามิก (DAST) ไม่ได้หมายความว่า SAST จะทำอะไรบ้าง","a":["Discovery","Knowledge of the system","Scanning","Probing"],"ath":["Discovery","Knowledge of the system","Scanning","Probing"],"ans":"B","exp":"Dynamic application security testing (DAST) is considered \"black-box\" testing and begins with no inside knowledge of the application or its configurations Everything about it must be discovered during its testing. As with most types of testing, dynamic application security testing (DAST) involves probing, scanning, and a discovery process for system information","expth":"Dynamic application security testing (DAST) is considered \"black-box\" testing and begins with no inside knowledge of the application or its configurations Everything about it must be discovered during its testing. As with most types of testing, dynamic application security testing (DAST) involves probing, scanning, and a discovery process for system information"},{"id":383,"topic":1,"q":"You need to gain approval to begin moving your company's data and systems into a cloud environment. However, your CEO has mandated the abilty to easily remove your IT assets from the cloud provider as a precondition Which of the following cloud concepts would this pertain to?","qth":"You need to gain approval to begin moving your company's data and systems into a cloud environment. However, your CEO has mandated the abilty to easily remove your IT assets from the cloud provider as a precondition Which of the following cloud concepts would this pertain to?","a":["Removebility","Extraction","Portability","Reversibility"],"ath":["Removebility","Extraction","Portability","Reversibility"],"ans":"D","exp":"Reversibility is the cloud concept involving the ability for a cloud customer to remove all of its data and IT assets from a cloud provider. Also, processes and agreements would be in place with the cloud provider that ensure all removals have been completed fully within the ag","expth":"Reversibility is the cloud concept involving the ability for a cloud customer to remove all of its data and IT assets from a cloud provider. Also, processes and agreements would be in place with the cloud provider that ensure all removals have been completed fully within the ag"},{"id":384,"topic":1,"q":"What does static application security testing (SAST) offer as a tool to the testers that makes it unique compared to other common security testing methodologies?","qth":"What does static application security testing (SAST) offer as a tool to the testers that makes it unique compared to other common security testing methodologies?","a":["Live testing","Source code access","Production system scanning","Injection attempts"],"ath":["Live testing","Source code access","Production system scanning","Injection attempts"],"ans":"B","exp":"Static application security testing (SAST) is conducted against offline systems with previous knowledge of them, including their source code. Live testing is not part of static testing but rather is associated with dynamic testing. Production system scanning is not appropriate because static testing is done against offline systems Injection attempts are done with many different types of testing and are not unique to one particular type. It is therefore not the best answer to the question","expth":"Static application security testing (SAST) is conducted against offline systems with previous knowledge of them, including their source code. Live testing is not part of static testing but rather is associated with dynamic testing. Production system scanning is not appropriate because static testing is done against offline systems Injection attempts are done with many different types of testing and are not unique to one particular type. It is therefore not the best answer to the question"},{"id":385,"topic":1,"q":"A main objective when utilizing cloud services is to avoid vendor lock-in. Which core concept of cloud computing is most related to vendor lock-in?","qth":"A main objective when utilizing cloud services is to avoid vendor lock-in. Which core concept of cloud computing is most related to vendor lock-in?","a":["Scalability","Interoperability","Portability","Reversibility"],"ath":["Scalability","Interoperability","Portability","Reversibility"],"ans":"C","exp":"Portability is the ability for a cloud customer to easily move their systems, services, and applications among different cloud providers. By avoiding reliance on proprietary APIs and other vendor-specific cloud features, an organization can maintain flexibility to move among the various cloud providers with greater ease. Reversibility refers to the ability for a cloud customer to quickly and easy remove all their services and data from a cloud provider. Interoperability is the ability to reuse services and components for other applications and uses. Scalability refers to the ability of a cloud environment to add or remove resources to meet current demands","expth":"Portability is the ability for a cloud customer to easily move their systems, services, and applications among different cloud providers. By avoiding reliance on proprietary APIs and other vendor-specific cloud features, an organization can maintain flexibility to move among the various cloud providers with greater ease. Reversibility refers to the ability for a cloud customer to quickly and easy remove all their services and data from a cloud provider. Interoperability is the ability to reuse services and components for other applications and uses. Scalability refers to the ability of a cloud environment to add or remove resources to meet current demands"},{"id":386,"topic":1,"q":"Which of the following areas of responsibility always falls completely under the purview of the cloud provider, regardless of which cloud service category is used?","qth":"Which of the following areas of responsibility always falls completely under the purview of the cloud provider, regardless of which cloud service category is used?","a":["Infrastructure","Data","Physical","Governance"],"ath":["Infrastructure","Data","Physical","Governance"],"ans":"C","exp":"Regardless of the cloud service category used, the physical environment is always the sole responsibility of the cloud provider. In many instances, the cloud provider will supply audit reports or some general information about their physical security practices, especially to those customers or potential customers that may have regulatory requirements, but otherwise the cloud customer will have very little insight into the physical environment. With laaS, the infrastructure is a shared responsibility between the cloud provider and cloud customer. With all cloud service categories, the data and governance are always the sole responsibility of the cloud customer,","expth":"Regardless of the cloud service category used, the physical environment is always the sole responsibility of the cloud provider. In many instances, the cloud provider will supply audit reports or some general information about their physical security practices, especially to those customers or potential customers that may have regulatory requirements, but otherwise the cloud customer will have very little insight into the physical environment. With laaS, the infrastructure is a shared responsibility between the cloud provider and cloud customer. With all cloud service categories, the data and governance are always the sole responsibility of the cloud customer,"},{"id":387,"topic":1,"q":"What type of masking would you employ to produce a separate data set for testing purposes based on production data without any sensitive information?","qth":"What type of masking would you employ to produce a separate data set for testing purposes based on production data without any sensitive information?","a":["Dynamic","Tokenized","Replicated","Static"],"ath":["Dynamic","Tokenized","Replicated","Static"],"ans":"D","exp":"Static masking involves taking a data set and replacing sensitive fields and values with non-sensitive or garbage data. This is done to enable testing of an application against data that resembles production data, both in size and format, but without containing anything sensitive. Dynamic masking involves the live and transactional masking of data while an application is using it. Tokenized would refer to tokenization, which is the replacing of sensitive data with a key value that can later be matched back to the original value, and although it could be used as part of the production of test data, it does not refer to the overall process Replicated is provided as an erroneous answer, as replicated data would be identical in value and would not accomplish the production of a test set","expth":"Static masking involves taking a data set and replacing sensitive fields and values with non-sensitive or garbage data. This is done to enable testing of an application against data that resembles production data, both in size and format, but without containing anything sensitive. Dynamic masking involves the live and transactional masking of data while an application is using it. Tokenized would refer to tokenization, which is the replacing of sensitive data with a key value that can later be matched back to the original value, and although it could be used as part of the production of test data, it does not refer to the overall process Replicated is provided as an erroneous answer, as replicated data would be identical in value and would not accomplish the production of a test set"},{"id":388,"topic":1,"q":"Which aspect of data poses the biggest challenge to using automated tools for data discovery and programmatic data classification?","qth":"Which aspect of data poses the biggest challenge to using automated tools for data discovery and programmatic data classification?","a":["Quantity","Language","Quality","Number of courses"],"ath":["Quantity","Language","Quality","Number of courses"],"ans":"C","exp":"The biggest challenge for properly using any programmatic tools in data discovery is the actual quality of the data, including the data being uniform and well structured, labels being properly applied, and other similar facets. Without data being organized in such a manner, it is extremely difficult for programmatic tools to automatically synthesize and make determinations from it. The overall quantity of data, as well as the number of sources, does not pose an enormous challenge for data discovery programs, other than requiring a longer time to process the data. The language of the data itself should not matter to a program that is designed to process it, as long as the data is well formed and consistent","expth":"The biggest challenge for properly using any programmatic tools in data discovery is the actual quality of the data, including the data being uniform and well structured, labels being properly applied, and other similar facets. Without data being organized in such a manner, it is extremely difficult for programmatic tools to automatically synthesize and make determinations from it. The overall quantity of data, as well as the number of sources, does not pose an enormous challenge for data discovery programs, other than requiring a longer time to process the data. The language of the data itself should not matter to a program that is designed to process it, as long as the data is well formed and consistent"},{"id":389,"topic":1,"q":"When an organization is considering a cloud environment for hosting BCDR solutions, which of the following would be the greatest concern?","qth":"When an organization is considering a cloud environment for hosting BCDR solutions, which of the following would be the greatest concern?","a":["Self-service","Resource pooling","Availabilty","Location"],"ath":["Self-service","Resource pooling","Availabilty","Location"],"ans":"D","exp":"If an organization wants to use a cloud service for BCDR, the location of the cloud hosting becomes a very important security consideration due to regulations and jurisdiction, which could be dramatically different from the organization's normal hosting locations. Availability is a hallmark of any cloud service provider, and likely will not be a prime consideration when an organization is considering using a cloud for BCDR; the same goes for self-service options. Resource pooling is common among all cloud systems and would not be a concern when an organization is dealing with the provisioning of resources during a disaster","expth":"If an organization wants to use a cloud service for BCDR, the location of the cloud hosting becomes a very important security consideration due to regulations and jurisdiction, which could be dramatically different from the organization's normal hosting locations. Availability is a hallmark of any cloud service provider, and likely will not be a prime consideration when an organization is considering using a cloud for BCDR; the same goes for self-service options. Resource pooling is common among all cloud systems and would not be a concern when an organization is dealing with the provisioning of resources during a disaster"},{"id":390,"topic":1,"q":"Just lke the risk management process, the BCDR planning process has a defined sequence of steps and processes to follow to ensure the production of a comprehensive and successful plan Which of the following is the correct sequence of steps for a BCDR plan?","qth":"Just lke the risk management process, the BCDR planning process has a defined sequence of steps and processes to follow to ensure the production of a comprehensive and successful plan Which of the following is the correct sequence of steps for a BCDR plan?","a":["Define scope, gather requirements, assess risk, implement","Define scope, gather requirements, implement, assess risk","Gather requirements, define scope, implement, assess risk","Gather requirements, define scope, assess risk, implement"],"ath":["Define scope, gather requirements, assess risk, implement","Define scope, gather requirements, implement, assess risk","Gather requirements, define scope, implement, assess risk","Gather requirements, define scope, assess risk, implement"],"ans":"A","exp":"The correct sequence for a BCDR plan is to define the scope, gather requirements based on the scope, assess overall risk, and implement the plan. The other sequences provided are not in the correct order","expth":"The correct sequence for a BCDR plan is to define the scope, gather requirements based on the scope, assess overall risk, and implement the plan. The other sequences provided are not in the correct order"},{"id":391,"topic":1,"q":"What type of solution is at the core of virtually all directory services?","qth":"What type of solution is at the core of virtually all directory services?","a":["AWS","LDAP","ADFS","PKI"],"ath":["AWS","LDAP","ADFS","PKI"],"ans":"B","exp":"The Lightweight Directory Access Protocol (LDAP) forms the basis of virtually all directory services, regardless of the specific vendor or software package. WS is a protocol for information exchange between two systems and does not actually store the data. ADFS is a Windows component for enabling single sign-on for the operating system and applications, but it relies on data from an LDAP server. PKI is used for managing and issuing security certificates","expth":"The Lightweight Directory Access Protocol (LDAP) forms the basis of virtually all directory services, regardless of the specific vendor or software package. WS is a protocol for information exchange between two systems and does not actually store the data. ADFS is a Windows component for enabling single sign-on for the operating system and applications, but it relies on data from an LDAP server. PKI is used for managing and issuing security certificates"},{"id":392,"topic":1,"q":"The different cloud service models have varying levels of responsibilities for functions and operations depending with the model's level of service In which of the following models would the responsibility for patching lie predominantly with the cloud customer?","qth":"The different cloud service models have varying levels of responsibilities for functions and operations depending with the model's level of service In which of the following models would the responsibility for patching lie predominantly with the cloud customer?","a":["DaaS","SaaS","PaaS","laas"],"ath":["DaaS","SaaS","PaaS","laas"],"ans":"D","exp":"With Infrastructure as a Service ([aaS), the cloud customer is responsible for deploying and maintaining its own systems and virtual machines. Therefore, the customer is solely responsible for patching and any other security updates it finds necessary. With Software as a Service (SaaS), Platform as a Service (PaaS), and Desktop as a Service (DaaS), the cloud provider maintains the infrastructure components and is responsible for maintaining and patching them","expth":"With Infrastructure as a Service ([aaS), the cloud customer is responsible for deploying and maintaining its own systems and virtual machines. Therefore, the customer is solely responsible for patching and any other security updates it finds necessary. With Software as a Service (SaaS), Platform as a Service (PaaS), and Desktop as a Service (DaaS), the cloud provider maintains the infrastructure components and is responsible for maintaining and patching them"},{"id":393,"topic":1,"q":"Which component of ITIL involves the creation of an RFC ticket and obtaining official approvals for it?","qth":"Which component of ITIL involves the creation of an RFC ticket and obtaining official approvals for it?","a":["Problem management","Release management","Deployment management","Change management"],"ath":["Problem management","Release management","Deployment management","Change management"],"ans":"D","exp":"The change management process involves the creation of the official Request for Change (RFC) ticket, which is used to document the change, obtain the required approvals from management and stakeholders, and track the change to completion. Release management is a subcomponent of change management, where the actual code or configuration change is put into place. Deployment management is similar to release management, but it's where changes are actually implemented on systems. Problem management is focused on the identification and mitigation of known problems and deficiencies before they are able to occur","expth":"The change management process involves the creation of the official Request for Change (RFC) ticket, which is used to document the change, obtain the required approvals from management and stakeholders, and track the change to completion. Release management is a subcomponent of change management, where the actual code or configuration change is put into place. Deployment management is similar to release management, but it's where changes are actually implemented on systems. Problem management is focused on the identification and mitigation of known problems and deficiencies before they are able to occur"},{"id":394,"topic":1,"q":"Which of the following are attributes of cloud computing?","qth":"Which of the following are attributes of cloud computing?","a":["Minimal management effort and shared resources","High cost and unique resources","Rapid provisioning and slow release of resources","Limited access and service provider interaction"],"ath":["Minimal management effort and shared resources","High cost and unique resources","Rapid provisioning and slow release of resources","Limited access and service provider interaction"],"ans":"A","exp":"Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (e.9., networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction","expth":"Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (e.9., networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction"},{"id":395,"topic":1,"q":"In a cloud environment, encryption should be used for al the following, except","qth":"In a cloud environment, encryption should be used for al the following, except","a":["Secure sessions/VPN","Long-term storage of data","Near-term storage of virtualized images","Profile formatting"],"ath":["Secure sessions/VPN","Long-term storage of data","Near-term storage of virtualized images","Profile formatting"],"ans":"D","exp":"Allof these activities should incorporate encryption, except for profile formatting, which is a made-up term,","expth":"Allof these activities should incorporate encryption, except for profile formatting, which is a made-up term,"},{"id":396,"topic":1,"q":"Which of the following is considered a technological control?","qth":"Which of the following is considered a technological control?","a":["Firewall software","Firing personnel","Fireproof safe","Fire extinguisher"],"ath":["Firewall software","Firing personnel","Fireproof safe","Fire extinguisher"],"ans":"A","exp":"A firewall is a technological control. The safe and extinguisher are physical controls and firing someone is an administrative control","expth":"A firewall is a technological control. The safe and extinguisher are physical controls and firing someone is an administrative control"},{"id":397,"topic":1,"q":"When using an laaS solution, what is the capability provided to the customer?","qth":"When using an laaS solution, what is the capability provided to the customer?","a":["To provision processing, storage, networks, and other fundamental computing resources when the consumer is able to deploy and run arbitrary software, which can include OSs and applications","To provision processing, storage, networks, and other fundamental computing resources when the auditor is able to deploy and run arbitrary software, which can include OSs and applications","To provision processing, storage, networks, and other fundamental computing resources when the provider is able to deploy and run arbitrary software, which can include OSs and applications","To provision processing, storage, networks, and other fundamental computing resources when the consumer is not able to deploy and run arbitrary software, which can include OSs and applications"],"ath":["To provision processing, storage, networks, and other fundamental computing resources when the consumer is able to deploy and run arbitrary software, which can include OSs and applications","To provision processing, storage, networks, and other fundamental computing resources when the auditor is able to deploy and run arbitrary software, which can include OSs and applications","To provision processing, storage, networks, and other fundamental computing resources when the provider is able to deploy and run arbitrary software, which can include OSs and applications","To provision processing, storage, networks, and other fundamental computing resources when the consumer is not able to deploy and run arbitrary software, which can include OSs and applications"],"ans":"A","exp":"According to 2€The NIST Definition of Cloud Computing,2€ in laaS, €the capability provided to the consumer is to provision processing, storage, networks, and other fundamental computing resources where the consumer is able to deploy and run arbitrary software, which can include operating systems and applications The consumer does not manage or control the underlying cloud infrastructure but has control over operating systems, storage, and deployed applications; and possibly limited control of select networking components (e.9., host firewalls)","expth":"According to 2€The NIST Definition of Cloud Computing,2€ in laaS, €the capability provided to the consumer is to provision processing, storage, networks, and other fundamental computing resources where the consumer is able to deploy and run arbitrary software, which can include operating systems and applications The consumer does not manage or control the underlying cloud infrastructure but has control over operating systems, storage, and deployed applications; and possibly limited control of select networking components (e.9., host firewalls)"},{"id":398,"topic":1,"q":"When using an laaS solution, what is a key benefit provided to the customer?","qth":"When using an laaS solution, what is a key benefit provided to the customer?","a":["Metered and priced on the basis of units consumed","Increased energy and cooling system efficiencies","Transferred cost of ownership","The ability to scale up infrastructure services based on projected usage"],"ath":["Metered and priced on the basis of units consumed","Increased energy and cooling system efficiencies","Transferred cost of ownership","The ability to scale up infrastructure services based on projected usage"],"ans":"D","exp":"laaS has a number of key benefits for organizations, which include but are not limited to these: ~ - Usage is metered and priced on the basis of units (or instances) consumed. This can also be billed back to specific departments or functions. Ithas an ability to scale up and down infrastructure services based on actual usage. This is particularly useful and beneficial where there are significant spikes and dips within the usage curve for infrastructure. Ithas a reduced cost of ownership. There is no need to buy assets for everyday use, no loss of asset value over time, and reduced costs of maintenance and support. It has a reduced energy and cooling costs along with x€green IT3€ environment effect with optimum use of IT resources and systems","expth":"laaS has a number of key benefits for organizations, which include but are not limited to these: ~ - Usage is metered and priced on the basis of units (or instances) consumed. This can also be billed back to specific departments or functions. Ithas an ability to scale up and down infrastructure services based on actual usage. This is particularly useful and beneficial where there are significant spikes and dips within the usage curve for infrastructure. Ithas a reduced cost of ownership. There is no need to buy assets for everyday use, no loss of asset value over time, and reduced costs of maintenance and support. It has a reduced energy and cooling costs along with x€green IT3€ environment effect with optimum use of IT resources and systems"},{"id":399,"topic":1,"q":"Which of the following is considered an administrative control?","qth":"Which of the following is considered an administrative control?","a":["Keystroke logging","Access control process","Door locks","Biometric authentication"],"ath":["Keystroke logging","Access control process","Door locks","Biometric authentication"],"ans":"B","exp":"A process is an administrative control, sometimes, the process includes elements of other types of controls (in this case, the access control mechanism might be a technical control, or it might be a physical control), but the process itself is administrative. Keystroke logging is a technical control (or an attack, if done for malicious, purposes, and not for auditing); door locks are a physical control; and biometric authentication is a technological control","expth":"A process is an administrative control, sometimes, the process includes elements of other types of controls (in this case, the access control mechanism might be a technical control, or it might be a physical control), but the process itself is administrative. Keystroke logging is a technical control (or an attack, if done for malicious, purposes, and ing customer requirements and demands. Whether public cloud, private cloud, local hypervisor, or bare metal, supporting multiple hosting environments allows the applica"},{"id":401,"topic":1,"q":"In which cloud service model is the customer required to maintain the OS?","qth":"In which cloud service model is the customer required to maintain the OS?","a":["laas","CaaS","PaaS","SaaS"],"ath":["laas","CaaS","PaaS","SaaS"],"ans":"A","exp":"In laaS, the service is bare metal, and the customer has to install the OS and the software; the customer then is responsible for maintaining that OS. In the other models, the provider installs and maintains the OS","expth":"In laaS, the service is bare metal, and the customer has to install the OS and the software; the customer then is responsible for maintaining that OS. In the other models, the provider installs and maintains the OS"},{"id":402,"topic":1,"q":"When using a PaaS solution, what is the capability provided to the customer?","qth":"When using a PaaS solution, what is the capability provided to the customer?","a":["To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The provider does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment","To deploy onto the cloud infrastructure consumer-created or acquired applications created using programming languages, libraries, services, and tools that the provider supports. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, or storage, but has control over the deployed applications and possibly configuration settings for the application-hosting environment","To deploy onto the cloud infrastructure consum
