ยเจ้าของหรือผู้ให้บริการแอปพลิเคชันที่เชื่อถือได้ การกำหนดค่าความปลอดภัยที่ไม่ถูกต้องเกิดขึ้นเมื่อแอปพลิเคชันและระบบไม่ได้รับการกำหนดค่าอย่างเหมาะสมเพื่อความปลอดภัย ซึ่งมักเป็นผลมาจากการใช้งานที่ไม่ถูกต้องหรือพื้นฐานที่ไม่เพียงพอ การอ้างอิงอ็อบเจ็กต์โดยตรงที่ไม่ปลอดภัยเกิดขึ้นเมื่อโค้ดอ้างอิงลักษณะของโครงสร้างพื้นฐาน โดยเฉพาะระบบภายในหรือส่วนตัว"},{"id":79,"topic":1,"q":"Which publication from the United States National Institute of Standards and Technology pertains to defining cloud concepts and definitions for the various core components of cloud computing?","qth":"สิ่งพิมพ์ใดจาก United States National Institute of Standards and Technology ที่เกี่ยวข้องกับการกำหนดแนวคิดและคำจำกัดความของคลาวด์สำหรับส่วนประกอบหลักต่างๆ ของการประมวลผลแบบคลาวด์","a":["SP 800-153","SP 800-145","SP 800-53","SP 800-40"],"ath":["SP 800-153","SP 800-145","SP 800-53","SP 800-40"],"ans":"B","exp":"NIST Special Publications 800-145 is titled \"The NIST Definition of Cloud Computing” and contains definitions and explanations of core cloud concepts and components","expth":"NIST Special Publications 800-145 มีชื่อว่า \"คำจำกัดความ NIST ของ Cloud Computing\" และมีคำจำกัดความและคำอธิบายเกี่ยวกับแนวคิดและส่วนประกอบหลักของระบบคลาวด์"},{"id":80,"topic":1,"q":"What is the biggest negative to leasing space in a data center versus building or maintain your own?","qth":"อะไรคือผลเสียที่ใหญ่ที่สุดต่อการเช่าพื้นที่ในศูนย์ข้อมูลเมื่อเทียบกับการสร้างหรือบำรุงรักษาพื้นที่ของคุณเอง","a":["Costs","Control","Certification","Regulation"],"ath":["ต้นทุน","การควบคุม","การรับรอง","กฎระเบียบ"],"ans":"B","exp":"When leasing space in a data center, an organization will give up a large degree of control as to how itis built and maintained, and instead must conform to the policies and procedures of the owners and operators of the data center","expth":"เมื่อเช่าพื้นที่ในศูนย์ข้อมูล องค์กรจะละทิ้งการควบคุมในระดับสูงเกี่ยวกับวิธีการสร้างและบำรุงรักษา และจะต้องสอดคล้องกับนโยบายและขั้นตอนของเจ้าของและผู้ปฏิบัติงานของศูนย์ข้อมูลแทน"},{"id":81,"topic":1,"q":"Which aspect of archiving must be tested regularly for the duration of retention requirements?","qth":"แง่มุมใดของการเก็บถาวรที่ต้องได้รับการทดสอบเป็นประจำตามระยะเวลาของข้อกำหนดในการเก็บรักษา","a":["Availabilty","Recoverability","Auditabilty","Portability"],"ath":["ความพร้อมใช้งาน","ความสามารถในการกู้คืน","ความสามารถในการตรวจสอบ","การพกพา"],"ans":"B","exp":"In order for any archiving system to be deemed useful and compliant, regular tests must be performed to ensure the data can still be recovered and accessible, should it ever be needed, for the duration of the retention requirements","expth":"เพื่อให้ระบบการเก็บถาวรใดๆ ถือว่ามีประโยชน์และเป็นไปตามข้อกำหนด ต้องทำการทดสอบเป็นประจำเพื่อให้แน่ใจว่าข้อมูลยังคงสามารถกู้คืนและเข้าถึงได้ หากจำเป็น ในช่วงระยะเวลาของข้อกำหนดในการเก็บรักษา"},{"id":82,"topic":1,"q":"Which of the following represents a minimum guaranteed resource within a cloud environment for the cloud customer?","qth":"ข้อใดต่อไปนี้แสดงถึงทรัพยากรที่มีการรับประกันขั้นต่ำภายในสภาพแวดล้อมระบบคลาวด์สำหรับลูกค้าระบบคลาวด์","a":["Reservation","Share","Limit","Provision"],"ath":["การจอง","แบ่งปัน","ขีดจำกัด","การเตรียมการ"],"ans":"A","exp":"A reservation is a minimum resource that is guaranteed to a customer within a cloud environment. Within a cloud, a reservation can pertain to the two main aspects of computing: memory and processor. With a reservation in place, the cloud provider guarantees that a cloud customer will always have at minimum the necessary resources available to power on and operate any of their services","expth":"การจองคือทรัพยากรขั้นต่ำที่รับประกันให้กับลูกค้าภายในสภาพแวดล้อมระบบคลาวด์ ภายในระบบคลาวด์ การสำรองอาจเกี่ยวข้องกับสองส่วนหลักของการประมวลผล: หน่วยความจำและโปรเซสเซอร์ ด้วยการจองไว้ ผู้ให้บริการคลาวด์รับประกันว่าลูกค้าคลาวด์จะมีทรัพยากรที่จำเป็นเป็นอย่างน้อยเสมอสำหรับการเปิดและดำเนินการบริการใดๆ ของพวกเขา"},{"id":83,"topic":1,"q":"When isa virtual machine susceptible to attacks while a physical server in the same state would not be?","qth":"เมื่อใดที่เครื่องเสมือนเสี่ยงต่อการถูกโจมตีในขณะที่เซิร์ฟเวอร์จริงในสถานะเดียวกันจะไม่เป็นเช่นนั้น","a":["When it is behind a WAF","When it is behind an IPS","When it is not patched","When it is powered off"],"ath":["เมื่ออยู่หลัง WAF","เมื่ออยู่หลัง IPS","เมื่อไม่ได้แพตช์","เมื่อปิดเครื่อง"],"ans":"D","exp":"A virtual machine is ultimately an image file residing a file system. Because of this, even when a virtual machine is \"powered off it is still susceptible to attacks and modification. A physical server that is powered off would not be susceptible to attacks","expth":"ในที่สุดเครื่องเสมือนจะเป็นไฟล์รูปภาพที่อยู่ในระบบไฟล์ ด้วยเหตุนี้ แม้ว่าเครื่องเสมือนจะ \"ปิดเครื่องแล้ว แต่ก็ยังเสี่ยงต่อการถูกโจมตีและแก้ไขได้ เซิร์ฟเวอร์จริงที่ปิดอยู่จะไม่เสี่ยงต่อการถูกโจมตี\""},{"id":84,"topic":1,"q":"Which of the following threat types involves an application developer leaving references to internal information and configurations in code that is exposed to the client?","qth":"ภัยคุกคามประเภทใดต่อไปนี้เกี่ยวข้องกับนักพัฒนาแอปพลิเคชันที่ทิ้งการอ้างอิงไปยังข้อมูลภายในและการกำหนดค่าไว้ในโค้ดที่เปิดเผยต่อไคลเอนต์","a":["Sensitive data exposure","Security misconfiguration","Insecure direct object references","Unvalidated redirect and forwards"],"ath":["การเปิดเผยข้อมูลที่ละเอียดอ่อน","การกำหนดค่าความปลอดภัยไม่ถูกต้อง","การอ้างอิงวัตถุโดยตรงที่ไม่ปลอดภัย","การเปลี่ยนเส้นทางที่ไม่ถูกต้องและการส่งต่อ"],"ans":"C","exp":"An insecure direct object reference occurs when a developer has in their code a reference to something on the application side, such as a database key, the directory structure of the application, configuration information about the hosting system, or any other information that pertains to the workings of the application that should not be exposed to users or the network. Unvalidated redirects and forwards occur when an application has functions to forward users to other sites, and these functions are not properly secured to validate the data and redirect requests, allowing spoofing for malware of phishing attacks. Sensitive data exposure occurs when an application does not use sufficient encryption and other security controls to protect sensitive application data. Security misconfiguration","expth":"การอ้างอิงวัตถุโดยตรงที่ไม่ปลอดภัยเกิดขึ้นเมื่อนักพัฒนามีการอ้างอิงถึงบางสิ่งบางอย่างในฝั่งแอปพลิเคชันในโค้ด เช่นคีย์ฐานข้อมูล โครงสร้างไดเรกทอรีของแอปพลิเคชัน ข้อมูลการกำหนดค่าเกี่ยวกับระบบโฮสติ้ง หรือข้อมูลอื่นใดที่เกี่ยวข้องกับการทำงานของแอปพลิเคชันที่ไม่ควรเปิดเผยต่อผู้ใช้หรือเครือข่าย การเปลี่ยนเส้นทางและการส่งต่อที่ไม่ถูกต้องเกิดขึ้นเมื่อแอปพลิเคชันมีฟังก์ชันในการส่งต่อผู้ใช้ไปยังไซต์อื่น และฟังก์ชันเหล่านี้ไม่ได้รับการรักษาความปลอดภัยอย่างเหมาะสมในการตรวจสอบข้อมูลและคำขอเปลี่ยนเส้นทาง ทำให้เกิดการปลอมแปลงมัลแวร์จากการโจมตีแบบฟิชชิ่ง การเปิดเผยข้อมูลที่ละเอียดอ่อนเกิดขึ้นเมื่อแอปพลิเคชันไม่ได้ใช้การเข้ารหัสที่เพียงพอและการควบคุมความปลอดภัยอื่นๆ เพื่อปกป้องข้อมูลแอปพลิเคชันที่ละเอียดอ่อน การกำหนดค่าความปลอดภัยไม่ถูกต้อง"},{"id":85,"topic":1,"q":"Which of the following is the biggest concern or challenge with using encryption?","qth":"ข้อใดต่อไปนี้เป็นข้อกังวลหรือความท้าทายที่ใหญ่ที่สุดในการใช้การเข้ารหัส","a":["Dependence on keys","Cipher strength","Efficiency","Protocol standards"],"ath":["การพึ่งพาคีย์","ความแข็งแกร่งของการเข้ารหัส","ประสิทธิภาพ","มาตรฐานโปรโตคอล"],"ans":"A","exp":"No matter what kind of application, system, or hosting model used, encryption is 100 percent dependent on encryption keys. Properly securing the keys and the exchange of them is the biggest and most important challenge of encryption systems","expth":"ไม่ว่าจะใช้แอปพลิเคชัน ระบบ หรือโมเดลโฮสติ้งประเภทใด การเข้ารหัสจะขึ้นอยู่กับคีย์การเข้ารหัส 100 เปอร์เซ็นต์ การรักษาความปลอดภัยคีย์และการแลกเปลี่ยนอย่างเหมาะสมถือเป็นความท้าทายที่ใหญ่ที่สุดและสำคัญที่สุดของระบบการเข้ารหัส"},{"id":86,"topic":1,"q":"Which of the following would NOT be considered part of resource pooling with an Infrastructure as a Service implementation?","qth":"ข้อใดต่อไปนี้จะไม่ถือว่าเป็นส่วนหนึ่งของการรวมทรัพยากรด้วยโครงสร้างพื้นฐานเป็นการใช้งานบริการ","a":["Storage","Application","Mamory","CPU"],"ath":["พื้นที่เก็บข้อมูล","แอปพลิเคชัน","Mamory","CPU"],"ans":"B","exp":"Infrastructure as a Service pools the compute resources for platforms and applications to build upon, including CPU, memory, and storage. Applications are not part of an laaS offering from the cloud provider","expth":"โครงสร้างพื้นฐานในฐานะบริการจะรวบรวมทรัพยากรการประมวลผลสำหรับแพลตฟอร์มและแอปพลิเคชันที่จะสร้างต่อ รวมถึง CPU หน่วยความจำ และพื้นที่เก็บข้อมูล แอปพลิเคชันไม่ได้เป็นส่วนหนึ่งของข้อเสนอ laaS จากผู้ให้บริการคลาวด์"},{"id":87,"topic":1,"q":"Which technology is NOT commonly used for security with data in transit?","qth":"เทคโนโลยีใดที่ไม่ได้ใช้กันโดยทั่วไปเพื่อความปลอดภัยของข้อมูลที่อยู่ระหว่างการส่ง","a":["DNSSEC","IPsec","VPN","HTTPS"],"ath":["DNSSEC","IPsec","VPN","HTTPS"],"ans":"A","exp":"DNSSEC relates to the integrity of DNS resolutions and the prevention of spoofing or redirection, and does not pertain to the actual security of transmissions or the protection of data","expth":"DNSSEC เกี่ยวข้องกับความสมบูรณ์ของการแก้ไข DNS และการป้องกันการปลอมแปลงหรือการเปลี่ยนเส้นทาง และไม่เกี่ยวข้องกับความปลอดภัยที่แท้จริงของการส่งข้อมูลหรือการปกป้องข้อมูล"},{"id":88,"topic":1,"q":"Which of the following roles is responsible for gathering metrics on cloud services and managing cloud deployments and the deployment processes?","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการรวบรวมตัวชี้วัดบนบริการคลาวด์และการจัดการการปรับใช้คลาวด์และกระบวนการปรับใช้?","a":["Cloud service business manager","Cloud service operations manager","Cloud service manager","Cloud service deployment manager"],"ath":["ผู้จัดการธุรกิจบริการคลาวด์","ผู้จัดการการดำเนินงานบริการคลาวด์","ผู้จัดการบริการคลาวด์","ตัวจัดการการปรับใช้บริการคลาวด์"],"ans":"D","exp":"The cloud service deployment manager is responsible for gathering metrics on cloud services, managing cloud deployments and the deployment process, and defining the environments and processes","expth":"ตัวจัดการการปรับใช้บริการคลาวด์มีหน้าที่รับผิดชอบในการรวบรวมตัวชี้วัดบนบริการคลาวด์ จัดการการปรับใช้ระบบคลาวด์และกระบวนการปรับใช้ และการกำหนดสภาพแวดล้อมและกระบวนการ"},{"id":89,"topic":1,"q":"Which of the following is considered an external redundancy for a data center?","qth":"ข้อใดต่อไปนี้ถือเป็นความซ้ำซ้อนภายนอกสำหรับศูนย์ข้อมูล","a":["Power feeds to rack","Generators","Power distribution units","Storage systems"],"ath":["จ่ายไฟไปยังแร็ค","เครื่องกำเนิดไฟฟ้า","หน่วยจ่ายไฟ","ระบบจัดเก็บข้อมูล"],"ans":"B","exp":"Generators are considered an external redundancy to a data center. Power distribution units (PDUs), storage systems, and power feeds to racks are all internal to a data center, and as such they are considered internal redundancies","expth":"เครื่องกำเนิดไฟฟ้าถือเป็นความซ้ำซ้อนภายนอกสำหรับศูนย์ข้อมูล หน่วยจ่ายไฟ (PDU) ระบบจัดเก็บข้อมูล และฟีดพลังงานไปยังชั้นวางทั้งหมดล้วนอยู่ภายในศูนย์ข้อมูล และด้วยเหตุนี้ จึงถือเป็นความซ้ำซ้อนภายใน"},{"id":90,"topic":1,"q":"Which of the following is the optimal humidity level for a data center, per the guidelines established by the America Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE)?","qth":"ข้อใดต่อไปนี้เป็นระดับความชื้นที่เหมาะสมที่สุดสำหรับศูนย์ข้อมูล ตามแนวทางที่กำหนดโดย America Society of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE)?","a":["30-50 percent relative humidity","50-75 percent relative humidity","20-40 percent relative humidity","40-60 percent relative humidity"],"ath":["ความชื้นสัมพัทธ์ 30-50 เปอร์เซ็นต์","ความชื้นสัมพัทธ์ 50-75 เปอร์เซ็นต์","ความชื้นสัมพัทธ์ 20-40 เปอร์เซ็นต์","ความชื้นสัมพัทธ์ 40-60 เปอร์เซ็นต์"],"ans":"D","exp":"The guidelines from ASHRAE establish 40-60 percent relative humidity as optimal for a data center,","expth":"แนวทางจาก ASHRAE สร้างความชื้นสัมพัทธ์ 40-60 เปอร์เซ็นต์ซึ่งเหมาะสมที่สุดสำหรับศูนย์ข้อมูล"},{"id":91,"topic":1,"q":"What is the first stage of the cloud data lifecycle where security controls can be implemented?","qth":"ขั้นตอนแรกของวงจรการใช้งานข้อมูลบนคลาวด์ที่สามารถใช้การควบคุมความปลอดภัยได้คืออะไร","a":["Use","Store","Share","Create"],"ath":["ใช้","จัดเก็บ","แบ่งปัน","สร้าง"],"ans":"B","exp":"The \"store\" phase of the cloud data lifecycle, which typically occurs simultaneously with the \"create\" phase, or immediately thereafter, is the first phase where security controls can be implemented. In most case, the manner in which the data is stored will be based on its classification","expth":"ระยะ \"จัดเก็บ\" ของวงจรการใช้งานข้อมูลบนคลาวด์ ซึ่งโดยทั่วไปจะเกิดขึ้นพร้อมกันกับระยะ \"สร้าง\" หรือหลังจากนั้นทันที ถือเป็นระยะแรกที่สามารถใช้การควบคุมความปลอดภัยได้ ในกรณีส่วนใหญ่ ลักษณะการจัดเก็บข้อมูลจะขึ้นอยู่กับการจัดหมวดหมู่"},{"id":92,"topic":1,"q":"What controls the formatting and security settings of a volume storage system within a cloud environment?","qth":"อะไรควบคุมการจัดรูปแบบและการตั้งค่าความปลอดภัยของระบบจัดเก็บข้อมูลโวลุ่มภายในสภาพแวดล้อมคลาวด์","a":["Management plane","SAN host controller","Hypervisor","Operating system of the host"],"ath":["ระนาบการจัดการ","ตัวควบคุมโฮสต์ SAN","Hypervisor","ระบบปฏิบัติการของโฮสต์"],"ans":"D","exp":"Once a storage LUN is allocated to a virtual machine, the operating system of that virtual machine will format, manage, and control the file system and security of the data on that LUN","expth":"เมื่อ LUN พื้นที่เก็บข้อมูลถูกจัดสรรให้กับเครื่องเสมือน ระบบปฏิบัติการของเครื่องเสมือนนั้นจะจัดรูปแบบ จัดการ และควบคุมระบบไฟล์และความปลอดภัยของข้อมูลบน LUN นั้น"},{"id":93,"topic":1,"q":"What does SDN stand for within a cloud environment?","qth":"SDN ย่อมาจากอะไรภายในสภาพแวดล้อมคลาวด์","a":["Software-dynamic networking","Software-defined networking","Software-dependent networking","System-dynamic nodes"],"ath":["เครือข่ายซอฟต์แวร์ไดนามิก","เครือข่ายที่กำหนดโดยซอฟต์แวร์","เครือข่ายที่ขึ้นกับซอฟต์แวร์","โหนดไดนามิกของระบบ"],"ans":"B","exp":"Software-defined networking separates the administration of network filtering and network forwarding to allow for distributed administration","expth":"เครือข่ายที่กำหนดโดยซอฟต์แวร์จะแยกการดูแลระบบการกรองเครือข่ายและการส่งต่อเครือข่ายเพื่อให้สามารถดูแลระบบแบบกระจายได้"},{"id":94,"topic":1,"q":"From a legal perspective, what is the most important first step after an eDiscovery order has been received by the cloud provider?","qth":"จากมุมมองทางกฎหมาย ขั้นตอนแรกที่สำคัญที่สุดคืออะไรหลังจากได้รับคำสั่งซื้อ eDiscovery จากผู้ให้บริการคลาวด์","a":["Notification","Key identification","Data collection","Virtual image snapshots"],"ath":["การแจ้งเตือน","การระบุคีย์","การรวบรวมข้อมูล","สแนปช็อตภาพเสมือน"],"ans":"D","exp":"The contract should include requirements for notification by the cloud provider to the cloud customer upon the receipt of such an order. This serves a few important purposes. First, it keeps communication and trust open between the cloud provider and cloud customers. Second, and more importantly, it allows the cloud customer to potentially challenge the order if they feel they have the grounds or desire to do so","expth":"สัญญาควรรวมข้อกำหนดสำหรับการแจ้งเตือนจากผู้ให้บริการคลาวด์ไปยังลูกค้าคลาวด์เมื่อได้รับคำสั่งซื้อดังกล่าว สิ่งนี้มีจุดประสงค์ที่สำคัญบางประการ ประการแรก ช่วยให้การสื่อสารและความไว้วางใจเปิดกว้างระหว่างผู้ให้บริการคลาวด์และลูกค้าคลาวด์ ประการที่สอง และที่สำคัญกว่านั้น ช่วยให้ลูกค้าระบบคลาวด์สามารถท้าทายคำสั่งซื้อได้ หากพวกเขารู้สึกว่าตนมีเหตุผลหรือต้องการทำเช่นนั้น"},{"id":95,"topic":1,"q":"Which of the following would make it more likely that a cloud provider would be unwiling to satisfy specific certification requirements?","qth":"ข้อใดต่อไปนี้จะทำให้ผู้ให้บริการระบบคลาวด์มีแนวโน้มมากขึ้นที่จะไม่ปฏิบัติตามข้อกำหนดการรับรองเฉพาะ","a":["Resource pooling","Virtualization","Multitenancy","Regulation"],"ath":["การรวมทรัพยากร","การจำลองเสมือน","การเช่าหลายรายการ","ระเบียบข้อบังคับ"],"ans":"C","exp":"With cloud providers hosting a number of different customers, it would be impractical for them to pursue additional certifications based on the needs of a specific customer. Cloud environments are built to a common denominator to serve the greatest number of customers, and especially within a public cloud model, itis not possible or practical for a cloud provider to alter their services for specific customer demands","expth":"เนื่องจากผู้ให้บริการระบบคลาวด์โฮสต์ลูกค้าที่แตกต่างกันจำนวนมาก จึงเป็นไปไม่ได้สำหรับพวกเขาที่จะขอรับการรับรองเพิ่มเติมตามความต้องการของลูกค้าเฉพาะราย สภาพแวดล้อมคลาวด์ถูกสร้างขึ้นโดยมีสัดส่วนร่วมกันเพื่อรองรับลูกค้าจำนวนมากที่สุด และโดยเฉพาะอย่างยิ่งภายในโมเดลคลาวด์สาธารณะ เป็นไปไม่ได้หรือในทางปฏิบัติสำหรับผู้ให้บริการคลาวด์ในการเปลี่ยนแปลงบริการของตนตามความต้องการเฉพาะของลูกค้า"},{"id":96,"topic":1,"q":"Which of the following pertains to fire safety standards within a data center, specifically with their enormous electrical consumption?","qth":"ข้อใดต่อไปนี้เกี่ยวข้องกับมาตรฐานความปลอดภัยจากอัคคีภัยภายในศูนย์ข้อมูล โดยเฉพาะอย่างยิ่งกับการใช้ไฟฟ้าจำนวนมหาศาล","a":["NFPA","BICSI","IDCA","Uptime Institute"],"ath":["NFPA","BICSI","IDCA","Uptime Institute"],"ans":"A","exp":"The standards put out by the National Fire Protection Association (NFPA) cover general fire protection best practices for any type of facility, but also specific publications pertaining to IT equipment and data centers","expth":"มาตรฐานที่ออกโดย National Fire Protection Association (NFPA) ครอบคลุมแนวทางปฏิบัติที่ดีที่สุดในการป้องกันอัคคีภัยทั่วไปสำหรับสถานที่ทุกประเภท แต่ยังรวมไปถึงสิ่งพิมพ์เฉพาะที่เกี่ยวข้องกับอุปกรณ์ IT และศูนย์ข้อมูล"},{"id":97,"topic":1,"q":"Which of the following roles involves the connection and integration of existing systems and services to a cloud environment?","qth":"บทบาทใดต่อไปนี้เกี่ยวข้องกับการเชื่อมต่อและการบูรณาการระบบและบริการที่มีอยู่เข้ากับสภาพแวดล้อมคลาวด์","a":["Cloud service business manager","Cloud service user","Cloud service administrator","Cloud service integrator"],"ath":["ผู้จัดการธุรกิจบริการคลาวด์","ผู้ใช้บริการคลาวด์","ผู้ดูแลระบบบริการคลาวด์","ผู้รวมบริการคลาวด์"],"ans":"D","exp":"The cloud service integrator is the official role that involves connecting and integrating existing systems and services with a cloud environment. This may involve moving services into a cloud environment, or connecting to external cloud services and capabilities from traditional data center-hosted services","expth":"ผู้รวมบริการคลาวด์เป็นบทบาทอย่างเป็นทางการที่เกี่ยวข้องกับการเชื่อมต่อและบูรณาการระบบและบริการที่มีอยู่เข้ากับสภาพแวดล้อมคลาวด์ ซึ่งอาจเกี่ยวข้องกับการย้ายบริการไปสู่สภาพแวดล้อมคลาวด์ หรือการเชื่อมต่อกับบริการคลาวด์ภายนอกและความสามารถจากบริการที่โฮสต์โดยศูนย์ข้อมูลแบบดั้งเดิม"},{"id":98,"topic":1,"q":"Which technique involves replacing values within a specific data field to protect sensitive data?","qth":"เทคนิคใดที่เกี่ยวข้องกับการแทนที่ค่าภายในฟิลด์ข้อมูลเฉพาะเพื่อปกป้องข้อมูลที่ละเอียดอ่อน","a":["Anonymization","Masking","Tokenization","Obfuscation"],"ath":["การลบข้อมูลระบุตัวบุคคล","การมาสก์","การแปลงโทเค็น","การทำให้งงงวย"],"ans":"B","exp":"Masking involves replacing specific data within a data set with new values. For example, with credit card fields, as most who have ever purchased anything online can attest, nearly the entire credit card number is masked with a character such as an asterisk, with the last four digits left visible for identification and confirmation","expth":"การมาสก์เกี่ยวข้องกับการแทนที่ข้อมูลเฉพาะภายในชุดข้อมูลด้วยค่าใหม่ ตัวอย่างเช่น ในช่องบัตรเครดิต เนื่องจากคนส่วนใหญ่ที่เคยซื้อสินค้าทางออนไลน์สามารถยืนยันได้ หมายเลขบัตรเครดิตเกือบทั้งหมดจะถูกปกปิดด้วยอักขระ เช่น เครื่องหมายดอกจัน โดยจะเหลือตัวเลขสี่หลักสุดท้ายไว้เพื่อระบุตัวตนและการยืนยัน"},{"id":99,"topic":1,"q":"What expectation of data custodians is made much more challenging by a cloud implementation, especially with PaaS or SaaS?","qth":"ความคาดหวังของผู้ดูแลข้อมูลมีความท้าทายมากขึ้นโดยการใช้งานระบบคลาวด์ โดยเฉพาะอย่างยิ่งกับ PaaS หรือ SaaS","a":["Data classification","Knowledge of systems","Access to data","Encryption requirements"],"ath":["การจำแนกประเภทข้อมูล","ความรู้ของระบบ","การเข้าถึงข้อมูล","ข้อกำหนดในการเข้ารหัส"],"ans":"B","exp":"Under the Federal Rules of Civil Procedure, data custodians are assumed and expected to have full and comprehensive knowledge of the internal design and architecture of their systems. In a cloud environment, especially with PaaS and SaaS, it is impossible for the data custodian to have this knowledge because those systems are controlled by the cloud provider and protected as proprietary knowledge","expth":"ภายใต้กฎเกณฑ์ของกระบวนการพิจารณาคดีแพ่งของรัฐบาลกลาง ผู้ดูแลข้อมูลจะถูกสันนิษฐานและคาดว่าจะมีความรู้ที่ครบถ้วนและครอบคลุมเกี่ยวกับการออกแบบภายในและสถาปัตยกรรมของ ระบบของพวกเขา ในสภาพแวดล้อมคลาวด์ โดยเฉพาะอย่างยิ่งกับ PaaS และ SaaS เป็นไปไม่ได้ที่ผู้ดูแลข้อมูลจะมีความรู้นี้ เนื่องจากระบบเหล่านั้นถูกควบคุมโดยผู้ให้บริการคลาวด์และได้รับการปกป้องเป็นความรู้ที่เป็นกรรมสิทธิ์"},{"id":100,"topic":1,"q":"What type of Pil is controlled based on laws and carries legal penalties for noncompliance with requirements?","qth":"Pil ประเภทใดที่ถูกควบคุมตามกฎหมายและมีบทลงโทษทางกฎหมายสำหรับการไม่ปฏิบัติตามข้อกำหนด?","a":["Contractual","Regulated","Specific","Jurisdictional"],"ath":["ตามสัญญา","ควบคุม","เฉพาะ","เขตอำนาจศาล"],"ans":"B","exp":"Regulated Pll involves those requirements put forth by specific laws or regulations, and unlike contractual Pll, where a violation can lead to contractual penalties, a violation of regulated Pll can lead to fines or even criminal charges in some jurisdictions. Pll regulations can depend on either the jurisdiction that applies to the hosting location or application or specific legislation based on the industry or type of data used","expth":"Pll ที่มีการควบคุมเกี่ยวข้องกับข้อกำหนดเหล่านั้นที่กำหนดโดยกฎหมายหรือข้อบังคับเฉพาะ และไม่เหมือนกับ Pll ตามสัญญา ซึ่งการละเมิดอาจนำไปสู่การลงโทษตามสัญญา การละเมิดของการควบคุม Pll อาจนำไปสู่การถูกปรับหรือแม้แต่ข้อหาทางอาญาในเขตอำนาจศาลบางแห่ง ข้อบังคับของ Pll อาจขึ้นอยู่กับเขตอำนาจศาลที่ใช้กับสถานที่โฮสต์หรือแอปพลิเคชัน หรือกฎหมายเฉพาะตามอุตสาหกรรมหรือประเภทของข้อมูลที่ใช้"},{"id":101,"topic":1,"q":"Which if the following is NOT one of the three components of a federated identity system transaction?","qth":"ซึ่งหากสิ่งต่อไปนี้ไม่ใช่หนึ่งในสามองค์ประกอบของธุรกรรมระบบข้อมูลประจำตัวแบบรวมศูนย์?","a":["Relying party","Identity provider","User","Proxy relay"],"ath":["ฝ่ายที่พึ่งพา","ผู้ให้บริการข้อมูลประจำตัว","ผู้ใช้","การถ่ายทอดพร็อกซี"],"ans":"D","exp":"","expth":""},{"id":102,"topic":1,"q":"Which value refers to the amount of time it takes to recover operations in a BCDR situation to meet management's objectives?","qth":"ค่าใดหมายถึงระยะเวลาที่ใช้ในการกู้คืนการดำเนินงานในสถานการณ์ BCDR เพื่อให้บรรลุวัตถุประสงค์ของฝ่ายบริหาร?","a":["RSL","RPO","SRE","RTO"],"ath":["RSL","RPO","SRE","RTO"],"ans":"D","exp":"The recovery time objective (RTO) is a measure of the amount of time it would take to recover operations in the event of a disaster to the point where management's objectives are met for BCDR","expth":"วัตถุประสงค์ของเวลาการกู้คืน (RTO) คือการวัดระยะเวลาที่จะใช้ในการกู้คืนการดำเนินการในกรณีเกิดภัยพิบัติจนถึงจุดที่บรรลุวัตถุประสงค์ของฝ่ายบริหารสำหรับ BCDR"},{"id":103,"topic":1,"q":"Which of the cloud deployment models requires the cloud customer to be part of a specific group or organization in order to host cloud services within it?","qth":"โมเดลการปรับใช้คลาวด์แบบใดที่กำหนดให้ลูกค้าคลาวด์ต้องเป็นส่วนหนึ่งของกลุ่มหรือองค์กรเฉพาะเพื่อโฮสต์บริการคลาวด์ภายในกลุ่มหรือองค์กรนั้นๆ","a":["Community","Hybrid","Private","Public"],"ath":["ชุมชน","ไฮบริด","ส่วนตัว","สาธารณะ"],"ans":"A","exp":"A community cloud model is where customers that share a certain common bond or group membership come together to offer cloud services to their members, focused on common goals and interests","expth":"โมเดลคลาวด์ชุมชนคือที่ที่ลูกค้าที่มีพันธะร่วมกันหรือการเป็นสมาชิกกลุ่มมารวมตัวกันเพื่อเสนอบริการคลาวด์ให้กับสมาชิก โดยมุ่งเน้นไปที่เป้าหมายและความสนใจร่วมกัน"},{"id":104,"topic":1,"q":"What provides the information to an application to make decisions about the authorization level appropriate when granting access?","qth":"อะไรให้ข้อมูลแก่แอปพลิเคชันเพื่อตัดสินใจเกี่ยวกับระดับการอนุญาตที่เหมาะสมเมื่อให้สิทธิ์การเข้าถึง","a":["User","Relying party","Federation","Identity Provider"],"ath":["ผู้ใช้","ฝ่ายที่เกี่ยวข้อง","สหพันธรัฐ","ผู้ให้บริการข้อมูลประจำตัว"],"ans":"D","exp":"Upon successful user authentication, the identity provider gives information about the user to the relying party that it needs to make authorization decisions for granting access as well as the level of access needed","expth":"เมื่อการตรวจสอบสิทธิ์ผู้ใช้สำเร็จ ผู้ให้บริการข้อมูลประจำตัวจะให้ข้อมูลเกี่ยวกับผู้ใช้แก่ฝ่ายที่พึ่งพาซึ่งจำเป็นต้องทำการตัดสินใจในการอนุญาตสำหรับการให้สิทธิ์การเข้าถึงตลอดจนระดับของการเข้าถึงที่จำเป็น"},{"id":105,"topic":1,"q":"What is a standard configuration and policy set that is applied to systems and virtual machines called?","qth":"การกำหนดค่ามาตรฐานและชุดนโยบายที่ใช้กับระบบและเครื่องเสมือนเรียกว่าอะไร?","a":["Standardization","Baseline","Hardening","Redline"],"ath":["การทำให้เป็นมาตรฐาน","พื้นฐาน","การแข็งตัว","เส้นแดง"],"ans":"B","exp":"The most common and efficient manner of securing operating systems is through the use of baselines. A baseline is a standardized and understood set of base configurations and settings. When a new system is built or a new virtual machine is established, baselines will be applied to a new image to ensure the base configuration meets organizational policy and regulatory requirements,","expth":"ลักษณะทั่วไปและมีประสิทธิภาพที่สุดในการรักษาความปลอดภัยระบบปฏิบัติการคือการใช้เส้นพื้นฐาน เส้นพื้นฐานคือชุดการกำหนดค่าและการตั้งค่าพื้นฐานที่เป็นมาตรฐานและเข้าใจได้ เมื่อมีการสร้างระบบใหม่หรือสร้างเครื่องเสมือนใหม่ เส้นพื้นฐานจะถูกนำไปใช้กับอิมเมจใหม่เพื่อให้แน่ใจว่าการกำหนดค่าพื้นฐานเป็นไปตามนโยบายองค์กรและข้อกำหนดด้านกฎระเบียบ"},{"id":106,"topic":1,"q":"Which entity requires all collection and storing of data on their citizens to be done on hardware that resides within their borders?","qth":"หน่วยงานใดกำหนดให้การรวบรวมและจัดเก็บข้อมูลทั้งหมดเกี่ยวกับพลเมืองของตนบนฮาร์ดแวร์ที่อยู่ภายในขอบเขตของตน","a":["Russia","France","Germany","United States"],"ath":["รัสเซีย","ฝรั่งเศส","เยอรมนี","สหรัฐอเมริกา"],"ans":"A","exp":"Signed into law and effective starting on September 1, 2015, Russian Law 526-FZ establishes that any collecting, storing, or processing of personal information or data on Russian citizens must be done from systems and databases that are physically located with the Russian Federation","expth":"ลงนามในกฎหมายและมีผลตั้งแต่วันที่ 1 กันยายน 2015 กฎหมายรัสเซีย 526-FZ กำหนดว่าการรวบรวม จัดเก็บ หรือประมวลผลข้อมูลส่วนบุคคลหรือข้อมูลใดๆ สำหรับพลเมืองรัสเซียจะต้องดำเนินการจากระบบและฐานข้อมูลที่ตั้งอยู่กับสหพันธรัฐรัสเซีย"},{"id":107,"topic":1,"q":"Which of the cloud cross-cutting aspects relates to the ability to easily move services and applications between different cloud providers?","qth":"ลักษณะที่ตัดขวางระบบคลาวด์ในข้อใดที่เกี่ยวข้องกับความสามารถในการย้ายบริการและแอปพลิเคชันระหว่างผู้ให้บริการคลาวด์ที่แตกต่างกันได้อย่างง่ายดาย","a":["Reversibility","Availability","Portabilty","Interoperability"],"ath":["การย้อนกลับได้","ความพร้อมใช้งาน","การพกพา","การทำงานร่วมกัน"],"ans":"C","exp":"Portability is the ease with which a service or application can be moved between different cloud providers. Maintaining portability gives an organization great flexibility between cloud providers and the ability to shop for better deals or offerings","expth":"การพกพาคือความง่ายดายในการเคลื่อนย้ายบริการหรือแอปพลิเคชันระหว่างผู้ให้บริการคลาวด์ที่แตกต่างกัน การรักษาความสามารถในการพกพาทำให้องค์กรมีความยืดหยุ่นอย่างมากระหว่างผู้ให้บริการระบบคลาวด์และความสามารถในการเลือกซื้อข้อเสนอหรือข้อเสนอที่ดีกว่า"},{"id":108,"topic":1,"q":"Which type of audit report is considered a \"restricted use\" report for its intended audience?","qth":"รายงานการตรวจสอบประเภทใดที่ถือเป็นรายงาน \"การใช้งานแบบจำกัด\" สำหรับกลุ่มเป้าหมาย","a":["SAS-70","SSAE-16","SOC Type 1","SOC Type 2"],"ath":["SAS-70","SSAE-16","SOC ประเภท 1","SOC ประเภท 2"],"ans":"C","exp":"","expth":""},{"id":109,"topic":1,"q":"What is the concept of segregating information or processes, within the same system or application, for security reasons?","qth":"แนวคิดของการแยกข้อมูลหรือกระบวนการภายในระบบหรือแอปพลิเคชันเดียวกันด้วยเหตุผลด้านความปลอดภัยคืออะไร","a":["fencing","Sandboxing","Cellblocking","Pooling"],"ath":["ฟันดาบ","แซนด์บ็อกซ์","การบล็อกเซลล์","การรวมกลุ่ม"],"ans":"B","exp":"Sandboxing involves segregating and isolating information or processes from others within the same system or application, typically for security concerns. This is generally used for data isolation (for example, keeping different communities and populations of users isolated from other similar data)","expth":"แซนด์บ็อกซ์เกี่ยวข้องกับการแยกและการแยกข้อมูลหรือกระบวนการจากผู้อื่นภายในระบบหรือแอปพลิเคชันเดียวกัน ซึ่งโดยทั่วไปแล้วจะเกี่ยวข้องกับข้อกังวลด้านความปลอดภัย โดยทั่วไปจะใช้สำหรับการแยกข้อมูล (เช่น แยกชุมชนและประชากรของผู้ใช้ที่แตกต่างกันออกจากข้อมูลอื่นๆ ที่คล้ายคลึงกัน)"},{"id":110,"topic":1,"q":"The European Union passed the first major regulation declaring data privacy to be a human right. In what year did it go into effect?","qth":"สหภาพยุโรปผ่านกฎระเบียบหลักฉบับแรกที่ประกาศความเป็นส่วนตัวของข้อมูลว่าเป็นสิทธิมนุษยชน มีผลบังคับใช้ในปีใด?","a":["2010","2000","1995","1990"],"ath":["2010","2000","1995","1990"],"ans":"C","exp":"Adopted in 1995, Directive 95/46 EC establishes strong data protection and policy requirements, including the declaring of data privacy to be a human right. It establishes that an individual has the right to be notified when their personal data is being access or processed, that it only will ever be accessed for legitimate purposes, and that data will only be accessed to the exact extent it needs to be for the particular process or request","expth":"Directive 95/46 EC ซึ่งนำมาใช้ในปี 1995 ได้กำหนดข้อกำหนดด้านนโยบายและการคุ้มครองข้อมูลที่เข้มงวด รวมถึงการประกาศความเป็นส่วนตัวของข้อมูลว่าเป็นสิทธิมนุษยชน กำหนดว่าบุคคลมีสิทธิที่จะได้รับการแจ้งเตือนเมื่อมีการเข้าถึงหรือประมวลผลข้อมูลส่วนบุคคลของตน ว่าจะเข้าถึงได้เฉพาะเพื่อวัตถุประสงค์ที่ถูกต้องตามกฎหมายเท่านั้น และข้อมูลดังกล่าวจะเข้าถึงได้เฉพาะในขอบเขตที่แน่นอนที่จำเป็นสำหรับกระบวนการหรือการร้องขอนั้น ๆ เท่านั้น"},{"id":111,"topic":1,"q":"Which of the following is NOT a key area for performance monitoring as far as an SLA is concerned?","qth":"ข้อใดต่อไปนี้ไม่ใช่ประเด็นสำคัญสำหรับการตรวจสอบประสิทธิภาพเท่าที่ SLA เกี่ยวข้อง","a":["CPU","Users","Memory","Network"],"ath":["CPU","ผู้ใช้","หน่วยความจำ","เครือข่าย"],"ans":"B","exp":"An SLA requires performance monitoring of CPU, memory, storage, and networking. The number of users active on a system would not be part of an SLA specifically, other than in regard to the impact on the other four variables","expth":"SLA ต้องมีการตรวจสอบประสิทธิภาพของ CPU หน่วยความจำ ที่เก็บข้อมูล และเครือข่าย จำนวนผู้ใช้ที่ใช้งานอยู่บนระบบจะไม่เป็นส่วนหนึ่งของ SLA โดยเฉพาะ นอกเหนือจากผลกระทบต่อตัวแปรอีกสี่ตัวที่เหลือ"},{"id":112,"topic":1,"q":"Which of the following is the MOST important requirement and guidance for testing during an audit?","qth":"ข้อใดต่อไปนี้เป็นข้อกำหนดและคำแนะนำที่สำคัญที่สุดสำหรับการทดสอบในระหว่างการตรวจสอบ","a":["Stakeholders","Shareholders","Management","Regulations"],"ath":["ผู้มีส่วนได้ส่วนเสีย","ผู้ถือหุ้น","การจัดการ","กฎระเบียบ"],"ans":"D","exp":"During any audit, regulations are the most important factor and guidelines for what must be tested. Although the requirements from management, stakeholders, and shareholders are also important, regulations are not negotiable and pose the biggest risk to any organization for compliance failure","expth":"ในระหว่างการตรวจสอบ กฎระเบียบเป็นปัจจัยและแนวทางที่สำคัญที่สุดสำหรับสิ่งที่ต้องทดสอบ แม้ว่าข้อกำหนดจากฝ่ายบริหาร ผู้มีส่วนได้ส่วนเสีย และผู้ถือหุ้นก็มีความสำคัญเช่นกัน แต่กฎระเบียบไม่สามารถเจรจาต่อรองได้และก่อให้เกิดความเสี่ยงที่ใหญ่ที่สุดสำหรับองค์กรใดๆ สำหรับความล้มเหลวในการปฏิบัติตามกฎระเบียบ"},{"id":113,"topic":1,"q":"Which value refers to the amount of data an organization would need to recover in the event of a BCDR situation in order to reach an acceptable level of operations?","qth":"ค่าใดหมายถึงปริมาณข้อมูลที่องค์กรจะต้องกู้คืนในกรณีของสถานการณ์ BCDR เพื่อให้บรรลุระดับการปฏิบัติงานที่ยอมรับได้","a":["SRE","RTO","RPO","RSL"],"ath":["SRE","RTO","RPO","RSL"],"ans":"C","exp":"The recovery point objective (RPO) is defined as the amount of data a company would need to maintain and recover in order to function at a level acceptable to management. This may or may not be a restoration to full operating capacity, depending on what management deems as crucial and essential","expth":"วัตถุประสงค์จุดกู้คืน (RPO) หมายถึงปริมาณข้อมูลที่บริษัทจะต้องรักษาและกู้คืนเพื่อที่จะทำงานในระดับที่ฝ่ายบริหารยอมรับได้ นี่อาจจะเป็นหรือไม่ใช่การฟื้นฟูให้เต็มประสิทธิภาพก็ได้ ขึ้นอยู่กับสิ่งที่ฝ่ายบริหารเห็นว่าสำคัญและจำเป็น"},{"id":114,"topic":1,"q":"What must SOAP rely on for security?","qth":"SOAP ต้องพึ่งพาอะไรเพื่อความปลอดภัย","a":["Encryption","Tokenization","TLS","SSL"],"ath":["การเข้ารหัส","Tokenization","TLS","SSL"],"ans":"A","exp":"Simple Object Access Protocol (SOAP) uses Extensible Markup Language (XML) for passing data, and it must rely on the encryption of those data packages for security,","expth":"Simple Object Access Protocol (SOAP) ใช้ Extensible Markup Language (XML) สำหรับการส่งผ่านข้อมูล และจะต้องอาศัยการเข้ารหัสของแพ็คเกจข้อมูลเหล่านั้นเพื่อความปลอดภัย"},{"id":115,"topic":1,"q":"Which of the following is a commonly used tool for maintaining system configurations?","qth":"ข้อใดต่อไปนี้เป็นเครื่องมือที่ใช้กันทั่วไปสำหรับการบำรุงรักษาการกำหนดค่าระบบ","a":["Maestro","Orchestrator","Puppet","Conductor"],"ath":["Maestro","Orchestrator","Puppet","Conductor"],"ans":"C","exp":"Puppet is a commonly used tool for maintaining system configurations based on policies, and done so from a centralized authority","expth":"Puppet เป็นเครื่องมือที่ใช้กันทั่วไปสำหรับการบำรุงรักษาการกำหนดค่าระบบตามนโยบาย และดำเนินการดังกล่าวจากหน่วยงานส่วนกลาง"},{"id":116,"topic":1,"q":"What type of data does data rights management (DRM) protect?","qth":"การจัดการสิทธิ์ในข้อมูล (DRM) ปกป้องข้อมูลประเภทใด","a":["Consumer","PIl","Financial","Healthcare"],"ath":["ผู้บริโภค","PIl","การเงิน","การดูแลสุขภาพ"],"ans":"A","exp":"DRM applies to the protection of consumer media, such as music, publications, video, movies, and soon","expth":"DRM นำไปใช้กับการปกป้องสื่อผู้บริโภค เช่น เพลง สิ่งพิมพ์ วิดีโอ ภาพยนตร์ และเร็วๆ นี้"},{"id":117,"topic":1,"q":"Which type of testing uses the same strategies and toolsets that hackers would use?","qth":"การทดสอบประเภทใดใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮ็กเกอร์จะใช้","a":["Penetration","Dynamic","Static","Malicious"],"ath":["การเจาะระบบ","ไดนามิก","แบบคงที่","ที่เป็นอันตราย"],"ans":"A","exp":"Penetration testing involves using the same strategies and toolsets that hackers would use against a system to discovery potential vulnerabilities","expth":"การทดสอบการเจาะระบบเกี่ยวข้องกับการใช้กลยุทธ์และชุดเครื่องมือเดียวกันกับที่แฮ็กเกอร์จะใช้กับระบบเพื่อค้นหาช่องโหว่ที่อาจเกิดขึ้น"},{"id":118,"topic":1,"q":"From a security perspective, which of the following is a major concern when evaluating possible BCDR solutions?","qth":"จากมุมมองด้านความปลอดภัย ข้อใดต่อไปนี้เป็นข้อกังวลหลักเมื่อประเมินโซลูชัน BCDR ที่เป็นไปได้","a":["Access provisioning","Auditing","Jurisdictions","Authorization"],"ath":["การจัดเตรียมการเข้าถึง","การตรวจสอบ","เขตอำนาจศาล","การอนุญาต"],"ans":"C","exp":"When a security professional is considering cloud solutions for BCDR, a top concern is the jurisdiction where the cloud systems are hosted. If the jurisdiction is different from where the production systems are hosted, they may be subjected to different regulations and controls, which would make a seamless BCDR solution far more difficult","expth":"เมื่อผู้เชี่ยวชาญด้านความปลอดภัยกำลังพิจารณาโซลูชันคลาวด์สำหรับ BCDR ข้อกังวลสูงสุดคือเขตอำนาจศาลที่โฮสต์ระบบคลาวด์ หากเขตอำนาจศาลแตกต่างจากที่ระบบการผลิตโฮสต์อยู่ ก็อาจอยู่ภายใต้กฎระเบียบและการควบคุมที่แตกต่างกัน ซึ่งจะทำให้โซลูชัน BCDR ที่ราบรื่นยากขึ้นมาก"},{"id":119,"topic":1,"q":"Which of the following is NOT a focus or consideration of an internal audit? ACertification","qth":"ข้อใดต่อไปนี้ไม่ใช่จุดมุ่งเน้นหรือการพิจารณาของการตรวจสอบภายใน การรับรองมาตรฐาน","a":["Health monitoring","Design","Costs","Operational efficiency"],"ath":["การตรวจสอบสุขภาพ","การออกแบบ","ต้นทุน","ประสิทธิภาพการดำเนินงาน"],"ans":"A","exp":"In order to obtain and comply with certifications, independent external audits must be performed and satisfied. Although some testing of certification controls can be part of an internal audit, they will not satisfy requirements","expth":"เพื่อให้ได้รับและปฏิบัติตามใบรับรอง จะต้องดำเนินการและปฏิบัติตามการตรวจสอบภายนอกที่เป็นอิสระและพึงพอใจ แม้ว่าการทดสอบการควบคุมการรับรองบางอย่างอาจเป็นส่วนหนึ่งของการตรวจสอบภายใน แต่ก็จะไม่เป็นไปตามข้อกำหนด"},{"id":120,"topic":1,"q":"Which of the following is the sole responsibility of the cloud customer, regardless of which cloud model is used?","qth":"ข้อใดต่อไปนี้เป็นความรับผิดชอบแต่เพียงผู้เดียวของลูกค้าระบบคลาวด์ ไม่ว่าจะใช้โมเดลคลาวด์ใดก็ตาม","a":["Infrastructure","Platform","Application","Data"],"ath":["โครงสร้างพื้นฐาน","แพลตฟอร์ม","แอปพลิเคชัน","ข้อมูล"],"ans":"D","exp":"Regardless of which cloud-hosting model is used, the cloud customer always has sole responsibility for the data and its security","expth":"ไม่ว่าจะใช้โมเดลโฮสติ้งบนคลาวด์ใดก็ตาม ลูกค้าระบบคลาวด์จะต้องรับผิดชอบต่อข้อมูลและความปลอดภัยของข้อมูลแต่เพียงผู้เดียวเสมอ"},{"id":121,"topic":1,"q":"What process is used within a clustered system to provide high availablity and load balancing?","qth":"กระบวนการใดที่ใช้ภายในระบบคลัสเตอร์เพื่อให้มีความพร้อมใช้งานสูงและการปรับสมดุลโหลด","a":["Dynamic balancing","Dynamic clustering","Dynamic optimization","Dynamic resource allocation"],"ath":["การปรับสมดุลแบบไดนามิก","การจัดคลัสเตอร์แบบไดนามิก","การปรับให้เหมาะสมแบบไดนามิก","การจัดสรรทรัพยากรแบบไดนามิก"],"ans":"D","exp":"Dynamic resource scheduling (DRS) is used within all clustering systems as the method for clusters to provide high availabilty, scaling, management, and workload distribution and balancing of jobs and processes. From a physical infrastructure perspective, DRS is used to balance compute loads between physical hosts in a cloud to maintain the desired thresholds and limits on the physical hosts","expth":"การจัดตารางเวลาทรัพยากรแบบไดนามิก (DRS) ถูกใช้ภายในระบบการทำคลัสเตอร์ทั้งหมดเป็นวิธีการสำหรับคลัสเตอร์เพื่อให้มีความพร้อมใช้งานสูง การปรับขนาด การจัดการ และการกระจายปริมาณงาน และการปรับสมดุลของงานและกระบวนการ จากมุมมองของโครงสร้างพื้นฐานทางกายภาพ DRS ถูกใช้เพื่อสร้างสมดุลโหลดการประมวลผลระหว่างโฮสต์จริงในระบบคลาวด์ เพื่อรักษาเกณฑ์และขีดจำกัดที่ต้องการบนโฮสต์จริง"},{"id":122,"topic":1,"q":"Which of the following is NOT a function performed by the handshake protocol of TLS?","qth":"ข้อใดต่อไปนี้ไม่ใช่ฟังก์ชันที่ดำเนินการโดยโปรโตคอล Handshake ของ TLS","a":["Key exchange","Encryption","Negotiation of connection","Establish session ID"],"ath":["การแลกเปลี่ยนคีย์","การเข้ารหัส","การเจรจาการเชื่อมต่อ","สร้าง ID เซสชัน"],"ans":"B","exp":"The handshake protocol negotiates and establishes the connection as well as handles the key exchange and establishes the session ID. It does not perform the actual encryption of data packets","expth":"โปรโตคอล Handshake จะเจรจาและสร้างการเชื่อมต่อ ตลอดจนจัดการการแลกเปลี่ยนคีย์ และสร้าง ID เซสชัน มันไม่ได้ทำการเข้ารหัสจริงของแพ็กเก็ตข้อมูล"},{"id":123,"topic":1,"q":"Unlike SOC Type 1 reports, which are based on a specific point in time, SOC Type 2 reports are done over a period of time. What is the minimum span of time for a SOC Type 2 report?","qth":"ต่างจากรายงาน SOC ประเภท 1 ซึ่งอิงตามช่วงเวลาที่เฉพาะเจาะจง รายงาน SOC ประเภท 2 จะดำเนินการในช่วงเวลาหนึ่ง ช่วงเวลาขั้นต่ำสำหรับรายงาน SOC ประเภท 2 คือเท่าใด","a":["Six months","One month","One year","One week"],"ath":["หกเดือน","หนึ่งเดือน","หนึ่งปี","หนึ่งสัปดาห์"],"ans":"A","exp":"SOC Type 2 reports are focused on the same policies and procedures, as well as their effectiveness, as SOC Type 1 reports, but are evaluated over a period of at least six consecutive months, rather than a finite point in time","expth":"รายงาน SOC ประเภท 2 มุ่งเน้นไปที่นโยบายและขั้นตอนเดียวกัน ตลอดจนประสิทธิผล เช่นเดียวกับรายงาน SOC ประเภท 1 แต่ได้รับการประเมินในช่วงเวลาอย่างน้อยหกเดือนติดต่อกัน แทนที่จะเป็นจุดที่มีจำกัดในเวลา"},{"id":124,"topic":1,"q":"What changes are necessary to application code in order to implement DNSSEC?","qth":"การเปลี่ยนแปลงใดที่จำเป็นในรหัสแอปพลิเคชันเพื่อใช้ DNSSEC","a":["Adding encryption modules","Implementing certificate validations","Additional DNS lookups","No changes are needed"],"ath":["การเพิ่มโมดูลการเข้ารหัส","การใช้การตรวจสอบใบรับรอง","การค้นหา DNS เพิ่มเติม","ไม่จำเป็นต้องเปลี่ยนแปลง"],"ans":"D","exp":"To implement DNSSEC, no additional changes are needed to applications or their code because the integrity checks are all performed at the system level","expth":"ในการใช้ DNSSEC ไม่จำเป็นต้องมีการเปลี่ยนแปลงเพิ่มเติมกับแอปพลิเคชันหรือรหัส เนื่องจากการตรวจสอบความสมบูรณ์ทั้งหมดจะดำเนินการในระดับระบบ"},{"id":125,"topic":1,"q":"Which type of controls are the SOC Type 1 reports specifically focused on?","qth":"การควบคุมประเภทใดที่รายงาน SOC ประเภท 1 เน้นเป็นพิเศษ","a":["Integrity","Pll","Financial","Privacy"],"ath":["ความซื่อสัตย์","Pll","การเงิน","ความเป็นส่วนตัว"],"ans":"C","exp":"SOC Type 1 reports are focused specifically on internal controls as they relate to financial reporting","expth":"รายงาน SOC ประเภท 1 มุ่งเน้นไปที่การควบคุมภายในโดยเฉพาะเนื่องจากเกี่ยวข้องกับการรายงานทางการเงิน"},{"id":126,"topic":1,"q":"Which security concept is based on preventing unauthorized access to data while also ensuring that it is accessible to those authorized to use it?","qth":"แนวคิดด้านความปลอดภัยใดที่มีพื้นฐานมาจากการป้องกันการเข้าถึงข้อมูลโดยไม่ได้รับอนุญาตในขณะเดียวกันก็ทำให้มั่นใจว่าผู้ที่ได้รับอนุญาตให้ใช้งานสามารถเข้าถึงได้","a":["Integrity","Availability","Confidentiality","Nonrepudiation"],"ath":["ความซื่อสัตย์","ความพร้อมใช้งาน","การรักษาความลับ","การไม่ปฏิเสธ"],"ans":"C","exp":"The main goal of confidentiality is to ensure that sensitive information is not made available or leaked to parties that should not have access to it, while at the same time ensuring that those with appropriate need and authorization to access it can do so in a manner commensurate with their needs and confidentiality requirements","expth":"เป้าหมายหลักของการรักษาความลับคือเพื่อให้แน่ใจว่าข้อมูลที่ละเอียดอ่อนจะไม่ถูกเปิดเผยหรือรั่วไหลไปยังฝ่ายต่างๆ ที่ไม่ควรเข้าถึงข้อมูลในขณะเดียวกัน เวลาเพื่อให้มั่นใจว่าผู้ที่มีความต้องการที่เหมาะสมและได้รับอนุญาตให้เข้าถึงสามารถทำได้ในลักษณะที่สอดคล้องกับความต้องการและข้อกำหนดการรักษาความลับของพวกเขา"},{"id":127,"topic":1,"q":"Which of the following is NOT a domain of the Cloud Controls Matrix (CCM)?","qth":"ข้อใดต่อไปนี้ไม่ใช่โดเมนของ Cloud Controls Matrix (CCM)?","a":["Data center security","Human resources","Mobile security","Budgetary and cost controls"],"ath":["ความปลอดภัยของศูนย์ข้อมูล","ทรัพยากรบุคคล","ความปลอดภัยบนมือถือ","การควบคุมงบประมาณและต้นทุน"],"ans":"D","exp":"Budgetary and cost controls is not one of the domains outlined in the CCM","expth":"การควบคุมงบประมาณและต้นทุนไม่ใช่หนึ่งในโดเมนที่ระบุไว้ใน CCM"},{"id":128,"topic":1,"q":"Which security concept, if implemented correctly, will protect the data on a system, even if a malicious actor gains access to the actual system?","qth":"แนวคิดด้านความปลอดภัยใด หากนำไปใช้อย่างถูกต้อง จะปกป้องข้อมูลบนระบบ แม้ว่าผู้ประสงค์ร้ายจะสามารถเข้าถึงระบบจริงได้ก็ตาม","a":["Sandboxing","Encryption","Firewalls","Access control"],"ath":["แซนด์บ็อกซ์","การเข้ารหัส","ไฟร์วอลล์","การควบคุมการเข้าถึง"],"ans":"B","exp":"In any environment, data encryption is incredibly important to prevent unauthorized exposure of data either internally or externally. If a system is compromised by an attack, having the data encrypted on the system will prevent its unauthorized exposure or export, even with the system itself being exposed","expth":"ในทุกสภาพแวดล้อม การเข้ารหัสข้อมูลมีความสำคัญอย่างยิ่งในการป้องกันการเปิดเผยข้อมูลโดยไม่ได้รับอนุญาตทั้งภายในหรือภายนอก หากระบบถูกบุกรุกจากการโจมตี การมีข้อมูลที่เข้ารหัสบนระบบจะป้องกันการเปิดเผยหรือการส่งออกโดยไม่ได้รับอนุญาต แม้ว่าตัวระบบเองจะถูกเปิดเผยก็ตาม"},{"id":129,"topic":1,"q":"Which of the following is the sole responsibilty of the cloud provider, regardless of which cloud model is used?","qth":"ข้อใดต่อไปนี้เป็นความรับผิดชอบแต่เพียงผู้เดียวของผู้ให้บริการคลาวด์ ไม่ว่าจะใช้โมเดลคลาวด์ใดก็ตาม","a":["Platform","Data","Physical environment (EENZTI3","Infrastructure"],"ath":["แพลตฟอร์ม","ข้อมูล","สภาพแวดล้อมทางกายภาพ (EENZTI3","โครงสร้างพื้นฐาน"],"ans":"C","exp":"Regardless of which cloud-hosting model is used, the cloud provider always has sole responsibility for the physical environment","expth":"ไม่ว่าจะใช้โมเดลโฮสติ้งบนคลาวด์ใด ผู้ให้บริการคลาวด์จะต้องรับผิดชอบต่อสภาพแวดล้อมทางกายภาพแต่เพียงผู้เดียวเสมอ"},{"id":130,"topic":1,"q":"Which of the following is NOT a factor that is part of a firewall configuration?","qth":"ข้อใดต่อไปนี้ไม่ใช่ปัจจัยที่เป็นส่วนหนึ่งของการกำหนดค่าไฟร์วอลล์?","a":["Encryption","Port","Protocol","Source IP"],"ath":["การเข้ารหัส","พอร์ต","โปรโตคอล","IP ต้นทาง"],"ans":"A","exp":"Firewalls take into account source IP, destination IP. the port the traffic is using, as well as the network protocol (UDP/TCP). Whether or not the traffic is encrypted is not something a firewall is concerned with","expth":"ไฟร์วอลล์คำนึงถึง IP ต้นทาง, IP ปลายทาง พอร์ตที่การรับส่งข้อมูลใช้ รวมถึงโปรโตคอลเครือข่าย (UDP/TCP) การที่การรับส่งข้อมูลจะถูกเข้ารหัสหรือไม่นั้นไม่ใช่เรื่องที่เกี่ยวข้องกับไฟร์วอลล์"},{"id":131,"topic":1,"q":"Which of the cloud deployment models involves spanning multiple cloud environments or a mix of cloud hosting models?","qth":"โมเดลการปรับใช้ระบบคลาวด์ใดที่เกี่ยวข้องกับการขยายสภาพแวดล้อมคลาวด์หลายแบบหรือการผสมผสานระหว่างโมเดลโฮสติ้งบนคลาวด์","a":["Community","Public","Hybrid","Private"],"ath":["ชุมชน","สาธารณะ","ไฮบริด","ส่วนตัว"],"ans":"C","exp":"A hybrid cloud model involves the use of more than one type of cloud hosting models, typically the mix of private and public cloud hosting models","expth":"โมเดลคลาวด์ไฮบริดเกี่ยวข้องกับการใช้โมเดลโฮสติ้งบนคลาวด์มากกว่าหนึ่งประเภท โดยทั่วไปจะเป็นการผสมผสานระหว่างโมเดลโฮสติ้งบนคลาวด์ส่วนตัวและสาธารณะ"},{"id":132,"topic":1,"q":"Which of the following is NOT one of five principles of SOC Type 2 audits?","qth":"ข้อใดต่อไปนี้ไม่ใช่หนึ่งในห้าหลักการของการตรวจสอบ SOC ประเภท 2","a":["Privacy","Processing integrity","Financial","Security"],"ath":["ความเป็นส่วนตัว","ความสมบูรณ์ของการประมวลผล","การเงิน","ความปลอดภัย"],"ans":"C","exp":"The SOC Type 2 audits include five principles: security, privacy, processing integrity, availability, and confidentiality","expth":"การตรวจสอบ SOC ประเภท 2 ประกอบด้วยหลักการห้าประการ: ความปลอดภัย ความเป็นส่วนตัว ความสมบูรณ์ของการประมวลผล ความพร้อมใช้งาน และการรักษาความลับ"},{"id":133,"topic":1,"q":"Which aspect of cloud computing makes data classification even more vital than in a traditional data center?","qth":"ด้านใดของการประมวลผลแบบคลาวด์ที่ทำให้การจำแนกข้อมูลมีความสำคัญมากกว่าในศูนย์ข้อมูลแบบเดิม","a":["Interoperability","Virtualization","Multitenancy","Portability"],"ath":["การทำงานร่วมกัน","การจำลองเสมือน","การเช่าหลายรายการ","การพกพา"],"ans":"C","exp":"With multiple tenants within the same hosting environment, any failure to properly classify data may lead to potential exposure to other customers and applications within the same environment","expth":"เมื่อมีผู้เช่าหลายรายภายในสภาพแวดล้อมการโฮสต์เดียวกัน ความล้มเหลวในการจำแนกข้อมูลอย่างเหมาะสมอาจนำไปสู่การเปิดเผยต่อลูกค้าและแอปพลิเคชันอื่น ๆ ภายในสภาพแวดล้อมเดียวกัน"},{"id":134,"topic":1,"q":"What concept does the “T\" represent in the STRIDE threat model?","qth":"แนวคิดใดที่ “T\" เป็นตัวแทนในรูปแบบภัยคุกคาม STRIDE","a":["TLS","Testing","Tampering with data","Transport"],"ath":["TLS","การทดสอบ","การเจาะข้อมูล","การขนส่ง"],"ans":"C","exp":"Explanation Any application that sends data to the user will face the potential that the user could manipulate or alter the data, whether it resides in cookies, GET or POST commands, or headers, or manipulates client-side validations. If the user receives data from the application, itis crucial that the application validate and verify any data that is received back from the user","expth":"คำอธิบาย แอปพลิเคชันใด ๆ ที่ส่งข้อมูลไปยังผู้ใช้จะเผชิญกับความเป็นไปได้ที่ผู้ใช้สามารถจัดการหรือเปลี่ยนแปลงข้อมูลได้ ไม่ว่าจะอยู่ในคุกกี้ คำสั่ง GET หรือ POST หรือส่วนหัว หรือจัดการ การตรวจสอบฝั่งไคลเอ็นต์ หากผู้ใช้ได้รับข้อมูลจากแอปพลิเคชัน สิ่งสำคัญคือแอปพลิเคชันจะต้องตรวจสอบและตรวจสอบข้อมูลใด ๆ ที่ได้รับกลับมาจากผู้ใช้"},{"id":135,"topic":1,"q":"Which of the following would be a reason to undertake a BCDR test?","qth":"ข้อใดต่อไปนี้จะเป็นเหตุผลในการดำเนินการทดสอบ BCDR","a":["Functional change of the application","Change in staff","User interface overhaul of the application","Change in regulations"],"ath":["การเปลี่ยนแปลงฟังก์ชันของแอปพลิเคชัน","การเปลี่ยนแปลงในพนักงาน","ยกเครื่องอินเทอร์เฟซผู้ใช้ของแอปพลิเคชัน","การเปลี่ยนแปลงกฎระเบียบ"],"ans":"A","exp":"Any time a major functional change of an application occurs, anew BCDR test should be done to ensure the overall strategy and process are stil applicable and appropriate","expth":"ทุกครั้งที่มีการเปลี่ยนแปลงการทำงานที่สำคัญของแอปพลิเคชันเกิดขึ้น ควรทำการทดสอบ BCDR ใหม่เพื่อให้แน่ใจว่ากลยุทธ์และกระบวนการโดยรวมยังคงมีผลบังคับใช้และเหมาะสม"},{"id":136,"topic":1,"q":"What is the biggest challenge to data discovery in a cloud environment?","qth":"อะไรคือความท้าทายที่ใหญ่ที่สุดในการค้นพบข้อมูลในสภาพแวดล้อมคลาวด์","a":["Format","Ownership","Location","Multitenancy"],"ath":["รูปแบบ","การเป็นเจ้าของ","ตำแหน่ง","การครอบครองหลายรายการ"],"ans":"C","exp":"With the distributed nature of cloud environments, the foremost challenge for data discovery is awareness of the location of data and keeping track of it during the constant motion of cloud storage systems","expth":"ด้วยลักษณะการกระจายตัวของสภาพแวดล้อมคลาวด์ ความท้าทายที่สำคัญที่สุดสำหรับการค้นพบข้อมูลคือการตระหนักถึงตำแหน่งของข้อมูลและการติดตามข้อมูลดังกล่าวในระหว่างการเคลื่อนไหวอย่างต่อเนื่องของระบบจัดเก็บข้อมูลบนคลาวด์"},{"id":137,"topic":1,"q":"Which crucial aspect of cloud computing can be most threat","qth":"ลักษณะสำคัญประการใดของการประมวลผลแบบคลาวด์ที่สามารถเป็นภัยคุกคามได้มากที่สุด","a":["Automation","Redundancy","Resource pooling","Elasticity"],"ath":["การทำงานอัตโนมัติ","ความซ้ำซ้อน","การรวมทรัพยากร","ความยืดหยุ่น"],"ans":"A","exp":"Cloud environments depend heavily on API calls for management and automation. Any vulnerability with the APIs can cause significant risk and exposure to all tenants of the cloud environment","expth":"สภาพแวดล้อมระบบคลาวด์ขึ้นอยู่กับการเรียก API อย่างมากสำหรับการจัดการและระบบอัตโนมัติ ช่องโหว่ใดๆ ก็ตามที่มี API สามารถก่อให้เกิดความเสี่ยงที่สำคัญและความเสี่ยงต่อผู้เช่าทั้งหมดในสภาพแวดล้อมคลาวด์"},{"id":138,"topic":1,"q":"Which of the following should NOT be part of the requirement analysis phase of the software development lifecycle?","qth":"ข้อใดต่อไปนี้ไม่ควรเป็นส่วนหนึ่งของขั้นตอนการวิเคราะห์ความต้องการของวงจรการพัฒนาซอฟต์แวร์","a":["Functionality","Programming languages (EEX","Software platform","Security requirements Suggested Answ Security requirements should be incorporated into the software development lifecycle (SDLC) from the earliest requirement gathering stage and should be incorporated prior to the requirement analysis phase"],"ath":["ฟังก์ชันการทำงาน","ภาษาการเขียนโปรแกรม (EEX","แพลตฟอร์มซอฟต์แวร์","ข้อกำหนดด้านความปลอดภัย คำตอบที่แนะนำ ข้อกำหนดด้านความปลอดภัยควรรวมอยู่ในวงจรการพัฒนาซอฟต์แวร์ (SDLC) ตั้งแต่ขั้นตอนการรวบรวมข้อกำหนดแรกสุด และควรรวมเข้าไว้ก่อนขั้นตอนการวิเคราะห์ความต้องการ"],"ans":"B","exp":"","expth":""},{"id":139,"topic":1,"q":"Which of the cloud cross-cutting aspects relates to the assigning of jobs, tasks, and roles, as well as to ensuring they are successful and properly performed?","qth":"แง่มุมใดที่ข้ามระบบคลาวด์ที่เกี่ยวข้องกับการมอบหมายงาน งาน และบทบาท ตลอดจนเพื่อให้แน่ใจว่างานจะประสบความสำเร็จและดำเนินการอย่างเหมาะสม","a":["Service-level agreements","Governance","Regulatory requirements","Auditability"],"ath":["ข้อตกลงระดับการบริการ","การกำกับดูแล","ข้อกำหนดด้านกฎระเบียบ","การตรวจสอบ"],"ans":"B","exp":"Governance at its core is the idea of assigning jobs, takes, roles, and responsibilities and ensuring they are satisfactory performed","expth":"การกำกับดูแลที่เป็นแกนหลักคือแนวคิดในการมอบหมายงาน รับบทบาท บทบาท และความรับผิดชอบ และรับรองว่าจะดำเนินการได้อย่างน่าพอใจ"},{"id":140,"topic":1,"q":"Which regulatory system pertains to the protection of healthcare data?","qth":"ระบบกำกับดูแลใดที่เกี่ยวข้องกับการปกป้องข้อมูลการดูแลสุขภาพ","a":["HIPAA","HAS","HITECH","HFCA"],"ath":["HIPAA","HAS","HITECH","HFCA"],"ans":"A","exp":"The Health Insurance Portability and Accountability Act (HIPAA) sets stringent requirements in the United States for the protection of healthcare records","expth":"กฎหมาย Health Insurance Portability and Accountability Act (HIPAA) กำหนดข้อกำหนดที่เข้มงวดในสหรัฐอเมริกาสำหรับการคุ้มครองบันทึกการดูแลสุขภาพ"},{"id":141,"topic":1,"q":"Which aspect of cloud computing makes it very difficult to perform repeat audits over time to track changes and compliance?","qth":"ด้านใดของการประมวลผลแบบคลาวด์ที่ทำให้การตรวจสอบซ้ำเมื่อเวลาผ่านไปเพื่อติดตามการเปลี่ยนแปลงและการปฏิบัติตามข้อกำหนดเป็นเรื่องยากมาก","a":["Virtualization (EXERT","Multitenancy","Resource pooling","Dynamic optimization"],"ath":["การจำลองเสมือน (EXERT","การเช่าหลายรายการ","การรวมทรัพยากร","การเพิ่มประสิทธิภาพแบบไดนามิก"],"ans":"A","exp":"Cloud environments will regularly change virtual machines as patching and versions are changed. Unlike a physical environment, there is little continuity from one period of time to another. It is very unlikely that the same virtual machines would be in use during a repeat audit","expth":"สภาพแวดล้อมระบบคลาวด์จะเปลี่ยนเครื่องเสมือนเป็นประจำเมื่อมีการแพตช์และเวอร์ชันที่เปลี่ยนแปลง ต่างจากสภาพแวดล้อมทางกายภาพ มีความต่อเนื่องเพียงเล็กน้อยจากช่วงเวลาหนึ่งไปยังอีกช่วงเวลาหนึ่ง ไม่น่าเป็นไปได้มาก ว่าเครื่องเสมือนเดียวกันจะถูกใช้งานในระหว่างการตรวจสอบซ้ำ"},{"id":142,"topic":1,"q":"Which security concept would business continuity and disaster recovery fall under?","qth":"แนวคิดด้านความปลอดภัยใดที่ความต่อเนื่องทางธุรกิจและการกู้คืนความเสียหายจะอยู่ภายใต้","a":["Confidentiality","Availability","Fault tolerance","Integrity"],"ath":["การรักษาความลับ","ความพร้อมใช้งาน","ความทนทานต่อความเสียหาย","ความสมบูรณ์"],"ans":"B","exp":"Disaster recovery and business continuity are vital concerns with availabilty. If data is destroyed or compromised, having regular backup systems in place as well as being able to perform disaster recovery in the event of a major or widespread problem allows operations to continue with an acceptable loss of time and data to management. This also ensures that sensitive data is protected and persisted in the event of the loss or corruption of data systems or physical storage systems","expth":"การกู้คืนความเสียหายและความต่อเนื่องทางธุรกิจถือเป็นข้อกังวลที่สำคัญกับความพร้อมใช้งาน หากข้อมูลถูกทำลายหรือถูกโจมตี การมีระบบสำรองข้อมูลเป็นประจำตลอดจนสามารถดำเนินการกู้คืนระบบในกรณีที่เกิดปัญหาใหญ่หรือแพร่หลาย จะช่วยให้ฝ่ายจัดการสามารถดำเนินการต่อไปโดยสูญเสียเวลาและข้อมูลในระดับที่ยอมรับได้ นอกจากนี้ยังทำให้มั่นใจได้ว่าข้อมูลที่ละเอียดอ่อนได้รับการปกป้องและคงอยู่ในกรณีที่ระบบข้อมูลหรือระบบจัดเก็บข้อมูลทางกายภาพสูญหายหรือเสียหาย"},{"id":143,"topic":1,"q":"Which of the following is NOT an application or utility to apply and enforce baselines on a system?","qth":"ข้อใดต่อไปนี้ไม่ใช่แอปพลิเคชันหรือยูทิลิตี้ที่จะใช้และบังคับใช้บรรทัดฐานบนระบบ","a":["Chef","GitHub","Puppet","Active Directory"],"ath":["Chef","GitHub","Puppet","Active Directory"],"ans":"B","exp":"GitHub is an application for code collaboration, including versioning and branching of code trees. It is not used for applying or maintaining system configurations","expth":"GitHub เป็นแอปพลิเคชันสำหรับการทำงานร่วมกันของโค้ด รวมถึงการกำหนดเวอร์ชันและการแตกแขนงของแผนผังโค้ด ไม่ได้ใช้สำหรับการใช้หรือบำรุงรักษาการกำหนดค่าระบบ"},{"id":144,"topic":1,"q":"Which of the cloud cross-cutting aspects relates to the abilty for a cloud customer to easily remove their applications and data from a cloud environment?","qth":"แง่มุมใดที่ข้ามระบบคลาวด์ที่เกี่ยวข้องกับความสามารถสำหรับลูกค้าคลาวด์ในการลบแอปพลิเคชันและข้อมูลของตนออกจากสภาพแวดล้อมคลาวด์ได้อย่างง่ายดาย","a":["Reversibility","Availability","Portability","Interoperability"],"ath":["การย้อนกลับได้","ความพร้อมใช้งาน","การพกพา","การทำงานร่วมกัน"],"ans":"A","exp":"Reversibility is the ability for a cloud customer to easily remove their applications or data from a cloud environment, as well as to ensure that all traces of their applications or data have been securely removed per a predefined agreement with the cloud provider","expth":"การย้อนกลับคือความสามารถสำหรับลูกค้าคลาวด์ในการลบแอปพลิเคชันหรือข้อมูลของตนออกจากสภาพแวดล้อมคลาวด์ได้อย่างง่ายดาย ตลอดจนเพื่อให้แน่ใจว่ามีการติดตามแอปพลิเคชันทั้งหมดหรือ ข้อมูลถูกลบออกอย่างปลอดภัยตามข้อตกลงที่กำหนดไว้ล่วงหน้ากับผู้ให้บริการคลาวด์"},{"id":145,"topic":1,"q":"Which of the following is NOT a function performed by the record protocol of TLS?","qth":"ข้อใดต่อไปนี้ไม่ใช่ฟังก์ชันที่ดำเนินการโดยโปรโตคอลบันทึกของ TLS","a":["Encryption","Acceleration","Authentication","Compression"],"ath":["การเข้ารหัส","การเร่งความเร็ว","การตรวจสอบสิทธิ์","การบีบอัด"],"ans":"B","exp":"The record protocol of TLS performs the authentication and encryption of data packets, and in some cases compression as well. It does not perform any acceleration functions","expth":"โปรโตคอลการบันทึกของ TLS ดำเนินการตรวจสอบสิทธิ์และการเข้ารหัสของแพ็กเก็ตข้อมูล และในบางกรณีก็มีการบีบอัดเช่นกัน มันไม่ทำหน้าที่เร่งความเร็วใดๆ"},{"id":146,"topic":1,"q":"What concept does the \"R\" represent with the DREAD model?","qth":"แนวคิด \"R\" แสดงถึงแนวคิดใดด้วยโมเดล DREAD?","a":["Reproducibility","Repudiation","Risk","Residual"],"ath":["ความสามารถในการทำซ้ำ","การปฏิเสธ","ความเสี่ยง","ปริมาณคงเหลือ"],"ans":"D","exp":"Reproducibility is the measure of how easy itis to reproduce and successful use an exploit. Scoring within the DREAD model ranges from 0, signifying a nearly impossibly exploit, up to 10, which signifies something that anyone from a simple function call could exploit, such as a URL","expth":"ความสามารถในการทำซ้ำคือการวัดความง่ายในการทำซ้ำและการใช้ช่องโหว่ที่ประสบความสำเร็จ การให้คะแนนภายในโมเดล DREAD มีตั้งแต่ 0 ซึ่งบ่งบอกถึงการใช้ประโยชน์ที่แทบจะเป็นไปไม่ได้ จนถึง 10 ซึ่งบ่งบอกถึงบางสิ่งที่ใครก็ตามจากการเรียกใช้ฟังก์ชันธรรมดาสามารถใช้ประโยชน์ได้ เช่น URL"},{"id":147,"topic":1,"q":"The SOC Type 2 reports are divided into five principles Which of the five principles must also be included when auditing any of the other four principles?","qth":"รายงาน SOC ประเภท 2 แบ่งออกเป็นห้าหลักการ หลักการใดในห้าข้อที่ต้องรวมอยู่ด้วยเมื่อตรวจสอบหลักการใดๆ ในสี่หลักการอื่นๆ","a":["Confidentiality","Privacy","Security","Availability"],"ath":["การรักษาความลับ","ความเป็นส่วนตัว","ความปลอดภัย","ความพร้อมใช้งาน"],"ans":"C","exp":"Under the SOC guidelines, when any of the four principles other than security are being audited, which includes availability, confidentiality, processing integrity, and privacy, the security principle must also be included with the audit","expth":"ภายใต้หลักเกณฑ์ SOC เมื่อมีการตรวจสอบหลักการใดในสี่ประการนอกเหนือจากความปลอดภัย ซึ่งรวมถึงความพร้อมใช้งาน การรักษาความลับ ความสมบูรณ์ของการประมวลผล และความเป็นส่วนตัว จะต้องรวมหลักความปลอดภัยไว้ในการตรวจสอบด้วย"},{"id":148,"topic":1,"q":"How many additional DNS queries are needed when DNSSEC integrity checks are added?","qth":"เมื่อเพิ่มการตรวจสอบความสมบูรณ์ของ DNSSEC ต้องมีการสืบค้น DNS เพิ่มอีกกี่ครั้ง","a":["Three","Zero","One","Two"],"ath":["สามครั้ง","ศูนย์ (ไม่ต้องเพิ่ม)","หนึ่งครั้ง","สองครั้ง"],"ans":"B","exp":"DNSSEC does not require any additional DNS queries to be performed. The DNSSEC integrity checks and validations are all performed as part of the single DNS lookup resolution","expth":"DNSSEC ไม่ต้องการการสืบค้น DNS เพิ่ม การตรวจสอบความสมบูรณ์และการยืนยันทั้งหมดทำในขั้นตอนการค้นหา DNS ครั้งเดียว"},{"id":149,"topic":1,"q":"Which of the following is the sole responsibility of the cloud customer, regardless of which cloud model is used?","qth":"ข้อใดต่อไปนี้เป็นความรับผิดชอบแต่เพียงผู้เดียวของลูกค้าคลาวด์ ไม่ว่าจะใช้โมเดลคลาวด์ใดก็ตาม","a":["Platform","Infrastructure","Governance","Application"],"ath":["แพลตฟอร์ม","โครงสร้างพื้นฐาน","การกำกับดูแล","แอปพลิเคชัน"],"ans":"C","exp":"Regardless of which cloud-hosting model is used, the cloud customer always has sole responsibility for the governance of systems and data","expth":"ไม่ว่าจะใช้โมเดลโฮสติ้งบนคลาวด์ใดก็ตาม ลูกค้าคลาวด์จะต้องรับผิดชอบแต่เพียงผู้เดียวในการกำกับดูแลระบบและข้อมูลเสมอ"},{"id":150,"topic":1,"q":"Which of the following service categories entails the least amount of support needed on the part of the cloud customer?","qth":"หมวดหมู่บริการใดต่อไปนี้ต้องได้รับการสนับสนุนจำนวนน้อยที่สุดในส่วนของลูกค้าระบบคลาวด์","a":["SaaS","laaS","DaaS","PaaS"],"ath":["SaaS","laaS","DaaS","PaaS"],"ans":"A","exp":"With SaaS providing a fully functioning application that is managed and maintained by the cloud provider, cloud customers incur the least amount of support responsibilities themselves of any service category","expth":"ด้วย SaaS ที่ให้แอปพลิเคชันที่ทำงานเต็มรูปแบบที่ได้รับการจัดการและดูแลโดยผู้ให้บริการระบบคลาวด์ ลูกค้าระบบคลาวด์จะต้องรับผิดชอบในการสนับสนุนจำนวนน้อยที่สุดในบริการประเภทใด ๆ"},{"id":151,"topic":1,"q":"Which of the following would NOT be a reason to activate a BCDR strategy?","qth":"ข้อใดต่อไปนี้จะไม่ใช่เหตุผลในการเปิดใช้งานกลยุทธ์ BCDR","a":["Staffing loss","Terrorism attack","Utility disruptions","Natural disaster"],"ath":["การสูญเสียพนักงาน","การโจมตีด้วยการก่อการร้าย","การหยุดชะงักด้านสาธารณูปโภค","ภัยพิบัติทางธรรมชาติ"],"ans":"A","exp":"The loss of staffing would not be a reason to declare a BCDR situation because it does not impact production operations or equipment, and the same staff would be needed for a BCDR situation","expth":"การสูญเสียพนักงานจะไม่ใช่เหตุผลที่จะประกาศสถานการณ์ BCDR เนื่องจากจะไม่ส่งผลกระทบต่อการดำเนินงานหรืออุปกรณ์การผลิต และจะต้องมีพนักงานคนเดียวกันสำหรับสถานการณ์ BCDR"},{"id":152,"topic":1,"q":"Which of the cloud cross-cutting aspects relates to the oversight of processes and systems, as well as to ensuring their compliance with specific policies and regulations?","qth":"แง่มุมใดที่ข้ามระบบคลาวด์ที่เกี่ยวข้องกับการกำกับดูแลกระบวนการและระบบ ตลอดจนเพื่อให้แน่ใจว่ากระบวนการและระบบเป็นไปตามนโยบายและข้อบังคับเฉพาะ","a":["Governance (EEXEITD","Regulatory requirements","Service-level agreements","Auditabiity"],"ath":["การกำกับดูแล (EEEXEITD","ข้อกำหนดด้านกฎระเบียบ","ข้อตกลงระดับบริการ","การตรวจสอบ"],"ans":"D","exp":"Auditing involves reports and evidence that show user activity, compliance with controls and regulations, the systems and processes that run and what they do, as well as information and data access and modification records. A cloud environment adds additional complexity to traditional audits because the cloud customer will not have the same level of access to systems and data as they would in a traditional data center","expth":"การตรวจสอบเกี่ยวข้องกับรายงานและหลักฐานที่แสดงถึงกิจกรรมของผู้ใช้ การปฏิบัติตามการควบคุมและกฎระเบียบ ระบบและ กระบวนการที่ทำงานและสิ่งที่พวกเขาทำ รวมถึงการเข้าถึงข้อมูลและบันทึกการแก้ไข สภาพแวดล้อมระบบคลาวด์เพิ่มความซับซ้อนเพิ่มเติมให้กับการตรวจสอบแบบดั้งเดิม เนื่องจากลูกค้าระบบคลาวด์จะไม่สามารถเข้าถึงระบบและข้อมูลในระดับเดียวกับที่พวกเขาทำในศูนย์ข้อมูลแบบเดิม"},{"id":153,"topic":1,"q":"Which of the cloud cross-cutting aspects relates to the ability to reuse or move components of an application or service?","qth":"ลักษณะที่ตัดขวางระบบคลาวด์ข้อใดที่เกี่ยวข้องกับความสามารถในการนำกลับมาใช้ใหม่หรือย้ายส่วนประกอบของแอปพลิเคชันหรือบริการ","a":["Availabilty","Interoperability","Reversibility","Portability"],"ath":["ความพร้อมใช้งาน","การทำงานร่วมกัน","การย้อนกลับได้","การพกพา"],"ans":"B","exp":"Interoperability is the ease with which one can move or reuse components of an application or service. This is maximized when services are designed without specific dependencies on underlying platforms, operating systems, locations, or cloud providers","expth":"การทำงานร่วมกันคือความง่ายในการเคลื่อนย้ายหรือนำส่วนประกอบของแอปพลิเคชันหรือบริการกลับมาใช้ใหม่ สิ่งนี้จะถูกขยายให้สูงสุดเมื่อบริการได้รับการออกแบบโดยไม่ต้องพึ่งพาแพลตฟอร์ม ระบบปฏิบัติการ ตำแหน่งที่ตั้ง หรือผู้ให้บริการคลาวด์โดยเฉพาะ"},{"id":154,"topic":1,"q":"Which of the following is a restriction that can be enforced by information rights management (IRM) that is not possible for traditional fle system controls?","qth":"ข้อใดต่อไปนี้เป็นข้อจำกัดที่สามารถบังคับใช้โดยการจัดการสิทธิ์ในข้อมูล (IRM) ซึ่งไม่สามารถทำได้สำหรับการควบคุมระบบ fle แบบดั้งเดิม","a":["Delete","Modify","Read","Print"],"ath":["ลบ","แก้ไข","อ่าน","พิมพ์"],"ans":"D","exp":"IRM allows an organization to control who can print a set of information. This is not be possible under traditional file system controls, where if a user can read a file, they are able to print it as well","expth":"IRM ช่วยให้องค์กรสามารถควบคุมผู้ที่สามารถพิมพ์ชุดข้อมูลได้ สิ่งนี้ไม่สามารถทำได้ภายใต้การควบคุมระบบไฟล์แบบเดิม ซึ่งหากผู้ใช้สามารถอ่านไฟล์ได้ ก็สามารถพิมพ์ได้เช่นกัน"},{"id":155,"topic":1,"q":"What strategy involves hiding data in a data set to prevent someone from identifying specific individuals based on other data fields present?","qth":"กลยุทธ์ใดที่เกี่ยวข้องกับการซ่อนข้อมูลในชุดข้อมูลเพื่อป้องกันไม่ให้ผู้อื่นระบุตัวบุคคลที่เฉพาะเจาะจงโดยอิงตามช่องข้อมูลอื่น ๆ ที่มีอยู่","a":["Anonymization","Tokenization","Masking","Obfuscation"],"ath":["การทำให้ไม่ระบุชื่อ (Anonymization)","การทำโทเค็น (Tokenization)","การปกปิด (Masking)","การทำให้สับสน (Obfuscation)"],"ans":"A","exp":"With data anonymization, data is manipulated in such a way so as to prevent the identification of an individual through various data objects, and is often used in conjunction with other concepts such as masking","expth":"ด้วยการไม่เปิดเผยข้อมูล ข้อมูลจะถูกจัดการในลักษณะเพื่อป้องกันการระบุตัวบุคคลผ่านออบเจ็กต์ข้อมูลต่างๆ และมักจะใช้ร่วมกับแนวคิดอื่น ๆ เช่น การมาสก์"},{"id":156,"topic":1,"q":"What type of security threat is DNSSEC designed to prevent?","qth":"DNSSEC ออกแบบมาเพื่อป้องกันภัยคุกคามความปลอดภัยประเภทใด","a":["Account hijacking","Snooping","Spoofing","Injection"],"ath":["การไฮแจ็กบัญชี","การสอดแนม","การปลอมแปลง","การฉีด"],"ans":"C","exp":"DNSSEC is designed to prevent the spoofing and redirection of DNS resolutions to rogue sites","expth":"DNSSEC ได้รับการออกแบบมาเพื่อป้องกันการปลอมแปลงและการเปลี่ยนเส้นทางการแก้ไข DNS ไปยังไซต์หลอกลวง"},{"id":157,"topic":1,"q":"Which European Union directive pertains to personal data privacy and an individual's control over their personal data?","qth":"คำสั่งของสหภาพยุโรปข้อใดที่เกี่ยวข้องกับความเป็นส่วนตัวของข้อมูลส่วนบุคคลและการควบคุมข้อมูลส่วนบุคคลของแต่ละบุคคล","a":["99/9/EC","95/46/EC","2000/1/EC","2013/27001/EC"],"ath":["99/9/EC","95/46/EC","2000/1/EC","2013/27001/EC"],"ans":"B","exp":"Directive 95/46/EC is titled “On the protection of individuals with regard to the processing of personal data and on the free movement of such data\"","expth":"คำสั่ง 95/46/EC มีชื่อว่า “ในการคุ้มครองบุคคลที่เกี่ยวข้องกับการประมวลผล ของข้อมูลส่วนบุคคลและการเคลื่อนย้ายข้อมูลดังกล่าวอย่างเสรี\""},{"id":158,"topic":1,"q":"Which of the cloud cross-cutting aspects relates to the requirements placed on a system or application by law, policy, or requirements from standards?","qth":"แง่มุมใดที่ข้ามระบบคลาวด์ที่เกี่ยวข้องกับข้อกำหนดที่วางไว้บนระบบหรือแอปพลิเคชันตามกฎหมาย นโยบาย หรือข้อกำหนดจากมาตรฐาน","a":["regulatory requirements (ENCE)","Auditability","Service-level agreements","Governance"],"ath":["ข้อกำหนดด้านกฎระเบียบ (ENCE)","การตรวจสอบ","ข้อตกลงระดับบริการ","การกำกับดูแล"],"ans":"A","exp":"Regulatory requirements are those imposed upon businesses and their operations either by law, regulation, policy, or standards and guidelines. These requitements are specific either to the locality in which the company or application is based or to the specific nature of the data and transactions conducted","expth":"ข้อกำหนดด้านกฎระเบียบคือข้อกำหนดที่บังคับใช้กับธุรกิจและการดำเนินธุรกิจตามกฎหมาย กฎระเบียบ นโยบาย หรือมาตรฐานและแนวปฏิบัติ ข้อกำหนดเหล่านี้เป็นข้อกำหนดเฉพาะสำหรับท้องถิ่นที่บริษัทหรือแอปพลิเคชันตั้งอยู่ หรือตามลักษณะเฉพาะของข้อมูลและธุรกรรมที่ดำเนินการ"},{"id":159,"topic":1,"q":"Which data point that auditors always desire is very difficult to provide within a cloud environment?","qth":"จุดข้อมูลใดที่ผู้ตรวจสอบต้องการอยู่เสมอเป็นเรื่องยากมากที่จะจัดเตรียมภายในสภาพแวดล้อมคลาวด์","a":["Access policy","Systems architecture","Baselines","Privacy statement"],"ath":["นโยบายการเข้าถึง","สถาปัตยกรรมระบบ","พื้นฐาน","คำชี้แจงความเป็นส่วนตัว"],"ans":"B","exp":"Cloud environments are constantly changing and often span multiple physical locations. A cloud customer is also very unlikely to have knowledge and insight into the underlying systems architecture in a cloud environment. Both of these realities make it very difficult, if not impossible, for an organization to provide a comprehensive systems design document","expth":"สภาพแวดล้อมคลาวด์มีการเปลี่ยนแปลงตลอดเวลาและมักจะครอบคลุมตำแหน่งทางกายภาพหลายแห่ง ลูกค้าระบบคลาวด์ไม่น่าจะมีความรู้และข้อมูลเชิงลึกเกี่ยวกับสถาปัตยกรรมระบบพื้นฐานในสภาพแวดล้อมระบบคลาวด์มากนัก ความเป็นจริงทั้งสองประการนี้ทำให้เป็นเรื่องยากมาก หรือเป็นไปไม่ได้เลย สำหรับองค์กรในการจัดหาเอกสารการออกแบบระบบที่ครอบคลุม"},{"id":160,"topic":1,"q":"What type of host is exposed to the public Internet for a specific reason and hard","qth":"โฮสต์ประเภทใดที่เปิดเผยต่ออินเทอร์เน็ตสาธารณะด้วยเหตุผลเฉพาะและฮาร์ด","a":["Proxy","Bastion","Honeypot","WAF"],"ath":["พรอกซี","Bastion","Honeypot","WAF"],"ans":"B","exp":"A bastion host is a server that is fully exposed to the public Internet, but is extremely hard","expth":"โฮสต์ป้อมปราการคือเซิร์ฟเวอร์ที่เปิดเผยต่ออินเทอร์เน็ตสาธารณะโดยสมบูรณ์ แต่มีความยากมาก"},{"id":161,"topic":1,"q":"Which security concept is focused on the trustworthiness of data?","qth":"แนวคิดด้านความปลอดภัยใดที่มุ่งเน้นไปที่ความน่าเชื่อถือของข้อมูล","a":["Integrity","Availability","Nonrepudiation","Confidentiality"],"ath":["ความสมบูรณ์","ความพร้อมใช้งาน","การไม่ปฏิเสธ","การรักษาความลับ"],"ans":"A","exp":"Integrity is focused on the trustworthiness of data as well as the prevention of unauthorized modification or tampering of it. A prime consideration for maintaining integrity is an emphasis on the change management and configuration management aspects of operations, so that all modifications are predictable, tracked, logged, and verified, whether they are performed by actual human users or systems processes and scripts","expth":"ความสมบูรณ์มุ่งเน้นไปที่ความน่าเชื่อถือของข้อมูลตลอดจนการป้องกันการแก้ไขหรือดัดแปลงโดยไม่ได้รับอนุญาต ข้อควรพิจารณาที่สำคัญในการรักษาความสมบูรณ์คือการเน้นที่การจัดการการเปลี่ยนแปลงและการจัดการการกำหนดค่าของการดำเนินงาน เพื่อให้สามารถคาดการณ์ ติดตาม บันทึก และตรวจสอบการแก้ไขทั้งหมดได้ ไม่ว่าจะดำเนินการโดยผู้ใช้ที่เป็นมนุษย์จริงหรือกระบวนการและสคริปต์ของระบบ"},{"id":162,"topic":1,"q":"Which OSI layer does IPsec operate at?","qth":"IPsec ทำงานที่เลเยอร์ OSI ใด","a":["Network","transport","Application","Presentation"],"ath":["เครือข่าย","การขนส่ง","แอปพลิเคชัน","การนำเสนอ"],"ans":"A","exp":"A major difference between IPsec and other protocols such as TLS is that IPsec operates at the Internet network layer rather than the application layer, allowing for complete end-to-end encryption of all communications and traffic","expth":"ความแตกต่างที่สำคัญระหว่าง IPsec และโปรโตคอลอื่นๆ เช่น TLS คือ IPsec ทำงานที่เลเยอร์เครือข่ายอินเทอร์เน็ตมากกว่าเลเยอร์แอปพลิเคชัน ช่วยให้สามารถเข้ารหัสจากต้นทางถึงปลายทางได้อย่างสมบูรณ์ของการสื่อสารและการรับส่งข้อมูลทั้งหมด"},{"id":163,"topic":1,"q":"Which of the cloud cross-cutting aspects relates to the requirements placed on the cloud provider by the cloud customer for minimum performance standards and requirements that must be met?","qth":"ลักษณะที่ข้ามระบบคลาวด์ในข้อใดที่เกี่ยวข้องกับข้อกำหนดที่ลูกค้าคลาวด์วางไว้บนผู้ให้บริการคลาวด์สำหรับมาตรฐานประสิทธิภาพขั้นต่ำและข้อกำหนดที่ต้องปฏิบัติตาม","a":["Regulatory requirements","SLAs","Auditability","Governance"],"ath":["ข้อกำหนดด้านกฎระเบียบ","SLAs","การตรวจสอบ","การกำกับดูแล"],"ans":"B","exp":"Whereas a contract spells out general terms and costs for services, the SLA is where the real meat of the business relationship and concrete requirements come into play. The SLA spells out in clear terms the minimum requirements for uptime, availability, processes, customer service and support, security controls and requiements, auditing and reporting, and potentially many other areas that define the business relationship and the success of it","expth":"ในขณะที่สัญญาระบุข้อกำหนดทั่วไปและต้นทุนสำหรับการบริการ SLA คือที่มาของความสัมพันธ์ทางธุรกิจและข้อกำหนดที่เป็นรูปธรรมอย่างแท้จริง เข้าสู่การเล่น SLA ระบุไว้อย่างชัดเจนถึงข้อกำหนดขั้นต่ำสำหรับสถานะการออนไลน์ ความพร้อมใช้งาน กระบวนการ การบริการลูกค้าและการสนับสนุน การควบคุมและข้อกำหนดด้านความปลอดภัย การตรวจสอบและการรายงาน และด้านอื่นๆ ที่อาจกำหนดความสัมพันธ์ทางธุรกิจและความสำเร็จของสิ่งนี้"},{"id":164,"topic":1,"q":"Which of the following service capabilities gives the cloud customer the most control over resources and configurations?","qth":"ความสามารถในการบริการใดต่อไปนี้ช่วยให้ลูกค้าระบบคลาวด์สามารถควบคุมทรัพยากรและการกำหนดค่าได้มากที่สุด","a":["Desktop","Platform","Infrastructure","Software"],"ath":["เดสก์ท็อป","แพลตฟอร์ม","โครงสร้างพื้นฐาน","ซอฟต์แวร์"],"ans":"C","exp":"The infrastructure service capability gives the cloud customer substantial control in provisioning and configuring resources, including processing, storage, and network resources","expth":"ความสามารถในการให้บริการโครงสร้างพื้นฐานช่วยให้ลูกค้าระบบคลาวด์สามารถควบคุมการจัดเตรียมและการกำหนดค่าทรัพยากรได้อย่างมาก รวมถึงการประมวลผล พื้นที่เก็บข้อมูล และทรัพยากรเครือข่าย"},{"id":165,"topic":1,"q":"What concept does the ‘I represent with the STRIDE threat model?","qth":"แนวคิดใดที่ 'ฉันเป็นตัวแทนด้วยโมเดลภัยคุกคาม STRIDE","a":["Integrity","Information disclosure","IT security","Insider threat"],"ath":["ความซื่อสัตย์","การเปิดเผยข้อมูล","ความปลอดภัยด้านไอที","ภัยคุกคามจากภายใน"],"ans":"B","exp":"Perhaps the biggest concern for any user is having their personal and sensitive information disclosed by an application. There are many aspects of an application to consider with security and protecting this information, and it is very difficult for any application to fully ensure security from start to finish. The obvious focus is on security within the application itself, as well as protecting and storing the data","expth":"บางทีความกังวลที่ใหญ่ที่สุดสำหรับผู้ใช้ก็คือการเปิดเผยข้อมูลส่วนบุคคลและข้อมูลที่ละเอียดอ่อนของตนโดยแอปพลิเคชัน มีหลายแง่มุมของแอปพลิเคชันที่ต้องพิจารณาด้านความปลอดภัยและการปกป้องข้อมูลนี้ และเป็นเรื่องยากมากสำหรับแอปพลิเคชันใดๆ ที่จะรับประกันความปลอดภัยอย่างเต็มที่ตั้งแต่ต้นจนจบ จุดเน้นที่ชัดเจนอยู่ที่การรักษาความปลอดภัยภายในแอปพลิเคชันตลอดจนการปกป้องและจัดเก็บข้อมูล"},{"id":166,"topic":1,"q":"At which stage of the BCDR plan creation phase should security be included in discussions?","qth":"ขั้นตอนการสร้างแผน BCDR ควรรวมความปลอดภัยไว้ในการอภิปรายที่ขั้นตอนใด","a":["Define scope","Analyze","Assess risk","Gather requirements"],"ath":["กำหนดขอบเขต","วิเคราะห์","ประเมินความเสี่ยง","รวบรวมข้อกำหนด"],"ans":"A","exp":"Security should be included in discussions from the very first phase when defining the scope. Adding security later is likely to incur additional costs in time and money, ot will result in an incomplete or inadequate plan","expth":"ความปลอดภัยควรรวมอยู่ในการอภิปรายตั้งแต่ระยะแรกสุดเมื่อกำหนดขอบเขต การเพิ่มความปลอดภัยในภายหลังมีแนวโน้มที่จะต้องเสียค่าใช้จ่ายทั้งเวลาและเงินมากขึ้น ส่งผลให้แผนไม่ครบถ้วนหรือไม่เพียงพอ"},{"id":167,"topic":1,"q":"Which approach is typically the most efficient method to use for data discovery?","qth":"โดยทั่วไปแล้วแนวทางใดเป็นวิธีที่มีประสิทธิภาพที่สุดในการค้นหาข้อมูล","a":["Metadata","Content analysis","Labels","ACLs"],"ath":["ข้อมูลเมตา","การวิเคราะห์เนื้อหา","ป้ายกำกับ","ACLs"],"ans":"D","exp":"Metadata is data about data. It contains information about the type of data, how it is stored and organized, or information about its creation and use","expth":"ข้อมูลเมตาคือข้อมูลเกี่ยวกับข้อมูล ประกอบด้วยข้อมูลเกี่ยวกับประเภทของข้อมูล วิธีจัดเก็บและจัดระเบียบ หรือข้อมูลเกี่ยวกับการสร้างและการใช้งาน"},{"id":168,"topic":1,"q":"Which of the following features is a main benefit of PaaS over laaS?","qth":"คุณสมบัติใดต่อไปนี้เป็นประโยชน์หลักของ PaaS เหนือ laaS?","a":["Location independence","High-availability","Physical security requirements","Auto-scaling"],"ath":["ความเป็นอิสระของตำแหน่ง","ความพร้อมใช้งานสูง","ข้อกำหนดด้านความปลอดภัยทางกายภาพ","การปรับขนาดอัตโนมัติ"],"ans":"D","exp":"With PaaS providing a fully configured and managed framework, auto-scaling can be implemented to programmatically adjust resources based on the current demands of the environment","expth":"ด้วย PaaS ที่ให้เฟรมเวิร์กที่ได้รับการกำหนดค่าและจัดการอย่างสมบูรณ์ การปรับขนาดอัตโนมัติสามารถนำไปใช้เพื่อปรับทรัพยากรโดยทางโปรแกรมตามความต้องการในปัจจุบันของสภาพแวดล้อม"},{"id":169,"topic":1,"q":"Which audit type has been largely replaced by newer approaches since 2011?","qth":"ประเภทการตรวจสอบใดที่ส่วนใหญ่ถูกแทนที่ด้วยแนวทางใหม่ตั้งแต่ปี 2554","a":["SOC Type1","SSAE-16","SAS-70","SOC Type 2"],"ath":["SOC Type1","SSAE-16","SAS-70","SOC ประเภท 2"],"ans":"C","exp":"SAS-70 reports were replaced in 2011 with the SSAE-16 reports throughout the industry","expth":"รายงาน SAS-70 ถูกแทนที่ด้วยรายงาน SSAE-16 ทั่วทั้งอุตสาหกรรมในปี 2554"},{"id":170,"topic":1,"q":"Which of the following can be useful for protecting cloud customers from a denial-of-service (DoS) attack against another customer hosted in the same cloud?","qth":"ข้อใดต่อไปนี้มีประโยชน์ในการปกป้องลูกค้าระบบคลาวด์จากการโจมตีแบบปฏิเสธการให้บริการ (DoS) กับลูกค้ารายอื่นที่โฮสต์อยู่ในระบบคลาวด์เดียวกัน","a":["Reservations","Measured service","Limits","Shares"],"ath":["การจอง","บริการที่วัดผล","ข้อจำกัด","การแบ่งปัน"],"ans":"A","exp":"Reservations ensure that a minimum level of resources will always be available to a cloud customer for them to start and operate their services. In the event of a DoS attack against one customer, they can guarantee that the other customers will still be able to operate","expth":"การจองทำให้แน่ใจได้ว่าลูกค้าระบบคลาวด์จะมีระดับทรัพยากรขั้นต่ำอยู่เสมอเพื่อให้ลูกค้าเริ่มและดำเนินการบริการของตนได้ ในกรณีที่มีการโจมตี DoS กับลูกค้ารายหนึ่ง พวกเขาสามารถรับประกันได้ว่าลูกค้ารายอื่นจะยังคงสามารถดำเนินการได้"},{"id":171,"topic":1,"q":"Which of the following service capabilities gives the cloud customer the least amount of control over configurations and deployments?","qth":"ความสามารถในการบริการใดต่อไปนี้ช่วยให้ลูกค้าระบบคลาวด์สามารถควบคุมการกำหนดค่าและการปรับใช้ได้น้อยที่สุด","a":["Platform","Infrastructure","Software","Desktop"],"ath":["แพลตฟอร์ม","โครงสร้างพื้นฐาน","ซอฟต์แวร์","เดสก์ท็อป"],"ans":"C","exp":"The software service capability gives the cloud customer a fully established application, where only minimal user configuration options are allowed","expth":"ความสามารถในการให้บริการซอฟต์แวร์ช่วยให้ลูกค้าระบบคลาวด์มีแอปพลิเคชันที่สร้างขึ้นอย่างสมบูรณ์ โดยอนุญาตให้มีตัวเลือกการกำหนดค่าผู้ใช้เพียงเล็กน้อยเท่านั้น"},{"id":172,"topic":1,"q":"What does the \"SOC\" acronym refer to with audit reports?","qth":"ตัวย่อ \"SOC\" อ้างอิงถึงอะไรในรายงานการตรวจสอบ","a":["Service Origin Confidentiality","System Organization Confidentiality","Service Organizational Control","System Organization Control"],"ath":["การรักษาความลับของแหล่งกำเนิดบริการ","การรักษาความลั
