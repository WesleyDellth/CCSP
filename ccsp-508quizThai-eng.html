es not"},{"id":490,"topic":1,"q":"Which of the following roles is responsible for creating cloud components and the testing and validation of services?","qth":"บทบาทใดต่อไปนี้มีหน้าที่รับผิดชอบในการสร้างส่วนประกอบระบบคลาวด์ รวมถึงการทดสอบและการตรวจสอบความถูกต้องของบริการ","a":["Cloud auditor","Inter-cloud provider","Cloud service broker","Cloud service developer"],"ath":["ผู้ตรวจสอบระบบคลาวด์","ผู้ให้บริการระหว่างระบบคลาวด์","นายหน้าบริการระบบคลาวด์","ผู้พัฒนาบริการระบบคลาวด์"],"ans":"D","exp":"The cloud service developer is responsible for developing and creating cloud components and services, as well as for testing and validating services","expth":"นักพัฒนาบริการระบบคลาวด์มีหน้าที่รับผิดชอบในการพัฒนาและสร้างส่วนประกอบและบริการระบบคลาวด์ ตลอดจนการทดสอบและการตรวจสอบบริการ"},{"id":491,"topic":1,"q":"Which of the following storage types is most closely associated with a database-type storage implementation?","qth":"ประเภทพื้นที่เก็บข้อมูลใดต่อไปนี้มีความสัมพันธ์อย่างใกล้ชิดกับการใช้งานพื้นที่เก็บข้อมูลประเภทฐานข้อมูลมากที่สุด","a":["Object","Unstructured","Volume","Structured"],"ath":["วัตถุ","ไม่มีโครงสร้าง","ปริมาณ","มีโครงสร้าง"],"ans":"D","exp":"Structured storage involves organized and categorized data, which most closely resembles and operates like a database system would","expth":"พื้นที่จัดเก็บที่มีโครงสร้างเกี่ยวข้องกับการจัดระเบียบและจัดหมวดหมู่ข้อมูลที่คล้ายคลึงและดำเนินการอย่างใกล้ชิดที่สุดเหมือนกับระบบฐานข้อมูล"},{"id":492,"topic":1,"q":"The data custodian is responsible for which of the following?","qth":"The data custodian is responsible for which of the following?","a":["Data context","Data content","The safe custody, transport, and storage of the data and implementation of business rules","Logging access and alerts"],"ath":["Data context","Data content","The safe custody, transport, and storage of the data and implementation of business rules","Logging access and alerts"],"ans":"C","exp":"A data custodian is responsible for the safe custody, transport, and storage of data, and the implementation of business roles","expth":"A data custodian is responsible for the safe custody, transport, and storage of data, and the implementation of business roles"},{"id":493,"topic":1,"q":"Which of the following is the least challenging with regard to eDiscovery in the cloud?","qth":"Which of the following is the least challenging with regard to eDiscovery in the cloud?","a":["Identifying roles such as data owner, controller and processor","Decentralization of data storage","Forensic analysis","Complexities of International law"],"ath":["Identifying roles such as data owner, controller and processor","Decentralization of data storage","Forensic analysis","Complexities of International law"],"ans":"C","exp":"Forensic analysis is the least challenging of the answers provided as it refers to the analysis of data once it is obtained. The challenges revolve around obtaining the data for analysis due to the complexities of international law, the decentralization of data storage or difficulty knowing where to look, and identifying the data owner, controller, and processor","expth":"Forensic analysis is the least challenging of the answers provided as it refers to the analysis of data once it is obtained. The challenges revolve around obtaining the data for analysis due to the complexities of international law, the decentralization of data storage or difficulty knowing where to look, and identifying the data owner, controller, and processor"},{"id":494,"topic":1,"q":"What is the Cloud Security Alliance Cloud Controls Matrix (CCM)?","qth":"What is the Cloud Security Alliance Cloud Controls Matrix (CCM)?","a":["A set of software development life cycle requirements for cloud service providers","An inventory of cloud services security controls that are arranged into a hierarchy of security domains","An inventory of cloud service security controls that are arranged into separate security domains","Aset of regulatory requirements for cloud service providers"],"ath":["A set of software development life cycle requirements for cloud service providers","An inventory of cloud services security controls that are arranged into a hierarchy of security domains","An inventory of cloud service security controls that are arranged into separate security domains","Aset of regulatory requirements for cloud service providers"],"ans":"C","exp":"The CSA CCM is an inventory of cloud service security controls that are arranged into separate security domains, not a hierarchy","expth":"The CSA CCM is an inventory of cloud service security controls that are arranged into separate security domains, not a hierarchy"},{"id":495,"topic":1,"q":"Which of the following is a valid risk management metric?","qth":"Which of the following is a valid risk management metric?","a":["KPI","KRI","SOC","SLA"],"ath":["KPI","KRI","SOC","SLA"],"ans":"B","exp":"KRI stands for key risk indicator. KRls are the red flags if you will in the world of risk management. When these change, they indicate something is amiss and should be looked at quickly to determine if the change is minor or indicative of something important","expth":"KRI stands for key risk indicator. KRls are the red flags if you will in the world of risk management. When these change, they indicate something is amiss and should be looked at quickly to determine if the change is minor or indicative of something important"},{"id":496,"topic":1,"q":"Which of the following is the best example of a key component of regulated PII?","qth":"Which of the following is the best example of a key component of regulated PII?","a":["Audit rights of subcontractors","Items that should be implemented","PCI DSS","Mandatory breach reporting"],"ath":["Audit rights of subcontractors","Items that should be implemented","PCI DSS","Mandatory breach reporting"],"ans":"D","exp":"Mandatory breach reporting is the best example of regulated Pll components. The rest are generally considered components of contractual Pll","expth":"Mandatory breach reporting is the best example of regulated Pll components. The rest are generally considered components of contractual Pll"},{"id":497,"topic":1,"q":"Which of the following components are part of what a CCSP should review when looking at contracting with a cloud service provider?","qth":"Which of the following components are part of what a CCSP should review when looking at contracting with a cloud service provider?","a":["Redundant uplink grafts","Background checks for the provider's personnel","The physical layout of the datacenter","Use of subcontractors"],"ath":["Redundant uplink grafts","Background checks for the provider's personnel","The physical layout of the datacenter","Use of subcontractors"],"ans":"D","exp":"The use of subcontractors can add risk to the supply chain and should be considered; trusting the provider's management of their vendors and suppliers (including subcontractors) is important to trusting the provider. Conversely, the customer is not likely to be allowed to review the physical design of the datacenter (or, indeed, even know the exact location of the datacenter) or the personnel security specifics for the provider's staff. 1€Redundant uplink graftsy€ is a nonsense term used as a distractor","expth":"The use of subcontractors can add risk to the supply chain and should be considered; trusting the provider's management of their vendors and suppliers (including subcontractors) is important to trusting the provider. Conversely, the customer is not likely to be allowed to review the physical design of the datacenter (or, indeed, even know the exact location of the datacenter) or the personnel security specifics for the provider's staff. 1€Redundant uplink graftsy€ is a nonsense term used as a distractor"},{"id":498,"topic":1,"q":"Which of the following is not a way to manage risk?","qth":"Which of the following is not a way to manage risk?","a":["Transferring","Accepting","Mitigating","Enveloping"],"ath":["Transferring","Accepting","Mitigating","Enveloping"],"ans":"D","exp":"Enveloping is a nonsense term, unrelated to risk management. The rest are not","expth":"Enveloping is a nonsense term, unrelated to risk management. The rest are not"},{"id":499,"topic":1,"q":"Which of the following terms is not associated with cloud forensics?","qth":"Which of the following terms is not associated with cloud forensics?","a":["eDiscovery","Chain of custody","Analysis","Plausibilty"],"ath":["eDiscovery","Chain of custody","Analysis","Plausibilty"],"ans":"D","exp":"Plausibilty, here, is a distractor and not specifically relevant to cloud forensics","expth":"Plausibilty, here, is a distractor and not specifically relevant to cloud forensics"},{"id":500,"topic":1,"q":"Which is the lowest level of the CSA STAR program?","qth":"Which is the lowest level of the CSA STAR program?","a":["Attestation","Self-assessment","Hybridization","Continuous monitoring"],"ath":["Attestation","Self-assessment","Hybridization","Continuous monitoring"],"ans":"B","exp":"The lowest level is Level 1, which is self-assessment, Level 2 is an external third-party attestation, and Level 3 is a continuous-monitoring program. Hybridization does not exist as part of the CSA STAR program","expth":"The lowest level is Level 1, which is self-assessment, Level 2 is an external third-party attestation, and Level 3 is a continuous-monitoring program. Hybridization does not exist as part of the CSA STAR program"},{"id":501,"topic":1,"q":"Which of the following is the primary purpose of an SOC 3 report?","qth":"Which of the following is the primary purpose of an SOC 3 report?","a":["HIPAA compliance","Absolute assurances","Seal of approval","Compliance with PCI/DSS"],"ath":["HIPAA compliance","Absolute assurances","Seal of approval","Compliance with PCI/DSS"],"ans":"C","exp":"The SOC 3 report is more of an attestation than a full evaluation of controls associated with a service provider","expth":"The SOC 3 report is more of an attestation than a full evaluation of controls associated with a service provider"},{"id":502,"topic":1,"q":"Which of the following is not an example of a highly regulated environment?","qth":"Which of the following is not an example of a highly regulated environment?","a":["Financial services","Healthcare","Public companies","Wholesale or distribution"],"ath":["Financial services","Healthcare","Public companies","Wholesale or distribution"],"ans":"D","exp":"Wholesalers or distributors are generally not regulated, although the products they sell may be","expth":"Wholesalers or distributors are generally not regulated, although the products they sell may be"},{"id":503,"topic":1,"q":"Which of the following methods of addressing risk is most associated with insurance?","qth":"Which of the following methods of addressing risk is most associated with insurance?","a":["Mitigation","Transference (ENE)","Avoidance","Acceptance"],"ath":["Mitigation","Transference (ENE)","Avoidance","Acceptance"],"ans":"B","exp":"Avoidance halts the business process, mitigation entails using controls to reduce risk, acceptance involves taking on the risk, and transference usually involves, insurance","expth":"Avoidance halts the business process, mitigation entails using controls to reduce risk, acceptance involves taking on the risk, and transference usually involves, insurance"},{"id":504,"topic":1,"q":"Legal controls refer to which of the following?","qth":"Legal controls refer to which of the following?","a":["ISO 27001","PCI DSS","NIST 800-53r4","Controls designed to comply with laws and regulations related to the cloud environment"],"ath":["ISO 27001","PCI DSS","NIST 800-53r4","Controls designed to comply with laws and regulations related to the cloud environment"],"ans":"D","exp":"Legal controls are those controls that are designed to comply with laws and regulations whether they be local or international","expth":"Legal controls are those controls that are designed to comply with laws and regulations whether they be local or international"},{"id":505,"topic":1,"q":"Which of the following best describes a cloud carrier?","qth":"Which of the following best describes a cloud carrier?","a":["The intermediary who provides connectivity and transport of cloud providers and cloud consumers","Aperson or entity responsible for making a cloud service available to consumers","The person or entity responsible for transporting data across the Internet","The person or entity responsible for keeping cloud services running for customers"],"ath":["The intermediary who provides connectivity and transport of cloud providers and cloud consumers","Aperson or entity responsible for making a cloud service available to consumers","The person or entity responsible for transporting data across the Internet","The person or entity responsible for keeping cloud services running for customers"],"ans":"A","exp":"A cloud carrier is the intermediary who provides connectivity and transport of cloud services between cloud providers and cloud customers","expth":"A cloud carrier is the intermediary who provides connectivity and transport of cloud services between cloud providers and cloud customers"},{"id":506,"topic":1,"q":"Gap analysis is performed for what reason?","qth":"Gap analysis is performed for what reason?","a":["To begin the benchmarking process","To assure proper accounting practices are being used","To provide assurances to cloud customers","To ensure all controls are in place and working properly"],"ath":["To begin the benchmarking process","To assure proper accounting practices are being used","To provide assurances to cloud customers","To ensure all controls are in place and working properly"],"ans":"D","exp":"The primary purpose of the gap analysis is to begin the benchmarking process against risk and security standards and frameworks","expth":"The primary purpose of the gap analysis is to begin the benchmarking process against risk and security standards and frameworks"},{"id":507,"topic":1,"q":"Which of the following frameworks focuses specifically on design implementation and management?","qth":"Which of the following frameworks focuses specifically on design implementation and management?","a":["ISO 31000:2009","ISO 27017","NIST 800-92","HIPAA"],"ath":["ISO 31000:2009","ISO 27017","NIST 800-92","HIPAA"],"ans":"A","exp":"ISO 31000:2009 specifically focuses on design implementation and management. HIPAA refers to health care regulations, NIST 800-92 is about log management, and ISO 27017 is about cloud specific security controls","expth":"ISO 31000:2009 specifically focuses on design implementation and management. HIPAA refers to health care regulations, NIST 800-92 is about log management, and ISO 27017 is about cloud specific security controls"},{"id":508,"topic":1,"q":"Which of the following report is most aligned with financial control audits?","qth":"Which of the following report is most aligned with financial control audits?","a":["SSAE 16","SOC2","SOc1","SOC3"],"ath":["SSAE 16","SOC2","SOc1","SOC3"],"ans":"C","exp":"The SOC 1 report focuses primarily on controls associated with financial services. While IT controls are certainly part of most accounting systems today, the focus is on the controls around those financial systems","expth":"The SOC 1 report focuses primarily on controls associated with financial services. While IT controls are certainly part of most accounting systems today, the focus is on the controls around those financial systems"},{"id":509,"topic":1,"q":"Which of the following is not a risk management framework?","qth":"ข้อใดต่อไปนี้ไม่ใช่กรอบการบริหารความเสี่ยง","a":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"ath":["COBIT","Hex GBL","ISO 31000:2009","NIST SP 800-37"],"ans":"B","exp":"Hex GBL is a reference to a computer part in Terry Pratchett's fictional Discworld universe. The rest are not","expth":"Hex GBL เป็นการอ้างอิงถึงชิ้นส่วนคอมพิวเตอร์ในจักรวาล Discworld ของ Terry Pratchett ส่วนที่เหลือไม่ได้"},{"id":510,"topic":1,"q":"Limits for resource utilization can be set at different levels within a cloud environment to ensure that no particular entity can consume a level of resources that impacts other cloud customers. Which of the following is NOT a unit covered by limits?","qth":"Limits for resource utilization can be set at different levels within a cloud environment to ensure that no particular entity can consume a level of resources that impacts other cloud customers. Which of the following is NOT a unit covered by limits?","a":["Hypervisor","Cloud customer","Virtual machine","Service"],"ath":["Hypervisor","Cloud customer","Virtual machine","Service"],"ans":"A","exp":"The hypervisor level, as a backend cloud infrastructure component, is not a unit where limits may be applied to control resource utilization. Limits can be placed at the service, virtual machine, and cloud customer levels within a cloud environment","expth":"The hypervisor level, as a backend cloud infrastructure component, is not a unit where limits may be applied to control resource utilization. Limits can be placed at the service, virtual machine, and cloud customer levels within a cloud environment"},{"id":511,"topic":1,"q":"Which of the following is the dominant driver behind the regulations to which a system or application must adhere?","qth":"Which of the following is the dominant driver behind the regulations to which a system or application must adhere?","a":["Data source","Locality","Contract","SLA"],"ath":["Data source","Locality","Contract","SLA"],"ans":"B","exp":"The locality-or physical location and jurisdiction where the system or data resides~is the dominant driver of regulations. This may be based on the type of data contained within the application or the way in which the data is used. The contract and SLA both articulate requirements for regulatory compliance and the responsibilities for the cloud provider and cloud customer, but neither artifact defines the actual requirements. Instead, the contract and SLA merely form the official documentation between the cloud provider and cloud customer. The source of the data may place contractual requirements or best practice guidelines on its usage, but ultimately jurisdiction has legal force and greater authority","expth":"The locality-or physical location and jurisdiction where the system or data resides~is the dominant driver of regulations. This may be based on the type of data contained within the application or the way in which the data is used. The contract and SLA both articulate requirements for regulatory compliance and the responsibilities for the cloud provider and cloud customer, but neither artifact defines the actual requirements. Instead, the contract and SLA merely form the official documentation between the cloud provider and cloud customer. The source of the data may place contractual requirements or best practice guidelines on its usage, but ultimately jurisdiction has legal force and greater authority"},{"id":512,"topic":1,"q":"When using a SaaS solution, what is the capability provided to the customer?","qth":"When using a SaaS solution, what is the capability provided to the customer?","a":["To use the provider's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings","To use the consumer's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings","To use the consumer's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings","To use the provider's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings"],"ath":["To use the provider's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings","To use the consumer's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings","To use the consumer's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings","To use the provider's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (for example, web-based email), of a program interface. The consumer does not manage or control the underlying cloud infrastructure, including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user specific application configuration settings"],"ans":"D","exp":"According to 1€The NIST Definition of Cloud Computing,a€ in SaaS, 1€The capability provided to the consumer is to use the provider's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (e.9., web-based e mail), or a program interface. The consumer does not manage or control the underlying cloud infrastructure including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings.2€","expth":"According to 1€The NIST Definition of Cloud Computing,a€ in SaaS, 1€The capability provided to the consumer is to use the provider's applications running on a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser (e.9., web-based e mail), or a program interface. The consumer does not manage or control the underlying cloud infrastructure including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings.2€"}];
const LETTERS = ["A","B","C","D"];
const storeKey = "ccsp-quiz-progress-v2";

    subtitle:"English / Thai study mode · unofficial question bank",
    q:"Question", score:"Score", ans:"Answered", acc:"Accuracy", tr:"Translated",

  th: {

    subtitle:"โหมดเรียน ไทย / อังกฤษ · คลังข้อสอบไม่เป็นทางการ",
    q:"ข้อ", score:"คะแนน", ans:"ตอบแล้ว", acc:"ความแม่นยำ", tr:"แปลแล้ว",
    flagOn:"★ ติดธงแล้ว", flagOff:"☆ ติดธง",
    prev:"← ข้อก่อน", next:"ข้อถัดไป →",
    jump:"ข้ามไปยังข้อ",
    expl:"คำอธิบาย",
    correct:"ถูกต้อง", incorrect:"ยังไม่ถูก",
    sugg:"คำตอบที่แนะนำ",
    noexp:"ยังไม่มีคำอธิบายสำหรับข้อนี้",
    noq:"ไม่พบข้อสอบตามตัวกรองนี้",
    missing:"กำลังทยอยแปลข้อนี้เป็นภาษาไทย",
    shuffle:"สุ่มข้อ", reset:"ล้างความคืบหน้า", examOff:"โหมดสอบ: ปิด", examOn:"โหมดสอบ: เปิด",
    keys:"คีย์: A–D เลือก · N ข้อถัดไป · P ข้อก่อน · F ติดธง · T สลับภาษา",
    disc:"ชุดฝึกไม่เป็นทางการ มีสลับภาษาไทย–อังกฤษเพื่อการเรียน คำแปลทำเป็นชุดและอาจไม่สมบูรณ์ โปรดยึดคำศัพท์ทางการของ CCSP และตรวจสอบกับ CBK ของ ISC²"
  }
};

let lang = localStorage.getItem("ccsp-lang") || "both"; // en | th | both
let order = BANK.map((_,i)=>i);
let idx = 0;
let examMode = false;
const state = loadState();

function loadState(){
  try{ return Object.assign({answers:{},flags:{}}, JSON.parse(localStorage.getItem(storeKey)||"{}")); }
  catch(e){ return {answers:{},flags:{}}; }
}
function saveState(){ localStorage.setItem(storeKey, JSON.stringify(state)); }

function ui(){ return lang==="th" ? UI.th : UI.en; }

function applyChrome(){
  const u = ui();
  document.getElementById("title").textContent = u.title;
  document.getElementById("subtitle").textContent = u.subtitle;
  document.getElementById("lblQ").textContent = u.q;
  document.getElementById("lblScore").textContent = u.score;
  document.getElementById("lblAns").textContent = u.ans;
  document.getElementById("lblAcc").textContent = u.acc;
  document.getElementById("lblTr").textContent = u.tr;
  document.getElementById("prevBtn").textContent = u.prev;
  document.getElementById("nextBtn").textContent = u.next;
  document.getElementById("jumpH").textContent = u.jump;
  document.getElementById("exph").textContent = u.expl;
  document.getElementById("keys").textContent = u.keys;
  document.getElementById("shuffleBtn").textContent = u.shuffle;
  document.getElementById("resetBtn").textContent = u.reset;
  document.getElementById("examBtn").textContent = examMode ? u.examOn : u.examOff;
  document.getElementById("disc").textContent = u.disc;
  document.getElementById("langEN").classList.toggle("on", lang==="en");
  document.getElementById("langTH").classList.toggle("on", lang==="th");
  document.getElementById("langBOTH").classList.toggle("on", lang==="both");
}

function currentList(){
  const q = (document.getElementById("search").value||"").toLowerCase().trim();
  const f = document.getElementById("filter").value;
  return order.filter(i=>{
    const item = BANK[i];
    const blob = (item.q+" "+item.qth+" "+item.a.join(" ")+" "+item.ath.join(" ")).toLowerCase();
    if(q && !blob.includes(q)) return false;
    const st = state.answers[item.id];
    const flagged = !!state.flags[item.id];
    const hasTh = !!(item.qth);
    if(f==="unseen" && st) return false;
    if(f==="flagged" && !flagged) return false;
    if(f==="wrong" && !(st && st.pick!==item.ans)) return false;
    if(f==="right" && !(st && st.pick===item.ans)) return false;
    if(f==="thai" && !hasTh) return false;
    return true;
  });
}

function showEN(){ return lang==="en" || lang==="both"; }
function showTH(){ return lang==="th" || lang==="both"; }

function render(){
  applyChrome();
  const list = currentList();
  const u = ui();
  if(!list.length){
    document.getElementById("qtext").textContent = u.noq;
    document.getElementById("qth").textContent = "";
    document.getElementById("opts").innerHTML = "";
    document.getElementById("explain").classList.remove("show");
    return;
  }
  if(!list.includes(idx)) idx = list[0];
  const item = BANK[idx];
  document.getElementById("pos").textContent = list.indexOf(idx)+1;
  document.getElementById("total").textContent = list.length;
  document.getElementById("qid").textContent = "Q"+item.id+" · Topic "+(item.topic||1);
  document.getElementById("flagBtn").textContent = state.flags[item.id] ? u.flagOn : u.flagOff;

  const qEl = document.getElementById("qtext");
  const qthEl = document.getElementById("qth");
  if(lang==="th"){
    qEl.textContent = item.qth || item.q;
    qthEl.textContent = item.qth ? "" : u.missing;
  } else if(lang==="en"){
    qEl.textContent = item.q;
    qthEl.textContent = "";
  } else {
    qEl.textContent = item.q;
    qthEl.textContent = item.qth || u.missing;
  }

  const answered = state.answers[item.id];
  const opts = document.getElementById("opts");
  opts.innerHTML = "";
  LETTERS.forEach((L,i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    if(answered && answered.pick===L) b.classList.add("selected");
    if(answered){
      if(L===item.ans) b.classList.add("correct");
      else if(answered.pick===L && L!==item.ans) b.classList.add("wrong");
    }
    const en = item.a[i] || "";
    const tht = item.ath[i] || "";
    let body = "";
    if(lang==="th"){
      body = '<span class="en">'+(escapeHtml(tht || en))+'</span>' +
             (tht? "" : '<span class="th">'+escapeHtml(en)+'</span>');
    } else if(lang==="en"){
      body = '<span class="en">'+escapeHtml(en)+'</span>';
    } else {
      body = '<span class="en">'+escapeHtml(en)+'</span>' +
             (tht? '<span class="th">'+escapeHtml(tht)+'</span>' : '<span class="th">'+escapeHtml(u.missing)+'</span>');
    }
    b.innerHTML = '<span class="letter">'+L+'</span><span class="optbody">'+body+'</span>';
    b.addEventListener("click", ()=>choose(L));
    opts.appendChild(b);
  });

  const expl = document.getElementById("explain");
  if(answered){
    expl.classList.add("show");
    const ok = answered.pick===item.ans;
    let expHtml = "<p><b>"+(ok?u.correct:u.incorrect)+".</b> "+u.sugg+": <b>"+item.ans+"</b></p>";
    if(showEN()) expHtml += "<p>"+escapeHtml(item.exp || u.noexp)+"</p>";
    if(showTH()) expHtml += "<p style='color:var(--th)'>"+escapeHtml(item.expth || (item.exp?u.missing:u.noexp))+"</p>";
    document.getElementById("expbody").innerHTML = expHtml;
  } else {
    expl.classList.remove("show");
  }
  updateStats();
  renderGrid(list);
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function choose(letter){
  state.answers[BANK[idx].id] = {pick:letter};
  saveState(); render();
}
function updateStats(){
  let right=0, done=0, tr=0;
  BANK.forEach(item=>{
    const st = state.answers[item.id];
    if(st){ done++; if(st.pick===item.ans) right++; }
    if(item.qth) tr++;
  });
  document.getElementById("score").textContent = right;
  document.getElementById("answered").textContent = done+"/"+BANK.length;
  document.getElementById("acc").textContent = done? Math.round(right/done*100)+"%" : "—";
  document.getElementById("trcount").textContent = tr+"/"+BANK.length;
  document.getElementById("bar").style.width = (done/BANK.length*100)+"%";
}
function renderGrid(list){
  const g = document.getElementById("grid");
  g.innerHTML = "";
  list.forEach(i=>{
    const item = BANK[i];
    const b = document.createElement("button");
    b.className = "gbtn";
    b.textContent = item.id;
    if(i===idx) b.classList.add("cur");
    const st = state.answers[item.id];
    if(st) b.classList.add(st.pick===item.ans?"ok":"no");
    if(state.flags[item.id]) b.classList.add("flag");
    b.addEventListener("click", ()=>{ idx=i; render(); window.scrollTo({top:0,behavior:"smooth"}); });
    g.appendChild(b);
  });
}
function next(){
  const list = currentList();
  const p = list.indexOf(idx);
  if(p>=0 && p<list.length-1) idx = list[p+1];
  render();
}
function prev(){
  const list = currentList();
  const p = list.indexOf(idx);
  if(p>0) idx = list[p-1];
  render();
}
function cycleLang(){
  lang = lang==="en" ? "th" : lang==="th" ? "both" : "en";
  localStorage.setItem("ccsp-lang", lang);
  render();
}

document.getElementById("nextBtn").onclick = next;
document.getElementById("prevBtn").onclick = prev;
document.getElementById("flagBtn").onclick = ()=>{
  const id = BANK[idx].id;
  state.flags[id] = !state.flags[id];
  saveState(); render();
};
document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", ()=>{
  const list = currentList();
  if(list.length) idx = list[0];
  render();
});
document.getElementById("shuffleBtn").onclick = ()=>{
  order = BANK.map((_,i)=>i).sort(()=>Math.random()-0.5);
  idx = order[0]; render();
};
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm(lang==="th" ? "ล้างคำตอบและธงทั้งหมด?" : "Clear all answers and flags?")){
    state.answers={}; state.flags={}; saveState(); render();
  }
};
document.getElementById("examBtn").onclick = function(){
  examMode = !examMode; render();
};
document.getElementById("langEN").onclick = ()=>{ lang="en"; localStorage.setItem("ccsp-lang", lang); render(); };
document.getElementById("langTH").onclick = ()=>{ lang="th"; localStorage.setItem("ccsp-lang", lang); render(); };
document.getElementById("langBOTH").onclick = ()=>{ lang="both"; localStorage.setItem("ccsp-lang", lang); render(); };
document.addEventListener("keydown", e=>{
  if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  const k = e.key.toUpperCase();
  if("ABCD".includes(k)) choose(k);
  if(k==="N" || e.key==="ArrowRight") next();
  if(k==="P" || e.key==="ArrowLeft") prev();
  if(k==="F") document.getElementById("flagBtn").click();
  if(k==="T") cycleLang();
});

idx = order[0];
render();
</script>
</body>
</html>
